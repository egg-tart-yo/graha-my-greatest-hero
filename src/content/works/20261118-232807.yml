  - body: |-
      　　「絕對不可能。」光在心裡斬釘截鐵地對自己說。
      　　
      　　早在成為拯救世界的英雄之前，光之戰士對自己的喜好一直都有鋼鐵般的認知──女孩子最棒了，無論是溫柔又甜美的個性，還是直率與堅強的特質，不同的類型有著不同的魅力。哪一種都好，他可一點都不挑剔。
      　　
      　　至於古·拉哈·提亞？那是並肩作戰的可靠隊友、值得信賴的夥伴，頂多固執起來會變成需要順毛的紅髮大貓咪。然後……然後就是耳朵抖動的時候有點可愛，搖晃著的尾巴在寒冷的地方會特別讓人想摸，亮晶晶的眼神看過來的時候，會沒辦法拒絕他的任何請求罷了。
      　　
      　　所以，當拂曉其他人用意味深長的眼神打量他們，甚至指出兩人的距離「特別不一般」時，光也只是與古·拉哈·提亞對看一眼，隨後偏過頭，腦袋上冒出一個大大的問號。
      　　
      　　平日裡絕頂聰明的夥伴絕對是誤會了什麼。在光看來，拂曉裡習慣出雙入對的人，又不是只有他們兩個。
      　　
      　　覺得坦坦蕩蕩、毫無顧忌的英雄，依然故我地抓著古·拉哈·提亞的手腕朝房間走去。關上房門、隔絕了外頭夥伴們的調侃後，用一如往常的期盼眼神望著跟在身後的貓魅。
      　　
      　　從不曉得什麼時候開始，光總習慣聽著古·拉哈·提亞聲音而入睡。
      　　
      　　長時間的戰鬥總會令人繃緊神經。偶然間，光發現貓魅的嗓音無論是唸故事還是唱歌，都有種神奇的魔力，能讓拉滿弓弦般的神經徹底放鬆下來。
      　　
      　　即使沒有歌詞，只是單純輕哼著給孩童們的旋律，也依然有安撫心靈的力量。
      　　
      　　古·拉哈·提亞無奈又縱容地笑了笑，依言坐上床邊。光見狀，也熟門熟路地爬上床，自然地側躺下來，把頭枕在貓魅併攏的大腿上，調整了一個最舒服的角度。
      　　
      　　不同於平常冒險時的厚重裝備，在私下休息的時候，古·拉哈·提亞總是換上柔軟單薄的長褲。隔著薄薄的布料，能清晰感受到對方的溫暖體溫，而那條毛茸茸的紅尾也十分自然地，像是哄小孩入睡一樣輕輕捲上光的腰際，尾尖順著節奏緩慢地輕拍著。
      　　
      　　低沉柔和的哼唱聲在安靜的房間裡緩緩流淌。
      　　
      　　胸腔傳來的細微震動讓人昏昏欲睡。然而，輕哼著旋律的古·拉哈·提亞在唱到一個段落時，卻突然停了下來。隨後，那溫潤的嗓音再次響起，這次卻用高亢的聲線，吟唱著極盡溫柔的歌詞。
      　　
      　　原本聽得迷迷糊糊、意識幾乎要沉入夢鄉的光，在半夢半醒之間，忽然聽見頭頂上的貓魅這麼唱道。
      　　
      　　「能和你相遇、像現在這樣待在身邊……」
      　　
      　　「簡直像奇蹟一樣。」
      　　
      　　嗓音間的輕顫，讓光的睡意瞬間煙消雲散。
      　　
      　　他倏地睜開雙眼、仰頭望去，這才發現古·拉哈·提亞也正低頭看著他。
      　　
      　　床頭燭台的暖光下，貓魅的雙頰染著一層淡淡的薄紅，那雙紅寶石般的眼眸裡依然盛滿了光最熟悉的憧憬，但在垂落著赤紅瀏海陰影下，眼底深處似乎還藏著那麼一點……隱忍著的情緒。
      　　
      　　光的心跳猛地漏了一拍，一股莫名的慌亂湧上心頭，他下意識伸出手，有些局促地問他怎麼了。
      　　
      　　古·拉哈·提亞沒有立刻回答，而是伸手牽過光抬起的手，將那隻帶著薄繭的手掌輕輕貼在自己的臉頰上。
      　　
      　　他不顧光驚訝的眼神，主動把臉埋進光的掌心裡，像隻依戀主人的貓咪一樣，用發熱的臉頰很慢很慢地蹭了蹭。柔軟的髮絲在指節上浮動，力道雖然輕柔，卻讓撓人的麻癢至此開始向外擴散。
      　　
      　　最後，貓魅側過頭，溫熱而柔軟的唇瓣似乎就這麼輕輕擦過他的掌心。
      　　
      　　「拉、拉哈……剛才的歌，唱的是……」被這麼對待，問出口的話語都失了從容。光艱難地發現自己的聲線乾澀得不像話，只覺得一股熱氣直衝頭頂，整張臉從耳根開始不受控制地脹紅起來。

      　　胸口彷彿湧出不知名的悸動，撞得他又酸又脹。
      　　
      　　古·拉哈·提亞只是靜靜地望著他，唇角勾起一抹無奈的輕笑。
      　　
      　　「沒辦法，因為英雄似乎……完全沒有意識到呢。」他輕輕地嘆了口氣，「明明已經說過我的願望，也做了那麼多約定……」
      　　
      　　約定？
      　　
      　　光怔了怔，腦海裡依言閃過古·拉哈·提亞曾經對他說過的無數句話語──那些關於未來的期許、「無論你在哪裡，我都會與你同在」的誓言、還有他們曾一起許下的種種約定。
      　　
      　　那些話……怎麼了……？
      　　
      　　就在光停留在震驚與自我懷疑中時，古·拉哈·提亞明亮的紅眼再次注視著光。垂下的睫毛裡所透出的眼神，這一回，他終於讀懂了。
      　　
      　　自己的倒影，浸泡在濃烈的、名為眷戀的情緒中。
      　　
      　　在光徹底僵住的目光下，古·拉哈·提亞握著他的手，再次開口輕唱了起來，每一個字都像是直接敲擊在光的心尖上。
      　　
      　　無論經過多久，我都會如此堅信──
      　　
      　　You're my dearest。
      　　
      　　不知何時早已纏上腰間的貓尾，停在上身衣物因動作而露出的間隙邊，尖端輕輕地摩挲著光裸的腰際，隨後緩緩、一點點地鑽進衣物，撐起上衣一小塊凸起。
      　　
      　　原本對自己性向堅信不疑的英雄，就這麼撞進大貓咪溫柔又執著的視線。他緊張地吞了吞口水，顧不得發燙的臉到底多紅，慌亂的藍眼在古·拉哈·提亞的神情來回游移，試圖從那張平時總是帶著單純笑意的臉龐上，找出一絲自己誤會了什麼的線索。
      　　
      　　看著這樣的他，古·拉哈·提亞輕聲笑了出來，低沉的笑音震動著胸腔，連帶著光枕著的地方都傳來微麻的共鳴。
      　　
      　　「英雄，你現在的表情，簡直……」
      　　
      　　貓魅的另一隻手伸向下顎，微涼的指節緩緩向上抬，輕柔地托起光的臉龐，讓英雄的視線完全籠罩在自己背著光源的陰影下。
      　　
      　　「既然你一直都這麼沒有防備，甚至主動跑到我懷裡來……」
      　　
      　　停在衣擺裡的尾尖猛然鑽進衣內，同一時間，背著光源的貓瞳開始向外擴張，「那麼，稍微做些過分點的事情，也是可以的吧？」
