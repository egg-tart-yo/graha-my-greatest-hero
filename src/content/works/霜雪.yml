  - body: |-
      　　入秋之後，庫爾札斯的風已經有了冬日的寒意。
      　　
      　　他們在外紮營，傍晚時天色還算晴朗，入夜後卻忽然飄起了細雪。光回到營地時，肩甲與手套上都覆了一層薄薄的霜，金屬冷得幾乎黏住皮膚。
      　　
      　　他費了點力氣才把手套脫下來，露出的指尖已經凍得泛白。
      　　
      　　「英雄，你的手……」
      　　
      　　古·拉哈·提亞才看了一眼，眉頭便皺了起來。
      　　
      　　光還沒來得及說什麼，手腕就先被抓住，古·拉哈·提亞十分自然地將他的手拉了過去，先用同樣被凍得發紅的臉頰貼了貼，隨後垂頭思考了會，最後將光的手塞進自己圍巾內側。
      　　
      　　冰冷的指尖碰上頸側的瞬間，他明顯縮了一下肩膀，耳尖也跟著顫了顫，可儘管如此，他依然將那隻凍得發僵的手又往自己頸間攏近一些。
      　　
      　　「先暖一暖。」他低聲說，「放久了真的會凍傷。」
      　　
      　　光怔了怔。
      　　
      　　掌下的溫度透過皮膚一點點傳過來，和庫爾札斯冰冷的夜風相比，幾乎暖得不可思議。
      　　
      　　「拉哈，你真的好暖。」
      　　
      　　光動了動因溫度恢復而重新靈活的手指，直白的感想就這麼脫口而出，而古·拉哈·提亞渾身輕輕一顫，耳尖迅速紅了起來。
      　　
      　　可惜光似乎完全沒注意到。
      　　
      　　抱著馬克杯、啜飲著熱可可的阿莉塞拖著腮，忍不住出聲調侃。
      　　
      　　「嗯──真好，我也想有人幫我暖暖手。」
      　　
      　　「不是有熱可可了嗎？」
      　　
      　　「你不懂啦。」
      　　
      　　無緣無故挨罵的阿爾菲諾眨了眨眼，似乎摸不著頭緒，但他還是脫下手套，朝妹妹伸出雙手。
      　　
      　　「如果你會冷的話，我也──」
      　　
      　　「唉，就說你不懂……」少女一邊嘆氣，一邊誇張地搖著頭，「這種事情真要做呢……要不就是家人，要不就是戀人……」
      　　
      　　她抬起下巴，意有所指地朝英雄與貓魅的方向點了點。
      　　
      　　「就不曉得那兩位現在是哪一種關係呢。」
      　　
      　　而身為當事人之一的光，完全沒發現身旁的人已經徹底垂下了頭，只一本正經地回應著：「阿莉塞，不是你想得那樣，我們沒在一起。」
      　　
      　　「……也是可以考慮在一起。」
      　　
      　　細微得幾乎要被雪聲蓋過的聲音傳來。
      　　
      　　光愣了愣，回過頭去，才發現古·拉哈·提亞整張臉已經紅得像要燒起來。那雙紅眸藏在髮絲後，小心翼翼又帶著試探地看著他，攏著光雙手的手指下意識收得更緊，指尖甚至微微發顫。
      　　
      　　「……什麼？」
      　　
      　　「我、我是說，我們也可以考慮在一起。」古·拉哈·提亞像是用盡了所有勇氣，耳尖紅透得快要滴出血來，卻還是直直地望著他，「如果你不反對的話。」
      　　
      　　旁邊的阿莉塞一口熱可可差點嗆出來，隨即滿臉看好戲的表情，阿爾菲諾則是睜大了眼睛，伸在半空的手徹底僵住。
      　　
      　　桑克瑞德與尤里安傑對看了一眼，不急不徐地從背包裡翻出了煙火，一手握著尾端的引線、蓄勢待發。
      　　
      　　營火劈啪作響，風雪彷彿在這一刻全部靜止。光臉上的神情很明顯徹底失神，他張了張嘴，平時冒險的俐落反應全數被從脖頸湧上的熱度淹沒，一路燒上了臉頰。
      　　
      　　啊，突然沒這麼冷了。內心居然還這麼想著。
      　　
      　　「拉……拉哈，你是說……我們嗎……？」
      　　
      　　青年很認真地望向光，用力地點了點頭。
      　　
      　　「嗯。」
      　　
      　　「欸？」
