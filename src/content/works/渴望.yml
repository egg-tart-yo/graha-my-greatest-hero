  - title: 主篇
    body: |-
      　　光托著腮，整個人沒什麼精神地趴在桌邊。
      　　
      　　窗外天色正好，風從半開的窗縫裡鑽進來，吹得桌上的紙張輕輕翻動。今天沒有什麼棘手的委託，也沒有毀滅世界的危機，一切和平得令人安心。
      　　
      　　但英雄還是一副悶悶不樂的模樣。
      　　
      　　就在前幾天，他和古·拉哈·提亞正式開始交往。
      　　
      　　聽見光直接的告白，古·拉哈·提亞足足愣了好幾秒，耳朵一下子豎得筆直，隨後那雙赤色的眼睛亮得幾乎讓人不敢直視。
      　　
      　　「你……是說真的嗎？」
      　　
      　　那副又驚又喜，彷彿一瞬間得到了整個世界的模樣，光直到現在都還歷歷在目。
      　　
      　　「當然是真的。」
      　　
      　　古·拉哈·提亞像是仍有些不敢相信，又再三向他確認了幾次。直到確定自己沒有聽錯，那份欣喜才終於毫無保留地浮上臉龐，帶著滿足而珍重的笑容，接受了他的心意。
      　　
      　　就連身後的尾巴都藏不住情緒，輕快地晃了好一陣子。
      　　
      　　光原本以為，從那一天開始，他們之間多少會有些不一樣。
      　　
      　　結果居然完全沒有。
      　　
      　　古·拉哈·提亞依舊會跟著他去任何想去的地方。
      　　
      　　想看風景，就陪他翻山越嶺；想去吃東西，就認真查好路線；哪怕光某一天突發奇想，拉著他跑到遙遠的港口，只為了等一場日落，古·拉哈·提亞也只會笑著跟上他，甚至比光本人還期待。
      　　
      　　只要是光想做的事情，他似乎永遠都樂意奉陪。
      　　
      　　可是情侶之間那些……稍微親暱一點的事，幾乎一點都沒有。
      　　
      　　睡前偶爾會抱一下、再親一下，僅此而已。
      　　
      　　而且還真的是「一下」。
      　　
      　　嘴唇輕輕碰上來，溫柔得不像親吻，倒像某種珍而重之的祝福，點到為止、不帶任何情慾。
      　　
      　　僅僅如此，古·拉哈·提亞就會笑得非常滿足。
      　　
      　　居然這樣就滿足？怎麼可以這樣就滿足？
      　　
      　　光想到這裡，額頭直接抵在桌面上。
      　　
      　　他當然知道，這不代表自己對古·拉哈·提亞不重要。
      　　
      　　關於這一點，這世上恐怕沒有人比他更清楚了。
      　　
      　　那個人曾經花費漫長得近乎殘酷的歲月，只為了尋找拯救他的可能，若說那份行動還不足以證明他的感情，光實在想不到還有什麼能證明。
      　　
      　　所以他從來沒有懷疑過古·拉哈·提亞的心意。
      　　
      　　問題是，他們好歹也是兩個正常成年人吧？
      　　
      　　喜歡彼此、交往了，晚上還睡在自己的懷裡，怎麼可能真的什麼念頭都沒有？
      　　
      　　偶爾光實在忍不住，會試探似地喊他。
      　　
      　　「拉哈。」
      　　
      　　然後不管古·拉哈·提亞原本正在做什麼，那雙耳朵都會微微一動，隨即轉頭看過來。
      　　
      　　「光？怎麼了？」
      　　
      　　眼睛清澈、表情溫柔，不帶半點雜念。
      　　
      　　每到這種時候，原本腦袋裡還想著一些亂七八糟東西的光，都會產生一種難以言喻的罪惡感。
      　　
      　　……搞得好像只有他思想很污濁一樣。
      　　
      　　光悶悶地把臉埋進手臂裡。
      　　
      　　
      　　*
      　　
      　　
      　　當晚回到房間以前，光深吸了口氣，在門口站了一會兒。
      　　
      　　他努力端正了一下鬱悶的思緒。
      　　
      　　不管怎麼說，他都不想因為自己這些奇怪的念頭，反過來影響古·拉哈·提亞。
      　　
      　　對方沒有那方面的需求也沒什麼不好。
      　　
      　　親密互動這種事情，本來就不該勉強。
      　　
      　　大不了……他自己再忍忍。
      　　
      　　光慢慢推開房門，一抬頭，就發現古·拉哈·提亞居然坐在裡面等他。
      　　
      　　「……拉哈？」
      　　
      　　看見光，古·拉哈·提亞立刻站起身，只是和平常迎接他的歡快模樣相比，那雙耳朵此刻略微往下垂著，尾巴也安靜地收在身後。
      　　
      　　看起來竟然有些不安。
      　　
      　　「怎麼了？」
      　　
      　　「我……有件事想問你。」
      　　
      　　古·拉哈·提亞遲疑了一下，雙手無意識地摩擦著。
      　　
      　　那副模樣實在太明顯，光甚至還沒聽見問題，就已經感覺到他有多緊張。
      　　
      　　「最近我們在一起的時候，我偶爾會覺得……你好像不太開心。」
      　　
      　　古·拉哈·提亞望著他，聲音放得很輕。
      　　
      　　「是我有什麼地方做得不好嗎？」
      　　
      　　光怔了怔。
      　　
      　　古·拉哈·提亞像是怕他誤會，又連忙補上一句。
      　　
      　　「如果有的話，你儘管跟我說，我會改進。」
      　　
      　　話說出口，耳朵垂得更低了，看著光的視線也小心翼翼。
      　　
      　　光看了他幾秒，忽然就明白了。
      　　
      　　眼前的貓魅大概已經自己胡思亂想了好幾天，甚至在內心推估著各種可能──是不是光後悔告白了，是不是發現真正交往之後沒有想像中那麼好，又或者下一句話，他就會說乾脆算了。
      　　
      　　想到這裡，光瞬間感到有點自責。沒想到自己還是沒把控好這些情緒，連帶讓古·拉哈·提亞也跟著感到不安。
      　　
      　　他索性不回答，只是走過去，伸手捧住古·拉哈·提亞的臉。
      　　
      　　古·拉哈·提亞明顯緊張地縮了縮。
      　　
      　　下一刻，光直接吻了上去，與睡前那種輕輕碰一下的吻不同，而是結結實實地貼住他的唇。
      　　
      　　古·拉哈·提亞睜大眼睛，耳朵瞬間豎了起來。
      　　
      　　片刻間，他便慢慢閉上眼，順從地回吻。力道又輕又溫柔，帶著他一貫的小心珍惜。
      　　
      　　光沒忍住，舌尖抵上古·拉哈·提亞的唇縫。
      　　
      　　不理會眼前人輕輕一震的身軀，光微微偏過頭，把那個過分端正的吻弄得濕了一點，舌尖探進去時，甚至能感覺到古·拉哈·提亞連呼吸都停了一瞬。
      　　
      　　口中的柔軟交互碰觸時，貓耳狠狠顫了一下。
      　　
      　　光幾乎能感覺到他腦袋裡一片空白。
      　　
      　　於是乾脆伸手攬住古·拉哈·提亞的脖子，帶著他往後倒。
      　　
      　　床墊重重往下一陷。
      　　
      　　古·拉哈·提亞下意識撐住身體，才沒真的整個壓到光身上。
      　　
      　　兩人的距離一下子變得很近，近得光能看清他微微睜大的眼睛，也能看見那張臉從臉頰開始，熱度一點點地暈開。
      　　
      　　古·拉哈·提亞雙手撐在光的身側，身體背著光源，像是完全摸不著頭緒。
      　　
      　　「光……？」
      　　
      　　光看了他一會兒，感到有些好笑。
      　　
      　　都這麼明顯了，居然還不明白。
      　　
      　　他伸出手指，勾住古·拉哈·提亞胸前的衣料。
      　　
      　　「我問你，你為什麼都不會想要我？」
      　　
      　　古·拉哈·提亞一開始還沒明白，在想清楚光的問題後，他瞬間僵住。
      　　
      　　似乎這個問題超出他所有預想的可能，整張臉瞬間脹紅，口中支支吾吾了半天，也沒組織好一句像樣的話。
      　　
      　　光很努力地聽，只聽見什麼「不是不想」或是「沒想到」之類的片段。
      　　
      　　他只能將雙手枕在腦後，放任慌亂的貓魅自我掙扎了很久，清澈過頭的眼睛才終於狼狽地看向他。
      　　
      　　古·拉哈·提亞垂著耳朵，聲音也跟著低了下來。
      　　
      　　「不是你的問題……」他囁嚅著，像是在斟酌該怎麼把心裡的話說清楚，「只是現在的我，每天睜開眼睛都能看見你在身邊，能和你一起冒險、一起訓練。到了晚上，就算閉上眼睛，也不用再害怕這一切只是一場夢。」
      　　
      　　「不是回憶裡的你，也不是書裡被傳頌的英雄。」
      　　
      　　他抬起眼，安靜地看著光。
      　　
      　　「是真正的你，好好地活著，在我伸手就能觸碰到的地方。」
      　　
      　　「光是這樣……我就已經很滿足了。」　　
      　　
      　　光看著那雙又乾淨又溫柔的眼睛，又看了看他嘴角知足的笑容，胸口一下子又酸又軟。
      　　
      　　這人對自己的感情純粹到近乎神聖，害他覺得自己的腦袋裡裝的東西簡直不堪入目。
      　　
      　　光抿了抿嘴，最後扁著嘴，小聲說：「可是我快憋死了。」
      　　
      　　「……憋、憋死？」
      　　
      　　古·拉哈·提亞愣住。
      　　
      　　光把臉轉開，也不打算有所保留。
      　　
      　　反正都這樣了，不如把話說開。
      　　
      　　「我會想被你親、被你擁抱，還有更多更貼近的事。」
      　　
      　　「但是親跟抱的話，我們平常不也是──」
      　　
      　　「不是剛剛那種。」
      　　
      　　光仰躺著，伸手拍了拍他身下的床墊。
      　　
      　　「是在這裡的那種。」
      　　
      　　古·拉哈·提亞的臉已經紅得不成樣子。
      　　
      　　光看他發怔的模樣，也不曉得他到底聽懂沒，乾脆又舉起雙手，一手比出圈的手勢，另一手伸出手指，探入圈圈的中央。
      　　
      　　這下古·拉哈·提亞徹底失去聲音，身後的尾巴甚至猛地炸了開來，他急急忙忙地低下身，把光整個抱進懷裡。
      　　
      　　「我懂了我懂了……你不要再繼續了……」
      　　
      　　「真的？」
      　　
      　　古·拉哈·提亞抱得很緊，柔軟的頭髮蹭過光的頸側，互相貼著的臉龐甚至在發燙。
      　　
      　　「這些……我可以學。」
      　　
      　　光一怔。
      　　
      　　古·拉哈·提亞的聲音悶悶地從他頸邊傳來。
      　　
      　　「我不太明白該怎麼做才好，但我會想辦法。」
      　　
      　　停頓了一下，他又更小聲地補充。
      　　
      　　「只要你不要因此覺得我很無趣，然後不要我了就好。」
      　　
      　　光原本還帶著笑意的眼神微微沉下來。
      　　
      　　他抬手摸了摸古·拉哈·提亞的後腦。
      　　
      　　「我不會不要你。」
      　　
      　　古·拉哈·提亞安靜了一會兒。
      　　
      　　「真的？」
      　　
      　　「以十二神起誓。」
      　　
      　　光揉了一下他的耳根。
      　　
      　　「不准亂想。」
      　　
      　　耳朵在掌心裡動了一下。
      　　
      　　「……好。」
      　　
      　　光嘆了口氣。
      　　
      　　「那先從親吻開始。」
      　　
      　　古·拉哈·提亞稍微抬起頭，兩人對視片刻。
      　　
      　　接著，他低下頭，在光唇上輕輕親了一下。
      　　
      　　「這樣？」
      　　
      　　「……」
      　　
      　　光的臉上毫無表情、近乎冷淡地看著他。
      　　
      　　古·拉哈·提亞眨了眨眼。
      　　
      　　下一秒，光直接勾住他的脖子，把人重新拉了下來。
      　　
      　　嘴唇再次貼上的瞬間，古·拉哈·提亞發出一聲很輕的悶哼。
      　　
      　　光熟門熟路地撬開他的唇，探進去的舌尖毫不客氣地纏上裡頭的柔軟。
      　　
      　　這一次古·拉哈·提亞沒有像剛才那樣整個僵住，只是手指一下抓緊了床單。
      　　
      　　光能感受到他呼吸卻明顯亂了幾拍，索性慢慢地親他，讓他自己感受。
      　　
      　　沒多久，能感覺到古·拉哈·提亞生澀地試著回應。
      　　
      　　雖然有些笨拙，卻也因為太認真，反而讓那個吻變得格外纏綿。
      　　
      　　等光終於稍微退開，連他自己的呼吸都比平常再快了許多。
      　　
      　　古·拉哈·提亞的臉紅得厲害，嘴唇跟眼神也比剛才濕潤。
      　　
      　　光心情很好地盯著看了幾秒。
      　　
      　　「這樣才叫親。」
      　　
      　　古·拉哈·提亞喘了一口氣，低聲應道：「……我知道了。」
      　　
      　　光忍不住彎起嘴角，手指還勾著他的領口。
      　　
      　　「就像這樣，有時候要再進去一點。」
      　　
      　　「……」
      　　
      　　光一臉若無其事。
      　　
      　　「上面也好。」
      　　
      　　古·拉哈·提亞的耳朵開始往後倒。
      　　
      　　光故意停了一下。
      　　
      　　「下面也──」
      　　
      　　「光！」
      　　
      　　古·拉哈·提亞整張臉瞬間紅透，光終於忍不住笑出聲。
      　　
      　　又羞又臊的貓將頭埋入他的肩窩，報復性地舔舐了一口，隨後咬了下去。
      　　
      　　「你、唔！」
      　　
      　　光渾身震了一下，脖頸的麻癢感過於陌生，卻不會感到疼痛。
      　　
      　　他抬起眼，發現貓魅正仔細地看著他的反應，紅色的眼睛望向光緊抓床單的手，細細地瞇起。
      　　
      　　「看來這樣的親……也可以。」
      　　
      　　他喃喃自語、一臉認真，只差沒拿起床頭的紙筆記錄下來。
      　　
      　　光的腦海裡瞬間警鈴大響。
      　　
      　　「等一下，今天說好從親開始──」
      　　
      　　不等他說完，古·拉哈·提亞再次俯下身，蓬鬆的頭髮輕輕蹭了蹭光的臉頰，熱氣呼在他的耳邊。
      　　
      　　「那你再多說一點。」
      　　
      　　他輕聲要求，光掙扎了會，最後妥協地嘆了口氣。
  - title: 拂曉視角的小後續
    body: |-
      　　雅·修朵拉端起茶杯，才剛抿了一口，便察覺角落有一道身影飛快地晃了過去。
      　　
      　　那人全身罩著一件寬大的斗篷，兜帽壓得極低，懷裡還抱著一大疊厚重的書，走路時幾乎連臉都看不見。明明只是從大廳的一側經過，腳步卻快得像生怕被誰發現似的，轉眼便鑽進了石之家的倉庫裡。
      　　
      　　雅·修朵拉端著茶杯，微微偏了偏頭。
      　　
      　　這副偷偷摸摸的模樣，實在很難不讓人在意。
      　　
      　　當然，斗篷對她來說並沒有太大的意義。
      　　
      　　她如今辨識一個人，本來就不是依靠普通的視線，而是透過乙太的流動與組成。就算那人特地把貓耳藏進兜帽裡，連尾巴也嚴嚴實實地罩在斗篷底下，在她眼中依舊沒有半點遮掩的效果。
      　　
      　　雅·修朵拉若有所思地望向倉庫。
      　　
      　　她有些好奇，究竟是什麼研究，能讓古·拉哈·提亞謹慎成這副模樣。
      　　
      　　於是她的注意力順勢往對方懷裡那疊書延伸了一些。
      　　
      　　人體構造、親密接觸時的生理反應、伴侶間肢體交流的……
      　　
      　　「哎呀。」
      　　
      　　雅·修朵拉忍不住輕輕笑了一聲。
      　　
      　　坐在不遠處的桑克瑞德抬起眼。
      　　
      　　「怎麼了？」
      　　
      　　「沒什麼。」
      　　
      　　雅·修朵拉若無其事地啜了一口茶。
      　　
      　　只是嘴角那點笑意，怎麼看都有些可疑。
      　　
      　　桑克瑞德狐疑地看了她一會兒，還沒來得及追問，大廳另一頭便傳來熟悉的聲音。
      　　
      　　「拉──哈──」
      　　
      　　尾音拖得老長。
      　　
      　　光從走廊那端探出頭來，左右張望了一圈。
      　　
      　　「拉哈？」
      　　
      　　沒有回應。
      　　
      　　光又往裡面走了幾步，視線掃過正在休息的眾人。
      　　
      　　「有人看到拉哈嗎？我看船班的時刻表，應該早就到了。」
      　　
      　　倉庫裡安靜得連一點聲響都沒有。
      　　
      　　雅·修朵拉放下茶杯，平靜地回應：「沒有。」
      　　
      　　她回答得十分自然。
      　　
      　　桑克瑞德聞言，下意識往倉庫方向瞥了一眼。
      　　
      　　方才那一閃而過的斗篷，他雖然沒看清楚臉，但拂曉裡會把自己包成那副模樣還不會絆手絆腳、鬼鬼祟祟抱著一大堆書、靈巧地像隻貓的人，選項似乎也沒有多到哪裡去。
      　　
      　　他挑了挑眉，卻也很識趣地沒有拆穿。
      　　
      　　「奇怪……」
      　　
      　　光搔了搔頭，咕噥道。
      　　
      　　「明明說只是去借幾本書，怎麼借到整個人都不見了。」
      　　
      　　倉庫裡依舊沒有聲音。
      　　
      　　只是雅·修朵拉清楚地「看見」，裡頭那團熟悉的乙太緊張地僵成了一球，又往倉庫的角落挪了挪，試圖降低自己被發現的機率。
      　　
      　　她嘴角的弧度又深了一點。
      　　
      　　這時，桑克瑞德忽然想起什麼。
      　　
      　　「對了，艾斯蒂尼安今天難得回來。」
      　　
      　　「嗯？」
      　　
      　　光立刻轉頭。
      　　
      　　「他剛才還在外面。你不是前幾天才說想找他練槍？」
      　　
      　　光的眼睛一下子亮了起來。
      　　
      　　「艾斯蒂尼安回來了？」
      　　
      　　「是啊。」
      　　
      　　桑克瑞德往門外一指。
      　　
      　　「現在去，說不定還逮得到人。」
      　　
      　　方才還一副懶洋洋的模樣，轉眼間便精神抖擻。
      　　
      　　光甚至沒再多問一句，提起武器就往外跑。
      　　
      　　「等等，你的盔甲──」
      　　
      　　阿爾菲諾才剛抬起手，人就已經不見了。
      　　
      　　門外很快傳來一串漸遠的腳步聲，大廳重新安靜下來。
      　　
      　　阿爾菲諾眨了眨眼，回想著光剛才的表情，終究還是有些在意。
      　　
      　　「剛才還懶洋洋的，是不是生病了？」
      　　
      　　桑克瑞德摸了摸下巴，最後一本正經地做出結論。
      　　
      　　「可能是貓魅不足吧。」
      　　
      　　雙胞胎同時轉頭看向他，眼神一個困惑一個懷疑。
      　　
      　　阿莉塞一臉莫名其妙。
      　　
      　　「真的有這種病？」
      　　
      　　面對她的視線，雅·修朵拉微微一笑。
      　　
      　　「對我們的大英雄而言，或許喔。」
