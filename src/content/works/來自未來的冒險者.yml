  - body: |-
      　　光是從樹上掉下來的。

      　　更準確地說，是走著走著，突然踩到某個不知名的漩渦，然後就被狠狠甩了出去，撞斷幾根細枝，再一路摔進樹下柔軟的草地。

      　　「……痛。」

      　　光趴在草地上安靜了幾秒，才慢吞吞地撐起身子。他伸手揉著摔得發疼的屁股，一邊皺著臉回想自己究竟做了什麼。

      　　剛才他明明還在水晶塔裡。

      　　難得閒下來，便隨意在塔內走走看看，一邊找尋那抹紅色的身影，結果經過一道平時沒什麼異樣的迴廊時，腳下忽然浮起了一圈扭曲的光。

      　　他甚至還沒來得及喊人，那東西便像張開嘴似的，一口將他吞了進去。

      　　然後一回神，就到達了這裡。

      　　光拍掉身上的草屑，站直身子，警戒地環顧四周。

      　　眼前並不是水晶塔內熟悉的景象，而是一片整理得十分整齊的草地。方才接住他的樹木隨著風輕輕晃動，再往外一些，則能看見頗具規模的白色石造建築。

      　　他覺得街景十分眼熟，建築物的風格像是在田園郡看過。

      　　不過……

      　　似乎有人被他嚇得不輕。

      　　光的視線慢慢移向樹木另一側。

      　　那裡站著一名貓魅族的男孩。

      　　他手裡抱著一本厚重的書，整個人僵在原地，一雙大耳朵幾乎完全壓平在髮間，身後的短尾巴更是炸得蓬蓬鬆鬆，比原本足足大了一倍。

      　　他睜大眼睛，正一動也不動地盯著光。
      　　
      　　大概是方才親眼看見一個人毫無預兆地從樹上掉下來，還沒能判斷眼前究竟發生了什麼。

      　　兩人就這麼互相看了片刻。

      　　最後，還是男孩先遲疑著往前走了幾步。

      　　「那個……」

      　　他青澀的聲音有些小心。

      　　「你還好嗎？」

      　　光原本正準備回答，卻在看清男孩面容的瞬間怔住了。

      　　那是一張比記憶中稚嫩太多的臉。

      　　臉頰還帶著年幼貓魅特有的柔軟輪廓，身形也尚未完全長開，抱著書站在那裡時，甚至顯得有些單薄。就連那頭紅髮，也不像如今那般俐落成熟，而是在腦後束起一小截短短的辮子。

      　　可是那雙異色的眼睛，光不會錯認。
      　　
      　　畢竟那雙眼睛，在自己的時代總是呈裝著光的倒影，帶著憧憬與依戀，坦率地一次次凝視著他。

      　　而男孩被他盯得有些困惑，方才緊張壓低的耳朵終於悄悄抬起了一點，微微動了動，接著又好奇地偏了偏頭。

      　　「你真的沒事嗎？」

      　　他停了一下，又忍不住看了看光身後的樹。

      　　「而且……你好像是突然出現的。」

      　　光沉默了一會兒。

      　　他大概知道，自己究竟被丟到哪裡來了。

      　　不是別的地方，是過去。

      　　而站在自己眼前的，是尚年幼的貓魅──古·拉哈·提亞。

      　　光看著男孩仍舊滿臉疑惑的模樣，最後還是將那些幾乎要脫口而出的話收了回去。

      　　「我是冒險者。」

      　　幾番思量下，他只這麼說。

      　　男孩愣愣地眨了眨眼。

      　　下一秒，那雙異色的眼睛幾乎整個亮了起來。

      　　「冒險者？」

      　　他振奮得連短短的尾巴都跟著抬高了一些。

      　　「是從外面來的嗎？」

      　　那反應實在太過直接。

      　　光看著他亮晶晶的眼睛，原本還因為莫名掉進過去而有些無奈的心情，也不知不覺放鬆了下來。

      　　他露出一抹微笑，「對。」

      　　貓魅的耳朵立刻興奮地抖了抖。

      　　「那你去過很多地方嗎？有看過很遠很遠的城市嗎？會遇到魔物吧？我聽說委託都會張貼在告示板上，各路英雄好手會一把撕掉告示、組團出發……還有遺跡呢？你有進過未知的遺跡嗎？那種地方是不是有很多機關，還有值得解析的古物──」

      　　問題一個接著一個。

      　　光甚至一句都來不及回答，下一句便已經跟著冒了出來。

      　　男孩抱著書、興奮地湊了過來，方才還被嚇得炸開的尾巴此刻早已恢復原狀，正隨著他的情緒一下下晃動。直到說了好一會兒，他才像是突然意識到自己的失態般脹紅著臉，尷尬地垂下頭。
      　　
      　　聲音戛然而止，耳朵也慢慢垂了下去。

      　　「……不好意思。」
      　　
      　　古·拉哈·提亞的手臂收緊了懷裡的書。

      　　「我……很少看見外面的人，太興奮了。」

      　　方才還滔滔不絕的男孩一下又變得十分有禮貌，甚至帶著幾分懊惱。
      　　
      　　光被他這副模樣逗笑了。
      　　
      　　「不會。」他忍不住走上前，將手搭上男孩的肩，「就是得對未知充滿熱情，才會成為一名優秀的冒險者。」

      　　古·拉哈·提亞抬起頭，眼裡是止不住的悸動。
      　　
      　　光看著他這副期盼的模樣，又想起某位賢人每回提及一同冒險的神情，眼底的笑意又更深了。
      　　
      　　「關於你剛剛說的那些，我倒還真有些經歷可以告訴你。」
      　　
      　　「真的嗎！」

      　　光想了一下，又補上一句。

      　　「不過有條件。」

      　　古·拉哈·提亞果然立刻露出認真的表情，貓尾在身後不斷晃動著，全神貫注地緊盯著眼前的光。

      　　「什麼條件？」

      　　「帶我去吃你最喜歡的漢堡。」

      　　空氣安靜了一瞬。

      　　古·拉哈·提亞愣愣地看著他。

      　　「……你怎麼知道我喜歡漢堡？」他困惑地說，「這是冒險者的能力之一嗎？」

      　　光差點沒忍住、笑得更明顯。

      　　那張臉實在太好懂了。

      　　驚訝、困惑，還帶著一點懷疑，全都明明白白寫在臉上。

      　　光沒有回答，只是伸出手。

      　　古·拉哈·提亞的耳朵動了一下，還沒反應過來，光的手指便已經碰到了他腦後束起的小辮子，輕輕撥了一下。

      　　「哇啊！」

      　　古·拉哈·提亞嚇得跳了起來，兩隻耳朵瞬間壓低，臉也一下紅了。

      　　他慌忙往後退了一步，一手護住腦後的頭髮，瞪著光看了半天，像是不知道該生氣還是該害羞。

      　　光努力忍住笑，朝他伸出手。

      　　「走吧。」

      　　古·拉哈·提亞的尾巴不自在地甩了甩。

      　　「……好奇怪的人。」

      　　話雖如此，他還是熬不過光誘人的邀請，沒經過多少思考就拉著他往前跑。

      　　光看著那道比記憶中矮小許多，卻靈動活潑的背影，嘴角始終沒有放下來。
      　　

      　　*
      　　
      　　
      　　古·拉哈·提亞帶他去的店不算大，但漢堡確實很好吃。

      　　男孩顯然對自己的選擇很有自信，看見光咬下第一口後露出訝異的神情時，連耳朵都跟著神氣地抬了起來，驕傲的模樣像是那漢堡是出於自己之手。

      　　「很好吃吧？」

      　　「嗯。」

      　　光點頭，在腦中分析著漢堡的調味，打算偷偷記起來，做給他尚在遙遠未來的貓魅享用。

      　　「看來你的眼光從小就不錯。」

      　　「從小？」

      　　古·拉哈·提亞疑惑地看他。

      　　「……沒什麼。」

      　　光若無其事地低頭又咬了一口。

      　　接下來的時間，大多是古·拉哈·提亞在問，光在回答。

      　　男孩想知道冒險者是怎麼接下委託、怎麼與魔物戰鬥，也想知道那些只存在於書本裡的古代遺跡，真正站在其中時究竟是什麼模樣。

      　　光說了很多。

      　　當然，有些事情不能說得太清楚。

      　　於是他避開那些可能暴露時代的名字，也避開所有與古·拉哈·提亞本人有關的故事，只挑了一些無傷大雅的冒險說給他聽。

      　　說自己曾在風雪裡跋涉、沙漠的夜晚比想像中寒冷，遠在世界盡頭的遺跡，深處藏著令人一輩子都忘不了的風景。

      　　還有同行的人、一路上幫助的人，一起並肩迎戰強敵的人。

      　　古·拉哈·提亞聽得幾乎忘了吃東西，手中的漢堡湯汁滴了滿盤，他卻完全無暇顧及。

      　　每當光說到危險的地方，他的耳朵便會不自覺壓低，在化險為夷的最後又會悄悄抬起來。

      　　而當光說到那些從沒見過的天空、城市與大地時，那雙異色的眼睛便會一點一點亮起來。

      　　直到窗外的日光逐漸變成橘紅，夕陽穿過窗戶，落在古·拉哈·提亞的臉上。

      　　光說到一半，忽然停了下來。

      　　他只是看著眼前的男孩。

      　　那雙眼睛明亮得不可思議，甚至比照進來的日暮還要明亮，裡頭承載著好奇、嚮往，也有某種尚未被這個男孩真正發覺的東西。

      　　光其實很熟悉那樣的眼神。

      　　很多很多年以後，他也曾在古·拉哈·提亞眼裡看過。

      　　只是那時候他沒有想到，原來這份憧憬早在這麼久以前，就已經存在了。

      　　「然後呢？」

      　　古·拉哈·提亞向前傾了一點。

      　　「和英雄並肩作戰的白龍，真的打贏黑龍了嗎？」

      　　光正要開口，一股熟悉的力量忽然纏上了他的身體。

      　　光愣了一下，下意識看向自己的手掌。
      　　
      　　這種感覺，雖然已經過去了很久，但他並沒有忘記。
      　　
      　　是那人正在召喚著自己。
      　　
      　　「……我大概得走了。」
      　　
      　　「這、這麼快……」
      　　
      　　光站起身，古·拉哈·提亞也慌忙跟著站了起來。

      　　他的耳朵明顯垂了一點，卻又很快像是覺得這樣太失禮似的重新抬起。

      　　「你……是要去下一個地方冒險了嗎？」

      　　光怔了怔，隨後爽朗地笑了出來。
      　　
      　　「沒錯。」

      　　男孩看著他，像是還有無邊無際的問題想問，可召喚術的力量已經越來越明顯，光的身影也開始被細碎的光芒包圍。

      　　古·拉哈·提亞低頭搓揉著手，過了一會兒，又重新抬起頭，臉上帶著彷彿即將許下誓言般的決絕。

      　　「那個……」

      　　「嗯？」

      　　「我以後……也想成為冒險者。」

      　　他的尾巴緊張地繃直了一瞬，臉上的紅不曉得是夕陽所致還是因為害羞的情緒，語氣卻依然十分堅定。

      　　「去很多地方，看很多東西。」
      　　
      　　異色的眼睛彷彿黑暗裡逐盞點亮的光，越來越明亮。

      　　「就像你一樣，成為某個人……某一些人眼裡最厲害的大英雄。」

      　　光安靜地看著他，胸口忽然湧起一種很難形容的情緒。
      　　
      　　啊啊，原來。
      　　
      　　這份決心，在這麼久以前……

      　　在視野即將模糊的最後，他終於忍不住伸出手，輕輕放在古·拉哈·提亞的頭上。

      　　「如果是你的話，一定可以的。」他笑著輕喚，「拉哈。」

      　　古·拉哈·提亞的眼睛倏地睜大。

      　　「為、為什麼你知道──」

      　　話才剛出口，眼前的人便已經被光芒徹底吞沒。
      　　

      　　*
      　　
      　　
      　　意識重新恢復時，耳邊先傳來的是急促的叫喚。

      　　「光！」

      　　光睜開眼睛。

      　　映入眼中的，是水晶塔內熟悉的天頂，以及一道匆匆朝自己走來的紅色身影。

      　　古·拉哈·提亞幾乎是在看見他睜眼的瞬間便放下了手裡的法杖。

      　　「太好了……」

      　　那口氣甚至還沒完全鬆下來，他便已經快步走到光的身旁。

      　　「你還好嗎？身體有沒有哪裡有異狀？」

      　　因為擔憂，語速比平時快了不少。

      　　「我剛剛怎麼都找不到你，後來才發現這附近殘留著不正常的時空傳送痕跡。我本來想循著痕跡把你召回來，可那股魔力太不穩定了，我還擔心──」

      　　他說到一半，忽然停住。

      　　因為光抬起了手，指尖輕輕碰上了他束在身後的辮子，幼稚地撥了一下。

      　　「……光？」

      　　貓魅賢人滿臉困惑。

      　　光滿腦子卻只有那隻被嚇得耳朵壓平、尾巴炸開的小貓，忍不住又笑出了聲。
      　　
      　　他伸長手臂，將困惑的古·拉哈·提亞擁入懷中，左右輕輕地搖晃著。
      　　
      　　「我沒事。」他愉快地說道，「只是從另一個冒險裡回來了。」
      　　
      　　「冒險……嗎？」
      　　
      　　悶在他胸口的聲音顯然更困惑了，光卻沒有解釋的打算。
      　　
      　　他放開懷裡的貓魅，轉而朝他伸出手，牽住那明顯大了許多的手掌。
      　　
      　　「比起這個，我偶然找到了好吃漢堡的配方。」
      　　
      　　光朝古·拉哈·提亞擠了擠眼睛。
      　　
      　　「不如我們邊吃邊說？」
