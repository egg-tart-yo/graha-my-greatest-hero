      　　從迷宮回來的時候，古·拉哈·提亞右臂上多了一道傷。
      　　
      　　傷口並不嚴重，只不過是在戰鬥中，代替光擋下魔物的攻擊時，被利爪擦過的一道痕跡。以他們這一路走來受過的傷來說，或許只能歸類在「回去記得處理一下」的程度。
      　　
      　　可光一路上都沒怎麼說話。
      　　
      　　回到石之家後，雅·修朵拉讓古·拉哈·提亞坐下，順手替他把傷口清理乾淨。治療魔法的光芒覆過手臂時，貓魅還試圖說些什麼緩和氣氛，結果才剛抬頭，就撞上光站在不遠處看著他的視線。
      　　
      　　他立刻把原本要說的話嚥了回去。
      　　
      　　那神情不能說是生氣，但大概也差不了多少。
      　　
      　　阿莉塞顯然也察覺了，抱著手臂在旁邊看了一會兒，最後忍不住問：「你從剛才開始就一直這副表情。怎麼了？」
      　　
      　　光沉默片刻，用比平常低沉很多的聲音開口。
      　　
      　　「……你們是不是太習慣這種事了？」
      　　
      　　「哪種事？」阿爾菲諾問。
      　　
      　　光抬手，指了一下古·拉哈·提亞。
      　　
      　　後者低頭看看自己正在接受治療的手臂，頓時露出一點心虛的神色。
      　　
      　　「殿後、擋攻擊、留下來拖延時間。」光說，「只要情況稍微危急一點，你們就很自然地選擇這條路。」
      　　
      　　聞言，屋裡安靜了一瞬。
      　　
      　　桑克瑞德先挑了挑眉，像是光說了什麼異常的話。
      　　
      　　雅·修朵拉則收回施放治療魔法的手，平靜地確認了一下古·拉哈·提亞的手臂，才道：「因為在大部分狀況下，那是最為合理的判斷。」
      　　
      　　「就是啊。」阿莉塞點頭附和，「總不能所有人一起站在那裡等著被包圍。」
      　　
      　　「而且若必須有人先離開，」尤里安傑慢條斯理地接過話，「讓英雄減少消耗、保有戰力，於大局而言，自然最為妥當。」
      　　
      　　艾斯蒂尼安靠在牆邊，只簡短地補了一句。
      　　
      　　「誰叫你最能打。」
      　　
      　　光遞給他一個沒好氣的眼神。
      　　
      　　環顧周圍，所有人都一臉理所當然，甚至沒有半點覺得哪裡不對。
      　　
      　　光的嘴角往下一壓。
      　　
      　　「我不贊成。」
      　　
      　　這一次，幾個人倒是真的愣了一下。
      　　
      　　「從以前就是這樣。」光皺起眉，「在烏爾達哈的時候也是，你們一個個留下來，只為了讓我逃走。」
      　　
      　　桑克瑞德原本還帶著些笑意的表情微微一頓，他瞥了眼雅·修朵拉的眼睛，視線垂了下來。
      　　
      　　「後來也一樣。」光繼續說，「碰到危險的時候，你們第一個想到的總是讓我繼續向前，自己留下來殿後。」
      　　
      　　阿爾菲諾似乎想說些什麼，卻又停住了。
      　　
      　　他們也明白，光說的是實話。
      　　
      　　但對眾人而言，這並不是某一日商量出來的規矩，更像是一路走到現在，不知不覺形成的默契。
      　　
      　　若局勢只能保下一個人，那就讓光離開。
      　　
      　　若必須有人留下，光就不會在選擇之中。
      　　
      　　若前方還有更為強大的敵人，就要優先保留光的戰力。
      　　
      　　他們當然知道，這對性情溫柔的光而言，或許是一件近乎殘酷的事。
      　　
      　　可一路與英雄同行至今，他們也早已明白，有些時候，能替他多擋下一步、多爭取一點時間，讓他得以毫無後顧之憂地繼續向前，也是他們在這條路上所能貢獻的一份力量。

      　　「這只是合理的戰力分配。」桑克瑞德最後只能這麼說。
      　　
      　　光立刻看向他，滿臉不贊同。
      　　
      　　「那為什麼不能是我殿後？」
      　　
      　　「因為那就失去意義了。」
      　　
      　　「我也可以拖住敵人。」
      　　
      　　「那不是能力的問題。」
      　　
      　　「那──」
      　　
      　　「但如果你留下，」雅·修朵拉淡淡地打斷他，「接下來若又出現必須由你處理的狀況，我們要怎麼辦？」
      　　
      　　光噎住。
      　　
      　　阿莉塞立刻乘勝追擊：「對啊，而且就現如今來看，大家不都好好的嗎？」
      　　
      　　古·拉哈·提亞很配合地坐直了一點。
      　　
      　　「我確實沒有大礙。」
      　　
      　　光轉頭瞪他，貓魅又默默坐了回去。
      　　
      　　「問題不是傷得重不重。」光說。
      　　
      　　「我們知道。」阿爾菲諾的語氣柔和了一些，「你只是不希望我們把受傷，或者留下來承擔危險這件事，當成理所當然。」
      　　
      　　光抿著嘴，算是默認。
      　　
      　　其實他也知道自己有些過度鑽牛角尖。
      　　
      　　知道每一次他們做出那樣的決定，都不是因為輕視自己的性命，更不是抱著什麼犧牲自己的念頭。
      　　
      　　只是因為信任。
      　　
      　　信任光是足以託付接下來事情的夥伴，信任他會達到每一趟旅程的目的。
      　　
      　　可知道是一回事。
      　　
      　　喜不喜歡一次次拋下夥伴，又是另一回事。
      　　
      　　「總之，」光悶悶地說，「以後不准這麼理所當然。」
      　　
      　　艾斯蒂尼安問：「那要怎麼辦？」
      　　
      　　光一時答不上來。
      　　
      　　「……至少先想想別的方法。」
      　　
      　　尤里安傑微微垂眼，似乎真的在認真思索這項新的行動準則。
      　　
      　　桑克瑞德忍著笑。
      　　
      　　雅·修朵拉則很乾脆地說：「恐怕很難答應你。」
      　　
      　　光的嘴又扁了一點。
      　　
      　　阿莉塞看見了，立刻偏過頭去，只是肩膀可疑地抖了一下。
      　　
      　　就在這場小小的爭論即將陷入僵局時，剛接受完治療、安靜了好一會兒的古·拉哈·提亞忽然清了清喉嚨。
      　　
      　　「其實……我有一個提議。」
      　　
      　　所有人一起看向他。
      　　
      　　貓魅的耳朵可疑地動了一下。
      　　
      　　「既然問題在於，光不希望大家總是在危急時刻優先保全他的戰力，那麼，只要我們的實力足以應付更多狀況，這種情形自然也會減少。」
      　　
      　　光愣了一下，這段話乍聽之下似乎沒錯。
      　　
      　　「所以？」
      　　
      　　古·拉哈·提亞眼神一亮。
      　　
      　　「所以，若英雄願意撥一些時間訓練我──」
      　　
      　　話還沒說完，阿莉塞已經一拳捶在他沒受傷的那邊肩膀上。
      　　
      　　「痛！突然間做什麼！」
      　　
      　　「你很狡猾耶！」
      　　
      　　「我、我只是提出一個合理的解決方式！」
      　　
      　　「你明明就是想趁機叫他陪你訓練！」
      　　
      　　「兩者並不衝突吧！」
      　　
      　　「還敢說！」
      　　
      　　古·拉哈·提亞一邊閃躲阿莉塞的攻擊，一邊努力替自己的論點辯解：「而且我確實變強的話，以後也能處理更多突發狀況，這樣光就不用──」
      　　
      　　「少辯解，你先把那副很開心的表情收起來再說！」
      　　
      　　「我哪有！」
      　　
      　　「耳朵都豎起來了還沒有！」
      　　
      　　光站在原地，看著突然鬧成一團的兩人，原本還沉著的神色終於鬆了一點。
      　　
      　　桑克瑞德在旁邊笑出聲。
      　　
      　　「不過，他的提議也不是完全沒有道理。」
      　　
      　　阿莉塞猛地回頭。
      　　
      　　「桑克瑞德！」
      　　
      　　「別這樣瞪我。」桑克瑞德攤開手，「我們確實可以多安排一些彼此訓練的時間。至少下次遇到同樣的狀況時，多一點選擇總是好事。」
      　　
      　　阿爾菲諾點了點頭，「大家一起變強，就能走到更遠的地方。」
      　　
      　　「若能增加彼此應對突發狀況的能力，確實值得一試。」
      　　
      　　尤里安傑也表示贊同。
      　　
      　　艾斯蒂尼安則直接看向光。
      　　
      　　「那你之後跟我打一場。」
      　　
      　　光的頭上已經開始冒出陸行鳥圓圈。
      　　
      　　雅·修朵拉輕輕笑了一聲。
      　　
      　　「看來你替自己增加了不少工作。」
      　　
      　　光這才慢慢反應過來。
      　　
      　　他看了看一臉期待的古·拉哈·提亞，又看了看已經開始思考訓練安排的阿爾菲諾，最後視線落到完全一副「就這麼決定了」模樣的眾人身上。
      　　
      　　「等等。」
      　　
      　　沒有人理會。
      　　
      　　「我沒有說要訓練全部的人吧？」
      　　
      　　「既然要提升整體戰力，自然是所有人一起比較有效率。」桑克瑞德說。
      　　
      　　「我剛剛只是──」
      　　
      　　「放心吧。」雅·修朵拉微笑，「我們不會太佔用你的時間。」
      　　
      　　光瞇起眼。
      　　
      　　不知道為什麼，他忽然覺得自己好像陷入某人的圈套。
      　　
      　　古·拉哈·提亞似乎察覺了他的視線，很快收斂起嘴角那點過於明顯的笑意，認認真真地補充：「我會努力的。」
      　　
      　　他低頭看了一眼已經癒合的傷口，聲音也稍稍輕了些。
      　　
      　　「下次若再遇到同樣的情況，我會盡量做到不必讓你擔心。」
      　　
      　　光安靜了片刻。
      　　
      　　「……不是這個意思。」
      　　
      　　「嗯？」
      　　
      　　「我不是叫你們變強到不會受傷。」他停了一下，「我是叫你們別那麼習慣把自己留在後面。」
      　　
      　　屋裡又靜了一瞬。
      　　
      　　對光而言，每一次回頭，看見有人背對著自己、迎面敵人，厲聲斥喝「你先走」，大概從來都不是能夠習慣的事。
      　　
      　　古·拉哈·提亞望著他，過了一會兒，輕輕點頭。
      　　
      　　旁邊的阿莉塞忽然又警覺起來。
      　　
      　　「等等，你不要搞得好像只有你代表大家答應他一樣。」
      　　
      　　「咦？」
      　　
      　　「還有，你剛才那個訓練的提議不算數。」
      　　
      　　「為什麼！」
      　　
      　　「因為你夾帶私心！」
      　　
      　　「可是桑克瑞德他們也同意了──」
      　　
      　　「那是另一回事！」
      　　
      　　兩人的聲音再次鬧了起來。
      　　
      　　光站在一旁，聽著那些熟悉的爭吵聲，終於沒再板著臉。
      　　
      　　只是沒過多久，古·拉哈·提亞便趁阿莉塞轉頭的空檔，悄悄朝他靠近了一點。
      　　
      　　「那個……」
      　　
      　　「嗯？」
      　　
      　　「訓練的事，真的完全不能考慮嗎？」
      　　
      　　光看著古·拉哈·提亞熱切的表情。
      　　
      　　下一秒，阿莉塞的聲音從後面傳來。
      　　
      　　「拉、哈！」
      　　
      　　「我只是問問！」
      　　
      　　光大大地嘆了一口氣。
