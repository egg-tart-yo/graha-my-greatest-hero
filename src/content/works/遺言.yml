  - body: |-
      　　石壁移動時發出的沉重巨響從四面八方傳來，摩擦的粉塵嗆得他們連連咳嗽，也讓人清楚意識到──這個密室正在縮小。
      　　
      　　光抬眼看了一圈左邊的牆，另一手同時觸摸著右邊的石壁。
      　　
      　　前面正在逼近，後面同樣沒打算放過他們。
      　　
      　　很好，看來是毫無逃脫空間的死牢。
      　　
      　　他和古·拉哈·提亞背靠著背站在中央，留給兩人的空間已經只剩下原先的一半。光方才試著用武器砸過牆面，除了震得自己手腕發麻之外，石壁上甚至連一道像樣的裂痕都沒留下。
      　　
      　　古·拉哈·提亞還沒有放棄，他雙手同樣貼著石壁，仔細查找有沒有逃脫的可能。
      　　
      　　「牆壁移動的速度幾乎一致……機關應該不是單純依靠重力驅動，入口也已經完全封死了，若是能找到術式的核心，或許還有機會……」

      　　他一邊說，紅眼一邊迅速掃視四周。
      　　
      　　「拉哈。」
      　　
      　　「嗯？稍等一下，我想這裡的紋路或許有機會──」
      　　
      　　「拉哈。」
      　　
      　　這一次，光的聲音格外正經。
      　　
      　　古·拉哈·提亞終於停下動作。
      　　
      　　兩人身後緊貼著彼此，沒辦法轉過身，只能稍微偏過頭。
      　　
      　　「怎麼了？」
      　　
      　　光沉默了一會兒。
      　　
      　　然後，他垂下了手裡的武器，那聲沉悶的落地聲讓古·拉哈·提亞愣了一下。
      　　
      　　「光？」
      　　
      　　「沒救了。」
      　　
      　　「……什麼？」
      　　
      　　「牆打不破，也沒有機關，更沒有擊破就能停止的魔物。」
      　　
      　　「別這麼輕易放棄！還不到最後一刻──」
      　　
      　　「嗯。」光非常平靜地說，「所以趁現在還來得及，我有件事要跟你說。」
      　　
      　　古·拉哈·提亞大概是從他的語氣裡聽出了某種不同尋常的鄭重，也跟著安靜下來。
      　　
      　　四周的石壁仍持續緩慢逼近。
      　　
      　　光深吸了一口氣。
      　　
      　　「拉哈，我喜歡你。」
      　　
      　　「…………」
      　　
      　　背後除了石壁持續壓進的聲響，一點反應都沒有。
      　　
      　　光等了兩秒，忍不住側過臉看他。
      　　
      　　古·拉哈·提亞睜大了眼睛。
      　　
      　　那雙紅色的眼眸裡方才還飛快流轉各種逃生方法，此時卻像被人一口氣清空了似的，只剩下一片徹底的茫然。
      　　
      　　「你……」
      　　
      　　他張了張嘴，肩膀止不住地顫抖。
      　　
      　　「你剛剛……」
      　　
      　　「我說我喜歡你。」
      　　
      　　光怕他沒聽清楚，又重複了一遍。
      　　
      　　其結果導致古·拉哈·提亞整個人比旁邊的石牆還僵硬。
      　　
      　　光看著他那副完全停止思考的模樣，忽然覺得有點好笑。
      　　
      　　反正都要死了。
      　　
      　　於是他乾脆轉過半邊身子，在越來越狹窄的空間裡低下頭，輕輕親了一下古·拉哈·提亞的額頭。
      　　
      　　這吻一落，古·拉哈·提亞徹底不動了。
      　　
      　　如果不是那對耳朵還高高立著，光甚至懷疑他是不是已經跟周圍的石壁一同石化。
      　　
      　　「……」
      　　
      　　「……」
      　　
      　　「拉哈？」
      　　
      　　還是沒有回答。
      　　
      　　「古·拉哈·提亞？」
      　　
      　　光頓時有點擔心。
      　　
      　　不會真的嚇傻了吧？
      　　
      　　難不成他唯一的遺言，連個像樣的回應都得不到嗎？
      　　
      　　他正想伸手在古·拉哈·提亞眼前晃兩下，視線卻忽然落在腳邊。
      　　
      　　地上的石磚縫隙間，似乎有什麼東西動了一下。
      　　
      　　光瞇起眼睛，迅速捕捉到一道極細的反光從縫裡閃過。
      　　
      　　不像什麼機關，反而像是水的波紋。
      　　
      　　光蹲下身，用手指碰了碰石縫中央。
      　　
      　　下一刻，他立刻重新抓起武器。
      　　
      　　古·拉哈·提亞終於被這個動作驚醒了。
      　　
      　　「等、等一下，你要做什麼？」
      　　
      　　「下面有水。」
      　　
      　　「什麼？」
      　　
      　　「石板下面應該是河。」
      　　
      　　古·拉哈·提亞愣了一瞬，立刻低頭。
      　　
      　　「所以你是想──」
      　　
      　　「砸開它。」
      　　
      　　「等等，至少先確認──」
      　　
      　　「數到三，憋好氣抓緊我。」
      　　
      　　堅定的話一落，渾身爆出鬥氣的光已經動手砸下去。
      　　
      　　砰！
      　　
      　　「一。」
      　　
      　　第二下，裂痕迅速沿著石磚蔓延。
      　　
      　　「二。」
      　　
      　　第三下落下時，整片地面猛地往下一沉。
      　　
      　　「三！」
      　　
      　　古·拉哈·提亞的耳朵瞬間豎得筆直。
      　　
      　　下一秒，失重的感覺席捲而來，兩人一同掉了下去。
      　　
      　　冰冷的水流毫不客氣地灌入鼻腔。
      　　
      　　光在混亂間啟動甲人族的術法，一把抱住那抹紅色的身影，順著湍急的河流急速向前。
      　　
      　　兩人就這樣一路被水沖了不知道多遠，最後又被一道浪毫不客氣地拍上岸。
      　　
      　　「咳、咳咳……！」
      　　
      　　重見天日的光趴在地上咳了好一陣子，才終於把嗆進去的水吐乾淨。
      　　
      　　活著。
      　　
      　　居然真的活著。
      　　
      　　他撐起身子，抹掉臉上的水。
      　　
      　　「拉哈，你還好嗎──」
      　　
      　　話還沒說完，眼前忽然一暗。
      　　
      　　光抬頭，古·拉哈·提亞的臉緊緊貼在他的視線前。
      　　
      　　他還未緩過氣的胸膛劇烈起伏，濕透的紅髮貼在臉側，耳朵也因為沾了水顯得有些狼狽，但那雙紅色眼睛卻亮得驚人。
      　　
      　　裡頭甚至燃著火焰，看起來非常生氣。
      　　
      　　光眨了眨眼。
      　　
      　　「拉哈？」
      　　
      　　「你、你──」
      　　
      　　古·拉哈·提亞深吸了一口氣。
      　　
      　　「你到底在想什麼啊！」
      　　
      　　光愣住。
      　　
      　　「幹嘛？」
      　　
      　　「什麼幹嘛？！」
      　　
      　　古·拉哈·提亞的聲音一下拔高。
      　　
      　　「就是剛才！那種狀況下，正常來說不是應該先想辦法逃出去嗎？為什麼你會突然說那種話，還、還──」
      　　
      　　他的聲音嗆了一下，紅透的耳朵焦躁地抖動著。
      　　
      　　「還做那種事！」
      　　
      　　光恍然大悟。
      　　
      　　「喔。」
      　　
      　　「喔什麼喔！」
      　　
      　　古·拉哈·提亞看起來簡直快要氣炸了。
      　　
      　　「萬一真的沒有發現那條河呢？萬一我們真的逃不出去呢？你難道就打算在那種時候說完那些話，然後什麼都不管了嗎？」
      　　
      　　光盤腿坐在濕漉漉的岸邊，搔了搔頭。
      　　
      　　「可是我那時候真的以為自己要死了啊。」
      　　
      　　「怎麼可以這麼快放棄！」
      　　
      　　「哪有，後來不是逃出來了嗎？」
      　　
      　　「那是僥倖！你明明連武器都放下了──」
      　　
      　　「但就結果看來，我們很幸運？」
      　　
      　　古·拉哈·提亞張了張口，又閉上，一時之間竟找不到話反駁。
      　　
      　　光看著難得被氣壞的他，忍不住笑了。
      　　
      　　「而且我想說，要是真的死了，再不講就來不及了。」
      　　
      　　古·拉哈·提亞一怔。
      　　
      　　方才還氣得高高豎起的耳朵，慢慢放鬆了一點。
      　　
      　　光仍舊一副若無其事的樣子。
      　　
      　　「想一想還挺虧的。」
      　　
      　　「……什麼？」
      　　
      　　「喜歡那麼久，結果到死都沒告訴你。」
      　　
      　　他偏過頭，嘴角帶著一點故意的笑。
      　　
      　　「所以就說了。」
      　　
      　　古·拉哈·提亞看著他，臉上的神情是前所未有的複雜，一雙手在跪坐的腿上緊緊握住，唇也抿得緊繃。
      　　
      　　光也回望著他，沉默了會，最後還是厚著臉皮問。
      　　
      　　「回答呢？」
      　　
      　　「……」
      　　
      　　古·拉哈·提亞的尾巴迅速在身後甩動著。
      　　
      　　「什麼回答？」
      　　
      　　「我剛剛告白了啊，該輪到你了吧？」
      　　
      　　「你、你這人簡直──」
      　　
      　　光彎起眼睛，明顯就是故意的。
      　　
      　　「拉哈？」
      　　
      　　氣得渾身毛髮澎起的古·拉哈·提亞狠狠瞪著他──只可惜那張徹底紅透的臉，對光而言實在沒什麼威嚇力。
      　　
      　　眼見對方仍是一副無所謂的模樣，古·拉哈·提亞再怎麼惱火，也毫無辦法，最後他像是徹底放棄了似地垂下耳朵，長長吐出一口氣。
      　　
      　　「你真的是……」
      　　
      　　「嗯？我怎麼樣？」
      　　
      　　古·拉哈·提亞沒有立刻回答。
      　　
      　　他只是伸出手，毫不客氣地一把抓住光濕透的衣領，對方也完全沒反抗，甚至還順著力道往前靠了一點。
      　　
      　　兩人的額頭用力撞在一起。
      　　
      　　「不准說完就一副準備安心赴死的樣子。」古·拉哈·提亞低聲說，「我可還沒告訴你我的答案。」
      　　
      　　光眨了眨眼，藍眼亮了一層。
      　　
      　　「那現在要告訴我了嗎？」
      　　
      　　古·拉哈·提亞深深吸一口氣，紅眼瞇了起來。
      　　
      　　「我不說。」
      　　
      　　面對貓魅難得展現的固執，光的眼神十分錯愕。
      　　
      　　「什麼！」
      　　
      　　「你得活下去、在每一次逆境裡活下去，我才會把回答告訴你。」
      　　
      　　古·拉哈·提亞鬆開光的衣領，眉頭緊緊皺著，顯然還在生氣。
      　　
      　　「那我得等多久？」
      　　
      　　「誰知道，可能等我們都變老爺爺吧。」
      　　
      　　「那親吻總可以吧！」
      　　
      　　光氣急敗壞地大喊。
      　　
      　　古·拉哈·提亞滿臉震驚，彷彿此時此刻才知道他憧憬的英雄居然有這般無賴的一面。
      　　
      　　但他始終無法真正拒絕那人的要求，無論是什麼時候。
      　　
      　　「……隨你。」
      　　
      　　那對耳朵可疑地泛著紅。
      　　
      　　但事後無論光如何勸誘，就算把人親得連氣都緩不過來，古·拉哈·提亞也還是不肯鬆口。
      　　
      　　好在，光很擅長從蛛絲馬跡裡找到答案。
      　　
      　　例如兩人最後離開小島時，古·拉哈·提亞緊緊牽著他的手，如同那石縫裡的波紋般，就是最好的提示。
