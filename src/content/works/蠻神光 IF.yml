  - title: 心願
    body: |-
      　　舊薩雷安的天色尚未亮透。
      　　
      　　海面罩著一層灰白薄霧，晨風從北洋吹來，掠過哲學家議會館高聳的白牆，也掠過港口密密麻麻的人群。
      　　
      　　沒有人願意離開。
      　　
      　　自諸神黃昏號飛向群星彼端之後，這座向來以冷靜與理性自豪的城市，便徹底遺忘了時間。議員、鍊金術師、工匠與搬運水晶的工人擠在碼頭附近，與來自艾奧傑亞各城邦的使節一同站在人群前方；更遠處，還有那些曾與英雄並肩戰鬥、受過英雄幫助，或只在傳聞中聽過英雄名字的人。
      　　
      　　他們一同仰望著天空，一同等待那艘承載著世界最後希望的船。
      　　
      　　不知過了多久，瞭望塔上忽然傳來鐘聲。
      　　
      　　塔頂的觀測員幾乎是撲到欄杆前，嘶啞地高喊：「發現飛空艇！」
      　　
      　　海風吹散了他的聲音，卻吹不散那一瞬間湧起的歡呼。
      　　
      　　人們帶著希冀的眼神，齊齊抬起頭。
      　　
      　　雲層深處，一點火光拖著長長的尾跡，從遙不可及的高空緩緩降下。那艘曾駛往宇宙盡頭的飛船穿過雲海，推進器發出的轟鳴，撼動著在場人們的心跳。
      　　
      　　諸神黃昏號回來了。
      　　
      　　塔塔露站在最前方，她小小的身軀幾乎被人群淹沒，卻始終沒有移開視線。
      　　
      　　「回來了……」
      　　
      　　她捂住嘴，眼眶一下紅了。
      　　
      　　「大家都回來了！」
      　　
      　　飛船在港口上空盤旋，緩慢調整角度，氣壓翻飛著眾人的衣擺，當巨大的船體終於落上平台，伴隨著歡騰的呼喊聲，洩壓的艙門向兩側開啟。
      　　
      　　最先出現的是桑克瑞德。
      　　
      　　他的衣物殘破，臉上遍佈擦傷，走下舷梯時腳步比平日沉重得多，尤里安傑跟在他身後，一手扶著艙壁，兩側垂下的頭髮遮住了他的眼睛。
      　　
      　　雅·修朵拉、艾斯蒂尼安、阿爾菲諾、阿莉塞，然後是古·拉哈·提亞。
      　　
      　　熟悉的身影一個接一個走出飛船，人群呼喊他們的名字，卻沒有人回應。
      　　
      　　這時，人們突然注意到他們一左一右護送著、臨時製成的擔架。
      　　
      　　竊竊私語從港口邊緣逐漸蔓延開來。
      　　
      　　阿莉塞緊緊咬著下唇，她的雙手顫抖得厲害，每走一步，都像要用盡全身的力氣。
      　　
      　　阿爾菲諾的臉近乎沒有血色。
      　　
      　　擔架上的人閉著眼睛。
      　　
      　　染血的衣甲已被簡單處理過，胸前纏著厚重的繃帶，卻沒有任何起伏。那張所有人都熟悉的臉安靜得近乎陌生，彷彿只是經歷漫長旅途後，終於沉沉睡去。
      　　
      　　港口陷入一片死寂。
      　　
      　　眾人凝視著那副擔架，卻沒有人能立刻理解眼前的景象。
      　　
      　　因為英雄可以受傷，可以疲憊，可以在勝利後露出笑容，唯獨不該如此安靜。
      　　
      　　塔塔露慢慢往前走了一步。
      　　
      　　「怎麼了？」她的聲音很輕，「為什麼大家都不說話？」
      　　
      　　沒有人回答。
      　　
      　　她走到擔架旁，伸出手，像過去每一次替遠行歸來的同伴整理衣領那樣，碰了碰那人的手指。
      　　
      　　冰冷的溫度讓塔塔露怔住了。
      　　
      　　「很累了，對吧？」
      　　
      　　她勉強笑了一下。
      　　
      　　「去了那麼遠的地方，當然會累。房間已經收拾好了，熱水也準備好了……所以……」
      　　
      　　阿莉塞別過臉，肩膀劇烈顫抖。
      　　
      　　塔塔露仍握著那隻手。
      　　
      　　「所以，該醒來了吧？冒險者先生。」
      　　
      　　海浪拍打著港灣，一下又一下，卻始終沒有人回答她。
      　　
      　　「是在最後……被傳送回來的。」
      　　
      　　阿爾菲諾終於開口，他的聲音乾澀得不像自己。
      　　
      　　「我們已經用了所有能用的治療術，船上的醫療設備也……可是傷勢太重，靈魂的乙太幾乎耗盡了。」
      　　
      　　他垂下眼睛。
      　　
      　　「回來的時候，就已經……沒有呼吸了。」
      　　
      　　塔塔露的手茫然地鬆開。
      　　
      　　阿莉塞像被這句話再次撕開了傷口，猛地轉向阿爾菲諾。
      　　
      　　「不要說了！」
      　　
      　　她的聲音響徹港口。
      　　
      　　「還沒結束！怎麼能就這麼結束！」
      　　
      　　阿莉塞撲到擔架旁，雙手按上那人的胸口，掌心發出的治癒光芒卻被阿爾菲諾攔下。
      　　
      　　但即使沒有他的阻攔，魔法也早已起不了作用。
      　　
      　　阿莉塞的雙膝重重跪了下去，她抓住兄長的衣襟，像個終於支撐不住的孩子，發出壓抑許久的哭聲。
      　　
      　　那哭聲成了某種訊號。
      　　
      　　最初只是細碎的低泣聲，而後逐漸連成一片。那些曾因英雄獲救的人低下了頭，曾與英雄舉杯的人閉上眼睛，有人跪地祈禱，有人不願相信地一遍遍搖頭。
      　　
      　　桑克瑞德站在擔架旁，沉默地望著那張臉。
      　　
      　　他的手停在半空，似乎想像往常那樣拍拍對方的肩膀，最終卻只是緩緩收回。
      　　
      　　雅·修朵拉也保持沉默。
      　　
      　　從她的眼裡看去，耗盡乙太的軀體早已是一片空白，就連是否還存在於他們身邊，都無法確認。
      　　
      　　即使那裡曾有一個耀眼而堅韌的靈魂。
      　　
      　　艾斯蒂尼安站得最遠。
      　　
      　　他的長槍抵著地面，目光停在擔架上，許久都沒有離開。
      　　
      　　古·拉哈·提亞始終一言不發，從走下飛船開始，他便站在原地。
      　　
      　　他看著擔架上的人，看著那張曾無數次朝他露出笑容的臉，赤紅的雙眼沒有流淚，甚至沒有明顯的悲傷。
      　　
      　　神色平靜得令桑克瑞德皺起眉頭。
      　　
      　　在眾人沉默的注視下，他轉身走向港口外。
      　　
      　　「拉哈……？」
      　　
      　　不理會阿莉塞的呼喚，他的腳步越來越快。
      　　
      　　起初只是疾走，穿過尚未從悲痛中回神的人群後，便近乎奔跑。
      　　
      　　桑克瑞德的神情驟然一變。
      　　
      　　「攔住他！」
      　　
      　　艾斯蒂尼安幾乎在同一刻躍起。
      　　
      　　長槍橫掃而出，槍柄重重落在古·拉哈·提亞面前，封死了前路。
      　　
      　　古·拉哈·提亞停下腳步。
      　　
      　　「讓開。」
      　　
      　　艾斯蒂尼安凝視著聲音平穩的他。
      　　
      　　「你要去哪裡？」
      　　
      　　「水晶塔。」
      　　
      　　這三個字讓所有人都陷入沉默。
      　　
      　　古·拉哈·提亞抬起眼，那雙紅眸裡終於浮現出某種近乎可怕的執念。
      　　
      　　「塔內還保留著亞拉戈帝國累積的乙太，只要重新調整時空干涉裝置，再配合亞歷山大的演算紀錄與歐米茄的次元技術，我就能重現當初的航路。」
      　　
      　　他的語速很快，卻異常清晰，彷彿這個念頭早已在腦海中推演過千百遍。
      　　
      　　「我知道如何讓水晶塔跨越時間，只要回到諸神黃昏號啟航之前──不，或許不需要那麼早，只要回到最後的傳送發生以前，我就能把他帶回來。」
      　　
      　　「拉哈。」阿爾菲諾站起身，「你知道自己在說什麼嗎？」
      　　
      　　「當然。」
      　　
      　　「你上一次能做到，是加隆德研究員們花費數年的成果，那不是能靠你一個人──」
      　　
      　　「所有的研究數據我都記得。」
      　　
      　　古·拉哈·提亞打斷他。
      　　
      　　「那些知識仍在我的記憶裡，塔也仍然承認我。只要有足夠的乙太，我就做得到。」
      　　
      　　雅·修朵拉轉向他，厲聲詢問。
      　　
      　　「就算做得到，你打算付出什麼代價？」
      　　
      　　古·拉哈·提亞偏過頭，撇開了視線。
      　　
      　　「回答我。」
      　　
      　　「那不重要！」
      　　
      　　聲音在港口迴盪，古·拉哈·提亞激動的情緒振盪著，胸口也劇烈地起伏。
      　　
      　　他垂下頭，努力壓抑著聲音。
      　　
      　　「他的生命，本來就是從被改寫的未來裡取回來的，既然能有第一次，就能有第二次。」
      　　
      　　「第一次並不算成功。」
      　　
      　　雅·修朵拉的聲音冷靜得近乎殘酷。
      　　
      　　「那條失去他的時間依然延續，你改變的只是我們所在的世界，並未拯救那個未來裡的他。」
      　　
      　　「那我就再創造一個他活著的未來。」
      　　
      　　「那這裡呢？」
      　　
      　　古·拉哈·提亞的瞳孔猛然縮起。
      　　
      　　雅·修朵拉站在擔架旁，手中的咒杖重重敲擊著地面。
      　　
      　　「留給我們守著他的遺體，等你走上一條永遠不會歸來的路？」
      　　
      　　阿莉塞摀住耳朵，無助地搖著頭，恍若未聞的兩人卻依然在對峙著。
      　　
      　　「這一次我知道該怎麼做。比起阻止光之氾濫，這簡單許多──」
      　　
      　　「你確定嗎？」雅·修朵拉冷冷一笑，「明明第一世界的你，甚至根本沒打算活著回來？」
      　　
      　　桑克瑞德站到了雅·修朵拉身邊，眼底是前所未有的嚴肅。
      　　
      　　「那傢伙曾經這麼說過。」
      　　
      　　那人曾在篝火旁，望著滿天星斗，以尋常不過的語氣託付著沉重的心願。
      　　
      　　「他說，無論發生什麼事，都不能再讓古·拉哈·提亞踏上孤單的旅程。」
      　　
      　　古·拉哈·提亞的臉龐瞬間失去血色。
      　　
      　　尤里安傑低聲接道：「這是英雄唯一許下的心願。」
      　　
      　　海風吹過眾人之間。
      　　
      　　古·拉哈·提亞站在原地，那句跨越生死的叮囑確實稍稍束縛了他的腳步。
      　　
      　　過了很久，他才低聲說：「可是他已經不在了。」
      　　
      　　桑克瑞德握緊拳頭。
      　　
      　　「所以他的話就不算數了嗎？」
      　　
      　　「正因為他不在了，我才必須去！」
      　　
      　　古·拉哈·提亞向前踏出一步。
      　　
      　　艾斯蒂尼安的長槍隨即壓低，槍尖停在他的胸前。
      　　
      　　「到此為止。」
      　　
      　　古·拉哈·提亞看向他。
      　　
      　　「讓開，艾斯蒂尼安。」
      　　
      　　「不想和我戰鬥，」艾斯蒂尼安面無表情，「那就別再往前。」
      　　
      　　血色的眼睛在一瞬間睜大。
      　　
      　　刺眼的光芒一閃，古·拉哈·提亞抬起的右手出現水晶尖端的法杖，數道乙太構成的幾何術式飛快地運轉著，伴隨強大的威壓，讓周圍的人們紛紛尖聲閃避。
      　　
      　　屬於水晶塔的力量正透過他的主人無限膨脹，握緊武器的手臂爬滿水晶的豔藍光芒，古·拉哈·提亞在強烈的力流中舉起法杖，尖端直指著沉下眼神的龍騎士。
      　　
      　　阿爾菲諾下意識擋在妹妹身前。
      　　
      　　「拉哈，住手！」
      　　
      　　「抱歉。」
      　　
      　　古·拉哈·提亞的眼睛沒有離開艾斯蒂尼安。
      　　
      　　「我不會留下來。」
      　　
      　　「這句話，」桑克瑞德抽出槍刃，「我們已經聽過太多次了。」
      　　
      　　雅·修朵拉的咒杖敲響地面，乙太在眾人腳下流動，化為一道無形的屏障，將通往港口外的道路徹底封鎖。
      　　
      　　尤里安傑也舉起手，星盤在他背後緩緩旋轉，上方的星芒逐一點亮。
      　　
      　　紅眼一個個環視著曾並肩走到世界盡頭的同伴。
      　　
      　　「你們不明白。」
      　　
      　　古·拉哈·提亞的聲音逐漸沙啞。
      　　
      　　「我等了那麼久。」
      　　
      　　亞拉戈的術式在他腳下擴散，伴隨著強大的力量，逐一壓制著高舉武器的眾人。
      　　
      　　「在那座塔裡醒來，迎接著我的是他的死訊，我去了第一世界，又等待了整整一百年。」
      　　
      　　他的眼淚終於落了下來。
      　　
      　　「後來，我終於成功召喚了他。」
      　　
      　　艾斯蒂尼安握槍的手微微一緊。
      　　
      　　「他把我從塔裡帶了出來，答應讓我和他一起冒險，我們還做了好多約定。」
      　　
      　　古·拉哈·提亞用力抹著臉頰，卻怎麼也擦不乾淨。
      　　
      　　「我要讓這個約定繼續下去。」
      　　
      　　在魔力爆發的前一刻，阿莉塞用力掙脫阿爾菲諾護著她的身軀，接著紅光一閃，手中的細劍直指古·拉哈·提亞的喉前。
      　　
      　　她滿臉淚痕，握劍的手劇烈顫抖。
      　　
      　　「你以為只有你想救他嗎？」她近乎嘶吼，「我也想回去！我想回到他把我們傳送走的那一刻，奪走他的傳送器！我甚至想回到更早以前，回到他答應加入拂曉血盟的時候，叫他別再管這個該死的世界！」
      　　
      　　她咬住嘴唇，鮮血沿著唇角滲下。
      　　
      　　桑克瑞德堅定地看著古·拉哈·提亞，再度舉起了槍刃。
      　　
      　　「那是他唯一的囑託。」他低聲道：「抱歉了，我不會退讓。」
      　　
      　　就在此時，港口深處傳來一陣細微的震動。
      　　
      　　震動越來越強、海岸逐漸興起波濤，彷彿大地發出的悲鳴，逐漸向外擴散。
      　　
      　　堆放在港區的水晶開始發出微光──那些原本是為諸神黃昏號準備的動力，就在此刻，絢麗的光芒瞬間席捲了整片海港。
      　　
      　　雅·修朵拉猛然轉過頭。
      　　
      　　「這是……」
      　　
      　　空氣中的乙太正在聚集，全數流向港口中央。
      　　
      　　流向那副擔架。
      　　
      　　古·拉哈·提亞的法杖從手中滑落。
      　　
      　　「光……？」
      　　
      　　周圍的人群也察覺了異狀。
      　　
      　　可也有人，早已低聲祈禱。
      　　
      　　「請讓英雄回來。」
      　　
      　　一個小女孩在人群裡哭泣著，她身旁的母親跪了下去。
      　　
      　　「拜託……把他還給我們。」
      　　
      　　聲音從四面八方響起。
      　　
      　　來自伊修加爾德的騎士想起終結千年龍詩戰爭的人。
      　　
      　　來自阿拉米格的士兵想起在烈火中奪回故鄉的人。
      　　
      　　多瑪的子民想起穿越茫茫大海而來，為他們斬斷枷鎖的人。
      　　
      　　心願匯聚成祈求，而形成強大的力量，而龐大的水晶，恰好為這份願望提供了形體。
      　　
      　　雅·修朵拉的臉色變了。
      　　
      　　「全部住口！」
      　　
      　　她的聲音裡第一次帶上了真正的驚慌。
      　　
      　　「不要祈禱！不要呼喚他！」
      　　
      　　可是已經太遲了。
      　　
      　　第一道光柱自水晶中央升起，緊接著是第二道、第三道。
      　　
      　　無數光芒刺穿晨霧，在港口上空交會，風暴般的乙太捲起所有人的衣袍，諸神黃昏號發出沉重的震鳴，連海面都泛起耀眼的光。
      　　
      　　阿爾菲諾望著擔架，臉上浮現出恐懼。
      　　
      　　「不……」
      　　
      　　他終於明白正在發生什麼。
      　　
      　　「不能讓祈願繼續下去！」
      　　
      　　桑克瑞德衝向人群。
      　　
      　　「所有人停止祈禱！那不是復活！」
      　　
      　　可是對失去希望的人而言，警告永遠比希望更難被聽見。
      　　
      　　「英雄救了我們所有人！」有人哭喊道，「現在輪到我們救他了！」
      　　
      　　「回來吧！」
      　　
      　　「求求你，回來吧！」
      　　
      　　「『光之戰士──』」
      　　
      　　千萬道呼喚在同一刻響起。
      　　
      　　周圍的水晶轟然碎裂，純粹的乙太如洪流般湧入擔架上的身體。
      　　
      　　阿莉塞撲上前，卻被強光推開，艾斯蒂尼安及時抓住她的手臂，將她護在身後。
      　　
      　　「放開我！他在那裡！」
      　　
      　　「別過去！」
      　　
      　　「他在那裡！」
      　　
      　　阿莉塞掙扎著，聲音已近崩潰。
      　　
      　　「那是他！那一定是他！」
      　　
      　　古·拉哈·提亞一動不動地望著光芒中的身影。
      　　
      　　那具冰冷的身體緩緩浮上半空。
      　　
      　　繃帶在光裡散去，傷口被乙太填補，破損的衣甲化為眾人記憶中最熟悉的模樣。數不清的印象、傳說與祈願纏繞在那人周圍，像替英雄披上一件由眾生之願編織而成的外衣。
      　　
      　　耀眼的光在其身後展開，無數武器的幻影環繞四周。
      　　
      　　劍、盾、長槍、弓、法杖、魔導書，那是英雄曾使用過的力量，也是世人想像中的英雄應有的姿態。
      　　
      　　光芒逐漸收束，那人緩緩睜開眼睛。
      　　
      　　港口爆發出震耳欲聾的歡呼。
      　　
      　　阿莉塞停止掙扎，淚水順著她的臉頰滑落。
      　　
      　　「光……」
      　　
      　　她喚了一聲，浮在半空中的人緩緩轉過頭。
      　　
      　　那雙眼睛望向她，帶著他們都熟悉的容貌與身影，眼底卻只有乙太凝聚而成的光，沒有看見同伴時總會浮現的柔和笑意。
      　　
      　　古·拉哈·提亞向前走了一步。
      　　
      　　「光……」
      　　
      　　他的聲音輕得像害怕驚擾夢境，然而，眾人身後的雅·修朵拉猛然揮動法杖。
      　　
      　　堅固的障壁在古·拉哈·提亞身前展開，下一瞬間，英雄身上散發的光芒化為利刃、重重劈落。
      　　
      　　障壁轟然碎裂，爆風將古·拉哈·提亞掀飛出去，衝到貓魅身後的桑克瑞德接住他，兩人一同跌在地上。
      　　
      　　光芒中的英雄緩緩降落，腳尖觸地的瞬間，整座港口都為之震動。
      　　
      　　祈願仍從四面八方湧來。
      　　
      　　守護世界，消滅災厄，成為希望的化身。
      　　
      　　人們的心願塑造出一位永遠不會倒下、永遠回應召喚、永遠為眾生而戰的英雄。
      　　
      　　一位神。
      　　
      　　尤里安傑仰望著那道身影，面色沉痛。攙扶著阿莉塞站起身的阿爾菲諾嘴唇顫抖，卻仍逼迫自己說出答案。
      　　
      　　「是蠻神。」
      　　
      　　那兩個字，比死亡本身更加殘酷。
      　　
      　　古·拉哈·提亞跪坐在地上，視線早已模糊不清，拂曉的其他同伴紛紛站到他的面前，艱難地舉起武器。
      　　
      　　「你們現在，」顫抖著的聲音，只剩下空洞，「是打算殺了他嗎？」
      　　
      　　「得在他精煉其他人之前動手。」
      　　
      　　桑克瑞德再次背起槍，尤里安傑也高舉著星盤。
      　　
      　　「身為夥伴，身為朋友，不能讓他成為被祈願捆綁的存在。」
      　　
      　　「他不是我們的英雄。」
      　　
      　　雅·修朵拉平靜地說，手掌卻嵌進了指甲。
      　　
      　　「哭夠了就拿起武器。」
      　　
      　　艾斯蒂尼安沒有回頭，他的語氣依舊堅定。
      　　
      　　「別讓那傢伙等太久。」
      　　
      　　「這是我們唯一能為他做的，最後一件事。」
      　　
      　　古·拉哈·提亞仰起頭，阿爾菲諾正凝視著他，身後張開的賢具微微發著光。
      　　
      　　而他只能握緊手中的法杖，顫抖著低下了頭。
  - title: 囚籠 - 上
    body: |
      　　水晶塔外，已經很久沒有下過雨了。
      　　
      　　喪靈鐘曾經潮濕的土地，如今滿是龜裂而成的深色縫隙，枯死的草莖被風捲過荒野，碰撞著焦黑的石塊，發出細碎而乾澀的聲響。

      　　更遠處，曾經聚集著冒險者的營地早已不復存在。

      　　帳篷、木樁與傳送水晶留下的基座，全都掩埋在灼燒後的灰燼裡。地脈的乙太像是被某種龐大的力量反覆抽取，只剩下無法癒合的傷痕。

      　　水晶塔仍然佇立在荒原中央。

      　　塔身散發著幽藍的光，無數亞拉戈術式沿著外壁明滅流轉，將周遭逐漸衰竭的乙太一點一點收攏，再送往塔的最深處。

      　　沉重的門扉在黃昏前開啟。

      　　古·拉哈·提亞從外面走了進來。

      　　他的斗篷沾滿塵土，左側衣袖被利刃撕開了一道長長的裂口，乾涸的血跡一路從肩頭延伸到手腕，幾枚已經失去光澤的水晶被他抱在懷裡，其中一枚碎裂得格外嚴重，幾乎無法再容納任何能量。

      　　門在他身後緩緩闔上。

      　　古·拉哈·提亞站在原地，低頭檢查那些帶回來的水晶，沒有察覺大廳深處一直望著自己的目光。

      　　「你受傷了。」

      　　聲音從階梯上方傳來。

      　　古·拉哈·提亞的手指微微一頓。

      　　「擦傷而已，沒事的。」

      　　他將水晶放上中央的控制臺，抬手啟動術式，淡藍色的光紋立刻沿著臺面展開，將水晶中殘餘的力量分離、提純，送進塔內更深層的迴路。

      　　站在階梯上的人沒有說話。

      　　直到最後一縷光也被塔吸收，古·拉哈·提亞才若無其事地回過頭。

      　　「這次找到的雖然不多，不過足夠維持一陣子。」他露出笑容，「東邊還有幾處沒有探查完的遺跡，等我把座標整理好，下一次應該會順利許多。」

      　　光沿著階梯走了下來，腳步卻沒有人類應有的沉重聲。

      　　由眾人祈願塑造而成的身軀與生前幾乎沒有不同，衣甲整潔，神情平靜，就連那雙眼睛也仍然帶著人們最熟悉的色澤。

      　　可是當他靠近時，塔內流動的乙太仍然會不自覺地向他聚攏。

      　　那不是活人會有的模樣。

      　　光伸出手，碰了碰他破損的衣袖。

      　　「這很嚴重。」

      　　「真的沒事。」

      　　「拉哈。」

      　　古·拉哈·提亞沉默片刻，終於任由他拉開衣袖。

      　　傷口比他所說的深得多。

      　　從肩側一直劃到手臂的裂口雖已止血，邊緣卻仍殘留著腐蝕的痕跡。光將掌心覆上去，溫和的白色光芒流過傷處，破損的血肉迅速癒合，彷彿從未受過傷。

      　　古·拉哈·提亞看著逐漸消失的傷痕，表情藏在垂下的髮絲裡：「不要浪費力量。」

      　　「水晶塔現在的能量還很充足。」

      　　光收回手，淡淡地反駁。

      　　古·拉哈·提亞重新整理好衣袖，正想去檢查控制臺上的數值，手腕卻被輕輕握住。

      　　他的動作停了下來，轉頭迎上蔚藍的視線。

      　　「外面怎麼樣？」

      　　「和以前差不多。」

      　　「我感覺喪靈鐘的乙太已經完全乾涸了。」

      　　古·拉哈·提亞沒有回答。

      　　光緩緩轉頭，看向塔外。

      　　厚重的水晶牆壁隔絕了外界，可他仍然能感覺到這片土地正變得愈來愈稀薄。塔像一棵根系無限延伸的巨樹，不斷從大地中汲取養分，而所有匯聚而來的力量，最終都流向了他。
      　　
      　　亞拉戈時代留下的能量蒐集裝置，正餵養著艾奧傑亞此刻唯一、且最為強大的蠻神。

      　　「塔內儲存的乙太還足以支撐很久。」光輕聲說，「你重新成為了水晶塔的終端，只要塔還在運作，你也能擁有近乎無盡的壽命。」

      　　「這不是很好嗎？」古·拉哈·提亞微微一笑，「我們有的是時間。」

      　　「可是能量總有耗盡的一天。」

      　　笑容從古·拉哈·提亞臉上淡去。

      　　「不要緊，只要繼續尋找新的能源──」

      　　「總有一天，附近的土地會徹底枯竭。」

      　　「那就到更遠的地方。」

      　　「更遠的地方，也是人們生存的家園。」

      　　大廳裡安靜下來。

      　　術式運轉的低鳴從塔底不斷傳來，像是某種巨大生物沉重而緩慢的呼吸。

      　　光鬆開他的手腕。

      　　「你很清楚，這是我們無法避免的未來。」

      　　古·拉哈·提亞轉過身。

      　　「我會想辦法。」

      　　「為了維持我的存在，水晶塔需要的能量只會愈來愈多。」光望著他的背影，「現在是摩杜納，也可能是更遠的地方。總有一天，我們會為了活下去，奪走其他人的生存空間。」

      　　「不會。」

      　　「拉哈。」

      　　「我說不會！」

      　　他的聲音忽然變得強硬。

      　　古·拉哈·提亞背對著他，雙手撐在控制臺邊緣，指尖因為用力而慘白。

      　　光靜靜地看著他。

      　　其實自己所說的一切，他聰明的戀人完全知曉。

      　　正因為知道，這些年來每一次離開水晶塔，每一次帶著傷痕與耗盡力量的水晶回來，對古·拉哈·提亞而言才會如此痛苦。

      　　他從來不願傷害任何人。

      　　曾經在第一世界等待百年的水晶公，曾經為了一個沒有自己的未來甘願赴死的人，絕不可能真的漠視這片土地的衰敗。

      　　可是世界與光之間，他只能留下其中一個。

      　　早在多年以前，背棄同伴、帶著光逃入水晶塔之時，他早已做出了選擇。

      　　「其實還有別的方法。」

      　　古·拉哈·提亞的肩膀僵住了。

      　　光的聲音很平靜，即使他很清楚，對方打從心底抗拒著他接下來要說的話。

      　　「只要我消失，水晶塔就不必再維持這具形體。剩餘的能量足夠穩定周圍的乙太，讓大地重新恢復生機，你也不必再去尋找新的水晶。」

      　　「不行。」

      　　回答幾乎沒有任何遲疑。

      　　「我可以自己結束這一切。」

      　　古·拉哈·提亞猛然轉過身。

      　　他的眼睛睜得很大，方才勉強維持的平靜在一瞬間徹底崩裂。

      　　「不要再說了。」

      　　「拉哈。」
      　　
      　　「我叫你不要再說了！」
      　　
      　　聲音在空曠的大廳裡迴盪。
      　　
      　　水晶塔彷彿感應到主人的動搖，牆面上的術式同時亮起，強烈的乙太流動震得地面微微顫抖，光卻只是站在原地，安靜地看著他。
      　　
      　　下一瞬間，古·拉哈·提亞猛地衝到他面前。
      　　
      　　光甚至來不及反應，後頸便被狠狠勾住，古·拉哈·提亞用力將他扯低，幾乎帶著咬噬般的力道吻了上去。
      　　
      　　他重重磕上光的唇，呼吸凌亂而急促，試圖用動作堵住所有尚未說出口的話，抱緊的力道彷彿只要稍微放鬆，懷裡的人便會再次從他面前消失。
      　　
      　　光沒有推開他，古·拉哈·提亞卻越發收緊手臂，手指深深陷進他的衣料裡。
      　　
      　　他近乎兇狠地咬住他的唇瓣，淡淡的血腥味在兩人的呼吸間散開，卻沒有人退讓。
      　　
      　　直到胸口傳來窒息的疼痛，古·拉哈·提亞才終於鬆開他。
      　　
      　　兩人的距離依然很近。
      　　
      　　古·拉哈·提亞的胸口劇烈起伏，幾乎抵著光的額頭，赤紅的眼睛裡全是壓抑不住的慌亂與執拗。
      　　
      　　「你答應過我。」
      　　
      　　他的聲音劇烈顫抖，雖然從未流淚，聽起來卻像在哭泣。

      　　「你答應過，要和我一起去冒險。」

      　　光沒有反駁。

      　　「我們還沒有去看過新世界的最北方，還沒有找到那座沉在海底的遺跡。你說過，下一次要換你準備旅行用的食物，雖然我完全不認為你做得會比我好……」

      　　他說得很快，快得像是只要稍微停頓，那些刻意拼湊出的未來就會立刻碎裂。

      　　「等水晶塔穩定下來，我們可以往南走，那裡應該還保留著以前的航線，或許能找到一艘能用的船。你不是一直想知道，世界盡頭之外還有什麼嗎？」

      　　光看著他。

      　　古·拉哈·提亞努力笑了一下。

      　　「這次不需要拯救世界，也不用回應任何人的請求。只有我們兩個。」

      　　「拉哈。」

      　　「所以，哪裡都不要去。」

      　　他的笑容終於消失了。

      　　那雙紅色的眼睛裡，只剩下近乎哀求的執拗。

      　　「拜託你，留在我身邊。」

      　　「剩下的事情，我會想辦法。」

      　　他沒有等待回答，而是轉過身，重新啟動控制臺上的術式，語氣重新恢復了平靜。

      　　「今天帶回來的水晶不太穩定，我得重新調整輸送效率，你先回去休息吧。」

      　　光站在他身後。

      　　「拉哈。」

      　　「等處理完這裡，我再去找你。」

      　　「……」

      　　「下一次的路線，我已經想好了。」

      　　古·拉哈·提亞低著頭，不肯再看他。
      　　
      　　光沉默了很久，最後只是輕輕嘆了一口氣。
      　　
      　　「好。」
      　　
      　　他走到古·拉哈·提亞身後，伸出泛著微光的手臂，輕輕將他擁進懷裡。
      　　
      　　神明的擁抱沒有溫度，也沒有活人的心跳，可那已經是如今的光所能給予他，唯一的安慰。
      　　
      　　古·拉哈·提亞沒有回頭，也沒有掙開。
      　　
      　　那個擁抱持續了片刻，直到光緩緩鬆開手，腳步才逐漸遠去。
      　　
      　　大廳裡再也感覺不到那人的氣息，古·拉哈·提亞撐在控制臺上的手才慢慢收緊。

      　　亞拉戈的文字在他眼前流動。

      　　一行又一行，全都變得模糊不清。
  - title: 囚籠 - 下
    body: |-
      　　夜晚的水晶塔比白日更加寂靜。

      　　枯竭的大地早已不再適合居住。塔外沒有燈火，也沒有旅人，只有塔身散發出的幽藍光芒，照亮荒原上層層堆積的灰燼。

      　　古·拉哈·提亞最後還是睡著了。

      　　他伏在控制臺旁，身上只披著一件薄毯。即使在睡夢中，眉頭也始終緊蹙，手指攥著衣角，彷彿只有這樣才能尋得一絲安全感。

      　　光站在不遠處，靜靜望了他很久。

      　　成為水晶塔的終端之後，古·拉哈·提亞已經不需要像普通人那樣頻繁休息，可或許他的心早已承受了太多，那些無法向光訴說、也尋求不到出口的疲憊，只會隨著他們的旅途年復一年，逐漸加重。

      　　光走到他身旁，替他將滑落的薄毯重新蓋好。

      　　古·拉哈·提亞似乎察覺到什麼，手指微微動了一下。

      　　「光……」

      　　他在夢裡低聲喚著。

      　　光輕輕握住他的手，俯下身，吻過他的頭頂。

      　　蠻神的身軀散發著微弱的光暈，柔和地映照在古·拉哈·提亞臉上。
      　　
      　　等到他的呼吸重新平穩，光才慢慢鬆開手。

      　　水晶塔最外層的門扉在他的意志下無聲開啟。背對著塔內的微光，他獨自走進黑暗的荒原。

      　　夜風捲起地上的灰燼。

      　　離開塔的庇護後，四周的乙太立刻變得稀薄，可他的身軀仍散發著穩定而強大的光，像是永遠不會熄滅的炬火。

      　　也像一個足以吞噬周圍一切的災厄。

      　　光沿著塔外走了一段距離。

      　　不久後，他便停下腳步，將視線轉向前方焦黑的岩石後。
      　　
      　　那裡藏著兩道再熟悉不過的氣息。

      　　「出來吧。」

      　　荒野裡起初沒有回應。

      　　光無奈地笑了笑。

      　　「再不出來，我就要把你們當作敵人了。」

      　　話一落，岩石後方終於傳來細微的動靜。

      　　最先走出來的是阿爾菲諾。

      　　距離上次分別，他已經長高了許多。

      　　曾經略顯稚嫩的輪廓完全褪去，銀白色的長髮束在身後，身上的衣袍帶著些許破損，顯然是經過了一段時間的旅行。

      　　阿莉塞緊跟在他身旁，她同樣比記憶中高了不少，手中握著細劍，劍刃卻仍停留在鞘裡。

      　　光打量著他們，眼底浮現一點極淡的笑意。

      　　「你說得沒錯，精靈族確實長得很快。」

      　　兩人的動作同時停頓。

      　　阿爾菲諾的嘴唇微微顫抖，他彷彿用盡全力壓抑著自己，才沒有喊出那個熟悉的稱呼，垂在身側的肩膀卻仍止不住地發顫。

      　　光看向他們空無一人的身後，語氣依然平和。

      　　「看來是瞞著艾斯蒂尼安來的，不然，他不可能放任你們兩個獨自靠近水晶塔。」

      　　阿莉塞抬起頭。

      　　「我們已經不是小孩子了。」

      　　她的眼眶有些泛紅，神情卻依舊倔強。

      　　「我們來這裡，是有必須完成的事。」

      　　光望著她。

      　　「什麼事？」

      　　荒野的風從三人之間吹過。

      　　阿爾菲諾的手指緊緊握住賢具的控制環，卻始終沒有將武器展開。

      　　很久之後，他才艱難地開口。

      　　「討伐蠻神。」

      　　光安靜了一瞬。

      　　隨後，他低低笑了一聲。

      　　那笑意裡沒有譏諷，也沒有怒意，只剩下一種難以言明的深沉無奈。

      　　「嘴上說著要來討伐我，結果連武器都沒有拔出來？」

      　　阿莉塞冷冷地迎上他的目光。

      　　「你不也一樣嗎？」

      　　她的聲音繃得很緊。

      　　「明明有那麼多機會可以殺了我們。」

      　　「只要除掉拂曉血盟，就不會再有人來妨礙你們了。」

      　　光沒有回答，一雙眼睛靜靜地凝視著她。

      　　阿爾菲諾的臉色蒼白，卻依然強撐著身體，嘗試尋求對話的可能。

      　　「拉哈當年，明明是為了不讓水晶塔的力量被惡人利用，才選擇封閉塔門，獨自陷入沉睡。」

      　　他的手緩緩握緊。

      　　「你也是。為了保護這片大地，你一次又一次帶領我們，討伐了無數蠻神，阻止那些被祈願與力量吞噬的存在傷害更多人。」

      　　他的聲音逐漸沙啞，最後幾乎是嘶吼著劃破黑夜。

      　　「可是如今的你們，不正是在傷害過去拼盡性命守護的一切嗎！」

      　　質問一次次迴盪在空曠的荒野，而後重新陷入寂靜。

      　　阿莉塞越過兄長，向前走了一步，她的眼淚在眼眶中打轉，卻倔強地不肯落下。
      　　
      　　「我是來解救我所憧憬的人，解救我一直追隨的身影。」

      　　「也是來救拉哈，解救我們曾經最可靠的夥伴。」

      　　提及那名字的瞬間，周圍的風停了。

      　　龐大的力量毫無預兆地降臨。

      　　焦黑的大地向下龜裂，空氣中的乙太被強行抽離，無數由光凝聚而成的武器幻影，在光身後緩緩展開。

      　　阿爾菲諾渾身一震，立刻擋到妹妹身前，賢具在同一時間張開，防護障壁在兩人周圍浮現，卻在那股威壓之下發出不堪重負的震鳴。

      　　阿莉塞怔怔望著眼前的人。

      　　光抬起手，一柄長劍在他掌中凝聚，劍尖正指著他們兩人。
      　　
      　　「我不是你們曾經認識的那個人。」

      　　他的聲音依舊平靜。

      　　「我的身體由乙太構成，力量來自無數人的信仰。那些人祈求我守護世界、消滅災厄，成為永遠不會倒下的英雄。」

      　　劍身上的光芒愈發耀眼。

      　　「可是現在支撐著我的，早已不是他們的願望。」

      　　光抬起眼，那雙眼睛裡沒有屬於蠻神的狂傲，只有深不見底的溫柔與哀傷。

      　　「而是拉哈的願望。」

      　　阿爾菲諾的呼吸一滯。

      　　「這裡是他賭上一切，也不願放手的世界。」

      　　光永遠不會忘記，自己剛成為蠻神的那一刻。

      　　來自整個世界的祈願過於龐大，體內充沛到近乎失控的力量不斷爆發。那時的他還沒有自我，只是一個被無數願望驅使、為了回應呼喚而不得不破壞一切的災厄。

      　　是古·拉哈·提亞在乙太的風暴中遍體鱗傷，一次又一次地呼喚他。

      　　一次又一次，以自己的記憶與願望，重新塑造那具混亂的身軀。
      　　
      　　是他不肯放棄的執念，與整個世界的祈願對抗的堅毅，才扭轉了蠻神的模樣。

      　　直到光終於擁有他們共同的回憶，尋回屬於某一個人的聲音，也終於在茫然之中，第一次喚出了那個名字。

      　　「拉哈。」

      　　他至今仍記得，當時古·拉哈·提亞臉上的表情。

      　　那是從絕望中重新尋得希望，是失而復得後幾乎無法承受的欣喜。

      　　世間所有言語，都不足以形容那一刻。

      　　光無法背叛那個人，也不願意這麼做。

      　　他驅使著身後的武器，一柄接著一柄對準了阿爾菲諾與阿莉塞，大地因那股力量劇烈震動，遠處的水晶塔也發出低沉的轟鳴。
      　　
      　　他渾身散發著光，仰起頭，彷彿是一位真正的神祉。

      　　「即使這份願望與世人的祈求背道而馳。」

      　　「即使有一天，我會成為吞噬這片大地的災難。」

      　　「只要拉哈仍希望我留在這裡，我就會守護他的願望。」

      　　他的手指緩緩收緊。

      　　「直到最後一刻。」

      　　阿爾菲諾望著他，依然不放棄希望。

      　　「即使那會讓拉哈更加痛苦嗎？」

      　　光的目光微微動搖。

      　　「你明明知道，他並不是真的想看著世界毀滅。」阿爾菲諾的聲音顫抖著，「他只是無法再承受失去你一次。」

      　　「我知道。」

      　　「那你還──」

      　　「正因為知道，我才必須要留下來。」光打斷了他，「他已經失去過太多次了。」

      　　長劍上的光芒微微顫動。

      　　「你們不明白。」

      　　「如果我在這裡消失，他不會停下來。」

      　　光看向遠處的水晶塔。

      　　「他會毫不猶豫地重新啟動時空跳轉，在看不見盡頭的旅途中，一次又一次尋找能夠拯救我的可能，哪怕耗盡水晶塔、耗盡自己，也不會回頭。」

      　　光垂下眼。

      　　「我不會讓他這麼做。」

      　　「這一次，至少在他自己願意放手以前，我不會替他作出決定。」

      　　阿莉塞的眼淚終於落了下來。

      　　「那我們呢？」

      　　光看向她，眼神並未染上猶豫。

      　　「即使是你們，我也不會退讓。」

      　　那些過去，如夢似幻般從腦海中掠過。

      　　拂曉血盟曾無數次與他並肩作戰。

      　　遭受攻擊時，是尤里安傑及時將治癒的星光落在他身上。

      　　帝國兵將槍口對準古·拉哈·提亞時，是桑克瑞德毫不猶豫地擋在前方。

      　　雅·修朵拉總會以冷靜的語調，為他們解明那些無人探究的知識。

      　　塔塔露與可露兒一次次替他們準備好出行的裝備，微笑著送他們踏上旅途，也等待他們平安歸來。

      　　還有許許多多，曾在旅途中相識、並肩、歡笑與告別的人。

      　　光從來沒有忘記那一切。

      　　可是為了守護那唯一一個無法再次承受失去的人，他必須放棄其餘的一切。

      　　光身後的武器幻影逐漸淡去，壓在荒原上的威壓也隨之消散，夜風重新流動，捲起三人腳邊的灰燼。

      　　他手中的長劍化為細碎的光點。

      　　「這是最後一次警告，不要再靠近水晶塔。」

      　　他轉過身，朝水晶塔的方向走去。

      　　「放棄我們吧，這是我唯一的答案。」

      　　阿莉塞站在原地。

      　　她沒有追上去，也沒有拔劍，只是望著那道逐漸遠去的背影，肩膀抑制不住地顫抖。

      　　阿爾菲諾低垂著頭，緩緩握緊賢具的控制環。

      　　「那麼，我們就繼續戰鬥。」

      　　光的腳步停了一瞬。

      　　阿莉塞抬起頭，注視著兄長，而阿爾菲諾的聲音依然顫抖，眼神卻已不再動搖。

      　　「一次不行，就再來一次。」

      　　「即使一次又一次失敗，我們也會繼續戰鬥下去。」

      　　荒野的風捲過他的衣袍，賢具在身後逐一展開，發出微弱而堅定的光。

      　　「直到我們贏為止。這不是你教給我們的嗎？」

      　　夜色之中，只剩下水晶塔低沉的運轉聲。

      　　過了很久，光才低聲回答。
      　　
      　　「是嗎？我不記得了。」

      　　那句話輕得幾乎像一聲嘆息。
      　　
      　　他沒有再停留。

      　　那道發著微光的身影一步步走向水晶塔，最終消失在緩緩閉合的門扉之後。

      　　水晶塔的大門在光身後緩緩闔上。
      　　
      　　他才剛踏入中央大廳，一道身影便從階梯上快步衝了下來。
      　　
      　　「你去哪裡了？」
      　　
      　　古·拉哈·提亞的聲音裡滿是掩飾不住的慌亂。
      　　
      　　他的頭髮凌亂，衣襟也沒有整理好，赤紅色的眼睛裡全是尚未褪去的驚惶。
      　　
      　　「我醒來之後找不到你，塔裡也感覺不到你的氣息。你為什麼要關閉外層的感應術式？你是不是──」
      　　
      　　他的聲音戛然而止。
      　　
      　　光已經走到他面前，伸手將他擁進懷裡。
      　　
      　　「光……？」
      　　
      　　光沒有立刻回答。
      　　
      　　他只是收緊手臂，讓古·拉哈·提亞靠在自己胸前。
      　　
      　　這具由祈願塑造而成的身體沒有真正的心跳，也沒有活人的溫度，可光知道，這仍是最快能夠安撫他的方式。
      　　
      　　果然，片刻之後，古·拉哈·提亞便將臉埋進他的肩窩，顫抖的手臂緊緊環住了他。
      　　
      　　「我只是出去走走。」
      　　
      　　「為什麼不告訴我？」
      　　
      　　「你睡著了。」
      　　
      　　「那也可以叫醒我。」
      　　
      　　古·拉哈·提亞抓緊他的衣襟，指節因為用力而泛白。
      　　
      　　「我以為你消失了。」
      　　
      　　他的聲音愈來愈輕。
      　　
      　　「我以為你離開了這裡，再也不會回來……」
      　　
      　　最後幾個字幾乎消失在兩人交疊的呼吸裡。
      　　
      　　光閉上眼睛。
      　　
      　　黑暗之中，荒野上的阿爾菲諾與阿莉塞再度浮現在眼前。
      　　
      　　還有那片逐漸枯死的大地、水晶塔終有一天會耗盡的力量，以及那個他們始終不願真正面對的結局。
      　　
      　　他知道這場夢不可能永遠持續，也知道自己此刻說出的每一句話，都只是在將夢醒的時刻推得更遠一些。
      　　
      　　可最後，他仍然只是抬起手，輕輕撫過古·拉哈·提亞凌亂的頭髮。
      　　
      　　「不會的。」他的聲音很輕，「我不會走。」
      　　
      　　古·拉哈·提亞沒有抬頭，濕意逐漸浸染他的前胸。
      　　
      　　「你保證？」
      　　
      　　光將下顎抵在他的髮頂，緩緩點了點頭。
      　　
      　　「我保證。」
      　　
      　　他的手臂再一次收緊。
      　　
      　　「我哪裡都不會去。」
      　　
      　　古·拉哈·提亞緊繃的手指終於稍稍鬆開。
      　　
      　　水晶塔仍在運轉。
      　　
      　　無數幽藍色的光沿著塔壁緩慢流動，從枯竭的大地汲取力量，維持著一場不知何時才會醒來的長夢。
      　　
      　　而兩人只是站在夢的中央，彼此擁抱著。
      　　
      　　那些他們曾經一同談論過的明天，誰也沒有再提起。
  - title: 囚籠 - 小短破車
    body: |-
      　　古·拉哈·提亞伏在光的背上，細細啃咬著他的頸側。
      　　
      　　柔軟的紅髮垂落下來，時而擦過光的耳尖，時而隨著呼吸落在他的肩頭。齒尖沿著後頸緩慢游移，濕潤的吻貼著突起的骨節一路向下，反覆落在那些早已泛紅的痕跡上。
      　　
      　　他彷彿恨不得將懷中的人一寸寸吞入腹中，藏進任何人都無法觸及的地方。
      　　
      　　古·拉哈·提亞自後方環住光，將他牢牢困在自己與床榻之間，下身的頂弄依然在持續，但每當光的身體往前，貓魅的手掌便會覆上他緊抓床單的手背，手指嵌進其中的縫隙。
      　　
      　　光側過臉，臉頰陷在凌亂的枕褥之中，輕輕喘息著。
      　　
      　　他能清楚感覺到覆在身後的重量，感覺到古·拉哈·提亞情動的呼吸落在頸側，感覺到那雙手如何沿著腰線扣住自己，也感覺得到彼此仍緊密相貼的下身。
      　　
      　　所有觸感都如此清晰，但卻唯獨沒有溫度。
      　　
      　　就連古·拉哈·提亞埋在他頸間，理應灼熱的吐息，也只留下氣流拂過的細微觸感。
      　　
      　　光眨了眨泛著水霧的眼睛。
      　　　
      　　從這個角度，他什麼也看不見。
      　　
      　　他輕輕撐起手臂。
      　　
      　　古·拉哈·提亞察覺到他的動作，埋在頸間的吻隨之一頓。
      　　
      　　「怎麼了？」
      　　
      　　光沒有回答來自沙啞嗓音的疑問。
      　　
      　　他將掌心覆上古·拉哈·提亞扣在腰側的手腕，示意對方稍微放鬆，而後就著兩人仍緊貼在一起的姿勢，緩慢地轉過身。
      　　
      　　後穴隨著動作猛然緊縮，光聽見他的戀人倒吸一口氣，埋在自己體內的灼熱又脹大了些，還留在裡頭的白濁甚至隨著動作，從下身被擠了出來，染濕兩人身下的床單。
      　　
      　　「你──」
      　　
      　　古·拉哈·提亞的聲音驟然繃緊，赤色的眼睛困惑地注視著他。
      　　
      　　光仰躺在床榻上，髮絲散落在枕間，他抬起蔚藍的眼，滿足地望向眼前的貓魅。
      　　
      　　他的戀人呼吸仍有些凌亂，眼瞳因錯愕而微微睜大，額前的髮絲或是凌亂地垂落，或是與汗水一同附著在前額上，眼尾泛著尚未褪去的紅，方才藏在光背後的所有情緒，此刻全都無處遮掩。
      　　
      　　迷戀、恐懼，以及那份幾乎足以將兩人一同吞噬的佔有。
      　　
      　　光伸出手，指尖穿過垂在兩人之間的紅髮，輕輕碰了碰古·拉哈·提亞的臉。
      　　
      　　雖然光感受不到溫度，可他在那雙寶石般的紅眼裡，只有找到自己唯一的倒影。
      　　
      　　「光……？」
      　　
      　　「想看著你。」
      　　
      　　古·拉哈·提亞的目光輕輕顫了一下。
      　　
      　　那雙手仍然緊扣在光的腰間，神情卻在短暫的怔愣後，漸漸浮現出一種幾乎令人心疼的歡喜。　　
      　　
      　　「那就別移開目光。」
      　　
      　　他低聲宣告，嗓音沙啞得不成樣子。
      　　
      　　光抬起上身，吻住了他。
      　　
      　　那是允諾的訊號。
      　　
      　　古·拉哈·提亞怔了一瞬，隨即重新將光壓回床榻，環在腰間的手臂驟然收緊，那個吻也很快失去最初的試探，變得急切而深重。
      　　
      　　光沒有閉上眼睛，他隔著近得幾乎無法聚焦的距離看著古·拉哈·提亞，口中的呻吟被越來越加快的衝撞逼得破碎凌亂。
      　　
      　　他忍不住一次又一次呼喊他的名字。
      　　
      　　而回答他的，是如狂風暴雨般將他淹沒的渴望。
  - title: 囚籠 - Bad End 結局
    body: |-
      　　時間並不允許他們就這麼逃避下去。

      　　最初，光並未察覺異樣。

      　　這具由祈願與龐大乙太構成的身體不會真正疲憊，也不會在漫長的黑夜中感受到睡意，即使閉上眼睛，他也不會墜入夢境，只是安靜地聽著水晶塔深處流動的聲音，等待身旁的人醒來。

      　　不需要睡眠的蠻神，之所以仍會在夜裡躺上床榻，不過是為了陪伴古·拉哈·提亞。

      　　他總要確認光就在觸手可及的地方，才能真正放鬆下來。

      　　有時是握著他的手，有時則從身後環住他的腰，將臉埋在他的肩頸間。

      　　光並不會拒絕。

      　　他會保持著同樣的姿勢，任由古·拉哈·提亞緊緊依偎著自己。偶爾在那人睡得不安穩時，抬手撫過微亂的紅髮，直到緊皺的眉心稍稍舒展。

      　　他以為這樣的夜晚會一直持續下去。

      　　直到某一次，環在腰間的手臂忽然鬆開。

      　　那時塔內仍是一片昏暗。

      　　光沒有睜眼，只感覺到身旁的床榻微微下陷，又很快恢復平整。

      　　古·拉哈·提亞坐了起來。

      　　他的呼吸很輕，卻比平時更加急促，過了片刻，衣料摩擦的細碎聲響傳來。
      　　
      　　黑暗裡的他抬起手，用力按住了胸口。

      　　光以為他只是做了惡夢。

      　　他正想張開眼、出聲安撫，古·拉哈·提亞卻先一步掀開被褥，赤足踩上冰冷的地面。

      　　黑影在床邊停留了一會，像是在確認光是否甦醒，隨後，腳步聲悄然遠去。

      　　房門開啟，又被極輕地闔上。

      　　光睜開眼睛。

      　　昏暗的水晶光芒映在空蕩的床側，只留下被褥間尚未恢復的凹痕。

      　　那一夜，他沒有跟上去，只是在床上靜靜地等著。

      　　那人在天亮前回到房間，重新躺回他身旁，像是什麼也沒有發生，只是抱住他的手，力道比往常更加用力了些。

      　　後來幾次，光仍舊沒有出聲。

      　　古·拉哈·提亞總是在夜深之後突然醒來。

      　　有時只是坐在床沿，捂著胸口，許久才勉強平復呼吸；有時則會迅速離開房間，直到很久之後才回來。
      　　
      　　而狀況逐漸惡化到不再僅限於夜晚發作。

      　　他的臉色開始變得蒼白，握著法杖的手偶爾會無法控制地顫抖，水晶塔的術式也開始頻繁出現細微波動，彷彿有另一股不屬於此處的力量，正在他的體內反覆衝撞。

      　　光知道那股力量來自何處，那是自己的乙太所造成的影響。

      　　蠻神的存在本就會扭曲周圍的環境。

      　　凡人若長時間停留在過度濃厚的乙太之中，不僅身體會受到影響，連靈魂也可能逐漸改變，最終化為被精煉的存在。

      　　古·拉哈·提亞曾與水晶塔融合，又將自身的靈魂與另一個時代的自己重新結合。旁人或許無法承受的力量，他起初能憑藉那副特殊的身體勉強調節。

      　　可辛苦維持的平衡，隨著時間的推進被逐漸打破。

      　　那天夜裡，身旁的人再次坐起身時，光沒有繼續躺在原處。

      　　他等到房門重新闔上，才無聲地起身，跟隨那道腳步穿過水晶塔幽暗的長廊。

      　　古·拉哈·提亞走得很慢，一手始終緊緊按著胸口，另一隻手扶著牆面。

      　　他沒有前往塔內的中樞，而是拐進一處早已棄置的側廊。

      　　光停在轉角後方。

      　　下一刻，他聽見一聲壓抑的嗆咳，隨後是肉身撞到硬物的聲響。

      　　古·拉哈·提亞踉蹌著跪倒在地。

      　　他一手撐住冰冷的水晶地面，肩膀劇烈顫抖，像是有什麼東西正在從身體深處強行撕裂而出。

      　　又一聲乾嘔，隨後是大量液體落地的啪嗒聲。

      　　微亮的液體自他的唇間落下。

      　　那不是鮮血，也不是凡人的身體應當吐出的任何東西。

      　　濃稠的乙太一滴滴落在地面，泛起與光身上相同的淡白色光芒，過於純粹的能量並未止息，還在從他的喉間不斷嘔出。

      　　光站在陰影裡，瞳孔止不住地搖曳。

      　　他太熟悉這個情況。
      　　
      　　這與當初在第一世界自己，身體在吸收巨量的光之力之後，即將被撕裂靈魂的狀況一模一樣。

      　　古·拉哈·提亞再次彎下身，痛苦地乾嘔著，更多不屬於他的光芒自喉間溢出，沿著下頷落在衣襟與地面。

      　　他的手指痙攣般緊握，肺腑發出恐怖的窒息聲，像是連呼吸都變成一種折磨。

      　　光下意識向前踏出半步。

      　　可就在此時，古·拉哈·提亞終於勉強抬起頭。

      　　他以手背擦去唇邊殘留的光，閉上眼睛，極慢地調整著呼吸。

      　　一次又一次。

      　　直到急促的喘息稍微平緩，他才扶著牆面重新站起來。

      　　他的雙腿仍在發抖，卻還是拖著沉重的腳步，走向側廊盡頭的一座小型控制台。
      　　
      　　古·拉哈·提亞的手放上控制台，緩慢卻熟悉地操作著，隨著他的指令，塔內的光芒隨之一震，水晶塔發出低沉的共鳴。

      　　龐大的力量自四面八方湧入他的身體。

      　　古·拉哈·提亞猛然仰起頭，喉間溢出一聲壓抑的悶哼，赤紅色的眼瞳瞬間被水晶的光芒照亮，細密的結晶紋路沿著手腕短暫浮現，又很快被強行壓下。

      　　他咬緊牙關，手沒有離開亞拉戈的控制裝置。

      　　塔的力量正強行衝撞著體內失衡的乙太。

      　　過了很久，古·拉哈·提亞的呼吸才終於恢復正常。

      　　他鬆開控制台，身體晃了一下，幾乎再次跪倒。

      　　但他只是扶住牆面，低頭整理被冷汗浸濕的衣襟，確認自己看起來沒有異狀後，才轉身離開控制台。

      　　光退回轉角後方，渾身止不住地顫抖。

      　　他知道自己應該立刻回到房間，裝作毫不知情地迎接對方的歸來。
      　　
      　　但他做不到。
      　　
      　　他怎麼能眼睜睜看著古·拉哈·提亞日復一日地遭受侵蝕，漸漸地變得衰弱。
      　　
      　　即使這是他期望的結果、他盡力維護的謊言，光也不能放任一切就這麼下去。

      　　即使他是現今最為強大的蠻神，但唯獨這件事，他束手無策。
      　　
      　　他知道自己的臉頰留下了什麼似眼淚般的液體，但他急忙咬緊牙關，努力不讓自己發出聲音。

      　　可側廊太過寂靜。
      　　
      　　聽見動靜的古·拉哈·提亞，腳步在不遠處停了下來。

      　　光猛然抬起頭，發現自己躲藏的倒影，正照映在古·拉哈·提亞眼前的水晶壁上。

      　　他臉上的神情已經完全崩裂，赤紅色的眼睛怔怔望著站在角落裡的光。

      　　「光……？」

      　　光立刻別開臉，古·拉哈·提亞卻在下一刻快步走來。

      　　「你怎麼會在這裡？」

      　　他的聲音裡帶著無法掩飾的慌亂。

      　　光沒有回答。

      　　古·拉哈·提亞伸手想碰他的臉，卻在看見自己散發水晶光芒的指尖時，動作驟然停住。

      　　光的目光落在他的手上，震驚地倒吸一口氣。
      　　
      　　過度使用水晶塔的力量，導致侵蝕遠比他們預料的時間還早發生。

      　　他們之間，一切已經無法隱瞞。

      　　「你看見了？」

      　　古·拉哈·提亞低聲問。

      　　光仍然不說話，只是眼淚再次無聲地滑落。
      　　　
      　　古·拉哈·提亞看見他破碎的眼神，連忙勉強露出安撫的神情。

      　　「這沒什麼。」
      　　
      　　「拉哈……」
      　　
      　　「真的沒事，我只是在調節自己體內的乙太。」

      　　光抬起手，指尖輕輕碰過他唇邊尚未擦乾淨的光痕。

      　　古·拉哈·提亞的臉色驟然蒼白。

      　　「我該離開這裡了。」
      　　
      　　光咬著牙，五臟六腑彷彿被無形的力量狠狠緊握，疼得他發不出聲音。
      　　
      　　可為了保護他，他只能這麼做。
      　　
      　　「蠻神的乙太只會傷害你，我不能再留在你的身邊。」
      　　
      　　「不、聽我說，事情不是你想的那樣──」
      　　
      　　「再見了，拉哈。」
      　　
      　　光深深地望了他一眼，隨後堅毅地垂下頭、往後退了一步。

      　　在那瞬間，古·拉哈·提亞的神情忽然靜了下來，方才還殘留在眼底的慌亂，一點一點沉入更深的地方。

      　　那雙赤紅色的眼睛微微瞇起，瞳孔在幽暗的水晶光芒中驟然豎直，化作一道細長而危險的黑線。

      　　「你是想要離開我嗎？」

      　　他的聲音很輕，甚至沒有絲毫怒意，可光卻在那一刻感受到某種難以言喻的寒意。

      　　「你會死的！」

      　　光幾乎是痛苦地喊出聲。

      　　「再這樣下去你真的會死。拉哈，我不能眼睜睜看著你因為我變成這樣！」

      　　古·拉哈·提亞安靜地看著他。

      　　許久之後，他忽然垂下頭，散亂的紅髮遮住了他的眉眼。

      　　只有一抹幽微的紅光，從髮絲的縫隙間緩慢亮起。

      　　下一刻，一陣突如其來的虛弱感席捲全身。

      　　身體的力量像是被某種看不見的東西瞬間抽離，光的手指無力地鬆開，膝蓋也隨之滑向地面。

      　　「拉哈……？」

      　　跪坐在地的他試圖重新站起來，卻連抬起手臂都變得異常困難。

      　　細密的金色術式從腳下浮現。

      　　一圈又一圈，古老而複雜的亞拉戈文字沿著地面迅速蔓延，轉眼便將光籠罩其中。

      　　側廊兩旁原本沉寂的水晶接連亮起。

      　　牆壁深處傳來沉重的共鳴聲，像是某頭沉睡了數千年的巨獸，終於在此刻睜開眼睛。

      　　光勉強抬起頭，震驚地發現整座水晶塔開始運轉。

      　　龐大的乙太沿著塔身深處的脈絡奔流，震動著牆面與地板，那些原本只屬於古代皇族的權限，此刻正毫無保留地回應著古·拉哈·提亞的意志。

      　　光芒乍現，光的身體被無形的力量牢牢壓住。

      　　他試圖反抗，力量卻在接觸術式的瞬間被強行切斷，淡白色的光芒從他的身側逸散，又被那些亞拉戈術法迅速吸收。
      　　
      　　他激烈地反抗了起來。

      　　這不是普通的拘束術，而是專門用來壓制蠻神的機制。

      　　「拉哈……停下來……拜託……！」

      　　光的聲音已經變得虛弱。

      　　古·拉哈·提亞緩緩抬起頭。

      　　那雙眼睛仍散發著幽暗的紅光，神情卻平靜得近乎溫柔。

      　　「我本來不願意這樣做。」

      　　古·拉哈·提亞站起身，朝光走來，金色術式映在他的衣襬與臉側，將那張熟悉的面容切割成明暗交錯的輪廓。
      　　
      　　他開始水晶化的手指發出碎裂的聲音，因驅使過於龐大的術式，而化成細碎的晶體、不斷崩裂。

      　　「但我不會讓你離開我。」

      　　他的腳步停在光面前。

      　　「這是亞拉戈過去控制鬥神的機制，不可能掙脫的。」

      　　光艱難地伸出手，想要碰觸他，手臂卻只抬起短短一瞬，便重新無力垂落。

      　　意識正在迅速遠去。

      　　眼前的身影逐漸變得模糊，水晶塔的共鳴也像隔著深水傳來，一聲比一聲遙遠。

      　　「不要……」

      　　光的呼喚幾乎已經微弱地聽不見。

      　　「拉哈……」

      　　古·拉哈·提亞在他面前跪下。

      　　他伸出手，極其輕柔地接住光癱軟的身體，將他重新抱進懷裡。

      　　那個擁抱依舊和過去一樣。

      　　小心，珍惜，甚至帶著近乎虔誠的眷戀。

      　　光的視野越來越模糊。

      　　他只能感覺到古·拉哈·提亞的手掌輕輕撫著自己的臉，指腹擦去尚未乾涸的淚痕。

      　　「別怕。」

      　　他的聲音近在耳畔，溫柔得如同每一個相互依偎的夜晚。

      　　「這樣……」

      　　他的指尖沿著光的臉側緩慢撫過。

      　　「我們就能永遠在一起了。」

      　　話音落下時，光最後一絲意識也被黑暗吞沒。

      　　金色術式在水晶塔深處層層收攏，然後嘎然而止，連同其中微弱的光一同吞噬。
  - title: 囚籠 - 伊修加爾德篇
    body: |-
      　　庫爾札斯的風依舊寒冷，雪也依然終年不化，然而所有人都能感覺到，有某種比嚴冬更加沉寂的事物正逐漸吞噬這片土地。
      　　
      　　最先枯竭的是河流，接著是農田、牧草，以及原本在積雪之下仍會緩慢流動的大地乙太。

      　　失去棲息地的魔物開始向人煙聚集之處遷徙。

      　　牠們踏過荒蕪的原野，追逐城鎮中僅存的溫度與食物，而牠們所攻擊的，則是同樣被迫離開家園的難民。

      　　最終，人與野獸一同湧向最後的堡壘──伊修加爾德。
      　　
      　　無論是祈求一處容身之所，還是只剩下飢餓的本能，這些都給雪國皇都帶來沉重的負擔。

      　　大審門前的雲廊已經連續遭受了好幾日的襲擊。

      　　遍布橋面的巨大裂痕尚未來得及修補，便又被魔物的利爪與沉重身軀反覆踐踏。騎士們輪番駐守，受傷者才剛被抬往後方，填補空缺的人便已經握緊武器，重新站上染血的石磚。

      　　沉重的鐘聲穿過風雪。

      　　「左翼！守住左翼！」

      　　艾默里克的聲音幾乎被魔物的咆哮淹沒。

      　　他親自站上前線，揮劍斬開撲向身側騎士的獸爪，一道道鮮血濺上盔甲，尚未來得及喘息，前方的防線便傳來轟然巨響，一頭形似巨熊的魔物撞碎路障，將數名重騎士連人帶盾掀飛出去。

      　　前方的騷動未平，後方又傳來驚叫，更多黑影從風雪中浮現，牠們沿著橋面奔來，數量多得幾乎望不見盡頭。

      　　艾默里克握緊劍柄。

      　　他身邊還能站立的騎士已經不足原先的一半，前線的副官也生死未卜，城內的兵力被分散到各處安置難民，醫療所也早已人滿為患。縱使立刻派人求援，援軍恐怕也無法及時抵達。

      　　可這是最後的防線。

      　　一旦失守，那些魔物便會直接闖入伊修加爾德，而他們的背後，正是無處可去的皇都子民。

      　　「重整陣形！」

      　　艾默里克咬著牙，高聲下令。

      　　騎士們撐起破損的盾，再度聚集到他身旁，長槍從盾陣的縫隙間探出，指向迎面而來的獸群。

      　　魔物奔跑所引起的震動沿著橋面傳來。

      　　十步。

      　　五步。

      　　最前方的巨獸躍上半空，陰影籠罩住整列士兵。

      　　有人下意識閉上了眼睛，高舉著的長槍止不住地顫抖，然而預期中的撞擊並未落下，取而代之的，是一道耀眼的白光，驟然劃過。
      　　
      　　一股強烈的光之力降臨在魔物與騎士們中間，光芒中央的人穩穩地架著盾，自中心而始，百倍大的厚實羽翼倏然張開，將撲向騎士們的巨獸硬生生地彈開。
      　　
      　　士兵們怔怔地抬起頭，不可置信地望著光芒中間的身影。
      　　
      　　那個背影，曾在邪龍入侵時踏上這座橋，與他們並肩作戰、也曾經為這個飽受千年戰爭折磨的國家，帶來眾人所希冀的和平。

      　　「光之……戰士……？」

      　　不知是誰先喃喃出聲。

      　　那個名字如同投入湖面的石子，迅速在騎士之間掀起漣漪。

      　　「是英雄……」
      　　
      　　「哈羅妮在上！」

      　　「英雄回來了……」

      　　有人放下了武器，有人甚至在滿是鮮血與碎石的橋面上跪了下來。

      　　光沒有看向他們。

      　　他只是張著雙翼，將所有仍然站立的騎士護在身後，魔物撞擊著那層濃厚強大的乙太，發出憤怒的嘶吼，卻無法再向前半步。

      　　在他身旁，另一道身影自扭曲的空間中緩緩浮現。

      　　那人披著深色斗篷，兜帽壓得很低，遮住了大半張臉，他一手握著法杖，尖端散發出璀璨的光芒。

      　　魔物群再次衝向光翼，法杖在同一時間重重敲落，金屬與石塊撞擊的清脆聲響迴盪在整座長橋之上。

      　　橋面的積雪在一瞬間停止飄動。

      　　最前方的魔物仍維持著撲擊的姿勢，皮毛與血肉卻迅速蒙上一層灰白，石化的痕跡從四肢向軀幹蔓延，短短幾秒間，蔓延的法術便將所有湧上長橋的獸群化作沉默的石像。

      　　下一刻，無數裂痕同時爬過石像表面，轟然巨響接連響起，魔物們在眾人眼前應聲碎裂，化為灰白色的殘片，被風捲入橋下方翻騰的雲海。

      　　方才還充斥著咆哮與慘叫的戰場，陷入一片死寂。

      　　見狀，光收起盾，緩緩落在橋面上，他的靴底踩過融化的雪水，沒有留下任何聲音。

      　　騎士們望著他，那目光裡有恐懼、有茫然，也有近乎瘋狂的喜悅。

      　　一名年輕騎士丟下長槍，踉蹌地向前走了兩步。

      　　「英雄……」

      　　他的聲音顫抖得不成樣子。

      　　「是您聽見我們的祈禱了嗎？」

      　　另一人也跟著跪下。

      　　「是神蹟。」

      　　「英雄降臨了……」

      　　「他回來拯救伊修加爾德了。」

      　　那些聲音逐漸匯聚在一起。

      　　光站在眾人的祈禱之中，神情卻始終平靜，他並未給予人們任何回應，只是靜靜地站在身著兜帽的同伴身旁，仰頭望著落在眾人最後方的皇都領導者。

      　　艾默里克垂下眼睛，握劍的手指因為過度用力而微微顫抖。

      　　他比在場任何人都更加熟悉那個身影，也比任何人都不願相信，他的故友早已不在人世。

      　　他記得光踏入伊修加爾德時，披風上尚未融化的雪；記得對方坐在會議室裡，面對冗長爭論時逐漸無奈的眼神；也記得那人曾在宴會上端起酒杯，對他露出溫和的笑容。

      　　正因是如此重要的人，他才不能讓任何人將眼前之物視為希望。

      　　艾默里克抬起頭，眼底已不再帶有迷惘。

      　　「拿起武器。」

      　　低沉的命令穿過人群，跪在地上的騎士紛紛茫然回首。

      　　「總騎士長……？」

      　　「我說，拿起你們的武器。」

      　　艾默里克的聲音並不大，卻清晰地壓過了所有竊竊私語。

      　　他將長劍橫在身前，劍鋒指向那道散發著微光的身影。

      　　「那不是我們的英雄。」

      　　整座長橋彷彿連風聲也停止了。
      　　
      　　光的眼神並沒有任何意外的神色，蔚藍的眼睛輕輕一眨，彷彿早就預料到這一刻。

      　　艾默里克的喉嚨一緊，但他仍強迫自己繼續說下去。

      　　「伊修加爾德的英雄早已死去。」

      　　騎士們的臉色瞬間變得蒼白。

      　　「可是他就在那裡……」

      　　「死者不會復生。」

      　　艾默里克打斷了他，即使每一個字都像割開自己的喉嚨，帶著難以吞嚥的腥甜。

      　　「依靠祈願與龐大乙太重現於世的存在，並非死而復生的人類。」

      　　他的視線越過光，落向那名握著法杖的兜帽人。

      　　「在那裡的，只有蠻神和他的信徒。」

      　　騎士之間掀起一陣混亂。

      　　「不可能……」

      　　「他剛才救了我們！」

      　　「正因如此，你們才更應保持清醒。」

      　　艾默里克厲聲喝止。

      　　他的視線轉向橋面上逐漸消散的光點，也看向遠處被冰雪覆蓋、再也無法孕育作物的土地。

      　　「大地的乙太正在枯竭，河流乾涸，魔物與難民被迫離開家園。這一切的原因，正是因為蠻神的現世。」

      　　光握著盾的手輕輕顫動了一下。

      　　艾默里克高舉武器，劍尖直指長橋盡頭的兩名身影，對他的騎士、也是對自己宣告。
      　　
      　　「無論他擁有誰的容貌、保留誰的記憶，又曾經拯救過多少人，只要他繼續侵蝕子民賴以生存的土地……」

      　　他深吸一口氣。

      　　「伊修加爾德的騎士便有責任舉起武器，將其討伐。」

      　　最前方的數名騎士面面相覷，卻依然聽令架起盾牌。

      　　方才直指魔物的整排長槍，尖端重新指向光。

      　　然而也有許多人仍站在原地，方才跪下的年輕騎士甚至張開雙臂，擋在同伴與光之間。

      　　「他救了我們！」

      　　「退下！」

      　　「他明明救了我們！」

      　　命令與反駁在橋上交錯。

      　　兜帽下的身影在一片混亂中，忍無可忍地向前踏出一步。
      　　
      　　光卻伸出手，輕輕地放在他的肩上。
      　　
      　　兜帽下的紅眼抬起，注視著朝他搖頭的光，法杖的尖端遲疑了會，終究是聽話地垂下。
      　　
      　　水晶塔的主人輕輕揮了揮手。
      　　
      　　扭曲的空間再度浮現在兩人之間，騎士們紛紛繃緊神經，卻沒有迎來預想的攻擊。
      　　
      　　空間裡浮現露琪亞昏厥的身影，光抱住她，緩緩走到那名年輕騎士面前，將人託付後便毫不猶豫地轉身，朝長橋的盡頭走去。
      　　
      　　但雙方之間再無阻礙之時，有人依然舉起了長槍。
      　　
      　　兜帽下的紅眼只來得及捕捉到一閃而過的冷光，他急忙回身、用力推開背對攻擊的光，肩膀也因此被投擲的長槍劃出一道破口。
      　　
      　　鮮血濺了出來，他的身軀踉蹌了下，一不小心失去了平衡，從長橋下墜了下去。
      　　
      　　「拉哈！」
      　　
      　　光驀然回首，凌厲的目光越過肩頭，緊緊鎖住那名出手攻擊的騎士。

      　　就在兩人身旁的瓦礫間，一面破損的鳶盾靜靜倒臥其中，盾面上的獨角獸紋章遍布裂痕，在一次次戰火的摧折下，殘破得幾乎辨不出原本的模樣。
      　　
      　　蠻神收回視線，身軀一側、跟著跳下了雲海，他緊緊抱住身著斗篷的身影，就這麼消失在眾人的眼前。
      　　　　
      　　艾默里克靜靜地注視著。

      　　他的劍仍然指著兩人消失的方向，手臂卻已經僵硬得無法動彈。

      　　過了很久，劍尖才緩慢垂落。
      　　
      　　握劍的手掌因過於用力而慘白不堪，劇烈地顫抖著。
      　　
      　　　
      　　
      　　
      　　同一時間，遙遠的水晶塔深處。

      　　治癒的光芒輕柔地覆過古·拉哈·提亞受傷的肩膀，破裂的皮肉在光中緩慢癒合，只餘下沾染在斗篷上的暗紅血跡。

      　　古·拉哈·提亞卻彷彿毫不在意。

      　　他只是靜靜望著眼前的神祇，伸手捧住他的臉頰。

      　　濕熱的舔吻一下下落在他的側臉，緩慢而溫柔，像是在安撫一頭受傷的野獸。

      　　蔚藍的眼睛微微失去焦距。
      　　
      　　他的眼底，滿是伊修加爾德的風雪，與那具殘破的鳶盾。
  - title: 囚籠 - 另一個視角的解讀
    body: |-
      　　這裡已經很久聽不見蟲鳴了。

      　　曾經潮濕的泥土乾裂成一塊塊深黑的碎片，枯草伏倒在縫隙之間，遠處的銀淚湖也失去了昔日映照星辰的光澤。

      　　光就站在離水晶塔很遠的地方。

      　　他很少獨自離開水晶塔。

      　　至少，桑克瑞德所掌握的情報是如此。

      　　所以當他穿過乾枯的石林，看見那道獨自立在斷崖邊的身影時，甚至有片刻懷疑，這是否是一個專為引他現身而設下的陷阱。
      　　
      　　就結論而言，他的直覺是正確的。

      　　將他引到不會被水晶塔主發現的距離時，那人輕輕地開口了。

      　　「上一次，阿爾菲諾和阿莉塞沒有把話帶回去嗎？」

      　　夜風恰好從兩人之間穿過。

      　　桑克瑞德微微皺眉。

      　　光側過臉，瞥了藏身於岩壁陰影下的他一眼。那神態太過熟悉，熟悉得讓人幾乎要錯認眼前仍是過去那個，總能第一時間察覺有人靠近的冒險者。

      　　「我應該說得很清楚了。」他重新望向荒原，「放棄我們吧。」

      　　既已被發現，桑克瑞德只能從陰影裡走了出來，槍刃仍背在身後。

      　　光看見了，卻沒有為此露出任何反應。

      　　「我不是來討伐你的。」

      　　桑克瑞德在離他幾步遠的地方停下，單刀直入地詢問。

      　　「古·拉哈·提亞。」

      　　「你想救他嗎？」

      　　遠方的水晶塔發出低沉的震鳴。

      　　那些遍佈塔身的藍光恰好在此刻亮了一瞬，將光的影子拉得很長。

      　　「……他不需要。」

      　　終於，光幽幽地開口。

      　　「是嗎？那他現在過的是什麼日子？」

      　　光轉過頭。

      　　桑克瑞德迎著他的目光，沒有退讓。

      　　「每天守著水晶塔，計算還剩多少乙太，哪一片土地還能再撐久一點──」

      　　那雙蔚藍的眼睛一點點沉了下去。

      　　「桑克瑞德。」

      　　警告已經很明顯，桑克瑞德卻像沒聽見。

      　　「等摩杜納枯竭了，他會去更遠的地方。庫爾札斯、黑衣森林，再來呢？」

      　　「……」

      　　「等所有地方都沒有足夠的乙太，他是不是還會告訴你，他一定能找到辦法？」

      　　光沒有回答。

      　　他們都知道答案。

      　　正因如此，桑克瑞德才必須繼續說下去。

      　　「你要陪他把這場夢做到什麼時候？」

      　　風從荒蕪的大地上掠過，捲起細碎的砂石。

      　　光慢慢垂下眼。

      　　「只要他還需要我。」

      　　「他永遠都需要你。」

      　　那一瞬間，空氣像是凝固了。

      　　桑克瑞德看著他。

      　　「他是什麼樣的人，你比任何人都清楚。」

      　　「他能在一個早就沒有你的世界裡等上一百年，能犧牲自己，一次次換取你的性命──你真以為他有一天會自己放手？」

      　　光的手指微不可察地蜷起。

      　　桑克瑞德替他說出了答案。

      　　「他沒有選擇，光。只要你還存在，他就不可能放棄。」

      　　「桑克瑞德。」

      　　這次，光終於轉過身。

      　　淡淡的光自他腳下流淌開來。

      　　沒有明顯的殺意，可那畢竟是足以吞噬一整片土地的力量，乾裂的石縫間浮起細小的光點，四周殘存的乙太本能般向他聚集。

      　　「你到底想說什麼？」

      　　桑克瑞德沉默了一會兒。

      　　接下來的話，他其實並不想說出口。

      　　甚至直到來到這裡以前，他都還在想，自己到底有沒有這樣的資格。

      　　但事到如今，他只能艱難地抬起眼。

      　　「你必須讓他明白，他認識的那個光，已經死了。」

      　　聚集在荒原上的光驟然停滯。

      　　光一動不動，那張臉甚至沒有明顯的變化。

      　　桑克瑞德的聲音愈發低沉。

      　　「是我們親自帶回來的遺體。阿爾菲諾確認過，雅·修朵拉也確認過。」

      　　「沒有呼吸，沒有靈魂，乙太也幾乎完全耗盡。」

      　　每一句都像是在重新揭開那一天的傷口。

      　　桑克瑞德握緊了拳頭，重新提起這些，對他而言也同樣難受。

      　　「那個和我們一路走到旅途盡頭的人，已經不在了。」

      　　光終於笑了一下，只是眼底沒有任何笑意。

      　　「所以？」

      　　「你不是他。」

      　　桑克瑞德說。

      　　四周徹底安靜下來。

      　　「你有他的模樣、有他的記憶，知道我們經歷過什麼，甚至知道他曾經怎麼看待每一個人。」

      　　「但構成你的，是水晶和祈願。」

      　　桑克瑞德望著那雙熟悉的眼睛。

      　　「是所有人希望英雄回來的願望，也是他的願望。」

      　　光安靜了片刻。

      　　隨即，那點原本幾乎消失的笑意竟重新浮現在唇邊。

      　　「這算什麼？」他笑出聲，「離間？」

      　　桑克瑞德皺起眉。

      　　「我沒興趣離間你們。」

      　　「那你隻身前來，冒著危險站在我面前，究竟想告訴我什麼？」
      　　
      　　桑克瑞德直視著那雙熟悉又陌生的眼睛，平靜地提出疑問。
      　　
      　　「你確定你記得的一切，都是真實發生過的嗎？」

      　　他朝怔住的身影走近了一步。

      　　「你記得這片大陸、記得水晶都、記得你們的約定。」

      　　「可是那些記憶，真的是死去的那個人留下來的？」

      　　他看著光。

      　　「還是因為誰的願望使然，所以你才擁有這些記憶？」

      　　這一次，光沒有立刻回答。

      　　幽藍的塔光自遠方映照而來，在他的側臉留下近乎透明的輪廓。

      　　過了很久，他才低低笑了一聲。

      　　「拉哈以前，也問過差不多的事情。」

      　　桑克瑞德的眉心微動。

      　　光抬起頭，望向遠處的水晶塔。

      　　「他說，現在的古·拉哈·提亞，對於英雄而言，其實只是水晶公的替代品。」

      　　聲音很輕，像是說起一段離現在很遠的往事。

      　　「真正陪我走過第一世界的人，是活了一百多年的水晶公。他知道那些已經不存在的國家，知道另一條時間線裡發生的一切，也是在最後，準備把自己的命留在那裡的人。」

      　　「回到原初世界的拉哈，只是得到那份記憶。」

      　　光微微垂眼。

      　　「所以他曾經問過我，我想一起旅行的，真的是現在的他嗎？」

      　　桑克瑞德沒有出聲。

      　　「那時候我告訴他，當然是。」

      　　光的唇角仍帶著一點笑。

      　　「因為不管記憶如何，走到我身邊的那個人就是他。」

      　　「……」

      　　「現在想來，倒是很有意思。」

      　　他低頭看著自己的掌心。

      　　淡淡的光透過指節流動，沒有血色，沒有脈搏。

      　　那確實不是活人的手。

      　　「他覺得自己是水晶公的替代品。」

      　　「而我，也不過是那個英雄的替代品。」

      　　光重新抬起眼。

      　　那雙蔚藍色的眼睛裡沒有桑克瑞德預想中的憤怒，也沒有被揭穿之後的狼狽。

      　　只有近乎溫柔的平靜。
      　　
      　　「很諷刺不是嗎？當年的我將吸魂晶交給現在的他，而現在的我，也是由他召喚而來。」

      　　「兩個冒牌貨，都自私地希望對方照著自己的祈願活下去。」

      　　他自嘲地笑了一下。

      　　「如果我們最後的結局是迎接大地的枯竭，好像也挺稱職的。」

      　　桑克瑞德的神色瞬間沉了下去。

      　　「別說得好像這是什麼浪漫的結局。」

      　　「我沒有那個意思。」

      　　桑克瑞德凝視著他。

      　　「別這樣踐踏你們的夢想。」

      　　光沒有回答。

      　　「你很清楚，他想跟你去冒險。」

      　　「不是守著一座塔，看你靠著侵害別人的家園活下去。」

      　　「他想看新的地方，認識沒見過的人，和你一起走那些以前來不及走的路。」

      　　桑克瑞德的聲音很低。

      　　「結果現在，他哪裡也去不了。」

      　　「每天唯一做的事情，就是想辦法讓你們活過今日。」

      　　光的眼底輕輕顫了一下。

      　　桑克瑞德看見了。

      　　於是他知道，已經夠了。

      　　兩人沉默了很久。

      　　最後，桑克瑞德移開視線，望向遠處那座高聳入夜的水晶塔。

      　　「我只能告訴你一件事。」

      　　光也隨著他的視線望去。

      　　「水晶塔是一切開始的地方。」

      　　他停頓片刻，望著夜色中的水晶塔，安靜得像一座巨大的墓碑。

      　　「現在，也是它才讓你們繼續存在。」

      　　光微微垂下眼。

      　　桑克瑞德沒有把話說得更明白。

      　　「既然所有事情都是從那裡開始的，那裡或許也能成為結束這一切的契機。」

      　　枯草擦過石面，發出細微而乾澀的聲響。

      　　光仍望著水晶塔。

      　　他沒有問桑克瑞德究竟知道什麼，也沒有問拂曉打算做什麼。

      　　過了很久，他只是轉過身。

      　　擦肩而過時，桑克瑞德忽然又開口。

      　　「如果你說得沒錯。」

      　　光停下腳步。

      　　桑克瑞德沒有回頭。

      　　「如果你真的只是繼承了那傢伙記憶的冒牌貨──」

      　　他喉間微微一緊，最後仍將那句話說了出去。

      　　「那至少，代替他到最後一刻。」
      　　
      　　「代替他，救拉哈一次。」

      　　身後沒有回答。

      　　只有傳來極輕的腳步聲。
  - title: 最後的旅程 - 1
    body: |-
      　　雅·修朵拉的腳步踏在舊薩雷安潔白的石磚上。
      　　
      　　層層廊柱將光切出整齊的陰影，在綿延的長廊盡頭，就是哲學家議會的大門。
      　　
      　　守衛見到她並沒有多問，只沉默地向兩側退開，厚重的門扉隨之開啟，環形議場自眼前一層層向上展開。
      　　
      　　議員們早已就座。
      　　
      　　桑克瑞德、尤里安傑、艾斯蒂尼安、可露兒、阿爾菲諾與阿莉塞都早已到達，雅·修朵拉走進他們中央所留下的空缺，腳步隨著長杖敲地的聲響，在站定後同時靜默。
      　　
      　　這個位置，原本是屬於那位早已不存在的人。
      　　
      　　雅·修朵拉仰起頭。
      　　
      　　她還記得上一次眾人站在這座議場中央，是為了說服薩雷安放棄閉關自守，將所有知識與力量投入對抗末日。
      　　
      　　那時，他們談的是如何挽救世界。
      　　
      　　而如今，被提交到議會桌面上的議題，依然與拯救世界息息相關。
      　　
      　　只是曾經最可靠的戰友，如今卻是他們必須排除的對象。
      　　
      　　一名擁有那位拯救過世界之人容貌與記憶的蠻神。
      　　
      　　雅·修朵拉收回視線。
      　　
      　　「想必諸位已經看過我們送來的觀測紀錄。」
      　　
      　　她的聲音清楚地傳遍整座議場。
      　　
      　　「摩杜納周邊的大地乙太正在持續枯竭，而且影響範圍仍在擴大。」
      　　
      　　周圍傳來些許竊竊私語聲，幾名議員正低聲交換意見。
      　　
      　　「最初只有水晶塔附近出現異常，喪靈鐘周邊的地脈率先停止流動，之後是銀淚湖沿岸。現在，影響已經越過摩杜納，延伸至庫爾札斯。」
      　　
      　　她抬起手，一枚記錄水晶浮到半空，隨著術式展開，艾奧傑亞北部的乙太流向圖在議場中央逐漸成形。
      　　
      　　本應遍布大地的光流，如今卻有大片區域變得黯淡，唯獨水晶塔所在之處亮得近乎刺眼。
      　　
      　　所有乙太都在向那裡聚集。
      　　
      　　「伊修加爾德周邊已經出現河流乾涸、農地失去活性，以及魔物因棲息地惡化而大規模遷徙的狀況。」
      　　
      　　雅·修朵拉望著那幅地圖。
      　　
      　　「我們所擔心的事情正在發生。」
      　　
      　　議場內的氣氛逐漸沉重。
      　　
      　　「蠻神本就是依靠信仰與乙太維持形體的存在。」
      　　
      　　她繼續說道。
      　　
      　　「無論最初的祈願多麼純粹，只要蠻神長期存在於世，就必須不斷攝取周圍的乙太。過去，各地蠻族大量收集水晶，正是為了完成召喚以及維持神明現世。」
      　　
      　　「如今的情況也是如此，只是規模更加龐大。」
      　　
      　　一名議員皺起眉。
      　　
      　　「據議會所知，過去降世的蠻神也不曾在這麼短的時間影響地脈的乙太，此次為何如此嚴重？」
      　　
      　　「因為被喚醒的水晶塔，正在發揮機能。」
      　　
      　　雅·修朵拉抬起眼。
      　　
      　　「自擁有亞拉戈血脈的古·拉哈·提亞重新與水晶塔建立連結之後，塔內原本封存的能源、周圍地脈的乙太，以及所有能夠被亞拉戈術式抽取的力量，都正在被極快的速度吸收。」
      　　
      　　「那座塔原本就是為此目的而設置的。」
      　　
      　　她沉聲道。
      　　
      　　「按照現在的速度估算，用不了多久，水晶塔周圍的土地就會徹底失去供人居住的條件。」
      　　
      　　短暫的沉默後，一道蒼老的聲音從上方響起。
      　　
      　　「即便如此，那仍是艾奧傑亞諸國需要處理的問題。」
      　　
      　　雅·修朵拉循聲望去，其中一席議員正低頭望著她。
      　　
      　　「即使末日威脅已去，薩雷安長久以來的立場也並未改變。我們並非軍事國家，也無意介入他國的戰事。」
      　　
      　　另一名議員也接著開口。
      　　
      　　「水晶塔位於摩杜納。若伊修加爾德已經受到影響，也應由艾奧傑亞各城邦共同討論應對之策。」
      　　
      　　阿莉塞的眉頭立刻皺了起來。
      　　
      　　桑克瑞德卻只是微微偏過臉，沒有出聲，彷彿早已預料到會得到這種回答。
      　　
      　　雅·修朵拉則連神色都沒有改變。
      　　
      　　「諸位或許誤會了一件事。」
      　　
      　　她無畏地環顧席位上的所有人。

      　　「薩雷安已經沒有選擇是否介入的餘地。」

      　　議場內的低語忽然停了。

      　　「因為在不久的將來，戰場很可能會轉移到舊薩雷安。」
      　　
      　　一瞬間，議場陷入譁然，甚至有人從席位上站了起來。
      　　
      　　「什麼意思？」
      　　
      　　「你有什麼根據？」
      　　
      　　「難道那名蠻神準備攻擊薩雷安？」
      　　
      　　接連而來的質問充斥整座議場。
      　　
      　　雅·修朵拉沒有立刻回答，她只是抬手關閉地圖，任由那些已經衰竭的乙太光點逐一消失。
      　　
      　　「拂曉血盟無法討伐擁有水晶塔庇護的蠻神。」
      　　
      　　她平靜地繼續說道，聲浪重新安靜下來。
      　　
      　　「水晶塔本身便是亞拉戈帝國最重要的遺產之一。它擁有龐大的防禦系統，也儲存了遠超現代諸國能夠掌握的技術與能源。」
      　　
      　　雅·修朵拉微微垂眼。
      　　
      　　「更重要的是，現在掌控它的人，是古·拉哈·提亞，是曾帶領一個城邦的人民，在光之氾濫中存活下來的領主。」
      　　
      　　在場看過資料的議員紛紛皺起眉頭。
      　　
      　　尤里安傑站到她的身邊，平靜地補充。
      　　
      　　「於長年威脅與資源匱乏之中維繫僅存的文明、調度防禦、應對食罪靈侵襲……此等經歷，絕非單純學識所能衡量。」
      　　
      　　雅·修朵拉點了點頭。
      　　
      　　「更別提他對於亞拉戈知識的理解，遠超過在座的大多數人，甚至能直接調度水晶塔內過於龐大的能量。」
      　　
      　　她停了一瞬。
      　　
      　　「而站在他身旁的，是既海德林之後，最強大的蠻神。」
      　　
      　　騷動的議場再次沉默下來。
      　　
      　　一陣死寂後，有人用不確定的嗓音開口。
      　　
      　　「那麼集結軍力包圍水晶塔呢？」
      　　
      　　「不可行。」
      　　
      　　雅·修朵拉回答得很快，眼神也冷了下來。
      　　
      　　「人數越多，風險越高。」
      　　
      　　「為什麼？」
      　　
      　　「因為蠻神的精煉之力。」
      　　
      　　她的聲音不大，但那兩個字卻足以帶給整座議場絕望。
      　　
      　　「過去，我們之所以能夠討伐蠻神，是因為英雄擁有超越之力，能夠沐浴在蠻神的乙太之下，不至於失去自我。」
      　　
      　　雅·修朵拉停了下來，最後補充的聲音很輕，其中蘊含的意義卻最為沉重。
      　　
      　　「而我們已經失去他了。」
      　　
      　　語畢，議場內久久無人出聲。
      　　
      　　方才說的種種跡象，顯現人們似乎只能坐以待斃。
      　　
      　　就在這時，雅·修朵拉身旁傳來衣料摩擦的細微聲音。
      　　
      　　阿爾菲諾向前走了一步。
      　　
      　　「接下來，由我說明吧。」

      　　年輕的精靈站到了她身旁，環顧著四周，最後望向始終保持沉默的富爾什諾。
      　　
      　　「關於為什麼下一個戰場，極有可能是舊薩雷安──」
      　　
      　　阿爾菲諾深吸一口氣。
      　　
      　　「我想，必須從這裡仍然保有的水晶說起。」
      　　
      　　
      　　　＊
      　　　　　
      　　　　　
      　　「為什麼是舊薩雷安？」
      　　
      　　古·拉哈·提亞低頭問，伏在他膝上的光並沒有立刻回答。

      　　水晶塔高處的房間比其他地方安靜許多，牆面流動著柔和的幽藍光芒，將兩人的影子淡淡映在地面。
      　　
      　　古·拉哈·提亞坐在窗邊，手指一下又一下順過光的頭髮，赤色的眼睛流淌著足以淹沒整個世界的溫柔。

      　　「那裡還有海德林留下的水晶。」
      　　
      　　光終於開口。
      　　
      　　古·拉哈·提亞梳理他髮絲的手微微停了一下。
      　　
      　　「的確，她為了天外天垓的航行，花費漫長歲月蒐集了大量的水晶。」他輕輕苦笑道：「但為了啟動諸神黃昏號，應該已經消耗了其中很大一部分，還有後來芝諾斯為了成為神龍的依憑，所用的數量應該……」
      　　
      　　「還剩很多。」
      　　
      　　光微微抬起眼。
      　　
      　　古·拉哈·提亞垂眼注視著他。
      　　
      　　「你知道？」
      　　
      　　「我能感覺得到。」
      　　
      　　光抬起一隻手。
      　　
      　　淡淡的光自指尖流過，很快又融回體內。
      　　
      　　「我現在畢竟是蠻神。」
      　　
      　　他的語氣甚至帶著一點若有似無的笑意。
      　　
      　　「對乙太的感覺，比以前敏銳多了。」
      　　
      　　古·拉哈·提亞的眼色沉了沉，光也不在意，他只是重新靠回對方腿上。
      　　
      　　「我能感受到，那裡還有很強的能量。」
      　　
      　　「如果全部帶回來，應該足夠讓我們撐上很長一段時間。」
      　　
      　　古·拉哈·提亞的手停住了。
      　　
      　　光翻了個身，仰頭看向他。
      　　
      　　「這樣你也不用一直辛苦地尋找水晶。」
      　　
      　　聽見光的話，那雙紅色的眼睛明顯避開了他的視線。
      　　
      　　光伸出手，指腹輕輕碰上古·拉哈·提亞眼下的皮膚，那裡有一層很淡的青黑。
      　　
      　　對一個早已不再需要像普通人一樣長時間睡眠的人而言，這樣的疲態本不該出現。
      　　
      　　「你最近都沒有好好休息。」
      　　
      　　「我不需要──」
      　　
      　　「我知道，但我捨不得你這麼累。」
      　　
      　　光打斷他。
      　　
      　　「我只能在一旁，什麼忙都幫不上，也無法為你分擔任何事情。」
      　　
      　　古·拉哈·提亞沉默了下來。
      　　
      　　光的指尖慢慢沿著他的眼下滑過。
      　　
      　　眼前人為了保全他所做的努力，光一直看在眼裡。
      　　
      　　他每一次離開水晶塔，都會刻意避開仍有人居住的地方。不碰村落附近的地脈、不奪取城邦保存的水晶，只是盡可能只去尋找那些早已荒廢的遺跡。
      　　
      　　可是沒有用。
      　　
      　　無論他多麼小心，只要光仍然存在，力量就必須來自某個地方。
      　　
      　　水晶塔奪走摩杜納的乙太，失去土地的人便只能顛沛流離，魔物離開枯死的棲息地，便會衝向仍有人類生活的區域。
      　　
      　　即使他們從未親手摧毀任何一棟房屋，仍然會有人因他們失去家園。
      　　
      　　古·拉哈·提亞不會跟光透漏隻字片語，他只會獨自消化看見荒土大地的恐懼、聽見人民逃竄的哭喊，然後一個人在深夜裡，一次次奮力嘗試、計算著影響最小的範圍。
      　　
      　　「舊薩雷安的水晶不一樣。」
      　　
      　　光輕聲說。
      　　
      　　「那些力量原本就是被準備好消耗掉的。取走它們，不需要讓誰失去農田，也不用讓誰離開自己的家。」
      　　
      　　「對我們而言，是最好的選擇。」
      　　
      　　古·拉哈·提亞慢慢握住了覆在自己臉側的那隻手。
      　　
      　　他的掌心依然保有溫度，光則沒有。
      　　
      　　兩種完全不同的溫度衝突地貼合在一起。
      　　
      　　古·拉哈·提亞垂下眼。
      　　
      　　「可是太遠了。」
      　　
      　　他的聲音有些輕，伴隨著濃烈的不安與遲疑。
      　　
      　　「離水晶塔太遠，你能得到的支援會減弱很多。」
      　　
      　　古·拉哈·提亞握著他的手，不自覺地收緊。
      　　
      　　「塔能夠直接供應你的範圍有限。越過北洋之後，我甚至不能保證傳輸術式能維持穩定。」
      　　
      　　「如果發生什麼事……」
      　　
      　　他的喉結輕輕動了一下。
      　　
      　　「我沒辦法保護你。」
      　　
      　　光沒有回應，古·拉哈·提亞的語氣卻愈來愈快。
      　　
      　　「而且舊薩雷安的人口密度太高，要完全避開所有人潛入，幾乎不可能。」
      　　
      　　他停了一下，眉頭皺得更深。
      　　
      　　「何況……拂曉不可能什麼都沒有發現。」
      　　
      　　光的眼神微微一動。
      　　
      　　「雅·修朵拉一定已經察覺水晶塔周邊乙太衰竭的速度，也能推算出我們還能維持多久。」
      　　
      　　古·拉哈·提亞苦笑了一下。
      　　
      　　「他們會有所戒備。」
      　　
      　　他的拇指輕輕摩挲著光的手背。
      　　
      　　「現在不管去什麼地方，我們都不會受到歡迎。」
      　　
      　　最後一句說得很淡，看似並不在意，光卻聽得清楚。
      　　
      　　他安靜地看了古·拉哈·提亞一會兒，然後笑了出來。
      　　
      　　「不用擔心。」
      　　
      　　古·拉哈·提亞抬眼。
      　　
      　　光重新趴回他的膝上，一副完全不把這些問題放在心上的模樣。
      　　
      　　「我好歹也是現今最強大的蠻神。」
      　　
      　　「……別總是這麼說自己。」
      　　
      　　古·拉哈·提亞的語氣裡多了點無奈。
      　　
      　　光笑得更明顯了一點。
      　　
      　　「而且，我們也不是一定得直接去舊薩雷安，途中可以繞點路。」
      　　
      　　「繞路？」
      　　
      　　古·拉哈·提亞眨了眨眼。
      　　
      　　光像是忽然想起什麼有趣的事，稍微撐起身體。
      　　
      　　「北洋那邊不是有一片以前沉過船的海域嗎？」
      　　
      　　古·拉哈·提亞怔了一下。
      　　
      　　「你是說……」
      　　
      　　「以前我只從船上經過。」
      　　
      　　光的語氣輕快了一些。
      　　
      　　「據我所知，那附近的海底很深，下面應該還有不少沉船和遺跡。」
      　　
      　　「如果不急著趕路，我們可以先去看看。」他伸手比了一下，「說不定還能找到以前沒人記錄過的地方。」
      　　
      　　古·拉哈·提亞沒有說話。
      　　
      　　可光看見了，那雙原本一直被不安與歉疚籠罩的紅色眼睛裡，極輕地亮起了一點光。
      　　
      　　就像很久很久以前，兩人披著夜色，細數著那些尚未踏足的地方所燃起的亮光。
      　　
      　　他遲疑了很久，最終掙扎地喃喃。
      　　
      　　「如果是那樣……或、或許，不停留太久的話……」

      　　「當然。」
      　　
      　　「而且……而且要先確認你的狀態。」
      　　
      　　「看你想怎麼確認。」
      　　
      　　光撐起身體，仰頭吻了吻他，古·拉哈·提亞無奈地輕捏他的臉頰，低聲說著別鬧。
      　　
      　　他皺著眉，看起來仍舊在努力思考，自己有沒有什麼疏於顧慮的地方，可那隻原本放在光髮間的手，卻再次輕輕動了起來。
      　　
      　　光順勢重新把臉埋進他的膝間。柔軟的布料遮住了大半張臉，也遮住了那雙眼睛。
      　　
      　　在古·拉哈·提亞看不見的地方，藍眼靜靜流轉著。
      　　
      　　「如果真的要去……我還需要重新計算傳送座標，最好準備幾個中繼點……就算發生意外，也能立刻撤退。」
      　　
      　　「好。」
      　　
      　　「還有水晶的搬運方式，如果數量不少……水晶塔的傳送術式得做些調整……」
      　　
      　　「拉哈。」
      　　
      　　古·拉哈·提亞停下來。
      　　
      　　「怎麼了？」
      　　
      　　光沒有抬頭，只是更靠近了一點。
      　　
      　　「再一起去冒險吧。」
      　　
      　　他的聲音悶在衣料間，很輕很柔。
      　　
      　　「無論你想做甚麼準備，我都聽你的。」
      　　
      　　古·拉哈·提亞的手停了一瞬。
      　　
      　　他垂下眼，一顆晶亮的淚珠隨著用力點頭的動作滑落。
      　　
      　　水晶塔外，依然是荒土般的地界。
      　　
      　　塔內卻像什麼都沒有發生。
      　　
      　　兩個人湊在一起，面前是一張放大的地圖，他們共同討論著航線、傳送座標以及海底遺跡。光敘述著過去曾造訪遺跡的冒險事蹟與經驗，古·拉哈·提亞認真地聽著，時不時發出期待的讚嘆與驚呼。
      　　
      　　他們依偎著，互相期待那些未知的冒險。
      　　
      　　那些話聽起來如此尋常，尋常得幾乎讓人相信，他們之間真的還有漫長的以後，與數不清的旅途與約定。
      　　
      　　光卻只是垂下眼，在心底無聲地鬆了一口氣。
      　　
      　　幸好，古·拉哈·提亞沒有起疑。
      　　
      　　只是再過不久，等他終於明白這趟旅程真正通往何處時，大概再也不會原諒自己了吧。
      　　
      　　但那也沒有關係。光心想著。
      　　
      　　有些事情，總得有人先做出決定。
      　　
      　　他已經看夠古·拉哈·提亞獨自背負那些選擇，看夠他一次又一次在保全自己與傷害這個世界之間掙扎。
      　　
      　　所以這一次，換他來。
      　　
      　　既然這將是屬於光與古·拉哈·提亞最後的旅程──
      　　
      　　那麼至少，啟程這件事，就由他親手開始。
  - title: 最後的旅程 - 2
    body: |-
      　　北洋上空覆著厚重的雲層，海風帶著濃烈的鹹味，遠處的浪潮一層接著一層拍打礁岸。
      　　
      　　傳送術式的光芒逐漸散去後，兩人站在一處無人的海崖上，前方便是延伸至視線盡頭的灰藍海面。
      　　
      　　古·拉哈·提亞披著斗篷，抬頭望了一會兒。
      　　
      　　「這裡比預想得還冷。」
      　　
      　　「至少比庫爾札斯好些。」
      　　
      　　光站在他身旁，輕鬆的語氣很快被海風吹散。
      　　
      　　他們按照先前整理好的海圖前行，在一處被礁石包圍的淺灣停下。據古老航海紀錄記載，數百年前曾有數艘商船在附近遭遇暴風，部分船骸隨著洋流沉入海底更深處，而其中一艘最後的座標，恰好與一座早已無人記載用途的石造遺跡重疊。
      　　
      　　光站在水邊，看著翻湧的海浪，一邊蹙起眉頭。
      　　
      　　「如果俾斯麥在就好了。」
      　　
      　　古·拉哈·提亞愣了一下，隨即反應過來他說的是第一世界的妖靈。
      　　
      　　「雖說乘坐他前往深海是難得的經驗，」他笑道，「但每趟冒險若都這麼方便，就不有趣了。」
      　　
      　　光偏頭看了看他。
      　　
      　　「還是我把海面掀開？」
      　　
      　　「那怎麼行。」
      　　
      　　古·拉哈·提亞神色嚴肅地聲明。
      　　
      　　「不是說好了，既然是冒險，就不能什麼都用你的力量解決。」
      　　
      　　「哪有蠻神還不能用力量的……」
      　　
      　　古·拉哈·提亞望著低聲咕噥的光，笑得十分開心。
      　　
      　　最後，他們真的像兩個再普通不過的冒險者一樣，準備好水下呼吸用的道具，沿著礁岸緩慢潛入海底。
      　　
      　　海面上的光很快被深水吞沒。
      　　
      　　沉船殘骸在幽暗的海水中一點點浮現，折斷的桅杆斜插進沙床，腐朽的木板上覆滿珊瑚與貝類，偶爾有魚群從破裂的船艙間穿過。
      　　
      　　古·拉哈·提亞看得目不轉睛，一雙大眼比海中珊瑚還明亮。
      　　
      　　比起他，光倒是更注意四周的動靜，所以當不知從哪裡傳來的歌聲穿過海水時，他第一時間便察覺到了不對。
      　　
      　　但光還是低估了貓魅耳朵的靈敏程度。
      　　
      　　古·拉哈·提亞的耳朵微微動了一下，下一秒，他竟像完全忘記身旁還有人似的，順著那道聲音往沉船更深處游去。
      　　
      　　光怔了怔，喚道：「拉哈？」
      　　
      　　沒有得到回應的他立刻追了上去。
      　　
      　　結果最後是在一座斷裂的石門前，硬生生把已經快要伸手碰上某隻海妖的古·拉哈·提亞拖了回來。
      　　
      　　魅惑解除後，古·拉哈·提亞愣了很久。
      　　
      　　「怎麼回事……？」
      　　
      　　「你剛才差點跟著她走了。」
      　　
      　　被光緊盯著，古·拉哈·提亞難得顯得有些心虛。
      　　
      　　「……聽力太好也不是什麼好事。」
      　　
      　　光索性伸手抓住他，再次往前游去。
      　　
      　　「那你跟緊一點，這塊或許是他們的巢穴。」
      　　
      　　之後的路，兩人便真的沒有再分開。
      　　
      　　沉船最深處連著一條被沙石掩埋大半的石階，他們沿著殘存的通道進入遺跡。內部的水位逐漸降低，最後竟出現一片仍被古老術式隔絕海水的空間。
      　　
      　　遺跡裡棲息著不少因長年受到殘留乙太影響而異變的生物，有披著厚重甲殼、會從石縫間突然撲出的甲蟲，也有能模仿人聲，引誘闖入者踏進陷阱的軟體魔物。
      　　
      　　兩人同時喚出武器，默契地保持著一前一後的隊形前進。古·拉哈·提亞負責術式與防護，光則走在前方，替他擋下那些從暗處撲出的魔物。
      　　
      　　偶爾古·拉哈·提亞會提醒哪一塊石板下藏著陷阱，光則會在對方專注分析周圍的殘骸時，一邊等待一邊警戒著四周。
      　　
      　　走到後來，兩人幾乎在同一時間抬起頭。
      　　
      　　視線相撞的瞬間，他們都笑了。
      　　
      　　古·拉哈·提亞看著光的神情，感覺他們似乎想到了同一件往事。
      　　
      　　「以前在珂露西亞島時，我們前往礦坑的路上，也是這樣前進的。」
      　　
      　　光愣了一下，隨即笑意更深。
      　　
      　　「現在想起來，倒像是很久以前的事了。」
      　　
      　　他將劍隨意扛上肩，故意拖長語調。
      　　
      　　「那時候的某人，還顧著跟扣魯圖聊英雄的故事，放我一個人迎戰食罪靈……」
      　　
      　　古·拉哈·提亞的耳朵瞬間僵住。
      　　
      　　「我、我不過是太開心了……很久沒與你並肩同行……」
      　　
      　　他有些狼狽地別開視線，連語速都快了不少。
      　　
      　　「而且我也有努力跟上！我絕對不會丟下你一個人！」
      　　
      　　看著他著急解釋的模樣，光終於忍不住笑出聲。
      　　
      　　「知道、知道。」
      　　
      　　他語氣裡還帶著笑意。
      　　
      　　「跟你一起，我一直都很安心。」
      　　
      　　古·拉哈·提亞原本還微微垂著的耳朵，慢慢豎了起來。
      　　
      　　光看見了，唇邊的笑意卻反而淡了一點。
      　　
      　　這份情感，慢慢喚起了某些更為久遠的記憶。
      　　
      　　「其實我那時候也想過。」
      　　
      　　他低聲道。
      　　
      　　「明明總戴著兜帽，不肯讓人看清楚臉，說話也總是繞著圈子……可是不知道為什麼，跟你待在一起的時候，反而很讓人安心。」
      　　
      　　古·拉哈·提亞眨了眨眼。
      　　
      　　「我那時候……應該很可疑吧？」
      　　
      　　「倒也沒有特別這麼認為。」
      　　
      　　光說完，停頓了一下，隨即又像想到什麼似的，重新露出那種不懷好意的笑。
      　　
      　　「而且戴著兜帽的你，可比拿下兜帽之後坦率多了。」
      　　
      　　「什麼、哪有！」
      　　
      　　古·拉哈·提亞一下子睜大眼睛。
      　　
      　　光顯然很滿意他的反應，更為故意地慢悠悠重複。

      　　「什麼『為了拯救那個人，不在乎順便拯救一個世界』，還有……」

      　　光側過臉，看著已經開始耳根發紅的古·拉哈·提亞。

      　　「『如果那個人的未來裡有我，那就再好不過了。』」

      　　「光！」

      　　古·拉哈·提亞這次是真的恨不得直接躲進旁邊的石縫裡。
      　
      　　「我、我當時根本沒想過你會知道……就得意忘形了一些……」

      　　他越解釋越混亂。

      　　光原本還笑得很愉快，可是看著眼前人手足無措的樣子，那份笑意不知不覺又慢慢柔和下來。
      　　
      　　遺跡深處很安靜，只有遠處積水偶爾滴落，在石面上泛起很輕的回音。
      　　
      　　光望著古·拉哈·提亞，想起他們生活的水晶塔，想起那總是佇立於觀星室的身影。
      　　
      　　「那個時候我總感到好奇。」
      　　
      　　光垂下眼，聲音輕了很多。
      　　
      　　「到底是什麼樣的人，能讓你做到這種地步。」
      　　
      　　「願意忍受那麼久的孤獨、跨越漫長的時間，只為了等到一個有他的未來。」
      　　
      　　他說著，唇邊浮起一點很淡的笑。
      　　
      　　「然後，不知不覺就羨慕了起來。」
      　　
      　　古·拉哈·提亞怔住。
      　　
      　　「羨慕？」
      　　
      　　「嗯。」
      　　
      　　光抬起眼，看向他。
      　　
      　　「他能被一個人這樣記掛著。」
      　　
      　　「無論隔了多少年、甚至跨越了世界，都不曾被遺忘。」
      　　
      　　聽見光的話，古·拉哈·提亞也安靜了下來。
      　　
      　　原本還殘留在耳尖上的羞紅沒有退去，看著他的眼神卻十足真誠。
      　　
      　　「那個人一直都是你。」
      　　
      　　他低聲說道。
      　　
      　　「以前是、現在也是。」
      　　
      　　積水聲響起，泛起陣陣漣漪。
      　　
      　　光淡淡笑著，又伸手牽起他，兩人的腳步聲再次一前一後地響起，沿著遺跡幽暗的深處，繼續往前延伸。
      　　
      　　直到進入更深的區域後，古·拉哈·提亞的腳步開始慢了下來。
      　　
      　　光回過頭。
      　　
      　　「累了嗎？」
      　　
      　　古·拉哈·提亞沉默了會，還是勉強笑了一下。
      　　
      　　「離水晶塔遠了些，體力消耗比較快。」
      　　
      　　光點點頭表示理解，隨後在一處相對乾燥的石室停了下來。
      　　
      　　周圍沒有魔物的痕跡，牆面也還算完整，確認沒有其他危險後，光便在角落升起一小簇火。
      　　
      　　暖色的火光很快驅散了部分深海遺跡裡的陰冷。
      　　
      　　古·拉哈·提亞也跟著席地而坐，側過一邊的頭輕靠在光的肩上。
      　　
      　　深海裡十分寧靜，僅有火堆發出的劈啪聲響。
      　　
      　　光垂在身側的手動了動，指尖才剛碰上古·拉哈·提亞的手背，便被他輕輕牽了起來。
      　　
      　　「光。」
      　　
      　　被喚著名字的人偏過頭，看著古·拉哈·提亞赤紅的眼睛閃爍著微微火光，既明亮又溫暖。
      　　
      　　「從過去到現在，我始終都認為……」
      　　
      　　「即使漫長的旅途中充滿艱辛、困難與寂寞，但只要道路的盡頭有你，我就彷彿有源源不絕的力量，能不斷向前邁進。」
      　　
      　　那雙曾在水晶塔前追隨著自己的背影、也曾在觀星室遙望著自己旅途的眼睛，此刻依然深深映著他的身影。
      　　
      　　古·拉哈·提亞望著他，距離一點點縮短，赤紅的視線也隨之落向他的唇。
      　　
      　　最初只是一個很輕的吻。

      　　溫熱的唇貼上蠻神冰冷的嘴唇，試探在默許之中逐漸加深。光伸手攬住他的肩，任由身體失去重心向後倒去，背脊輕輕碰上鋪著外衣的石地。
      　
      　　古·拉哈·提亞隨之俯下身，將他牢牢圈在懷裡。

      　　手掌沿著肩頸緩緩撫下，停留在那些曾經因戰鬥佈滿傷痕、如今卻光滑無瑕的胸膛。
      　
      　　即使這具軀體僅是由祈願而生，他依然近乎虔誠地親吻著那些早已不存在的痕跡。
      　　
      　　「所以……答應我……」
      　
      　　沙啞的嗓音與帶著佔有意味的啃咬一同落在頸側，那句近乎咒縛的話語，低低迴盪在深海中、僅有兩人的石室裡。

      　　「無論如何，都不要拋下我。」
      　
      　　在他看不見的地方，光的瞳孔猛然一縮。

      　　下一瞬，他用力抱緊古·拉哈·提亞，不讓對方抬頭看見自己的神情。
      　
      　　「不會的。」
      　
      　　顫抖的嗓音早已失去平穩。
      　
      　　「無論你前往何方……」
      　
      　　光仰頭、望向石室深處，水霧逐漸漫上眼底。

      　　「在道路的盡頭，你的英雄……一定也會在那裡。」
  - title: 最後的旅程 - 3
    body: |-
      　　傳送術式的光芒散去時，迎面而來的是熟悉的冷白色燈光。
      　　
      　　古·拉哈·提亞睜開眼。
      　　
      　　迷津的金屬迴廊在兩人面前延伸，整齊排列的研究設施被人工照明打得極亮。過去為了迎接末日而日夜運轉的機械，如今大多已經停止，只有少數導管仍發出低沉的震鳴。
      　　
      　　四周意外地寧靜。
      　　
      　　古·拉哈·提亞沒有立刻往前，他站在原地，耳朵微微抖動了一下。
      　　
      　　「怎麼了？」
      　　
      　　光回頭問，古·拉哈·提亞謹慎地環顧四周。
      　　
      　　「沒什麼……只是比想像中安靜。」
      　　
      　　光順著他的視線看去。
      　
      　　「末日之劫已經結束了，以前這裡集中的大量研究員，是為了諸神黃昏號和方舟計畫做準備。現在不需要日夜趕工，恢復成普通的研究設施也不奇怪。」

      　　「……或許吧。」
      　　
      　　古·拉哈·提亞嘴上這麼回答，手卻握緊了法杖。

      　　兩人沿著迴廊前進，腳步敲擊金屬地面的聲音清晰得令人不安。
      　　
      　　走過前幾個研究區時，他們沒有看見任何穿著白袍的身影，搭乘廊梯往下時，也沒有碰見本該看守的人。
      　　
      　　直到經過原本應該有人輪值的控制室，古·拉哈·提亞終於停下腳步。
      　　
      　　裡頭的燈是亮的，桌面還擺著沒有整理完的資料，甚至還有冷掉的飲品。
      　　
      　　即使充滿人曾經存在過的痕跡，卻依然看不見任何研究員。
      　　
      　　「光。」
      　　
      　　古·拉哈·提亞的聲音低了下來。
      　　
      　　「這不對勁。」
      　　
      　　而光沒有回答。
      　　
      　　「再怎麼減少研究人員，也不會連執勤的看守都沒有。」
      　　
      　　古·拉哈·提亞轉過頭，儘管語氣刻意保持冷靜，眼神卻已經開始搖曳。
      　　
      　　「簡直像是……被刻意清空一樣。」
      　　
      　　藍色的眼睛平靜地迎上他的目光。
      　　
      　　光安靜了一瞬，隨即輕輕笑了笑。
      　　
      　　「既然都已經到了，就別自己嚇自己。」
      　　
      　　「可是──」
      　　
      　　「拉哈。」
      　　
      　　光伸手握住他，冰涼的手指扣進掌心，安撫地握緊。
      　　
      　　「我們只要到達星海深處，確認海德林留下的水晶，拿到之後就立刻離開。」
      　　
      　　「用你的傳送陣，我們可以立刻回到水晶塔。」
      　　
      　　古·拉哈·提亞望著兩人交握的手，猶豫了很長一段時間，終是不安地點了點頭。

      　　光毫不猶豫地牽著他，啟動梯廳的按鈕。
      　　
      　　
      　　*

      　　通往地下的道路比記憶中更加漫長。
      　　
      　　由於沒有守衛，他們前往星海入口的路途順暢到讓人不安。當升降裝置終於停在最深層，熟悉的圓形門扉出現在兩人面前時，古·拉哈·提亞甚至沒有第一時間踏出去。
      　　
      　　強大的力流漩渦出現在腳下，那便是前往星海道路的入口。
      　　
      　　兩人在寂靜中交換了眼神，正準備踏進漩渦時，四周的燈光突然全數滅了下來。
      　　
      　　幾乎就在同一瞬間，無數術式自牆面、地板與天頂同時亮起，刺眼的白光沿著整座設施急速展開，像一張早已準備好的網，將兩人所在的位置牢牢封死。
      　　
      　　古·拉哈·提亞的臉色驟變，他在瞬間緊抓住光的手腕，右手握著的法杖重重往地上一敲。
      　　
      　　光芒構成的傳送術式在瞬間出現，卻在成形的瞬間轟然碎裂，周圍的乙太像被什麼強行攪亂，原本穩定的空間座標變得支離破碎。
      　　
      　　他的臉上浮現出真正的驚慌。
      　　
      　　早該想到的、他早該預料到的。
      　　
      　　薩雷安有專門研究傳送乙太的機構，在他們面前，要逃脫怎麼可能是易事。
      　　
      　　「光……」
      　　
      　　古·拉哈·提亞急切地抬起頭。
      　　
      　　「我們必須……必須馬上離開這裡，封住行動的下一步，肯定是──」
      　　
      　　拉著手的力量卻沒有得到回應，光垂眼迎上古·拉哈·提亞慌亂的紅眼，居然還帶著不可思議地平靜。
      　　
      　　「正因如此，我們才必須繼續往前。」
      　　
      　　「可、可是！」
      　　
      　　「拉哈，冷靜點。」
      　　
      　　陣法交織的光芒中，光的雙手緊緊握住他的肩膀，堅定且平靜地低語著。
      　　
      　　「要是錯過這一次，下一回恐怕就再也進不來了。」他低聲道，「倒不如說，正因為他們竭盡全力阻止我們接近，才更證明星海深處藏著我們真正需要的東西。」
      　　
      　　「但是就算到了那裡，我們也逃不出去！」
      　　
      　　古·拉哈·提亞氣急敗壞地扯住光的衣角。
      　　
      　　「光，我覺得這真的行不通，太危險了！」
      　　
      　　「就算是薩雷安，也不可能干預星海深處，那裡可是連普通通訊都無法傳遞的地方。」
      　　
      　　光依然十分平靜，過於堅定的眼神反而透露出一股寒氣。
      　　
      　　「這是我們唯一的機會。」
      　　
      　　兩人的眼神掙扎地撞在一起。
      　　
      　　但不等他們爭論，遠方傳來一股更加強大的能量，光的眼睛一瞇，隨後乾脆地握住古·拉哈·提亞的手，兩人一同跳進星海的漩渦。
      　　
      　　剛才他們所站的位置，已落下術法凝聚而成的隕石，將金屬地面融出巨大的坑洞。　　
      　　
      　　星海深處沒有真正的道路，只有無數浮動的乙太結晶，以及被記憶與意志塑造成形的殘片。
      　　
      　　兩人一路向下，沿途的攻擊愈來愈猛烈。
      　　
      　　他們並未見到發動攻擊的術者，但星海的天空已經被染成一片燃燒的火焰，數道流星化為強勁的攻擊，毫無章法地落在他們行經的道路上。
      　　
      　　古·拉哈·提亞緊咬著下唇，面色盈滿濃烈的不甘與害怕，唯一驅使他向前的僅有星海深處的水晶、他們最後的希望。
      　　
      　　他的雙腿因疲勞而發軟、過度急促的呼吸也讓喉間湧上鐵鏽味，古·拉哈·提亞只能望著身旁堅定前進的背影，努力督促自己再度邁開步伐。
      　　
      　　來自天空的攻擊越來越猛烈，他們甚至能感覺到，後方開始追擊的身影裡，有幾個熟悉的氣息。
      　　
      　　古·拉哈·提亞垂下頭，緊咬著發白的嘴唇。
      　　
      　　他並不想跟過去的夥伴交戰。
      　　
      　　即使他們做出了不同的選擇，但那些人還是──
      　　
      　「拉哈！」
      　
      　　光的聲音猛然穿透他的思緒。

      　　古·拉哈·提亞恍惚地抬起頭，這才看見一道灼亮的流星已經拖著火尾逼至眼前。

      　　距離太近了。

      　　他甚至來不及重新展開術式，只能下意識抬起手臂，緊緊閉上眼睛。
      　
      　　預想中的衝擊卻沒有落下。

      　　下一瞬，沉重的撞擊聲在前方轟然炸開。

      　　古·拉哈·提亞睜開眼。

      　　幾面厚重的盾牌正穩穩擋在兩人身前，將墜落的碎石與火光硬生生隔絕在外。爆炸掀起的氣浪沿著盾緣向兩側散去，而站在最前方的數道身影，身上披著如同龍鱗般層疊的盔甲。

      　　古·拉哈·提亞怔住了。

      　　那身裝束，在末日危難之時，他們曾並肩作戰過。

      　　「星戰士團……？」
      　
      　　喃喃出口的聲音幾乎立刻被星海的震鳴吞沒。
      　
      　　那些身影沒有回頭，只是如同仍身處末日之劫時那樣，沉默地架起盾，替身後的人撐開一道足以通行的縫隙。

      　　更多微光開始自四周浮現。

      　　有穿著軍服的士兵，有曾在末日中與他們短暫同行的人，也有連面容都已經模糊，只能從武器與姿態辨認出的身影。

      　　他們有些曾被拯救，有些甚至只在那場漫長旅途中與他們短暫相遇，甚至連名字都早已模糊不清。
      　
      　　如今卻一個接著一個，從星海的光裡重新顯現。
      　
      　　光也停了一瞬。

      　　他怔怔地望著那些身影，望著自己曾經走過的道路所留下的痕跡。
      　　
      　　震盪的內心發出比隕石還激烈的聲響。
      　　
      　　他從未想過再次踏足星海，這些回歸的靈魂，依然願意幫自己一把。

      　　然而前方的攻擊沒有因此停下，又一道乙太洪流自深處捲來。
      　
      　　這一次，一面破損的鳶盾擋在了最前方。
      　　
      　　盾面上的獨角獸紋章即使遍布裂痕，依然清晰得讓人心口發疼。

      　　光的腳步驟然停住。

      　　那道高大的身影沒有回頭。
      　
      　　只是像很多年前一樣，穩穩站在他們與危險之間。
      　　
      　　直到迎面而來的攻擊徹底消散，那道身影才慢慢化作柔和的光。
      　
      　　其中一點輕輕落在光的肩上，沒有重量，卻彷彿輕輕拍了拍他的肩膀、催促著。
      　　
      　　繼續走吧。
      　　
      　　光的眼眶一下紅了。
      　　
      　　「為什麼你還是……」
      　
      　　聲音出口時，連他自己都沒有察覺其中的顫抖。
      　
      　　古·拉哈·提亞回過頭。

      　　光卻很快低下眼，只用力搖了搖頭。

      　　「沒什麼。」

      　　再抬起臉時，他的聲音已經啞了。

      　　「走吧。」
      　　
      　　繼續向前的路上，出現在身旁的身影越來越多。

      　　有些甚至連完整的形體都無法維持，只剩下一道熟悉的術式、一柄曾經見過的武器，或是一點仍未徹底消散的意志。

      　　沒有誰開過口。

      　　可每當他們快要被落下的火光吞沒時，總有人替他們撐起防線；每當前方的道路被乙太風暴撕裂，便會有一道力量替他們劈開缺口；當古·拉哈·提亞的腳步因疲憊而踉蹌，也總有微光自後方落下，短暫穩住他幾乎枯竭的力量。
      　
      　　那些早已離開的人，正在用最後殘存於星海中的痕跡，一次又一次將他們往更深處推去。

      　　沒有人質問光為什麼會變成如今的模樣，也沒有人責怪古·拉哈·提亞的選擇。
      　　
      　　那些身影只是用自己的微光，照亮一小段前進的道路。
      　　
      　　直到最後一道屏障碎裂。
      　　
      　　兩人幾乎同時跌進最深處。
      　　
      　　光先站穩，反手抱住腳步踉蹌的古·拉哈·提亞。

      　　「謝謝……」
      　
      　　古·拉哈·提亞喘著氣。
      　
      　　即使已經精疲力竭，他第一時間仍然抬頭看向前方。
      　
      　　這裡就是海德林曾經存在的地方，也是星海最深層、曾經充滿龐大乙太的區域。

      　　古·拉哈·提亞的眼睛亮了一瞬。
      　
      　　「我們到了。」
      　
      　　他幾乎是帶著欣喜抬起頭。
      　
      　　「光，我們終於──」

      　　喜悅的聲音戛然而止。
      　
      　　視線前方，竟然什麼都沒有。
      　
      　　沒有當時他們見過、海德林花費數萬年累積的龐大水晶，只剩下零星散落的結晶碎片，光澤淡得幾乎隨時都會消失。
      　
      　　古·拉哈·提亞站在原地，很久都沒有動。

      　　「……怎麼可能。」
      　　
      　　他輕聲喃喃，鬆開光的手、快步往前。
      　　
      　　「你明明說過……」
      　　
      　　古·拉哈·提亞蹲下身，顫抖著撿起其中一塊水晶。
      　　
      　　裡面的乙太只剩下一點微光，甚至比普通的能源水晶更加稀薄。
      　　
      　　「你說你感覺得到……這裡有足夠的力量……」

      　　他的聲音開始顫抖。
      　　
      　　光站在他身後，沒有回答。
      　
      　　古·拉哈·提亞慢慢轉過身。
      　
      　　那雙紅色的眼睛裡，方才一路支撐著他的希望，正在一點一點碎裂。
      　　
      　　古·拉哈·提亞終於在這片過於漫長的沉默裡，意識到了答案。

      　　「你……」

      　　他的手指驟然收緊，水晶碎片割進掌心。
      　　
      　　「為什麼？」
      　　
      　　光的嘴唇輕輕動了一下，卻沒能發出聲音。

      　　古·拉哈·提亞的臉色瞬間變得慘白。

      　　「為什麼……要騙我？」
      　
      　　過輕的語調，像是一碰就會碎掉。
      　　
      　　曾經充滿信任的眼神逐漸崩落，始終保持沉默的光閉上眼，依然沒有回應。
      　　
      　　就在這時，古·拉哈·提亞身後，忽然傳來一道聲音。

      　　「他並沒有騙你。」
      　
      　　兩人同時僵住。
      　　
      　　那過於熟悉的聲音，讓古·拉哈·提亞甚至不敢回頭。

      　　光靜靜地抬起視線，眼底流轉著不知名的情緒。

      　　星海深處，無數細碎的光正緩慢聚集。

      　　一道人影站在古·拉哈·提亞身後。

      　　他身上沒有散發蠻神的微光、沒有由祈願塑造出的完整無瑕，身上依舊留有最終決戰受的傷痕，衣著也仍是那身深色的戰甲。

      　　那雙蔚藍的眼睛，安靜地凝視著兩人。
      　　
      　　古·拉哈·提亞的瞳孔劇烈搖曳，不敢置信地眨著模糊的眼，一點一點轉過頭。
      　　
      　　他的呼吸停在胸口，彷彿靜止在那一刻。
      　　
      　　在他的身後，早已死去、回歸星海的光，正凝視著古·拉哈·提亞。
  - title: 最後的旅程 - 4
    body: |-
      　　古·拉哈·提亞踉蹌著向前走了一步，不可置信的眼神望著眼前的身軀。

      　　沒有乙太光芒的遮掩，胸前那道在最終決戰留下的致命傷狠狠刺進他的眼睛。乾涸的血跡早已凝固，遍佈在破裂的衣甲邊緣，連同他的死亡，一併停留在他們都無法挽回的瞬間。
      　　
      　　古·拉哈·提亞的視線落在那裡，瞳孔一縮，治癒的光芒反射性從掌心爆發。

      　　「不……」

      　　他奔到光的身前，雙手急忙按上那道傷口。那動作熟練的令人心疼，彷彿又回到諸神黃昏號的船艙裡，回到他曾經一次又一次施展治癒術的時刻。

      　　光芒沿著指縫傾瀉而出，層層覆上早已停止流血的胸膛。

      　　「沒事的……這次、這次我可以……」

      　　他的聲音顫抖得不成樣子。

      　　古·拉哈·提亞咬緊牙關，根本沒有察覺眼淚已經落了下來，他只是一次又一次催動術式，治癒的光亮了又暗，拚命想將那道傷痕從眼前抹去。

      　　可什麼都沒有改變，無論是那道傷痕，還是已成定局的現實。

      　　「為什麼……」

      　　哽咽的質問並無法得到回答，眼淚一顆接著一顆砸落，盡數消失在星海的微光之中。

      　　「為什麼治不好……」

      　　光伸出手，輕輕覆上他無措的手腕。

      　　「拉哈。」

      　　古·拉哈·提亞像是沒有聽見他的叫喚，慘白的臉被治癒術的光芒照得毫無血色，他的呼吸越來越急，胸口劇烈起伏，聲音也逐漸被壓抑不住的悲傷截斷。

      　　「我可以的……只要你還活著……我就可以……」

      　　話說到一半，空氣忽然卡在喉間。

      　　古·拉哈·提亞猛地吸了一口氣，卻怎麼也無法讓呼吸順下去。

      　　眼前的景象被淚水攪得一片模糊。

      　　他像溺水的人一樣急促喘息，肩膀控制不住地顫抖，手卻仍死死停留在光胸前的傷口上，不肯鬆開。

      　　「拉哈。」
      　　
      　　光握緊了他的手，輕聲嘆息。

      　　「沒用的。」

      　　古·拉哈·提亞的瞳孔劇烈顫動。
      　　
      　　光只是靜靜望著他，殘忍但堅定地重申那他們都早已知曉的現實。

      　　「我已經回歸星海了，你很清楚這意味著什麼。」

      　　古·拉哈·提亞怔怔地看著他。

      　　下一秒，他整個人撲了上去。

      　　「不會的！」

      　　那聲音幾乎是從胸腔最深處撕裂出來。

      　　古·拉哈·提亞緊緊抱住光，手指死死嵌進背後殘破的衣甲，彷彿用盡全力將人護在自己的胸膛，不讓任何力量將他們分開。

      　　「你明明……明明就還在我眼前！」

      　　古·拉哈·提亞把臉深深埋進光的肩窩，滾燙的眼淚一顆顆砸落在佈滿血跡的戰甲上。

      　　「你可以跟我走……跟我們一起走！」他的聲音劇烈顫抖，幾乎每個字都被哭腔扯得支離破碎，「我一定有辦法把你帶回來……一定可以……」

      　　光握緊的拳頭垂在身側。

      　　他低下頭，看著懷裡哭得幾乎喘不過氣的人，眼底浮起深沉得近乎無可奈何的疼惜。

      　　若做得到的話，自己何嘗不想答應，何嘗不想像過去無數次那樣，只要古·拉哈·提亞伸出手，便再次跟著他踏上旅途。

      　　可這一次，沒有能夠回去的路。

      　　「但我已經屬於這裡了。」

      　　最後，光仍只能一遍又一遍重申那個最殘忍的答案，聲音輕得彷彿一出口就會化開在空中，像怕再多用一點力氣，就會把懷裡的人徹底擊碎。

      　　古·拉哈·提亞依然用力搖頭。

      　　「為什麼……」

      　　哭腔終於徹底壓碎了他的聲音。

      　　「我們明明一起努力了這麼久……」

      　　每說幾個字，便要被一口凌亂的喘息截斷。

      　　「從我在那座塔裡醒來開始……做了這麼多的準備、熬過那麼久的時間……」

      　　古·拉哈·提亞的手指抓得更緊，他的聲音已經完全變了調。

      　　「我不是想要什麼了不起的結果……我就、就只想要你好好地活著……哪怕多一天也好，能笑著去任何你想去的地方，自由自在地存在這個世界……」

      　　淚水不停浸入光肩上的衣料，古·拉哈·提亞絕望地搖著頭，聲音驟然哽住。

      　　「就只是這麼簡單的願望而已，為什麼我總是沒辦法留住你……」

      　　光靜靜地聽著，終於抬起手，慢慢抱住那副顫抖得幾乎無法站立的身體，直到古·拉哈·提亞再也說不出完整的話，他才將人稍微拉開，雙手捧住他的臉。

      　　「看著我，拉哈。」

      　　古·拉哈·提亞根本睜不開眼，淚水不斷沿著臉頰滑落，連睫毛都濕成一片。

      　　光用拇指揉去那些水珠，一次又一次。

      　　最後，他將額頭輕輕抵了上去。

      　　「慢慢呼吸。」

      　　古·拉哈·提亞仍在發抖。

      　　光的聲音很輕，像很久以前，在某段漫長旅途中一次次安撫身旁的人那樣，沉痛的藍眼微張，他同樣壓抑著情緒，深深望進早被淚水浸濕的紅眼。
      　　
      　　「對不起，拉哈。」

      　　「那個時候，我只能把你們送走。我也想拯救你們存在的這個世界，想拯救你們的未來。」

      　　他的聲音慢慢變得沙啞。

      　　「我想讓你們活下去，活在一個可以安心存在、不需要再為末日恐懼的世界裡。」

      　　古·拉哈·提亞猛地搖頭。

      　　「可是我做不到……」

      　　他緊緊扯住光的衣袖，用盡全力留住這曾一度流失在他懷裡的體溫。

      　　「沒有你，我根本沒辦法……」

      　　「你可以。」

      　　「我不行！」

      　　古·拉哈·提亞幾乎是哭喊出聲。

      　　「我試過了！真的……可是每一次想到以後都不會再看見你，我就……」

      　　他低下頭，剩下的話再也說不出口。

      　　光安靜地看了他一會兒，然後，他忽然低聲說。

      　　「無論你曾走了多遠……迄今為止的所有冒險，都與今天的你緊緊相連。」

      　　古·拉哈·提亞怔住，喘著氣的嘴唇無助地顫抖。

      　　光望著他，眼神柔和得近乎懷念。
      　　
      　　「那段你獨自度過的過去，或是後來我們一起走過的旅程，絕不是徒勞。」

      　　光替他擦去眼角重新湧出的淚，輕輕露出微笑。
      　　
      　　「想想第一世界的人們……你為他們重新帶回黑夜、教會他們面對困難的勇氣，那些事情不會因為我死去，就全部失去意義。」

      　　「還有我們的約定，拉哈，關於未來的約定。」

      　　古·拉哈·提亞的眼淚又掉了下來。

      　　「可是你不在……那些約定又有什麼意義……」

      　　「我一直都在。」

      　　光打斷他。

      　　「我一直在星海看著你們。我知道人們因為無法接受我的死，犯下了錯誤。」

      　　他的視線越過古·拉哈·提亞，落向不遠處那道始終沉默的身影。

      　　「也知道有人因此被留了下來。」

      　　在遠方，蠻神靜靜站在星海的微光裡，注視著他們的背影。

      　　光微微垂眼，很快收回視線。

      　　「但是拉哈。」

      　　他重新看向古·拉哈·提亞。

      　　「我們為了守護世界而踏上旅程，不是為了讓你留在一座塔裡，永遠停在失去我的那一天。」

      　　「我希望你繼續走，把我們還沒走完的旅程走下去。」
      　　
      　　光握住了他的手。

      　　直到這時，他才發現古·拉哈·提亞的掌心還緊緊攥著方才撿起的乙太水晶碎片。

      　　邊緣早已割破皮膚，鮮血沿著指縫滲出。

      　　光微微皺起眉，一根一根撥開古·拉哈·提亞緊攥的手指，將那片染著鮮血的碎晶取了出來，然後將另一枚橙紅色的水晶放在他手裡。

      　　古·拉哈·提亞怔住，熟悉的紋章映著星海流動的微光，在掌心靜靜亮起。

      　　「這個……」

      　　「替我保管。」

      　　光將他的手指重新攏起，讓那枚阿謝姆水晶安穩地留在手掌中。

      　　「雖然愛梅特賽爾克知道了，大概會狠狠罵我一頓……」

      　　他想起那個人時，唇邊浮起一點極淡的笑意。

      　　「但我還是想把它交給你。」

      　　古·拉哈·提亞低頭望著掌心。

      　　「這枚水晶陪我走過了屬於我的旅程。」他輕聲說，「接下來，它也會陪著你。」

      　　古·拉哈·提亞猛地收緊手指，眼淚再次滾落，砸在兩人交疊的手背上。

      　　光沒有替他擦去，只是將那隻手握得更緊。

      　　「拉哈。」

      　　他緩緩閉上眼。

      　　「你曾經把未來帶給第一世界，也曾經跨越時間，把原本不屬於我的未來重新帶回來。」

      　　「所以，不要讓你的旅程停在這裡。」

      　　光重新睜開眼，靜靜注視著他。

      　　「我的故事走到這裡，不代表你的也必須結束。」

      　　「接下來，是屬於你的旅程。」

      　　古·拉哈·提亞怔怔望著他。

      　　光卻只是笑了笑，朝他張開雙手。

      　　「過來。」

      　　古·拉哈·提亞的嘴唇顫了一下。

      　　「光……」

      　　「讓我最後再抱你一次。」

      　　那句話讓好不容易平復些許的眼淚再次潰堤。

      　　古·拉哈·提亞幾乎是跌進他的懷裡。

      　　光穩穩接住他，雙臂收緊，將下顎抵上他的紅髮。

      　　「接下來的路，我也會這裡一直看著你。」

      　　掌心溫柔地覆上古·拉哈·提亞濕潤的眼睛。
      　　
      　　「我會透過你，看著那些我們曾約好的地方、或者是連我也不知道的地方。」

      　　「然後等有一天，你重新回到這裡，再來找我、驕傲地跟我分享屬於你的旅途。」

      　　光低下頭，最後一次親了親他的額髮。

      　　「明白嗎？」

      　　古·拉哈·提亞還來不及回答，覆在眼前的掌心泛起柔和的光。

      　　疲憊、悲傷與一路勉強維持至今的力量，終於在那份熟悉的乙太中徹底鬆懈。

      　　他甚至來不及喊出光的名字，身體便失去力氣，安靜地軟倒在懷裡。

      　　光低頭看了他很久，直到確認那張哭得狼狽的臉終於沉入平穩的睡眠，才輕輕替他撥開眼角濕潤的髮絲。

      　　遠處，另一個光始終沉默地看著這一切。

      　　過了很久，蠻神終於轉過身，朝他們前來的方向離去。

      　　「謝謝你。」

      　　身後忽然傳來聲音，止住了他的腳步。

      　　「謝謝你保護他，一路走到這裡。」

      　　蠻神沉默片刻，輕笑了一下。

      　　「……我只是做了你會做的事。」他低聲說，「守著他，直到最後一刻。」

      　　星海的微光從兩道相同的背影之間緩緩流過。
      　　
      　　蠻神最後回頭，望了眼靜靜沉睡的身影，眼底流轉著懷念與不捨。

      　　「在你的記憶裡，他總是喊你英雄。」

      　　那聲音很平靜，甚至帶著一點往日談起冒險時才有的輕鬆。

      　　「既然我是由他的願望而生……最後，就讓我做一回英雄該做的事吧。」

      　　蠻神重新邁開腳步，而真正的光沒有阻止，只是抱緊懷裡沉睡的人，靜靜看著那道身影走向前方的通道。
  - title: 最後的旅程 - 5
    body: |-
      　　星海深處泛著幽暗的微光。
      　　
      　　蠻神踩著毫無聲響的步伐，一步一步自結晶道路逆行而上，在唯一的出口處，嚴陣以待的眾人早已站定陣位，高舉著武器警戒著。
      　　
      　　為首的正是拂曉血盟的同伴，身後跟著少數神色緊繃的軍團精銳。歸屬各異的甲冑、披風，甚至法袍的領口處，都懸掛著泛著微光的龍鱗。
      　　
      　　顯然，為了討伐蠻神，他們做足了準備。
      　　
      　　光停下腳步，目光自每一張熟悉的臉孔上緩緩掠過，唇角輕輕牽起，眼底泛起一抹極淡、卻無比欣慰的笑意。
      　　
      　　他舉起手，耀眼的光芒自掌心而起，一柄純粹由乙太匯集而成的武器逐漸成形。光揮過武器、劍尖的光芒劃出一道鋒利的銀月，橫於身前、正對著眾人。
      　　
      　　戰鬥一觸即發，在場所有人的神經瞬間緊繃到極致。
      　　
      　　雅·修朵拉手持咒杖，從人群前方走出了半步。她的手輕輕地朝後一揮、示意眾人稍安勿躁，隨後微微側頭、眉心蹙起，聲音在空曠的通道間迴盪。
      　　
      　　「我不明白。」
      　　
      　　她手中的法杖輕敲地面，激起星海的微光稍稍震盪。
      　　
      　　「薩雷安早在數天前便將水晶盡數轉移，這條通往星海深處的死路，你不可能感覺不到其中的能量──為什麼還要來到這裡？」
      　　
      　　光神色漠然，湛藍的眼睛平靜無波，沒有給出任何回應。
      　　
      　　站在一旁的尤里安傑神色沉痛地高舉著星盤，他的目光落在光空無一人的身後，沉聲詢問：「……古·拉哈·提亞呢？」

      　　聽見那個名字的瞬間，光那雙平靜的眼眸極輕微地顫動了一下。

      　　僅僅是這一瞬的動搖，便被桑克瑞德敏銳地捕捉，他銳利的眼神仔細地注視著光的姿態，隨後狐疑地蹙眉。
      　　
      　　蠻神的劍並非單純擺出迎擊的模樣，而是橫在身側，將通往身後深處狹窄的入口遮得密不透風。
      　
      　　那是一個純粹守護者的站位。
      　　
      　　阿莉塞最先反應過來，她的視線越過光的肩膀，望向那片深不見底的星海深處，下意識往前踏出半步，「難道……難道他在裡面，還有──」
      　　
      　　光眼中的波瀾在瞬間收束，劍尖微微壓低，直指阿莉塞欲將前往的方向。
      　　
      　　「別過去。」他的聲音依舊平靜，目光卻警告地掠過每一個人，「他已經到達了『光』的身邊。」
      　　
      　　空氣彷彿在一瞬間凍結。
      　　
      　　「星海深處……」桑克瑞德瞳孔收縮，隨後厲聲質問：「你說他到達了哪裡？！」
      　　
      　　「真正的英雄，靈魂早已回歸星海。」
      　　
      　　雅·修朵拉低沉的嗓音打破了死寂，她面色凝重，連語氣都少見地染上慌亂，「這裡是靈魂消散與輪迴的中樞，生與死模糊的界線……倘若古·拉哈的乙太受到亡者的影響，那他與光──」
      　　
      　　「那個笨蛋……！」阿莉塞咬破了嘴唇，眼眶泛紅，拔出細劍就要往前衝，「不能放拉哈一個人！他會做出傻事的！」
      　　
      　　銳利劍氣的聲響劃破空氣。
      　　
      　　光手中的長劍橫掃而出，強烈的乙太在結晶道路上刨出一道深不見底的焦痕，硬生生逼退阿莉塞的步伐。
      　　　　
      　　「我說過，不要去打擾他。」蠻神的神情在強光中無比堅定，語氣間的溫柔又近乎殘忍，「如果想要通過這裡，就先跨過我。」
      　　
      　　拂曉眾人的呼吸一滯。
      　　
      　　沒有退路，也沒有時間猶豫。
      　　
      　　艾斯蒂尼安的龍槍在掌中轉動，桑克瑞德也緊握住肩上的槍刃，阿爾菲諾身後的賢具劃出流光，跟著尤里安傑手中的星盤一同流轉。
      　　
      　　看著嚴陣以待、眼中滿是焦急與煎熬的夥伴們，光臉上的笑容盡數收起。
      　　
      　　戰鬥在瞬間爆發。
      　　
      　　光的身影瞬間消失在眾人眼前，劍刃挾帶著風暴，直逼龍槍而來。艾斯蒂尼安反射性架槍迎擊，刺耳的武器碰撞聲迴盪在空曠的星海，衝擊瞬間震碎了他腳下的結晶，碎片隨著氣流散了開來。
      　　
      　　同一時間，兩人的身後閃過一道陰影，自側邊切入的桑克瑞德高舉著散發光芒的槍刃，晶壤爆破的瞬間，連頭都沒回的光只是左手一揮，數柄短刃隨即破空而出，尖端擦過桑克瑞德的側腰，從大衣後方直穿而去，鮮血順著軌跡染紅了白衣，逼得他不得不翻身躲避。
      　　
      　　艾斯蒂尼安轉動手腕，藉由龍槍的風勢拉開與蠻神的距離，迅速地退回桑克瑞德身邊。
      　　
      　　不過兩招的時間，實力的差距已然分曉。
      　　
      　　拂曉的眾人紛紛垂下視線。
      　　
      　　起初，他們出招之間仍帶著難以割捨的猶豫與遲疑──即便知道那是蠻神，可眼前這張臉、這身招式，全都是他們無數次託付過後背的英雄。
      　　
      　　然而，光的攻擊卻沒有絲毫留情。
      　　
      　　手中迅速結印，落雷在瞬間擊碎阿爾菲諾展開的守護障壁，阿莉塞的刺擊也被輕巧地避了開來。光的手掌散發著強烈的乙太，反手一記掌擊、重重印在她胸口的護甲上，將她整個人擊飛出去，撞上身後的岩壁。
      　　
      　　「站起來。」
      　　
      　　漫天光芒中，光俯視著滿身傷痕、相互攙扶著的年輕精靈，語氣淡然得近乎無情。
      　　
      　　「不拿出殺死我的覺悟，你們真的會死在這裡。」
      　　
      　　那雙藍色的眼眸裡沒有殺意，卻燃燒著逼迫他們超越極限的威壓。
      　　
      　　阿莉塞咳出一口血沫，卻毫不在意地抹去嘴角的紅痕，眼中泛起決絕的光芒。
      　　
      　　「……別小看我們！」
      　　
      　　她低喝著，再次踏步而起，不再多言的光也爆發出體內強烈的乙太，無數光線勾勒出的武器鋪天蓋地而來，暴風席捲整片戰場，壓制著其他軍團的士兵。
      　　
      　　「阿爾菲諾！尤里安傑！」
      　　
      　　雅·修朵拉厲聲高喊，腳下張開的光芒勾勒出魔紋，在同伴們的掩護下喚出能燃盡一切的火焰。
      　　
      　　這是一場近乎慘烈的苦戰。
      　　
      　　拂曉眾人摒棄了所有的退路，將彼此的身軀化作盾與矛。桑克瑞德以血肉之軀扛下刀刃的劈砍，為艾斯蒂尼安爭取了騰空的時間，長槍如流星般重重墜下，奮力擊潰光身後的武裝；阿爾菲諾大張著手臂，讓障壁維持在同伴身旁，一邊伺機而動地撕裂著光的防禦。
      　　
      　　終於，蠻神身周的乙太屏障在黑魔法引發的爆炸中轟然破碎，緊抓住空隙的阿莉塞渾然不顧爆炸的氣流劃破身周，她化作一道赤紅的殘影，手中細劍凝聚著全數的魔力，筆直地朝光的胸膛刺了進去。
      　　
      　　她傾盡一切，只為了自己認定的人而戰。
      　　
      　　然而，就在劍尖即將沒入心口的瞬間，阿莉塞的眼角卻瞥見了光的表情──沒有閃避，甚至沒有抬劍防禦，藍眼只是安靜地看著她，帶著一絲戰場本不該存在的溫和。
      　　
      　　那一瞬間，阿莉塞的手腕微不可察地顫抖了一下，清澈的眼睛劇烈地震盪著。
      　　
      　　「光──」
      　　
      　　還未來得及呼喊，沉重的手臂猛地將她向旁推開。
      　　
      　　桑克瑞德與艾斯蒂尼安幾乎在同一時間交錯上前，將少女徹底隔在身後，在過往歲月中最常背負沉重決斷的戰士們，毫不猶豫的眼神帶著堅毅，義無反顧地承擔了弒神的罪責。
      　　
      　　武器刺穿血肉的聲音，讓瞬息萬變的戰場瞬間靜了下來。
      　　
      　　槍刃的利芒與龍騎士的長槍貫穿了光的胸膛，狂暴的乙太與鮮血同時噴湧而出，兩人卻死死地壓著武器，直到風暴平息都不放手。
      　　
      　　強烈的力流激蕩著星海，隨後緩緩陷入寂靜。
      　　
      　　阿莉塞摔在地上，怔怔地望著蠻神逐漸被血染紅的後背。
      　　
      　　被貫穿身軀的光，身體微微一晃。
      　　
      　　但他沒有倒下。
      　　
      　　在所有人的注視下，他緩緩抬起頭，唇邊揚起一抹真正卸下重擔的微笑。
      　　
      　　「……真強啊。」
      　　
      　　光笑出了聲，笑得痛快又釋懷。他伸出雙手，像過去無數次擁抱一樣，握成拳、用力捶了捶曾經的戰友。
      　　
      　　「真不愧是拂曉血盟。」
      　　
      　　桑克瑞德沒有抬頭，雙手死死抓著染血的槍柄，指節泛著慘白。他扯了扯嘴角，極力想用平日那種玩世不恭的輕挑語調回答，尾音卻在發顫。
      　　
      　　「那還用說嗎……你以為我們是誰的同伴啊。」
      　　
      　　「這是那傢伙用命換回來的世界。」
      　　
      　　艾斯蒂尼安雙手緊壓著長槍，始終沒有移開視線，低啞的嗓音彷彿是在對某個身影立誓，「無論發生什麼，我們都會替他守住。」
      　　
      　　聽見他的話，光彎起的藍眼靜靜垂了下來。
      　　
      　　他鬆開了長劍，武器在空中化作碎屑，取而代之的是一柄純白無瑕、散發著柔和微光的長杖。
      　　
      　　「那是……」雅·修朵拉失聲喃喃。
      　　
      　　最後的乙太自光的體內盡數爆發，但預想中的毀滅並未降臨。
      　　
      　　那是白魔法師的治癒之光。
      　　
      　　溫暖、純粹、帶著如晨曦般的治癒之風，自法杖頂端呼嘯而出，化作一陣柔和而浩瀚的光雨，席捲了通道內的每一個人。
      　　
      　　傷口以肉眼可見的速度癒合、耗竭的力氣瞬間被填滿，甚至連那些遠處癱倒的兵團衛兵，也在這股溫和的光芒中平穩了呼吸。
      　　
      　　光的形體開始從邊緣逸散，化作漫天飛舞的瑩白光點，蔚藍的眼睛最後深深看了眼曾經的同伴，隨後安詳又輕柔地閉了起來。
      　　
      　　在守護與治癒同伴的光輝中，蠻神漸漸散去了身影。
      　　
      　　戰場只剩下一片死寂。
      　　
      　　桑克瑞德脫力般跌倒在地，長長地吐出一口氣，手掌捂住了面孔，艾斯蒂尼安也將長槍杵在地上，靜靜地矗立著。
      　　
      　　「拉哈……！」
      　　
      　　阿莉塞猛地回過神來，連忙從地上站起，不顧一切地繞過那片殘留著微光的空地，朝著星海深處狂奔而去。
      　　
      　　「阿莉塞！」
      　　
      　　阿爾菲諾也急忙爬起身，與雅·修朵拉等人一同邁開步伐，緊追在後。
      　　
      　　穿過漫長幽暗的狹窄甬道，眼前的視野豁然開朗。
      　　
      　　在那片靜謐又神聖的水晶殘片中央，古·拉哈·提亞安靜地倒在那裡。
      　　
      　　他側躺在冰冷的地面上，呼吸平穩而綿長，神情安詳得就像只是在漫長疲憊的旅途中，伏在營火旁沉沉睡去。
      　　
      　　而微曲的手掌心中，靜靜躺著一枚散發著淡淡橙紅色光芒的晶石。
      　　
      　　陽光般的星紋在幽藍的星海深處微微閃爍。

      　　阿莉塞緩緩跪了下來，雙手摀住了嘴，淚水無聲地順著指縫滑落。
      　　
      　　拂曉的同伴們站在她的身後，靜靜注視著沉睡的青年，在星海的微光中，沉默地見證這場漫長旅途的落幕。
  - title: 最後的旅程 - 終章
    body: |-
      　　在新大陸深處，林間濕潤清澈的氣息被刺鼻的血腥味攪亂，打破了村落原本的寧靜。
      　　
      　　幾隻體型龐大、生著硬棘的魔獸為了覓食而闖出了森林，挾帶著嘶吼與咆嘯，一邊撞擊著村落外圍簡陋的木樁柵欄。
      　　
      　　「快把柵欄頂住！」
      　　
      　　「女人跟孩子退到屋子裡去！」
      　　
      　　村裡的壯丁們握著草叉、獵弓與生鏽的砍刀，腳步顫抖地聚在一起。準備再度俯衝的魔獸用尖銳的爪子刨著泥地，發紅的眼睛緊緊注視著武裝薄弱的村民，口齒邊緣正瀰漫著腐蝕的黑氣。
      　　
      　　在斜坡上方的樹木後，一名年輕的冒險者正緊緊壓低身子，他背著一把對他身形而言略顯沉重的雙手斧，手心滿是黏膩的濕汗。
      　　
      　　他想幫忙，但沒把握自己能不能制伏那種等級的魔獸，退縮的念頭與焦急的情緒正不斷拉扯。
      　　
      　　就在猶豫的時刻，下方傳來一聲木樁徹底斷裂的巨響。一隻魔獸衝破了缺口，將一名年輕的村民撞翻在地，腥臭的大嘴直直咬向那張滿是恐懼的臉。
      　　
      　　刺耳的哭喊與無助的驚呼瞬間刺痛了他的耳膜。
      　　
      　　「可惡……管不了那麼多了！」
      　　
      　　年輕人狠狠咬牙，眼中最後一絲猶豫被熱血沖散。他猛地拔出背後的斧頭，雙腳用力一蹬，正準備從坡道上一躍而下──
      　　
      　　身側突然刮過一陣強烈的魔力。
      　　
      　　空氣中的乙太劇烈震盪，隨後數道雷光浮現在所有魔獸的上方，落雷在瞬間直直而下，野獸的吼叫瞬間蓋過了村民的驚呼。
      　　
      　　焦糊的氣味伴隨著此起彼落的哀鳴劃破天際，遭受攻擊的獸群不敢再前進，在原地對峙片刻後，終究夾著尾巴、狼狽地逃回茂密的樹林。
      　　
      　　冒險者愣在原地，雙手還僵硬地高舉著戰斧。
      　　
      　　他驚訝地回過頭。
      　　
      　　微風吹動著樹梢，不知何時站在他身旁不遠處的，是一名身披旅人斗篷的貓魅族青年。
      　　
      　　那人身姿挺拔，手中握著微光流轉的法杖，拉開的兜帽露出一頭鮮明的紅髮與微微抖動的耳尖。赤紅的眼眸平靜而堅定，甚至連呼吸都沒有因為施放魔法而受到擾亂。
      　　
      　　短暫的寂靜後，村子裡爆發出劫後餘生的歡呼。
      　　
      　　「得救了……！」
      　　
      　　「恩人！是兩位路過的冒險者救了我們！」
      　　
      　　村民們激動地湧了上來，不由分說地將站在坡道上的兩人團團圍住，熱情地迎進了村落。
      　　
      　　簡陋卻溫馨木屋裡，桌上擺滿了熱氣騰騰的燉肉、新烤的麵包與當季的野果。村民們圍著紅髮的貓魅族青年千恩萬謝，而那位施法者始終保持著謙遜溫和的微笑，禮貌地推辭著村長塞來的報酬，只收下了一小袋充飢的乾糧與飲水。
      　　
      　　年輕的冒險者坐在長桌的角落，數次偷偷打量著對方。
      　　
      　　無論是方才施放魔法的從容，還是此刻應對村民時那種自然流露的沉穩，都透著一種遠超同齡人的氣度。
      　　
      　　好不容易等到村民散去，年輕人連忙端著杯子，有些拘謹地湊了過去。
      　　
      　　「那個……剛才真是太厲害了！」
      　　
      　　冒險者抓了抓後腦勺，有些靦腆地咧嘴笑道：「要不是有你，我剛才魯莽衝下去，說不定自己也討不了便宜。你真的很強啊！」
      　　
      　　紅髮的青年轉過頭，有些意外地眨了眨眼睛，隨後露出了柔和的笑意。
      　　
      　　「不，你也拔出武器了不是嗎？在面對危險時，能為了保護他人邁出腳步，這本身就非常勇敢了。」
      　　
      　　被這麼一誇，年輕人的臉頰微微發燙，連忙換了個話題掩飾害羞：「對了，看你的打扮，好像不是這裡的人？怎麼會跑到這麼偏僻的林子裡來？」
      　　
      　　貓魅族青年微微怔了怔。
      　　
      　　他的視線不自覺地飄向窗外蔚藍無垠的天空，神情中掠過一抹不易察覺的懷念與溫柔。
      　　
      　　「我……跟一個重要的人有過約定。」
      　　
      　　他輕聲說道，語氣悠遠綿長。
      　　
      　　「我們約好了，要去看遍那些還沒踏足過的地方，所以，我現在正在世界各地旅行。」
      　　
      　　「在世界旅行啊……好厲害！」
      　　
      　　年輕人一臉憧憬，眼中閃爍著耀眼的光芒，語氣裡滿是羨慕。
      　　
      　　「我一直夢想著能走出這片大陸去看看外面的天地，但我的實力還差得遠呢，現在也只能在周邊接點清理魔獸的委託，還在摸索怎麼成為一個合格的戰士。」
      　　
      　　順著話語，紅髮青年的目光落在他身後那柄邊緣有些磨損的雙手斧上。
      　　
      　　那一瞬間，紅眼浮現出一絲極深的懷念。
      　　
      　　但他什麼都沒有說，只是安靜地收回了目光。
      　　
      　　年輕的冒險者並未察覺對方的異樣，反而像是打開了話匣子，興致勃勃地湊近了些。
      　　
      　　「對了！既然你在世界各地旅行，那有沒有聽說過那個傳說？」
      　　
      　　「傳說？」
      　　
      　　「就是艾奧傑亞的英雄啊！」年輕人握緊了拳頭，胸膛挺得筆直，語氣裡滿是毫無保留的狂熱與崇拜，「傳聞中終結了末日、守護了整個世界的『光之戰士』！」
      　　
      　　貓魅族青年的身體機不可察地震了下。
      　　
      　　「雖然聽說那位英雄後來去了很遠的地方……但商隊的吟遊詩人們都在傳頌他的故事。」冒險者神采奕奕地說著，眼底燃燒著最純粹的野心與志向，「那可是我一生的目標！總有一天，我也要成長到那麼強大，成為能像他一樣保護大家的英雄！」
      　　
      　　兩人之間短暫地安靜了下來。
      　　
      　　青年愣愣地看著眼前的冒險者，赤紅的眼眶深處微微發熱，但他很快低下頭，將翻湧的情緒藏進了眼底。
      　　
      　　「……啊！抱歉抱歉！」
      　　
      　　冒險者突然一拍腦袋，有些懊惱地驚呼起來：「我光顧著自己說個不停，太沒禮貌了，居然到現在都還沒自我介紹！」
      　　
      　　他大大方方地伸出長滿繭的手，露出燦爛無比的爽朗笑容。
      　　
      　　「我叫查斯特，是個還在修行的冒險者！你呢，叫什麼名字？」
      　　
      　　青年抬起頭，赤色的眼眸微微瞇起，唇角牽起一抹無比溫暖、純粹的微笑。
      　　
      　　他伸出手，握住了那隻年輕而溫熱的掌心。
      　　
      　　「很高興認識你，至於……我的話……」
      　　
      　　微風吹過窗櫺，揚起他額前的紅髮，與清亮而堅定的聲音一同傳播了出去。
      　　
      　　「在旅途上，你就叫我『光』吧。」
