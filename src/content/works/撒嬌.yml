  - body: |-
      　　任務結束得比預想中順利。
      　　
      　　最後一頭魔物倒下後，桑克瑞德簡單確認過周遭，再低頭檢查自己的裝備。除了大衣沾了些塵土，身上連像樣的擦傷都沒有。
      　　
      　　至於光，方才還站在他旁邊活動肩膀，神色輕鬆得像是做了個簡單的暖身運動。
      　　
      　　「走吧，趁天還沒黑。」
      　　
      　　桑克瑞德招呼一聲，往前走了幾步，卻遲遲沒聽見身後跟上的腳步聲。
      　　
      　　他回頭，然後看著大英雄不明所以的舉動，沉默了下來。
      　　
      　　光正蹲在地上，一隻手抓著泥巴，往自己盔甲上抹，端詳了身上的髒污分佈後，又從草地裡撿了兩片枯葉，往肩甲的縫隙塞。
      　　
      　　桑克瑞德看了半晌，終於沒忍住，「你在幹嘛？」
      　　
      　　光沒理睬他，只是低頭抓了一把草屑，拍到自己的褲腿上。待一切完成後，他雙手左右交錯、拍了拍塵土，露出滿意的笑容。
      　　
      　　桑克瑞德瞇起眼，看著大英雄把自己加工得頗具成果──衣服上全是灰泥，髮梢掛著草屑，連臉頰都不知道什麼時候蹭上了一道髒痕。
      　　
      　　乍看之下，像是剛經歷完一場苦戰。
      　　
      　　他就這麼眼睜睜地看著光裝模作樣地回到石之家，藍眼準確無比地越過眾人，落到房間另一頭的古·拉哈·提亞身上。
      　　
      　　接著，他腳步虛浮地飄了過去，渾身透露出一股疲憊的氣息，然後拉開椅子、軟趴趴地癱在古·拉哈·提亞身旁。
      　　
      　　……明明剛才一路上走得比誰都穩健。
      　　
      　　「你們回來了──」
      　　
      　　古·拉哈·提亞才剛露出笑容，看清光的模樣後，神色瞬間變了。
      　　
      　　「怎麼弄成這樣？！」
      　　
      　　光不輕不重地嘆了口氣，伸手揉按著眼角。
      　　
      　　「是有點麻煩的任務。」
      　　
      　　桑克瑞德站在後方，眉毛抽了一下。
      　　
      　　偏偏古·拉哈·提亞完全沒有懷疑，不僅如此，那雙紅色的眼睛裡甚至明顯浮現了擔憂，以及某種桑克瑞德已經看得相當熟悉的敬佩。
      　　
      　　「連你都弄得這麼狼狽……辛苦了，我的大英雄。」
      　　
      　　他急急忙忙找了塊乾淨的布巾，沾過水後站到光面前，小心替他擦掉臉頰上的泥污。
      　　
      　　「先別動。」
      　　
      　　光果然一動不動，甚至瞇起眼、非常配合地仰起了頭，乖順地接受那抹濕潤的溫度。
      　　
      　　古·拉哈·提亞一邊替他擦臉，一邊皺著眉仔細打量。
      　　
      　　「有沒有哪裡受傷？」
      　　
      　　「有。」光回答得毫不猶豫，「等等去房間幫我看看。」
      　　
      　　「好。」
      　　
      　　桑克瑞德瞇起眼睛，終於感到忍無可忍。
      　　
      　　這傢伙，明明剛才還漫不經心地看著身上的傷，然後對自己揮了揮手，表示無傷大雅。
      　　
      　　現在這簡直判若兩人的舉動，真的是……
      　　
      　　他忍不住大步走向前，高舉手掌，然後一巴掌用力扒上英雄的後腦勺。
      　　
      　　「腦袋也順便幫他看看。」
      　　
      　　青年冷冷一笑，看著古·拉哈·提亞滿頭霧水的神情，同情地拍了拍他的肩膀。
