  - body: |-
      　　光有很多寵物。
      　　
      　　有些是拿軍票開箱子兌換來的，有些是在迷宮深處不知怎地跟著她回來的，還有些甚至連古·拉哈·提亞都看不出來，那些小東西究竟是被她馴服了，還是單純生活在自己的棲地，就這麼被英雄撿回家。
      　　
      　　他們平日散在房間各處，有的窩在地毯上，有的蹲在書架頂端，也有幾隻總喜歡跟著她的腳步，在她身後排成一串。
      　　
      　　而光最喜歡的，偏偏是兩隻與他有關的小寵物。
      　　
      　　一隻是他剛踏入水晶塔時的模樣，紅髮貓耳，相異的瞳色；另一隻則披著水晶公的長袍，總是端端正正地站著，偶爾抬起手，擺出像是在施展魔法的姿勢。
      　　
      　　光很喜歡他們，喜歡到即使古·拉哈·提亞本人已經躺在她身邊，她仍會下意識地把兩隻小人偶一左一右地摟進懷裡。
      　　
      　　「……我就在這裡啊。」
      　　
      　　第一次看見這幅景象時，古·拉哈·提亞扁著耳朵、忍了半晌，還是忍不住開口。
      　　
      　　累極了的光已經閉上眼睛，含糊地應了一聲。
      　　
      　　「嗯，我知道。」
      　　
      　　她的語氣平靜得像是在回答一件理所當然的事，接著便翻了個身，連被子一起捲走大半。
      　　
      　　順帶一提，她雖然是個女孩子，睡姿卻十足展現冒險者的豪放不羈。
      　　
      　　前一刻還好好躺著，下一刻便能橫過半張床，一條腿壓著被子，另一條手臂大大方方地伸展開來。
      　　
      　　據她所言，自己有抱著東西入眠的習慣，在睡夢中還會伸出手，把身旁能碰到的東西全攬進懷裡。
      　　
      　　那兩隻小寵物自然也不例外。
      　　
      　　年輕模樣的古·拉哈·提亞被她抱在臂彎裡，臉頰緊緊地貼著紅色的貓耳，水晶公則被壓在枕邊，只露出半張臉。
      　　
      　　至於真正的古·拉哈·提亞，只能可憐兮兮地被擠在床邊，隨時都有掉下去的危險。
      　　
      　　「光……」
      　　
      　　「嗯……」
      　　
      　　「是不是應該抱我才對？」
      　　
      　　「唔，漏了。」
      　　
      　　她迷迷糊糊地說完，手臂往旁邊一掃，總算也把他勾了過去。
      　　
      　　只是被她一起拖進懷裡的，還有那兩隻小寵物。
      　　
      　　於是最後變成了古·拉哈·提亞隔著兩個「自己」，艱難地貼在她肩側。
      　　
      　　他低頭看著橫在兩人中間的兩張臉，一時間竟不知該對哪一個生氣。
      　　
      　　這種情況持續了很久。
      　　
      　　起初他曾試著偷偷把小寵物挪開。
      　　
      　　可每次只要離開光的手邊，他們便會搖搖晃晃地走回來。年輕的那隻會蹭到她臂彎旁，水晶公則握著小法杖，安靜地坐在枕畔，怎麼看都像兩個早已熟悉自己位置的小小守衛。
      　　
      　　而光也總能在睡夢中精準地把他們重新撈回來。
      　　
      　　事後，古·拉哈·提亞旁敲側擊地打聽，才知道這兩隻魔法人偶曾經陪伴光渡過許多難熬的夜晚。據拂曉其他夥伴所言，在自己尚未陪伴在光身邊時，偶爾還會看見英雄忍著眼淚，偷偷跟他們說話的畫面。
      　　
      　　最終，古·拉哈·提亞終於不得不承認，在與自己有關的事情上，他竟然輸給了兩隻巴掌大的小人偶。
      　　
      　　某一天，光一早便為了委託出了門。
      　　
      　　據說是有人在野外發現了極其危險的魔物，她只來得及披上衣甲，便急匆匆地離開。臨走前，她還不忘回頭叮囑古·拉哈·提亞，記得替房裡幾隻怕冷的小寵物把窗戶關好。
      　　
      　　古·拉哈·提亞站在門邊，看著她的背影消失在長廊盡頭，回頭時，恰好與桌上的兩隻小寵物對上了視線。
      　　
      　　紅髮異色瞳的那隻微微偏頭，水晶公也慢慢轉過身來。
      　　
      　　「……」
      　　
      　　古·拉哈·提亞沉默片刻，一個念頭悄悄冒了出來。
      　　
      　　只是暫時的，他對自己說。
      　　
      　　並不是討厭他們，也不是要做什麼過分的事，只是想趁光不在時，稍微改掉他們總往床上跑的習慣。
      　　
      　　於是他找來一個鋪著軟布的小箱子，把兩隻小人偶抱了進去，再輕輕闔上蓋子。
      　　
      　　「待一會兒就好。」他小聲說，「等她回來，我就放你們出來。」
      　　
      　　房裡安靜了片刻。
      　　
      　　接著，小箱子裡傳來了細微的碰撞聲。
      　　
      　　起初只是輕輕的，一下、一下，像是他們正在摸索四周，可很快，那聲音便急促起來，伴隨著細小的抓撓聲。
      　　
      　　古·拉哈·提亞原本坐在桌前看書，卻半天沒有翻過一頁。
      　　
      　　他努力裝作沒聽見，然而箱子裡的動靜越來越慌亂，像是在尋找著什麼。
      　　
      　　在箱子開始發出劇烈搖晃的時候，古·拉哈·提亞終於放下書，走到箱子旁。
      　　
      　　他才剛把蓋子掀開一條縫，年輕模樣的那隻便立刻擠了出來，差點一頭栽進他懷裡。水晶公也緊跟在後，落地後便急急忙忙地環顧四周。
      　　
      　　兩隻小人偶一個跑向床邊，一個走到門口，又先後折回桌下，連光平時放置武器的架子都找了一遍。
      　　
      　　他們顯然是在找她，年輕的那隻甚至踮起腳，扒在門板上，努力想去碰搆不到的門把。
      　　
      　　古·拉哈·提亞站在原地，心裡那一點莫名其妙的醋意忽然就散了。
      　　
      　　他彎下腰，把兩隻小人偶一起捧起來。
      　　
      　　「她只是出門了，很快就回來。」
      　　
      　　小人偶們抬頭看他，似乎並沒有完全理解，只是不安地在他掌心動了動。
      　　
      　　古·拉哈·提亞看了他們一會兒，終究還是把人偶抱到光平日休息的床上。
      　　
      　　那裡還留著她的氣息。
      　　
      　　兩隻小寵物一碰到枕頭，果然安靜了一些。年輕的那隻鑽進被褥間，水晶公則坐在旁邊，低頭整理了一下自己的長袍。
      　　
      　　古·拉哈·提亞坐在床沿，無奈地嘆了口氣。
      　　
      　　「你們倒是離不開她。」
      　　
      　　說完，他又停了一會兒。
      　　
      　　「……跟我一樣。」
      　　
      　　年輕模樣的小人偶晃晃耳朵，慢吞吞地靠了過來。
      　　
      　　古拉哈提亞伸出手指，碰了碰他的腦袋，水晶公也抬起手，輕輕按在他的手背上。
      　　
      　　那動作很小，卻讓他怔了怔。
      　　
      　　他忽然想起，無論是年輕時的自己，還是身為水晶公的自己，都曾花費漫長的時間追逐著同一個人的背影。
      　　
      　　他們想守著她，想陪著她，想在她疲倦時留在她身旁。
      　　
      　　如今連這兩隻被做成小寵物的自己，也仍舊如此。
      　　
      　　「好吧。」
      　　
      　　古·拉哈·提亞低聲笑了起來。
      　　
      　　「至少在這件事上，我們的想法確實一樣。」
      　　
      　　他原本只是想陪他們坐一會兒，然而光的床鋪太過熟悉，棉被上還殘留著溫度。他靠著床頭，隨手拿了本書來看，沒過多久，眼皮便漸漸沉了下來。
      　　
      　　年輕模樣的小人偶窩進他的臂彎，水晶公則靠在他腰側，半張臉埋進被子裡。
      　　
      　　午後的陽光從窗邊斜斜落下，房裡安靜得只剩均勻的呼吸聲。
      　　
      　　英雄回來時，看見的便是這幅景象。
      　　
      　　古·拉哈·提亞倚在床頭，紅髮有些凌亂，手裡的書早已滑落在一旁。他的一隻手搭在棉被上，恰好護著年輕模樣的小人偶；另一側，水晶公正貼著他的腰，睡得一動也不動。
      　　
      　　三對貓耳靠在一起，一大兩小，整整齊齊。
      　　
      　　光站在門邊看了一會兒，沒有立刻出聲。
      　　
      　　她悄悄走到床邊，在一旁坐下，托著腮，唇角一點一點地彎了起來。
      　　
      　　古·拉哈·提亞睡著時比醒著坦率得多，平日總甩著尾巴、說著「本人明明就在這裡」，現在卻把兩隻小寵物護得好好的，連一隻都沒有推開。
      　　
      　　光伸出手，替他撥開垂在眼前的髮絲。
      　　
      　　古·拉哈·提亞像是察覺到她回來了，下意識側過臉，輕輕蹭了一下她的掌心，兩隻小寵物也跟著動了動，像是在夢中確認她的存在。
      　　
      　　光忍不住笑出了聲。
      　　
      　　「三隻貓啊。」
      　　
      　　她壓低聲音，自言自語。
      　　
      　　「下次再請塔塔露做一個好了。」
      　　
      　　至於新的那一隻要做成什麼模樣——
      　　
      　　就做成現在這個，抱著兩隻小人偶睡著，嘴上說不在意，其實心軟得不得了的古·拉哈·提亞吧。
