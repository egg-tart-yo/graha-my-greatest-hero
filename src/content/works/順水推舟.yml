title: 順水推舟
cp:
  - 拉哈光
updated: 2026-01-01
summary: 女裝光注意
series: 短篇
chapters:
  - body: |-
      　　房門剛在身後合上，光便有些狼狽地靠在門板上，脫力地呼了口氣。
      　　
      　　為了混進戒備森嚴的貴族宅邸，他不得不假扮女侍、換上這身極其繁複華麗的衣裙。修身的布料將英雄精實的身段勾勒得過分惹眼，胸口與腰側收得死緊，下擺層層疊疊的薄紗並不透氣，在方才一路疾行間早被體溫烘得發熱，緊貼著大腿內側的皮膚，與絲襪交互摩擦、讓他又熱又燥。
      　　
      　　「光？你回來了──」
      　　
      　　古·拉哈·提亞聽見動靜從桌前轉過身，話音卻在看清眼前人的瞬間戛然而止。
      　　
      　　紅色的眼睛微微睜大，目光從光被汗水微濕的鬢髮、裸露在外的鎖骨，一路落到那截被束腰勒得格外分明的腰線。貓魅族的耳朵輕輕動了動，肉眼可見地迅速泛起一層薄紅，連喉結都下意識滾動了一下。
      　　
      　　「……別看了。」
      　　
      　　光有些羞惱地別過臉，伸手去扯後背交錯的繫帶。
      　　
      　　「任務結束了，趕緊幫我把這身該死的衣服弄下來，勒得我快喘不過氣了。」
      　　
      　　「啊、好……抱歉！」
      　　
      　　古·拉哈·提亞連忙快步走上前，可當他真正站在光身後，雙手搭上那片單薄細膩的布料時，指尖卻不由自主地緊張得發顫。
      　　
      　　背後的繫帶交錯穿插在繁複的銀扣之間，頂端的繩結為了固定而拉得極緊。古·拉哈·提亞嘗試扯動其中幾條繩線，卻發現徒勞無功。
      　　
      　　「這個結……好像被卡住了……」
      　　
      　　他小聲咕噥著，整個人不得不湊得更近，溫熱的呼吸毫無遮攔地落在光裸露的後頸上，激得光渾身一緊，泛起一陣細小的戰慄。
      　　
      　　拿繩結毫無辦法，他只能轉向藏在布料皺摺中的排扣，但指尖在解開暗扣時無可避免地擦過脊椎凹陷的肌膚，那觸感同樣令人心生雜念。
      　　
      　　結果到了最後，古·拉哈·提亞不僅沒能把繩結挑開，反而因為緊張和指腹滲出的微汗，把最底下的絲帶扯得更緊，硬生生打了個死結。
      　　
      　　「拉哈……還沒好嗎？」
      　　
      　　光難耐地動了動身子，薄紗裙擺隨著動作輕輕摩擦著腿間，帶起一陣隱秘的燥熱，連嗓音都染上了一絲微啞的鼻音。
      　　
      　　「對不起……我、我以前沒解過這種女孩子的裙裝……」
      　　
      　　古·拉哈·提亞慌亂地道歉。
      　　
      　　光一怔，隨即像是想到了什麼，笑著搖了搖頭。
      　　
      　　「好像也是，你如果很熟練，那我還得擔心。」
      　　
      　　「……光！」
      　　
      　　貓魅急忙伸出雙臂，從背後半環住光的腰。
      　　
      　　「你怎麼開這種玩笑！你明明知道我就只有你一個人……」
      　　
      　　微涼的鼻尖蹭過光的後頸，柔軟的髮絲搔弄著裸露的皮膚，他的掌心就這麼隔著束腰，順著的弧度往前滑，滾燙的溫度隔著輕薄的絲綢印在光的腰側。
      　　
      　　「拉哈……別這麼摸……」
      　　
      　　光咬緊下唇，被他這副軟綿綿卻又無處可逃的親暱弄得小腹發緊，身後甚至能隱隱感受到對方也跟著開始升高的體溫。
      　　
      　　「你到底是在解衣服……還是想幹嘛？」
      　　
      　　古·拉哈·提亞停下了手中的動作。
      　　
      　　他把滾燙的臉頰輕輕貼在光的肩頭，身後的尾巴不知何時已經悄悄探了過來，帶著毛茸茸的熱意，隔著絲襪一層層纏上了光緊繃的大腿。
      　　
      　　「反正都解不開了……」
      　　
      　　他咕噥著，唇瓣若有似無地啄吻著光的耳廓，聲音低啞得引人輕顫。
      　　
      　　「不然……我直接撕開，可以嗎？」
