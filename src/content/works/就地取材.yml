title: 就地取材
cp:
  - 拉哈光
  - 歡樂/甜文向
updated: 2026-10-08
summary: 無
series: 短篇
chapters:
  - body: |-
      　　石之家溫暖的燈火透過門縫鑽了出來，旅途提早結束的光輕手輕腳地推開房門，直到看見房內的人還沒入睡，才放鬆了身軀。
      　　
      　　穿著睡袍的古·拉哈·提亞正趴在柔軟的床鋪上，手裡握著筆，極其專注地在攤開的紙張上寫著什麼。紅色的長尾巴在身後微微晃動，尾尖不自覺地輕輕勾起──光記得，那是他陷入極度專注的思考、甚至入神到隔絕外界動靜的時候才會顯露出的模樣。
      　　
      　　果然，貓魅只顧著書寫，渾然沒察覺門扉被推開的聲響。
      　　
      　　光的心底悄悄冒出了一絲捉弄對方的念頭。他刻意放輕腳步，無聲地繞到床邊。
      　　
      　　探頭一瞧，光原本以為是什麼關於古代文獻、歷史之類的研究筆記，沒想到紙上工工整整的，竟然是帶著生動描述的敘事文章。
      　　
      　　「……拉哈，這是什麼？」
      　　
      　　「哇啊啊啊？！」
      　　
      　　突如其來的叫喚讓趴在床上的古·拉哈·提亞整個人劇烈一顫，筆尖在紙張上留下一大滴墨漬，尾巴炸成了蓬鬆的毛球。他手忙腳亂地將整疊紙張反扣進懷裡，整張臉瞬間爆紅，連耳尖都慌張地微微顫動。
      　　
      　　「你、你什麼時候回來的？！任務結束了？不是說船班延遲嗎？進門怎麼完全沒有腳步聲……」
      　　
      　　光雙手抱胸，挑起一邊眉毛，一臉狐疑地盯著神色可疑到不行的貓魅。
      　　
      　　「剛剛就回來了。倒是你，臉紅成這樣……手裡藏了什麼瞞著我的東西？」
      　　
      　　「沒、沒什麼！只是隨手寫寫筆記而已！真的！」古·拉哈·提亞眼神游移，死死將紙張壓在胸口，整個人下意識往床角縮，企圖用隆起的被褥做掩護。
      　　
      　　這種反應只會讓英雄的好奇心徹底膨脹。
      　　
      　　光嘴角勾起不懷好意的弧度，直接撲上床，伸出雙手精準地襲向古·拉哈·提亞最怕癢的腰側與肋骨。
      　　
      　　「唔！等等……哈！別碰那裡！光……住手啊哈哈哈哈！不行、那裡會癢……！」
      　　
      　　古·拉哈·提亞在床鋪上笑得蜷縮成一團，尾巴慌亂地拍打著床單，拚命想護著懷裡的紙，卻完全架不住光熟練的攻擊。幾番掙扎與喘息之後，古·拉哈·提亞徹底敗下陣來，眼角甚至被激起了生理性的眼淚。
      　　
      　　「我給、我給你看就是了……快停手……」
      　　
      　　他無奈地鼓著雙頰，垂著泛紅的貓耳，認命地用雙手捧起那幾張紙，羞恥得不敢直視光的眼睛。
      　　
      　　光滿意地伸手接過，細細翻閱起來。
      　　
      　　前半段正是出發前他與拉哈描述的冒險故事，古·拉哈·提亞漂亮工整的字跡生動刻畫著光在戰場上的英姿，字裡行間滿是毫無保留的仰慕與崇拜，再參上一點點過度解讀的加油添醋。
      　　
      　　然而翻到後半段，內容卻急轉直下──英雄卸下了沉重的甲冑，被擁入某個熟悉的懷抱，兩人的距離近得能聽見彼此的心跳，滿篇都是令人害羞、黏黏糊糊的親暱描寫……
      　　
      　　只是，故事的進展恰好停在最關鍵、最曖昧的地方，後面只留下一串凌亂的墨點與大片空白。
      　　
      　　光看著那些大膽又滾燙的文字，再抬頭看著把自己縮成一顆糰子、羞到恨不得找地縫鑽進去的古·拉哈·提亞，忍不住邪邪一笑，湊上前去晃了晃手中的紙頁。
      　　
      　　「寫得挺不錯的嘛……不過我的拉哈，怎麼停在這裡不寫下去了？」
      　　
      　　古·拉哈·提亞看著光那一臉幸災樂禍、明知故問的戲謔神情，原本的害羞終於被逼成了一股自暴自棄。他扁著耳朵，紅寶石般的眼睛半瞇著瞪向光，委屈地脫口而出：「……誰叫你這麼久才回來！隔太久了所以寫不出來啦！」
      　　
      　　話音剛落，還沒等光反應過來，古·拉哈·提亞直接反撲了過去，將毫無防備的英雄結結實實地壓在身下。
      　　
      　　「等等、什麼東西隔太久？」
      　　
      　　紙張飛揚、床墊陷了下去，青年溫熱的呼吸瞬間灑在光的側頸。古·拉哈·提亞整個人伏在光的身上，長長的尾巴在身後用力地揮動，他垂著耳朵，用那雙泛著水汽的赤紅雙眸哀怨地盯著身下的人，嗓音低啞地宣告。
      　　
      　　「就是這樣，所以我現在要就地取材了。」
      　　
      　　感覺到貓魅驟然轉變的危險氣息，光這才意識到情況不對，慌慌張張地伸手想推開他逃跑。
      　　
      　　「等一下，拉哈！我才剛回來──唔！」
      　　
      　　然而一切都已經太遲了。古·拉哈·提亞動作極其敏捷地反扣住光的雙手，將掙扎壓在枕側，俯下身精準地封住了那張試圖求饒的雙唇，將剩下的抗議全數吞進了滾燙的親吻之中。
