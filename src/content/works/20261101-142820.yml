series: 短篇
chapters:
  - title: 主篇
    body: |-
      　　從第一世界回來時，光的背包裡多了一樣意料之外的東西。
      　　
      　　那是琳交給他的一張照片。
      　　
      　　「這是在大家整理水晶公留下的東西時找到的。」
      　　
      　　琳將照片遞過來時，小心翼翼地捏著邊角，像是生怕弄壞了什麼珍貴的東西。
      　　
      　　「我想這對水晶公來說應該很重要。大家商量過後，想麻煩你幫忙轉交給他。」
      　　
      　　光接過照片，低頭看了一眼。
      　　
      　　照片裡，是還身為水晶公時的古·拉哈·提亞。
      　　
      　　他穿著那身熟悉的長袍，兜帽遮去了大半張臉，盤腿而坐的懷裡靠著年幼的萊楠。兩人身邊散落著一本本厚重的書冊，桌上的提燈散發出溫暖柔和的光，將相依的身影輕輕包裹其中。
      　　
      　　暖色映在四周湛藍的水晶上，與晶體本身細碎的光芒交融，宛如平靜河面上緩緩流動的粼光。
      　　
      　　稚氣未脫的萊楠笑得很開心，一雙長耳高高豎起。
      　　
      　　古·拉哈·提亞低著頭陪她看書，即使大半神情都藏在兜帽之下，仍能看見唇角那一點極淡、卻又十分溫柔的弧度。
      　　
      　　光盯著照片看了好一會兒，才默默將它收進懷裡。
      　　
      　　「我知道了。」
      　　
      　　琳露出放心的微笑。
      　　
      　　只是她大概怎麼也想不到，這張本該被「代為轉交」的照片，在回到原初世界後，竟然好幾天都沒能到達真正的主人手中。
      　　
      　　幾日後的午後，石之家難得清閒。
      　　
      　　光坐在桌邊，一手托著腮，一手捏著照片，已經不知道第幾次把它拿出來看了。
      　　
      　　他的目光停在照片裡相互依靠的兩個身影上，最後又慢慢落回水晶公微微上揚的嘴角。
      　　
      　　真溫柔啊。
      　　
      　　光心想。
      　　
      　　而且，看起來很會照顧小孩，也很有耐心。
      　　
      　　雖然偶爾會為了某些事情亂來，但平時其實相當可靠，生活方面也完全不需要操心。
      　　
      　　從各個角度來看，似乎都無可挑剔。
      　　
      　　光越想越覺得有道理。
      　　
      　　最後，他忍不住輕輕嘆了口氣，對著照片低聲喃喃。
      　　
      　　「……還是結婚好了。」
      　　
      　　下一秒，旁邊傳來一聲極其明顯、像是被什麼嗆住的咳嗽。
      　　
      　　光抬起眼，恰好對上桑克瑞德震驚的目光，對方停在幾步之外，手裡還拿著一包晶壤。
      　　
      　　兩人四目相對。
      　　
      　　「幹嘛？」
      　　
      　　「……沒事。」桑克瑞德沉默了兩秒，十分慎重地移開視線，「我什麼都沒聽見。」
      　　
      　　「喔。」
      　　
      　　光偏了偏頭，渾然沒有意識到自己剛才到底脫口而出了什麼。
      　　
      　　然而，就算英雄有所察覺，也已經來不及了。
      　　
      　　當天傍晚，一個不知究竟從何而起的消息，悄悄在石之家裡流傳了起來。
      　　
      　　──光之戰士看著某個人的照片，自言自語說想結婚。
      　　
      　　消息傳播之迅速，幾乎足以媲美某些緊急討伐的情報。
      　　
      　　拂曉的賢人們對此倒是相當冷靜。
      　　
      　　「不可能，他一定是聽錯了。」

      　　阿莉塞第一個斬釘截鐵地下了結論。
      　　
      　　「或者那根本就是拉哈的照片。」
      　　
      　　「但印象中，好像不曾看過他們拍照……」可露兒沉吟片刻，「拉哈君以前的照片倒是有一些留在委員會裡，但那裡早就……」
      　　
      　　話說到一半，她也安靜了下來。
      　　
      　　「還是要去確認一下，那張照片到底是誰？」
      　　
      　　「怎麼確認？」阿莉塞皺眉，「直接去問光？」
      　　
      　　尤里安傑沉默片刻，抬手揉了揉眉心。
      　　
      　　「若是直接詢問，桑克瑞德只怕難逃一死。」
      　　
      　　阿爾菲諾遲疑了一下。
      　　
      　　「雖然我們無權干涉他的私人感情，不過……」
      　　
      　　眾人的目光不約而同地轉向不遠處。
      　　
      　　古·拉哈·提亞正站在書架前查找資料。
      　　
      　　而光就在他身邊，理所當然地靠了過去，一邊低頭看他手裡的書，一邊伸手從他盤子裡拿走最後一塊餅乾。
      　　
      　　古·拉哈·提亞低頭看看空了的盤子，又看向正在一臉理所當然咀嚼餅乾的光。他什麼也沒說，只是十分自然地把自己的茶也往光的方向推了推。
      　　
      　　雅·修朵拉平靜地收回視線。
      　　
      　　「很難想像會是別人。」
      　　
      　　「所以就只是謠言吧。」阿莉塞說。
      　　
      　　艾斯蒂尼安仍看著遠處那兩個人。
      　　
      　　過了幾秒，他忽然開口。
      　　
      　　「他要是跟別人結婚，那傢伙怎麼辦？」
      　　
      　　回答他的，是一陣沉默。
      　　
      　　這句話似乎一瞬間擊中了某個非常核心的問題。
      　　
      　　然而，賢人們大致知道內情，其他人卻不知道。
      　　
      　　對石之家的普通冒險者而言，英雄的婚戀八卦顯然比某些日常委託有趣得多。
      　　
      　　於是消息就這麼傳著、傳著，最後傳進了古·拉哈·提亞的耳中。
      　　
      　　那時的他正在整理一份手稿。
      　　
      　　幾個從身後經過的人壓低聲音談論著什麼，卻還是被他那雙敏銳的耳朵聽了個一清二楚。
      　　
      　　「你還不知道嗎？聽說光之戰士有想結婚的對象了。」
      　　
      　　「真的？是誰？」
      　　
      　　「不知道啊，據說他這幾天常常拿著對方的照片發呆。」
      　　
      　　啪。
      　　
      　　手裡的紙張散落了一地，放在桌邊的書也跟著滑了下來，直接砸在他的腳上。
      　　
      　　古·拉哈·提亞卻像完全感覺不到疼，整個人僵在原地，一雙紅眼直直瞪著那幾個正閒聊路過的人。
      　　
      　　數分鐘後，光的房門被人猛然推開。
      　　
      　　正在整理背包的光被嚇得肩膀一震。他回過頭，只見古·拉哈·提亞站在門口，胸膛明顯起伏著，呼吸也有些急促，顯然是一路跑過來的。
      　　
      　　「拉哈？」
      　　
      　　古·拉哈·提亞張了張嘴，卻沒能發出聲音。
      　　
      　　那雙紅色眼睛明顯泛著濕意。
      　　
      　　光頓時皺起眉，立刻從背包旁站了起來。
      　　
      　　「怎麼回事？」

      　　「我……」

      　　古·拉哈·提亞低下頭，手指不自覺攥住衣角。

      　　其實他根本不知道自己究竟該說些什麼。

      　　自從聽見那個消息之後，腦海裡便亂得一塌糊塗。

      　　光想跟誰結婚？
      　　
      　　是前些日子和他一起組隊的冒險者？還是最近總是寄信過來的某個委託人？又或者是光獨自外出冒險時，遇見了某個自己根本不認識的人？
      　　
      　　如果真的是這樣，為什麼自己一點也不知道？

      　　還有──

      　　如果他的心真的已經有了歸屬，為什麼平時看向自己的眼神，仍然總是那麼溫柔？

      　　即使他們從未用言語真正確認過彼此的關係，可古·拉哈·提亞也不認為，自己會錯估那些藏在日常裡的細小訊號。

      　　偶爾不經意碰在一起、卻誰也沒有立刻收回的手。

      　　自己提出某些任性的要求時，光微微泛紅的側臉。

      　　還有那雙總是盛著鮮明情緒的蔚藍眼睛，在看見自己時，會比平常更多一點柔和的弧度。

      　　那些東西，難道都是自己會錯了意嗎？

      　　還是因為自己始終沒有真正跨出那一步，所以光才先喜歡上了別人？
      　　
      　　一瞬間湧上心頭的問題太多了，可現如今的他，已經沒有問出口的資格。
      　　
      　　最後，古·拉哈·提亞只能死死壓住混亂的情緒，勉強擠出一句。

      　　「我聽說了。」

      　　光一臉茫然。

      　　「聽說什麼？」

      　　古·拉哈·提亞的嘴唇動了動。

      　　「你……要結婚了。」

      　　光愣在原地，不可置信地眨了眨眼。

      　　「啊？」

      　　那一瞬間的錯愕落在古·拉哈·提亞眼裡，卻被混亂的情緒理解成了另一種意思。

      　　……果然是不打算告訴自己。
      　　
      　　古·拉哈·提亞努力牽起嘴角，那個笑容卻勉強得近乎難看。
      　
      　　「恭喜。」
      　
      　　「……啊？什麼？你等一下──」
      　
      　　「如果是你選的人，一定是很好的人吧。」
      　
      　　「你先聽我說──」

      　　「我要說的……就是這個了。」

      　　話音剛落，古·拉哈·提亞便匆匆轉過身。

      　　他怕再多留一刻，努力維持住的表情就會盡數崩塌。

      　　然而才剛邁出一步，手腕便被人一把抓住。

      　　「回來。」

      　　光的聲音沉了些。

      　　「說明白。」

      　　他依舊摸不著頭緒，卻已經從古·拉哈·提亞異常的反應裡察覺到，這個誤會似乎比想像中還要嚴重。

      　　古·拉哈·提亞仍背對著他。

      　　光等了片刻，只好又喚了一聲。

      　　「拉哈，看著我。」

      　　古·拉哈·提亞終於慢慢轉回來。

      　　那雙鮮紅的眼睛裡，已經裹著一層明顯的水霧。

      　　光注視著他，原本滿腦子的疑惑，在看清他的表情後，頓時變成了一片茫然。

      　　「到底怎麼回事？」他放輕了一點聲音，「剛剛那些話，是什麼意思？」

      　　古·拉哈·提亞努力控制著自己的情緒。

      　　垂在身側的手握緊，又逼著自己慢慢鬆開。

      　　掙扎了好一會兒，下一刻，他忽然往後退了半步，然後在光的面前，單膝跪了下來。

      　　光嚇得整個人差點跳起來。

      　　「等等、拉哈？！」
      　
      　　他急急忙忙也想蹲下去，卻被古·拉哈·提亞伸手攔住。

      　　「請讓我說完。」

      　　他抬起眼，帶著濕意的目光明明緊張得厲害，卻又固執而真摯。

      　　「我知道，這樣說或許很任性，也可能會給你造成困擾。」
      　
      　　「不是，你先起來，有話好好說──」

      　　「但我不想把你身邊的位置讓給任何人。」

      　　光一下子安靜了。
      　
      　　古·拉哈·提亞深吸一口氣。

      　　「如果你真的已經有了想共度一生的人，我沒有資格要求你改變心意。」
      　
      　　說到這裡，他的聲音稍微低了一點，身後那條尾巴也因緊張而繃得筆直。

      　　「可是，如果一切還沒有成定局……能不能，也給我一個機會？」
      　
      　　「……」

      　　「我想和那個人公平競爭。」
      　
      　　光低頭看著他，一雙藍眼輕輕晃動。

      　　古·拉哈·提亞則仰頭望著自己的英雄，幾乎屏住了呼吸。
      　
      　　沉默持續了很久，久到他以為自己大概要被拒絕了。

      　　然後，光終於很慢、很慢地問了一句。

      　　「……跟誰競爭？」
      　
      　　古·拉哈·提亞一怔。

      　　「你的結婚對象。」
      　
      　　「那是誰？」
      　
      　　「……」

      　　兩個人面面相覷，一個茫然，一個困惑。

      　　最後，古·拉哈·提亞遲疑地開口。
      　
      　　「我不知道。」
      　
      　　光的眉頭慢慢皺了起來。
      　
      　　「那你從哪裡聽說我要結婚？」
      　
      　　「大家都這麼說。」

      　　「……大家？」
      　
      　　光絞盡腦汁，開始努力從剛才那些莫名其妙的對話裡尋找蛛絲馬跡。
      　
      　　古·拉哈·提亞的耳朵微微動了一下，十分艱難地擠出一句。

      　　「你不是……還收藏了那個人的照片嗎？」
      　　
      　　關鍵的詞終於讓光腦中的某條線接了起來。
      　　
      　　他整個人僵了兩秒，隨後，抬手捂住了臉。
      　　
      　　此刻光的腦海裡，只剩下等等究竟該用什麼方式去找桑克瑞德算帳。

      　　「光……？」

      　　古·拉哈·提亞困惑地望著他。

      　　光放下手，他的臉已經開始一點一點泛紅。

      　　視線飄開又飄回，支支吾吾了好一會兒，最後像是終於放棄般，從貼身的懷裡摸出一樣東西。
      　
      　　「你說的照片，就是這個。」

      　　古·拉哈·提亞低頭看去，下一秒瞪大了雙眼。

      　　那是一張連他自己都幾乎快要忘記的照片。
      　　
      　　「這是……」

      　　「琳給我的。」

      　　光移開視線。
      　
      　　「整理你以前留下的東西時找到的。她覺得這對你來說應該很重要，所以讓我帶回來還給你。」

      　　古·拉哈·提亞伸手，緩緩接過那張照片。
      　
      　　看見照片裡的萊楠時，他的目光下意識柔和了下來。
      　
      　　可下一秒，他忽然意識到了什麼，耳朵猛地豎起。
      　
      　　「等等。」
      　
      　　他的聲音都開始發顫。

      　　「所以你說的……『結婚』……」
      　
      　　光的臉瞬間更紅了，只能欲蓋彌彰地把頭別向一旁。
      　
      　　「就是看著這張照片的時候說的。」
      　
      　　古·拉哈·提亞的大腦停止運轉了。

      　　「所以……是……是我？」

      　　光閉了閉眼，然後很輕地「嗯」了一聲。

      　　一瞬間，方才那些苦悶、慌亂與幾乎令人窒息的不安，全都被猝不及防湧上來的喜悅撞得粉碎。

      　　古·拉哈·提亞整張臉一下紅到了耳根，頭頂甚至冒出了熱氣。

      　　他晃了一下，似乎連站都站不穩，光嚇得連忙伸手摟住他。
      　　
      　　「我、我沒事……」
      　　
      　　「一點也不像！」
      　
      　　光咳了一聲。
      　
      　　他其實也沒有好到哪裡去。

      　　可既然話都已經說到這個地步，再躲也沒有意義了。
      　
      　　他只好低聲解釋。
      　
      　　「我只是覺得……這張照片裡的你很好看。」

      　　古·拉哈·提亞的耳朵「啪」地一下立得更直了。

      　　「而且看起來很溫柔，很有耐心。」
      　
      　　尾巴也跟著抬了起來。

      　　光的聲音越來越小。
      　
      　　「就……讓人覺得，作為伴侶……很適合。」

      　　那條尾巴開始以明顯無法忽視的幅度左右晃動。

      　　光忍了一會兒，最後實在忍不住了。

      　　「你能不能先控制一下？」
      　
      　　「我、我沒辦法！」

      　　古·拉哈·提亞整張臉幾乎紅得和頭髮一樣。

      　　他完全不知道該怎麼處理這份突如其來的坦白，也根本壓不住聽見那些話之後，不斷從胸口往上湧、幾乎快要溢出來的喜悅。
      　
      　　最後，他一把捂住臉，喉間漏出一聲近乎無措的嗚咽。
      　　
      　　光看了他一會兒，自己的臉頰也燙得厲害。

      　　可方才古·拉哈·提亞跪在自己面前時，那雙泛著濕意、卻仍然無比認真的紅眼，還深深留在他的腦海裡。
      　　
      　　如果眼前的人都願意鼓起勇氣，那懷抱相同心意的自己，又有什麼好退縮的呢。
      　　
      　　「拉哈。」

      　　古·拉哈·提亞從手掌後抬起眼。

      　　「什麼？」

      　　光深吸了一口氣，然後往後退了一步。
      　
      　　下一刻，他在古·拉哈·提亞錯愕的注視下，也跟著單膝跪了下來。
      　
      　　「光？！」

      　　古·拉哈·提亞嚇得立刻伸手要拉他。

      　　「等等，為什麼──」
      　
      　　光卻沒有起身。

      　　他抬眼望向古·拉哈·提亞，伸手握住了對方急急忙忙伸來的手。
      　　
      　　「這次該換我了。」
      　
      　　古·拉哈·提亞一下子僵住了。

      　　光的耳根其實已經紅得不成樣子，可是目光卻不再閃躲，蔚藍的眼睛就這麼直直望進面前人的眼底。
      　　
      　　「我不知道你來之前，究竟聽說了什麼。但有一件事，我現在可以說清楚。」

      　　光稍微收緊了握著他的手。

      　　「如果真的要找一個人一起生活，一起吃飯、一起旅行，一起回家。」

      　　光頓了頓，聲音放得很輕。
      　
      　　「一直走到很久、很久以後。」
      　　
      　　「那個人，我希望是你。」
      　
      　　古·拉哈·提亞怔怔地看著他。
      　
      　　那雙紅眼裡才剛散去不久的水意，又一點一點漫了上來。
      　　
      　　光仰頭看著他，手心正緊張地出著汗。
      　
      　　「所以，古·拉哈·提亞。」

      　　他念出對方完整的名字，像是把眼前這個人、以及橫跨過去與未來有關的一切，全都放進了這句話裡。

      　　「你願意嗎？」
      　
      　　古·拉哈·提亞用力眨了眨眼。
      　　
      　　他低低嗚咽了聲，很努力組織不成句的聲音，在光耐心的等待之下，好不容易擠出一句顫抖的話。

      　　「……我、一直都是，這麼想的。」

      　　光微微一怔。
      　
      　　古·拉哈·提亞望著他，聲音仍然帶著明顯的顫意，眼睛卻亮得驚人。
      　
      　　「從我決定站在你身邊的那一刻起……」
      　
      　　「我一直，都是以這個前提留在你身邊的。」
      　　
      　　古·拉哈·提亞低下頭，一滴眼淚終於落了下來，他卻笑得無比幸福。
      　
      　　光望著他，也跟著笑出聲。
      　
      　　古·拉哈·提亞握住他的手，用力把人拉了起來。
      　
      　　然而光才剛站穩，下一瞬間，一個溫熱的身體便猛地撞進懷裡。
      　
      　　他下意識張開雙臂，穩穩接住了古·拉哈·提亞，那雙手臂緊緊環住他的腰，力道大得像是生怕一鬆開，眼前的一切便會變成一場過分美好的夢。
      　　
      　　古·拉哈·提亞絕不會告訴光，自己從多早以前的歲月開始，就等待一個人來到自己面前。
      　
      　　而如今，那個人終於不只來到了他的身邊。

      　　還親口告訴他──

      　　以後，也一起走吧。
  - title: 番外 - 桑哥的結局
    body: |-
      　　夜已深。
      　　
      　　桑克瑞德的手搭上第七天堂的門把時，腳步忽然頓了一下。
      　　
      　　他微微側過臉，眉梢困惑地挑起。
      　　
      　　……殺氣？
      　　
      　　那是只出現一瞬間、極淡的氣息。
      　　
      　　若不是多年來養成的直覺，恐怕連他自己都會以為只是錯覺。
      　　
      　　桑克瑞德站在原地想了想，最後還是十分謹慎地隱去了自己的氣息。
      　　
      　　畢竟當年砂之家發生過那種事，還是謹慎點好。
      　　
      　　推開門，石之家的大廳空無一人，四周安靜得只剩下夜裡細微的聲響。
      　　
      　　他小心翼翼地一路走向自己的房間，沒有發現任何異常。
      　　
      　　直到站在門前，桑克瑞德又稍微感知了一下。
      　　
      　　裡面同樣沒有人的氣息。
      　　
      　　「……我多心了嗎。」
      　　
      　　他低聲自語，推門而入，房門在身後輕輕闔上。
      　　
      　　喀噠。
      　　
      　　桑克瑞德往前走了兩步。
      　　
      　　下一瞬，他腳步驟然停住。
      　　
      　　因為就在門板後方──
      　　
      　　同樣徹底消去了氣息的光，正雙手環抱、靠著牆站，悄無聲息地站在那裡。
      　　
      　　背後掛著一把鐮刀。
      　　
      　　他看著桑克瑞德毫無防備的背影，臉上帶著極其和善的笑容。
      　　
      　　「你回來啦。」
      　　
      　　話音落下，光抬起一隻手，架在肩後的鐮刀隨著手腕一轉，以肩膀為支點俐落地旋過半圈。
      　　
      　　冷色的刀光在昏暗的房間裡劃出一道弦月般的弧。
      　　
      　　下一刻，他一把握住刀柄，鐮刀穩穩停下，鋒利的刀尖高高揚起。
      　　
      　　光笑吟吟地看著桑克瑞德。
      　　
      　　「據說，照片的事情──」
      　　
      　　他稍微偏了偏頭。
      　　
      　　「是你看到的，對嗎？」
