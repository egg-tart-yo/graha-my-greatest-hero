title: 試探
cp:
  - 光拉哈
updated: 2026-10-12
summary: 無
series: 短篇
chapters:
  - body: |-
      　　窗外的夜色已經很深，石之家的大廳只留下幾盞微弱的燈火。光坐在長桌旁，偎著燈光認真地打磨著短刀。
      　　
      　　這時，剛從房間走出來的古·拉哈·提亞抱著厚厚一疊書本路過，看見光還沒睡，腳步自然而然地轉了過來。他在光的身邊坐下，毛茸茸的耳朵微微抖動了一下，雙眼亮得彷彿方才發現了什麼新奇趣聞。
      　　
      　　「光，你知道嗎？剛才我在找艾奧傑亞早期的民俗文獻時，看到一個很有趣的說法。」
      　　
      　　光放下手裡的打磨工具，挑眉看著他，眼神也帶著願聞其詳的好奇，「什麼說法？」
      　　
      　　「關於手指的名字。」
      　　
      　　古·拉哈·提亞將雙手攤開在桌面上，修長的手指在昏黃的燈光下顯得骨節分明。他伸出食指點了點自己的左手，興致勃勃地解釋。
      　　
      　　「大拇指、食指、中指和小指在不同的語言中，名字都不太相同，只有這一根指頭在各個古老語言裡，都被稱作『無名指』……據說它之所以叫無名，並不是因為它不重要，而是它在等待。」
      　　
      　　「等待？」
      　　
      　　「嗯，等待那個能親手為它套上指環、賦予它名字與意義的人。」古·拉哈·提亞的眼睛亮晶晶的，語氣裡帶著歷史學者考究到新發現的雀躍與得意，「據說只要那個人出現了，無名指就不再是空白的符號，而會伴隨著誓言被刻下自己的歸屬……很有浪漫色彩對吧？甚至比某些流傳下來的神話還要迷人。」
      　　
      　　說完這段話後，古·拉哈·提亞的聲音漸漸放輕了。
      　　
      　　他的目光悄悄落在了光正搭在桌沿的左手上。
      　　
      　　身後長尾輕輕捲起一個弧度，眼睛也睜得圓溜，他的眼底滿是掩飾不住的好奇，一副憋著滿肚子話想問、卻又有些不好意思的模樣。
      　　
      　　光被他這副模樣勾起了好奇心，好整以暇地單手托腮看著他。
      　　
      　　「在想什麼？」
      　　
      　　「唔……那個……」古·拉哈·提亞吞吞吐吐地轉著手指，視線在光的指尖和臉頰之間飄來飄去，試探的語氣十分小心翼翼，「我只是突然想到……平時你穿戴戰鬥裝備的時候，戒指好像……都只會戴在食指或中指上，左手的無名指一直都是空下來的？」
      　　
      　　光一時沒跟上他的思路。
      　　
      　　他眨了眨眼，理所當然地隨口答道：「當然，畢竟在習俗裡，那是給結婚戒指的位置吧？平時的防具自然不會戴在那。」
      　　
      　　「說得也是……」
      　　
      　　古·拉哈·提亞若有所思地點了點頭。他的喉結悄悄滾了滾，兩隻耳朵微不可察地下壓了一點，像是終於鼓足了全身的勇氣，紅著臉、又用那帶著微啞的嗓音小小聲地試探著。
      　　
      　　「那……我可以問一下，你的無名指現在叫什麼名字嗎？」
      　　
      　　光愣了愣。
      　　
      　　他低頭看了看自己空落落的左手無名指，又抬頭對上那雙寫滿緊張與期待的瞳孔，大腦轉了一圈，才後知後覺地明白過來這隻貓拐了這麼大一個彎，究竟是在問什麼。
      　　
      　　一抹帶著戲謔的笑意在英雄的嘴角揚起。
      　　
      　　光沒有直接回答，反而氣定神閒地曲起指節輕敲了一下桌面，微微瞇起眼睛笑道：「這個嘛……給你猜，它的名字剛好是五個字。」
      　　
      　　「……唔！」
      　　
      　　古·拉哈·提亞整個人猛地一震，雙手急急忙忙往頭頂伸去，壓住瞬間豎起的耳朵，冒著煙的腦袋也趕緊埋了下去，害羞得半天不吭一聲。
      　　
      　　光看著眼前這團快要熟透的紅色毛球，心底暖得發熱。他笑著傾身靠過去，修長的手指輕輕戳了戳貓魅緊繃的肩膀，語調慢悠悠地打趣道：「怎麼不說話了？再多跟我介紹一點嘛。」
      　　
      　　濕漉漉的眼睛很勉強地看向光，又惹得英雄一陣笑。
      　　
      　　「況且一般來說，在開口問別人名字之前，不是應該先報上自己的名字嗎？」
      　　
      　　光好整以暇地看著長尾劇烈地拍打著椅子，垂著頭的貓魅青年深吸了一口氣，像是好不容易才把那股幾乎要將自己燒融的熱度壓下一點。
      　　
      　　他放下手，神情糾結卻帶著毫無保留的赤誠，將自己同樣空著的左手輕輕攤開在兩人之間。
      　　
      　　「我的無名指……它的名字，只有一個字。」
      　　
      　　嗓音很輕，在靜謐的夜裡卻無比清晰。
      　　
      　　光伸手拉過他的掌心，微粗的拇指在那空白的指根處輕輕搓揉。他眼底漾著濃郁的笑意，故作疑惑道：「讓我猜猜……那個字是不是──」
      　　
      　　英雄向前傾身，溫熱的呼吸擦過貓魅滾燙的耳廓，低語吐出那個唯一的答案。
      　　
      　　古·拉哈·提亞整隻耳朵癢得抖了一下，泛著紅暈的臉用力地點了點頭。他沒有抽回手，反而反手扣緊、堅定地牽著光的手。
      　　
      　　無聲的笑意在交纏的掌心與指間化開。
