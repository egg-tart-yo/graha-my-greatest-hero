title: 喪鐘於白晝鳴響
cp:
  - 拉哈光
  - 光拉哈
updated: 2026-10-20
summary: 5版劇情衍生，最好完成整個5.0再點開
series: 短篇
chapters:
  - body: |-
      　　他能聽見靈魂碎裂的聲音。
      　　
      　　體內過量的光之力像是潛伏在身體深處的舊傷，總是在無預警的時候膨脹起來，光是呼吸就扯出撕裂般的劇痛。
      　　
      　　無邊無際的白充斥著他的視野，與這美麗又悲傷的永晝世界相同。這樣就算英雄真的奪回了完整的夜空，他是否也無法親眼見證？
      　　
      　　這個疑問，已由椎心刺骨的疼痛告訴了他答案。
      　　
      　　但這些擔憂，光也無法向其他夥伴訴說。抵禦光之氾濫的戰鬥在英雄到達第一世界以前，拂曉的眾人已經持續了很長一段時間，現在的光也只能相信尤里安傑真的有解法──即使沒有，他也只能一直戰鬥下去。
      　　
      　　那是光跟水晶公的約定。
      　　
      　　在滿天恆星的見證下，他答應了那人單膝下跪的請求，也答應過要陪水晶塔的主人走到最後。更重要的是……他想親眼看看，這個把自己藏得那麼深、心甘情願背負一切的人，真正的願望。
      　　
      　　雖然對方始終守口如瓶，對過去總是輕描淡寫，但英雄早就認出了那兜帽下的靈魂。
      　　
      　　那是他漫長的旅途中，完全不曾預料過能再次相逢的舊識。
      　　
      　　重逢的喜悅與無法相認的困惑在胸口交織，他只能等待能坦誠相對的那一天，自己能親口詢問──從塔裡醒來的百年間，你究竟吃了多少苦？
      　　
      　　只可惜，他的身體可能撐不到最後。
      　　
      　　光不曉得自己還能走多遠，也許在黑夜徹底降臨之前，他的靈魂就會先一步因光之力的侵蝕徹底崩解。
      　　
      　　如果連明天都成了奢望，那至少……至少在還活著、還能保有身為光的自我意識之時，讓他再碰一碰這個人。
      　　
      　　懷抱著沉重的絕望，他敲響了觀星室的大門。
      　　
      　　水晶公在看清英雄神情的瞬間僵在原地，聽清他近乎卑微的乞求後更是愣在當場。他無聲地沉默了很久，兜帽下的雙唇劇烈顫抖，最終輕微地垂下了肩膀，任由英雄靠了過來。
      　　
      　　低頭吻下去的那一刻，唇滾燙得嚇人。
      　　
      　　水晶公發出一聲壓抑的微喘，下意識抬手攥緊了英雄胸前的衣料。兩人宛如沙漠中尋得甘泉的旅人般渴求著彼此，沉重的喘息緊緊交錯在一起，比起情慾，卻更令人感到心酸。
      　　
      　　然而，當英雄的手順著脖頸往上撫摸，指尖觸碰到兜帽邊緣時──
      　　
      　　水晶公的雙手抵上了英雄的胸膛。
      　　
      　　那股力道不大，似乎因動搖而微微顫抖，卻又無比堅決地將兩人的距離推開了些許。
      　　
      　　在喘息與親吻的縫隙間，水晶公別開臉，沙啞的嗓音既痛苦又酸澀。
      　　
      　　「……英雄，我們說好的。」
      　　
      　　光凝視著兜帽下的陰影，那裡隔絕了所有隱瞞他的真相與眷戀的臉龐。
      　　
      　　他當然可以強行掀開那層薄弱的偽裝，甚至可以再次呼喚那僅有自己知曉的名字──只要現在的光願意，他就能將古·拉哈·提亞抱在懷裡。
      　　
      　　但如果水晶公還想維持這份距離，他就永遠不能越過那條線。
      　　
      　　胸腔裡翻湧著酸楚與無力，英雄閉了閉眼，輕輕嘆了口氣。
      　　
      　　「……我不會掀開你的兜帽的。」
      　　
      　　水晶公的身子劇烈顫抖了一下，原本抵在英雄胸口的手指蜷縮起來，抓皺了布料。
      　　
      　　光沒有退後，只是微微弓起手指，用手背輕輕擦過他的臉頰。
      　　
      　　「只是想……在還來得及的時候，碰一碰你。」

      　　如果不是因為光之力的侵蝕，他可以在水晶公親手打造的美麗都市中，繼續扮演什麼都不知道的英雄。

      　　但現在的他，恐怕無法再繼續等待了。
      　　
      　　水晶公咬著發白的下唇，斗篷下的雙肩隨著呼吸劇烈顫抖，最終，兜帽下的人還是微微點了點頭。
      　　
      　　光的手掌探了進去。
      　　
      　　指腹如約不去牽動任何布料，只是小心翼翼地沿著下顎滑入陰影中，指尖撫過比起記憶裡更為消瘦的臉頰，刻意跳過十分礙眼的水晶傷痕，然後順著輪廓一路往上，輕輕觸碰眼眶與微涼的鼻間。
      　　
      　　光能感受到掌心裡微微顫動的睫毛，細密地拂過比起當年更多厚繭的手掌。
      　　
      　　然後，他摸到了一點無聲暈開的濕潤。

      　　溫熱的液體漸漸擴散，迅速浸透了英雄的指縫。
      　　
      　　兜帽下的人沒有發出一絲聲音，彷彿屏住氣息般寧靜，唯有滾燙的眼淚止不住地湧出，砸在英雄冰涼的手掌裡。
      　　
      　　光什麼也沒有說。
      　　
      　　他無法問哭泣的原因，也不能傾訴隱藏多時的思念與痛苦，能做的只是往前邁了一小步，將自己的額頭輕輕抵在水晶公被兜帽覆蓋的肩窩處，整個人沉沉地靠了上去。
      　　
      　　光之力依然持續在撕裂他的靈魂，發出與水晶碎裂相同的聲音。
      　　
      　　這樣是不是代表，自己也能稍稍感受到眼前人所承受的疼痛？
      　　
      　　光無法問出口，也不捨破壞此刻的寧靜。
      　　
      　　他們在心照不宣的謊言與秘密裡互相依偎，任由眼淚在指間慢慢冷卻，直到塔外的報時鐘聲沉悶地響起。
      　　
      　　「……該休息了，英雄。」
      　　
      　　許久之後，肩窩處傳來極力維持平穩的低語。
      　　
      　　那聲音已經重新找回了水晶公該有的威嚴與溫和。
      　　
      　　「明天，我們還有很長的路要走。」
      　　
      　　英雄閉著眼，深吸了一口屬於這個人的氣息，才極慢、極慢地抽回了手。
      　　
      　　掌心殘留的水痕在接觸到空氣的瞬間，泛起刺骨的涼意，但光放棄了擦拭，只是在衣袖下握緊了手，將那點微弱的、屬於過去也奢望存在於未來的溫度，死死攥進了手心裡。
