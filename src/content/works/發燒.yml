  - body: |-
      　　從黃金谷回來之後，光少見地病倒了。
      　　
      　　當他扶著牆走進大廳，臉色蒼白得像張紙，阿爾菲諾手裡的書當場掉到了地上，阿莉塞更是連問都沒問，直接衝上去架住了他。
      　　
      　　「你碰到了什麼鬼東西？」
      　　
      　　「沒什麼，不過是魔、咳咳。」
      　　
      　　光連忙清了清喉嚨。
      　　
      　　結果那聲音沙啞得慘不忍睹，原本是為了澄清，反而成了鐵證。
      　　
      　　桑克瑞德率先皺起眉。
      　　
      　　「你這聲音可不像『沒什麼』。」
      　　
      　　光又試圖張口，結果迎來數道制止他的瞪視。
      　　
      　　「先喝口水再說吧。」阿莉塞急急忙忙將水杯遞了過來。
      　　
      　　最後經過一番七嘴八舌的盤問，眾人才知道他在黃金谷裡被魔界花的黏液正面噴了一身。
      　　
      　　「只是黏液而已，不是什麼致命傷，我不覺得有什麼異狀，還去溪邊洗了洗才回來。」
      　　
      　　光依舊試圖辯解。
      　　
      　　阿爾菲諾握著他的手腕開始檢查，認真的表情有些凝重。
      　　
      　　「看起來中毒了。」
      　　
      　　「而且正在發燒。」
      　　
      　　「有嗎？」
      　　
      　　握住他另一隻手的雅·修朵拉，抬眼瞥了光一眼。
      　　
      　　「如果你打算再說一句『我沒事』，我們會直接替你準備治療失去判斷能力的藥。」
      　　
      　　她微笑的神情裡透出一股威壓，光連忙縮回座位，乖乖地接受阿爾菲諾放出的治療術。
      　　
      　　毒素本身並不難處理。
      　　
      　　但中毒所伴隨的後遺症是出了名的複雜，又常常疊加數種令人不適的症狀，結果到了晚上，光果然燒得更厲害。
      　　
      　　他的體溫一路往上升，整個人昏昏沉沉，連自己是怎麼被架回房間、又是怎麼被塞進被窩裡的都沒有印象。
      　　
      　　之後的記憶便變得斷斷續續。
      　　
      　　他不知道自己睡了多久。
      　　
      　　高燒讓意識像泡進了一池溫熱的水裡，浮浮沉沉。耳邊最開始還有不少模糊的聲音，腳步來來去去，有人在討論藥量，有人在爭論誰留下來守夜。
      　　
      　　慢慢地，那些聲音都遠了。
      　　
      　　周圍重新安靜下來。
      　　
      　　每隔一段時間，會有人小心翼翼地扶起他，輕輕擦過他的頸側，沿著手臂一路擦到掌心，又替他翻過身，讓涼涼的毛巾從後頸一路貼過肩背。
      　　
      　　最後，那塊冰涼的濕布會重新落在額前。
      　　
      　　舒適的溫度讓人渾身放鬆，光也就由著自己繼續沉下去。
      　　
      　　直到不知道第幾次從昏沉的夢境裡浮上來時，他終於稍微恢復了些意識。
      　　
      　　房間裡很暗。
      　　
      　　窗外已經完全入夜，只有淡淡月光沿著窗框落進來，在地面切出一小片銀白。
      　　
      　　光費了不少力氣，才把沉重的眼皮撐開一條縫。
      　　
      　　模糊的視野只看見床邊坐著一道熟悉的紅色身影。
      　　
      　　古·拉哈·提亞靠著椅背，手裡捧著一本厚厚的書，鮮紅的眼睛在黑暗裡靜靜掃過書頁。
      　　
      　　整間房裡都是紙張偶爾翻動的細微聲響。
      　　
      　　光盯著他看了一會兒，意識還有點昏沉，卻還是忍不住開口。
      　　
      　　「……怎麼……不點燈？」
      　　
      　　那聲音一出口，連他自己都嫌棄。
      　　
      　　啞得不像話。
      　　
      　　古·拉哈·提亞幾乎立刻抬起頭。
      　　
      　　「你醒了？」
      　　
      　　方才還安安靜靜坐著的人一下子湊近床邊，書也被碰地闔上，隨手擱到了一旁。
      　　
      　　「頭還疼不疼？喉嚨呢？要不要喝水？」
      　　
      　　「……慢點。」
      　　
      　　光被他一連串問題問得頭更暈了。
      　　
      　　古·拉哈·提亞這才止住詢問，但那雙眼睛依舊仔仔細細掃著他的情況。
      　　
      　　光喘了口氣，又問了一遍。
      　　
      　　「怎麼搞得這麼黑？」
      　　
      　　「聽說點著燈會影響睡眠。」
      　　
      　　古·拉哈·提亞回頭看了眼桌上的燭台，笑了笑。
      　　
      　　「況且貓魅族的眼睛很好，這點光已經足夠了，不要緊的。」
      　　
      　　光沉默兩秒，無奈地想敲他額頭。
      　　
      　　他艱難地抬起手。
      　　
      　　但手臂才離開床面不到半尺，便軟綿綿地落了回去。
      　　
      　　古·拉哈·提亞低頭看看他的手，又看看他的臉，唇角似乎可疑地彎了一下。
      　　
      　　「你剛才是想敲我嗎？」
      　　
      　　「沒有。」
      　　
      　　「真的？」
      　　
      　　「……有一點。」
      　　
      　　「看來精神的確好一些了。」
      　　
      　　他竟然還顯得頗為欣慰。
      　　
      　　光又無奈地嘆了口氣。
      　　
      　　古·拉哈·提亞重新把注意力放回他的狀況上，伸手摸了摸額前的毛巾，又用手背貼著他的臉頰。
      　　
      　　「看起來退了一點。」他喃喃自語，「治療藥應該有發揮作用……不過還是再確認一下比較好。」
      　　
      　　光還沒反應過來，就見古·拉哈·提亞忽然靠了過來。
      　　
      　　「失禮了。」
      　　
      　　下一刻，額頭貼上了額頭。
      　　
      　　兩人的距離一下縮得極近，近到連彼此的呼吸都能感覺得到。
      　　
      　　月光很淡，可貓魅的眼睛在黑暗裡依然清亮，光甚至能看清古·拉哈·提亞垂下來的睫毛。
      　　
      　　對方顯然沒有半點多餘的心思，他正非常認真地半閉著眼睛，貼著光的額頭，靜靜感受著他的體溫。
      　　
      　　過了一會兒，古·拉哈·提亞困惑地皺起眉，蹙起的眉心連帶揪著光的前額。
      　　
      　　「奇怪……怎麼還是有點燙？」
      　　
      　　光看著近在咫尺的那張臉。
      　　
      　　「……拉哈。」
      　　
      　　「照理說藥水已經──」
      　　
      　　「拉哈。」
      　　
      　　「嗯？」
      　　
      　　光沙啞地說：「你這樣量……溫度會低才怪。」
      　　
      　　古·拉哈·提亞愣了愣。
      　　
      　　光能清楚看見他的耳尖一點、一點地紅了。
      　　
      　　大概過了兩三秒，終於反應過來的他低低笑了出來。
      　　
      　　「也是。」
      　　
      　　「所以……」
      　　
      　　「那也沒關係，看你的精神應該是沒有大礙了。」
      　　
      　　光還在困惑。
      　　
      　　下一刻，他就看見古·拉哈·提亞伸手抓住了自己的衣襬。
      　　
      　　光瞬間清醒了一半。
      　　
      　　「等一下。」
      　　
      　　古·拉哈·提亞手上沒停。
      　　
      　　「怎麼了？」
      　　
      　　「你幹嘛？」
      　　
      　　「幫你擦身體。」
      　　
      　　「現在？」
      　　
      　　「你剛才燒得厲害，出了不少汗。」
      　　
      　　他的語氣不能再理所當然。
      　　
      　　「一直悶著不舒服，擦乾淨也比較容易睡。」
      　　
      　　說著，他已經開始往上拉光的衣服。
      　　
      　　光下意識按住衣襬。
      　　
      　　「我自己來。」
      　　
      　　古·拉哈·提亞看了一眼他剛才抬都抬不起來的手，微微一笑。
      　　
      　　「你確定？」
      　　
      　　「……」
      　　
      　　「況且。」
      　　
      　　紅髮貓魅微微瞇起眼，耳朵輕輕地動了動。
      　　
      　　「這種時候才害羞，是不是已經太遲了？」
      　　
      　　光警覺地看他。
      　　
      　　「什麼意思？」
      　　
      　　「這幾天晚上我都在這。」
      　　
      　　古·拉哈·提亞笑得一臉無辜。
      　　
      　　「該看的差不多都看過了。」
      　　
      　　光的神色比夜色還黑。
      　　
      　　僅管房裡漆黑一片，他還是飛快抬手摀住了臉。
      　　
      　　「出去。」
      　　
      　　「不要。」
      　　
      　　「古·拉哈·提亞。」
      　　
      　　「病人沒有選擇的權利。」
      　　
      　　「這誰規定的？」
      　　
      　　「我。」
      　　
      　　光氣得想坐起身。
      　　
      　　但才動了一下，就被古·拉哈·提亞一隻手按了回去。
      　　
      　　「別鬧。」
      　　
      　　他的聲音一下又柔下來。
      　　
      　　「你燒還沒退。」
      　　
      　　於是光只能眼睜睜看著自己的上衣被拉了下來。
      　　
      　　古·拉哈·提亞顯然早就習慣了這幾日的照顧工作。
      　　
      　　他將毛巾浸進床邊的水盆裡，擰乾後重新坐到床沿。
      　　
      　　光不情不願地被扶起來。
      　　
      　　古·拉哈·提亞坐在他面前，讓光靠在自己肩上，一手扶住他的腰，另一手拿著涼毛巾，從後頸慢慢擦過肩背。
      　　
      　　清涼的觸感讓高熱帶來的不適確實緩和不少。
      　　
      　　光舒服地呼了口氣，然後又覺得哪裡不對。
      　　
      　　「……你一定要坐在我前面嗎？」
      　　
      　　「你這樣可以靠著我，比較舒服。」
      　　
      　　「我可以趴著。」
      　　
      　　「上回我試過，結果你一翻身就吐了。」
      　　
      　　「………那側躺呢。」
      　　
      　　「擦不到另一邊。」
      　　
      　　回答得滴水不漏。
      　　
      　　古·拉哈·提亞低著頭，嘴角卻微微揚著。
      　　
      　　光瞇起眼，他還是第一次見識到貓魅調皮的一面。
      　　
      　　「你是不是故意的？」
      　　
      　　「什麼？」
      　　
      　　「藉機想對我怎麼樣。」
      　　
      　　古·拉哈·提亞手裡的毛巾停了一下，接著他笑出了聲。
      　　
      　　「我？」
      　　
      　　「不然呢？」
      　　
      　　「原來我在你心裡是這種人。」
      　　
      　　古·拉哈·提亞替他擦過肩胛，語氣含著笑。
      　　
      　　「放心吧，我還沒有糟糕到會趁人之危。」
      　　
      　　光哼了一聲。
      　　
      　　「最好是。」
      　　
      　　古·拉哈·提亞將毛巾重新浸入水裡。
      　　
      　　「所以你最好早點好起來。」
      　　
      　　「……什麼意思？」
      　　
      　　水聲輕輕響了一下。
      　　
      　　古·拉哈·提亞把毛巾擰乾，若無其事地接了下去。
      　　
      　　「不然我可是忍耐很久了。」
      　　
      　　光愣住，嚇得嗆咳了兩聲。
      　　
      　　「什──」
      　　
      　　話還沒問出口，古·拉哈·提亞已經重新靠了過來。
      　　
      　　他先是伸手摸了摸光因為高燒而有些凌亂的頭髮，手指從髮間慢慢順過去，順勢貼近的側臉覆上光的臉頰，輕輕蹭著他的額角。
      　　
      　　方才還帶著幾分調侃的人，此刻聲音卻溫柔得不像話。
      　　
      　　「早點康復，別讓我擔心。」
      　　
      　　光忽然說不出話。
      　　
      　　古·拉哈·提亞又摸了摸他的頭，清涼的毛巾擦過他貼著濕髮的額前，順著鼻樑往下，隨後套著毛巾的手指輕輕點了一下光的嘴唇。
      　　
      　　接著像什麼都沒發生一樣，若無其事地端起床邊的水盆站起身。
      　　
      　　光的大腦直到這時才勉強重新開始運作。
      　　
      　　「你、你去哪？」
      　　
      　　古·拉哈·提亞已經走到門口。
      　　
      　　他回過頭，赤紅的眼睛在黑暗裡微微彎起。
      　　
      　　「我不是剛說忍了很久嗎？」
      　　
      　　「所以呢？」
      　　
      　　古·拉哈·提亞一本正經地回覆。
      　　
      　　「我去沖冷水。」
      　　
      　　「……」
      　　
      　　門關上了。
      　　
      　　光呆呆坐在床上。
      　　
      　　三秒之後，他猛地把被子拉過頭頂。
      　　
      　　「古·拉哈·提亞──！」
      　　
      　　沙啞的怒吼從房間裡傳出去。
      　　
      　　門外的人笑得差點把水盆打翻。
      　　
      　　
      　　
      　　
      　　事後證明，病人受到刺激之後，精神的確會變好。
      　　
      　　至少隔天開始，光的燒就慢慢退了。
      　　
      　　再過兩日，除了聲音還有些沙啞之外，他已經能若無其事地下床走動。
      　　
      　　阿爾菲諾檢查過後總算鬆了口氣。
      　　
      　　「已經沒有大礙了，這兩天還是不要太勉強自己。」
      　　
      　　阿莉塞在旁邊冷笑。
      　　
      　　「早上已經有人想偷跑出去打木人了。」
      　　
      　　光望向窗外，假裝沒聽見。
      　　
      　　雅·修朵拉則意味深長地掃了他一眼。
      　　
      　　「既然已經恢復得差不多，那麼接下來──」
      　　
      　　她停頓一下，目光轉向休息室另一頭。
      　　
      　　「似乎該處理下一個了。」
      　　
      　　眾人一起望過去。
      　　
      　　古·拉哈·提亞正坐在椅子上。
      　　
      　　他身上裹著毛毯，臉頰泛紅、耳朵無精打采地垂著。
      　　
      　　光眨了眨眼，阿莉塞抱起手臂，桑克瑞德慢慢別開臉。
      　　
      　　面對眾人的視線，古·拉哈·提亞沙啞地咳了一聲。
      　　
      　　「我沒事……只是有一點著涼。」
      　　
      　　房間裡詭異地安靜下來。
      　　
      　　雅·修朵拉微微一笑。
      　　
      　　「有一點？」
      　　
      　　「……是的。」
      　　
      　　「連續幾天半夜洗冷水澡，也只是有一點著涼？」
      　　
      　　光猛地抬頭。
      　　
      　　桑克瑞德直接轉過身去，肩膀抖得非常可疑。
      　　
      　　古·拉哈·提亞的耳朵慢慢往後壓。
      　　
      　　「雅·修朵拉……」
      　　
      　　「我早就說過，照顧病人時也要照顧好自己。」
      　　
      　　雅·修朵拉完全沒有放過他的意思。
      　　
      　　「結果某位賢人不僅不好好睡覺，還天天用冷水折騰自己，不愧是跟光一起冒險了這麼久。」
      　　
      　　她環抱著手，輕輕嘆氣。
      　　
      　　「連『我沒事』的標準都越來越接近。」
      　　
      　　一起納入責怪範圍內的光，眼神可疑地游移著。
      　　
      　　最後，古·拉哈·提亞毫無反抗餘地地被送回了房間。
      　　
      　　他軟綿綿地躺在自己的床上，腦袋昏沉、鼻子塞住、喉嚨也開始疼。
      　　
      　　門外傳來腳步聲。
      　　
      　　接著，是水盆輕輕晃動的聲音。
      　　
      　　古·拉哈·提亞迷迷糊糊睜開眼。
      　　
      　　門一開，是光站在門口，手裡捧著一盆水。
      　　
      　　古·拉哈·提亞的耳朵忽然警覺地豎了起來。
      　　
      　　「等等。」
      　　
      　　光毫不理會，徑直走進房間。
      　　
      　　「你想做什麼？」
      　　
      　　然後順手把門關上。
      　　
      　　碰地一聲悶響。
      　　
      　　門外正好路過的阿莉塞停下腳步。
      　　
      　　她看看緊閉的房門，又看看旁邊同樣停下來的雅·修朵拉。
      　　
      　　兩人停在房門口，靜靜地聽著。
      　　
      　　房門之後，很快傳來古·拉哈·提亞慌張的聲音。
      　　
      　　「等、等等，光，我可以自己擦——」
      　　
      　　碰。
      　　
      　　不知道是什麼東西倒了。
      　　
      　　接著是光依舊沙啞、卻明顯帶著報復快意的聲音。
      　　
      　　「病人沒有拒絕的權利。」
      　　
      　　門外安靜了一瞬。
      　　
      　　阿莉塞忍不住問：「這句話誰教他的？」
      　　
      　　雅·修朵拉望著那扇門。
      　　
      　　「我想。」她淡淡地說：「應該是自作自受吧。」
