      　　「我喜歡你，桑克瑞德。」
      　　
      　　酒杯裡的琥珀色液體晃出了幾滴，濺在他手背的舊皮套上。
      　　
      　　那句不帶半點猶豫的告白，讓桑克瑞德的笑意就這麼靜止在臉上。他低頭瞪著那隻杯子，又極其緩慢地抬起眼，目光在光的臉上巡了半晌，彷彿想從英雄的神情抓出任何一絲惡作劇的破綻。
      　　
      　　「……喂喂，這笑話可不太像你平時的風格啊。」
      　　
      　　他揉了揉發皺的眉心，唇角扯出一抹苦澀的弧度，「就算要拿老前輩尋開心，也該挑個無傷大雅的理由吧？」
      　　
      　　「你覺得我像在開玩笑？」
      　　
      　　光往前踏了一步，像是不滿被年齡硬生生拉出的距離，平靜但果決的藍眼毫無閃躲。
      　　
      　　見他這副模樣，桑克瑞德臉上輕浮的笑容終於徹底散去。
      　　
      　　他放下酒杯，杯底在木桌上磕出一聲清脆的碰撞聲，隨後抓了抓散開的白髮，眼神裡佈滿濃厚的困惑。
      　　
      　　以往的桑克瑞德，對付這種場面簡直得心應手。幾句恰如其分的讚美、一個游刃有餘的微笑、或者輕巧地將話題帶過，他有數百種方式在不傷人自尊的情況下，從不該萌芽的感情裡全身而退。
      　　
      　　畢竟那只是為了隱藏意圖而利用的關係。
      　　
      　　但是現在，他眼前站著的是光，是自己一路注視著成長、茁壯至強大的夥伴。
      　　
      　　「不是……我說，你到底看上我哪一點了？」
      　　
      　　他問得很輕，語氣裡的困惑與狼狽卻很真實。
      　　
      　　這不是自謙，他很清楚自己生了一副方便行事的皮相，也知道自己在戰場上算是個能託付後背的夥伴。但眼前的人是光，是見過他被無影當成人偶操弄的醜態、見過他沒能守住敏菲利亞時的無力，也見過他在第一世界面對琳時，那些自私、搖擺不定、連自己都嫌惡的軟弱與逃避。
      　　
      　　「……你應該很清楚，我可不是什麼從不犯錯的聖人吧？」
      　　
      　　想不通的桑克瑞德只能扯了扯嘴角，試圖理解眼前人的選擇。
      　　
      　　「是人都會犯錯。」
      　　
      　　「成天惹一身麻煩，脾氣固執，說到底不過是個渾身破綻的中年男人。」
      　　
      　　「你沒有自己說得這麼糟。」
      　　
      　　「……如果平常也這麼誇我，我會更開心。」
      　　
      　　光輕聲一哼，「別老是這麼說自己。你強大的地方，我比任何人清楚。」
      　　
      　　那句話輕飄飄地砸在桑克瑞德胸口。
      　　
      　　他怔怔地看了光半晌，最終嘆了口長氣，轉過身往前踱了兩步，留給英雄一個在戰場上無數次凝視過的可靠背影。
      　　
      　　也是啊……事到如今，自己要是再懷疑那顆捧出來的真心，就有點過份了。
      　　
      　　燈火將兩人的影子拉得很長。
      　　
      　　桑克瑞德不用回頭，就能想像那雙藍眼裡的堅毅──他們的英雄既然開了頭、不得到答案是不會放棄的。
      　　
      　　「……這下可真的傷腦筋了啊。」
      　　
      　　他又嘆了口氣，仰頭望著前方的燭火。
      　　
      　　「我這個人，在遇到重要之人的事情上……總會失去冷靜。」桑克瑞德側過半邊臉，唇邊勾著一抹無奈的苦笑，「我原本還指望，在我做出什麼無可挽回的蠢事之前，你能狠狠地教訓我一頓。」
      　　
      　　因為光比他清醒、比他堅定，比世上任何人都能堅持自己的意志。
      　　
      　　那或許是拂曉所有人、還有自己都早已習慣的依賴。
      　　
      　　「但現在這樣，萬一那一天真的到了，你這傢伙……還能毫不猶豫地對我下手嗎？」」
      　　
      　　面對他的憂慮，光卻僅是眨了眨眼。
      　　
      　　「這兩件事有什麼關係？」
      　　
      　　桑克瑞德一愣，「哈？」
      　　
      　　「喜歡你，跟把你拖回來，有衝突嗎？」光的語氣十分平靜，甚至帶了點單純的困惑，「你要是真的走錯了路，我當然會把你拽回來。」
      　　
      　　「……即使我不願意？甚至打算赴死？」
      　　
      　　「那就揍到你願意為止。」光的語調沒有半分起伏，甚至活動了一下手腕，指節發出清脆的一聲輕響，「只要我擋在前方，你也未必狠得了心。」
      　　
      　　桑克瑞德眼睛大大地睜開，足足愣了數秒，接著忽然大笑出聲。
      　　
      　　他低下頭，單手捂住整張臉，肩膀難以控制地劇烈抖動起來。
      　　
      　　「哈！說得也是！」
      　　
      　　他笑得眼角泛起微光，甚至有些上氣不接下氣。
      　　
      　　是啊，這可是光之戰士，是拂曉最為可靠的主心骨，自己那點脆弱的託付，怎麼可能影響他的意志。
      　　
      　　「……真是，一點面子都不給啊。」
      　　
      　　桑克瑞德長長地舒了一口氣，轉身正對著光。眼底裡因長年習慣而無意識築起的防備終於徹底融化，沉寂的淺色眼睛緩緩浮上，溫和且平靜。
      　　
      　　「原本還以為，在這種事上我好歹能佔點年長者的上風呢。」
      　　
      　　「所以？」光看著他，「你的回答呢？」
      　　
      　　桑克瑞德從指縫中抬眼，靜靜凝視著光。
      　　
      　　他們並肩作戰、一起走過無數艱難，對這個人的信賴早已刻進骨血。但英雄是同生共死的戰友、是將性命託付的存在。
      　　
      　　至於，戀人……
      　　
      　　「……抱歉啊。」
      　　
      　　桑克瑞德抬手，輕輕拍了拍光的肩膀，嘴角勾起複雜的微笑。
      　　
      　　光沒有說話，只是靜靜地看著他，垂在身側的手微微抽動，卻也沒有進一步的動作。
      　　
      　　兩人沉默了很久，腦海裡流轉著從相遇至今歷經的一切。那些或歡笑或痛苦的回憶裡，似乎總有對方的身影。
      　　
      　　最後，光率先笑了出來，伸出指節迅速抹去眼角的亮光。
      　　
      　　「你那什麼表情啊。」他笑著說，「拂曉風流男，不是應該很擅長應付這種場面嗎？」
      　　
      　　「那也得看對象是誰啊。」
      　　
      　　反射性脫口而出的話，讓兩人皆愣在當場。
      　　
      　　桑克瑞德頓了頓，迅速反應過來的他很快地壓下內心異樣的躁動，欲蓋彌彰地輕咳了一聲。
      　　
      　　「那個，我說……」拂曉可靠的諜報賢人掃了搔頭，意圖緩和自己造成的尷尬，「要不……你可以考慮一下其他人？你看，就在我們身旁，憧憬你的人不是很多嗎？」
      　　
      　　「桑克瑞德！」
      　　
      　　好不容易放鬆的肩膀，又因英雄的怒吼狠狠震了一下。一項可靠平靜的臉龐終於維持不住笑容，被難堪的憤怒所取代。
      　　
      　　「別再讓我聽見你說這種話。」光的手指死死扯緊胸口的衣料，臉上的神情隱忍著，彷彿再輕輕一推，強撐起的防線就會徹底瓦解，「這份感情，我不會讓任何人干涉，就算是你也不行。」
      　　
      　　空氣在瞬間安靜下來。
      　　
      　　桑克瑞德看著光微微顫抖的肩膀，喉頭滾了滾，最終只化作一聲極輕的嘆息。
      　　
      　　「……真是拿你沒辦法啊。」
      　　
      　　他走上前，抬手輕輕摸了摸光的頭頂，掌心帶著熟悉的粗糙與溫度。光沒有拒絕，只是垂著臉、藍眼隱藏在手臂的陰影裡，看不出任何情緒。
      　　
      　　桑克瑞德唇邊泛起一抹無可奈何的苦笑。
