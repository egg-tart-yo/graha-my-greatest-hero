title: 包裹
cp:
  - 拉哈光
  - R18
updated: 2026-10-30
summary: 6.0完結後背景
series: 短篇
chapters:
  - body: |-
      　　郵務士的斜背包沉甸甸地壓在肩頭，光抹了一把額角的汗水，一邊歎著氣、在內心規劃下一個路線。
      　　
      　　起初只是在海都碰巧撞見那隻愁眉苦臉的莫古利，一時心軟答應了幫忙。哪知道自他戴上郵務士的帽子後，就一路從拉諾西亞的果園跑到了薩納蘭的荒漠。
      　　
      　　滿世界的信件此刻聚集在身側的背包裡，每一封都繫著沉甸甸的思念，與文字化作的傾訴。
      　　
      　　送信的旅程，光也遇見許多熟面孔。
      　　
      　　在巨龍首營地，弗朗賽爾接過光遞來的密函時，笑著端來一杯熱騰騰的香料紅酒，問他什麼時候能坐下來跟大夥好好吃頓飯；在雲頂營地，送完信的光還逗留了一陣子，觀看了瓦努族的戰舞後才離開；甚至在加雷馬的雪原上，阿爾菲諾一邊幫他指路一邊無奈地嘆氣，叮囑他別總是把自己當成不知疲倦的魔導機甲。
      　　
      　　日升月落間，時間過得比想像中更快。等到光回過神時，郵務包裡的信件終於只剩下寥寥幾封。
      　　
      　　他隨意抽出其中一封，指尖拂過紙張上細緻的燙金火漆，目光熟練地落在收件地點上。
      　　
      　　舊薩雷安。
      　　
      　　光的腳步下意識停住了。
      　　
      　　海風的味道、寧靜大街的書香，還有某個總是抱著一大疊書籍、紅髮在陽光下格外顯眼的貓魅族青年，毫無預警地撞進了腦海。
      　　
      　　算起來，自己滿世界亂跑著送信，究竟有多久沒回分館了？
      　　
      　　被留在舊薩雷安的那名貓魅，現在是在主館裡埋頭研究，還是一邊嚼著夾肉麵包、一邊盯著文獻書書寫寫？
      　　
      　　想到那抹身影，胸口泛起一陣微微發癢的想念。光將信封妥善塞回包裡，唇角不自覺揚起。
      　　
      　　這封送完，就去看看他吧。如此想著的光之郵務士迅速地趕往碼頭，在港邊坐等了一會，然後在櫃檯剛開時買了第一張船票。
      　　
      　　一路顛簸搖擺，渡船靠岸的號角聲終於打破了幾日後的夜霧。
      　　
      　　光踏上海港碼頭的石階，就著霧中的模糊路燈重新確認起詳細地址。可當他的視線掃過那一串整齊優雅的字跡時，神情卻微微一愣。
      　　
      　　收件地址清清楚楚地寫著：巴爾德西昂分館。
      　　
      　　既沒有收件人的名稱，也沒有署名是哪個研究室，就只有這座他熟悉得不能再熟悉的建築。
      　　
      　　「是給委員會的委託嗎？」
      　　
      　　光嘀咕了一句，索性不再多想，將郵務包往肩上一甩就快步朝分館走去。
      　　
      　　夜色下的館內格外幽靜，歐吉卡難得不在大廳的櫃檯，東張西望的光只能自己踩著放輕的腳步，往幽暗的長廊上走去。
      　　
      　　他正盤算著要把信件放在公共信箱，還是要掉頭回到大廳，身側的一扇房門卻突然「喀嗒」一聲，輕輕滑開了。
      　　
      　　聽見聲響的光回過頭去。
      　　
      　　暖橘色的室內光線從門縫中傾瀉而出，將依靠在門框上的修長身影勾勒出一道柔和的輪廓。背著屋內的燈火，光有些看不清那人的面容，只能看見對方頭頂那對輕輕顫動的耳朵，以及身後搖晃的尾巴。
      　　
      　　「拉哈？」光試探著喚了一聲。
      　　
      　　門邊的貓魅族青年輕笑了一聲，紅色的眼眸在逆光中依然閃爍著細碎的光芒。
      　　
      　　「看來我的包裹到了。」
      　　
      　　「包裹？」
      　　
      　　光一頭霧水地低下頭，伸手在扁扁的斜背包裡掏了掏，手中依然只有那封沒有署名的信件。
      　　
      　　「你弄錯了吧？我這裡沒有包裹，只有這一封不知道要給誰的信……」
      　　
      　　話音未落，古·拉哈·提亞已經邁步上前，他微微抬起的手略過那封信，繼續向前探去，溫熱的指尖準確無誤地扣住了光的手腕，拇指搭著食指、繞起一個圈。
      　　
      　　「不是指信，那信本來就是我寫的。」
      　　
      　　「……你寄給自己？」
      　　
      　　古·拉哈·提亞的眼角彎起調皮又溫柔的弧度，手掌微微用力，將愣在原地的英雄往自己的方向拉了一把，納入背著屋內光源的陰影之下。
      　　
      　　他湊得極近，光甚至能聞到他身上淡淡的墨水味與陽光曬過的香氣。貓魅的前額輕靠在光的胸膛，柔軟的耳朵一動，順著仰頭的動作從頸部緩緩地拂至下顎。
      　　
      　　搔得人心頭發癢。
      　　
      　　光沒來由地想起自己那份思念，也是似羽毛般，輕輕地、癢癢地落在那。
      　　
      　　「我說的包裹，是指這個……」收緊力道的貓魅低笑著，尾音帶著難得透漏的、小小的埋怨，「送信送到不知道回來的英雄。」
      　　
      　　光還沒來得及開口辯解，就被一股力道順勢拉進了溫暖的房間。
      　　
      　　喀嗒。
      　　
      　　身後的門被俐落地闔上，將外頭微涼的夜風與滿世界的信件徹底隔絕在外。
