title: 包裹
cp:
  - 拉哈光
  - 歡樂/甜文向
  - R18
updated: 2026-11-03
summary: 6.0完結後背景
series: 短篇
chapters:
  - title: 主篇
    body: |-
      　　郵務士的斜背包沉甸甸地壓在肩頭，光抹了一把額角的汗水，一邊歎著氣、在內心規劃下一個路線。
      　　
      　　起初只是在海都碰巧撞見那隻愁眉苦臉的莫古利，一時心軟答應了幫忙。哪知道自他戴上郵務士的帽子後，就一路從拉諾西亞的果園跑到了薩納蘭的荒漠。
      　　
      　　滿世界的信件此刻聚集在身側的背包裡，每一封都繫著沉甸甸的思念，與文字化作的傾訴。
      　　
      　　送信的旅程，光也遇見許多熟面孔。
      　　
      　　在巨龍首營地，弗朗賽爾接過光遞來的密函時，笑著端來一杯熱騰騰的香料紅酒，問他什麼時候能坐下來跟大夥好好吃頓飯；在雲頂營地，送完信的光還逗留了一陣子，觀看了瓦努族的戰舞後才離開；甚至在加雷馬的雪原上，阿爾菲諾一邊幫他指路一邊無奈地嘆氣，叮囑他別總是把自己當成不知疲倦的魔導機甲。
      　　
      　　日升月落間，時間過得比想像中更快。等到光回過神時，郵務包裡的信件終於只剩下寥寥幾封。
      　　
      　　他隨意抽出其中一封，指尖拂過紙張上細緻的燙金火漆，目光熟練地落在收件地點上。
      　　
      　　舊薩雷安。
      　　
      　　光的腳步下意識停住了。
      　　
      　　海風的味道、寧靜大街的書香，還有某個總是抱著一大疊書籍、紅髮在陽光下格外顯眼的貓魅族青年，毫無預警地撞進了腦海。
      　　
      　　算起來，自己滿世界亂跑著送信，究竟有多久沒回分館了？
      　　
      　　被留在舊薩雷安的那名貓魅，現在是在主館裡埋頭研究，還是一邊嚼著夾肉麵包、一邊盯著文獻書書寫寫？
      　　
      　　想到那抹身影，胸口泛起一陣微微發癢的想念。光將信封妥善塞回包裡，唇角不自覺揚起。
      　　
      　　這封送完，就去看看他吧。如此想著的光之郵務士迅速地趕往碼頭，在港邊坐等了一會，然後在櫃檯剛開時買了第一張船票。
      　　
      　　一路顛簸搖擺，渡船靠岸的號角聲終於打破了幾日後的夜霧。
      　　
      　　光踏上海港碼頭的石階，就著霧中的模糊路燈重新確認起詳細地址。可當他的視線掃過那一串整齊優雅的字跡時，神情卻微微一愣。
      　　
      　　收件地址清清楚楚地寫著：巴爾德西昂分館。
      　　
      　　既沒有收件人的名稱，也沒有署名是哪個研究室，就只有這座他熟悉得不能再熟悉的建築。
      　　
      　　「是給委員會的委託嗎？」
      　　
      　　光嘀咕了一句，索性不再多想，將郵務包往肩上一甩就快步朝分館走去。
      　　
      　　夜色下的館內格外幽靜，歐吉卡難得不在大廳的櫃檯，東張西望的光只能自己踩著放輕的腳步，往幽暗的長廊上走去。
      　　
      　　他正盤算著要把信件放在公共信箱，還是要掉頭回到大廳，身側的一扇房門卻突然「喀嗒」一聲，輕輕滑開了。
      　　
      　　聽見聲響的光回過頭去。
      　　
      　　暖橘色的室內光線從門縫中傾瀉而出，將依靠在門框上的修長身影勾勒出一道柔和的輪廓。背著屋內的燈火，光有些看不清那人的面容，只能看見對方頭頂那對輕輕顫動的耳朵，以及身後搖晃的尾巴。
      　　
      　　「拉哈？」光試探著喚了一聲。
      　　
      　　門邊的貓魅族青年輕笑了一聲，紅色的眼眸在逆光中依然閃爍著細碎的光芒。
      　　
      　　「看來我的包裹到了。」
      　　
      　　「包裹？」
      　　
      　　光一頭霧水地低下頭，伸手在扁扁的斜背包裡掏了掏，手中依然只有那封沒有署名的信件。
      　　
      　　「你弄錯了吧？我這裡沒有包裹，只有這一封不知道要給誰的信……」
      　　
      　　話音未落，古·拉哈·提亞已經邁步上前，他微微抬起的手略過那封信，繼續向前探去，溫熱的指尖準確無誤地扣住了光的手腕，拇指搭著食指、繞起一個圈。
      　　
      　　「不是指信，那信本來就是我寫的。」
      　　
      　　「……你寄給自己？」
      　　
      　　古·拉哈·提亞的眼角彎起調皮又溫柔的弧度，手掌微微用力，將愣在原地的英雄往自己的方向拉了一把，納入背著屋內光源的陰影之下。
      　　
      　　他湊得極近，光甚至能聞到他身上淡淡的墨水味與陽光曬過的香氣。貓魅的前額輕靠在光的胸膛，柔軟的耳朵一動，順著仰頭的動作從頸部緩緩地拂至下顎。
      　　
      　　搔得人心頭發癢。
      　　
      　　光沒來由地想起自己那份思念，也是似羽毛般，輕輕地、癢癢地落在那。
      　　
      　　「我說的包裹，是指這個……」收緊力道的貓魅低笑著，尾音帶著難得透漏的、小小的埋怨，「送信送到不知道回來的英雄。」
      　　
      　　光還沒來得及開口辯解，就被一股力道順勢拉進了溫暖的房間。
      　　
      　　喀嗒。
      　　
      　　身後的門被俐落地闔上，將外頭微涼的夜風與滿世界的信件徹底隔絕在外。
  - title: 番外
    body: |-
      　　將光壓在門板上時，發出了比預料中還要響亮的撞擊，但現在的古·拉哈·提亞已經無暇顧及剛才發出的動靜，以及接下來可能會惹出的聲響。
      　　
      　　他挑開光肩頭沉甸甸的郵務包扣帶，皮包落地的悶聲響起的同時，頭上的郵務士帽子也被扔在一旁。
      　　
      　　送信歸來的英雄身上佈滿了陌生的氣味。
      　　
      　　雖然貓魅族不是真正的貓，這點他心知肚明，但不曉得為什麼，對於這人身上的味道他也有那麼一點執著。古·拉哈·提亞仰頭緊貼在光的頸項間，舔吻過每一吋肌膚的同時，鼻尖能嗅到對方身上來自舊薩雷安港口的潮濕海氣，也混雜著拉諾西亞田園的果香、庫爾札斯的霜雪，甚至還有幾分屬於加雷馬煙硝與炮火的刺鼻氣味。
      　　
      　　跑得可真夠遠的。
      　　
      　　看來要染回自己熟悉的味道，得多花點時間了。
      　　
      　　毛茸茸的頭近乎強硬地卡在英雄側頸與肩膀的凹陷處。他張口咬上脖頸，牙尖刻意擦過正鼓動著的動脈──他清楚脆弱的地方總能輕易地撩撥起光的興奮。倒不如說，對於光身上的每一處敏感點，向來只有古·拉哈·提亞是否選擇疼愛那裡，而沒有他不知道的祕密。
      　　
      　　賢人的知識包羅萬象，但在古·拉哈·提亞的心裡，其實僅有兩個分類：與英雄相關的，以及與英雄無關的。
      　　
      　　而面對接了個委託就滿大陸亂跑、跑得連回家都忘了的英雄，古·拉哈·提亞承認，自己確實有些小小埋怨。
      　　
      　　也不回來看看我。
      　　
      　　我可是一直、一直在這裡等你啊。
      　　
      　　「唔……拉哈……別咬那裡──」
      　　
      　　貓耳敏銳地動了動，非但沒有收斂，反而變本加厲地叼起頸側柔軟的薄皮，用牙尖細細摩擦。古·拉哈·提亞鬆開其中一隻壓制著光的手，指尖靈巧地解開衣扣，順著衣襟探了進去。
      　　
      　　難耐喘息著的光胸膛劇烈起伏，急促跳動的心臟隔著富有彈性的胸肌鼓動，頂端早已挺立的茱萸一次次擦過貓魅懸空的掌心。古·拉哈·提亞自顧自地將這份顫慄解讀為英雄的默許，兩指隨即撫了上去，精準夾住那顆泛紅的小點，刻意用了些力道往上拉提。
      　　
      　　「哈啊……！」
      　　
      　　光沙啞的喘息驟然拔高，腰肢終於抗議地掙扎了起來。可事已至此，古·拉哈·提亞哪會這麼輕易就放過他。
      　　
      　　貓魅修長的膝蓋往前一頂，不由分說地分開英雄緊繃至微微發顫的大腿，隔著衣料抵上腿間早已滾燙的硬挺。感受到底下的溫度，古·拉哈·提亞滿意地瞇起眼，他仰起頭，將濕熱的吐息覆在光泛紅的耳廓旁。
      　　
      　　「包裹確實準時送達了，郵務士先生。」他細細舔舐著耳廓的軟骨，舌尖最後在冰涼的耳垂上壞心眼地輕彈了一下，「那麼，我要拆封了。」
      　　
      　　「信、信封不是……唔！」
      　　
      　　「規範寫得清清楚楚，逾期未歸的損失，全由收件人親自向郵務士索賠喔。」
      　　
      　　粗糙的指尖沿著緊繃的腰線直直向下探去，古·拉哈·提亞直接探入光的底褲，慌亂的英雄下意識併攏雙腿，試圖阻撓貓魅得寸進尺的動作。
      　　
      　　危險豎起的紅瞳瞬間暗了幾分。
      　　
      　　「光，請打開。」
      　　
      　　「等等、拉哈……！」
      　　
      　　「等不了。」另一隻手扣住英雄的後頸，古·拉哈·提亞仰頭吻住了那張試圖抗議的唇，將自己理直氣壯的任性連同唾液一同送了進去，「包裹這麼晚才送回我手裡，總得有些補償。」
      　　
      　　「那也不能從我身上……唔！」
      　　
      　　不理會他的抗議，貓魅靈活的手指繞過英雄稍稍鬆動的腿根，一把包裹住那根發脹的慾望，規律而用力地套弄起來。
      　　
      　　現在的古·拉哈·提亞不想聽那張嘴發出呻吟以外的聲音。
      　　
      　　他只想用最原始的方式確認，眼前的這個人，是不是如同自己渴求他一般，同樣無可救藥地依戀著自己。
      　　
      　　掌心收得很緊，指腹在擦過分身頂端的凹槽時刻意加重了揉搓的力道，逼得透明黏膩的液體從鈴口不斷溢出。在最後一次從沉甸甸的囊袋一路撫弄到頂端後，古·拉哈·提亞乾脆地將手抽了出來。
      　　
      　　劇烈喘息著的光垂下頭，溢滿水氣的蔚藍眼眸滿是情動交織的潮紅。而古·拉哈·提亞僅是溫柔地啄了啄他滾燙的臉頰，隨後雙手撫向對方的腰際，俐落地將長褲連同底褲一路褪至腳踝，隨即單膝跪坐在光敞開的雙腿之間。
      　　
      　　光的藍眼猛然一縮，慌忙伸手想要去推他的肩膀。
      　　
      　　「等等！拉哈……不用做到這種地步……！在門口……」
      　　
      　　貓魅依然充耳不聞。
      　　
      　　那雙固執的紅眼毫不避諱地盯著光眼底的無措與慌亂，他微微張口，濕軟的舌尖直接貼上高高翹起的前端，靈巧地繞著冠頭打轉。在溢出的腺液上疊加更濕潤的唾沫後，舌面帶著貓魅特有的細密微刺，重重碾過正中央敏感的凹槽，刻意又壞心眼地輕輕一勾。
      　　
      　　「──唔嗯！」
      　　
      　　那陣又酸又麻、近乎刺痛的劇烈快感瞬間竄上脊椎，難以遏制的尖叫差點脫口而出。光急忙死死捂住自己的嘴，深怕驚動了其他房間的人。但古·拉哈·提亞顯然毫不在意，豎瞳只是極其專注地將光隱忍的模樣盡收眼底。
      　　
      　　這是只有自己能看見的英雄。
      　　
      　　想到這點，內心的哀怨終於開始逐漸被滿足替代。
      　　
      　　他用舌尖托起那根發燙的分身，隨後在光失焦的注視下深深吞了進去，直至前端直抵喉嚨最深處。
      　　
      　　英雄兩側的大腿肌肉緊繃得青筋凸起，抵在唇上的手掌劇烈顫抖，幾乎快要壓抑不住喉間洩出的破碎喘息。古·拉哈·提亞索性騰出一隻手，拉住光緊繃的手肘，強行將那隻捂著嘴的手拉開，牽引著按在自己的後腦上。
      　　
      　　紅眸始終緊緊勾住光的目光。
      　　
      　　古·拉哈·提亞忽然停下了吞吐的動作，宛如極具耐心的獵人，以深陷的雙頰緊緊包裹著肉刃，靜靜地等著光的理智在一片灼熱中被徹底溶解。
      　　
      　　口腔內部的軟肉發狠地絞緊，深深吮吸著那根幾乎發狂的硬物。
      　　
      　　「拉、哈……不要……停……」
      　　
      　　水霧瀰漫的藍眼終於徹底潰散開來，被快感淹沒的英雄終於放棄了最後的掙扎，羞恥又難耐地提出要求。五指無力地插進貓魅那一頭柔軟的紅髮間，順著方才的節奏，輕輕著按壓起對方的後腦。
      　　
      　　古·拉哈·提亞這才虔誠地闔上眼簾，喉間發出一聲機不可察的饜足嗚咽，隨後模仿著交合的深淺節奏，口中用力一吸──
      　　
      　　「啊……！」
      　　
      　　滾燙的白濁在狹窄的喉間迸發而出。
      　　
      　　古·拉哈·提亞輕輕一笑，濕潤的舌尖探出，用指腹勾起腥羶的液體。他微微偏過頭，泛著水光的紅瞳向上望著脫力靠在門板上、雙眼失焦的光。
      　　
      　　平日裡溫和有禮、事事克制的模樣，不過是他單純滿足於這個人平和自由的背影，但若真要論起對這位英雄的獨佔欲，古·拉哈·提亞自認，他絕不會輸給世上的任何一個人。
      　　
      　　裹滿黏膩的長指探向光的身後，就著剛射出的體液往內一滑，熟練地擴張起來。光被後穴突然闖入的異物激得悶哼一聲，腰肢止不住地發軟。
      　　
      　　「光……」
      　　
      　　貓魅低聲喚著英雄的名字，像隻終於迎來主人歸家的寵物般，輕輕蹭著光的側頸。
      　　
      　　滿足的聲音溫柔得不可思議，可身下的動作卻毫無止息之意。古·拉哈·提亞俐落地抽回三指，單手撈起光的一條長腿架在自己的腰側，就著對方後背抵在門板上的姿勢，向前狠狠一挺──
      　　
      　　滾燙的分身一口氣貫穿了早已濕軟的入口，完完整整地沒入最深處。
      　　
      　　「唔啊──！」
      　　
      　　光仰起脖頸，在門板劇烈的晃動聲中徹底陷落。
      　　
      　　古·拉哈·提亞的懷抱撐住他的英雄，下身無法忍耐的律動逐漸加快，意圖將思念與情慾，毫無保留地釋放在光的體內。
