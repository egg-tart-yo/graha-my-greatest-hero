  - body: |-
      　　廣闊的草原傳來急促而輕快的腳步聲，光與微風捲起的草浪一同奔跑而來，筆直地撞進了他的視野。
      　　
      　　「拉哈──」
      　　
      　　古·拉哈·提亞眼底浮起溫暖的笑意，張開雙臂迎上去，在嬌小的身軀撲進懷裡的瞬間穩穩收緊力道。慣性帶著兩人在草地上微微晃動，他低笑了一聲，抬手撫過她凌亂的髮絲，指尖帶著熟悉的體溫，無比溫柔地捧住了她微喘的臉龐。
      　　
      　　「別跑那麼急，我會等你。」
      　　
      　　「想你嘛。」
      　　
      　　少女調皮地吐吐舌，引得青年一陣笑，溫熱的拇指輕輕撫過英雄泛紅的臉頰。然而，貓耳突然微微一動，敏銳地捕捉到幾十步外草葉被輕輕踩過的窸窣聲。
      　　
      　　那股令他神經緊繃的氣息，正慢條斯理地朝這裡靠近。
      　　
      　　古·拉哈·提亞眼底的溫柔忽然沉了下去，覆上了一層陰暗的戒備。他沒有放開手，反而不動聲色地側了側身子，用自己寬闊的肩背將光牢牢擋在身前，完全隔絕了她回頭的可能。
      　　
      　　「……英雄，看著我。」
      　　
      　　他的嗓音低了幾分，帶著幾分誘哄與焦躁。
      　　
      　　光還沒來得及疑惑，古·拉哈·提亞扣在她後頸的指節微微收緊，不容置喙的力道迫使她仰起頭，隨後毫不猶豫地俯身、深深吻了下去。
      　　
      　　這個吻霸道得幾乎不給她喘息的空間，溫熱的唇舌長驅直入，強硬地奪取她口中所有的呼吸。舌尖反覆糾纏、勾起另一個柔軟，在幽暗狹小的口腔中緊緊交纏。
      　　
      　　光被吻得腦海一片空白，含糊的嗚咽全被堵在唇齒之間，來不及吞嚥的唾液順著兩人的唇角溢出，在日光下牽扯出曖昧的水光。
      　　
      　　摟在她腰間的手臂猛然發力，古·拉哈·提亞單手將她往上一提，力道大得幾乎讓她的雙腳離地。
      　　
      　　「唔……」
      　　
      　　光只能竭力踮起腳尖，雙手攀上他的後背，緊緊環住他的腰身，將自己毫無保留地貼緊他滾燙的胸膛。
      　　
      　　被吻得昏頭轉向的英雄並沒有注意到，古·拉哈·提亞的胸口劇烈起伏，滿腔都是滾燙而偏執的念頭。
      　　
      　　──看著我，只看著我。
      　　
      　　──你眼裡的倒影，有我就夠了。
      　　
      　　他的吻微微鬆開了一瞬，趁著她急促換氣的空隙，顫動的嘴唇沿著她的唇角，輾轉咬向下頜，低沉微啞的嗓音貼著她的脖頸，激起陣陣煽情的酥麻。
      　　
      　　「閉上眼……好嗎？」
      　　
      　　沙啞的要求裡所隱藏的卑微，讓光在一瞬間感到異常，但不捨中斷這抹溫柔的她還是乖順地闔上雙眼，沉浸在熾熱而深情的氣息裡。
      　　
      　　而在她看不見的地方，古·拉哈·提亞緩緩抬起眼。
      　　
      　　面對少女才會顯露的溫柔瞬間退得乾乾淨淨，赤紅的眼眸驟然豎起成冰冷的獸瞳，帶著極其危險的敵意與警戒，直直刺向正邁步走過來的男人。
      　　
      　　愛梅特賽爾克雙手插在袍袖裡，腳步悠閒得像是在自家庭院散步。
      　　
      　　他金褐色的眼眸微微瞇起，看著那全身緊繃、死死護住懷中之人的紅髮貓魅，嘴角勾起一抹極其刺眼的嘲弄。
      　　
      　　古·拉哈·提亞搭在光後頸的手指微微用力，安撫般揉捏著她的肌膚，另一個手則緊緊環住她，將人禁錮在懷裡，半步都不肯退讓。
      　　
      　　愛梅特賽爾克連停頓都懶得，帶著一臉看好戲的冷嗤，故作輕鬆地自兩人身後擦肩而過。
      　　
      　　就在錯身而過的剎那，無影慵懶地抬起右手，指尖隨意地往上一挑──
      　　
      　　一件白紗織成的純白胸罩自半空中劃出一道弧線，輕飄飄地落在了兩人身旁的草地上。
