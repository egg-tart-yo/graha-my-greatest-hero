      　　古·拉哈·提亞遲疑了一會兒，才將門又推開了一些。
      　　
      　　他才剛從裡面走出來，光便伸手抓住了他的衣袖，像是怕他再次逃跑似的，怎麼也不肯鬆開。
      　　
      　　然而，紅眼看見水晶塔的階梯盡頭，那些聽見動靜、正逐漸聚集而來的人們，頓時又驚得瞪大了眼，再度轉身鑽回塔裡。
      　　
      　　「事情就是這樣。」
      　　
      　　回憶結束，光端起酒杯，一口氣喝了個乾淨。
      　　
