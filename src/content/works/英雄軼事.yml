      　　「所以我從那之後就決定，再也不玩這種遊戲。」
      　　
      　　她將杯子重重放回桌上，抬手揮了揮，然而海都的酒館裡，沒有人接話。
      　　
      　　光這才察覺到有些不對。
      　　
      　　剛才還滿臉好奇的酒客們，此刻神情都變得十分微妙。
      　　
      　　坐在她對面的人低下頭，假裝專心研究自己的酒杯，旁邊幾人則拚命壓著嘴角，肩膀一顫一顫的。
      　　
      　　有人悄悄抬起手，指了指她身後。
      　　
      　　光不明所以地回過頭，古·拉哈·提亞正站在她身後。
      　　
      　　他大概剛從港口那邊過來，手裡還拿著幾份整理好的資料，顯然是特地來接她回去的。
      　　
