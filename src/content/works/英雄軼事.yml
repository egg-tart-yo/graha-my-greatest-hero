  - title: 酒館篇
    body: |-
      　　位於葡萄酒港一隅的小酒館，今晚依舊生意興隆。其中鬧得最是歡騰的一桌，甚至還有艾奧澤亞的大英雄光顧。
      　　
      　　雖說是大英雄，但在這間酒館裡，人人都只是平等享用醇厚葡萄酒的客人，並不會因身份而刻意拉開距離。英雄本人也毫無架子地與眾人碰杯暢談、勾肩搭背，就像她仍是初出茅廬的冒險者時那樣平易近人。
      　　
      　　這裡的常客幾乎都對這樣的情景十分熟悉。也因此，即便英雄行跡踏遍天下，常常十天半個月都不見人影，他們也只會在酒桌上聽訪客分享「聽說英雄又解決了何處的困境」，將那些傳聞當作閒聊的話題，順便在在談話間炫耀一句：「我也認識艾奧澤亞的大英雄！」
      　　
      　　當英雄再度踏入酒館，熟稔地與所有人打招呼時，大夥兒也總能很快地又與她玩成一片。
      　　
      　　而不知從何時開始，英雄的身邊多了一名紅髮貓魅的身影。

      　　名為古·拉哈·提亞的青年並沒有英雄那樣的好酒量。每當有人拎著酒、笑鬧著起鬨要他一同碰杯時，總是會被微醺的英雄發現，先一步伸手接過遞來的酒杯。

      　　「這杯看起來不錯。」

      　　她說得隨意，仰頭便喝了一口，彷彿全然沒察覺那杯酒根本並不是遞給自己的，旁人被她這副理直氣壯的模樣逗笑，幾句打趣過後，也就順著她的意思鬧去了。

      　　次數多了，眾人漸漸也習以為常。只要那名紅髮貓魅被捲進敬酒的熱鬧裡，英雄手邊總會不知怎地多出一杯酒；而古·拉哈·提亞則會在短暫的怔愣後，露出有些無奈的笑意，隨即伸手接過老闆從旁遞來的果汁。

      　　儘管不擅飲酒，貓魅青年卻有一副好歌喉，也藏著滿腹英雄冒險途中的故事。起初，這些似乎都派不上什麼用場；可等酒酣耳熱、喧鬧漸歇，靜下來的人們便會不約而同地聚到他身邊，聽他撥動樂器，將英雄的事蹟化作詩歌低聲傳唱；又或是聽他用那溫和好聽的聲音，講述一段又一段唯有「同伴」才知曉的、引人入勝的經歷。

      　　夜深之後，英雄便會趴在木桌上，藏在散開髮絲間的紅撲撲臉頰被牆上的掛燈照得格外溫暖，一邊打著酒嗝，一邊含糊咕噥著「拉哈，你也講得太誇張了」之類細碎的抱怨。

      　　而這通常便是英雄快要醉倒的訊號。
      　　
      　　每到這時，古·拉哈·提亞總會在眾人意猶未盡的抱怨聲中站起身，一邊溫聲安撫那些正聽得入迷的人們，一邊扶起已經醉得站不太穩、開始胡言亂語的英雄。最後，他便會在酒館裡此起彼落的道別與笑鬧聲中，攙著她一同離開。

      　　起初，並沒有人特別在意這件事。

      　　英雄喝醉後的模樣實在稱不上安分，她有時會把半張臉埋進古·拉哈·提亞的肩窩裡，含糊不清地抱怨他說的故事內容與事實不符；有時則會抬著手、豪氣地拍著他的背，像是在鄭重其事地宣揚什麼，結果說出口的話前後全然對不上，而更多時候，她只是懶洋洋地把重量交給身旁那名紅髮貓魅，絲毫不為自己歪七扭八的姿勢負責，由著他無奈又小心地扶住自己。

      　　古·拉哈·提亞似乎也早已習慣了這些。

      　　他總會低聲回應那些含糊的抱怨，同時替她把滑落的披風重新攏好，也會在她差點撞上桌角時，及時伸手護住她的肩。那些動作自然得像是做過千百遍，連他自己都未必察覺其中藏著多少熟稔與親近。

      　　直到漸漸地，幾名同為貓魅族的逐日與護月之民，不約而同地發現了一個細微的習慣。

      　　每當古·拉哈·提亞扶住英雄時，他總會在極短的瞬間，無意識地往她身邊靠近一些。

      　　有時會在他扶住英雄的肩時，耳尖輕輕擦過她的髮側；有時是在替她調整衣著時，他會低下頭，額角幾乎蹭過她的鬢邊；有時則是在她趴在桌上睡著、被他喚醒時，會近乎本能地靠過去，用臉頰很輕、很輕地碰一下她的髮絲。

      　　那動作過於自然，十足像隻普通的貓下意識輕蹭過熟悉的人的模樣。

      　　可對貓魅一族而言，那樣的舉動終究有著不同的含義。

      　　某一日，英雄單獨造訪酒館時，幾名熟識的貓魅在彼此交換了好幾次眼神後，朝她發出了邀約。酒足飯飽後，其中一名貓魅男子終於忍不住向前傾身，壓低嗓音開口。

      　　「英雄，我們並不是想多管閒事。」

      　　他先是斟酌著語氣，像是怕自己說得太重，又怕說得太輕會讓她沒有意識到事情的重要性。

      　　「只是……你那位紅髮的同伴，扶你離開時，偶爾會有些很像貓魅伴侶間才會出現的動作。」

      　　英雄眨了眨眼，顯然一時沒有聽明白。

      　　另一名護月之民便接著開口補充。

      　　「他有時會用額角、臉頰，或耳側很輕地蹭過你。那在我們族裡，通常是把自己的氣味留在對方身上的舉動。」

      　　「一般來說，這種事多半只會發生在伴侶之間。」最先開口的貓魅男子有些尷尬地抓了抓耳後，「畢竟那算是相當明顯的佔有訊號。」

      　　眼見英雄臉上的神情變得有些微妙，幾名貓魅連忙接續著解釋。

      　　「我們知道你們關係很好，也知道那孩子看起來不是有意的。」

      　　「對，那看起來完全不像是刻意讓其他人看見。」

      　　「可你身上有時候確實會帶著他的氣味，如果你自己沒有發現，其他貓魅可能會誤會你們的關係。」

      　　說到這裡，其中一人停頓片刻，神情反而多了幾分認真。

      　　「所以我們才想先問問你。若你並不知情，也不希望旁人誤會，我們可以找個不傷人的方式提醒他。那孩子看起來很重視你，應該不是會故意讓你為難的人。」

      　　他們說得小心，並沒有指責的意思，更多的是一種同族才明白的擔憂。畢竟在他們看來，那名紅髮貓魅的舉動看似毫無自覺，又太容易被旁人解讀成另一種更親密的宣告。

      　　而英雄只是沉默了片刻。

      　　她垂著眼，指尖慢慢摩挲著杯沿。酒精讓她的臉頰泛著一層淡淡的紅，眼神比平日柔軟許多，連眨眼的動作都顯得有些遲緩。
      　　
      　　而後，她突然低低地笑了一聲，下一刻，英雄抬起眼來，原本像是被酒意浸軟的目光裡，突然清明得沒有半分迷糊。

      　　幾名貓魅頓時一怔。

      　　「他不知道自己在做什麼，這點我知道。」

      　　英雄慢慢將杯子放回桌上，語氣仍舊懶散，唇邊卻帶著一點幾乎稱得上狡黠的笑意。

      　　「所以，大家都別告訴他，好嗎？」

      　　她說得輕快，彷彿他們談論的只是今晚的酒香與天氣，可那雙清醒得毫無醉意的眼睛裡，卻以極快的速度輪流凝視過酒桌對面的每一個人。

      　　幾名貓魅青年面面相覷，隨後不約而同地點頭如搗蒜。

      　　英雄這才滿意地彎起眼，將一閃而過的壓迫感盡數收起，隨後，她重新拿起酒杯，用力碰了下眾人的杯緣。
  - title: 告白篇
    body: |-
      　　海都的夜晚總是熱鬧。
      　　
      　　潮濕的海風捲著酒香，自窗外灌進店裡，吹得燭火微微搖晃。酒館裡擠滿了結束一天工作的人，杯盞碰撞聲、笑語與吟遊詩人的琴聲混在一起，吵得幾乎聽不清彼此說話。
      　　
      　　光剛結束一趟委託，連身上的裝備都沒來得及換，便被幾名相熟的冒險者拉進了酒館。
      　　
      　　她大剌剌地往桌邊一坐，接過遞來的酒杯，一口便喝掉大半。正要伸手再添一杯，坐在對面的酒客忽然拍了拍桌子。
      　　
      　　「只是喝酒多沒意思，不如來玩真心話大冒險吧！」
      　　
      　　周圍頓時響起一陣讚同聲，光握著酒杯的手卻停在半空。
      　　
      　　她沉默片刻，忽然打了個寒顫，像是想起了什麼不好的回憶。
      　　
      　　「不要。」
      　　
      　　然後毫不留情地拒絕。
      　　
      　　提出遊戲的酒客愣了一下，隨即笑道：「怎麼？堂堂英雄還怕這種遊戲？」
      　　
      　　「不是怕。」光一臉嚴肅地放下酒杯，「只是這個遊戲……我有不太好的回憶。」
      　　
      　　這下子，整桌人的興致都被勾了起來。
      　　
      　　「難道是被逼著做了什麼可怕的大冒險？」
      　　
      　　「總不會比討伐蠻神還可怕吧？」
      　　
      　　眾人七嘴八舌地追問，連隔壁桌的幾名海盜都悄悄湊近了一些。
      　　
      　　光警惕地環顧四周，然而所有人都一臉期待地看著她，顯然不打算輕易放過這個話題。
      　　
      　　見自己逃不過這一劫，光只好長長嘆了一口氣。
      　　
      　　「那是在第一……在其他地方發生的事。」
      　　
      　　她伸手拿起酒壺，默默替自己倒滿一杯，緩緩地說道。
      　　
      　　那一晚的忘憂騎士亭，同樣熱鬧得很。
      　　
      　　眾人在外奔波許久，好不容易才得空聚在一起喝酒。桌上的酒瓶東倒西歪，阿莉塞因為年紀問題只分到了一杯果汁，正臭著臉瞪向替她做主的桑克瑞德。
      　　
      　　酒酣耳熱間，也不知是誰先提起了真心話大冒險。
      　　
      　　起初，光並沒有把這件事放在心上，畢竟只是普通的酒桌遊戲。
      　　
      　　琳被問到第一次見到光時的想法，紅著臉說她覺得傳說中的英雄比想像中還要親切；阿莉塞抽到大冒險，被迫站在椅子上大聲稱讚阿爾菲諾三句，最後咬牙切齒地只擠出一句「他至少還算是個好哥哥」。
      　　
      　　至於桑克瑞德，則在雅·修朵拉的微笑注視下，選擇交代了幾件年輕時不太光彩的往事。
      　　
      　　一時間，忘憂騎士亭裡充滿了笑聲，光也笑得毫無防備，直到桌上的瓶口晃晃悠悠地轉過半圈，最後不偏不倚，正對著她停了下來。
      　　
      　　桑克瑞德吹了聲口哨。
      　　
      　　「看來終於輪到我們的英雄了。」
      　　
      　　光挺直腰背，神情肅然，宛如即將面對某位強敵。
      　　
      　　「說吧。」
      　　
      　　桑克瑞德晃著杯裡的酒，笑得十分不懷好意。
      　　
      　　「不過仔細想想，妳平日裡經歷的大冒險還不夠多嗎？連拯救世界都做了不只一次，再讓妳去做什麼冒險，似乎也沒什麼意思。」
      　　
      　　「嗯……」
      　　
      　　光偏著頭，認真想了想。
      　　
      　　好像確實很有道理。
      　　
      　　和她平日遇上的事相比，什麼繞著酒館跑三圈、站到桌上唱歌，根本稱不上大冒險。
      　　
      　　於是，她爽快地一拍桌子。
      　　
      　　「那我選真心話。」
      　　
      　　話音落下的瞬間，桌邊安靜了一下。
      　　
      　　雅·修朵拉托著酒杯，似笑非笑地看著她。
      　　
      　　「那麼，就說一件妳一直藏在心裡的事吧。」
      　　
      　　「藏在心裡的事？」
      　　
      　　「而且，得是沒人知道的事。」
      　　
      　　光呆呆地眨了眨眼。
      　　
      　　現在想想，那天她大概真的喝得有點多，也可能是酒館裡的氣氛太過放鬆，身旁又都是熟識的夥伴，讓人不知不覺便卸下了所有防備。
      　　
      　　她甚至沒有思考太久，只是在腦海裡浮現那道熟悉的身影時，理所當然地張開了嘴。
      　　
      　　「古·拉哈·提亞，我喜歡你！」
      　　
      　　聲音洪亮，氣勢十足。
      　　
      　　別說忘憂騎士亭，就連隔壁桌正在猜拳的士兵都停下了動作。
      　　
      　　整間酒館陷入一片詭異的寂靜。
      　　
      　　至於水晶都的眾人，不知城主真名者皆投來好奇的目光，知曉內情之人，則各自露出了截然不同的反應。
      　　
      　　而坐在光身旁的桑克瑞德，在短暫的呆滯後，猛地一口酒噴了出去。
      　　
      　　「咳、咳咳！」
      　　
      　　尤里安傑似乎預料到了什麼，伸手想要遮住阿莉塞的耳朵，卻顯然已經來不及了。
      　　
      　　阿莉塞睜大眼睛，整張臉迅速漲紅。
      　　
      　　「妳、妳突然在說什麼啊！」
      　　
      　　「哎呀。」
      　　
      　　相較之下，雅·修朵拉倒是全場最為鎮定的人，她將酒杯放回桌上，笑得意味深長。
      　　
      　　「還真的說出來了。」
      　　
      　　琳坐在一旁，看著呆滯的阿爾菲諾，眨了眨眼，又轉頭看向酒館的另一側。
      　　
      　　「原來英雄對水晶公，是這種感情啊。」
      　　
      　　光順著她的視線回過頭。
      　　
      　　只見另一張桌旁，原本正端著酒杯的水晶公，整個人僵在了原地。
      　　
      　　他的兜帽早已摘下，那張一向溫和的面容此刻卻顯得格外僵硬，紅色的雙眼微微睜大，就連直直豎起的耳尖也以肉眼可見的速度泛起了紅。
      　　
      　　他緩緩抬眼，與光對上視線。
      　　
      　　下一刻，水晶公默默拉起衣袍的兜帽，重新罩回頭上，他的動作緩慢而鎮定，只有微微發顫的指尖出賣了他。
      　　
      　　「公？」
      　　
      　　一旁的居民疑惑地喊了一聲，水晶公卻沒有回答。
      　　
      　　他站起身，頭垂得極低，隨後轉身便走，披風在身後揚起一道乾脆的弧線。
      　　
      　　「拉哈？」
      　　
      　　光愣了愣，一時沒反應過來。
      　　
      　　她直到那道身影徹底消失在門外，才猛然回過神來。
      　　
      　　「拉哈！」
      　　
      　　她推開椅子追出去時，身後頓時響起一片壓抑不住的笑聲與感嘆，然而光已經顧不了這一邊了。
      　　
      　　水晶公一路越過人們好奇的眼神，直接逃回了水晶塔。
      　　
      　　光追到塔前時，只來得及看見那扇沉重的大門在自己眼前關上。
      　　
      　　「拉哈！」
      　　
      　　她用力敲了幾下門，塔內卻沒有任何回應。
      　　
      　　光在門前等了一會兒，又試著喊了幾聲，裡面仍舊安靜得像是根本沒有人存在。
      　　
      　　方才被酒意壓住的羞恥感終於慢慢湧了上來。
      　　
      　　她後知後覺地意識到，自己究竟當著多少人的面，喊出了多麼不得了的一句話。
      　　
      　　可比起難為情，自己可是真心誠意地表露心意，水晶公卻頭也不回地逃走，才更讓她覺得委屈。
      　　
      　　「不就是說了喜歡你嗎……」光蹲在塔門前，抱住膝蓋，小聲嘟囔：「有必要跑得這麼快嗎？」
      　　
      　　她越想越難過，眼眶漸漸發酸。
      　　
      　　「就算不喜歡我，也可以直接說啊……」
      　　
      　　話才說完，眼淚便啪嗒一聲掉了下來。
      　　
      　　光抬手擦了擦，卻怎麼也擦不乾淨，十足委屈的她最後乾脆把臉埋進膝間，大聲地哭了起來。
      　　
      　　哭聲響起沒多久，裡頭便傳來一陣陣物品掉落的巨響，彷彿有人正為了開門，手忙腳亂地奔來。
      　　
      　　緊閉的塔門悄悄開了一條縫，一雙紅得幾乎藏不住的耳朵先從門後露了出來。
      　　
      　　古·拉哈·提亞探出小半張同樣泛紅的臉，小心翼翼地看向蹲在門外的光。
      　　
