  - title: 主篇
    body: |-
      　　事情發生在拂曉的一次小型聚會上。

      　　眾人難得同時結束手邊的工作，便將平時用來堆放資料的長桌勉強清出一角，轉而堆滿各式香氣四溢的食物，桑克瑞德甚至不知從哪裡找來幾瓶珍奇的酒，阿莉塞一邊抱怨他教壞年輕人，自己卻在試喝後，避開尤里安傑的目光，若無其事地多倒了半杯。

      　　古·拉哈·提亞原本並沒有喝酒的打算。

      　　他坐在光身邊，手裡捧著一杯顏色漂亮的果汁，正興致勃勃地說起近期的委託，紅色長尾在椅背後輕輕擺動，兩隻耳朵精神地豎著，顯然心情很好。

      　　直到他從別人手中接過一杯散發著水果香氣的飲料。

      　　而當時的他們哪裡知道，那杯酒的後勁會比入口時強上那麼多。

      　　半個小時後，古·拉哈·提亞便抱著光的手臂，尾巴牢牢纏在他的腰間，怎麼都不肯鬆開。

      　　光低頭看了看黏在自己身上的紅髮貓魅，又抬頭環視眾人，藍色的眼睛瞬間沉了下來。

      　　「誰讓他喝醉的？」

      　　桑克瑞德迅速看向阿莉塞，少女立刻瞪了回去。
      　　
      　　尤里安傑偏了偏頭，跟阿爾菲諾一齊查看酒瓶上的說明。

      　　可露兒輕咳一聲，小心翼翼地舉起手。

      　　「我以為那是果汁。」

      　　光沉默片刻，又低頭看向懷裡的人。

      　　古·拉哈·提亞正靠著他的肩，整個人像是失去了骨頭，軟綿綿地貼在他身上，兩隻耳朵慵懶地垂著，耳尖隨呼吸輕輕顫動，臉頰也暈起大片的紅，連平日總是活潑晃動的長尾，此刻都只是鬆鬆地纏在光腰間，尾巴尖不時蹭過他的衣料。

      　　察覺到光的視線後，他費了些力氣才抬起頭。

      　　紅色眼眸蒙著一層朦朧水光，眼神也失去了平日的清明，像隔著一層溫熱的霧氣。

      　　「光，你在生氣嗎？」

      　　「有一點。」

      　　古·拉哈·提亞立刻露出驚慌的神色，原本軟垂的耳朵也勉強豎了一下，尾巴更在光腰間收緊。

      　　「為什麼？」

      　　他的聲音因醉意而斷斷續續，聲調也比平時軟上許多，話與話的中間甚至還夾雜著輕微的酒嗝。

      　　光伸手摸了摸他發燙的額頭，神情有些無奈。

      　　「沒想到會醉成這樣。」

      　　古·拉哈·提亞怔怔地看著他。

      　　大概是醉得太厲害，他花了很長的時間才理解這句話的意思。片刻後，他忽然笑了起來。

      　　那笑容比平時更柔軟，也毫無防備，連眼尾都愉快地彎了起來。

      　　「你在擔心我。」

      　　「嗯。」

      　　「真好。」

      　　他像是得到了什麼不得了的回答，心滿意足地重新把臉埋進光的肩窩，紅色腦袋在那裡蹭了蹭，找到最舒服的位置後，整個人便放鬆下來，幾乎將全身的重量都交給了光。

      　　光只好伸手攬住他的腰，避免這隻醉得軟成一團的貓魅從椅子上滑下去。

      　　阿莉塞則看得眉頭深鎖。

      　　「他喝醉以後一直都是這樣嗎？」

      　　「我不知道。」光說，「我沒看過他喝醉。」

      　　「那現在怎麼辦？」

      　　光思考片刻，手掌在古·拉哈·提亞背後輕輕拍了兩下。

      　　「先帶他回房間。」

      　　「不要。」

      　　原本安靜靠在他身上的人忽然開口。

      　　光低頭看他。

      　　古·拉哈·提亞不知何時又睜開了眼，雙臂抱得更緊，神情十分認真。只是那副嚴肅模樣與他通紅的臉頰、軟垂的耳朵實在不太相稱，看起來更像一團努力表達抗議的紅色毛球。

      　　「不可以走。」

      　　他打了個嗝，態度卻很堅定。

      　　「一旦走了，我怕你就不會回來了。」

      　　話音落下，周圍的氣氛突然靜了許多。

      　　古·拉哈·提亞沒有發現眾人的面面相覷，只是伸長了手，扯了扯光的手臂，直到那隻手落在自己頭頂，才安心地用耳朵蹭了蹭他的掌心。

      　　「你一定不曉得那是什麼感受……」

      　　聲音悶在光的肩上。

      　　「我睜開眼睛以後，知道你已經不在了，第一件事就是尋找你的蹤跡。」
      　　
      　　他的手指慢慢抓緊光的衣袖。
      　　
      　　「我順著人們的口耳傳唱，踏上旅途……到英雄曾留下故事的地方，想像那時候的你究竟歷經了什麼……」

      　　古·拉哈·提亞一邊說，身體一邊無止盡地往下滑，光只好伸手托住他的腰，將人往懷裡撈了一些。

      　　紅髮貓魅順勢縮起雙腿，側身窩進光胸前，腦袋枕在他的手臂上，尾巴則從腰間滑落，鬆鬆圈住兩人的腿。

      　　他將自己團成了很小的一球，為了能整個藏進光懷裡，試圖尋找一絲安全感。

      　　「後來在水晶都，我也只能在觀星室偷看你的每一次旅行……好幾次都驚險到以為你回不來了。」

      　　光的手臂微微收緊。

      　　「你都看著？」

      　　古·拉哈·提亞點了點頭，柔軟的髮絲擦過光的下巴。

      　　「你掉下懸崖的時候、被食罪靈包圍的時候。」

      　　「還有一次，你明明已經受了傷，回來還騙我什麼事都沒有。」

      　　他說到這裡，帶著醉意不滿地抬起頭，伸手戳了戳光的胸口。

      　　「明明流了好多血，卻不想讓我知道，自己偷偷躲起來治療。」

      　　「每次這樣，我都很害怕。」

      　　他的語氣忽然又軟了下去。

      　　「只要站在廣場送你們出發，我都好害怕那是最後一次見面，害怕我又來不及做些什麼，就又再失去你們。」

      　　周圍安靜得只能聽見燈火燃燒的聲音。

      　　其他人彼此交換了眼神。

      　　桑克瑞德率先站起身，朝門口偏了偏頭，阿莉塞咬了咬唇，還有些不放心，最後是被哥哥一路拖了出去。

      　　可露兒離開前，歉疚地看了古·拉哈·提亞一眼，又朝光做了個拜託的手勢。

      　　門被悄悄闔上，大廳裡只剩下他們兩人。

      　　古·拉哈·提亞並未察覺其他人的離去。

      　　他仍蜷在光懷裡，額頭抵著他的胸口，像是累得連抬頭的力氣都沒有，卻還固執地抓著他的衣服。
      　　
      　　光忍不住伸出手，輕輕覆上那緊握的拳頭。
      　　
      　　「但你在等我，我就會回來。」他輕聲道：「我有哪一次食言過嗎？」

      　　古·拉哈·提亞反應遲緩地想了一會兒，難得認同地點了點頭。

      　　「好像也是。」

      　　光無奈地笑了笑。

      　　古·拉哈·提亞看見了，便也跟著笑起來，他重新貼回光身邊，臉頰在他胸前蹭了兩下，喉間慢慢發出細微的呼嚕聲。

      　　那聲音很輕，像是藏在胸腔深處，感到安心才會發出的聲響。

      　　「那些等待的時日真的很難熬。」

      　　他含糊地繼續說道。

      　　「每次我都想著，你回來以後，會再呼喚我的名字。」

      　　「只有這樣，才能慢慢撐過來。」

      　　光的手指輕輕順著他的耳朵。

      　　「你的名字？」

      　　「『古·拉哈·提亞』。」

      　　懷裡的紅色腦袋用力地點了幾下。

      　　「這個名字，第一世界沒有人知道。」

      　　「雖然我也很喜歡水晶公這個稱呼，那是大家給我的信任，我一直很珍惜。」

      　　他停頓片刻。

      　　「可是有時候，還是會覺得自己像迷路了一樣……走得太遠，活得太久，一開始陪在身邊的人都不在了，連世界也變得不一樣。」

      　　「久到我都快忘記自己是從哪裡來的。」

      　　古·拉哈·提亞抬起臉。

      　　「只有你知道這個名字，也是只有你會呼喚的名字。」

      　　光看著他。

      　　「古·拉哈·提亞。」

      　　紅色耳朵驀地顫了一下，他的眼睛隨後亮了起來。

      　　「再一次。」

      　　「拉哈。」

      　　他露出傻乎乎的微笑，尾巴重新纏上光的腰，收得緊緊的。

      　　「你一定不曉得，每次你這樣叫我，我有多高興，高興得都快被淹沒。」

      　　他的聲音不大，卻十分明亮。

      　　「只要你一開口，我就會想起來，我是水晶公，也是古·拉哈·提亞。」

      　　「是曾經跟你一起走進水晶塔，還約好未來要一起去冒險的那個人。」

      　　光閉了閉眼。

      　　他低下頭，唇輕輕碰了一下古·拉哈·提亞的髮頂。

      　　「如果你願意的話，我會一直這麼叫下去。」

      　　古·拉哈·提亞慢慢抬起頭。

      　　「一直？」

      　　「嗯。」

      　　「明天……後天……還有很多年？」

      　　光伸手捧住他發熱的臉。

      　　「只要你願意。」

      　　「那就這麼說好了。」

      　　古·拉哈·提亞幾乎沒有思考。

      　　「無論你在哪裡叫我，我都會回答。」

      　　光看著他，認真地點點頭，眼神慢慢軟了下來。

      　　古·拉哈·提亞彎起眼睛。

      　　「怎麼這麼好。」

      　　他重新縮回光懷裡，滿足地抱住他的腰，軟綿綿的耳朵貼著光胸前，將自己塞進那片溫暖裡。

      　　「你再對我這麼好，我會越來越貪心的。」

      　　「怎麼樣的貪心？」

      　　古·拉哈·提亞安靜了一會兒，似乎在思考，又像只是醉得反應不過來。

      　　他過了很久，才很誠實地說道：「例如，我曾偷偷收藏過你的衣服。」

      　　光撫摸他的手停住了。

      　　「……衣服？」

      　　「你放在公館的行李。」

      　　古·拉哈·提亞的聲音裡帶著毫無防備的愉快。

      　　「我趁僱員不注意，悄悄取來的。」

      　　「哪一件？」

      　　「破掉的那件黑色斗篷。」

      　　「本來要送去縫補的？」

      　　「嗯。」

      　　光沉默片刻。

      　　「所以一直沒有送回來，是因為你拿走了？」

      　　紅色腦袋在他懷裡點了點。

      　　貓魅縮得更緊，雙腿蜷著，尾巴也將自己與光圈在一起，喉間發出呼嚕嚕的聲音，看起來似乎完全沒意識到自己正在坦承什麼，而是在分享一件藏了很久、如今終於能拿出來炫耀的寶物。

      　　「那上面有你的味道，我有時候會把它放在身邊……你不在的時候，還摸得到。」

      　　他停了一下，臉頰貼著光的胸口，緩慢地蹭了蹭。

      　　光原本想問他究竟還收藏過多少東西，一時間張了張口，卻什麼也沒再問。

      　　他低頭看著古·拉哈·提亞。

      　　懷裡的人已經快睜不開眼了，卻仍在努力說話。

      　　「我知道自己有一點奇怪。」

      　　「……我是希望你至少能跟我說一聲。」

      　　「可是我很喜歡。」

      　　「喜歡衣服？」

      　　古·拉哈·提亞皺起眉，似乎對這個理解十分不滿。

      　　他努力撐起身體，湊到光面前，一字一句地糾正。

      　　「喜歡你。」

      　　光安靜了下來。

      　　古·拉哈·提亞說完，便像完成了什麼重要任務，重新倒回他懷裡。

      　　「很喜歡。」

      　　他的聲音越來越低。

      　　「超級喜歡，喜歡到不曉得該怎麼辦才好。」
      　　
      　　古·拉哈·提亞半睜著眼，聲音已然迷迷糊糊，光低下頭，將他額前散亂的紅髮撥開。
      　　
      　　「累了就睡吧。」
      　　
      　　「你有聽清楚嗎……我剛剛說的……」
      　　
      　　「有。」

      　　聞言，古·拉哈·提亞終於徹底放鬆下來。

      　　他抱著光的腰，含糊地說了幾句什麼，聲音實在太輕，光只勉強聽見自己的名字，以及一聲滿足的「真好」。

      　　沒過多久，他的呼吸便逐漸變得平穩。

      　　光低頭看著懷裡熟睡的人。

      　　古·拉哈·提亞已經完全縮成了一團，柔軟的紅髮散在光胸前，耳朵毫無戒心地垂著，尾巴依然牢牢圈在他的腰間。

      　　但即使睡著了，他的手仍緊緊抓著光的衣服。

      　　光低下頭，在那隻發紅的耳尖旁輕聲叫了一次。

      　　「拉哈。」

      　　熟睡中的貓魅耳朵微微一顫。

      　　抓衣服的手，便慢慢放鬆了一些。

      　　光看了他片刻，手臂穿過他的膝彎與後背，將那個難得坦承的人抱了起來。

      　　古·拉哈·提亞在睡夢中晃了晃，下意識往他懷裡縮得更深，臉埋進頸側，發出一聲模糊的輕哼。

      　　光抱穩那團溫熱柔軟的重量，朝房門走去。
  - title: 番外
    body: |-
      　　古·拉哈·提亞醒來時，天已經亮了。

      　　晨光穿過窗簾的縫隙，落在房間的地面，將昨夜尚未完全散去的昏暗切成一道道淺金色的光影。

      　　但此刻的貓魅卻無意欣賞晨曦，他睜著眼睛，僵硬地躺在床上。

      　　頭還有些沉，喉嚨也乾得發緊，可真正讓他一動也不敢動的，並不是宿醉帶來的不適，而是甦醒後，排山倒海湧上的記憶。

      　　昨夜說過的每一句話，做過的每一件事，都無比清晰地留在腦海裡。

      　　他記得自己抱著光不肯鬆手，也記得那些漫長等待裡的思念與不安，是如何在酒意的催促下一股腦地傾倒出來。
      　　
      　　他甚至還把斗篷的事情給說了出來。
      　　
      　　甚至、甚至還說了喜歡，說了很多次。

      　　古·拉哈·提亞緩慢地抬起手，蓋住了臉，從耳根開始發著燙。

      　　每回想起一段記憶，他的耳朵便往下壓低一些，到了最後，整個人幾乎都要縮進床鋪裡，恨不得就此消失在被褥之間。
      　　
      　　他甚至逃避似地試圖說服自己，那只是一場夢，是喝得太多，才產生了過於真實的幻覺。

      　　然而當他悄悄睜開一隻眼，便看見不遠處的牆邊，正坐著一個他現在最不敢面對的人。

      　　光抱著雙臂，背靠牆面，像是就這樣坐著守了一夜，他的眼睛閉著，胸口平穩地起伏，似乎還沒有醒來。

      　　古·拉哈·提亞一瞬間屏住了呼吸。
      　　
      　　光墨色的貼身衣服佈滿些許明顯的的紅色髮絲，顯然昨夜自己賴在英雄身上的記憶，並不僅是場夢。

      　　隨即，一個極為不光彩的念頭浮上心頭。

      　　逃走。

      　　至少先離開這個房間，找個沒有人的角落冷靜下來。至於之後該怎麼面對光，可以等他整理好情緒再慢慢思考。

      　　想不如說，說不如做。
      　　
      　　古·拉哈·提亞小心翼翼地撐起身體，這才發現身上的衣服已經被換成柔軟的睡衣，連平時頭髮上的黑夾與編起的辮子都被好好放了下來，靴子也整齊收在床邊，顯然昨晚有人仔細照顧過他。

      　　他完全不敢再想下去。

      　　古·拉哈·提亞伸手抓住被子，將自己從頭到腳牢牢裹住，只露出一雙耳朵與幾縷紅色髮絲，隨後迅速挪下床。

      　　腳掌踩到地面時，身軀因宿醉輕輕晃了一下，他立刻扶住床沿，轉頭看向牆邊。

      　　光仍舊沒有動靜。

      　　古·拉哈·提亞鬆了口氣。

      　　他拖著被子，一步一步朝門口移動，尾巴藏在被褥底下，緊張得繃得筆直。

      　　但在手已經碰上了門把時，身後卻傳來一道帶著些許笑意的聲音。

      　　「你想去哪裡？」

