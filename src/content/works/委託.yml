  - body: |-
      　　冒險者行會的一角，四個人正圍著桌子坐下。
      　　
      　　坐在對面的委託人一共有兩名，一名是看起來年紀尚輕的家僕，神情緊張，從坐下開始便不時偷瞄門口，另一名則是頭髮花白的老管家，拄著手杖，先是低低咳了兩聲，才鄭重其事地開口。
      　　
      　　「事情是這樣的……我們家的小姐，數日前遭人迷昏綁架，如今被囚禁在城外的一座高塔之中，至於地點請看地圖上的標示……」
      　　
      　　他說到一半，視線卻慢慢飄到了光的身上──準確來說，是飄到了光身上那套圓滾滾、毛茸茸，怎麼看都和「艾奧傑亞的大英雄」扯不上關係的布偶裝上。
      　　
      　　老管家的眉頭毫不掩飾地皺了起來，年輕家僕也一臉困惑，兩人臉上的表情已然寫盡了他們所有的懷疑。
      　　
      　　光忍不住在頭套下翻了個白眼。
      　　
      　　這兩人根本不明白，這身裝束可是他連續兩次打敗巨蛇的戰利品，一般人想穿還沒有呢。
      　　
      　　他稍稍側過身，壓低聲音對身旁的古·拉哈·提亞抱怨。
      　　
      　　「你也不先提醒我今天要見委託人。」
      　　
      　　要是早知道，他好歹會換一套稍微像英雄一點的衣服。
      　　
      　　笑得溫和的古·拉哈·提亞倒是一臉可靠，坐得端端正正，認真向兩名委託人保證。
      　　
      　　「請放心，他的確就是你們所知道的那名英雄，實力更是毋庸置疑，我可以擔保。」
      　　
      　　老管家與家僕面面相覷，兩人的視線再次落到那顆毛茸茸的布偶腦袋上，顯然並沒有因為貓魅的話而感到放心。
      　　
      　　光托著腮，心想既然這麼懷疑，那這任務乾脆別接算了。但或許是真的走投無路，儘管眉頭緊蹙，老管家還是勉強把話接了下去。
      　　
      　　「只是，那座高塔的情況實在危險，根據情報，小姐還中了不明的迷藥，至今昏睡不醒……兩位真的有把握將她救出來嗎？」
      　　
      　　「喔。」光懶洋洋地應了一聲，「從高塔裡救沉睡的人啊。」
      　　
      　　他換了個姿勢，語氣十分自然。
      　　
      　　「這我很有經驗。」
      　　
      　　「您有經驗？」年輕家僕顧不得禮節，詫異地驚呼。
      　　
      　　「當然。」
      　　
      　　光自信滿滿地點了點頭。
      　　
      　　「我不只打退過高塔裡的魔物，也曾經進過一座非常麻煩、充滿機關的塔，把裡面睡了很久的人叫醒。」
      　　
      　　古·拉哈·提亞原本還在點頭，點到一半，動作忽然停了下來。
      　　
      　　他緩緩轉頭，看向光……布偶裝的眼睛。
      　　
      　　光完全沒注意到他的表情，只見兩名委託人似乎還是一副半信半疑的模樣，便索性開始詳細舉例。
      　　
      　　「塔的機關不是問題，我也可以召集其他冒險者一同協助，無論是魔物或守衛都不成威脅。至於你們家小姐如果叫不醒……我是有辦法，但可能比較粗暴。」
      　　
      　　古·拉哈·提亞的耳朵漸漸紅了起來，他垂在桌下的手臂暗自拍了光幾下，一邊低聲提醒。
      　　
      　　「光。」
      　　
      　　「之前叫不醒的人，我把他翻來覆去檢查了好幾遍，捏鼻子測呼吸、摸胸口測心跳──」
      　　
      　　「等等。」
      　　
      　　「本來想把人直接扛出去，但想想他可能會感到混亂，我單獨跟他解釋可能比較好──」
      　　
      　　「光，這部分其實不用──」
      　　
      　　「最後沒辦法，乾脆親下去，人才終於醒了。」
      　　
      　　空氣瞬間靜了下來。
      　　
      　　古·拉哈·提亞整張臉一路紅到了耳根，他猛地伸手摀住光的嘴，對兩位更為疑惑的委託人用力垂下了頭。
      　　
      　　「總、總之！」古·拉哈·提亞幾乎是咬著字開口，努力維持住最後一點可靠冒險者的形象，「我們確實有處理高塔救援的經驗，也一定能完成委託，請兩位放心。」
      　　
      　　「唔唔唔──」
      　　
      　　被摀著嘴的光還想補充什麼，古·拉哈·提亞急忙併緊了手掌。
      　　
      　　兩名委託人困惑地面面相覷，半晌，老管家遲疑地問：「……所以，根據這位……英雄的判斷，救出小姐之後，也需要用那個方法喚醒她嗎？」
      　　
      　　「不需要！」
      　　
      　　古·拉哈·提亞終於發出崩潰的喊叫。
