      　　兩個過於熟悉的人從夥伴變成戀人，究竟會有什麼改變？
      　　
      　　光完全沒有概念。
      　　
      　　經過一場意外後，他們總算確認了彼此的心意。古·拉哈·提亞說喜歡他的時候，耳朵壓得幾乎要藏進頭髮裡，光回答「我也是」時，也沒比他鎮定多少。
      　　
      　　然後呢？
      　　
      　　他們還是一起吃飯、一起出門，古·拉哈·提亞依然會在光講起下一趟冒險時，眼睛亮晶晶地湊過來。光也依然會在路過點心攤時，多留意一份貓魅喜歡的食物。
      　　
      　　一切似乎跟以前沒什麼不同。
      　　
      　　所以，戀人間究竟該做些什麼？
      　　
      　　兩人面面相覷、毫無經驗，卻默契十足地不打算和拂曉其他人討論這個問題──畢竟先不提大家的經驗可能無法參考，其中還可能混雜一些稀奇古怪或不懷好意的意見。
      　　
      　　「還是腳踏實地一點。」古·拉哈·提亞鄭重地捧著一本厚書，小心翼翼地翻開封面，「這是我從書庫借來的。」
      　　
      　　光看了一眼書名，又看了一眼古·拉哈·提亞認真的表情，默默搬著椅子靠過去。兩人的腦袋湊在一起，就著書桌上的燈光，逐行讀起書上的文字。
      　　
      　　「第一項，安排專屬於彼此的相處時間。」古·拉哈·提亞念道。
      　　
      　　光想了想，偏頭提出疑問：「我們不是一直在一起嗎？」
      　　
      　　「也是。」
      　　
      　　古·拉哈·提亞抬起頭，眼睛比燈火還明亮，「反正你以後去冒險，也都會帶著我，對吧？」
      　　
      　　光毫不猶豫地點頭。
      　　
      　　「好。」古·拉哈·提亞滿意地在那一頁夾進書籤，「這項沒問題。」
      　　
      　　光也覺得他們的研究進展順利。
      　　
      　　「第二項，坦承且深入的溝通……」
      　　
      　　「這點我倒覺得不需要。」光托著腮看他，「你脫下兜帽以後，在想什麼都很好懂。」
      　　
      　　古·拉哈·提亞的耳朵輕輕一抖，神情有些難以置信。
      　　
      　　「有、有這麼明顯嗎？」
      　　
      　　「有，像你現在就在想，我是不是真的看得出來。」
      　　
      　　「唔……」古·拉哈·提亞把目光放回書頁，翻得有些急，「那、那看下一項。」
      　　
      　　「保留各自的獨立空間。」
      　　
      　　兩人面面相覷，又一起回頭看向身後的床鋪。
      　　
      　　兩份被子，兩份枕頭，床邊堆著光各式各樣的裝備，古·拉哈·提亞的書則疊在另一側；桌上的杯子並排放著，連光冒險常套著的斗篷，都掛在古·拉哈·提亞的椅背上。
      　　
      　　兩人收回視線，默默地喃喃：「下一項吧。」
      　　
      　　「嗯。」
      　　
      　　紙張摩擦的聲音傳來，誰也沒提要把東西搬走。
      　　
      　　書上接著寫，戀人應當維持親密的互動。
      　　
      　　「互動？」光問，「例如什麼？」
      　　
      　　古·拉哈·提亞往下讀了幾行，聲音漸漸小了，「呃……可能就是，親親、抱抱之類的……」
      　　
      　　他們同時移開目光。
      　　
      　　方才還能理直氣壯討論同床共枕，這會兒卻連看對方一眼都變得困難。光盯著桌角，古·拉哈·提亞盯著書頁，紙上的字半晌也沒再往下讀一行。
      　　
      　　「不然，」古·拉哈·提亞清了清嗓子，像是在替兩人打氣，「先從簡單的肢體接觸開始？」
      　　
      　　「碰拳？」
      　　
      　　古·拉哈·提亞的耳朵扁了又扁，「那是跟夥伴才這麼做。」
      　　
      　　他放下書，慢慢伸出掌心，在光的面前停了下來。
      　　
      　　光的眼神聚焦在那微微發顫的掌心上，也跟著做出了動作。
      　　
      　　兩人的指尖輕輕碰上，接著手掌貼合。古·拉哈·提亞的手比他小一點，卻暖上不少，指節小心地朝每一個對應的指縫收攏，握住他時微微使了點力。
      　　
      　　是個很簡單、卻很陌生的初次牽手。
      　　
      　　古·拉哈·提亞抬起眼時，光忽然忘了自己原本想說什麼。那雙紅色的眼睛正望著他，裡頭映著燈光，也映著他的身影，還映著許多流轉的情緒。兩人的手仍握在一起，誰都沒有先鬆開。
      　　
      　　古·拉哈·提亞的臉越來越紅。
      　　
      　　沒過多久，他像觸電似的抽回手，兩手匆匆放回腿間，膝蓋也緊緊併在一起。
      　　
      　　光眨了眨眼，一臉困惑。
      　　
      　　「拉哈？」
      　　
      　　「沒、沒事。」
      　　
      　　「怎麼了？」
      　　
      　　古·拉哈·提亞垂下耳朵，支支吾吾了半天，始終不肯看他。光看看那本攤開的書，想起方才被他們輕易跳過的那一項，便故意板起臉。
      　　
      　　「戀人要坦承且深入地溝通。」
      　　
      　　古·拉哈·提亞張了張嘴，又閉上。好半晌才抬起泛紅的眼睛，極輕地說：「起……起反應了……」
      　　
      　　說完，他立刻把臉埋進雙手裡。
      　　
      　　光怔了怔，反射性地低下頭朝他的襠部望去，果然看見那裡已經鼓起了一小包輪廓。
      　　
      　　貓魅察覺到視線，羞恥得差點跳起來，雙手死命往下壓：「別看啊！很害羞的好不好！」
      　　
      　　「有什麼關係，」光眨眨眼，理直氣壯地搬出書上的內容，「戀人要坦承。」
      　　
      　　「那句話才不是用在這種地方的！平常看書也沒見你這麼靈光，這次怎麼現學現賣得這麼快！我們、我們明明才剛牽手而已──」
      　　
      　　古·拉哈·提亞氣急敗壞地抗議著，整張臉紅得接近於髮色，連頭頂毛茸茸的耳朵都羞憤地朝兩側壓平。
      　　
      　　光望著他那副手足無措又狼狽的模樣，心頭忽然軟了下來，胸口也湧上了一股無法忽視的躁動。
      　　
      　　──好想親他。
      　　
      　　這個念頭剛浮現，手便已經自行動了起來。
      　　
      　　溫熱的掌心輕輕捧住了他發燙的臉頰，光微微俯身，將自己的唇直接覆了上去。
      　　
      　　古·拉哈·提亞的抗議被堵在喉嚨裡，只來得及發出一聲短暫的悶哼，壓低著的耳朵豎了起來，身後的長尾更是在瞬間繃直。
      　　
      　　老實說，兩人在這方面的經驗當真像張白紙。
      　　
      　　起初的吻極其笨拙，他們摸索著力道與角度，牙齒甚至好幾次不輕不重地磕在一起，傳來微麻的痛感，但誰也沒有因此退開。
      　　
      　　不知是誰先張開了嘴，帶著些許顫抖的舌尖便小心翼翼地探了進去，毫無章法地交纏、舔舐，任由唾液的濕意在唇齒間漫開。
      　　
      　　古·拉哈·提亞努力仰起頭，伸手環住光的後頸，光也順理成章地將手掌往後移，捏了捏那雙滾燙的耳朵，手指又順著柔軟的紅髮往下滑，停在髮尾與辮子之間的縫隙輕輕揉搓。
      　　
      　　呼吸漸漸變得沉重起來。
      　　
      　　直到胸口傳來幾下沒什麼力氣的捶打，光才退開了些，放開懷裡的貓魅。兩個人額頭相互抵著，粗重地喘著氣，嘴角還牽著一點水光，互看一眼後，不約而同笑了出來。
      　　
      　　「……忘記呼吸了？」光帶著些許笑意，沙啞地問道。
      　　
      　　「你不也是……」
      　　
      　　古·拉哈·提亞微喘著嘟囔，微微鼓起腮幫子，那雙赤紅色的眼眸泛著一層水霧，看起來既羞澀又帶著幾分不服輸的懊惱。
      　　
      　　光忍不住伸手捏了捏他那盈滿空氣的臉頰。
      　　
      　　「為什麼不高興？」
      　　
      　　「……不甘心。」古·拉哈·提亞撇開了眼神，難為情地小聲坦白，「我在腦袋裡預演過好多次，想著要怎麼有氣魄地親上去、怎麼看你的反應……結果到頭來，還是全被英雄搶先了。」
      　　
      　　光愣了一下，隨即噗哧一聲笑了出來。
      　　
      　　「這種事有什麼好爭的。」他笑著捏了捏古·拉哈·提亞的鼻子，「我們的未來還這麼長，之後多的是機會。」
      　　
      　　古·拉哈·提亞怔了怔，眼眶微微發熱。他很用力地點了點頭，又主動把額頭靠在光的肩上。
      　　
      　　「……這可是你說的。」
      　　
      　　「當然。」
      　　
      　　古·拉哈·提亞笑得一臉滿足，放鬆下來的眼睛輕輕眨了眨，視線卻突然掃到光腿間同樣明顯的凸起。
      　　
      　　他的臉砰地一聲再度漲紅，不可置信地抬起頭，對上那雙坦然的藍眼睛。
      　　
      　　「光……你這是……」
      　　
      　　這回輪到英雄有些尷尬地別開了視線。
      　　
      　　「……畢竟是跟喜歡的人待在一起。」光抓了抓臉頰，小聲嘟囔道：「又摸又親的，起反應很正常吧。」
      　　
      　　說完，光又有些局促地補了一句：「不過先說好……我可是一點經驗都沒有。」
      　　
      　　一邊是雲遊四海卻半點風流故事都沒留下的英雄，一邊是活過百年卻始終專心任務的城邦領主。兩人面面相覷地眨了眨眼，古·拉哈·提亞只能彎下身，從床底隱蔽的角落裡拖出另一本書。
      　　
      　　「這、這我原本想自己偷偷看的……」
      　　
      　　通紅的臉埋得極低，將那本封面畫著大膽又煽情內容的書推到光面前，「不然……我們先看看？」
      　　
      　　看著他這副真打算用學術來解決兩人生理需求的認真模樣，光忍不住笑了出來。
      　　
      　　「都這樣了還看書。」
      　　
      　　光把他推來的書又推了老遠，接著伸手摟過貓魅的腰，示意他分開雙腿跨坐在自己腿上。
      　　
      　　光仰著頭，用鼻尖蹭著他發紅的鼻子，手掌直接探到兩人緊貼的腿間，隔著布料一把握住了那兩個同樣硬挺發燙的部位。
      　　
      　　「哈啊……」光低低喘了口氣，「這種時候，就該依循本能。」
      　　
      　　單薄的布料前端早就被滲出的液體染深了顏色，突如其來的觸碰讓古·拉哈·提亞輕輕嗚咽了一聲，整個人脫力般把臉埋進光的頸窩裡。
      　　
      　　然而，下意識收緊的手臂與微顫的尾巴卻出賣了他，貓魅的腰肢已有些不安分地輕晃著，順著兩人的呼吸，一下又一下、笨拙又微弱地頂弄著光握著彼此的掌心。
