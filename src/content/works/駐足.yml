  - 光拉哈
  - 虐向
updated: 2026-10-12
summary: 無
series: 短篇
chapters:
  - body: |-
      　　墓園裡的石碑整齊地並立在斜陽下，拉出一道比人的影子還要深長又淒涼的黑影。
      　　
      　　英雄正靜靜地站在那裡，注視著冰冷的文字。
      　　
      　　無論生前曾笑得多麼爽朗，曾懷抱多麼壯闊的夢想，刻在石面上的名字與生卒年，最終也不過佔據了幾指寬的凹痕。待風霜積年累月地刮過，就連這點刻痕都會被徹底風化抹平。
      　　
      　　一個人曾存於世間的軌跡，最終只能寄託在生者隨時可能模糊的記憶裡。
      　　
      　　誰會不感到唏噓呢。
      　　
      　　一個鮮活的生命擁有無限的可能，卻也脆弱得可以，只需一場意外、一次沒能避開的衝擊，就會猝不及防地化作地表上一塊無聲的石頭。
      　　
      　　突然感到風有些寒冷，光卻沒有立刻走回石之家。
      　　
      　　他順著山丘邊緣的碎石路漫無目的地走著，最後在背風處的一片草地上坐了下來。天色灰濛濛的，遠方的霧氣籠罩著靈災留下的結晶，像極了誰的眼淚般微微發光。
      　　
      　　身後傳來草葉被輕輕踩過的窸窣聲。
      　　
      　　來人的腳步很輕，沒有帶著驚動旁人的急促，只是順著痕跡一路尋到了這裡。一陣微弱的摩擦聲後，身旁的草地微微下陷，帶著體溫的包裹被輕輕遞到了光的視野裡。
      　　
      　　油紙包著烤得鬆軟的麵包，旁邊是一個裝滿溫水的皮質水袋。
      　　
      　　光沒有轉頭看他。
      　　
      　　他只是垂著眼，下意識地伸出雙手接過那些溫熱的食物。粗糙的紙頁與水袋沉沉地壓在掌心，指節微不可察地顫了顫。
      　　
      　　「……好重。」
      　　
      　　光低聲開口，聲音乾澀得像是被風吹乾的砂礫。
      　　
      　　雖然沒有解釋，但他知道對方會理解自己的意思。
      　　
      　　那些力所不能及的失去、雙手守護不到的範圍，以及在生命戛然而止後、不得不由活著的人替其背負延續下去的心願……都好重。
      　　
      　　明明昨天黃昏還在營帳前一起碰過酒杯、聊著等一切結束後想去海都看看的同伴，今天就已經被塵土所封印、陷入了無止盡的沉睡。
      　　
      　　世人都頌讚英雄的強大，光卻明白自己的能力只會讓生命消散，而不是挽回。
      　　
      　　他抱著麵包發著呆，混亂的思緒在寧靜中翻湧。不知過了多久，微涼的風吹過耳際，他才像是忽然驚醒一般，遲鈍地想起了身旁的人是誰。
      　　
      　　古·拉哈·提亞始終安靜地坐在一旁，紅眼正望著遠方的地平線，神情平靜得像是一潭不起波瀾的深水。
      　　
      　　那一瞬間，光才意識到──比起自己剛剛經歷的這場告別，身旁的人早在那漫長的百年歲月裡，目睹過無數次戰火的侵蝕、生命的凋零，看過遠比這更多、更徹底的失去。
      　　
      　　而察覺到光的視線，古·拉哈·提亞轉了過來，淡淡地望著他，那雙深邃明亮的眼裡沒有憐憫，只有歷經風霜後沉澱下來的溫柔與理解。
      　　
      　　「很重吧。」他慢慢開口，嗓音沉穩而和緩，像是一道安撫的屏障擋住了草地上的冷風，「即使兩個人一起，還是很重。」
      　　
      　　他伸出手，將自己溫暖的掌心覆在光泛白的手背上。體溫透過手背一點一點滲進來，古·拉哈·提亞動了動指節，將光僵硬的手指輕輕收攏在自己的手掌中。
      　　
      　　「很多時候，事情總是與我們期望的背道而馳。」
      　　
      　　古·拉哈·提亞輕輕嘆了一口氣，微風揚起他攏好的碎髮，頭頂的貓耳在風中微微壓低，但他的目光依舊無比堅定地放在光身上。
      　　
      　　「我們傾盡全力，想要護住眼前的每一個人、每一份笑容。但命運有時就是這樣任性，它不會因為你站得夠高、走得夠遠就特別眷顧，甚至手下留情。」
      　　
      　　他停頓了一下，毛茸茸的尾巴繞到了身側，輕輕搭在光的膝蓋上，一下下地輕拍著。
      　　
      　　「那些遺留下來的東西確實很重，重到有時會讓人懷疑自己還能不能邁出下一步……但是那也沒關係。」
      　　
      　　古·拉哈·提亞微微傾身，另一隻手抬起來，極其溫柔地拂去落在光髮梢上的一片枯草。
      　　
      　　「走不動的時候就停下來，難過的時候就看著我。不需要著急，也不必勉強自己裝作若無其事，你想在這裡坐多久，我就在這裡陪你多久。直到你覺得可以了、重新準備好的那一刻，我們再一起往前走。」
      　　
      　　掌心下的溫度滾燙，連帶著風似乎也不再那麼刺骨。
      　　
      　　「別忘記，無論如何，你都不會是一個人。」古·拉哈·提亞微微一笑，「只要還能前行，在你的目標前方，一定會有志同道合的夥伴在等著你。」
      　　
      　　光低著頭，看著兩人交疊在一起的手。
      　　
      　　他沒有再說話，只是微微側過頭，任由自己的額頭輕輕抵在古·拉哈·提亞溫暖的肩窩裡，就這麼沉沉睡去。
