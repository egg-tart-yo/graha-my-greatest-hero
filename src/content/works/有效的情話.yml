      　　這是某日午後，在石之家發生的小小插曲。
      　　
      　　「──總之，哭得非常傷心呢。」阿莉塞雙手抱胸，眉頭蹙著嘆了口氣，「明明在攤位上挑了那麼好看的緞帶，結果轉頭就看見對方和別人走在一起。要不是阿爾菲諾拉著我，我真想上去替她把那條緞帶搶走扔進海裡。」
      　　
      　　「我能明白你的心情，但還是得冷靜點……那種場合外人隨意插手，很容易節外生枝。」阿爾菲諾捧著茶杯，眼神帶著同情，「不過……看著一名淑女哭得這麼傷心，若是能有什麼契機能稍微給予她一點安慰就好了。」
      　　
      　　光單手托著腮，百般無聊地用指尖轉著桌上的空茶杯。
      　　
      　　聽著雙胞胎一來一回的討論，他眨了眨眼，慢悠悠地插話進來：「既然如此，要不要由拯救世界的英雄親自去給她加油打氣？」
      　　
      　　阿莉塞挑眉看他，一副懷疑的眼神。
      　　
      　　「你打算說什麼？別是想跟她聊戰鬥的事情。」
      　　
      　　光清了清嗓子，眼神無比認真地望向阿莉塞，壓低嗓音、擺出招牌的英雄架勢開口。
      　　
      　　「『小姐，請不要哭泣──像妳這麼漂亮的女孩子，眼淚掉下來都會變成水晶，地上的塵土配不上妳的眼淚。』」
      　　
      　　「噗──咳！咳咳咳！」
      　　
      　　對面剛端起酒杯抿了一大口的桑克瑞德猛地噴了出來，烈酒嗆進氣管，引發一連串劇烈的咳嗽。雅·修朵拉甚至連頭都沒抬，只是指尖輕輕一彈，一道小巧的障壁精準地張開，將濺過來的酒水無情地擋了回去。
      　　
      　　「咳……光！你這套、你這套亂七八糟的句子從哪學來的？！」桑克瑞德一邊拭過嘴角，滿臉不可置信地瞪著他，「哪怕去劣質酒館裡隨便抓個醉漢，都不可能講出這麼又爛又土的情話！」
      　　
      　　光被嗆得臉上一熱，覺得自己的一片好心居然得到如此評價，頓時沒好氣地一拍桌子吼了回去。
      　　
      　　「土怎麼了！再怎麼土，至少它是奏效的！不然呢？情場經驗豐富的風流男，你倒是現場編一段高明的情話來教教我啊！」
      　　
      　　桑克瑞德冷笑一聲，滿臉嘲弄。
      　　
      　　「奏效？哈！這要是能奏效，我明天就跟阿爾菲諾一起穿薩雷安的議員袍去跳莫古利舞──」
      　　
      　　「為什麼是我……」
      　　
      　　「這可是你說的！」
      　　
      　　光頓時來了脾氣。
      　　
      　　環顧了一圈，藍眼瞬間鎖定在不遠處的書房。他吸了一大口氣，扯開嗓門就朝著門口喊了一聲：「拉哈──！」
      　　
      　　話音剛落，門板後方立刻傳來一陣混亂劇烈的物品掉落聲，伴隨著椅腳刮過地面的刺耳聲響和翻箱倒櫃的聲音。
      　　
      　　沒多久，木門「碰」地敞開，古·拉哈·提亞一手夾著沒合攏的厚重書籍，另一手拎著佩劍，從房間快步走了出來。
      　　
      　　「光？怎麼了！有敵人還是要出發冒險？我隨時可以──」
      　　
      　　光挺起胸膛，指著全副武裝卻一臉懵懂的古·拉哈·提亞，用全場都能聽得清清楚楚的音量大聲喊道：「沒錯！就是要出發冒險！」
      　　
      　　「好好好我準備好了，要去哪裡？」
      　　
      　　「你心裡！」
      　　
      　　阿爾菲諾手一抖，熱茶瞬間灑了一桌，茶杯在一片寂靜中滾落了地面。
      　　
      　　站在房門口的古·拉哈·提亞渾身震了一下。
      　　
      　　「……欸？」
      　　
      　　他呆呆地眨了眨眼，比起思緒反應更快的耳朵卻徹底貼回髮絲間，露出一點比髮色更紅的尖端，他將臉微弱地藏回書冊後方，連眼神都害羞地不敢看任何人。
      　　
      　　「我、我我我……什麼？……光、光你在說什麼啊……！大家都在看……別、別亂說話……」
      　　
      　　連那條平日裡神氣活現的尾巴，此時都緊緊地圈住了自己的大腿，尖端還害臊地微微蜷縮。
      　　
      　　桑克瑞德張著嘴，表情徹底僵死在臉上，他的世界觀彷彿在此刻受到了前所未有的重創。
      　　
      　　光一臉得意地仰著頭，臉上寫滿了「看吧」。
      　　
      　　沉默中，一隻沉穩有力、裹著鐵甲的大手忽然落在桑克瑞德僵硬的肩膀上，不輕不重地拍了兩下。朝門口走去的艾斯蒂尼安連眼皮都沒抬一下，語氣平靜得沒有一絲波瀾。
      　　
      　　「放棄吧，桑克瑞德。」前蒼天之龍騎士淡淡地吐了口氣，幽幽道：「那兩個人，從一開始就跟常人不一樣。」
