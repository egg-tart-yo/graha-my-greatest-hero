title: 固執
cp:
  - 拉哈光
  - 光拉哈
updated: 2026-10-19
summary: 舞者職業劇情注意
series: 短篇
chapters:
  - body: |-
      　　光最近成了一名舞者。
      　　
      　　契機是英雄在利姆薩·羅敏薩的甲板閒晃時，偶然被某個巡迴劇團的團長攔了下來。那位自稱來自近東的導師雙眼放光地盯著英雄勻稱挺拔的體態，二話不說便迎了上來，遞出了初次修煉與登台的邀約。
      　　
      　　就算是在艾奧傑亞，能活用於戰鬥中的舞蹈也鮮少聽聞。據說來自薩維奈島的戰舞與一般舞蹈並不相同，蘊含振奮人心與撫慰傷痛、激發同伴潛力的力量。
      　　
      　　但這些對古·拉哈·提亞來說都不重要。
      　　
      　　至少，在此時此刻石之家小房間的屏風後，這一點都派不上用場。
      　　
      　　「等等、等一下！光，你……你剛才說你要穿這身去登台表演？！」
      　　
      　　屏風後的人才剛踏出，古·拉哈·提亞的耳朵瞬間扁成了下去，他幾乎是反射性地一把抓起掛在一旁的旅行斗篷，以迅雷不及掩耳的速度衝上前，手臂拉過斗篷一繞，轉眼就把光整個人裹了個嚴嚴實實。
      　　
      　　光被斗篷糊了滿臉，略帶無奈地把領口往下扯了扯，露出一雙清澈的藍眼睛。
      　　
      　　「這布料也太少了吧！」古·拉哈·提亞的雙手緊緊拉著斗篷邊緣，那張臉一路紅到了耳尖，結結巴巴地抗議：「這、這根本連腰都……不，鎖骨和背部也全露在外面！就算薩維奈島的氣候比較溫暖，這衣服在海都絕對會著涼！沒問題嗎？真的沒問題嗎？！」
      　　
      　　過於冠冕堂皇的理由，卻顯得欲蓋彌彰。
      　　
      　　古·拉哈·提亞在乎的重點當然不是區區著涼──舞者的服飾由少量半透明薄紗製成，垂墜在肌膚上的衣料非但遮掩不住什麼，反而隨著呼吸的起伏，與那蘊含力量與彈性的身軀一同輕輕跳動。金屬墜飾自脖頸延展至光裸的前胸，一路緊貼著胸膛向下，在後腰肌肉的橫溝收束，比任何貼身衣料更明顯地勾勒出身體的線條。
      　　
      　　英雄很好看，但不能給別人看。古·拉哈·提亞也完全不敢想像，這樣的英雄站在大眾面前，石之家原本就收不完的情書，會爆量到什麼程度。
      　　
      　　不行不行不行，不恰當不應該不適合──不、可、以。
      　　
      　　「……近東的舞者都穿這樣。」光看著他這副如臨大敵的模樣，嘆了口氣，眼神裡帶了幾分意料之中的認命。
      　　
      　　當初光在考慮要不要答應劇團時，就因為深知自家戀人這股平時溫和、關鍵時刻卻莫名佔有慾爆棚的脾氣，足足猶豫了好幾天。事前他也認真溝通過好幾次，向對方保證這純粹是為了拯救世界。
      　　
      　　可是當真的看到這身衣裳，古·拉哈·提亞的應允顯然是完全失效。他眼神游移著不敢往光的身上多看，紅透的臉上寫著滿滿的不情願，耳朵微微發抖、尾巴也不滿地在身後迅速甩動，委屈又固執。
      　　
      　　最後，在光平靜卻不容妥協的注視下，拗不過他的古·拉哈·提亞最終還是妥協了。
      　　
      　　「……至少在登台前一刻都要披著斗篷。」他將斗篷正面的繫帶又拉緊了些，氣鼓鼓地低聲道：「穿著舞衣的時候，也不可以路過大水晶，那邊人太多。還有市場，上回塔塔露告訴我，那邊有一個喜歡調戲人的大叔──」
      　　
      　　絮絮叨叨的提醒還未了，英雄便緩緩垂下頭，直接吻住了那張不斷出聲警告的嘴。他的手順勢探出斗篷，安撫地揉捏著那哀怨至鼓起的臉頰。直把古·拉哈·提亞親得腦中一片空白、連抗議都化作喉間細碎的輕哼，才稍稍拉開距離。
      　　
      　　薄唇依舊貼著貓魅微熱的唇瓣，認真地允諾道：「好，我都答應你。」
      　　
      　　原本以為登台的事情告一段落，事情就算解決了。沒想到幾天後兩人以一般冒險者身分接下行會的委託時，新的問題又冒了出來。
      　　
      　　進入迷宮前的集結區，古·拉哈·提亞握著法杖站在光的身旁，身後的尾巴緊繃地捲起。表面上看起來是在靜靜等待，實際上心跳快得像擂鼓。
      　　
      　　──光會選誰當舞伴？
      　　
      　　這幾天，他可是私下將「舞者」的特性研究了個遍，也知道「舞伴」對彼此相互加成的重要性。在不熟悉隊友戰力的陌生隊伍中，舞者通常會優先從裝備精良、輸出潛力最大的隊友中挑選舞伴。
      　　
      　　為了這個，他前幾天還支支吾吾、繞著光轉了半天，才滿臉通紅地拜託身兼頂級工匠的光替他打了一身高階法師長袍，還在上面塞滿了加成的晶石。
      　　
      　　光看了一眼站在旁邊屏息以待的紅髮貓魅，指尖的月輪在掌心一轉，抬手就將乙太光芒直接套在古·拉哈·提亞身上。
      　　
      　　旁邊一名背著短刀的忍者頓時皺起眉頭。
      　　
      　　「喂，等等！」
      　　
      　　他面露不滿地大步上前，指著自己腰間的武器，直接開口質疑：「英雄，你挑個黑魔當舞伴是什麼意思？把增益給我才是效益最大的打法吧？」
      　　
      　　隊伍裡的氣氛頓時一僵。
      　　
      　　古·拉哈·提亞的尾巴心虛地捲了起來，下意識想開口打圓場：「那個，如果是考慮團隊整體的輸出效率，我也可以配合──」
      　　
      　　話還沒說完，光便淡淡地轉過頭去。
      　　
      　　那雙藍眼連半點委婉客套的意思都沒有，目光直直釘在忍著身上，袒護的語氣毫無起伏。
      　　
      　　「在我眼裡，他就是最強的。」
      　　
      　　忍者被這毫不退讓的視線逼得一退，嘴唇動了動、硬是把剩下的抗議全吞了回去。其他隊員看看滿身低氣壓的光，又看看那身造價不菲的法師袍，聳了聳肩、識趣地閉上了嘴。

      　　反正隊伍裡有那個英雄，其他人的戰力怎麼樣，不是他們需要擔心的事情。
      　　
      　　而英雄口中的「最強同伴」整張臉已經冒起一股裊裊上升的煙。
      　　
      　　他一聲不吭地把發燙的臉死死埋進了雙手，清脆的鈴鐺聲也在同一時間響了起來。
