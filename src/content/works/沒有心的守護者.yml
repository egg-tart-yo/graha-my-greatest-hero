  - body: |-
      　　雖然光終於成功將古·拉哈·提亞帶回原初世界，但英雄的內心總有股說不上來的違和感。
      　　
      　　那雙赤紅的眼睛總是帶著憧憬與仰慕，如同兩人所約定的那樣，前往各式各樣的地方冒險。無論身在何處，只要光呼喚他的名字，古·拉哈·提亞都會精神地豎著耳朵，帶著笑容回應他的聲音。
      　　
      　　一切彷彿在跨越了百年的時光後苦盡甘來，可光就是覺得有哪裡不一樣。
      　　
      　　他還記得一同探索水晶塔時，個性活潑又明亮的貓魅賢人，總會毫無顧忌地湊過來和他說話。興奮時甚至會忘了分寸，帶著理所當然的親近靠在光的肩膀旁，與他暢談著未來。
      　　
      　　而現在的古·拉哈·提亞，仍然會走到他的身邊，卻總有種微妙的疏離感。
      　　
      　　看似親近，卻又隔著一層薄薄的距離，無法再貼近一點。
      　　
      　　光開始忍不住擔憂，會不會是吸魂晶的轉移出了什麼問題。畢竟靈魂是那麼複雜的東西，就算記憶得到保存並成功轉移，那些情感……
      　　
      　　會不會有什麼重要的東西，在跨越世界時遺失了？
      　　
      　　這個想法一旦出現，就怎麼也壓不下去。煩惱了數日後，光還是決定回一趟第一世界。
      　　
      　　他原本打算找拜克·拉各詢問，有沒有自己疏漏的地方，只是光才剛回到水晶都，連那位魔法研究者的人影都還沒見著，熟悉的笑聲便先從頭頂飄了下來。
      　　
      　　「哎呀呀──」
      　　
      　　光停下腳步。
      　　
      　　他仰起頭，看著細碎的磷光落在肩頭，伴隨著輕快的聲音，菲奧·烏兒從半空中翻了個身，倒著出現在他眼前。
      　　
      　　「這不是我的小樹苗嗎？」妖精王瞇起眼睛，毫不客氣地伸出尖銳的手指，輕柔地戳了戳光的肩窩，「偷偷跑回來，也不先呼喚我。」
      　　
      　　菲奧繞著他轉了一圈，抗議地喊著：「過分！真過分！」
      　　
      　　光無奈地伸出手，將豔麗的妖精捧在手心，沉聲詢問。
      　　
      　　「我要找拜克·拉各，你知道他在哪嗎？」
      　　
      　　菲奧原本還鼓著臉，聽見這個名字後，卻稍微安靜了一會。
      　　
      　　「找他做什麼？」
      　　
      　　「我想問吸魂晶的事。」
      　　
      　　光掃了搔頭，一時間不曉得該從哪裡解釋自己無端生出的懷疑。好在妖精王今天特別有耐心，聽完他斷斷續續又零散的解釋，難得以平靜的語氣簡單地下了結語。
      　　
      　　「所以，可愛的小樹苗，總覺得與我的朋友之間隔著一層東西？」
      　　
      　　「也不是說東西……但這麼說好像也沒錯……」
      　　
      　　妖精漂亮的翅膀輕輕動了一下。
      　　
      　　抱著頭的光還沉浸在自己的思緒裡，但一抬起頭，看見菲奧的眼神，突然萌生一股預感。
      　　
      　　「難不成……你知道是為什麼？」
      　　
      　　她眼角的笑意更深了，一時間沒有正面回答，只是慢悠悠地繞了他一圈。
      　　
      　　「這樣的話，不用找拜克·拉各了。」
      　　
      　　菲奧的語氣輕快，饒有興致的眼神坦率地看著光，小小的手掌捧起他困惑的臉。
      　　
      　　「沒有什麼壞掉，也沒有什麼遺漏，」她笑著說，「而是從一開始就不存在。」
      　　
      　　「……什麼意思？」
      　　
      　　光的眼神慌了起來。
      　　
      　　而妖精歪了歪頭，似乎在思考怎麼解釋。
      　　
      　　「嗯──應該說，那個重要的東西，現在在我這裡。」
      　　
      　　菲奧飛到一旁的欄杆，輕輕坐了下來，兩條腿慢慢地搖晃。
      　　
      　　「很久很久以前，我的朋友親手將那個東西……人類的『心』交給我保管。」
      　　
      　　光望著他，渾身彷彿血液逆流般冰冷。看透他急躁的妖精王安撫地拍了拍光，語氣也跟著沉了下來。
      　　
      　　「只有一部份而已哦，想一起冒險的心、想要拯救小樹苗的心，都還是屬於他的。」她輕聲道：「但那份又酸又疼……你們人類稱之為『愛』的心，依然還在我這裡。」
      　　
      　　光的呼吸停止了一瞬。
      　　
      　　菲奧的語氣輕快，眼神卻很認真，絲毫沒有說謊的意思。她很快地接著說了下去。
      　　
      　　「喜歡小樹苗的那一塊並沒有還給他，那就是你感受到的距離吧。」
      　　
      　　緊緊握著的拳頭傳來了疼痛，光這才發現他渾身都在顫抖，發緊的喉嚨吞嚥了數次，才終於擠出疑問：「為什麼？」
      　　
      　　「因為太痛了啊。」
      　　
      　　菲奧微微一笑。
      　　
      　　「那時候，他等了你好久，真的好久好久……一邊努力做著準備、搭建著這個美麗的城市，卻又不曉得會不會成功。」
      　　
      　　「每一次的失敗他都會很害怕，第二次、第三次……」
      　　
      　　「但他不能停下來，因為失去了這個目標，他就什麼都不剩了。」
      　　
      　　妖精伸出手，點了下光的鼻尖。
      　　
      　　「人類真的很有趣。」她輕笑，「明明每天只有改變一點點，內心的思念卻越來越大，大到無法動彈、壓住別的東西。」
      　　
      　　「他沒辦法好好睡覺，總是反覆計算著早就規劃好的事情，怕漏掉什麼……隨著時間越來越近，也開始變得急躁。」
      　　
      　　看著在空中比劃著的妖精，光的聲音低得幾乎聽不見。
      　　
      　　「所以……他來找你？請你替他保管……」
      　　
      　　「當然，我才不會偷他最重要的東西。」
      　　
      　　菲奧立刻道，語氣裡甚至帶了一點被冤枉的不高興。
      　　
      　　「是他自己拜託我的……他說，這樣下去不行，如果再這麼想你，他會撐不住。」
      　　
      　　光的胸口像被什麼東西猛地攥緊。
      　　
      　　「他總是一個人在深夜裡煩惱，偶爾翻著他從原來世界裡帶來的書。儘管上面的字跡都沾滿眼淚，卻還是看了一遍又一遍。」
      　　
      　　菲奧的聲音慢慢低下去。
      　　
      　　「他總跟我說，那裡面寫著『希望』。」
      　　
      　　「在我看來，那就是太喜歡你了呀……我的小樹苗。喜歡到每一次失敗，都像是又離你遠了一點，有多喜歡，就有多害怕。」
      　　
      　　妖精的眼神坦率地凝視著他。
      　　
      　　「所以他問我，能不能替他保管好最重要的寶物，直到成功的那一天。」她淡淡地露出微笑，「因為他是菲奧的朋友，所以我當然要幫他。」
      　　
      　　光急迫地抬起了頭。
      　　
      　　似乎看透他想說什麼，菲奧伸出手指，輕輕往他的嘴上一壓。
      　　
      　　「我已經說很多了。接下來的事情，是他的秘密。」妖精笑吟吟地說：「如果你只是關心我的朋友，那知道他沒有壞掉就夠了。」
      　　
      　　「還是說，我的小樹苗……」
      　　
      　　菲奧忽然湊近，大眼睛懷著前所未有的認真，直勾勾地注視著光。
      　　
      　　「現在的你，是以什麼理由、又是以什麼身分，來問我他放在這裡的心呢？」
