chapters:
  - title: 第一章
    body: |-
      　　空氣炙熱得幾乎要將他焚燒。光仰起脖頸，彷彿溺水般粗喘著氣，氣息急促而紊亂。
      　　
      　　他在心中埋怨起稍早的自己──如果時間能倒流，他絕對會掉頭就走，絕不輕易朝路上偶遇的那隻外星機器搭話。
      　　
      　　就在剛才，他再次碰見了漫遊在原初世界的歐米茄。
      　　
      　　光只不過是一時興起，隨口問了一句對方在自己的旅途中，是否終於理解了何謂「心」的解答。小型機體前方的零件轉了轉、光芒像是思考般閃動，隨後發出了平板卻篤定的機械音。
      　　
      　　『沙沙……記錄搜尋完畢。基於對多數有機生命體的行為模式觀測，本機得出初步結論：所謂的「心」，本質上即是有機生命體定義為「愛」的非理性情感演算。』
      　　
      　　艱澀難懂的機器迴路讓光蹙起眉頭。
      　　
      　　歐米茄看出了他的不理解。機械手臂扭動著，朝光的方向轉了過來。
      　　
      　　『為驗證本機的推論，本機將抽取你靈魂深處對此概念最具象化的物理存在進行質量構築。請親自體驗本機的答案。』
      　　
      　　冰冷的話音剛落，暴漲的光芒瞬間襲了過來。
      　　
      　　那台該死的外星機器甚至沒等他做出反應，便極其不負責任地憑空消失，只在原地留下了一個封閉的空間結界，以及……憑空出現的兩個人。
      　　
      　　「不專心。」

      　　一聲帶著不滿的低哼，硬生生將光的思緒從懊悔中拽了回來。
      　　
      　　英雄整個人正陷在寬厚的懷抱裡，脊背緊緊貼著對方沉穩起伏的胸膛。一隻覆蓋著藍色水晶、觸感堅硬且不帶溫度的手臂橫在他的腰際，將英雄牢牢禁錮在懷中。
      　　
      　　水晶公深色的兜帽垂落下來，在光的視野投下一片幽暗的陰影。
      　　
      　　在他正前方，另一名紅髮貓魅正跪坐在地上，一雙毛茸茸的耳朵高高豎起，長尾躁動地在身後擺動。那雙清澈的異色瞳倒映著光的臉龐，古·拉哈·提亞甚至連呼吸的節奏都透著年輕氣盛的浮躁。
      　　
      　　他雙手撐在光的大腿兩側，猛地湊上前，滾燙的氣息直直撲在光的鼻尖上。
      　　
      　　「光……」
      　　
      　　青澀的聲音帶著近乎任性的聲調，毫不掩飾眼底炙熱的渴求。他急切地仰起頭、即將覆上光的唇瓣，遍佈水晶的手卻伸了過來，指尖輕輕抵住了他的額頭，冰涼的溫度將這份魯莽的吻攔了下來。
      　　
      　　「這樣對英雄來說，未免太唐突了。」
      　　
      　　水晶公低沉的嗓音在光耳畔響起，帶著歲月沉澱後的沙啞與無奈。
      　　
      　　「才不會！」年輕的古·拉哈·提亞頓時炸了毛，雙手叉腰瞪著眼前的「自己」，滿臉都是不服輸的倔強，「明明我才是最早遇到光、最早喜歡上光的人！按順序也該由我先來！」
      　　
      　　摟著光的水晶公發出了一聲低笑，胸膛的震顫隔著衣料清晰地傳到光的身上。
      　　
      　　他非但沒有退讓，反而再次收緊了環在英雄腰間的手臂，讓光往自己懷裡又陷入了幾分。
      　　
      　　「論時間，你確實是最早的。」水晶公偏過頭，就事論事的溫熱吐息拂過光的耳廓，溫柔的語氣裡卻也隱約透著執拗，「但論思念英雄的長短，我可不會輸給你。」
      　　
      　　他絲毫不給年輕的自己反駁的機會，那隻修長的手輕輕捧起光的側臉，指腹試探性地摩挲著泛紅的眼角。
      　　
      　　光還沒從兩人的對話間反應過來，臉就被動地抬起，角度正好能望進兜帽深處──那雙暗紅色的眼眸裡，流轉著從容的平和，卻又翻湧著差點被埋葬的情感。
      　　
      　　也是這雙眼睛，曾真誠地凝視著他，用卑微又奢求的語氣，與光訴說想要一同冒險的夢想。
      　　
      　　想到這，光心口微微一緊，而那溫柔的聲音也在同一時間輕喚。
      　　
      　　「英雄，可以嗎？」
      　　
      　　光的視線並沒有從紅眼移開，短暫的沉默似乎讓對方將此理解成拒絕。指尖稍稍鬆開、準備退讓時，他才像是終於回過神來，無意識地伸手抓住了那截深色的衣袖。

      　　光難為情地別開視線。
      　　
      　　兜帽下那雙紅眸驚訝地微微睜大，隨後輕輕地彎起。
      　　
      　　水晶公順著光的角度垂下頭，虔誠地吻了下來。
      　　
      　　微微顫抖的舌尖撬開唇角，探入口中卻毫不猶豫地勾住內部的柔軟。光只能被動地承受著這份沉重的氣息，努力仰起脖頸，整個人完全溺斃屬於水晶公那清冷又壓抑的陰影下。
      　　
      　　還沒從這個令人窒息的長吻中喘過氣，身前另一股更加熾熱、帶著年少者特有的清冽氣息便不服輸地覆了上來。
      　　
      　　裸露的脖頸側傳來一陣粗糙而細密的刺痛感。
      　　
      　　「唔……！」
      　　
      　　光渾身一顫，不由自主地別過頭、溢出一聲悶哼，和水晶公唇瓣分開的銀絲盡數落在另一雙眼睛裡。
      　　
      　　年輕的古·拉哈·提亞微微眯起眼，見縫插針地撲了上來，動作帶著未經時光打磨的魯莽與野性。
      　　
      　　貓魅族舌上細小的倒刺在敏感的頸間重重刮過，又濕黏又熱情，沿著跳動的動脈一路輾轉舔吻、蔓延到胸口。
      　　
      　　他的呼吸亂得一蹋糊塗，手上的動作雖然生澀卻急切。貓魅急躁地扯弄著光胸前緊繃的衣領，布料在拉扯中發出岌岌可危的撕裂聲，敞開的領口逐漸露出潮紅的胸膛。
      　　
      　　古·拉哈·提亞眼神發亮，濕潤的舌尖輕舔嘴角，立刻迫不及待地順著鎖骨滑下，叼住其中一顆早已因刺激而微微挺立的茱萸。
      　　
      　　「唔……！」
      　　
      　　強烈的刺激讓光險些叫出聲，他死死咬住下唇，試圖將那羞恥的喘息和呻吟逼回喉嚨裡。
      　　
      　　「別咬，英雄……！」水晶公一驚，連忙低聲開口哄道。他拉開兜帽，冰涼的鼻尖帶著安撫意味地輕蹭光的臉頰，指尖也細細揉搓被吻到發紅的唇角。
      　　
      　　「痛就出聲，不要忍著……」
      　　
      　　沙啞的嗓音抬高，跟著啄吻極其輕柔地落在光的眉心，試圖撫平皺起的額頭。
      　　
      　　埋在胸前的貓魅也在此刻猛然停下了動作。
      　　
      　　抬起頭的古·拉哈·提亞臉龐不小心擦過被咬得紅腫的小點，一對耳朵頹然垂了下來，濕潤的眼裡滿是無措。他的腦袋就這麼擱在光發燙的胸前，仰著臉緊張兮兮地問：「光……不舒服嗎？是我弄痛你了？」
      　　
      　　被他這樣眼巴巴地直勾勾盯著，光內心簡直要崩潰了。
      　　
      　　這要他怎麼回答！
      　　
      　　無地自容的英雄只能狼狽地別開頭，幅度極小地搖了搖頭。
      　　
      　　然而，看著那雙仍舊寫滿擔憂的異色瞳，他終究還是忍不住伸出手，輕輕揉了揉貓魅垂下的耳朵。
      　　
      　　他其實一點也不討厭。
      　　
      　　甚至恰恰相反，正因為眼前這個人是古·拉哈·提亞，才讓他無論如何都難以招架。
      　　
      　　見到他的反應，原本頹喪的貓耳瞬間驚喜地動了動，靈活地高高豎起。古·拉哈·提亞眼底浮現出藏不住的得意，帶著幾分耀武揚威的驕傲，挑釁般地瞥了身後略顯無奈的水晶公一眼。
      　　
      　　看著身前那個動作毛躁、幾乎快把英雄衣服扒光的自己，水晶公眼角泛著微光，低低地笑了一聲：「這麼急？」
      　　
      　　「我可不想等。你不親就讓給我！」
      　　
      　　古·拉哈·提亞像是被這句調侃踩到尾巴，猛地從胸口抬起頭，雙手撐在光的肩側，直接仰起身來。光甚至換句話都來不及說，形狀相同卻更為滾燙的雙唇就已經覆了上來。
      　　
      　　與水晶公的深沉克制完全不同，這是一個混亂又莽撞的吻。
      　　
      　　柔軟的舌頭毫無章法地在光口腔裡橫衝直撞，帶著光幾乎不曾在貓魅身上發覺的霸道與佔有慾，甚至磕碰到了牙齒也不停歇。
      　　
      　　被搶了位置的年長者倒也不生氣，他發出一聲低不可聞的嘆息，隨後，微涼的水晶手臂摟住了光逐漸發軟的身軀，另一隻溫暖的手向前，最終順著被另一個自己扯開的衣領邊緣，緩慢而堅定地探了進去。
      　　
      　　冰涼的異質觸感與滾燙的吻形成了極致的拉扯，光的腳趾止不住地蜷縮，大腦一片空白，理智幾乎快要在這交織的快感中燃燒殆盡。
      　　
      　　他覺得自己真的快要瘋了。
      　　
      　　這兩個人都是他朝思暮想的身影，都是他內心深處最重要之人的過去──那個在門前笑著與他道別、堅定地宣告要追隨他名字的耀眼賢人，或是在漫漫長夜中背負一切、甘願為他捨去性命的水晶公，他一個都割捨不下，一個都無法推開。
      　　
      　　更何況，他心裡其實比誰都清楚，自己並不是因為無法拒絕，才任由這兩個人如此親近。
      　　
      　　愛？
      　　
      　　歐米茄試圖將這份感情化作某種可以理解、可以驗證的答案。可對光而言，那從來不是能夠輕易區分的兩份情感。
      　　
      　　他所眷戀的始終只有一個人，只是那個人走過的時間太長，長到足以在他的靈魂裡留下不只一種模樣。
      　　
      　　而他又怎麼捨得否認其中任何一個呢。
      　　
      　　「拉……哈……」
      　　
      　　他艱難地喚著同屬於兩人的名字，同一時間，兩條毛茸茸的尾巴也先後纏繞了上來，一方牽起手腕、另一方纏上小腿。
      　　
      　　「我在。」低沉而沙啞的溫柔嗓音在他耳邊迴盪，逐漸不安分的親吻同時從耳廓往下，牙間緩緩摩挲著後頸。
      　　
      　　「光……看著我……光……」青澀的聲音則急躁又黏糊地含著他的下唇，斷斷續續地吐出炙熱的呢喃。
      　　
      　　光的腦袋被頻頻攀升的溫度燒得迷迷糊糊。
      　　
      　　明明正在與自己接吻的年輕貓魅熱情又渴求，但不曉得為什麼，另一人專注且執著地望著自己的紅眼，才是令他渾身發燙的罪魁禍首。
      　　
      　　那雙眼睛始終看著他所有的反應。
      　　
      　　探向心口的手隨著每一次輕顫，細微地控制令人難耐的刺激。光恍惚覺得，自己正被一個比他還要瞭解這具身軀的人擁在懷裡。
      　　
      　　對方似乎並不急於傳達炙熱的情感，而是像個極具耐心的織網者，將百年間沉澱下的執念化作細密溫柔的擁抱，只想將光牢牢困在其中，令他溺斃於這份無處可逃的深情裡，一點點地、慢慢向下沉淪。

      　　這份耐心，究竟是經過多少時光的打磨才造就而成呢。
      　　
      　　舔得濕熱的後頸被輕輕叼起，他快喘不過氣了。
      　　
      　　一冰一熱，兩隻同樣屬於古·拉哈·提亞的手掌，一前一後，同時覆蓋上了光不住顫抖的腰側，正準備進一步從腰間與褲頭周圍的細縫向下滑去──
      　　
      　　喀啦。
      　　
      　　周圍由歐米茄構建的結界屏障，突然響起了一陣刺耳的碎裂聲。
      　　
      　　「光──！你沒事吧？！我感應到這裡有異常的空間波……動……」
      　　
      　　一道焦急的熟悉聲音伴隨著魔力的擠壓聲同時響起。
      　　
      　　原初世界的古·拉哈·提亞好不容易循著魔力波動一路追蹤至此，奮力用法術擊碎了屏障。他欣喜的話語才說到一半，紅眼落在交纏的三人身上卻驟然猛縮，聲音也突然弱了下去。
      　　
      　　在他眼前，那位平日裡無所不能的英雄正半癱在地上，上身的衣物敞開，胸口起伏不定地劇烈喘息著，前胸除了戰鬥留下的舊傷外，全都佈滿了深深淺淺的吮痕與齒印。
      　　
      　　英雄凌亂的髮絲被汗水浸濕貼在發紅的臉頰邊，而那張微腫的唇角旁，甚至還掛著一道沒來得及擦拭的曖昧痕跡。
      　　
      　　而在光的身側，一個是目光幽暗、眼神失了些從容的水晶公，另一個則是衣衫不整、一臉意猶未盡還帶著敵意瞪過來的年輕貓魅。
      　　
      　　「……」
      　　
      　　原初世界的古·拉哈·提亞尾巴逐漸膨了起來，他手中的法杖就這樣直挺挺地脫手，滑落在冰冷的地面上。
  - title: 第二章
    body: |-
      　　原初世界的古·拉哈·提亞甚至來不及思考這荒謬的景象是怎麼回事，身體便先一步動了起來。
      　　
      　　他猛地衝上前，一把將渾身發軟的光從兩人的包夾中拉了出來，用力抱入自己懷裡。貓魅側身擋在光的前方，急急忙忙扯下領巾，將被扯開的衣領與胸前密密麻麻的紅痕藏在陰影之下。
      　　
      　　隨後，他抬起頭，像拉滿的長弓般緊繃著身軀，蓬鬆的尾巴因戒備而迅速甩動，雙眼在跪坐在地的水晶公與衣衫不整的年輕貓魅之間來回游移。
      　　
      　　「英雄……」
      　　
      　　古·拉哈·提亞死死盯著眼前的兩個「自己」，視線不曾回頭看光，喉嚨乾澀得幾乎發不出聲音。
      　　
      　　「他們……他們對你……」
      　　
      　　警戒的擁抱讓人胸口發悶，但顫抖著的身軀卻令人感到不捨。光的大腦還殘留著剛才被勾起的混亂情慾，根本不知道該如何向這隻急得快要發瘋的貓魅解釋。
      　　
      　　英雄只能懷抱歉意地嘆了口氣，抬起微涼的手，覆上腰間那隻因過度用力而不住發抖的手背，安撫性地握了握。
      　　
      　　半跪在地上的年輕古·拉哈·提亞見狀，毛茸茸的耳朵向後撇了撇。
      　　
      　　他單手撐著膝蓋，瞇起清澈、尚未沉澱下來的異色瞳，神情依然帶著年少的桀驁。他先是偏頭看了一眼身側沉默的水晶公，接著把目光轉向原初世界的自己。
      　　
      　　「原來不只他……」年輕的貓魅喃喃，語調帶著毫不掩飾的困惑，「連你都不呼喚光的名字嗎？」
      　　
      　　原初世界的古·拉哈·提亞身體一僵。
      　　
      　　「為什麼？他的名字是我們的道標，是指引我們的光芒。」
      　　
      　　年輕的古·拉哈·提亞盯著對方因動搖而微微發顫的肩膀，眉頭越皺越緊，語氣裡的困惑也越發濃厚，「你們……在害怕什麼？顧慮什麼？」
      　　
      　　「為什麼變得膽小了？」
      　　
      　　直白的鋒利問句似細針般扎向兩道身影。
      　　
      　　原本高高豎起的貓耳悄悄地垂落，摟著光的力道也逐漸鬆脫；另一側的水晶公僅是抿了抿唇，卻也沉默地別開了視線。
      　　
      　　那過於尊敬的稱呼，不過是為了壓抑內心而刻意拉開的距離。但年少無畏、不曾歷經百年時光的靈魂，哪能理解那份為了不被思念與孤寂壓垮，莫可奈何、強撐起的從容。
      　　
      　　光看著兩人垂下的耳朵，內心微微一抽。
      　　
      　　他撐著發軟的身子，從身後溫熱的懷抱裡直起身來，眼神堅定地望向那名年輕氣盛的貓魅。
      　　
      　　「不許這麼說。」
      　　
      　　三道視線一愣。
      　　
      　　光轉過身，捧起古·拉哈·提亞微微顫抖的臉龐，讓那雙不安的紅眸直視著自己，藍眼呈裝著不容質疑的堅定。
      　　
      　　「拉哈是我所認識的人之中，最勇敢、最耀眼的一個，也是始終貫徹自己的使命，將過去的悲傷一點一滴、化為未來希望之人。」
      　　
      　　貓魅泛紅的眼眶微微睜大。
      　　
      　　光的眼底化開無奈的縱容，乾脆將他抱進懷裡，另一隻手臂則朝垂著頭的水晶公伸展開來。
      　　
      　　「過來。」他認命地笑了笑，視線最後落在年輕的古·拉哈·提亞身上，「你也是。」
      　　
      　　身著長袍的貓魅有些遲疑，但還是緩步靠了過來，光的手掌隨之覆蓋在兩耳之間，指尖陷入柔軟的紅髮裡輕輕揉按。
      　　
      　　年輕的古·拉哈·提亞依然有些困惑地偏著頭，但快步向前的他並不打算錯過光的擁抱，唐突衝入胸膛的撲擊甚至擠到了原初世界的古·拉哈·提亞。
      　　
      　　他將臉埋在英雄的胸口，貪婪又霸道地吸了口氣， 隨後將目光轉向那充滿抗議眼神的紅眸。
      　　
      　　「雖然不曉得未來的我歷經了什麼，」他自顧自地咕噥道：「但是我啊……在那個時候，是真的做好了這輩子再也見不到你的覺悟。我告訴自己，必須去正視被託付的血脈與宿命。」
      　　
      　　他微微踮起腳尖，伸手攬住光的脖頸，將臉埋得更深了些。
      　　
      　　「即使醒來後，我只能從傳唱到未來的紀錄裡追尋你的背影，沒辦法親眼見證你戰鬥的英姿，但我仍由衷地這麼認為──」
      　　
      　　他仰起臉，下顎緊貼著光的胸膛，異色瞳裡閃著純粹的光芒。
      　　
      　　「在那一天，我有接下尋找靈砂的任務、在黑衣森林裡遇見你，實在是太好了。」
      　　
      　　光怔怔地望著他，空氣短暫地陷入了寂靜。隨後，是水晶公率先低低笑了出來。
      　　
      　　他輕輕搖了搖頭，笑意裡帶著歲月沉澱後的滄桑，卻又參雜釋懷的放鬆。
      　　
      　　「有點懷念……原來過去的我是這副任性妄為的模樣。」他抬眸看向被夾在中間的光，語調帶著習慣性的溫柔，「看來給你添了不少麻煩，英雄。」
      　　
      　　「喂！」年輕的自己不滿地皺起臉。
      　　
      　　水晶公垂下眼簾，覆蓋著冰冷水晶的手緩緩成拳，輕輕擱在胸口。
      　　
      　　「是啊……我都快忘了。」
      　　
      　　那雙紅眼再度隨著仰起的頭輕輕睜開，其中的光芒如繁星般逐漸亮起，最終蔓延至整片眼底。
      　　
      　　「那份願望最初始……也不過如此單純啊。」
      　　
      　　年輕的古·拉哈·提亞視線在兩人間來回游移，水晶公只是向他投去一個安撫的眼神，隨後轉向正咬著下唇、神色掙扎的，原初世界的自己。
      　　
      　　沉穩的年長者向前傾過身軀，清冷的氣息微拂，平靜而包容地開口：「你的顧慮是來自於我。」
      　　
      　　水晶公轉過視線，望著現在的古·拉哈·提亞，又望了望身側的光，唇角牽起一抹釋懷的微笑，「但看見現在的你，我知道我們的願望已經成真了。無論是初出茅廬的古·拉哈·提亞，還是第一世界的水晶公……」
      　　
      　　「我們成功地將過去的希望帶到未來、那個英雄也存在的未來。所以……」
      　　
      　　他再次湊近，水晶刻痕的臉頰擦過對方的耳廓。水晶公微涼的氣息覆在原初世界古·拉哈·提亞的耳邊，用極低、極溫柔的嗓音呢喃道：「可以不用再忍耐了，古·拉哈·提亞。」
      　　
      　　微風般溫暖的聲音化去心所建構的束縛。
      　　
      　　原初世界的古·拉哈·提亞怔怔地望著朝他微微一笑的水晶公。跨越漫長歲月的壓抑與顧慮，彷彿在這一刻被另一個自己溫柔化解。
      　　
      　　那些自甦醒後刻意維持的克制、深怕冒犯對方的擔憂，逐漸化作了一股衝動的勇氣。
      　　
      　　他小心翼翼地仰起頭，倒影撞進光的眼裡──而他們的英雄正靜靜地等待著。
      　　
      　　古·拉哈·提亞深吸了口氣，雙拳無意識地緊握，連帶肩膀都微微聳起。
      　　
      　　「光，」他的聲音顫抖，帶著豁出去的決然，一如重新回到這個世界時高聲宣告的模樣，「我……如果是我的話，你願意……我是說……」
      　　
      　　「是我們！」身旁的貓魅立刻不滿地揚起尾巴抗議。
      　　
      　　「你安份點。」水晶公忍不住輕聲斥喝，果不其然遭受年輕的自己一記瞪視。
      　　
      　　光帶著幾分無奈地輕笑，眼底卻漾開了毫無保留的寵溺，他主動垂下頭，微涼的唇瓣精準而輕柔地啄了一下貓魅發燙的嘴角。
      　　
      　　「無論是過去或現在的你，抑或是未來，我都允許。」他輕輕用鼻尖蹭過貓魅，「遵循自己的心，做你想做的吧。」
      　　
      　　一觸即分，卻是不容置疑的應允。
      　　
      　　也是四道身影一同沉淪的開始。
