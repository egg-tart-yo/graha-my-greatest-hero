title: 偏心
cp:
  - 光拉哈
updated: 2026-09-22
summary: 無
series: 短篇
chapters:
  - body: |-
      　　與過去無數次一樣，這場愚蠢的三方混戰，沒人說得準是從哪開始的，但開戰的訊號，大概是起於艾斯蒂尼安把一個烤乾的硬麵包直接扔向了桑克瑞德的額頭。
      　　
      　　「你的準頭在神殿騎士團時就這麼爛嗎，前·蒼天龍騎士？」桑克瑞德敏捷地偏頭躲過，順手抄起手邊捲好的地圖，正打算丟回去時，卻冷不防擦到蹲在一旁、正在保養劍的光之戰士。
      　　
      　　光甚至連頭都沒抬，反手就是一記乾脆俐落的鎖喉，直接將桑克瑞德拖倒在乾草堆上。
      　　
      　　「早說了別在擦油的時候鬧。」光陰森森地威脅，手肘順勢壓上對方的肩膀。
      　　
      　　「這力道，我們的英雄午飯沒吃飽？」
      　　
      　　桑克瑞德笑著掙扎，另一隻手卻悄悄勾住光的腳踝往後一扯，兩人頓時扭打成一團。
      　　
      　　本來想在旁觀戰的艾斯蒂尼安才剛起身，不曉得被誰扯了下小腿，三個成年男人頓時像是行會裡精力過剩的新人，在滿地塵土裡互相勒頸、推來推去、用胳膊抵著彼此的肋骨，嘴裡全是沒營養的挑釁和帶著笑意的咒罵。
      　　
      　　直到光一個翻滾、壓制住桑克瑞德的手腕時，目光不經意掠過了火堆的另一側。
      　　
      　　古·拉哈·提亞正抱著一本攤開的古籍坐在石頭上，但他顯然一個字都沒看進去。
      　　
      　　紅髮的青年微微前傾著身體，那雙赤紅色的眼眸在火光映照下亮得不可思議，尾巴尖端在身後不安分地晃動著，耳朵也跟著動靜旋轉、緊緊盯著他們扭打的身影。
      　　
      　　那表情太明顯了──他想加入，但卻找不到一個好的時機，導致他只是眼巴巴地看著，滿臉寫著躍躍欲試，卻又拘謹地抓著手裡的書頁。
      　　
      　　其他人顯然也發現了那道亮晶晶的視線。
      　　
      　　艾斯蒂尼安最先發難，他率先伸出手臂、鎖住光的肩膀，桑克瑞德也在同時閃到側腰後方，推了人一把，難得同一陣線的兩人不約而同大聲呼叫古·拉哈·提亞的支援，而動作被禁錮、艱難抬起視線的光，眼見貓魅小跑步衝到自己面前、猶豫著要從哪開始下手時，本能地伸手反抗。
      　　
      　　但那隻伸出的手停留了很久、很久，最後只輕輕落在立著耳朵的紅髮上，順著耳廓輕輕撫摸著。
      　　
      　　古·拉哈·提亞僵在原地，眨了眨眼，原本緊繃的肩膀慢慢塌了下來，頭頂的耳朵敏感地抖了兩下，整張臉轟地一下紅透到了耳根。
      　　
      　　營火旁短暫地安靜了一秒。
      　　
      　　緊接著，傳來了幾聲極其響亮的咋舌。
      　　
      　　「喂喂喂，這偏心得太過分了吧。」
      　　
      　　桑克瑞德揉著被光勒得發紅的脖子從地上爬起來，單手叉著腰，臉上掛著難以言喻的荒謬笑容，「你剛剛捶我肩膀的時候，可沒這麼溫柔阿。」
      　　
      　　「確實。」
      　　
      　　艾斯蒂尼安慢條斯理地拍掉盔甲上的枯草，抱著手臂走上前，「差別待遇也要有個限度，還是應該把這傢伙丟到泥巴坑，洗洗他那雙偏心的手？」
      　　
      　　「好主意，我贊成。」
      　　
      　　「你們兩個講點道理──」
      　　
      　　光剛想後退，達成同一陣線的兩人隨即默契十足地合力將他掀翻回草堆裡，混亂中不知道是誰的手肘又撞到了誰的腰，營地裡頓時爆發出一陣夾雜著笑罵與哀嚎的混亂巨響，還有英雄的求助聲。
      　　
      　　「拉、拉哈……」
      　　
      　　古·拉哈·提亞站在火堆旁，摸了摸自己頭頂剛才被撫過的地方。他忍不住揚起唇角，把書本往原木上一扔，挽起袖子，終於毫無顧忌地大步衝進了那團滾成一片的混戰裡。
