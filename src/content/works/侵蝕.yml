  - body: |-
      　　今天的石之家來了一位特殊的求助者，他坐在長桌旁，將發生異狀的右手平放在桌面上。
      　　
      　　自指尖一路蔓延至手背的皮膚已經失去了原本的顏色，半透明的水晶沿著血肉生長，美麗而尖銳，取代了原本該是人體皮膚的部位。光線落下時，甚至能看見晶體特有的稜角光澤，在手心中閃耀。
      　　
      　　「是乙太侵蝕。」雅·修朵拉皺著眉，指尖劃過冰冷的晶體，「但已經發展到這種程度……」
      　　
      　　阿爾菲諾同樣神色凝重。
      　　
      　　「若只是單純的失衡，或許還有其他方法，但結晶化之後……」
      　　
      　　拂曉的眾人面面相覷，沒有人接話。
      　　
      　　就在這片短暫的沉默中，古·拉哈·提亞走近了一步。他的紅眸映著那隻手，透亮的結晶顏色沉進眼底，覆上一層近乎冰冷的光。
      　　
      　　他伸手細細探查，沒多久便下了結論。
      　　
      　　「結晶化的部分，得盡快敲碎。」
      　　
      　　語氣過於平靜，以至於在場的人一時沒有反應過來。
      　　
      　　來求助的人猛地抬起頭。
      　　
      　　「……敲、敲碎？」
      　　
      　　「嗯。」古·拉哈·提亞的視線仍停在那隻手上，「放著不管，侵蝕只會繼續往裡深入。你也不能再接觸過量的乙太或偏屬性水晶。」
      　　
      　　他頓了頓，又抬眼看向對方。
      　　
      　　「如果你本身對魔法具有一定的控制力，之後我可以教你讓手掌重新活動的方法。」
      　　
      　　「方法？」
      　　
      　　「把被敲碎的結晶重新聚集起來，再以魔法加以控制。這需要一些時間練習，但如果能掌握，至少不會完全失去一隻手。」
      　　
      　　對方的臉色顯然沒有因為這句話好上多少。
      　　
      　　他的視線落回自己的手，聲音甚至有些發抖。
      　　
      　　「可是……真的要把手敲碎嗎？」
      　　
      　　古·拉哈·提亞沒有立刻回答，垂落的紅髮遮住了些許眼神，讓人看不清他的神情。
      　　
      　　過了好一會兒，他才輕聲說道：「不會痛的……結晶化的部分，是沒有知覺的。」
      　　
      　　站在他身後的光微微一怔，下意識看向那隻結晶化的手。
      　　
      　　半透明的晶體映著燈火，鋒利的稜角忽明忽滅。可只是一個恍神，那陌生人的手卻像與另一隻手重疊在了一起。
      　　
      　　水晶、遍佈其上的金色紋路，還有那個總是若無其事地藏在長袍之下、不肯讓人多看一眼的身體。
      　　
      　　光的瞳孔驟然一縮。
      　　
      　　古·拉哈·提亞已經再次伸出手，準備確認水晶與身體連結的部位。
      　　
      　　光幾乎是反射性地扣住了他的手腕。
      　　
      　　「……光？」
      　　
      　　古·拉哈·提亞疑惑地回過頭。
      　　
      　　光張了張口。
      　　
      　　有太多東西在腦子裡撞成一團，他甚至不知道自己究竟想先問哪一句。
      　　
      　　你是不是第一次發現身體開始被水晶塔侵蝕時，也這麼害怕？是不是只能獨自尋找解決的辦法，沒有任何人可以商量？
      　　
      　　而且──
      　　
      　　你就是這樣，自己拿起武器，把已經不再屬於血肉的地方，一點一點敲碎的嗎？
      　　
      　　指間的力道不知不覺收緊。
      　　
      　　古·拉哈·提亞察覺到了異樣，沒有掙開，只輕聲喚他。
      　　
      　　「光？」
      　　
      　　溫熱的掌心慢慢覆上光的臉頰。
      　　
      　　那一瞬間，視野忽然晃了一下。
      　　
      　　他眨了眨眼才後知後覺地發現，不知什麼時候，眼淚已經順著臉頰落了下來，眼前貓魅的面容隨著水霧變得模糊，又在下一次眨眼時重新清晰。
      　　
      　　偏偏還是那副神情。
      　　
      　　帶著困惑，帶著擔心，甚至像是不明白他為什麼會忽然這麼難過。
      　　
      　　光胸口猛地一緊。
      　　
      　　「──怎麼可能不會痛！」
      　　
      　　回過神以前，光已經大吼出聲。
      　　
      　　房間裡瞬間安靜下來。
      　　
      　　激烈的喘息牽動胸膛，他的手仍死死扣著古·拉哈·提亞那柔軟且溫熱的手腕。
      　　
      　　古·拉哈·提亞怔了怔，片刻後，像是終於意識到光究竟想起了什麼。他沒有多說，只伸手將仍在抽噎的英雄攬進懷裡，紅色的眼眸也跟著垂了下來。
