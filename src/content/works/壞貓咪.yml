      　　石之家的檔案室裡飄著紅茶與舊書籍的氣味。光之戰士剛結束一趟委託回來，正幫忙整理物資，隨口就聊到了之後的行程。
      　　
      　　光笑著提了一句：「啊，之前答應過拉哈，等事情告一段落，要帶他一起去看看以前沒去過的祕境。」
      　　
      　　坐在一旁翻閱書籍的雅·修朵拉手微微一頓，隔著書頁的間隙，投來一抹耐人尋味的目光。正在整理書冊的阿莉塞更是直接停下了動作，狐疑地挑起眉毛。
      　　
      　　「……你答應了？等等，你們那時候不是就已經把話說開了嗎？」
      　　
      　　「說開什麼？」光眨了眨眼，一臉茫然，「就是……約好以後一起去冒險啊？」
      　　
      　　這句話一出，房間陷入了短暫的沉默。
      　　
      　　率先反應過來的阿莉塞深吸了一口氣，看著某個在戰場上所向披靡、私底下卻沒救了的笨蛋，用力把手裡的書重重往桌上一敲。
      　　
      　　「喂！你該不會真以為那傢伙說要『跟你一起去冒險』，就只是字面上的結伴同行吧？拉哈跟你做下那樣的約定，那可是比單純的『喜歡』還要沉重得多的承諾啊！」
      　　
      　　「……啊？什麼喜歡？」顯然，某位英雄依然沒搞明白。
      　　
      　　「容我提醒你一句，我親愛的英雄。」雅·修朵拉優雅地勾起笑，語調平靜卻字字犀利，「在第一世界孤獨守望了一百年，只為了能親手把未來交到你手裡──這樣的一個人，在一切塵埃落定後，唯一的願望只是『請帶我走，走向你的未來的每一場冒險』……你覺得他所謂的未來，真的只是指冒險的時光，還是指他完整的後半生？」
      　　
      　　「那傢伙平時看著你時，眼睛裡除了英雄根本裝不下別的東西。」阿莉塞雙手抱胸，滿是恨鐵不成鋼的語氣，「大家都以為你們早就私下表述心意、只是沒向我們挑明罷了。結果原來……你一直以為那只是『同伴之間的郊遊約定』？」
      　　
      　　「我、我以為他只是憧憬冒險……」
      　　
      　　「過去提出和英雄一起冒險的人也不少，但把靈魂和餘生完全交給你的人，這世上大概只有那麼一位貓魅。」雅·修朵拉微微一笑，補上了最後一擊，「恭喜你，身為當事人，也是最後一個察覺的人。」
      　　
      　　光簡直想挖個洞把自己埋進去。
      　　
      　　過往無數個畫面開始像走馬燈一樣在腦海裡瘋狂閃爍──在水晶塔頂端那雙熾熱的紅眸、在石之家被摸耳朵時發出的細碎呼嚕聲、每一次做下約定時，那份小心翼翼卻又無比執著的期盼……
      　　
      　　告白。
      　　
      　　原來那些綿延至未來的每一個約定，許下的不僅是一場場冒險，而是英雄往後所有的歲月與時光。
      　　
      　　光甚至不敢看阿莉塞和雅·修朵拉調侃的表情，落荒而逃地衝出了石之家。
      　　
      　　外頭的微風帶著涼意，卻絲毫冷卻不了光狂跳的心臟。他一邊用手背貼著發燙的雙頰，一邊在懷裡胡亂摸索，最後掏出通訊貝，手忙腳亂地撥了過去。
      　　
      　　幾乎是立刻接通，對面很快傳來了熟悉的嗓音，帶著步行造成的震動，背景似乎還有些嘈雜。
      　　
      　　『英雄？怎麼突然聯繫我？是委託遇到麻煩了嗎，還是……受傷了？』古·拉哈·提亞的聲音一下子緊張了起來，話語間滿是刻在骨子裡的關切。
      　　
      　　「拉哈。」光的聲音有些發顫，心跳沉重得幾乎要從喉嚨裡蹦出來。
      　　
      　　『我在，怎麼了？』
      　　
      　　光深吸了一口氣，破罐子破摔地閉上眼睛大喊：「你之前說要和我一起踏上冒險的那個約定……到底是什麼意思？！」
      　　
      　　通訊貝的那頭傳來倒抽一口氣的聲音，隨後，平時沉穩的聲音難得添上明顯的慌亂，喉嚨發緊般的艱難詢問謹慎地傳來，『為、為什麼突然問這個……你聽誰說了什麼嗎？』
      　　
      　　「阿莉塞和雅·修朵拉！」光又羞又惱，按著通訊貝的手指都在發顫，「她們說……她們說那根本不是什麼普通冒險的約定！拉哈，你老實告訴我，你那時候說的『一起走』……」
      　　
      　　光的聲音漸漸微弱，小聲得幾乎聽不見，「……是真的只想冒險，還是……有什麼其他的……」
      　　
      　　通訊貝被逼問的另一端只剩下靜默，但在那之後，傳來的卻不是慌亂的否認。
      　　
      　　一聲極輕、極柔和的嘆息順著聲音的震動傳了過來。古·拉哈·提亞似乎換了個安靜的角落，關門聲落下後，他的呼吸逐漸平穩，那份在漫長歲月裡沉澱下來的坦然與深情，終於順著聲音一點一點包裹住光的心臟。
      　　
      　　『我的英雄……你覺得呢？』
      　　
      　　他的聲音很輕，卻異常從容。
      　　
      　　『這些約定對你而言，代表什麼意義？』
      　　
      　　「你還反過來問我！」光的耳朵燙得要命，忍不住咬牙切齒地低罵了一聲，「壞貓咪……這種事情為什麼不一開始就直接說清楚啊！」
      　　
      　　脫口而出的抱怨在風中散開，卻在下一秒化成了沉沉壓上胸口的酸澀。
      　　
      　　熱度褪去後，湧上來的全是不講理的自責。
      　　
      　　光靠著冰涼的石牆慢慢蹲下身，手掌捂住視線，恨不得直接拔出武器往自己遲鈍的腦袋狠狠一敲。
      　　
      　　他讓拉哈等了多久？
      　　
      　　說起來，自己根本連這一切從什麼時候開始的都毫無頭緒，他就這麼理所當然地享受著對方的陪伴，把那些只看向自己的目光、藏在眼底的期盼，全都粗神經地歸類成「崇拜」與「冒險夥伴」。
      　　
      　　一想到古·拉哈·提亞每一次笑著答應自己的隨口邀約時，心底可能都悄悄藏著沒被看穿的失落，光的心臟就一陣揪緊，聲音帶上壓抑不住的哽咽與懊惱。
      　　
      　　「……我到底都讓你一個人背著什麼啊……」
      　　
      　　通訊貝那一頭靜了片刻。
      　　
      　　隨即，傳來了一聲混雜著心疼的微弱嘆息，接著是輕柔的布料摩擦聲，彷彿跨越距離，那隻貓魅正無奈地伸手想要隔空摸摸光的頭髮。
      　　
      　　『就是不想造成你的困擾，才不直接告訴你的。』
      　　
      　　放低的嗓音透過通訊貝貼在耳廓，近得像他就伏在光的耳畔，溫熱的吐息混合著化不開的溫柔，和一絲小小的驕傲。
      　　
      　　『別擔心我。更漫長的時光都能等待，難道還會缺這點陪著你慢慢開竅的時間嗎？』
      　　
      　　「也不是這樣說……！」
      　　
      　　聽見英雄的抗議，貓魅笑出了聲，語調裡滿是縱容和無可救藥的沉淪，『反正約定早就定下了，你的身邊也注定只會有我。所以……就算英雄再遲鈍一點也沒關係。』
      　　
      　　那麼難攻取的心，花上一輩子的時間慢慢把它騙到手──這也是壞貓咪專屬的耐心和特權吧？
      　　
      　　最後這番話讓羞紅了臉的英雄溢出一聲微弱的嗚咽，含著通訊貝那頭貓魅縱容的輕笑，全被拂過的微風溫柔化開。
