  - body: |-
      　　巨蟹最後一次揮動鉗足時，沙地被刮出一道深深的痕跡，光側身避開，長靴踏過濺起的水花，手中長劍順勢劃下，將龐然大物生生逼退數步。
      　　
      　　身後傳來人們此起彼落的驚呼，原本用於祭舞的鈴聲與鼓點早已亂了節拍，以貓魅族為主的舞者們護著受傷的同伴退到岩石後，只剩領頭的那名女貓魅仍握著短刀，尾巴因緊張而繃得筆直。
      　　
      　　光沒有回頭，只低聲道：「退後。」
      　　
      　　話音落下，他已再度迎上前去。
      　　
      　　巨蟹的鉗足砸在地面，震得沙粒四散。光借勢躍起，武器落下時正中甲殼縫隙。怪物發出沉悶的嘶鳴，龐大的身軀終於失去平衡，轟然倒進潮水裡。
      　　
      　　落下的英雄毫髮無傷，僅被濺起的浪花僅打濕了衣角。
      　　
      　　四周安靜了一瞬，隨後，舞者們爆發出歡呼。
      　　
      　　「不愧是英雄大人！」她們一齊跑上前來，驚呼道：「剛才那一下真漂亮！」
      　　
      　　光收起武器，確認巨蟹不再動彈後，才轉身看向她們。
      　　
      　　「有人受傷嗎？」
      　　
      　　「只是擦傷，沒什麼大礙。」領頭的女貓魅走過來，尾巴已經放鬆了下來，耳朵卻仍因方才的驚險微微抖著。她上下打量了光一眼，忽然彎起漂亮的眼睛，「倒是英雄大人，剛剛看我們耳朵和尾巴的眼神，好像很新奇。」
      　　
      　　光一怔，他自認並沒有表現得太明顯，沒想到居然一下就被看穿了。
      　　
      　　但沒辦法，光所熟識的貓魅族，不是沉著冷靜的魔女，就是穩重可靠的水晶塔主人，他實在很少看見貓魅如此明顯的情緒，表現在他們的耳朵或尾巴上。
      　　
      　　「……我是認識幾位貓魅。」光斟酌著回答，「但確實談不上熟悉。」
      　　
      　　領頭的女貓魅聞言，瞇起細長的眼，像是聽見了什麼有趣的事。她回頭向同伴招了招手，不多時便有人從行囊裡翻出一本書，封皮有些舊、邊角也被翻得柔軟，足以顯見書本的悠久歷史。
      　　
      　　她將書塞進光手裡。
      　　
      　　「那這本送給您，當作謝禮。」
      　　
      　　光低頭看了看，書名大意是講述貓魅族的歷史、部族傳統與生活習性。他還沒來得及道謝，對方已笑吟吟地補上一句。
      　　
      　　「英雄大人什麼都懂，偏偏對貓魅這麼不熟悉可不行。拿著吧，將來若是遇上喜歡的女朋友，說不定用得著。」
      　　
      　　周圍幾名女貓魅聽了，跟著掩嘴笑起來，還紛紛朝他拋了幾個媚眼。
      　　
      　　光捧著那本書，神色仍舊平靜，只是沉默了片刻。
      　　
      　　女朋友是沒有。
      　　
      　　男朋友倒是已經有了。
      　　
      　　而且正巧，也是貓魅族。
      　　
      　　這句話他自然沒有說出口，只將書妥善收進懷裡，向她們點頭致意：「多謝，我會好好讀的。」
      　　
      　　

      　　
      　　回喪靈鐘的路上，天色已漸漸暗了。
      　　
      　　光騎在坐騎上，任由夜風拂過耳畔，那本書被他翻開擱在膝上，紙頁隨著行進微微顫動。
      　　
      　　他原本只是想看看女貓魅口中的「習性」究竟指些什麼，卻沒想到書中記載得相當細緻，從太陽之民與月之守護者的差異，到耳尾所表現出的情緒，再到部族裡「提亞」與「努恩」的稱謂，都一一列明。
      　　
      　　讀到「努恩」一節時，光的目光停了片刻，然後想起了古·拉哈·提亞，而後發現自己似乎從來沒用這個角度去思考他的稱謂。
      　　
      　　對他而言，古·拉哈就是古·拉哈，是曾以水晶公之名守望百年的人，是會在他歸來時笑著迎上前的人，也是偶爾會因一句直白的關心而耳尖泛紅的人。
      　　
      　　可書上的文字，令他不由自主地想起另一件事。
      　　
      　　和自己在一起的古·拉哈，大概永遠也不會走向那種被部族承認為努恩的道路。
      　　
      　　從另一個角度，這是否代表自己剝奪了他的未來？
      　　
      　　光闔上書，抬頭望向遠方喪靈鐘的燈火，陷入了沉思。
      　　
      　　回到石之家時，古·拉哈果然還沒睡。
      　　
      　　他坐在桌邊，面前攤著幾份資料，聽見門聲便抬起頭，紅色的眼睛在燈下亮了亮，連同耳朵也隨之輕輕一動。
      　　
      　　「你回來了。」古·拉哈放下筆，笑意還未完全展開，視線便落到光身上，「比預期的時間還晚，遇到什麼麻煩了嗎？」
      　　
      　　「恰巧看到一隻大螃蟹在襲擊人。」光說，「已經解決了。」
      　　
      　　「不虧是你，這種事情居然說得像是在路邊順手撿了一枚硬幣。」古·拉哈無奈地笑了笑，起身走近，「有受傷嗎？」
      　　
      　　光搖頭。
      　　
      　　古·拉哈伸手替他拍去肩上的砂礫，又檢查了一眼袖口的破損。光看著他低頭時露出的耳朵，想起書中某一頁寫著：貓魅的耳後與髮際附近較為敏感，若是親近之人以溫和力道觸碰，多半有安撫之意。
      　　
      　　他沉默地抬起手，指尖落在古·拉哈耳後時，對方整個人明顯僵了一下。
      　　
      　　「光？」
      　　
      　　光沒有立刻回答，只依著書上所說，動作很輕地揉了揉。古·拉哈的耳朵先是本能般抖了抖，隨後又忍耐似的微微壓低。他抬眼看光，臉上浮起一點困惑，與一點不太能藏住的紅。
      　　
      　　「今天發生什麼事了嗎？」
      　　
      　　「有人送了我一本書。」光一本正經地說，「是貓魅族的歷史和習性。」
      　　
      　　古·拉哈眨了眨眼，看著光從懷裡取出的書，看清封面後，表情從疑惑變成了微妙的了然。
      　　
      　　他忍了片刻，最後還是笑出了聲。
      　　
      　　「所以你剛才是在照著書……安撫我？」
      　　
      　　「嗯。」
      　　
      　　光坦然的反應逗笑了他的戀人。
      　　
      　　他低頭翻了幾頁，很快看見光曾停留過的地方。那一頁邊角被指腹壓出淺淺的痕跡，正好是關於提亞與努恩的記述。
      　　
      　　古·拉哈的笑意稍稍淡了一些，他抬頭看向光。
      　　
      　　「你在意這個？」
      　　
      　　而光沒有否認。
      　　
      　　屋裡的燈火很安靜，窗外偶爾傳來巡夜者的腳步聲，遠遠的，又很快消失。
      　　
      　　「我只是想，」光低聲道，「你和我在一起，就不會成為努恩了。」
      　　
      　　古·拉哈望著他，眼神慢慢柔和下來。
      　　
      　　「光。」他輕聲喚他，語氣裡沒有半點責怪，反而帶著一點笑，「我曾經以為自己連名字都不會再被人喚起，也曾以為，我只能在遠處目送著你繼續走下去。」
      　　
      　　他伸手覆上光的手背，親暱地捏了捏。
      　　
      　　「如今的生活對我來說，已是遠比任何稱號都重要的珍寶。」
      　　
      　　古·拉哈笑了笑，耳尖仍殘留著一點紅，坦然地直視著他的目光。
      　　
      　　「而且，努恩這種事，原本就不是每個提亞都非要追求不可。」他停頓了一下，聲音放輕，「我不需要一個部族來證明我屬於哪裡。」
      　　
      　　他握緊光的手。
      　　
      　　「不如說，我知道我屬於哪裡。」
      　　
      　　光的指尖動了動，重新撫過他耳後柔軟的髮。這一次古·拉哈沒有僵住，只是輕輕瞇起眼，又稍微偏過頭，讓耳後更貼近光的手指。
      　　
      　　過了一會兒，古·拉哈才忽然意識到自己剛才的反應。他慌忙睜開眼，耳朵微微一豎，試圖恢復平日裡可靠又沉穩的模樣。
      　　
      　　「不過，」他欲蓋彌彰地清了清嗓子，「書上寫的東西也不能全信。貓魅之間個體差異很大，並不是所有記載都能套用在我身上。」
      　　
      　　光低頭看了看自己的手，又看了看古·拉哈方才被摸得微微垂下的耳朵。
      　　
      　　古·拉哈順著他的目光反應過來，耳尖頓時更紅了。
      　　
      　　「……至少不能全信。」
      　　
      　　光點頭，語氣依舊認真：「那哪些可以信？」
      　　
      　　古·拉哈與他對視片刻，終於敗下陣來，尾巴在身後不自在地晃了一下。
      　　
      　　「耳後……可以。」他小聲說，「力道像剛才那樣……就很好。」
      　　
      　　光記下了。
      　　
      　　「還有？」
      　　
      　　「沒有了。」
      　　
      　　光皺起眉，一臉的不相信。
      　　
      　　他翻開書，指著其中一段：「這裡寫，貓魅在疲憊或情緒緊繃時，若是信任的人替他梳理頭髮和耳周，也能放鬆。」
      　　
      　　古·拉哈低頭看了一眼，有些後悔自己沒有及時把書收起來。
      　　
      　　「那是很籠統的說法。」
      　　
      　　「所以，這個你不喜歡？」
      　　
      　　古·拉哈一時語塞。
      　　
      　　他想說也不是不喜歡，只是被光這樣一本正經地逐一詢問，彷彿被人赤裸裸地攤開來審視，實在讓人難以招架。偏偏他很清楚，光的神色非常認真，態度也十分慎重，一連串行為的動機，只不過是想更加了解自己。
      　　
      　　於是古·拉哈沉默片刻，最後輕輕嘆了口氣。
      　　
      　　「……不是不喜歡。」
      　　
      　　光的眼睛似乎亮了一點，看起來還有點高興。
      　　
      　　古·拉哈立刻補充：「只是不可以在別人面前做。」
      　　
      　　光很想詢問會發生什麼事，但看見眼前貓魅的認真神色，只得吞了吞口水。
      　　
      　　「我會盡量。」
      　　
      　　「不是盡量。」古·拉哈抬手按住書頁，語氣嚴肅了些，「是不能。」
      　　
      　　光安靜片刻，然後乖乖點頭。
      　　
      　　「好，不能。」
      　　
      　　古·拉哈這才鬆了口氣。
      　　
      　　然而下一刻，光便伸手取過桌邊的梳子，大有立即實踐的氣魄。
      　　
      　　「那我可以試試嗎？」
      　　
      　　古·拉哈看著那把梳子，耳朵輕輕抖了抖。
      　　
      　　理智上，他覺得自己應該拒絕，畢竟他剛剛才強調不能照本宣科，現在若是答應，未免顯得太快妥協。
      　　
      　　可光站在他面前，手裡拿著梳子，眼神平靜而期待，這讓古·拉哈實在說不出拒絕的話。
      　　
      　　「只試一下。」他說。
      　　
      　　光乖巧地點頭。
      　　
      　　古·拉哈在椅上坐下，背對著他。這個姿勢讓他莫名有些緊張，尾巴下意識地繞到身側，尾尖輕輕搭在膝邊。光站到他身後，先用手指替他理開被燈火烘得微暖的髮絲，動作比他想像中還要輕。
      　　
      　　梳齒落下時，沒有扯痛，只緩慢地順過髮尾。
      　　
      　　古·拉哈原本挺直的肩膀不知不覺放鬆了些。
      　　
      　　「這樣可以嗎？」光問。
      　　
      　　回答他的是輕微的點頭，光便又梳了一下。
      　　
      　　屋內只剩梳齒穿過髮絲的細微聲響。古·拉哈盯著桌上的書頁，視線卻漸漸失了焦。他白日裡其實也奔波了一陣，直到此刻才後知後覺地感到疲倦。光的手掌偶爾擦過他的耳側，帶來一點暖意，彷彿能輕易接住他的全部。
      　　
      　　古·拉哈的耳朵慢慢放鬆下來。
      　　
      　　光看見了，卻小心翼翼不敢驚動，只是繼續替他梳著髮。
      　　
      　　不知道過了多久，古·拉哈忽然開口：「這本書的內容不少，你該不會在路上就讀完了？」
      　　
      　　「嗯。」
      　　
      　　古·拉哈輕笑了一聲：「英雄回喪靈鐘的路上，不休息，不吃東西，只低頭研究貓魅族習性？」
      　　
      　　光手上的動作停了一瞬。
      　　
      　　「她們也有送我食物，是慶典的水果。」
      　　
      　　古·拉哈偏過頭看他：「一邊看書一邊吃？」
      　　
      　　光沒有立刻回答。
      　　
      　　古·拉哈從他的沉默裡得到了答案，笑意更深：「你還真是……」
      　　
      　　他話沒說完，光已伸手扶住他的下巴，輕輕把他的臉轉了回去。
      　　
      　　「別動，會扯到頭髮。」
      　　
      　　古·拉哈怔住，縮了縮肩膀，光從他下巴離開的手指還發著熱，更慢慢蔓延開來。
      　　
      　　「……知道了。」
      　　
      　　光又替他梳了幾下，隨後注意到垂在身後的長尾。
      　　
      　　他忽然問：「尾巴呢？」
      　　
      　　古·拉哈幾乎嗆住：「什麼？」
      　　
      　　光看向書頁：「書上寫，尾巴受驚或沾到異物時，貓魅通常不喜歡旁人碰，但若是親近的人——」
      　　
      　　「那一頁可以跳過。」
      　　
      　　「為什麼？」
      　　
      　　「因為尾巴很敏感。」
      　　
      　　「所以不能碰？親近的人也不行嗎？」
      　　
      　　古·拉哈沉默了，這種問法，他怎麼可能拒絕。
      　　
      　　搭在膝邊的尾巴，尾尖不受控制地動了動。
      　　
      　　「……有先問的話，比較不會嚇到。」他低聲說。
      　　
      　　「那現在，可以嗎？」
      　　
      　　古·拉哈回頭看他，眼神裡有一點無奈，也有一點縱容的羞赧。
      　　
      　　「你今天學得太快了。」他埋怨道，但並不是真的生氣，更多的是害羞。
      　　
      　　光想了想，說：「我還想知道更多。」
      　　
      　　古·拉哈的耳朵一下子立了起來。
      　　
      　　直白的心意像顆炙熱的太陽，毫無遮掩地撞了過來，他只能重新轉回去，抬手遮住嘴角，聲音輕得幾乎聽不清。
      　　
      　　「……可以碰一下尾尖。」
      　　
      　　光放下梳子，俯身看向他的尾巴。
      　　
      　　古·拉哈的尾巴比方才更僵了些，尾尖卻還是自行挪到光手邊。光沒有立刻握住，只先用指背輕輕碰了一下。
      　　
      　　隨後，他感受到前方的貓魅微微一顫。
      　　
      　　「不舒服？」
      　　
      　　「不是。」古·拉哈支支吾吾地說，「只是有點癢。」
      　　
      　　光便放輕了力道，指尖順著尾尖的毛輕輕撫過。古·拉哈的肩膀緊了一瞬，又很快放鬆，尾巴沒有縮回去，就這麼留在他掌心裡，輕輕地勾了勾。
      　　
      　　光若有所思地望著手掌，隨後突然低聲說道：「謝謝。」
      　　
      　　古·拉哈偏了偏頭。
      　　
      　　「我覺得我好像更了解你了。」光認真地喃喃：「書上寫了，貓魅尾巴放鬆時，代表是面對信任的人，或是心情很好、周圍很安全。」
      　　
      　　古·拉哈將臉埋入了手掌。
      　　
      　　光立刻補充：「我沒有太相信書裡寫的，只是剛好想起來。」
      　　
      　　古·拉哈轉了過來，抬起眼，盯著他看了片刻。
      　　
      　　「光，你真的不適合說謊。」
      　　
      　　光沉默了一下，坦然從寬。
      　　
      　　「抱歉。」
      　　
      　　古·拉哈嘆著氣笑了，他抬手戳了一下光的額頭，力道很輕，與其說責備，不如說親暱。
      　　
      　　「下次可以直接問我。」古·拉哈說，「會比書準確。」
      　　
      　　「好。」
      　　
      　　光認真地點頭。
      　　
      　　古·拉哈望著他，心口柔軟得不像話，他忍不住伸手，主動握住光的手，將他的手掌重新帶到自己耳側，隨後用耳朵輕蹭著他的手掌。
      　　
      　　那是一個很小的動作，卻讓光內心熱了起來。
      　　
      　　於是光低下頭，在他耳畔落下一個很輕的吻。
      　　
      　　古·拉哈的耳朵猛地一顫，拍打著光的嘴角。
      　　
      　　「這個書上一定沒寫。」他低聲嘟囔。
      　　
      　　光停了一下：「不可以？」
      　　
      　　古·拉哈抬眼看他，紅眸裡映著燈火，像盛著一點藏不住的笑。
      　　
      　　「不會，這個我也很喜歡。」
      　　
      　　光便又吻了一下。
      　　
      　　這一次吻落在耳尖附近，比方才更輕，像怕驚動什麼。古·拉哈的尾巴在身後蜷了一下，又慢慢放鬆。他抬手攥住光的衣襟，聲音很沙啞。
      　　
      　　「……你學得真的太快了。」
      　　
      　　「你說過要問本人。」光說，「那我可以再親你嗎？」
      　　
      　　古·拉哈看著他認真的神情，終於笑了出來。
      　　
      　　「這個不用問。」他踮起腳，主動吻上光，「只要是你的話，一定都可以。」
      　　
      　　他的額頭抵著光的額頭，呼吸仍有些亂，卻笑得很輕。
      　　
      　　「這也是本人給出的答案。」
      　　
      　　光看著他，認認真真道：「我記住了。」
      　　
      　　貓魅笑了笑，隨後靠上他的懷裡，不再掩飾的尾巴繞上光的小腿，輕輕搭住了他。
      　　
      　　光沉下了眼，對上耳朵發燙的古·拉哈，後者對他的視線漾起些許困惑。
      　　
      　　「書上還有寫，」低沉的聲音近在耳邊，讓他渾身發顫，「當尾巴勾住親近的人，這是邀請的意思。」
      　　
      　　「什麼？」
      　　
      　　不等古·拉哈反應過來，光的手就從膝蓋後方繞了過去，輕易將人抱了起來。
      　　
      　　「等等、光！」
      　　
      　　抗議的聲音被唇盡數堵住，而那本被遺落在桌上的書，已經無法教光更多。
      　　
      　　因為接下來的一切，他打算從古·拉哈身上親自感受。
