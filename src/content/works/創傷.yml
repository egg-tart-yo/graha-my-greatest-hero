  - title: 第一章
    body: |-
      　　明知那雙紅眼總是追逐著自己的身影，他卻不得不選擇遠離那道視線。

      　　
      　　就算列舉英雄所有歷經過的戰鬥，天外天垓的決戰依然稱得上是凶險的一役。歸來後的光幾乎是忍著口中的鐵鏽味，由桑克瑞德攙扶、越過所有歡呼的人群，才好不容易撐回巴爾德西昂分館。
      　　
      　　在那之後，從末日中拯救世界的英雄陷入深眠了一段時間，就算甦醒也只為了短暫的進食，便又沉沉睡去。
      　　
      　　過程中發生了什麼事也記不太清了，光只隱約覺得自己的床邊似乎總有人陪伴──譬如薩雷安哲學家議會安排的治癒師、各國元首前來探望的使者、吵吵鬧鬧的一眾海盜與空賊，還有帶著霜雪的福爾唐之子與夾雜烈日的阿拉米格總指揮官。
      　　
      　　而其中，那抹紅色的身影，似乎從未離開過。
      　　
      　　
      　　***
      　　
      　　
      　　沉睡期間，光總是做著夢。
      　　
      　　在夢裡，他又會回到比深淵還漆黑的夜空，直面謳歌終結之物。眾人試圖反擊、也一同合力攻擊，但來自宇宙眾星匯集而成的絕望在潛能量的空間裡無比強大，光只能眼睜睜地看著同伴一個個倒下，卻找不到反擊的縫隙。
      　　
      　　『前進的同時，要保護好他們喔。』
      　　
      　　弗里多拉的柔聲勸告令他心急如焚，握緊了武器、不斷思考著，攻擊卻也在同一時間轉向自己。
      　　
      　　夢的最後，視野前方只剩下那人張開翅膀、替自己擋下攻擊的背影。那一幕與另一名騎士曾經架盾守護的身影重疊，連同害怕失去的恐懼與無能為力的痛楚，一併狠狠撞進光的心底。
      　　
      　　他總是在這一瞬間猛地睜眼，耳邊都是自己震耳欲聾的心跳聲，清澈的藍眼滿是尚未散去的驚慌，直到視線落在床邊趴睡的身影時，才稍稍鎮靜下來。
      　　
      　　古·拉哈·提亞似乎是累極了，他坐在床邊，枕著自己的手臂，睡得很沉。光靜靜看了他片刻，才緩緩伸出手，指尖輕輕擦過他臉頰上那道曾被黑羽劃出的傷口。
      　　
      　　明明自己也是傷痕累累，為什麼總是守在這呢。
      　　
      　　光無聲地嘆了口氣。
      　　
      　　就在這時，他忽然注意到古·拉哈·提亞趴著的床面下，壓著幾張紙。光小心翼翼地將它們抽出，盡可能不驚醒對方，卻在瞥見紙上的內容時，瞳孔猛然一縮。
      　　
      　　紙上滿是古·拉哈·提亞工整的筆跡。
      　　
      　　那看起來像是研究手稿，分門別類地記錄著末日之戰的細節。每一次攻擊的軌跡、乙太流動的變化、防禦時機的誤差，全都被一筆一劃地寫了下來。
      　　
      　　而最讓光無法呼吸的，是其中一段被反覆圈起、刪改過無數次的文字。
      　　
      　　那裡計算著面對那一擊時該如何架起防禦，更記錄著變換其他攻擊手段的各種可能。最後圈起的幾行字筆觸格外用力，一旁甚至暈染著幾點筆尖反覆敲打著的墨痕，像是書寫之人早已下定決心，無論如何都得尋求的解答。
      　　
      　　『下次一定能防住。』
      　　
      　　文字像是火焰般灼燒著，光痛苦地閉上了眼睛，握著紙張的手控制不住地顫抖起來。
  - title: 第二章
    body: |-
      　　待他回過神，那人的身影早已悄悄遠去。

      　　
      　　貓魅紅耳在長廊響起腳步聲時輕輕一動，古·拉哈·提亞從幾乎要將自己掩埋的驚人書堆抬起頭，朝推門而入的可露兒露出笑容。與此同時，他手中振筆疾書的動作也依然持續著。
      　　
      　　看著這副工作狂的模樣，可露兒揚起無奈的微笑，一邊徒勞無功地勸道：「又忘了吃飯……休息也是工作的一環啊。」
      　　
      　　「別擔心，這份文件的解析就快完成了，告一段落我就去。」
      　　
      　　朝氣十足地回應後，眼前的青年又再度垂下頭，埋首於紙頁之間。
      　　
      　　不得不說，有古·拉哈·提亞的幫助，巴爾德西昂委員會的重建工作進展極佳。貓魅青年學識淵博，對知識的探究更有著驚人的毅力，常常一頭栽進某個主題便廢寢忘食，完全不愧於薩雷安賢人的名號。
      　　
      　　若是任何人看見這樣充滿熱誠的古·拉哈·提亞，或許都會如此認為吧，但繁忙工作底下的心聲，只有擁有超越之力的可露兒才會知曉。
      　　
      　　例如，隱藏起來、強忍著的寂寞。
      　　
      　　同為拉加夫爺爺收養的人，巴爾德西昂委員會對他們而言的意義自然與旁人不同。重建的確是重要的工作，但可露兒也很清楚，古·拉哈·提亞為了能與那個人一同冒險所做出的努力。
      　　
      　　即使忙碌，還是會抽空去迷津鍛鍊身手、在大書庫研習能應付各種狀況的魔法，還有無論去到哪，都不曾離身的通訊珠。
      　　
      　　儘管它從未響起過。
      　　
      　　身為水晶公時，他早已經歷過百年的等待，因此可露兒不意外古·拉哈·提亞會選擇沉默，她所能做的，也僅是在夜深人靜時，輕聲問上一句。
      　　
      　　「拉哈君，現在這樣……真的好嗎？」
      　　
      　　而貓魅青年總是平靜地笑笑，身後長尾的尖端微微勾起，左右輕輕搖晃。
      　　
      　　「嗯，這樣就好。」
      　　
      　　
      　　自拂曉解散、喪靈鐘一別，他們就再也沒見過那名英雄。
      　　
      　　其他偶爾來訪的同伴，會帶來一些關於他的消息。內容有時只是英雄正在替塔塔露跑腿，或是跟著漁船出海，到遠洋垂釣；有時則是前往曾遭末日侵襲的地方，探訪受傷的人們；甚至也有遠赴黃金港，協助東方的君主重建土地的消息。
      　　
      　　乙太之光閃耀之處，遍佈那人的足跡，卻始終不曾踏訪於舊薩雷安。
      　　
      　　坦白說，古·拉哈·提亞雖然隱約明白，那名英雄並不打算與他見面，卻始終想不出原因。
      　　
      　　是因為末日之時，他不顧反對，擅自做下那個約定嗎？
      　　
      　　畢竟一向溫柔的英雄，當時少見地露出了嚴厲神色，堅決拒絕古·拉哈·提亞想採取的行動。但以當時的狀況，古·拉哈·提亞相信那是唯一的辦法，就算重來一次，他的決定也不會改變。
      　　
      　　只要能幫助他向前邁進，那就是最好的選擇。
      　　
      　　每當內心默念著這句曾支撐著自己百年的信念，紅髮貓魅總是用力甩甩頭，握緊拳頭、給自己加油打氣。
      　　
      　　現在這樣也沒關係。
      　　
      　　他可以趁這段時間好好鍛鍊自己。這樣一來，等到下次，若他們真的還有機會一同踏上冒險，或許自己也能派上更多用場吧。
  - title: 第三章
    body: |-
      　　兩人刻意拉開的距離感，身旁的夥伴們早就看出來了。

      　　剛經過喪靈鐘的門衛，光便感受到來自天台上方一道十分明顯的視線。他抬起頭，對上雅·修朵拉似笑非笑的神情，以及尤里安傑注視而來的目光。才剛萌生隱入建築陰影、趁機逃走的念頭，肩膀就突然被人重重拍了一下。

      　　「難得回來，一起喝一杯？」

      　　雖說是問句，順勢攬住英雄的力道卻不容拒絕。光默默嘆了口氣，也只能跟著桑克瑞德往天台走去。

      　　然後就被按著肩膀坐了下來，手裡還被塞了一杯茶。

      　　「看你的方向，是從銀淚湖回來。該不會去了第一世界？」

      　　「呃，倒沒有跑那麼遠。」

      　　面對桑克瑞德好奇的目光，英雄撇開眼，猶豫著是否該坦白自己只是去找克林託塔比拼九宮幻卡。一旁的雅·修朵拉輕啜了口茶，語調輕鬆地調侃道。

      　　「怎麼？想問琳的消息嗎？」

      　　一口熱茶差點嗆到，緩過氣的青年沒好氣地解釋：「我只是有點擔心空無大地的狀況。」

      　　「哎呀，是這樣嗎？」雅·修朵拉笑了笑，晶亮的眼睛又落回光的身上，「但『水晶公』又不在那裡，我們的大英雄沒事應該不會回去的。」

      　　話一出口，這下嗆到的人從一位變成了兩位。一旁的尤里安傑連忙伸手拍拍兩人的背，也跟著揚起微笑。

      　　「說起來，沒想到大家又這麼快聚在一起……」

      　　語氣溫柔的精靈想起當時在背水咖啡廳的談話，淺色的眼睛注視著光，柔聲問道：「如今末日之劫已經結束，我還以為『你們』會立刻踏上下一段旅程。」

      　　光咳嗽的肩膀不自然地震了一下。他抬起頭，這才發現三人都沉靜地盯著他看。

      　　不用說，他自然清楚尤里安傑口中的另一人是誰。但現在的英雄也只能撇開視線，語氣生硬地給出解釋。

      　　「拉哈他……不是要留下來幫可露兒的忙嗎。」

      　　「說是這樣說，」桑克瑞德搖晃著手中的酒杯，朝光擠了擠眼，語氣輕鬆道：「但如果是你親口邀約，我想他就算排除萬難，也一定能擠出時間的。」

      　　聞言，光繃緊的神色瞬間沉了下來。

      　　若是換作旁人，看見英雄此刻的神情，大多會急忙繞道迴避。但正因面前的三人都是從冒險初期便一同戰鬥至今的夥伴，才會如此直言不諱。雅·修朵拉甚至露出微笑，她靠著桌面，向前傾身，調笑著說：「真沒想到，英雄也有如此不坦率的時候。」

      　　貓魅清透的眼睛直直望向光。後者沉默許久，終是嘆了口氣。

      　　「我不知道……該怎麼說。」

      　　言詞表達一向不是他的強項，好在三人也沒有催促，只是靜靜地等待著。

      　　光深深吸了口氣，雙拳不自覺地握緊。蔚藍的眼睛一一望過眼前這些出生入死的夥伴，最後苦澀地低語。

      　　「我只是不希望再看到你們出事。」

      　　回顧這段拯救末日、尋找希望的旅程，他其實一直都感到如履薄冰。

      　　光很清楚，拂曉血盟的同伴們都不是弱者，但他們面對的敵人實在過於強大。自加雷馬一戰、自己被奪去身體時，那股強烈的無力感便不斷席捲著他──快一點、再快一點，無法奔跑就努力行走，甚至重傷倒地，也用雙手拖行著身體前進。他深怕自己晚了一步，就再也來不及保護自己的同伴。

      　　但即使已經拼盡全力，在天外天垓，他仍只能仰賴夥伴們以犧牲鋪出的道路，才能繼續向前邁進。若不是兩任阿謝姆贈與的禮物，光根本無法尋回那些失去的夥伴。

      　　他們是受到了眷顧，才能再度團聚在一起。中間哪怕缺失任何一個環節，都會造成截然不同的後果。

      　　正因為得來不易，他才更加小心翼翼。

      　　而在其中，某位曾多次宣告可以隨意犧牲自己、換取大局的傢伙，更讓光無法再輕易讓他暴露在危險之中。

      　　衡量之下，英雄寧可選擇獨自繼續他的旅程。

      　　垂著頭的光也不曉得，自己內心這般紊亂的思緒究竟能傳遞多少。心一橫的他索性想到什麼就說什麼，就算這番言論會讓夥伴們覺得自己軟弱，或者不符合「英雄」該有的想法，也無所謂。

      　　但出乎意料，其他三人的神色除了驚訝，甚至還帶著些許欣慰。

      　　「這可真是……」

      　　率先打破沉默的桑克瑞德難為情地搔了搔頭，喃喃道：「都怪我們，對你實在託付太多，居然把你逼成這樣。」

      　　「不，也不是這個問題……」

      　　「我很開心你願意說這些。」同樣笑著的尤里安傑接過了話，「如此敞開心胸，才更顯得大家像是同伴。」

      　　「我們本來就是同伴。」

      　　「喀」的一聲，雅·修朵拉將茶杯放回瓷碟，打斷了三人雞同鴨講的對話。她偏過頭，手指點著臉頰，勾起笑容，緩緩開口：「既然這樣，你不是更應該看著那孩子嗎？」

      　　語畢，光的眼睛微微睜大。貓魅魔女的笑容也越來越深，她忽略一旁不斷交換眼神的兩位男子，再度向前傾身，壓低嗓音說道：「說起亂來的程度，你們兩位可算是半斤八兩……我聽可露兒說，他在舊薩雷安也沒怎麼好好照顧自己喔。」

      　　「啊，塔塔露也這麼說過。」不愧是認識多年的夥伴，桑克瑞德很快便反應過來雅·修朵拉的意圖，在一旁幫腔：「某人的工作疲勞程度，可是和當水晶公時不相上下。明明已經不是水晶塔的終端了，哪吃得消啊。」

      　　而尤里安傑雖然視線飄移，卻也跟著提議。

      　　「不如由你選擇一個放心的地點，帶他出門走走吧。」他輕柔的語調，像是最後一支利箭，切切實實地打中了英雄的內心，「帶他好好看看，這個犧牲『水晶公』的未來，才換得的美好世界。」

      　　「……」

      　　複雜的情感讓光覺得頭疼不已，但剛才聽到的一字一句，都讓他的內心燃起無名的火，迫切地想做些什麼。

      　　那個傻瓜！

      　　明明自己受傷也不輕，不好好休息怎麼行！

      　　「熱茶多謝，我先走了！」

      　　行動永遠比言語更快。三人才剛眨眼，英雄便已單手翻過城牆，縱身一躍往乙太之光衝去。與此同時，右手也已搭上耳邊的通訊珠。

      　　「哎呀哎呀……」

      　　將自己摔回座位的桑克瑞德斜眼望著微笑的雅·修朵拉，一邊感嘆著：「不愧是魔女，連大英雄都能玩弄於股掌之間。」

      　　「嗯？我以為你會認同這個方式。」後者優雅地啜了口茶，一邊端詳著他，緩聲問道：「畢竟你們都是『守護者』。對於某個孩子的堅強意志，都會選擇陪伴到最後一刻吧。」

      　　「嗯，對琳也是這樣呢。」

      　　面對精靈與貓魅的調侃，人族青年不置可否地笑了笑，又朝英雄離去的方向揮了揮手。

      　　
      　　**

      　　而在遙遠的另一邊，因通訊珠響起而不小心打翻成堆書籍的紅髮貓魅，正慌忙地從書堆中鑽出來，一邊試圖解釋自己這側的一片混亂。

      　　「英、英雄？不不，別在意……只是書翻倒了，沒事的！」

      　　他在一片狼藉中正襟危坐，連貓尾都驚得微微膨起，語氣裡是難掩的慌亂與興奮。而自己這番反應似乎逗笑了通訊另一側的冒險者，他垂著耳，屏住呼吸，小心翼翼地問。

      　　「怎麼突然聯繫我？有什麼我可以幫上忙的嗎？」

      　　而通訊珠的另一邊，是語氣過分溫柔的輕笑。

      　　『有個地方，我想帶你去看看……有時間嗎？』

      　　「……當然！」
  - title: 第四章
    body: |
      　　跟加雷馬的霜雪相比，伊修加爾德似乎沒有那麼凍人。
      　　
      　　兩道身影在雪地中緩步前行，其中一人望著旅伴將臉藏在兜帽底下的模樣，忍不住皺起眉，伸手替他撥開帽沿，可指尖才碰上布料，又顧忌著風雪太冷，終究沒有將兜帽完全掀起，只小心地拉開一角，讓明亮的紅眼從陰影中露了出來。
      　　
      　　他們挨著彼此抵達大審門，神色嚴肅的守門人在看見來那雙蔚藍的眼睛時，恭敬地行了騎士禮。光回過身，正好看見古·拉哈·提亞仰頭望著兩旁莊嚴的騎士石雕，眼神裡透著些許難以言明的感慨。
      　　
      　　「第一次來這裡的時候，我們也是走一樣的路。」
      　　
      　　為了不引起守門人起疑，他刻意壓低了嗓音，側耳傾聽的光很快便意識到，那是只有古·拉哈·提亞經歷過的、另一個未來。
      　　
      　　「當時的伊修加爾德……怎麼說呢，已經完全是戰場的模樣了。」
      　　
      　　第八靈災導致的戰亂席捲全艾奧傑亞，連冰雪之國也未能倖免，好不容易從龍詩戰爭中解放、才剛踏上修復之路的國度，就這麼再次化為斷垣殘壁。
      　　
      　　「但你們還是來到了這裡，一起尋找希望。」
      　　
      　　光伸出手，將古·拉哈·提亞從回憶中拉了出來。他牽著他，一同越過高聳的石廊。
      　　
      　　「和當時的我、阿爾菲諾，還有塔塔露一樣。」
      　　
      　　「……啊啊，確實呢。」
      　　
      　　古·拉哈·提亞凝視著光握住自己的手，又望向他走在前方的背影，艷紅的眼睛在一瞬間黯淡了幾分。
      　　
      　　那是股難以形容的直覺。
      　　
      　　他總覺得英雄懷有心事，加上前陣子兩人之間那段說不清道不明的疏離，更讓他心底始終有些惴惴不安。只是，既然這趟旅行是光主動邀約，而他又像是早已決定好目的地一般，步伐沒有半分遲疑，古·拉哈·提亞自然沒有拒絕的理由。
      　　
      　　他任由對方牽著自己，走進這座曾在記憶裡無數次化為廢墟的城市。
      　　
      　　踏入國門後，高聳的建築總算替他們遮蔽了些風雪。雲霧街的許多居民都認出了英雄的身影，紛紛向他表示歡迎，同時也對身旁的同行者投來好奇的目光。
      　　
      　　「真難以想像，這是曾長年鎖國的國度。」
      　　
      　　看見居民熱情的模樣，古·拉哈·提亞的神情滿是敬佩。正當他打算繼續往前，光卻輕輕拉了拉他的手，朝右側的木梯走去。
      　　
      　　「往這邊。」
      　　
      　　光帶著他穿過木橋，又熟練地從縫隙間往下一躍，回頭確認貓魅青年也跟著落地後，才再度向前邁進。
      　　
      　　「有個地方，我一直都想帶你來看看。」
      　　
      　　光側過身，與守門人打了聲招呼，便熟門熟路地推開大門。
      　　
      　　「──歡迎來到蒼天街。」
      　　
      　　
      　　
      　　映入眼簾的，是古·拉哈·提亞在過去從未於冰雪之國見過的繁榮街道。
      　　
      　　腳下是厚實而平整的石磚，眼前寬大的廣場周圍佈滿各式熱鬧的攤位，在廣場與交錯著的街道後方，則是規劃方正的居民建築，與高聳的公用機關與神殿。即使這座城市大多由霜白的雪與灰色石材構成，人們仍在屋簷、路燈與攤棚之間掛上大量氣球與彩帶，將整片街區妝點得明亮而熱鬧。
      　　
      　　周圍滿是衣著輕便的居民與貴族，其中甚至能看見龍族的身影，每個人看起來都相當興奮，有人手中捧著禮物，有人牽著孩子穿梭於攤位之間，也有人正站在街邊與飛翔在空中的幼龍交談。
      　　
      　　古·拉哈·提亞眨了眨眼，忽然覺得眼眶有些發熱。
      　　
      　　這座充滿生氣的城市，與他記憶裡遭戰火襲擊的伊修加爾德截然不同，不再滿地屍首與殘骸，也不再只有戰火的爆炸聲與士兵的紛爭，這裡的貴族與平民、人類與龍族，是真的共生於同一片蒼天之下。
      　　
      　　即使他曾透過書中知曉這樣的未來，親眼所見卻感到更為震撼。
      　　
      　　貓魅青年貪戀地環顧四周，渾然沒有注意到英雄早已放開了他的手，走向一旁與一名貴族交談，與此同時，身邊突然出現一股陌生的氣息，出聲打斷他的思緒。
      　　
      　　「歡迎來到伊修加爾德，英雄的同行者。」
      　　
      　　一名渾身艷藍的大象不知何時站在他身邊，語氣親切地招呼，看見古·拉哈·提亞驚訝的神情，又和善地解釋：「我是這裡的守衛……請不要懷疑，我不是什麼可疑的人，周圍也有很多像我一樣的人喔。」
      　　
      　　聞言，他順著大象的示意向前看去，的確發現了幾名穿著動物布偶裝的工作人員，正在主持不同的活動。然而紅眼很快往下移，落在大象腰間那柄散發冷光、裝飾華麗的佩劍上，又有了新的困惑。
      　　
      　　這麼高階的裝備，真的只是民宅街道的守衛？
      　　
      　　然而，大象並沒有解釋的意圖，只是側過身、注視著英雄的背影。
      　　
      　　「沒有英雄帶來的改變，這座城市不會有如今的模樣。」成熟的語調很輕，但其中包含的感謝之情，真切地傳達到貓魅青年的耳裡，「將伊修加爾德從千年的戰爭中解放，又親自參與蒼天街的復興計畫，協助引導平民給予我們信任，還幫忙與三都牽線、引入商業的交流……」
      　　
      　　「甚至今日慶典的食物，也是源於英雄之手喔。」
      　　
      　　自顧自說著的大象又轉向古·拉哈·提亞，雖然隔著一層布偶裝扮，但古·拉哈·提亞確信，對方此刻一定與周圍的人民一樣，帶著富足的笑容。
      　　
      　「請好好享受這個從戰爭中復甦的城市。」
      　
      　　古·拉哈·提亞也輕輕笑了起來。
      　　
      　　「謝謝，我會的。」
      　　
      　　沒有再多說什麼，藍色大象便轉身隱入人群。古·拉哈·提亞若有所思地望著他消失的方向好一會兒，才回過頭，朝歸來的英雄露出笑容。
      　　
      　　「拉哈，你在看什麼……你說藍色大象？」
      　　
      　　光困惑地朝他們的身後張望，一邊咕噥。
      　　
      　　「沒想到你居然能和他說上話……我遇到他的時候，好幾次在他眼前揮手，但他從來都不理我。」
      　　
      　　「什麼？但聽起來，他對你很熟悉。」
      　　
      　　「是嗎？」光眨了眨眼，隨即像是想起什麼似的，又握住了他的手腕，掌心的溫度隨即傳了過來，「先別說這個了，我們開始吧。」
      　　
      　　「怎麼了？要去哪？」
      　　
      　　蔚藍的眼睛望向困惑的紅眼，彎成一輪弦月。
      　　
      　　「參加慶典阿！」
      　　
      　　
      　　
      　　歡騰的氣氛在不知不覺間，暫時沖淡了兩人各自懷著的心事。
      　　
      　　從剃犛牛毛的體驗活動開始，他們就被伊修加爾德的風打亂了好幾次節奏。被吹亂的毛團在半空中亂飄，古·拉哈·提亞試圖用手壓住，卻反倒被細毛沾了一身；光則難得露出嚴肅得近乎決戰前夕的神情，努力與手中那把不怎麼聽話的工具搏鬥。
      　　
      　　結果自然不怎麼理想。
      　　
      　　最終兩人的結算成績都稱不上好看。之後分發禮物時，光又因被熟識的孩子認出而被團團包圍，原本預計好的進度就這麼被耽擱了不少。
      　　
      　　等兩人好不容易脫身，站到參加獎品的兌換板前，看著上頭那串要求驚人的積分時，光與古·拉哈·提亞沉默了好一會兒，居然不約而同地動起了耍小聰明的念頭。
      　　
      　　「等等開箱子的活動，用魔法把周圍的箱子都刮來怎麼樣？」
      　　
      　　「雖然可能會惹哭小朋友，但技術上應該是可行的……」
      　　
      　　兩人壓低聲音交談，神情認真得彷彿正在策劃什麼拯救世界的作戰，渾然不知他們身後正站著一名穿著陸行鳥布偶裝的導覽員，插著腰，從頭到尾聽完了這場毫無羞恥心的犯罪計畫。
      　　
      　　片刻後，導覽員笑吟吟地將兩人請出了活動會場。
      　　
      　　古·拉哈·提亞垂下的耳朵，足以顯見青年此刻的情緒。光看了他一眼，又環顧四周，很快找到了補救辦法。
      　　
      　　「走吧。」
      　　
      　　他拉著古·拉哈·提亞，前往街角的一個小活動攤位。那裡鋪著整齊的桌巾，桌面上放著一排槍械，獎品則全數陳列在攤位後方的背板上，只要用玩具子彈擊中目標，就能兌換對應的獎品。
      　　
      　　古·拉哈·提亞的眼睛微微一亮。
      　　
      　　「這是……！」
      　　
      　　「你好像很喜歡剛剛那個莫古力玩偶。」
      　　
      　　「也、也不是說特別喜歡。」古·拉哈·提亞的耳尖輕輕動了動，語氣卻明顯沒什麼說服力，「只是看起來真的蠻可愛……」
      　　
      　　光拉開兜帽，伸手試了試攤位提供的槍。確認重量與手感後，他回頭朝貓魅青年眨了眨眼，眼底帶著一點難得的得意。
      　　
      　　「伊修加爾德特有的魔導火槍，我也算頗有心得。」他抬了抬下巴，示意後方整排獎品，「這排玩偶你可以隨便選。」
      　　
      　　古·拉哈·提亞的確很想看光展示身手。
      　　
      　　然而下一刻，他的眼角餘光便瞥見攤位老闆認出了英雄。對方先是露出受寵若驚的表情，隨即又看了看自己背後那排獎品，臉色逐漸變得蒼白，甚至像是已經預見攤位即將被洗劫一空，眼角掛著兩行絕望的淚。
      　　
      　　古·拉哈·提亞沉默片刻，終究還是輕聲出言勸住了英雄。
      　　
      　　「那就上排的肥肥風箏貓就好。」他頓了頓，又看向那隻莫古力玩偶，聲音放得更輕了些，「莫古力的話……還是想要手縫的。」
      　　
      　　光怔了怔，原本已經抬起的槍口微微垂下，片刻後，也跟著露出微笑。
      　　
      　　「好。」
  - title: 終章
    body: |
      　　持續整天的慶典終於邁入尾聲。

      　　隨著夜色降臨，民眾陸續聚集到廣場，有些人倚著石階休憩，有些人坐在攤位旁分食熱騰騰的晚餐，還有不少孩子抱著白日裡贏來的獎品，興奮地在人群間穿梭。廣場中央的樂團奏起輕快的旋律，銅管與弦音交織在一起，伴著火光與飄雪，將整座蒼天街籠罩在一片柔和的喧鬧裡。

      　　古·拉哈·提亞伸手接過光遞來的食盒，盒蓋才剛掀開，燉肉濃郁的香氣便撲面而來，身後的長尾也放鬆地輕輕搖晃。光望著他試圖單手享用晚餐、另一隻手卻還緊緊扒著肥肥風箏貓玩偶的模樣，終究沒能忍住，低低笑出了聲。

      　　「等回去再縫個莫古力給你。」

      　　古·拉哈·提亞抬起頭，雙頰還塞著食物，寶石般的眼睛亮得驚人。

      　　「唔……嗯、約好了！」

      　　他說得無比堅定，只是被燉肉塞滿的聲音多少少了點氣勢，反倒顯得淘氣又惹人憐愛。

      　　光看著他，眼底的笑意也跟著柔軟下來，他低頭吃起自己那份食物，隨後收回目光，仰頭望向夜空。

      　　入夜後，雪國的溫度下降了不少，兩人就著廣場旁的火光挨近了些，肩膀幾乎要碰在一起。他們一同靜靜望著眼前安逸和平的街道，聽著人們的笑聲與樂聲在寒冷空氣中緩緩流動。

      　　過了好一會兒，古·拉哈·提亞才輕聲開口。

      　　「英雄，謝謝你。」

      　　他的聲音很輕、很柔，像是怕驚擾了這份得來不易的和平，紅眼映著火光，真摯得幾乎沒有半分遮掩。

      　　「即使是那樣任性的約定，你也願意帶我來實現。」

      　　約定。

      　　只是短短兩個字，卻像是忽然落入平靜水面的石子。

      　　天外天垓的記憶隨著那個詞語再次湧入腦海，光的瞳孔止不住地顫動，眼底一瞬間閃過了太多畫面──笑著與他道別的青年、緊握後相碰的拳頭、還有被漆黑的旋風吞噬的紅色身影。

      　　他垂下頭，努力壓抑著胸口翻湧而上的情緒。

      　　可那樣異常的反應，並沒有逃過古·拉哈·提亞的眼睛。

      　　「怎、怎麼了？」青年慌忙放下食盒，連懷裡的玩偶都差點滑落，「我是不是說錯了什麼？」

      　　那份埋在心底的不安，正開始發酵。

      　　英雄此刻的反應，幾乎讓古·拉哈·提亞立刻想起了自己的猜想──光真的在排斥他們所做下的約定。

      　　紅色的貓耳忍不住喪氣地垂下。

      　　古·拉哈·提亞無措地搓著手臂，數次張口，卻又不知道該從哪裡說起。最後，那些慌亂與歉疚只能化作近乎破碎的道歉。

      　　「對不起……對不起！是我自以為是的獨斷……如果會讓你這麼難受，如果那個約定只是讓你想起痛苦的事──」

      　　「……拉哈。」

      　　即使一手仍捂著額角，光還是努力抬起眼，艱難地望向古·拉哈·提亞。

      　　他看見對方急得手足無措的模樣，看見那雙總是盛滿光亮的紅眼此刻被不安占據，心口便像是被用力揪住，悶痛得幾乎喘不過氣。

      　　但到底該怎麼說，才能將自己真正想傳達的事好好說出口？

      　　這些連他自己都還未能完全整理清楚的思緒，真的該讓對方知道嗎？

      　　『如此敞開心胸，才更顯得大家像是同伴。』

      　　苦思之間，尤里安傑溫柔的聲音忽然在耳邊響起。

      　　光愣愣地望著眼前的紅髮貓魅。廣場上的樂聲仍在繼續，人群的歡笑仍然熱鬧，那一瞬間，他總算從漫長的壓抑中找回了一點呼吸的餘地。

      　　他顫巍巍地伸出手，握住古·拉哈·提亞無措的手臂，再次低聲呼喚他的名字。

      　　「拉哈。」

      　　古·拉哈·提亞安靜下來，卻仍緊張地望著他。

      　　光的指尖收緊了些。

      　　「我想帶你來這裡，並不是因為我們的約定。」他低聲道：「我只是想讓你看看，現今的伊修加爾德。」

      　　古·拉哈·提亞微微一震。
      　　
      　　「……我知道。」他輕聲回應，「因為英雄的努力，這裡與第八靈災時的模樣早已截然不同。」

      　　是你給這塊土地帶來希望。

      　　那句未說出口的話，幾乎已經寫在他的眼裡。

      　　然而光只是搖了搖頭。

      　　「『英雄』不是只有我。」

      　　這些日子以來，光一直在思考同一件事。

      　　他該怎麼做，才能讓眼前這個青年再多珍視一點自己的生命？

      　　古·拉哈·提亞總是說著想要同行，總是那樣真誠地談論著未來，可每當危機降臨時，他卻又總是毫不猶豫地將自己放在最後，就像第一世界時那樣，就像末日之時那樣，彷彿只要能為眾人換得一線生機，他便可以理所當然地從故事裡退場。
      　　
      　　光不想再看見那樣的結局，也不想再一次成為被留下來的那個人。
      　　
      　　走入水晶塔的背影、伸手卻無法阻止光之力的轉移、被水晶侵蝕以致於碎裂的身軀……那些無能為力到幾乎令人窒息的瞬間，光已經不想再去細數。
      　　
      　　多虧拂曉夥伴們給予的靈感，他才突發奇想：如果帶古·拉哈·提亞看看他所拯救的世界，看看那些因他而延續下來的日常與笑容，他是不是就能稍微明白，自己的存在究竟有多麼重要？
      　　
      　　「你拯救了我。」
      　　
      　　光伸出另一隻手，緊緊握住古·拉哈·提亞的肩膀。那力道或許讓人生疼，可現在的他已經顧不了這麼多了。
      　　
      　　「如果沒有你，我不可能站在這裡。」
      　　
      　　古·拉哈·提亞怔怔地望著他，原本想說些什麼，卻被光近乎祈求般的聲音打斷。
      　　
      　　「你也是這份和平的英雄。」

      　　他的聲音微微顫抖，卻仍努力把每一個字說得清楚。

      　　「所以，拜託你……」
      　　
      　　不要再隨意從這個世界上消失。
      　　
      　　不要再留下我一個人。
      　　
      　　那些話堵在喉間，幾乎要讓他失去聲音。最後，光只是更用力地握住他的肩膀，像是將所有無法言說的恐懼與渴望，都壓進這個近乎笨拙的動作裡。

      　　「不只是你期望未來有我。」

      　　他抬起眼，直直望進古·拉哈·提亞的眼底。

      　　「我也希望未來的冒險裡，身邊能一直有你同在。」
      　　
      　　伴隨著最後一句話落下，眼前人的身影也開始變得模糊。光用力眨了眨眼，卻徒勞無功，索性閉上濕潤的眼睛，靜靜等待青年的反應。
      　　
      　　廣場上的樂聲在這一刻似乎變得很遠。
      　　
      　　手指傳來的觸感告訴他，面前的人正緩慢地側過身，將手中的食盒與玩偶放到一旁，隨後，一股溫熱的氣息慢慢貼近，帶著小心翼翼的顫抖，停在他臉側。
      　　
      　　貓魅青年輕輕吻去了他眼角的淚。
      　　
      　　「對不起。」
      　　
      　　低落的嗓音響起，微弱得彷彿能被風雪吹散。
      　　
      　　「我總是留給你不好的回憶。」
      　　
      　　親吻一次次落下，與他的話語融成濕潤的氣息。古·拉哈·提亞的掌心捧住光的臉，紅色的眼睛滿是歉意，深深望向那片被悲傷浸濕的蔚藍。
      　　
      　　「但是，英雄……請你相信我，過去我所說的話，絕無半分虛假。」
      　　
      　　從第八靈災的未來被喚醒的他，背負著眾人的期望而穿越世界，又歷經了百年的醞釀與等待，『拯救那位英雄』的願望，早已銘刻入靈魂、成為本能的一部分。
      　　
      　　而身為古·拉哈·提亞內心真正的願望，只能跟隨著他一同披上水晶公的衣袍，被壓抑在陰影之處。
      　　
      　　畢竟那個未來太過奢侈，他根本無法想像有實現的一天。
      　　
      　　「我的確認為，只要能讓你繼續前進……只要能讓你抵達明天，那麼我做出的選擇就不算錯。」
      　　
      　　他閉了閉眼，聲音裡染上苦澀的笑意。
      　　
      　　「但在天外天垓被傳送回來的時候，我也意識到……被留下來的滋味。」
      　　
      　　光的手指微微一顫，古·拉哈·提亞覆上他握著自己肩膀的手，安撫地輕輕揉搓，而後又再度伸手，試圖擦去他眼角的傷痛。
      　　
      　　「明明知道你是為了我們，明明知道你別無選擇，明明知道自己該相信你……可是心裡還是會害怕。」
      　　
      　　害怕再次失去他的英雄。
      　　
      　　「那個時候我不禁在想……我真的對你很殘酷，也很抱歉。」
      　　
      　　古·拉哈·提亞望著他，眼裡有心疼，有懊悔，也有幾乎要滿溢而出的眷戀。
      　　
      　　「我也不想……回到沒有你的世界。」
      　　
      　　他輕輕吸了一口氣，一字一句珍重地說。
      　　
      　　「所以，我答應你。」
      　　
      　　「我不會再擅自把自己的生命排除在約定之外。」
      　　
      　　貓魅青年的聲音仍有些沙啞，堅定的意念卻無比清晰。
      　　
      　　「如果真的到了必須面對危險的時候，就算真的退無可退，我也想與你一起面對。」
      　　
      　　他頓了頓，目光沒有移開。
      　　
      　　「但你也要答應我，不要再一個人走到我追不上的地方，也不要再把自己的痛苦藏起來。」
      　　
      　　他輕輕將掌心移到光的胸口，貼住那顆深埋其中、強而有力的心跳。
      　　
      　　「你的生命對我而言，也同樣重要。」
      　　
      　　那句話像是比任何誓言都更輕，卻也更沉。
      　　
      　　光望著他，胸口那些長久以來無處安放的恐懼，像是被人小心翼翼地接住了一角。
      　　
      　　「……你真的這麼想？」
      　　
      　　他的聲音模糊得不像自己。
      　　
      　　古·拉哈·提亞微微一笑。
      　　
      　　「是的。」
      　　
      　　他握緊光的手，紅色的眼睛盈滿笑意，卻也帶著一點近乎孩子氣的固執。
      　　
      　　「畢竟，如果『我們』不在了，約定要如何實現？」
      　　
      　　曾說出口的話語竟被改了份量，光的喉間微微一緊，一時間說不出話來。
      　　
      　　看見他的反應，古·拉哈·提亞垂下眼，而後燃起決心，像是終於越過了某道始終不敢踏出的界線。
      　　
      　　「光。」
      　　
      　　從未被如此親暱喚過的名字，讓英雄驀地睜大了眼。
      　　
      　　「你說的這些話、代表的意義……我可以解讀為，是和我一樣的嗎？」
      　　
      　　「什麼意思？」
      　　
      　　低沉的聲音與過近的距離讓光有些暈眩。迷迷糊糊間，他看見古·拉哈·提亞明亮的眼睛直直望著自己，像是不願放過一絲反應。
      　　
      　　「意思是，如果你討厭的話，就推開我。」
      　　
      　　語畢，溫熱的柔軟覆上他的唇。
      　　
      　　那是一個極輕的吻。
      　　
      　　與方才落在眼角的安撫不同，這一次帶著試探，帶著顫抖，也帶著終於不再隱藏的渴望。古·拉哈·提亞只是輕輕貼著他，像是在等待他的拒絕，也像是在將選擇權鄭重地交回他手中。
      　　
      　　光沒有推開他。
      　　
      　　他甚至在短暫的怔愣後，抬手抓住了對方的衣襟。
      　　
      　　那動作並不溫柔，甚至有些倉促，卻讓古·拉哈·提亞的呼吸微微一亂。
      　　
      　　吻被加深的那一刻，兩人都嘗到了彼此唇上的鹹意。
      　　
      　　光後知後覺地意識到，原來落淚的並不只有自己。
      　　
      　　初次接觸並未持續太久。分開時，他們仍靠得很近，額頭幾乎抵在一起，呼吸在寒冷的夜色裡交纏成一小片溫熱的白霧。
      　　
      　　古·拉哈·提亞垂著眼，指尖仍貼在光的胸口。
      　　
      　　「我喜歡你。」
      　　
      　　深埋超過百年的心意，終於帶著無法隱藏的顫抖說出口。
      　　
      　　「不是作為傳說中的英雄，也不是作為我曾經嚮往的冒險者，是作為此刻站在我面前，會害怕、會難過，卻還是願意對我說出這些話的你。」
      　　
      　　古·拉哈·提亞抬起眼，笑意裡仍殘留著淚光。
      　　
      　　「所以，如果你願意的話，未來──」
      　　
      　　光握住他的手，將兩人的指尖慢慢扣緊。
      　　
      　　廣場上的樂聲重新傳入耳中。
      　　
      　　火光、雪色與遠處人群的歡笑，像是終於回到他們所在的世界，伴隨奪得的和平與失而復得的彼此，共同握在他們的掌心。
      　　
      　　而這一次，誰都不會再鬆手了。
