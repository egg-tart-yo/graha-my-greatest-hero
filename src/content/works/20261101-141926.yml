      　　喪靈鐘入夜後總是很安靜。
      　　
      　　白日裡來來往往的腳步聲、交談聲都沉了下去，只剩偶爾從窗外掠過的風，輕輕拂動石之家的窗戶。
      　　
      　　古·拉哈·提亞仍坐在書桌前。
      　　
      　　桌上的燈亮著鵝黃的暖光，照亮攤開的書頁與散落的紙張。他手握著筆，時而低頭記下幾行字，時而翻回前幾頁確認先前的推論，眉心微微蹙著，顯然還沉浸在手上的研究裡。
      　　
      　　這份資料比預想中更繁雜一些。
      　　
      　　他原本只是想再確認最後幾處，等回過神時，窗外早已是潑了墨般的黑。
      　　
      　　古·拉哈·提亞看了一眼窗外，很快又將注意力放回紙上。
      　　
      　　「再一下下……」
      　　
      　　他低低自語了一句。
      　　
      　　筆尖才重新落下，肩上忽然一暖。
      　　
      　　一條毛毯不知何時披了上來，從肩頭一路裹住後背，還被仔仔細細地往前攏了些，剛好將他整個人包在裡頭。
      　　
      　　古·拉哈·提亞愣了一下。
      　　
      　　他停住筆、回過頭，身後卻空蕩蕩的，房門也安安靜靜地闔著，什麼人都沒有。
      　　
      　　只有門縫下似乎還殘留著一點晃過的影子。
      　　
      　　古·拉哈·提亞眨了眨眼。
      　　
      　　半晌，他像是明白了什麼，嘴角一點一點揚起來。
      　　
      　　他沒有出聲，只是伸手攏了攏肩上的毛毯，把自己裹得更緊了一些，然後重新低下頭。
      　　
      　　暖意隔著衣服貼在身上。
      　　
      　　他繼續在紙上寫寫畫畫，嘴角帶著一點沒能完全壓下去的笑。

      　　寫著寫著，手邊原先備著的紙也漸漸見了底。

      　　古·拉哈·提亞下意識伸手去摸，指尖卻只碰到空蕩蕩的桌面。

      　　他頓了一下，這才想起剩下的紙還收在另一頭的櫃子裡，只得擱下筆，準備起身去拿。

      　　然而椅子才稍微往後挪了一點，他的動作便停住了。

      　　桌角不知何時已經多出了一疊整整齊齊的紙張，甚至連方向都替他擺好了，只要伸手便能直接取用。

      　　古·拉哈·提亞盯著那疊紙看了幾秒，又慢慢抬眼望向房門。

      　　依舊安安靜靜的，什麼聲音也沒有。

      　　他忍不住抿了抿唇，像是想把浮上來的笑意壓回去，最後卻還是失敗了。

      　　「……什麼時候準備的啊。」

      　　古·拉哈·提亞搖搖頭，重新把椅子往桌前挪近。

      　　他抽出最上頭的一張紙鋪在面前，筆尖再次落下時，眼底已經帶上幾分藏不住的柔軟。
      　　
      　　又過了一段時間。
      　　
      　　房裡安靜得只剩紙張翻動的窸窣聲。
      　　
      　　古·拉哈·提亞正低頭核對著其中一段記錄，桌邊忽然傳來極輕的一聲碰響。
      　　
      　　他驚訝地抬起眼。
      　　
      　　書桌最靠邊的角落，不知何時多了一只杯子。
      　　
      　　杯裡的熱飲冒著白煙，淡淡的香氣隨著熱氣散開，在燈下緩緩往上飄。
      　　
      　　古·拉哈·提亞盯著那杯東西看了好一會兒。
      　　
      　　他低下頭，肩膀輕輕抖了一下，終於忍不住笑出聲來。
      　　
      　　「真是的……」
      　　
      　　他端起杯子喝了一口，一陣暖意從喉間一路蔓延到腹部，忍不住發出舒適的喟嘆。
      　　
      　　古·拉哈·提亞捧著杯子沉默片刻，目光重新落到桌上那堆尚未整理完的資料，陷入了糾結。
      　　
      　　原本還想再多看幾頁。
      　　
      　　但想到某個人已經來來回回走了幾趟，現在說不定正躺在床上，靜靜地數著渡渡鳥，一邊埋怨地蹙著眉頭，等著他究竟什麼時候才肯放下手裡的東西──
      　　
      　　他只得無奈地嘆了口氣。
      　　
      　　「好吧。」
      　　
      　　這聲妥協也不知道是說給誰聽的。
      　　
      　　他將資料稍微整理好，在書中的段落做了記號，把筆擱在一旁，又把杯中的熱飲慢慢喝完，這才伸手熄了桌上的燈。
      　　
      　　房間頓時暗了下來。
      　　
      　　古·拉哈·提亞披著毛毯，循著熟悉的路往臥房走去。
      　　
      　　光背對著他躺在床的裡側，被子只蓋到腰間，一角鬆鬆地垂在床沿，呼吸聽起來平穩得很，整個人一動也不動，怎麼看都像已經睡熟了。
      　　
      　　古·拉哈·提亞站在床邊看了他一會兒，輕輕勾起唇角。
      　　
      　　他當然知道剛才那些是誰做的。
      　　
      　　除了光，大概也只有桑克瑞德的身手能悄悄潛入房間而不被發現，但考量能讓自己毫無察覺、完全放下戒心的氣息，嫌疑人便只有眼前的大英雄。
      　　
      　　這人偶爾會把身手用在奇怪的地方，雖然他倒是很受用。
      　　
      　　古·拉哈·提亞將肩上的毛毯疊好放到一旁，掀開被子躺了進去，床鋪因他的重量稍微往下陷了一些。
      　　
      　　身旁的人仍舊沒動。
      　　
      　　他也沒有拆穿，只是像平時那樣靠過去，伸手環住光的腰，把人往自己懷裡攏了攏。
      　　
      　　隔著薄薄的衣料，能感覺到熟悉的體溫。
      　　
      　　大約過了幾秒，原本「睡得很熟」的人終於慢吞吞地動了一下。
      　　
      　　光轉過身來，把頭塞進他的胸前，眼睛依然閉著。
      　　
      　　古·拉哈·提亞看著他，眼裡的笑意更深了些。
      　　
      　　他低下頭，在光的眼角親了一下。
      　　
      　　「還裝睡。」
      　　
      　　光含含糊糊地咕噥了一聲，也不知道是在反駁，還是單純不想承認。
      　　
      　　但看看皺起的眼尾，他倒是將眼睛閉得更緊了。
      　　
      　　古·拉哈·提亞也不急。
      　　
      　　他只是靠得更近一點，鼻尖輕輕蹭過光的臉頰，一則是故意鬧他，又只是貪戀這樣近得幾乎沒有距離的溫度。
      　　
      　　光被蹭得偏了偏頭，卻沒有躲開。
      　　
      　　片刻後，他悄悄把手搭到了古·拉哈·提亞的腰間。
      　　
      　　古·拉哈·提亞忍不住笑出聲，捧起光的臉頰，親了親他的額前。
      　　
      　　「謝謝熱茶，喝完人都暖和起來。」
      　　
      　　懷裡的人安靜了一會兒。
      　　
      　　「……嗯。」
      　　
      　　「還有毯子，披著手就沒那麼冷了。」
      　　
      　　又是一聲悶悶的應聲。
      　　
      　　古·拉哈·提亞笑著下了結語。
      　　
      　　「但下回，倒是可以考慮直接喊我來睡覺。」
      　　
      　　光這才終於睜開一側的眼睛，埋怨地看了他一眼。
      　　
      　　「喊了你就會來？」
      　　
      　　古·拉哈·提亞遲疑了一會。
      　　
      　　光重新閉上眼睛，臉上一副「果然如此」的神情。
      　　
      　　古·拉哈·提亞失笑，只好低頭又親了親他的眉間。
      　　
      　　「……盡量盡量。」
      　　
      　　光鼻音很輕地哼了一聲，顯然不是很相信。
      　　
      　　古·拉哈·提亞也沒有再替自己辯解。
      　　
      　　夜已經很深了。
      　　
      　　窗外沒有什麼聲音，房裡也只剩兩人的呼吸，還有被褥偶爾隨著動作輕輕摩擦的細響。
      　　
      　　他將臉埋近光的頸側，安靜地蹭了蹭，偷偷吸了一口熟悉的氣息。
      　　
      　　方才還盤踞在腦海裡的那些文字、數字與推論，似乎隨著睡意的降臨，一點一點淡去。
      　　
      　　貓魅閉上眼。
      　　
      　　「晚安，光。」
      　　
      　　懷裡的人沒有立刻回答。
      　　
      　　過了一會兒，環在他腰上的手才稍微收緊。
      　　
      　　「……晚安，拉哈。」
      　　
      　　古·拉哈·提亞輕輕笑了一下，胸口仍舊暖洋洋的。

      　　他再一次發現，自己在許多事情上，似乎總是很難拒絕光。

      　　不過，如果是他的話，那些無傷大雅的小小堅持，偶爾退讓幾次，似乎也沒什麼不好。
