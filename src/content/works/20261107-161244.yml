      　　潮水般的洞窟魔物正瘋狂地湧上來。單隻的實力微不足道，但那近乎無窮無盡的數量，早已將通往出口的退路徹底堵死。
      　　
      　　「嘖，數量未免也太多了！」
      　　
      　　桑克瑞德槍刃往後一劃，斬斷了撲向身側的魔物，借力退到尤里安傑身前，同一時間，密密麻麻的甲殼磨擦聲還在不斷將他們包圍。從小型爆炸中脫身的阿莉塞也退了過來，三人背靠著背，雙眼不斷在混亂中找尋突破的機會。
      　　
      　　「這樣下去不是辦法！商量一下，是不是該先集中攻擊，準備突圍撤退？」
      　　
      　　「退路的岩道已經崩塌了，強行突圍得找別的出口！」阿爾菲諾操縱著賢具支撐起防禦屏障，咬牙喊道，「但如果繼續被困在這──」
      　　
      　　「那就直接開一條路吧！」
      　　
      　　站在最前方的光一劍劈散了正前方的魔獸，他回身一甩，劍刃在泥地上留下一道血痕。
      　　
      　　英雄的目光環視著混亂的戰線，隨後落在與他並肩奮戰的紅髮貓魅身上，放聲大喊：「拉哈！把上面的天花板直接炸穿！」
      　　
      　　光露出在激烈戰局裡不該出現的微笑，清晰的篤定聲響穿透了魔物的低吼聲，「你的魔法那麼厲害，這點岩層對你來說一定沒問題！」
      　　
      　　話語一出，戰場彷彿安靜了幾秒。
      　　
      　　高舉著法杖的古·拉哈·提亞猛地一震，豔紅的眼眸瞬間亮起比任何星辰還耀眼的光彩，整個人像是被某種巨大的喜悅狠狠擊中，連身後那條蓬鬆的長尾都「啪」地一聲，筆直地豎了起來。
      　　
      　　空氣中開始震蕩起異樣的波瀾。
      　　
      　　「等等……這是什麼波動？」
      　　
      　　敏銳感知到異常的雅·修朵拉輕皺細眉，隨後猛然仰起頭。在她的視野中，周遭的乙太正以一種令人頭皮發麻的速度向眾人上方聚集，隨後不斷擠壓、凝結，匯集成一股龐大的能量。
      　　
      　　「古·拉哈！快停下！」她罕見地拔高了聲調，警告道：「你集中力量的方式完全超出極限了！」
      　　
      　　「拉哈！不要勉強自己啊！」阿爾菲諾也震驚地回頭大喊。
      　　
      　　只可惜，處於能量中心的紅髮青年卻沒有停下。被崇敬的英雄這麼毫無保留地誇獎，那股湧上心頭的激昂與信賴徹底壓倒了一切理智。
      　　
      　　他微微壓低了身形，雙手高舉緊握的法杖，原本清亮的嗓音在此刻沉了下來，帶著堅定與自信。
      　　
      　　「不勉強……」
      　　
      　　他嘴角揚起一個燦爛至極的弧度，沉聲拋下最後一句話，就陷入漫長的詠唱。
      　　
      　　「我覺得現在的我……連整座島都可以炸沉。」
      　　
      　　「拉哈你冷靜一點啊啊啊啊！！」阿莉塞嚇得手裡的細劍差點掉在地上，同時轉頭朝罪魁禍首怒吼：「早就說過拉哈不可以隨便誇！你沒事挑動他幹什麼啊？！」
      　　
      　　被這麼一瞪的光，一時間也慌了手腳，「我……我怎麼知道？」
      　　
      　　「是、是隕石！！大家快趴下！！」
      　　
      　　事到如今，究責也來不及了。
      　　
      　　伴隨著古·拉哈·提亞的詠唱，由天際而降的數道落石毫無章法地轟炸著洞窟，令人失聰的轟鳴聲讓眾人無法再次交談，在整座劇烈搖晃的山壁開始崩塌之前，所有人只聽見桑克瑞德厲聲高喊：「跑啊──！！」
      　　
      　　在一片漫天落石與塵土碎屑中，拂曉眾人連滾帶帶爬、狼狽萬分地順著被硬生生炸出的巨大天坑，一路攀爬而逃。
      　　
      　　大家幾乎是用滾的落到了地面。
      　　
      　　外頭的陽光重新灑落下來，伴隨的是一片劇烈的咳嗽聲與喘息聲，大家或坐或躺在草地上，每個人身上都掛著煙灰與泥土，十分狼狽。
      　　
      　　「咳咳……差點就真的變成陪葬品了。」
      　　
      　　光這時才從碎石堆中走出來，背上還穩穩地背著一個人。
      　　
      　　因為一口氣釋放了渾身的乙太，耗盡體力的古·拉哈·提亞陷入了睡眠。他的雙臂軟軟地搭在光的肩頭，腦袋偏在一側，額頭上還沾著一點灰，隨著光的步伐微微晃動。
      　　
      　　提著長槍站在一旁的艾斯蒂尼安雙手環胸，先走到光的身邊狠狠捶了他一拳，隨後居高臨下地看著這副景象，沒好氣地哼了一聲，搖了搖頭，「真是……未免也太拚命了。」
      　　
      　　「呼……總之大家平安無事就好。」
      　　
      　　阿爾菲諾一邊拍打著衣袍上的泥灰，一邊與尤里安傑一同迎上前去。然而，當兩人走到光的身側，探頭看清趴在光背上的紅髮青年時，卻齊齊愣了一下，同時笑出聲來。
      　　
      　　「怎麼了？」光有些疑惑地側了側頭。
      　　
      　　「不……請恕我失禮。」尤里安傑掩著嘴角，眼中帶著掩飾不住的笑意，「只是，即便陷入深眠，面容依然顯得無比欣悅呢。」
      　　
      　　阿爾菲諾也忍不住笑著搖頭。
      　　
      　　「看來，能被這麼誇讚，拉哈真的很開心。」
      　　
      　　光愣了愣，側過頭看去。
      　　
      　　只見趴在他肩上的小紅貓睡得無比香甜，耳朵放鬆地鬆垮垮垂著，嘴角甚至還高高揚起，掛著一個毫無防備、心滿意足到了極點的傻笑。
      　　
      　　滿是狼狽的眾人彼此交換了眼神，隨後不約而同露出無奈又寵溺的笑容。
