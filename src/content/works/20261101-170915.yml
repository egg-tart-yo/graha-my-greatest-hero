  - title: 上篇
    body: |-
      　　同盟軍的信函送達石之家時，帶來的終於不是什麼戰爭的情報，而是一項來自烏爾達哈、利姆薩·羅敏薩與格里達尼亞三國領袖的聯合請託。
      　　
      　　他們希望能由與英雄並肩作戰的拂曉血盟，協助編纂一部英雄傳記，透過鼓舞人心的傳奇故事來安撫民心、振奮世人。
      　　
      　　坐在長桌末端的光雙手抱胸，一臉事不關己，甚至連眉頭都懶得挑一下。
      　　
      　　他並不是對三國的領袖感到反感，但自捲入女王暗殺事件、拂曉血盟差點失去所有同伴後，他就對政治避而遠之，對於成為宣傳看板更是毫無興趣。
      　　
      　　但邀約信件的內容十分誠懇，用意也是為了讓經歷動盪的百姓安心，英雄只得無所謂地聳了聳肩，並沒有出言反對。
      　　
      　　得到光的默許，眾人的目光便不由自主地轉向了一旁的古·拉哈·提亞──那雙紅色眼眸燃起的亮光堪比大海中央的燈塔，貓耳高高豎起，連身後的尾巴都繃得筆直，整個人激動得微微顫抖。
      　　
      　　「這份委託……最適合的人選想必不用多說了吧？」看見他的模樣，阿爾菲諾忍不住微笑著開口。
      　　
      　　畢竟，古·拉哈·提亞可是能把那本厚重的《蒼穹回憶錄》一字不漏、倒背如流的人。
      　　
      　　「真、真的可以交給我嗎？！」
      　　
      　　古·拉哈·提亞屏住呼吸，雙手緊握在胸前，滿眼期待又不敢置信地環視眾人。
      　　
      　　可露兒踮起腳，笑著拍拍他的手臂。
      　　
      　　「哪裡還找得到比你更適合的人選呢？」
      　　
      　　雅·修朵拉則端著茶杯，唇角勾起一抹意味深長的弧度。
      　　
      　　「確實很適合，只要某位賢人別在下筆時，把英雄的事蹟過度美化就好。」
      　　
      　　古·拉哈·提亞的耳朵扁了些，其他人紛紛笑出聲來。
      　　
      　　一旁的阿莉塞則用手肘頂了頂自己的雙胞胎哥哥，語氣分不清是開玩笑還是認真建議。
      　　
      　　「等拉哈把初稿寫完，阿爾菲諾搞不好還能自告奮勇幫忙畫插畫呢，把你心目中的英雄威風凜凜的模樣都畫上去。」
      　　
      　　「咳……若是有需要，我自然樂意效勞。」
      　　
      　　阿爾菲諾臉頰微紅地清了清喉嚨，過度認真的模樣讓桑克瑞德大笑出聲。
      　　
      　　於是，這項編纂任務就這麼決定了。
      　　
      　　
      　　
      　　*
      　　
      　　
      　　
      　　然而，從那一天起，光卻發覺自己與古·拉哈·提亞的冒險開始變了調。
      　　
      　　以往只要他們一同踏出石之家，無論是探索未知的荒野，還是踏入危機四伏的古堡，並肩前行的兩人總是配合得天衣無縫。戰鬥中的他們甚至不需要言語，僅僅是一個眼神的示意，就能瞬間理解彼此的意圖。
      　　
      　　光揮劍擊破敵人，古·拉哈·提亞就在後方以魔法支援與掩護；若換做他架盾防護，光就能專心地揮舞巨鐮，在貓魅的背後放手一搏。
      　　
      　　當碰上精巧的古老機關，或是塵封數百年的艱難謎題，古·拉哈·提亞總會眼睛發亮地觀察，然後興致勃勃地與光分享他的結論。
      　　
      　　這原是屬於兩人的冒險時光，但現在一切都變了。
      　　
      　　由於雅·修朵拉的提醒，記錄必須盡量保持「客觀而詳實的視角」，古·拉哈·提亞開始退出冒險的核心，徹底將自己定位為一個旁觀者。
      　　
      　　在許多不需要全員出動的情況，他並不會參與戰鬥，甚至在面對複雜的環境時，還會背著一大堆沉重的記錄儀器與測量工具，站在遠處巨石上，一手拿著筆記，一手飛快地在紙張上塗塗改改。
      　　
      　　除了冒險以外，兩人的日常相處也受到了影響。
      　　
      　　夜間，當光裹著溫暖的被褥，朝貓魅伸長雙手、試圖討個睡前的擁抱時，古·拉哈·提亞卻只是匆匆吻了吻他的前額，便轉身坐在書桌前，木椅往前一挪，就這麼在搖曳的燈火旁沙沙沙地奮筆疾書，直到破曉才停下休息。
      　　
      　　光縮在屬於自己那一半的被窩裡，眼神陰鬱地盯著那個忙碌的背影。
      　　
      　　他荒謬地發現，自己居然在跟那本厚厚的筆記吃醋。
      　　
      　　那本書搶走了原本屬於他的古·拉哈·提亞、搶走了他們在戰場上毫無保留的默契、搶走了冒險中並肩嬉笑的時光。
      　　
      　　但仔細一想，那又是古·拉哈·提亞傾注了全部心血所編寫出來的成果。光當然知道能成為英雄傳記的記錄著，對古·拉哈·提亞而言意義非凡，看著青年每次寫下一個滿意的段落後，眼底驕傲又振奮的光芒，他也只能把滿腔煩悶硬生生吞回肚子裡，一個人悶在心底發酵。
      　　
      　　心中的陰霾累積得越深，戰場上的戾氣便越發難以掩飾。
      　　
      　　幾天後，在一場魔獸討伐戰中，站在後方的阿莉塞悄悄往後退了半步，壓低聲音、輕喚旁邊正抱著筆記本記錄的古·拉哈·提亞。
      　　
      　　「吶……拉哈……」
      　　
      　　少女的聲音透著一絲不尋常的震顫。
      　　
      　　「你有沒有覺得……光今天的氣場，恐怖得有點嚇人？」
      　　
      　　聞言，蹙著眉頭的貓魅停下了手中的筆，也抬起了擔憂的眼睛。
      　　
      　　以往光的戰鬥風格極為乾脆俐落。他深知在瞬息萬變的戰場上，必須保留體力以應對各種突發狀況，因此動作一向精準，從不浪費多餘的力氣。無論是用什麼武器，對付敵人向來都是直衝要害而去，務求一刀斃命。
      　　
      　　如今兩人眼前的英雄，卻完全反常。
      　　
      　　只見光雙手握著巨大的暗黑大劍，直接貫穿了一頭狂暴魔獸的胸膛，他卻沒有立刻拔出武器，而是手腕狠戾地向旁一扭，將傷口硬生生往外扯開。
      　　
      　　魔獸發出震耳欲聾的痛苦咆嘯，面色冷淡的光卻只是單手提著劍柄，以一種近乎宣洩的狂暴力量，直接將龐大的魔物往上提拉成兩截。
      　　
      　　鮮血順著巨劍的尖端潑灑、濺了一地，身披墨黑鎧甲的英雄站在血肉模糊的中央，微微垂著的藍眼照不到光，看起來竟然有些陰沉。
      　　
      　　阿莉塞與古·拉哈·提亞面面相覷，身軀不自覺地緊繃。
      　　
      　　在那一瞬間，他們都從對方的眼中看見了一絲駭人的寒意。
  - title: 下篇
    body: |-
      　　當天深夜，古·拉哈·提亞難得沒有坐在書桌前。
      　　
      　　他端著一杯熱騰騰的甜茶，悄悄推開了光的房門。英雄正抱著膝蓋坐在床邊，剛洗完澡的碎髮還帶著濕氣，神情冷淡而沉默。
      　　
      　　古·拉哈·提亞將溫熱的杯子放進光微涼的掌心，自己拾起一旁的毛巾，輕輕按壓著他濕答答的頭頂。在這期間，光只是垂著頭，一言不發地將神色藏在熱飲的霧氣與垂下的毛巾中，任由沉悶的空氣在房內蔓延。
      　　
      　　這份沉默讓貓魅的神色增添了幾分擔憂。
      　　
      　　「光，我想跟你談談今天的任務。」
      　　
      　　古·拉哈·提亞放輕了嗓音，耳朵微微動了動。
      　　
      　　「那種戰鬥方式……太危險了，那不是平常的你。」他沉聲詢問：「還有，這幾天你一直很沉默，能跟我說發生什麼事了嗎？」
      　　
      　　灰暗的藍眼抬起，不發一語地注視著古·拉哈·提亞。

      　　他連忙補充說道：「你放心，這些反常的細節並不會寫在書裡。我現在是以同伴……是以我的身分在問你。請你告訴我，好嗎？」
      　　
      　　房內的空氣因這句話沉了下去。
      　　
      　　「書……又是那本書！」
      　　
      　　隱忍的情緒瞬間被點燃，光猛地將杯子重重砸在床頭櫃上，熱飲濺出了幾滴，在木紋上暈開深褐色的痕跡。
      　　
      　　「書裡怎麼寫的，我根本不在乎！」他怒聲低吼，將這幾天的委屈與怒火全數傾瀉而出，「我沒想過要當什麼名留青史的英雄！那些掌權者需要什麼振奮人心的故事，到底跟我有什麼關係！」
      　　
      　　古·拉哈·提亞被這突如其來的怒火震在原地，紅耳驚訝地向兩側撇開，整個人僵立著。
      　　
      　　「就算真的要，我也只想當你一個人的英雄！只要你能將目光放在我身上、過去與未來都只看著我一個人，那我就會努力成為你內心英雄的模樣！」他氣喘吁吁、胸膛劇烈起伏，「其他人的憧憬或崇拜，我一點都不稀罕！」
      　　
      　　那雙向來沉靜深邃的眼眸，此刻竟泛著狼狽的微紅，滿是無處安放的委屈與動搖。
      　　
      　　「從你開始記錄、開始成為旁觀者的時候，我老是覺得……你就算在我身邊，卻再也沒有真正地『看』我了。」他的聲音微弱了下來，輕得幾乎像是一聲哽咽，「我不喜歡那樣，拉哈……我真的不喜歡………」
      　　
      　　光鬆開了緊握著的拳頭，脫力般往後退去，胸口起伏不定地喘著粗氣，別過頭不再看他。那是英雄極少展露出來的、近乎赤裸的脆弱。
      　　
      　　房內陷入了一片令人窒息的死寂。
      　　
      　　古·拉哈·提亞整個人僵在原地，腦海中嗡嗡作響。
      　　
      　　他看著眼前這個在外人眼中無堅不摧、拯救了世界的英雄，此刻卻像個被冷落、被奪走了唯一溫度的孩子一樣渾身緊繃。
      　　
      　　眼底閃過自責的古·拉哈·提亞沒有立刻出聲辯解，他深吸了一口氣、放輕了腳步，一步一步走到光的身前，青年伸出雙手，無比珍重地覆上了光那雙因為用力而泛白、冰涼微顫的手背。
      　　
      　　感覺到掌心下的人下意識想抽開手，古·拉哈·提亞反而收緊了十指，將自己的掌心完全貼合上去，用自己偏高的體溫一點點包裹住對方。
      　　
      　　「光，你看著我。」
      　　
      　　他在床邊蹲下身，仰起頭望著光，赤紅色的眼睛乾淨得只有光一個人的身影。
      　　
      　　光的喉結滾動了一下，眼睫顫了顫，終於耐不住那份執著的注視，重新對上了古·拉哈·提亞的目光。
      　　
      　　「對不起，我竟然沒發現……」他深吸了一口氣，露出苦澀又複雜的笑容，「當聽到這個委託時，我滿腦子想的，全都是『終於輪到我來為你做點什麼了』。」

      　　這段時間的他傾盡全力，只想親手為英雄打造輝煌的冠冕，卻沒想到對方所需要的，僅僅只是自己一個人的視線。
      　　
      　　他自嘲地搖了搖頭。
      　　
      　　「在失去你的未來，我只能透過別人的記載、透過口耳相傳去想像你的樣子、體會你的經歷與故事……那時候我就無數次想過，如果能親眼看著你有多好？」
      　　
      　　說到這裡，古·拉哈·提亞的聲音有點沙啞，他抬起一隻手，指尖溫柔又小心翼翼地撫上光的臉頰，撫平英雄眉心蹙緊的傷痕。
      　　
      　　「所以當我真正來到你身邊，獲得這個崇高的權力……我瘋狂地想要寫下你揮劍的每一個瞬間、你拯救世人時有多麼耀眼。我甚至自私地想著，我要讓這片大地千百年後的人都知道，我的英雄究竟有多偉大，誰也無法抹滅你的痕跡。」
      　　
      　　他珍重地望著那雙受傷的藍眼。
      　　
      　　「你一定不曉得，你曾經留下來的故事，帶給我多少力量、支撐了我走過多長的時間。」
      　　
      　　「但是，光……」
      　　
      　　古·拉哈·提亞將額頭輕輕抵在光的額頭上，兩人呼吸緊緊交纏在一起，眼底除了數不盡的溫柔，又染上一絲堅持。
      　　
      　　「不需要為了我努力去當什麼全世界的英雄。哪怕你明天就把武器扔了，不想再拯救任何一個世界，我也會一直相信你的選擇、憧憬你的強大……我的眼睛，也只會追隨你一個人。」
      　　
      　　從很久很久以前，兩人相互許下承諾開始，這一切就不會改變。
      　　
      　　「如果傳記的撰寫會讓你覺得孤單，會讓我失去和你並肩的資格……」古·拉哈·提亞轉過頭，沒有絲毫猶豫地望向桌上那疊厚厚的紙張，「那我現在就可以把它燒掉，然後去回絕三國的委託，一個字都不寫了。」
      　　
      　　額間傳來的溫度正一點點地融化著英雄內心的委屈。
      　　
      　　光仰起眼，看著古·拉哈·提亞眼底的心疼與認真，甚至能感覺到對方撫在自己臉頰上的指尖正帶著一絲害怕失去他的微顫，終於不忍心、低低罵了一聲。
      　　
      　　「……笨蛋。」
      　　
      　　他慢慢將掌心翻轉，反手扣住古·拉哈·提亞的手，有些彆扭、又有些釋然地把頭深深埋進了古·拉哈·提亞的頸窩裡。
      　　
      　　「怎麼可以燒掉……那不是你熬了好幾個晚上寫出來的心血嗎。」
      　　
      　　「但如果你不想看到它──」
      　　
      　　「我想看。」光打斷了他的話，往前傾身、將古·拉哈·提亞攬進了懷裡，不由分說地緊緊抱住，「我也想知道，在你眼裡的我是什麼模樣……但我不想只在那本書裡當個被你觀察的影子，我要的是你在冒險裡一同戰鬥，結束後跟我一起回家……而不是把我扔在床上，自己去跟桌子和稿子過夜。」
      　　
      　　古·拉哈·提亞聽到這近乎撒嬌的抱怨，懸著的心終於落了下來。
      　　
      　　他順從地將臉貼在光的耳側，毛茸茸的耳朵蹭著對方的側臉，聲音軟得化不開。
      　　
      　　「那……我答應你，就算要寫，也會先陪你睡著後再開始……可以嗎？」
      　　
      　　光在古·拉哈·提亞的頸窩裡深吸了一口屬於他的氣味，隨後無奈地嘆了口氣，收緊了環在貓魅腰間的手，低低地應了一聲。
      　　
      　　「……但不可以熬太晚，耽誤隔天的冒險。」
      　　
      　　「當然，就這麼說好了。」
      　　
      　　
      　　
      　　*
      　　
      　　
      　　
      　　隔天早晨，古·拉哈·提亞便一臉嚴肅地跑去找了雅·修朵拉。
      　　
      　　在經過數日的討論、查閱書籍與術式改良後，雅·修朵拉替古·拉哈·提亞量身打造了一隻小巧精緻的懸浮使魔。這隻使魔沒有戰鬥能力，卻擁有極高的靈敏度與紀錄功能，能夠在空中自主飛行，並將戰場上的所有畫面巨細靡遺地捕捉、儲存下來。
      　　
      　　這意味著古·拉哈·提亞終於不需要站在後方當個無趣的觀察員了。
      　　
      　　往後的冒險中，他終於重新拿起了武器，再度站回光的身旁。兩人在迷宮中並肩突圍，重新找回了一同破解機關的樂趣，一切似乎都回到了最完美的軌道上。
      　　
      　　然而，光沒料到的是──
      　　
      　　某天深夜，當光半夢半醒地轉身想去撈身邊的貓魅時，卻發現被窩的另一側鼓起了一個詭異的小包。
      　　
      　　光掀開被子的一角，藉著微弱的光芒探頭一瞧。
      　　
      　　只見古·拉哈·提亞整個人裹在厚厚的棉被裡，那隻懸浮使魔正飄在他眼前，魔力投射出白天光在戰場上揮劍、流汗、回眸的特寫畫面。
      　　
      　　而古·拉哈·提亞就趴在那裡，雙眼亮得如同王國寶庫的紅寶石，身後那條紅色的長尾在棉被底下興奮得晃動顫抖，正對著使魔投射出的影像看得如癡如醉。
      　　
      　　「……」
      　　
      　　光面無表情地盯著那隻使魔，用盡全力壓抑喚出大劍的衝動。
      　　
      　　很好。
      　　
      　　解決了一本書，現在，他得開始跟一隻破使魔吃醋了。
