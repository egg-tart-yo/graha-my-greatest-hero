      　　光已經想不起來，他和古·拉哈·提亞最開始究竟是為了什麼爭起來的。
      　　
      　　好像只是某一句話沒說好，也或許是其中一個人堅持己見，另一個人又恰好沒有退讓，總之等他回過神時，兩人之間已經莫名其妙多了一層薄薄的彆扭。
      　　
      　　這個狀態也不像是真的吵架，至少沒有對彼此說出什麼傷人的話，連聲音都沒有提高太多，就只是近似冷戰的程度，隱約感到不舒服，卻又不至於無法忍受。
      　　
      　　平常碰面時，古·拉哈·提亞仍舊會和他打招呼，談正事時也一如往常，條理清楚，語氣沉穩。
      　　
      　　只是每當光的視線落到他身上，那雙紅色的眼睛便會不著痕跡地挪開，似乎是在迴避著他的注視。
      　　
      　　即使自己刻意站到他的正前方，古·拉哈·提亞也會找到理由，不動聲色地拉開兩人的距離。
      　　
      　　幾番下來，光不得不承認，古·拉哈·提亞果然還在生氣。
      　　
      　　而且還是非常生氣的那種。
      　　
      　　差異最明顯的，還是到了晚上。
      　　
      　　平時只要他們都待在石之家，古·拉哈·提亞總會在忙完手邊的事後來找他，手中不是抱著看到一半的書，就是拿著兩杯熱飲，用肩推開他的房門。熱氣熏得他的臉頰紅潤，紅眼也會隨之彎起，理所當然似地問一句：「還沒睡嗎？」
      　　
      　　久而久之，連睡在哪一邊都已經成了不需要討論的事。
      　　
      　　但在兩人起了彆扭後，古·拉哈·提亞很久沒有再推開他的房門。
      　　
      　　今夜，洗漱完的光躺進被窩，還是習慣性等了一陣。
      　　
      　　門外卻一點動靜都沒有。
      　　
      　　他翻了個身、又翻回來，手臂不習慣地在空蕩蕩的另一側游移著。
      　　
      　　平時總覺得床不算大，尤其身旁多了一個成年貓魅，光入睡時還會留個心眼，不要壓到那條毛茸茸的蓬鬆尾巴。
      　　
      　　現在少了一個人，整張床突然大得有些過分，床單還冰冰涼涼的。
      　　
      　　回到自己房間的古·拉哈·提亞，甚至趁光不在的時候，把他的小被子也收回去了。
      　　
      　　什麼都沒有留下，用品也沒有，人也沒有。
      　　
      　　閉著眼的光深深地嘆口氣。
      　　
      　　夜晚過於寧靜，他的思緒反而比白天還清晰。
      　　
      　　光其實很少看見古·拉哈·提亞鬧脾氣。
      　　
      　　歷經第八靈災，又作為水晶公走過那段漫長的歲月，古·拉哈·提亞早已和當年探索水晶塔時的個性不再相同。
      　　
      　　以往的他說話快，想法也快，行動迅速且帶有衝勁，有時候自信滿滿，有時候又被一句話堵得耳朵發紅。
      　　
      　　明明頂著一張漂亮又聰明的臉，脾氣卻像隻年輕的大貓，毛一炸起來，連尾巴都藏不住情緒。
      　　
      　　後來的他，歷經了太多歲月的打磨，早已不見那些鮮明的稜角。
      　　
      　　他學會等待，學會忍耐，也學會即便在最痛苦的時候，依舊用溫和的聲音對別人說話。
      　　
      　　回到原初世界之後，那些屬於年輕古·拉哈·提亞的模樣雖然沒有消失，卻也比以前少見得多。
      　　
      　　所以，這幾天看著他刻意避開自己的視線、悶著氣不肯靠近，光心裡其實有那麼一點懷念。
      　　
      　　像是那個曾經和他一起跑遍水晶塔、毛毛躁躁又滿腔熱情的大貓咪，又從縫隙裡探出頭來了。
      　　
      　　可是懷念歸懷念。
      　　
      　　光看著身旁空蕩蕩的床，沉默半晌，又把被子往上拉了一點，蓋住自己的口鼻，感受著呼氣出來的熱度。
      　　
      　　他嘴上沒明說，但內心確實感到有些寂寞。
      　　
      　　隔天，光決定採取行動。
      　　
      　　他知道自己不擅長說話，與古·拉哈·提亞正面對峙，只會被對方靈巧的話語迴避過去。
      　　
      　　於是光選擇了另一種方式，選了一種他算是有把握、也有自信能引起對方注意的方式。
      　　
      　　午前，石之家隔間的小廚房裡開始飄出香味。
      　　
      　　剁碎的洋蔥在鍋裡炒得微微透明，奶油與肉汁混在一起，發出細微的滋滋聲。厚實的肉排煎得兩面焦香，起鍋前再鋪上一片乳酪，任它慢慢融化。
      　　
      　　麵包從中間切開，稍微烤過，然後是生菜、番茄、醬汁，最後再放上剛煎好的肉排。
      　　
      　　光把第一個漢堡放上盤子，轉身準備去拿第二份肉排時，忽然停住。
      　　
      　　門外依然安安靜靜的。
      　　
      　　可是門框後方，多出了一點點紅色。
      　　
      　　光看了幾秒，頓時認出那是一小截貓耳。
      　　
      　　「………」
      　　
      　　光沒有出聲，門後的耳朵也沒動，一人一貓就這樣僵持了片刻。
      　　
      　　光壓了壓嘴角，隨後低下頭，繼續把第二份漢堡組起來。
      　　
      　　果然沒多久，門外傳來極輕的細碎聲響。
      　　
      　　光差點笑出聲。
      　　
      　　明明都循著味道找到門口了，卻硬是不肯進來，到底在堅持什麼。
      　　
      　　他把第二個漢堡裝盤，擦了擦手，終於走向門口。
      　　
      　　那截紅色的耳朵立刻消失。
      　　
      　　光搖搖頭，只得主動越過門框，走了出去。
      　　
      　　古·拉哈·提亞站在不遠處，手裡甚至還抱著一本書，看起來只是剛好經過。
      　　
      　　只可惜，他的書拿反了。
      　　
      　　光的視線落在那本書上，又抬起眼，望向動了動耳朵的貓魅。
      　　
      　　古·拉哈·提亞像是察覺到什麼，低頭一看，耳朵瞬間往後豎了起來。
      　　
      　　「……」
      　　
      　　光走到他面前，微笑地看著他，對方一臉若無其事地將書轉回正確的方向，清了清喉嚨。
      　　
      　　「午安。」
      　　
      　　「嗯。」
      　　
      　　「我正準備去──」
      　　
      　　「吃漢堡嗎？」
      　　
      　　古·拉哈·提亞頓了頓。
      　　
      　　他的視線終於落到光臉上，又很快飄向旁邊。
      　　
      　　「……我只是聞到了味道，所以過來看看。」
      　　
      　　「如何？」
      　　
      　　「還好，我不餓。」
      　　
      　　「喔。」
      　　
      　　光點點頭，不留情地轉身。
      　　
      　　「那我自己吃兩個。」
      　　
      　　「……等等。」
      　　
      　　衣角被拉住了。
      　　
      　　光沒有回頭，但還是停下腳步。
      　　
      　　抓著他衣服的手似乎也在察覺到自己做了什麼，僵了一下，卻沒有立刻鬆開。
      　　
      　　光側過身，看著古·拉哈·提亞咬了咬下唇。
      　　
      　　那雙漂亮的眼睛總算沒有迴避他的視線，但看起來卻有些委屈。微微垂著的頭讓紅髮沒精神地垂在一旁，就連肩膀看起來都瑟縮了許多。
      　　
      　　光心裡一下就軟了。
      　　
      　　剛才腦海內還浮現了些玩笑話，現在的他卻完全說不出口。
      　　
      　　光轉過身，手稍微施力，將人拉了過來，毫不客氣地將下顎靠上蓬鬆的頭頂。
      　　
      　　紅色的耳尖在臉底下顫了一下，好在沒有躲開。
      　　
      　　「還生氣？」
      　　
      　　「……有一點。」
      　　
      　　居然難得承認了。
      　　
      　　光忍不住動動頭，用下巴慢慢摩擦著他的頭頂。
      　　
      　　「那要氣多久？」
      　　
      　　「我不知道。」
      　　
      　　「今晚還是丟著我一個人？」
      　　
      　　古·拉哈·提亞仰起頭，看著光的眼神藏著些許歉意，後者很平靜地補了一句。
      　　
      　　「床太大了，我一個人睡很不習慣。」
      　　
      　　懷裡的貓魅怔住。
      　　
      　　幾乎是肉眼可見的，他耳朵從耳尖一路紅到了耳根。
      　　
      　　「你……」
      　　
      　　「有點寂寞。」
      　　
      　　這句話一說出口，連光自己都覺得有些難為情，但他也知道，如果都到了這個時候還不說出口，那眼前的人可能會真的離他越來越遠。
      　　
      　　與此相比，面子一類的東西，實在不算什麼。
      　　
      　　果然，古·拉哈·提亞原本那點勉強維持著的氣勢，徹底垮了下來。
      　　
      　　耳朵先是低下去，接著又慢慢立回來。
      　　
      　　「我還以為……」他低聲說：「以為你根本不在意。」
      　　
      　　光訝異地眨了眨眼，認真檢討自己的所作所為如何讓對方產生這種錯誤的認知。
      　　
      　　他伸手，把眼前的大貓咪抱得緊了一些。
      　　
      　　古·拉哈·提亞的額頭輕輕抵在光的肩上，尾巴也終於不像先前那樣僵硬，而是慢慢垂下來，尾尖悄悄碰了碰光的小腿。
      　　
      　　「我怎麼可能不在意。」光說。
      　　
      　　懷裡的人悶悶地應了一聲。
      　　
      　　「而且晚上真的很寂寞。」
      　　
      　　「……不用強調這麼多次。」
      　　
      　　「怕有人今天晚上還是不理睬我。」
      　　
      　　古·拉哈·提亞安靜了一會兒。
      　　
      　　身後的尾巴悄悄動了動，還是纏上了光的腳。
      　　
      　　「……知道了，我會過去。」
      　　
      　　光笑了。
      　　
      　　他放開懷裡熱呼呼的貓魅，忍不住在他的額間偷了一口。
      　　
      　　「那先吃飯。」
      　　
      　　「好。」
      　　
      　　兩人重新走進隔間。
      　　
      　　古·拉哈·提亞在桌邊坐下，看見面前那份明顯早就替他準備好的漢堡時，神情微微一頓。
      　　
      　　「這是……我的？」
      　　
      　　「不然呢？」
      　　
      　　「你剛才不是說要吃兩個？」
      　　
      　　「騙你的。」
      　　
      　　古·拉哈·提亞看著他，露出彷彿破涕為笑的表情，似乎想說些什麼。
      　　
      　　最後卻只低頭咬了一口漢堡。
      　　
      　　紅耳終於有精神地豎了起來，尾巴也在椅子後方輕輕晃動著。
      　　
      　　光托著下巴，看得心滿意足。
      　　
      　　果然還是很好哄。
      　　
      　　只是下一刻，古·拉哈·提亞忽然抬起眼，直直揪著他瞧。
      　　
      　　「光。」
      　　
      　　「嗯？」
      　　
      　　「你是不是在想什麼很失禮的事？」
      　　
      　　「哪有。」
      　　
      　　光面不改色地伸手，想拿起自己的漢堡。
      　　
      　　只是坐在對面的人眼明手快，先一步把他的盤子也搶了過去。
      　　
      　　嘴裡明明還塞著食物，那雙紅眼卻亮得驚人，兩份漢堡牢牢護在懷裡，顯然是打定主意要趁著光理虧，再多討一點便宜。
      　　
      　　光怔了怔，卻也只能伸手拎起旁邊切剩、尚未烘烤過的乾麵包，配水乾巴巴的吃。
      　　
      　　古·拉哈·提亞笑得眼睛都彎了起來。
      　　
      　　那點鬧了幾天的彆扭，就這樣在漢堡的香氣裡，一點一點散乾淨了。
      　　
      　　至於當初究竟是為了什麼而吵架……
      　　
      　　等到晚上，古·拉哈·提亞重新鑽進光的被窩，被光抱住腰，而他也習慣性把尾巴搭到對方腿上時，兩個人都已經完全想不起來了。
      　　
      　　反正也不是什麼重要的事。
      　　
      　　至少，沒有比身旁重新變得溫暖的位置重要。
