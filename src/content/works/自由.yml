  - body: |-
      　　村落外的不遠處，最後一頭魔獸轟然倒地時，揚起的塵土幾乎遮住了半片天空。
      　　
      　　巨斧的刃面還沾著魔獸暗色的血，光已經俐落地將武器從牠厚重的軀體間抽了出來。巨獸最後抽搐了一下，徹底沒了動靜。
      　　
      　　古·拉哈·提亞也放下手中的法杖。
      　　
      　　方才還流轉著乙太光輝的水晶杖端漸漸黯淡，他望向站在魔獸身旁的那道身影，紅色的眼睛卻比方才施法時還要明亮。
      　　
      　　「英雄果然很厲害啊。」
      　　
      　　光回頭看了看他。
      　　
      　　古·拉哈·提亞彷彿根本沒察覺自己的視線有多麼專注，唇角已先一步揚了起來。
      　　
      　　「無論已經與你同行過多少次，每當親眼看見你無畏地迎向強敵，我都會由衷覺得──能夠在旁親眼見證你一次次跨越險境、以自己的雙手開拓前路，是何等令人欣喜的事。」
      　　
      　　話語一落，紅眼真誠又雀躍地彎起。
      　　
      　　「更何況，今後或許還有無數我們尚未遇見的難關……一想到未來的我仍能像今日這般，在你的身旁注視著你的戰鬥，我便忍不住心生期待。」
      　　
      　　古·拉哈·提亞的尾巴不自覺地輕輕晃了一下，露出了一個再自然不過的笑容。
      　　
      　　光望著他，微微點了點頭。
      　　
      　　「英雄──！英雄！這邊還有！」
      　　
      　　村民的呼喊從另一頭傳來。
      　　
      　　光聽見叫喚，二話不說重新拎起斧頭，大步衝了過去。
      　　
      　　古·拉哈·提亞站在原地目送他離開，耳朵還很愉快地立著。
      　　
      　　一旁的艾斯蒂尼安撐著長槍，沉默片刻後忽然開口。
      　　
      　　「你也真是辛苦啊。」
      　　
      　　古·拉哈·提亞偏過頭。
      　　
      　　「嗯？怎麼這麼說？」
      　　
      　　艾斯蒂尼安沒有回答，倒是旁邊的阿莉塞終於忍不住了。
      　　
      　　「沒想到這種狡猾的話，那個人居然完全沒有反應。」
      　　
      　　「狡、狡猾？」
      　　
      　　阿莉塞伸手指向光離開的方向，又指回古·拉哈·提亞。
      　　
      　　「什麼『今後也要在你身旁』、什麼『想一直看著你的冒險』──你都拐著彎說過多少次了，為什麼他到現在還是一點反應都沒有？」
      　　
      　　古·拉哈·提亞眨了眨眼。
      　　
      　　「我沒有拐彎，這是很真心的！」
      　　
      　　阿莉塞一時語塞，阿爾菲諾忍不住低低笑了一聲。
      　　
      　　「正因如此，才更加驚人吧。」
      　　
      　　他看著古·拉哈·提亞，語氣溫和。
      　　
      　　「畢竟仔細想想，那幾乎已經是在宣告，你們兩人的未來會一直交織下去了。」
      　　
      　　古·拉哈·提亞怔了一瞬。
      　　
      　　他的耳尖先動了一下，接著，一點淡淡的紅色才慢慢爬上臉頰。
      　　
      　　可出乎意料的是，他沒有慌張辯解，反而只是垂下眼睛，露出安靜又滿足的笑容。
      　　
      　　「……我覺得，那也沒什麼不好。」
      　　
      　　阿莉塞挑起眉。
      　　
      　　古·拉哈·提亞重新望向遠處，光已經舉起巨斧，一記乾淨俐落的揮擊逼退了撲向村民的魔獸。
      　　
      　　「那些本來就都是真心話。」
      　　
      　　古·拉哈·提亞輕聲道。
      　　
      　　「正因為他沒有察覺其中是否還藏著什麼別的意思，我才可以毫無保留地說出口。」
      　　
      　　想一起旅行、一起前進，想要許多年以後回過頭時，仍然能在彼此的記憶裡找到對方。
      　　
      　　這些願望若被冠上了別的名字，或許反而會變得難以啟齒。
      　　
      　　可現在不一樣，他可以毫無顧忌地傾訴自己的心聲。
      　　
      　　「英雄從來沒有意識到，也沒關係。」
      　　
      　　古·拉哈·提亞眼裡含著柔和的笑意。
      　　
      　　「我反而覺得，他現在這樣就很好。」
      　　
      　　不用滿足誰的期待而停下腳步，不背負誰的心意而改變前進的方向，自由自在、隨心所欲地前往任何他想去的地方。
      　　
      　　那是他一路看著走到今天的人。
      　　
      　　所以古·拉哈·提亞比任何人都希望，那個人永遠都是自由的。
      　　
      　　也只有如此，背影才如此耀眼又奪目。
      　　
      　　艾斯蒂尼安聽完，只挑了挑眉。
      　　
      　　「是嗎。」
      　　
      　　「嗯？」
      　　
      　　「我倒不覺得夥伴他什麼感覺都沒有。」
      　　
      　　古·拉哈·提亞困惑地看他。
      　　
      　　「什麼意思？」
      　　
      　　艾斯蒂尼安沒有解釋。
      　　
      　　他只是將長槍往肩後一靠，忽然上前一步。
      　　
      　　下一瞬，古·拉哈·提亞整個人的視野猛地翻轉。
      　　
      　　「──等等！？」
      　　
      　　艾斯蒂尼安乾脆俐落地把他扛上了肩。
      　　
      　　古·拉哈·提亞甚至來不及反應，尾巴已經因突如其來的失重感高高豎起。
      　　
      　　「艾斯蒂尼安！？怎麼了？為什麼突然──你先放我下來！」
      　　
      　　聞言，艾斯蒂尼安卻不為所動。
      　　
      　　阿莉塞瞪大眼睛。
      　　
      　　阿爾菲諾則像是很快明白了什麼，抬手抵住唇，掩去一點笑意。
      　　
      　　不遠處，本來正在確認魔獸是否已經失去威脅的光忽然停下動作。
      　　
      　　他聽見了古·拉哈·提亞的聲音，倏地回頭，目光停在艾斯蒂尼安肩上。
      　　
      　　那雙眼睛突然沉了下來。
      　　
      　　沒過多久，身影已經折返回來。
      　　
      　　「怎麼回事？」
      　　
      　　光站到兩人面前。
      　　
      　　他的視線先落在艾斯蒂尼安身上，又移到被扛著的古·拉哈·提亞身上。
      　　
      　　「你要把拉哈帶去哪裡？」
      　　
      　　艾斯蒂尼安神情平靜。
      　　
      　　「借古·拉哈一用，有件事要找他一起去。」
      　　
      　　「咦？」
      　　
      　　古·拉哈·提亞眨眨眼，自己似乎也是第一次聽說。
      　　
      　　光顯然也發現了。他雙手環在胸前，看向古·拉哈·提亞。
      　　
      　　「我們不是說好等等還要去別的地方？」
      　　
      　　「是、是這樣沒錯……」
      　　
      　　「你有同意嗎？」
      　　
      　　「同意……？」
      　　
      　　古·拉哈·提亞還沒從倒掛般的失重感裡恢復過來，尾巴高高豎起，努力維持平衡。被光的藍眼這麼直直看著，他腦袋更是忽然一片混亂。
      　　
      　　「我、我還不知道艾斯蒂尼安所說的事情究竟是──」
      　　
      　　光的眼神瞬間暗了下來。
      　　
      　　「放他下來。」
      　　
      　　古·拉哈·提亞一怔，艾斯蒂尼安則微微勾起了嘴角。
      　　
      　　「好。」
      　　
      　　他答應地十分乾脆。
      　　
      　　下一秒，古·拉哈·提亞總算重新踩到了地面。
      　　
      　　他才剛站穩，甚至還沒來得及整理被弄亂的衣服，一手便伸了過來，握住他的手腕。
      　　
      　　「走了。」
      　　
      　　「什、什麼？這邊已經結束了嗎？」
      　　
      　　沒回答他的疑問，光已經轉身往前走。
      　　
      　　古·拉哈·提亞踉蹌了一步，只能趕緊跟上。
      　　
      　　「等等，怎麼突然……至少讓我跟他們說一聲──」
      　　
      　　前面的人依然沒有回頭，握著他的手卻也完全沒有鬆開的意思。
      　　
      　　古·拉哈·提亞低下頭，看了看那隻牢牢握住自己的手，又抬頭看看光的背影，耳朵慢慢立了起來。
      　　
      　　他遲疑了一會兒，終究還是忍不住回頭。
      　　
      　　艾斯蒂尼安抱著手臂站在原地，一臉了然。
      　　
      　　阿莉塞雙手叉腰，笑得一臉「你現在總該明白了吧」。
      　　
      　　阿爾菲諾則彎著眼睛，朝他們輕輕揮了揮手。
      　　
      　　「自由……嗎……」
      　　
      　　年輕的精靈輕聲感嘆。
      　　
      　　「我倒是覺得，正因為自由，才可以選擇自己想待在何處。」
      　　
      　　正因為沒有任何束縛──
      　　
      　　所以他最終選擇停留的地方，就是發自內心的答案。
