  - title: 上篇
    body: |-
      　　聽聞，背水咖啡廳最近推出的限定餐點十分令人驚艷。

      　　說是菜單大更新倒也不盡然，許多調整都是在原有菜色的基礎上添了些巧思，可真正令人驚奇的，正是那份熟悉味道裡恰到好處的畫龍點睛。那些風味並非來自此地常見的料理食材，而是帶著幾分異國氣息，卻又與原本的餐點融合得毫不突兀。

      　　風評傳開後，原本就一位難求的咖啡廳更是高朋滿座。難得出門用餐的可露兒與古·拉哈·提亞在人潮之中艱難前進，好不容易才在櫃檯附近找到一張客人剛離開的空桌。

      　　兩人還恰巧看見了熟識的拂曉基金管理員，塔塔露正插著腰，激動地與老闆爭論著什麼，兩人之間的桌面上擺著一張看似合約書的紙張，就這麼被塔塔露往前推，又被老闆笑著推了回去。

      　　「塔塔露是想挖角這邊的廚師吧，她為了拂曉的資金，也一直很努力呢。」

      　　被那副場面逗笑的可露兒掩著嘴，將無可奈何的目光投向同行的同伴。

      　　「說起來，比起這邊的店員，搞不好拜託我們的英雄還比較快呢，對吧，拉哈君？」她微笑著問：「身為最常吃到英雄料理的人，你覺得他的手藝怎麼樣？」

      　　「當然是最棒的！」

      　　提起那名英雄，原本餓得乾扁的古·拉哈·提亞也立刻來了精神。然而話音落下後，他又像是想起了什麼，臉上的笑意微微一滯，添上幾分掩不住的苦澀。

      　　距離莫古力帶著光寫的信回來，已經過去一月有餘了。

      　　古·拉哈·提亞一直留在舊薩雷安，協助委員會處理各項事務，而接下來自東方委託的英雄，只得獨自踏上旅途。起初，旅途中仍陸續有信件寄回來，最後一次聯繫停在他即將從多瑪啟程的消息，可在那之後，便再也沒有任何音訊。

      　　「算算時間，也早該到了吧。」

      　　「是啊……」

      　　可露兒從他的語氣裡聽出一絲擔憂，一時卻不知該如何寬慰，幸好店員恰好在此時送上餐點，才稍稍沖淡了沉默。貓魅原本垂下的耳朵，在看見自己最喜歡的漢堡時終於重新立了起來。他顧不得食物仍冒著熱氣，便迫不及待地大口咬了下去。

      　　那雙微彎的眼原本還帶著滿足，可隨著咀嚼的動作，他的神情卻逐漸凝住。

      　　可露兒才剛叉起第二片肉，便察覺古·拉哈·提亞的模樣不太對勁。

      　　「吃慢一點啊，又燙到怎麼辦……拉哈君？」

      　　她看著同行同伴異常僵住的臉色，不由得放下刀叉。

      　　照理說，他餓了許久，又吃到自己最喜歡的食物，以往總是早早解決自己的餐點，再一邊等她吃完，一邊興致勃勃地閒聊，可此刻的古·拉哈·提亞卻只是愣愣地坐在原地，連手裡的漢堡都停在半空。

      　　可露兒頓時緊張起來，急忙問道：「味道不對嗎？」

      　　「……」

      　　貓魅緩緩吞下口中的食物，沒有立刻回答，而是若有所思地注視著手中的漢堡。

      　　肉汁濃郁，麵包柔軟蓬鬆，的確是他熟悉的味道，可藏在調味之中的那一絲甜膩，卻與牛肉的鹹香融合得過分恰當，夾在其中的配料也不是常見的料理洋蔥，而是換成了口感清脆的甘藍，恰好中和了漢堡的油膩。

      　　那不是單純的異國風味。

      　　至少對他而言不是。

      　　古·拉哈·提亞又低頭咬了一口，這一次，他的眉眼徹底沉了下來，他伸手喊住經過的店員，朗聲道：「請再給我一份這個。」

      　　「好的，請稍等。」

      　　「拉、拉哈君？你吃得完嗎？」

      　　古·拉哈·提亞在可露兒一頭霧水的目光下揚起笑，只是那瞇起的眼神裡，怎麼看都帶著一點危險的氣味。

      　　下一刻，他抽出身後的法杖，毫不猶豫地往地板上一敲。隨著魔力流動，他的身形在空氣中迅速隱去，眨眼間便消失在可露兒眼前。

      　　「這是……」

      　　可露兒怔怔地看著空下來的座位，又看了看桌上的漢堡，忽然覺得自己似乎不該追問得太深。

      　　拉拉菲爾族的女性並沒有等上太久。

      　　不久後，咖啡廳後方忽然傳來一陣騷動。可露兒轉頭望去，便眼睜睜地看著一名高大的身影被她那位紅髮同伴緊緊扣住手腕，幾乎是從廚房裡拖了出來。

      　　後方還跟著幾名驚慌失措、試圖勸阻的店員，以及笑得十分無奈的老闆。

      　　「英、英雄？」

      　　隨著可露兒的驚呼，那名把自己從頭到腳包得嚴嚴實實的光，只得緩緩抬起蔚藍的眼。他沉默了片刻，最後像是放棄抵抗般，朝她揮了揮手中的廚具。

      　　古·拉哈·提亞則站在他身旁，仍扣著他的手腕，笑容燦爛得幾乎有些可怕。

      　　「我想，」他一字一句、清晰地說，「這位新來的廚師先生，應該有很多事情需要向我們解釋。」
  - title: 下篇
    body: |-
      　　光絕望地發現，他根本不曉得要怎麼安撫盛怒狀態的古·拉哈·提亞。

      　　回到巴爾德西昂委員會後，古·拉哈·提亞絲毫不給他半點逃跑的空間，幾乎是一路扣著他的手腕，直接將人帶回房間。期間，光數次向可露兒投去求救的眼神，她卻只是笑瞇瞇地朝自己揮手道別。

      　　「光這次過頭了，要好好道歉喔。」

      　　語畢，大門便在他面前「碰」地一聲被用力關上。

      　　光僵在原地，頓時覺得自己像是被全世界拋棄了。

      　　可問題是，要怎麼道歉？

      　　說起來，他們根本沒怎麼吵過架，即便偶爾有意見不同的時候，也總是古·拉哈·提亞先放軟態度，而光也信任對方的任何判斷。可眼下的情況顯然不同，滿腦子胡思亂想的英雄還沒能整理出一句像樣的開場白，就被人按著肩膀坐到了床邊。

      　　氣到耳朵向外壓平的貓魅青年一句話都沒說。

      　　他只是站在光面前，深深吸了一口氣，像是仍在努力維持最基本的冷靜。隨後，他伸出手，開始替英雄解開身上裹得嚴嚴實實的斗篷與衣物。

      　　「等、等等──」

      　　光下意識想往後躲，卻被那雙紅眼裡的嚴肅定住。

      　　那與平日裡溫和而仰慕的目光截然不同，而是混著怒意、擔憂與某種近乎受傷的執拗。伴隨著貓尾用力拍打床面的聲響，光只得心慌意亂地僵在原地，緊閉著眼任由對方動作。

      　　直到上衣被揭開的一瞬間，他聽見古·拉哈·提亞倒吸了一口氣。

      　　隨後，房間裡陷入死寂。

      　　精壯的臂膀上佈滿觸目驚心的灼傷，焦黑與暗紅交錯的傷痕一路從上臂延伸到半邊前胸。傷口邊緣雖然已經開始結痂，可幾處較深的地方仍在微微滲血，只要動作稍微大一些，便會再次撕裂。

      　　良久，光才聽見對方極輕的低喃。

      　　「……所以，這就是你明明已經回來，卻始終不願露面的原因嗎？」

      　　那聲音靜得可怕。

      　　光心裡一緊，慌忙抬手想去抱住眼前的人，卻被古·拉哈·提亞的先一步後退而避了開來。

      　　「請先不要碰我。」

      　　那句話說得很輕，卻讓光整個人都僵住了。

      　　古·拉哈·提亞看著他，聲音裡壓著顫抖。

      　　「傷得這麼嚴重，卻躲起來不找我治療？」他像是努力克制著音量，可尾音仍洩露出壓抑不住的情緒，「請你解釋清楚，這到底是怎麼回事。」

      　　光張了張口，卻一時說不出話來。

      　　他並不是沒有想過古·拉哈·提亞會生氣，只是他沒有想到，真正面對這雙發紅的眼睛時，自己會如此無措。

      　　「……這次的討伐任務，比預想中艱難一些。」

      　　他垂下眼，聲音放得很低。

      　　「委託地點比信裡寫得更偏遠，魔物也不是普通野獸。我原本以為只是受了點傷，回程路上簡單處理過後，慢慢等它癒合就好。」

      　　「這叫受了點傷嗎？」

      　　古·拉哈·提亞的聲音幾乎發顫。

      　　光被問得一噎，視線不自覺往旁邊偏去。

      　　「我也好歹懂一些緊急處置。」他小聲辯解，「止血、包紮、清創……我都有做，只是傷口比我想的更難癒合，途中又發過幾次熱，所以才耽擱了行程。」

      　　古·拉哈·提亞定定看著他。

      　　光很清楚那不是能被敷衍過去的眼神，於是只得繼續說下去。

      　　「回到舊薩雷安附近後，我本來想先去找你，但又覺得這副樣子要是直接回來，一定會讓你擔心。」

      　　「所以你選擇躲起來？」

      　　「……嗯。」

      　　光的頭垂得更低了。

      　　「我在迷津附近的溪邊搭了帳篷，想著只要再多休息幾天，等傷口看起來沒那麼嚇人，再回來找你。」

      　　古·拉哈·提亞閉了閉眼，像是被這番話氣得頭疼，微微顫抖的身軀透漏他正在努力地把即將脫口而出的重話壓回去。

      　　「你知道自己在說什麼嗎？」

      　　「知道。」

      　　「不，你不知道。」

      　　他睜開眼，語氣仍然克制，卻比方才更加沉重。

      　　「你只知道怎麼把自己藏起來，怎麼等到事情看起來沒那麼嚴重，再笑著告訴我們，你已經沒事了。」

      　　光怔住。

      　　古·拉哈·提亞站在他面前，雙手緊握成拳，連指節都因用力而泛白。

      　　「可是你有沒有想過，沒有消息的這段時間，我每天都在想什麼？」

      　　他的聲音低了下來。

      　　「我不知道你在哪裡，不知道你遇見了什麼，不知道你是不是受傷，也不知道你是不是……」

      　　後面的話沒有說出口。

      　　可光明白。

      　　正因為明白，他才感受到排山倒海的愧疚。

      　　「拉哈……」

      　　「我並不是害怕你受傷。」古·拉哈·提亞輕聲說，「我害怕的是，你明明受了傷卻躲在沒人看得見的地方，覺得自己只要忍過去就好。」

      　　房間裡安靜了下來，光的內心也跟著往下沉了沉。

      　　他的確習慣一個人承受。

      　　對他而言，只要最後能回來，只要沒有倒下，那似乎就不算太糟。

      　　可對等待他的人來說，這並不是一件值得慶幸的事。

      　　光沉默許久，才緩緩伸出手。這一次，他沒有強行擁抱對方，只是輕輕握住古·拉哈·提亞垂在身側的手指。

      　　「對不起。」

      　　古·拉哈·提亞沒有立刻回握。

      　　光低著頭，拇指小心翼翼地蹭過他微涼的指節。

      　　「我不是故意讓你擔心的。只是……回來的時候，我想到自己這副樣子，第一個念頭就是不能讓你看見。」

      　　「為什麼？」

      　　「因為你會難過。」

      　　古·拉哈·提亞的呼吸微微一滯。

      　　光苦笑了下。

      　　「我知道這聽起來很蠢。」

      　　「……恕我直言。」

      　　古·拉哈·提亞停頓了一瞬，仍是忍不住地說道。

      　　「這的確非常蠢。」

      　　但被毫不留情地指出後，光反而稍稍鬆了口氣。

      　　「嗯，非常蠢。」他坦然承認，「但那時候，我真的只想到這個。」

      　　他停頓了一下，硬著頭皮接續說道。

      　　「這回旅行拖得太久，我一直想著要早點回來。途中看到一些你可能會喜歡的食材，就忍不住帶上了。可那些東西放不了太久，我又不想讓它們壞掉。」

      　　古·拉哈·提亞抬起眼，難以置信地問。

      　　「所以你就帶著這樣的傷，去了背水咖啡廳？」

      　　「老闆以前說過，如果我有空，可以借廚房試新菜。」光越說越心虛，「我想著至少先把它們處理好，做成你喜歡的樣子。等你吃到的時候，也許會覺得高興一點。」

      　　古·拉哈·提亞看著他，像是完全無法理解這個人為什麼可以一邊傷成這樣，一邊還認真思考漢堡的調味。

      　　他的表情明明還帶著怒意，眼底卻已經逐漸浮現出無可奈何的疼。

      　　光低聲補上最後一句。

      　　「而且，我很想你。」

      　　青年的怒氣被這句話撞出了一道裂縫。

      　　光握緊他的手，聲音輕得近乎示弱。

      　　「我只是很想你，想趕快看看你，可是又不敢讓你看見我這個樣子……至少在咖啡廳裡，我還能偷偷確認，來點漢堡的人會不會是你。」

      　　他抬起眼，望向古·拉哈·提亞。

      　　「對不起，拉哈。」

      　　這一次，古·拉哈·提亞終於沒有再抽回手。

      　　他看著眼前的人，看著那雙疲憊卻仍努力望著自己的眼睛，胸口原本燒得猛烈的怒火一點一點沉了下去，留下的是更酸澀、更無可奈何的疼。

      　　「你真的很過分。」

      　　他的聲音仍舊沙啞。

      　　光輕輕點頭。

      　　「嗯。」

      　　「每次都率先道歉這一點，也很過分。」

      　　「嗯。」

      　　「明明讓人生氣，卻又讓人沒辦法繼續生氣。」古·拉哈·提亞低聲說，「這一點尤其過分。」

      　　光抬眼看他，遲疑了一瞬，才小心翼翼地問：「那這次呢？」

      　　古·拉哈·提亞看了他一眼。

      　　「這次我已經在生氣了。」

      　　光沒忍住，低低笑了一聲。

      　　那笑聲很輕，卻讓貓魅青年的表情更複雜了。他像是想再說些什麼重話，最後卻只是深吸一口氣，伸手按住光沒有受傷的肩膀，迫使他重新坐好。

      　　「請你不要亂動。」

      　　「好。」

      　　「也不要再躲。」

      　　「好。」

      　　「治療的時候如果疼，請立刻告訴我。」

      　　光安靜片刻，才低聲回應：「好。」

      　　古·拉哈·提亞抬起雙手，溫暖的治癒之光隨之在掌心亮起，柔和的魔力緩緩覆上那些猙獰的灼傷，將殘留在傷口深處的灼熱一點點帶走。

      　　治療並不算輕鬆。

      　　那些傷口拖得太久，古·拉哈·提亞不得不花更多時間，針對嚴重程度不一的地方細細調整乙太的流向。光幾次疼得指尖發顫，卻又差點下意識忍住，直到古·拉哈·提亞抬眼看向他，他才乖乖開口承認。

      　　「……有點疼。」

      　　「你剛剛答應我會立刻說的。」

      　　古·拉哈·提亞嘴上仍不肯輕易放過他，手上的魔力卻放得更柔。

      　　光看著他低垂的眉眼，忽然覺得胸口比傷口還要難受。

      　　「拉哈。」

      　　「嗯？」

      　　「我以後不會再這樣了。」

      　　古·拉哈·提亞沒有立刻回答。

      　　直到治癒的光芒漸漸淡去，他才重重地呼了口氣。青年俯下身，將額頭輕輕抵在光的肩上。那動作避開了所有尚未完全癒合的傷口，輕得幾乎不像擁抱，卻又帶著壓抑許久後終於落下的重量。

      　　「請你記得。」他低聲在光的耳邊說，「你不是只有在完好無傷的時候，才可以回來見我。」

      　　光的呼吸微微停住。

      　　古·拉哈·提亞抬手，輕輕抱住他。

      　　「受傷的時候可以回來，狼狽的時候可以回來，什麼都做不到、只想休息的時候也可以回來。」他的聲音貼著光的肩膀，悶悶的，卻清楚得無法忽視，「我不是說過了嗎？我也想為你分擔身上的重擔。」

      　　光閉上眼，許久後，才慢慢回抱住他。

      　　「嗯。」

      　　他的聲音有些啞。

      　　「我記住了。」

      　　兩人就這樣安靜地抱了一會兒。

      　　直到古·拉哈·提亞終於想起自己還在生氣，才退開些許，板起臉看他。

      　　「還有，明天請你讓醫師再檢查一次。」

      　　「好。」

      　　「這幾天也請不要接任何委託。」

      　　「好。」

      　　「背水咖啡廳那邊，更不可以再偷偷去廚房。」

      　　光沉默了一下。

      　　古·拉哈·提亞瞇起眼。

      　　「……光！」

      　　「……好。」

      　　貓魅青年這才稍稍滿意，但很快又補上一句：「至於你帶回來的那些食材，等你好好休息、傷勢穩定之後，再做給我吃。」

      　　光怔了怔。

      　　古·拉哈·提亞別開眼，臉頰微微發紅，語氣卻仍努力維持嚴肅。

      　　「不是做給咖啡廳的客人。」他頓了頓，小聲補充，「是做給我的那種。」

      　　光看著他，眼底終於浮起一點真切的笑意。

      　　「好。」

      　　他握住古·拉哈·提亞的手，低聲答應。

      　　「等我好了，就做給你吃。」

      　　古·拉哈·提亞看了他一眼，像是仍想說些什麼重話，可最後也只是嘆了口氣，重新將人小心地按回床上。

      　　「現在請先睡吧，在野外紮營根本不算好好休息。」

      　　「你還在生氣嗎？」

      　　「是。」

      　　光聽見他毫不留情的答案，連忙乖乖躺好，又忍不住望向他。

      　　「那你會留下來嗎？」

      　　古·拉哈·提亞沉默了一瞬，最後坐到床邊，替他拉好被子。

      　　「我會。」

      　　他垂下眼，指尖輕輕撫過光的額髮。

      　　「所以，請你也留下來。」

      　　光望著他，像是終於在這句話裡安定下來。

      　　「嗯，我哪都不去。」

      　　窗外的舊薩雷安逐漸沉入夜色，房間裡只剩下平穩而安靜的呼吸聲。古·拉哈·提亞坐在床邊，掌心仍覆著光的手背，直到確認對方真的睡去，才低低地、幾不可聞地嘆了口氣。
      　　
      　　「……到底該拿你怎麼辦才好呢。」
      　　
      　　而回答他的，只有英雄輕輕顫動著的指尖。
