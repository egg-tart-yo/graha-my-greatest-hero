  - 歡樂/甜文向
updated: 2026-11-13
summary: 請聽完6.0片尾曲、跑完6.0與塔塔露相關的某個支線再點開
series: 短篇
status: finished
chapters:
  - title: 前篇
    body: |-
      　　「也就是說，藉由這套來自薩雷安的天文占星術，即便命運如浩瀚星海般幽眇，亦能從中窺見微小的指引……」

      　　石之家的大廳裡，尤里安傑修長的手指撫過天球儀四周懸浮的星芒，輕柔的語調宛如在吟唱古老的長詩。

      　　一旁的兔兔族圍著優雅的精靈，耳朵興奮地高高豎起，每一雙大眼睛都被星光照映得熠熠生輝。

      　　「原來這就是亞伊太利斯人的『占卜』嗎？不是靠終端運算或乙太生成，而是看星象的排列？」

      　　「太神祕了！請務必演示給我們看！」

      　　興奮又好奇的要求此起彼落，一旁甚至還有推著眼鏡的兔兔族，勤奮地用終端仔細記錄。歡騰的喧鬧聲讓平日沉靜的石之家也染上了幾分暖意。

      　　在一旁好奇觀看的古·拉哈·提亞抱著手臂，耳朵微微抖動，目光忍不住落往懸浮於星盤旁的卡牌上。

      　　內心幾番天人交戰後，紅髮貓魅猶豫地挪了過來，眼神飄移、尾巴尖端不安地左右晃動。

      　　「……那個，尤里安傑。」他遲疑卻誠心地發問：「你剛才說『窺見微小的指引』……真的什麼都能算嗎？」

      　　「沒錯。無論是前行的航向，亦或是心靈之所歸，總會有跡可循。」尤里安傑抬起眼眸，朝貓魅微微一笑，「古·拉哈難道有何迷惘，需要藉助星芒的指引？」

      　　「就是……那個，也不是什麼大事……」

      　　青年可疑地交互搓著手臂，支支吾吾了半天，卻連一句像樣的解釋也擠不出來。尷尬又靦腆的模樣忍不住引起其他人的注意──放下書的阿莉塞、中斷與兔兔們交流的阿爾菲諾，甚至連靠在牆邊的桑克瑞德都拋來了視線。

      　　兔兔們朝同一個方向疑惑地偏過頭，數道眼神全都投注於將身子縮得越來越小的貓魅。

      　　最終，是尤里安傑的輕笑打破了逐漸蔓延的尷尬。他捧起星球儀，朝古·拉哈·提亞微微彎腰，示意他無須多做解釋，僅需在內心仔細思考自己的問題後，隨直覺抽牌即可。

      　　「星芒與你乙太的共鳴，終會指引方向。」

      　　原本游移不定的赤紅眼眸微微垂落，片刻後，像是終於鼓起了勇氣，眼底重新燃起一抹堅定的光芒。古·拉哈·提亞懸在半空的手指，在緩緩旋轉、泛著柔和光芒的卡牌間游移，總算謹慎地挑了其中一張。

      　　指尖觸及卡面的瞬間，環繞在兩人周圍的乙太綻開一片絢麗的星光。圍觀的兔兔們頓時興奮得又蹦又跳，發出此起彼落的驚嘆聲。

      　　然而，伸手接過貓魅遞來卡牌的尤里安傑，眉頭卻微不可察地蹙了起來。異樣的沉默讓大廳的喧鬧逐漸熄滅，歡騰的氣氛也隨之一點一滴地凝結。

      　　「……尤里安傑？」
      　　
      　　古·拉哈·提亞緊張得尾巴都炸開了一小撮，他試圖墊起腳、看清卡牌的模樣，奈何就算看見了牌面，也不具備解讀星光的知識。

      　　精靈那雙溫潤的眼眸在他身上停留許久，彷彿正艱難地斟酌措辭，良久才緩緩解釋：「這是……『逆位』之兆，黯淡星芒所連綴而成的，正是『災厄之宿星』。」他深吸了一口氣，用嚴肅莊重的語調宣布：「簡而言之──是大凶。若問及運勢，恐有災禍迫在眉睫；若涉足情愛，恐將迎來毀滅般的打擊與無盡的──」

      　　「──大、大凶？！」

      　　後段的解釋，貓魅一個字都沒聽進去。

      　　此刻，宛如雷擊般的噩耗降臨在古·拉哈·提亞的身上。他顫巍巍地抬起手，抱住因動搖而顫抖的耳朵，腦海裡翻湧而出的，全是自己一直以來努力追逐的背影。

      　　「毀滅……？該……該不會，我跟光……」

      　　內心遭受過於嚴重的打擊，英雄的名字就這麼脫口而出，而始終在旁關切的拂曉眾人皆是一愣，隨後發出「果然如此」的輕嘆。

      　　阿莉塞聳聳肩，小聲對阿爾菲諾說：「看來是想問感情煩惱啊。」

      　　而雙胞胎哥哥也露出微笑，「從一開始就不需要猜測對象呢。」

      　　「別過度擔憂。」

      　　走到古·拉哈·提亞身旁的桑克瑞德抬手拍了拍低落的肩膀，帶著幾分好笑勸道：「事在人為。占卜頂多算是個路標，至於路要怎麼走、最終又能走到哪裡，現在下定論可還太早了喔。」

      　　「真的嗎……桑克瑞德……」

      　　向來沉穩的賢人，此刻的紅瞳被眼底泛起的水波沖得搖搖晃晃，眼眶邊緣甚至噙著兩團淚，無措地望向桑克瑞德。就在這時，一旁的兔兔族興高采烈地蹦了出來，獻寶似地高舉著自己的手持終端，直直竄進了貓魅淚汪汪的視線中。

      　　「請別擔心，先生！我們在月球上為了理解亞伊太利斯人，可是蒐集了海量的『人際情感互動資料』！」

      　　深切領教過兔兔族對人類認知偏差的賢人們面面相覷，然而另一名兔兔已經昂首挺胸，用毛茸茸的手掌拍了拍胸口，信誓旦旦地掛起保證。

      　　「這套《亞伊太利斯人類戀愛成功率最大化行為指南》第四版，可是我、閱明威嘔心瀝血的傑作！」終端的螢幕藍光映入貓魅的眼眸，急於證明自身價值的兔兔滔滔不絕地解說：「根據我的縝密分析，若想攻陷目標對象的心防，第一步首先嘗試『熱量與糖分高度濃縮的手工製成物』，也就是你們人類俗稱的手作甜點，效果最為拔群！」

      　　「正是如此！」一旁自稱為烹飪威的兔兔搖了搖耳朵，甚至不知從哪裡扛出了一把人類尺寸的沉重鍋具，眼神燃燒著熊熊鬥志湊了上來，「人類的俗話不是這樣說嗎？『若要抓住一個人的心，必須先抓住他的胃』！」

      　　這些亂七八糟的東西到底是誰教他們的？總不可能是海德林吧。桑克瑞德無言的眼神斜斜遞了過去，卻只換來尤里安傑無辜的輕咳與苦笑。

      　　正當眾人無言以對之際，不知何時站在兔群正中央的夢想威，意氣風發地高舉毛茸茸的拳頭，朝著全體同胞元氣十足地宣布：「那麼，現在就正式啟動這位貓魅族先生的『搶救戀情大作戰』！」

      　　「『哦────！』」

      　　激昂的歡呼震得石之家嗡嗡作響。

      　　顯然，自從人類撤退月球的計劃終止後，這群無處安放熱情與使命感的兔兔們，在此刻找到了新的目標。

      　　而被這群毛球團團簇擁、推著往外走的古·拉哈·提亞徹底慌了手腳，貓耳無助地壓低，頻頻回頭朝拂曉同伴們投來求救的目光，看得在場幾人既好笑又有些不忍。

      　　抱著長槍倚在牆邊的艾斯蒂尼安蹙起眉，踱步往神色各異的同伴走來，沉聲拋出詢問：「這樣真的沒問題嗎？會不會有兔毛掉進甜點裡？」

      　　「重點不是兔毛吧……喂！拉哈，等等我！」

      　　實在放心不下的阿莉塞按著額頭重重嘆了一口氣、快步跟了上去。後方的雅·修朵拉則是勾起一抹玩味的笑意，與無奈聳肩的桑克瑞德交換了一個心照不宣的眼神。

      　　「這樣也沒什麼不好。」貓魅屈起指節、輕抵著臉頰，笑著打趣道：「畢竟大受打擊的人，總需要找點事情來轉移注意力。」

      　　「妳是說古·拉哈？」

      　　「失去使命的兔兔族也是吧。」尤里安傑溫聲接過話，隨後優雅地收起星盤，衣袍在腳邊劃出圓弧，也跟著邁開步伐。

      　　於是，這場瞞著英雄、被命名威取名為「第一回合：愛心料理作戰」的行動就這麼拉開了序幕。

      　　在塔塔露的協調下，眾人借用了羅薇娜商會據點裡的烹飪工坊，古·拉哈·提亞就這麼在裡頭奮戰了整整一上午。期間歷經了烹飪威端出精心配置的科技改良半成品，被阿莉塞無情駁回；烤箱因兩次火候拿捏不當而冒出嗆人的焦煙；以及堆放在一旁、數次比例調配失敗的麵糊。最終，戴著厚實烘焙手套的古·拉哈·提亞，總算戰戰兢兢地端出了一盤色澤金黃、烤得恰到好處的餅乾。

      　　眾人屏氣凝神地從烤盤上取下成品，在手掌中交互拋丟放涼、掰碎分食。當濃郁甘甜的味道與酥脆的口感在口中綻放的瞬間，狹窄的廚房裡頓時爆發出一陣熱烈的歡呼。

      　　「太好了……」

      　　看著阿莉塞眼神一亮的讚許，以及好吃到用肉嘟嘟的兔掌猛揉臉頰的兔兔們，渾身緊繃的古·拉哈·提亞這才如釋重負，僵立許久的耳朵也總算放鬆地軟了下來。

      　　真要說起來，他並不特別擅長烘焙──畢竟那位英雄本身就是個手藝高超的烹飪師。在多數日子裡，拂曉的同伴們向來只有眼巴巴等著被對方餵食的份。但也正因大家的舌尖早被光給養刁了，如今能得到他們的誇讚，標準可比尋常人高上許多。

      　　「味道真是太完美了，先生！」

      　　「亞伊太利斯的甜點實在是太棒了！我想改名叫餅乾威！」

      　　兔兔們此起彼落的熱烈吹捧讓貓魅有些招架不住。他握拳抵唇輕咳了一聲，努力穩住泛紅的耳根與飄飄然的心緒，轉頭望向現場唯一靠得住的同伴。

      　　「阿莉塞，妳覺得……光真的會喜歡嗎？」

      　　看慣了對方在冒險中敏銳果決、令人安心的可靠模樣，如今見古·拉哈·提亞這副患得患失、躊躇不安的狀態，讓阿莉塞一時有些無法適應。

      　　餅乾確實挑不出毛病，作為禮物送給英雄也並無不妥，但少女眼底依然閃過一絲難以言喻的擔憂。她斟酌再三，還是忍不住欲言又止，「那個……拉哈，其實我覺得光……」

      　　「大家聽我說──！」

      　　精靈的話被一聲通知硬生生打斷。負責放哨的瞭望威顯然是一路從石之家狂奔而來，兩隻毛茸茸的手掌死死抓著廚房門框，上氣不接下氣地喊：「英雄！那名英雄回來了！」

      　　頃刻間，所有兔兔族的耳朵整齊劃一地立得筆直，宛如星球海洋般澄澈蔚藍的圓眼紛紛亮起警備的光芒。

      　　「作戰開始！」

      　　還來不及做好心理準備，身為主角的古·拉哈·提亞便被湧上來的兔兔族團團包圍，整個人化作乳白色毛球浪潮中一抹顯眼的紅，不由分說地被捲往門外。

      　　「喂！等等啊！」

      　　阿莉塞扶額嘆氣，只得放下手中的廚具、快步追了上去。然而當她氣喘吁吁趕到走廊轉角時，剛好撞見結束任務歸來、停下腳步的光。

      　　光正疑惑地端詳著侷促站在身前的古·拉哈·提亞。貓魅賢人雙手小心翼翼地捧著一個包裝好的點心盒，外層纏繞著的緞帶，甚至是與光的眼眸如出一轍的蔚藍色。

      　　退回柱邊死角的阿莉塞，與一眾兔兔們小心翼翼地探頭，屏息等待著。

      　　古·拉哈·提亞的耳朵緊張地壓平，赤紅的眼眸雖然緊緊注視著英雄，嘴唇卻幾度微張又無聲抿緊。

      　　加油啊笨蛋！就直接塞給他啊！還等什麼！

      　　躲在廊柱後的少女看得胃部一陣糾結，忍不住在心中大聲吶喊。

      　　就在古·拉哈·提亞好不容易鼓足勇氣想要開口時，光卻率先動了起來。他卸下沉重的大劍，隨手倚在牆邊，隨即微微彎下身，朝著貓魅探出手。

      　　古·拉哈·提亞的心臟猛地一跳，指尖下意識握緊了紙盒。然而，那隻寬大的手掌越過了精緻的點心盒，修長的指節只是極其自然擦過貓魅挺直的鼻樑，抹去了那裡不小心沾到的一抹雪白糖粉。

      　　「怎麼弄得滿臉都是？」

      　　光收回手指，捻了捻指尖細緻的粉末，眼底漫開一抹新奇的笑意。

      　　「要是嘴饞想吃點心，等我回來跟我說一聲就好，何必自己做？」

      　　英雄的話語溫和帶笑，目光卻完全沒在小盒子上多作停留，似乎只將這一切歸咎成了對方因嘴饞的心血來潮。

      　　──啊啊啊又一個無藥可救的大笨蛋、超級木頭、全拂曉最遲鈍的傢伙！

      　　阿莉塞痛苦地閉上雙眼，甚至覺得胃部傳來一陣真實的痙攣。她只能抱著肚子、默默縮回柱子的陰影處，不忍再看下去。

      　　而被留在原地的古·拉哈·提亞嘴唇微張，喉間像是被什麼東西堵住似的乾澀。

      　　不是的……

      　　不是他自己想吃，這是想要送給……

      　　但那句在心底演練多次的話語，在光看似理解的體貼目光下，全被硬生生卡在了喉間。錯失了最好的坦白時機，貓魅那對毛茸茸的耳朵一點一點地塌了下去，無力地貼在紅髮兩側，炙熱的心意彷彿被冷水澆熄，只剩下滿腔空落的情緒。

      　　「嗯？怎麼露出這副表情。」

      　　見他一言不發地垂著腦袋，光有些好笑地握住他的肩膀，更誤以為是被當場抓包而感到難為情。

      　　英雄最終只是語氣溫柔地安慰了一句：「不用介意，想吃甜食又不是什麼壞事。好了，我得先去回報任務，晚點再說。」然後就俐落地收回手，厚重的披風隨著轉身揚起，步伐輕快地朝著石之家走去。

      　　走廊裡只剩下漸行漸遠的腳步聲。

      　　古·拉哈·提亞捧著餅乾盒的手臂緩緩垂落，連同身後那條微微晃動的長尾，此刻也無精打采地垂在腳邊。

      　　躲在周圍的兔兔們面面相覷，原本高高豎起的耳朵全都垂了下來。他們顯然沒料到大名鼎鼎的英雄，在情感這塊的敏銳度，竟然不比一隻礦爬蟲高上多少。

      　　在一片死寂的低迷氣氛中，夢想威邁開小短腿跑了上來，伸出肉爪輕輕扯了扯古·拉哈·提亞垂墜在旁的衣擺。

      　　「先生，請千萬不要氣餒！」

      　　夢想威再次舉起小小的毛毛拳頭，用盡全力打著氣：「英雄超乎常人的遲鈍，也、也全在我們的計算範圍內！只要我們不放棄，把接下來的計畫貫徹到底，一定能實現先生心中最美麗的夢想！」

      　　古·拉哈·提亞怔怔地低下頭，看著眼前這群即便計畫失敗，卻依然提起精神為自己打氣的夥伴，又望向懷裡那盒未曾送出的甜點。良久，他沉甸甸地吐了口氣，強行將眼底鼓譟的失落壓了下去，赤紅的雙眸重新彎起一抹無奈卻柔軟的弧度。

      　　「……說得也是，現在放棄還太早了。」

      　　他半蹲下身子，伸出手，鄭重其事地握住了兔兔族小巧柔軟的絨毛手掌。

      　　「那麼接下來也拜託你們了。」

      　　就這樣，「第二回合：雄壯威武的展示」再接再厲地展開。

      　　根據閱明威的說明，生物個體往往需要展現自己強大的一面，方能捕獲他人的視線。原本根據兔兔們端出的計畫，是要古·拉哈·提亞隨同英雄出任務時，搶在最前線率先開怪，甚至以一人之力單挑整場討伐任務。

      　　這項充滿送命意味的莽撞提案，當場被忍無可忍的阿莉塞厲聲制止。

      　　「光那傢伙雖然平時散漫又不擅長計畫，但在戰鬥中的直覺可是準得可怕。」精靈少女雙手叉腰，眉眼間滿是嚴肅的警告，「每一次組隊出任務，職能與戰術的配置都是出自於他的經驗。要是在任務中做出什麼預料之外的舉動，可是很危險的。」

      　　被當頭澆了一盆冷水的兔兔們垂下了耳朵，古·拉哈·提亞也有些心虛地縮了縮脖子。

      　　看著貓魅那副懊惱又無措的模樣，阿莉塞緊繃的神色終究還是軟化了幾分，輕輕嘆了口氣。

      　　「我說你啊……其實根本不需要勉強自己去扮演什麼『強大帥氣』的角色。」她抱起雙臂，勸說的語氣帶著一貫的直率，「我倒覺得，只要你能陪在光身邊一起出任務，那傢伙就已經很滿足了。」

      　　畢竟你原本的模樣，光從來都沒有嫌棄過。

      　　古·拉哈·提亞微微一怔，赤紅的雙眸閃爍著動搖，指尖下意識地抓緊了衣角。

      　　「但是……占卜的結果是大凶……」他的聲音壓得很低，帶著一絲掙扎與掩飾不住的苦澀。

      　　阿莉塞看著他，心中忽然有些酸澀。果然，這隻固執的貓魅心底真正在意的，也許不完全是自己的感情到底如何，而是英雄的未來若纏上彷彿詛咒般的「大凶」，那他會用盡一切辦法，去扭轉那可能改變的結局。

      　　從最初水晶塔的相遇，到第一世界的漫長歲月，這份心意始終不曾改變。

      　　「……真是拿你沒辦法。」

      　　阿莉塞妥協似地撇了撇嘴，沉吟了一會，最後耐著性子提議：「那這樣如何？收起那些亂七八糟的作戰計畫，像平常一樣，單純陪著他去一趟討伐戰。在戰鬥中盡全力配合他、做好職能該做的事，這樣就足夠了。」

      　　「真的……只要這樣就好嗎？」

      　　古·拉哈·提亞半信半疑地眨了眨眼，頭頂的耳朵遲疑地動了動。

      　　「這樣絕對可以。你相信自己的同伴吧？」精靈少女無比篤定地點了點頭。

      　　然而，理想與現實之間，往往隔著一層無法以常理衡量的變因。

      　　當真正踏上魔物橫行的草原時，古·拉哈·提亞才發現自己有些無法維持平常心。

      　　一路上，他的耳邊不是迴盪阿莉塞的叮囑，就是兔兔們高喊「展現雄壯威武」的加油聲。種種思緒在腦內攪成一團漿糊，拖慢了以往俐落的動作。

      　　隊伍前方的光迅速地揮劍、劈斬一頭狂暴的魔物，回身遞來的眼神帶著一如往常的信任，示意貓魅開始加強進攻的節奏──那一瞬間，古·拉哈·提亞繃緊神經，滿心只想回應光的期待。

      　　「好、交給我──哇啊？！」

      　　誰知，只顧著警戒前方的貓魅竟好死不死地絆到了腳下的枯枝。伴隨著一聲狼狽的驚叫，古·拉哈·提亞在全體隊伍發動總攻擊的瞬間，整個人以狼狽的姿勢一頭栽進了路旁的灌木叢裡。

      　　「拉哈？！」

      　　等術法與劍氣雙雙消散、周圍剩下成堆的魔物屍體時，尚有動靜的僅有後方劇烈晃動的草叢。

      　　光率先收起武器，快步走到灌木叢邊，有些好笑地背對一眾困惑的隊友，彎下身子、抓住那件沾滿碎葉的墨色圍領，像拎小貓似地將古·拉哈·提亞救了出來。

      　　「嗚……」

      　　古·拉哈·提亞兩隻耳朵徹底扁平地貼著腦袋，長長的尾巴糾結地纏在一起，臉頰紅得像是熟透的番茄。

      　　英雄將他穩穩放在草地上，並沒有半分責備，唇角反而止不住地向上揚起。在貓魅無地自容的目光中，光自然地抬起手，用粗糙而溫暖的指腹，一點一點拭去他鼻尖與臉頰上蹭到的泥土，又揉了揉他頭頂那對沮喪而垂落的貓耳。

      　　「剛剛那下摔得挺有爆發的氣勢，沒受傷吧？」

      　　光的眼底盈滿了柔軟的笑意。

      　　而古·拉哈·提亞的臉頰上雖然殘留著溫暖的觸感，失誤造成的挫敗卻讓內心充滿羞恥，即使回程的路途中英雄四處逗弄他，也難以提振起精神。
  - title: 後篇
    body: |-
      　　這下計畫又再度失敗了。

      　　「既然這樣也行不通，就只能使出殺手鐧了。」

      　　走火入魔般的閱明威迅速地滑動手中的終端，晶亮的眼睛倒影全是一行行被跳過的行動計劃。最終，毛茸茸的兔掌氣勢十足地在最後的計劃前停了下來，用力拍了拍終端的影像。

      　　既然拐著彎行不通，直接對決總可以吧！如此高呼著的兔兔們雙眼亮起駭人的執念。

      　　於是，在拂曉全體擔憂的目光中，大量的鮮花就這麼被運進了石之家。在兔兔族的精心布置下，溫馨的空間被妝點得像是盛大婚禮的現場，遠方甚至還有兔兔族不曉得用什麼月面科技裝置打出的心形投影，環繞在場地中央。

      　　古·拉哈·提亞就這麼被半推半就地簇擁到了中央，手中還被塞了一大束鮮花；而另一端，恰巧沒出任務的光也被兔兔們左牽著手右推著背、磕磕絆絆地拉上了台。

      　　英雄的掌心被交到了貓魅手裡。

      　　相較於緊張到尾巴止不住顫抖的古·拉哈·提亞，光的眼神倒是十分從容。藍眼稍稍一抬、環顧著四周的布景，然後在夢想威燦爛笑著的兔臉上停留片刻，最後注視著一臉擔憂的阿莉塞，便很快地推論出這場騷動大致的來龍去脈。

      　　光垂下眼，其中滿是藏不住的笑意。

      　　「所以，你現在願意告訴我，這段時間你到底在背著我忙些什麼了嗎？拉哈。」

      　　對方的語氣一如既往的溫和，古·拉哈·提亞卻無端生出心虛的情緒。害怕被誤解的他，手忙腳亂地將懷裡那束攥得死緊的花束遞到光的手中，隨後深吸了一口氣、暗暗咬緊牙關，像是將過往人生中的勇氣全數押在這一刻。

      　　那雙赤紅的貓眼帶著豁出一切的決絕，直直迎上英雄的視線。

      　　他的嗓音起初還有些發顫，話語也吞吞吐吐，滾燙的熱度卻早已順著脖頸一路燒紅了耳朵。

      　　「是……是因為占卜是大凶。」

      　　見光困惑地偏過頭，他慌張地揮舞著手，顛三倒四地解釋：「前陣子請尤里安傑占卜，星象的結果卻顯示……若是涉足感情，只會招致毀滅般的打擊。」

      　　他咽了咽乾澀的喉嚨，喉結艱難地滾動，將這段時間的煎熬與考量、不甘與挫敗，全數一股腦傾洩出來。

      　　「我喜歡你，這份心意連我自己都控制不住。但如果我的感情，反而會讓你往後的未來迎來不幸……那樣的事情，我絕對不容許。」

      　　他緊張地絞著衣角，指尖用力到發白，聲音帶著一絲卑微的期盼與懇求，「所以我想用盡一切去扭轉這個凶兆……也想證明給命運看，這份心意並不是壞事。同時也私心地想著，如果你也……如果你也能轉過頭來看著我、接受我的話，兩個人在一起，是不是就能跨過這個不好的預兆？」

      　　說到這裡，古·拉哈·提亞別開了通紅的臉龐，語氣輕得像是隨時會被微風吹散，其中蘊含的堅毅卻讓光皺起眉頭。

      　　「然而，如果我用盡了所有的辦法，最後星象依然是不好的結果……那我不能讓這份心意害了你。」他數次深呼吸，彷彿說出的每一個字都帶給自己無比的痛苦，卻依然強撐著語調，「若喜歡你會帶來不幸，我寧可選擇離開。只要你的未來──」

      　　那些帶著自我放逐的決心甚至還沒來得及說完，耳邊便傳來一聲極輕的沙沙聲。

      　　光毫不在意地鬆開了手，任由精美的花束無聲地落在一旁的石地上，英雄甚至沒給貓魅退縮或躲避的餘地，只是向前一步，不由分說地將那具微微發顫的身軀扣進了自己的懷抱。

      　　熟悉的溫暖氣息如浪潮般將他淹沒。

      　　被緊緊按入胸膛的古·拉哈·提亞渾身僵住，泛著水霧的紅眼茫然地睜大，連因沮喪而垂落的耳朵也因為突如其來的擁抱，驚慌失措地緊貼在對方的頸側。

      　　「所以，拋下我會是你的選項之一嗎？拉哈。」

      　　光的聲音自頭頂沉沉落下，帶著幾分無奈與不易察覺的顫抖，攬在他後背的手臂更是收得死緊，彷彿只要稍一鬆手，這隻總是習慣自己揹負一切的貓魅，就會從他的懷裡消失。
      　　
      　　「明明沒有你，我甚至連未來都不會擁有……」

      　　英雄拉開了些許距離，深邃的眼眸直直映出貓魅慌亂的臉龐，帶著苦澀的質問步步逼近，「如果真的迎來災厄，那些在水晶塔頂、在石之家、在天外天垓對我許下的約定……難道都不算數了嗎？」
      　　
      　　──光在害怕。

      　　感知到這樣的事實，胸口像是被重重撞了一下。深怕對方誤解的焦急，瞬間壓過了所有的怯懦與顧慮，古·拉哈·提亞甚至顧不得自己通紅的眼眶，急忙伸出雙臂，用盡全身的力氣死死回抱住眼前的英雄。

      　　「當然算數！怎麼可能不算數！」

      　　他的聲音混著濃重的鼻音，尾巴因為過於激動而緊緊將兩人纏繞在一起。
      　　
      　　「那些約定，都是我最真實的心願！」他激動地喊出聲，渾然不顧自己此刻的模樣有多狼狽，「只要你願意，別說是下一趟冒險──就算要許下直到我們雙雙回歸星海的誓言，直至世界的終點、最後的旅程，我也絕不反悔！」
      　　
      　　由真心淬煉而出的承諾，一點一點融去光眼底的不安。

      　　嘆口氣的光微微俯下身，將溫熱的額頭輕輕貼上了貓魅的前額。
      　　
      　　「那就別輕易放棄。」
      　　
      　　能感受到彼此呼吸的距離裡，光低聲開口，字句沉穩而堅定，「災厄也好、末日也好，只要你願意相信，我就不會被擊倒。」
      　　
      　　英雄彎起唇角，眼眸裡倒映著那抹熾熱的艷紅。

      　　「──畢竟，我可是你最憧憬的大英雄啊。」

      　　那一瞬間，盤踞在心頭數日的陰霾，被這句繫著牽絆的話語吹得煙消雲散。古·拉哈·提亞怔怔地望著近在咫尺的光，在眼眶裡打轉許久的淚水終於忍不住奪眶而出，卻在落下的瞬間綻開了無比燦爛的笑容。

      　　紅髮貓魅破涕為笑，頭頂那對毛茸茸的耳朵歡快地抖動著，不再有絲毫的遲疑，整個人奮力向前撲進了對方的頸窩裡，任由滾燙的淚水打濕了英雄的衣襟。

      　　一旁傳來阿莉塞的一聲嗚咽，精靈少女總算鬆開原本緊緊握住的手臂，粗魯地用袖子擦拭眼角；一邊苦笑揉搓著發青手臂的阿爾菲諾，與艾斯蒂尼安交換了眼底的笑意；桑克瑞德則雙手抱胸，痛快地笑出了聲。
      　　
      　　兔兔們紛紛興奮地相互擊掌，發出陣陣歡呼。
      　　
      　　在周遭此起彼落的歡呼聲中，古·拉哈·提亞望著視野裡糊成一片的光，沒來由地產生一股衝動。
      　　
      　　他揪著光胸前的衣襟，猛地踮起腳尖，帶著滿臉未乾的淚痕與滾燙的鼻息，笨拙卻無比堅定地吻了上去。而英雄只是微微一怔，隨即收緊了環在對方腰間的手臂，任由兩人間的距離更為貼近。
      　　
      　　一場漫長而笨拙的追逐，總算在溢滿幸福的笑聲中迎來了最圓滿的落幕。

      　　只是，那個所謂讓戀情迎來毀滅打擊的「大凶」，到底是怎麼回事？

      　　正當在場眾人滿頭霧水、面面相覷之際，石之家的走廊深處忽然傳來一陣規律而清脆的腳步聲。

      　　只見拂曉血盟的資金管理人·塔塔露掛著無比燦爛、卻隱隱散發著寒氣的營業用微笑，步伐優雅地走到了眾人中央。在她小小的手中，正攥著一條長得幾乎拖到地上的帳單。

      　　她笑瞇瞇地朝著僵住的英雄揚了揚手中的明細，隨後清了清嗓子，和善的語氣卻令人毛骨悚然。
      　　
      　　「這是近日為了準備驚喜，特地動用飛空艇從黑衣森林連夜空運過來的稀有花卉費用；還有前期向羅薇娜商會緊急租借頂級烹飪工坊的場地租金；以及幾次烤焦烤箱的耗損和高級麵粉的材料清單，全部的明細都列在這裡喔！」

      　　伴隨著她的話語，帳單「唰」地一聲在空中展開，撇開為首的數字不談，光是結尾那一連串觸目驚心的零，讓哪怕面對末日都不曾退縮的英雄當場倒抽了一口氣，發出了一聲響徹石之家的絕望哀號。

      　　圍觀的拂曉眾人頓時換上了同情的目光。

      　　原來「涉足情愛將迎來毀滅性的打擊」，指的是英雄的錢包。

      　　看著石化在原地、整個人褪了一層色的光，古·拉哈·提亞先是一愣，隨後噗嗤一聲笑了出來。他悄悄收緊了十指，尾巴也繞上英雄僵硬的手臂，笑容帶著歉意與溫柔，認認真真地許下承諾：「光，說好了──不管是怎樣的大凶，今後我們都要一起想辦法面對喔。」

      　　而大廳的角落裡，一陣微弱而細碎的窸窣聲在長袍下響起。

      　　夢想威和閱明威踮著毛茸茸的腳尖，一左一右拉了拉精靈垂墜的衣角，仰著圓滾滾的大腦袋，蔚藍的眼睛明晃晃地閃動著。

      　　「尤里安傑、尤里安傑！」

      　　「我們的作戰……有好好幫上忙了嗎？」

      　　精靈賢人垂頭，看著腳邊滿臉期待誇讚的毛球們，眼底泛起深邃而溫和的笑意，鄭重其事地點了點頭。

      　　「是的。雖有波折，但多虧了諸位，做得非常出色喔。」

      　　一旁的桑克瑞德忍不住扶著額頭，斜眼瞪著這位滿臉慈祥的占星術師，無奈至極地嘖了一聲。
      　　
      　　「我說你啊……再這麼寵他們，會出事的喔。」
  - title: 番外
    body: |-
      　　「那麼，關於在十二神大聖堂舉辦的『永結同心典禮』，目前我們大繁榮商店推出了三種特別規格的尊榮方案！」
      　　
      　　石之家的長桌前，向前傾身的塔塔露將上身靠在桌上，三份精美的燙金型錄被小小的手往前一推，圓滾滾的大眼睛裡滿是精明的光芒。
      　　
      　　「首先是基礎的標準方案，包含最基本的禮服與場地租借；再來是黃金方案，增加了專屬的塔塔露樂隊演奏與進場的花瓣雨；至於最後這份特別版的白金方案──」塔塔露神秘地豎起一根手指，壓低了聲音誘惑到：「除了大繁榮商店特別出品的高級訂製禮服、最氣派的場景佈置跟特別版祝福道具，連兩位在典禮上交換的戒指都與前兩份方案不同。除了指環內側可以刻上具有特殊含義的字句外，戒指本身也具有增幅的力量，未來處理任務或者是戰鬥都絕對能派上用場！」
      　　
      　　「戒指……」
      　　
      　　坐在一旁的古·拉哈·提亞聞言，耳朵振奮地豎了起來。能無時無刻傳送到英雄身邊的飾品對他來說無疑有致命的吸引力。而將貓魅眼底越來越亮的星光看在眼裡的光，心頭柔軟了許多。
      　　
      　　英雄下意識伸手摸了摸腰間乾扁扁的錢袋，頓時又蒼白了幾分。
      　　
      　　自從經歷了那場「大凶」帳單的洗禮後，他的財務狀況至今仍處於入不敷出的赤字。理智告訴他應該果斷選擇最基礎的結婚方案，但只要一想到貓魅雙眼發光、期待又憧憬的表情，光便暗暗咬了咬牙。
      　　
      　　現在正是自己為這隻努力走到他身邊的貓魅挺身而出的時候。大不了接下來幾個月多接幾趟狩獵任務……或者去挖藏寶圖……再來、再來還可以去找羅薇娜商會，看看能不能談點貸款──
      　　
      　　想到那一臉精明的女人，光下意識打了寒顫。
      　　
      　　他定了定神、手指往最右邊的燙金型錄指去，硬著頭皮開口詢問：「塔塔露，關於白金方案的費用……」
      　　
      　　身側卻忽然伸出一隻修長的手，輕輕按住了他放在桌上的手背。
      　　
      　　「等一下，光。」
      　　
      　　古·拉哈·提亞不知何時已經收起了方才那副夢幻的神情，貓魅修長的眉微微蹙起，認真的紅眼不急不徐地迎上塔塔露的視線。恍惚間，光彷彿看見那披著兜帽的氣韻再次出現在他的伴侶身上，帶著統領城邦的精明與魄力，將交疊的雙手輕抵在下巴前。
      　　
      　　「塔塔露，大繁榮商店近期正打算將業務拓展至各大都市的冒險者公會吧？」
      　　
      　　塔塔露原本燦爛的笑容微微一頓，靠在桌上的手掌警覺地握成小小的拳頭，「沒錯，是有這個打算……怎麼了嗎？」
      　　
      　　「這場儀式，除了觀禮的一般人民外，各國的首領與重要人士都會出席。」古·拉哈·提亞語調平穩，條理分明地拋出籌碼，「倘若由那位拯救了世界、在艾奧傑亞無人不知的『光之戰士』親自穿上大繁榮商店的頂級禮服、乘著白陸行鳥出現在眾人眼前，這份宣傳效果，恐怕遠比花費數百萬金幣在各城市緩慢推動還來得震撼吧？」
      　　
      　　塔塔露眼神一亮，腦海裡的算盤瞬間飛快地運轉著，但作為拂曉的資金管理人，她可不會輕易被三言兩語就牽著鼻子走。
      　　
      　　「想法確實很誘人，不過大聖堂的場地維護成本可是很高的！純白陸行鳥也是大繁榮商店親自至伊修加爾德精挑細選而來！」她雙手叉腰，擺出了一副精明商人的架勢，「但既然有這層宣傳價值……那這樣吧，費用我們四六分。大繁榮商店幫你們承擔四成，剩下六成由你們支付，是很有誠意的方案吧！」
      　　
      　　「四六未免太小看英雄的號召力了。」古·拉哈·提亞不為所動，指尖輕輕點了點桌面，神色從容地強調：「這可是光之戰士的唯一一次終身大事，話題性空前絕後。我認為二八分才符合這份商業價值──商店承擔八成，我們支付兩成。」
      　　
      　　「二、二八？！這樣大繁榮商店會虧本的啦！」塔塔露嚇得跳了起來，雙手慌亂地揮舞著，「最多三七！這真的是看在多年交情的份上才給的破盤價了！」
      　　
      　　「那麼，我們再加碼一項條件。」貓魅賢人眉眼微彎，拋出了早已準備好的殺手鐧，「在儀式開始前，讓光配合拍攝三組穿著大繁榮商店新款冒險裝備的宣傳畫報，並且允許商店在各主城的布告欄進行為期半年的獨家展示。」
      　　
      　　塔塔露呼吸一滯，小手緊緊攥住衣角，顯然對這個條件心動到了極點。
      　　
      　　但精明的資金管理人很快地穩住情緒，試圖做最後的掙扎，「畫、畫報拍攝的場地與人員也是要成本的……二五對七五！商店承擔七成五，絕對不能再低了！」
      　　
      　　古·拉哈·提亞與塔塔露對視了三秒，隨後滿意地勾起唇角，優雅地伸出右手。
      　　
      　　「成交。那麼，我們會支付白金方案兩成五的費用，剩下的就麻煩大繁榮商店了。」
      　　
      　　「真不愧是……」塔塔露無奈地長嘆了一口氣，卻又掩不住談成一筆絕佳廣告生意的喜悅，豪氣地握住了貓魅的手，「一言為定！不過說好了，拍攝畫報時的動作跟表情，光可都得乖乖聽我指揮喔！」
      　　
      　　大廳裡陷入了短暫的沉默。
      　　
      　　坐在角落喝茶的桑克瑞德忍不住挑高了眉，阿莉塞則是看得目瞪口呆。而「籌碼」本人──目睹這場激烈商業交鋒的光更是愣了半晌，直到塔塔露心滿意足地抱著型錄轉身去準備合約，他才緩過神來，有些哭笑不得地看向身旁的伴侶。
      　　
      　　「你真的是……什麼時候練就這麼熟練的談判技能？」
      　　
      　　古·拉哈·提亞有些不好意思地轉過身，臉上那層屬於水晶公的威嚴瞬間褪去，重新變回了那個有些靦腆、眼底盛滿溫柔的貓魅。他吐了吐舌頭、反手握住光有些粗糙的掌心，身後的長尾歡快地輕輕晃動著。
      　　
      　　「畢竟跟你約好了，今後無論是什麼樣的難關，我們都要一起面對。」他朝著英雄俏皮地擠了擠眼睛，唇角揚起一抹溫柔可靠的笑意，「今後請多多指教囉，我的大英雄！」
