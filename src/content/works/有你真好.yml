summary: 6版主城跟理符任務注意
series: 短篇
chapters:
  - body: |-
      　　古·拉哈·提亞正懷抱著疑問，與英雄並肩在雪山裡前進。
      　　
      　　原本只要付上一筆不算太貴的傳送費就能抵達的據點，英雄卻在前哨站前停下腳步。他摸了摸腰間沒多少清脆聲響的錢袋，隨後若無其事地轉頭對貓魅說：「今天風雪不大，走過去正好活絡筋骨。」
      　　
      　　古·拉哈·提亞當時只是眨了眨紅色的眼眸，乖乖跟上。直到抵達旅店時，英雄在櫃檯前跟老闆討價還價了半天，最後只拿了一間單人借宿房間的鑰匙。
      　　
      　　光有些愧疚地抓了抓頭髮，古·拉哈·提亞的心跳卻悄悄漏了半拍，急忙搖頭安撫：「這沒什麼不好的。本來在野外露營時也常擠在一起……而且，這樣夜裡還能抱著取暖。」
      　　
      　　英雄熱淚盈眶地看著體貼又懂事的貓魅。
      　　
      　　當天晚上，兩人擠在狹窄的木床上，古·拉哈·提亞蜷起身體，像一隻家貓搬枕在英雄的臂彎裡，聽著對方均勻平緩的呼吸，終於忍不住用毛茸茸的頭頂蹭了蹭對方的下巴，低聲問了懷抱一天的疑問。
      　　
      　　「所以……你最近是買了什麼昂貴的裝備，怎麼一點旅費都沒有？」
      　　
      　　英雄沉默了很久，像是在思考怎麼回答。
      　　
      　　他把臉埋進古·拉哈·提亞柔軟的紅髮裡，悶悶地嘆了口氣，最後才吞吞吐吐地道出一些細碎的花費──修理裝備、處理任務衍生的額外費用、看見難民忍不住給予的救助。林林總總加起來，錢袋逐漸輕得快沒存在感了。
      　　
      　　沒想到拯救了世界的英雄，居然在為幾枚金幣發愁。
      　　
      　　古·拉哈·提亞在黑暗中盯著天花板想了半晌，尾巴有些焦躁地輕輕甩動。
      　　
      　　隔天清晨，趁著微光初露，他神情認真地拉住英雄睡袍的袖子。
      　　
      　　「我們回一趟摩杜納吧。」
      　　
      　　「幹嘛，回去跟桑克瑞德借錢？他才不會理我──」
      　　
      　　「不是，是把水晶塔打開。」古·拉哈·提亞的語氣認真地建議：「亞拉戈文明留下了不少沒什麼實戰用途、但工藝繁複的裝飾品和古董。拿幾件出來，隨便去拍賣行或者找商人換，都能抵得上普通冒險者幾輩子的收入。」
      　　
      　　英雄愣住了，像是沒想到自己抱在懷裡的貓魅居然是個隱藏富翁。
      　　
      　　他的神情從錯愕逐漸轉為掙扎，又神情悲憤地看著隨他吃苦的貓魅，最後甚至有些洩氣地縮起肩膀，聲音低得幾乎聽不見。
      　　
      　　「……我居然混到要靠你去變賣家底了嗎？連一起旅行的旅費都賺不夠，還大言不慚地說要帶你走遍世界……真沒用啊。」
      　　
      　　「說什麼傻話！」古·拉哈·提亞有些著急地按住他的肩膀，急切地安撫道：「在第一世界的時候，為了支撐水晶都的建設與防衛，我也經常讓人把用不上的舊時代造物拿去變賣……這只是物盡其用，你不用覺得有負擔。」
      　　
      　　「正因為是這樣。」
      　　
      　　英雄忽然抬起頭，藍眼滿是執著。
      　　
      　　「那些東西，只剩下原初世界裡才有……我怎麼可能讓你為了幾趟傳送費，把它拆了拿去賣錢？」
      　　
      　　古·拉哈·提亞怔住了，瞳孔有些感動地輕微晃動。
      　　
      　　他抿著嘴角輕輕點頭，放棄了這個打算。只是感動歸感動，問題似乎又回到了原點。
      　　
      　　「不然我們找點普通的賺錢方法？」
      　　
      　　英雄嘆了一口長氣，看了看牆上紀錄日期的紙張，眼神總算亮了一些，「等任務執行完，你陪我去一趟舊薩雷安。」
      　　
      　　
      　　
      　　兩人就這樣風塵僕僕地下了船。
      　　
      　　宜人的微風帶著書香與海水的氣味，然而在行會理符的繳交櫃檯前，氣氛卻是一片死寂。
      　　
      　　「砰」的一聲，英雄整個人像是被抽乾了骨頭，毫無形象地整張臉貼在櫃檯上，身後背著一個幾乎比他半個人還高的巨大麻袋，裡面散發著濃郁的高山茶清香。
      　　
      　　「求你了……」英雄有氣無力地哀怨喃喃，「我這次背了整整兩百人份的量來，到底能不能讓我一次交完？哪怕扣點手續費都行……」
      　　
      　　櫃檯後方的值班官員保持著極其專業、無懈可擊的禮貌微笑，雙手交疊在身前。
      　　
      　　「非常感謝您對薩雷安學術研究與物資儲備的卓越貢獻，尊敬的英雄大人。但是，依據《物資收繳與理符標準管理法》，我們的收貨流程是嚴格的一次三杯，請您出示憑證，分批驗收。」
      　　
      　　英雄發出一聲宛如瀕死魔物般的嗚咽。
      　　
      　　站在一旁古·拉哈·提亞先是愣了愣，隨即忍不住抬手掩住嘴唇，肩膀微微顫抖，卻還是沒忍住地輕笑。
      　　
      　　「笑什麼啊……拉哈，這真的很累……」英雄半邊臉還黏在櫃檯上，側轉了過來，幽怨地看著他。
      　　
      　　「抱歉抱歉……」古·拉哈·提亞笑得耳尖都在晃動，赤紅的眼睛彎成好看的弧度。
      　　
      　　他走上前，伸手把英雄身後沉重的麻袋接了過來，小心地放在白色石磚的地面上，然後順勢在英雄身邊的空位蹲了下來，側過頭與他四目相對。
      　　
      　　「沒關係，」古·拉哈·提亞眼底帶著細碎的光，伸手輕輕碰了碰英雄微涼的鼻尖，「三杯就三杯。一百次也好，兩百次也好，我都陪你。」
      　　
      　　趴在櫃檯上的英雄眨了眨眼，原本滿滿的怨氣在對上那雙溫柔含笑的眼眸時，悄無聲息地化成了一抹無奈的笑意。
      　　
      　　「那……交完茶領了錢，去底下的咖啡廳喝一杯？」
      　　
      　　「好啊，」古·拉哈·提亞彎起眼睛，毛茸茸的尾巴在身後愉悅地晃了半圈，「我要加雙倍糖，你請客。」
      　　
      　　「再加個漢堡都沒問題。」
      　　
      　　英雄認命地從麻袋裡掏出三份高山茶，開始了他們漫長而平凡的午後。
