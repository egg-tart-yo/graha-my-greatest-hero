  - 光拉哈
  - 虐向
updated: 2026-01-01
summary: 無
series: 短篇
chapters:
  - body: |-
      　　巨劍拖過地面的刺耳聲響，在喧鬧的戰場裡依然清晰得扎心。
      　　
      　　森都與帝國的交界處正下著雪。
      　　
      　　灰白的雪片自陰沉的天空落下，還來不及沾上地面，便被炮火與魔導兵器爆炸時掀起的熱浪燒成濕冷的霧氣。遠方的帝國軍陣地已化作一片殘破的廢墟，斷裂的鋼鐵支架與翻覆的魔導裝甲沉在火光裡，黑煙連綿至天際，將原本潔白的雪都染成了灰。
      　　
      　　艾奧傑亞的英雄獨自拖著沾滿鮮血的大劍，緩慢地走過那片被戰火碾碎的土地。
      　　
      　　劍鋒在雪地上劃出長長的痕跡，血水沿著冰冷的鐵刃滴落，與地上的積雪混成暗紅色的泥濘。他身上的戰甲早已看不出原本的顏色，敵人的血、友軍的血，還有他自己身上滲出的血，一層又一層地覆在金屬與布料上，沉重得像是要將他拖進這片死寂裡。
      　　
      　　他低垂著頭，凌亂的髮絲遮住了大半張臉，只剩下一雙空洞的藍眼，映著遠處尚未熄滅的火光。
      　　
      　　他討厭戰爭。
      　　
      　　無論經歷過多少次，他都無法習慣揮舞雙手劍時，劍尖貫穿肉體的感覺，無法習慣骨骼碎裂的震動沿著劍柄傳回掌心，也無法習慣鮮血噴濺到臉上時，那股帶著鐵鏽味的溫熱。
      　　
      　　那些人倒下前，有的憤怒，有的恐懼，有的甚至還來不及理解發生了什麼。
      　　
      　　而他只能繼續揮舞手上的劍。
      　　
      　　「惡……惡魔──」
      　　
      　　不知是從哪個尚未斷氣的帝國士兵口中擠出的聲音，嘶啞、破碎，卻像是比炮火更清楚地刺進他的耳中。
      　　
      　　地平線的一端是英雄，另一端卻是惡魔。
      　　
      　　光始終認為自己只是一名普通的冒險者，只是為了守護自己所愛的地方，跟著眾人踏上了戰場，又因為自身的實力，一次又一次被安排到戰況最激烈的最前線。
      　　
      　　可那又怎麼樣。
      　　
      　　他只有一雙手，只有一個人。
      　　
      　　武器能揮動的範圍，就是他能守護的極限。劍刃觸及不到的地方，仍有人倒下；他來不及回頭的瞬間，仍有人被炮火吞沒；即使他殺死了所有擋在眼前的敵人，也無法把任何一個已經死去的人帶回來。
      　　
      　　這一次的戰場，敵人與友軍又是全滅。
      　　
      　　只有他一個人活了下來，所有他曾嘗試緊握的手，最後都被大雪帶走了僅存的溫度。
      　　
      　　他踩過被雪半掩的屍體，踩過碎裂的軍旗與扭曲的魔導殘骸，身上帶著不曉得是誰的雙親、誰的孩子，或誰等待歸來之人的鮮血，獨自往預定的集合點走去。
      　　
      　　一步，又一步。
      　　
      　　但不能停下來。
      　　
      　　要是這麼做，那些被他強行壓在胸口深處的聲音，便會一瞬間將他徹底吞沒。
      　　
      　　

      　　
      　　
      　　空洞的藍眼在看見前方的營帳時，終於稍稍恢復了點光芒。
      　　
      　　三色交錯的軍旗依然完整地高掛，在風雪中挺立飄揚著。
      　　
      　　這是當然的，畢竟在更前方的戰線，無論敵我，已經沒有任何生還者。
      　　
      　　光拖著巨劍，緩慢地走進營地外圍。四周的士兵先是因他的歸來而露出驚喜的神情，隨後又被他滿身的血跡與過於安靜的模樣震懾住，沒有人敢立刻上前。
      　　
      　　英雄的身上只剩下死亡的氣息。
      　　
      　　光聽不見那些壓低的驚呼，也看不見旁人投來的視線，只是機械般地抬起頭，在眾多人影之中搜尋著。
      　　
      　　沒多久，他終於找到了目標。
      　　
      　　在拂曉被分配到的營帳外，古·拉哈·提亞正仰頭灌著補給的清水。以往編成辮子的紅髮早已因戰鬥而凌亂散開，髮尾沾著灰，臉上也遍布煙黑的痕跡，幾道細碎的血痕斜斜擦過臉頰，在那雙紅眼下顯得格外刺目。
      　　
      　　可他還站在那裡。
      　　
      　　還會呼吸，還會動，還會在看見光的瞬間睜大眼睛。
      　　
      　　古·拉哈·提亞手中的水囊甚至來不及放穩，便急忙從營火邊站起身，快步朝他走來。
      　　
      　　也正是在那一刻，支撐光走到這裡的最後一點力氣像是突然被抽空。他身上一直緊繃到近乎麻木的力量驟然鬆懈，腳下一拐，整個人便向前倒去。
      　　
      　　「光！」
      　　
      　　好險古·拉哈·提亞及時趕到，一把扶住了他。
      　　
      　　溫熱的手掌隔著破損的戰甲撐住他的身體，指尖帶著還未散去的顫抖，卻十分真實。
      　　
      　　啊啊。
      　　
      　　攙扶著自己的手是溫熱的。
      　　
      　　這個人還好好地活著。
      　　
      　　太好了。
      　　
      　　「光……？」
      　　
      　　古·拉哈·提亞很快察覺到他的狀態不對。
      　　
      　　光的眼神太空了，即使身體已經回到營地，心卻仍被困在炮火與屍骸之間，被爆炸與哭喊聲拖進死者的國度。
      　　
      　　古·拉哈·提亞連忙撐起他的身體，讓他靠在自己身上，另一手則小心卻堅定地覆上他握著劍柄的手。
      　　
      　　「看著我，光。」
      　　
      　　他壓低聲音，語氣放得很慢，像是怕驚動一隻受傷後仍強撐著不肯倒下的獸。
      　　
      　　「是我，古·拉哈·提亞，我在這裡。」
      　　
      　　光的眼睫微微顫了一下，古·拉哈·提亞立刻接著說下去。
      　　
      　　「結束了，你已經回來了，這裡沒有敵人、沒有追兵，不會再有人攻擊你。」
      　　
      　　他一遍又一遍地重複，低沉而穩定的聲音試圖越過光為了不崩潰而築起的城牆，傳送到他耳邊。
      　　
      　　「你現在很安全，可以停下來了。」
      　　
      　　古·拉哈·提亞很熟悉這種狀態。
      　　
      　　無論是第八靈災之時，還是光之氾濫之時，他都曾見過太多為了保護家園而不得不拾起武器的人。那些原本只是普通平民、工匠、商人、學者的人，在殘酷的戰鬥後活著回來，卻有什麼東西永遠留在了戰場上。
      　　
      　　他們不知道該怎麼把自己從那片地獄裡帶回來，空洞的表現也並非感覺不到痛，而是為了不要痛得太深，啟動了內心的保護機制，選擇麻痺自己的五感。
      　　
      　　眼前的光似乎也是如此。
      　　
      　　古·拉哈·提亞仔細地觀察著他的狀態，又焦急地朝遠方張望了一會，沒多久，他就得出了絕望的結論。
      　　
      　　活著回來的人只有一個。
      　　
      　　沒有追兵，代表前線暫時已經沒有威脅。
      　　
      　　可也代表那裡已經沒有需要救助的生還者。
      　　
      　　古·拉哈·提亞的喉嚨一陣發緊，卻仍強迫自己穩住聲音。
      　　
      　　至少現在，他不能動搖，得把光從那片戰場裡帶回來。
      　　
      　　「拉哈……？」
      　　
      　　光終於發出聲音，沙啞得幾乎不像他自己。
      　　
      　　「是我。」
      　　
      　　古·拉哈·提亞立刻回應，怕慢了一瞬，他又會再度封閉自己。
      　　
      　　「我在這裡，我一直都在。」
      　　
      　　他抬手扶住光的臉側，不顧對方身上滿是血污與冰冷的雪水，將額頭輕輕貼了上去。
      　　
      　　「聽我說，你保護了我們。」
      　　
      　　古·拉哈·提亞閉上眼，聲音輕得只有他們兩人能聽見。
      　　
      　　「敵人沒有攻到這裡，營地還在、軍旗還在，我們也都還在，這是因為你守住了前線。」
      　　
      　　光的手指仍僵硬地扣著劍柄，指節因用力而發白，微微顫抖著。
      　　
      　　古·拉哈·提亞一點一點覆住他的手。
      　　
      　　「可以放下武器了。」
      　　
      　　他低聲說。
      　　
      　　「不用再揮劍了，這邊沒有需要你斬殺的敵人。」
      　　
      　　光的呼吸很輕，卻開始變得凌亂。
      　　
      　　一句句話語終於在他心底某處撬開了一道裂縫，被強行壓住的恐懼、疲憊與痛苦，從縫隙裡滲了出來，在心口割出一道道鮮血。
      　　
      　　「可是……」
      　　
      　　他低聲開口，聲音乾澀得像是被雪與煙灰磨過。
      　　
      　　「只有我……」
      　　
      　　古·拉哈·提亞咬緊下唇，他不能讓光把那句話說完。
      　　
      　　「那不是你的錯。」
      　　
      　　他幾乎是立刻打斷，語氣比方才更堅定。
      　　
      　　「聽清楚，光。活下來不是罪，你沒有背叛任何人，你已經盡了全力。」
      　　
      　　他放慢語速，試圖將每一個字都烙進光混亂的意識裡。
      　　
      　　「他們的生命不是你奪去的。」
      　　
      　　藍眼中好不容易恢復的那點光芒顫動了一下。
      　　
      　　古·拉哈·提亞看著他，胸口疼得幾乎無法呼吸，卻仍強迫自己露出一點溫柔的笑。
      　　
      　　他還想再說些什麼，身旁卻突然傳來一陣騷動。
      　　
      　　「英、英雄大人！是英雄大人回來了嗎？」
      　　
      　　古·拉哈·提亞的神情瞬間變了。
      　　
      　　他反射性側過身，將光按進自己懷裡，用自己的身體擋住投來的視線。
      　　
      　　他不允許任何人再碰觸眼前這個已經快要碎裂的人。
      　　
      　　「副隊長。」
      　　
      　　他側著背面對來人，聲音冷了下來。
      　　
      　　「有什麼事嗎？」
      　　
      　　「我……我哥哥！前線先鋒隊的隊長……」
      　　
      　　那名年輕的軍人滿臉慌亂，視線越過古·拉哈·提亞的肩膀，死死盯著光身上的血跡。
      　　
      　　「只有您一個人？他還沒跟著撤退嗎？他是不是在後面？還是受傷了？英雄大人一定看見他了吧？」
      　　
      　　他的語速越來越急，眼中的希冀卻在看見光垂下頭的模樣，一點一點崩塌。
      　　
      　　沉默，那是戰場上最殘酷的答案。
      　　
      　　「為什麼……」
      　　
      　　他茫然地喃喃，神情逐漸扭曲成絕望。
      　　
      　　「為什麼──」
      　　
      　　旁邊的士兵察覺不對，立刻伸手想攔住他，卻被他用力甩開。
      　　
      　　「有你這個英雄在，為什麼他們一個都回不來！」
      　　
      　　那句話像一柄刀，狠狠刺向光才剛被古·拉哈·提亞喚回一點的意識。
      　　
      　　他立刻感受到懷中的光明顯一僵的身體，貓瞳憤怒地放大，喉間壓出近似野獸般的低吼聲。
      　　
      　　「你竟敢……」
      　　
      　　可他的話還沒出口，一把細長的紅劍與巨大的槍刃便蠻橫地插入雙方之間，將那名失控的軍人隔了開來。
      　　
      　　「這位兄弟，有些過分了喔。」
      　　
      　　桑克瑞德皮笑肉不笑地說道。
      　　
      　　「如果前線沒守住，現在變成火海的就是這裡了。」
      　　
      　　阿莉塞握著赤紅的細劍，冷冰冰地看著對方。
      　　
      　　「你失去了家人，我很遺憾。但你沒有資格把所有死者的重量都壓到他一個人身上。」
      　　
      　　那名軍人仍紅著眼想往前衝，下一秒，一道魔法擦過他的耳邊，精準地擊在他身後的地面上。
      　　
      　　焦黑的痕跡在雪地裡冒出一縷白煙。
      　　
      　　「這是最後一次警告。」
      　　
      　　雅·修朵拉神情平靜，語氣卻冷得讓人不敢再多踏一步。
      　　
      　　「悲傷不是你傷害他人的理由。」
      　　
      　　她的視線越過人群，落到古·拉哈·提亞身上，極輕地使了個眼色。
      　　
      　　古·拉哈·提亞立刻明白她的意思。
      　　
      　　他收緊攬著光的手臂，幾乎是半扶半抱地將人帶離現場。
      　　
      　　光沒有反抗。
      　　
      　　只是走出幾步後，他的腳步忽然一頓，像是終於從混亂裡聽見了身後那些壓抑的哭聲與怒吼。
      　　
      　　他想回頭，想確認眼底的那片猩紅，是不是只是一場惡夢。
      　　
      　　古·拉哈·提亞猛地伸手，捧住他的臉，幾乎是帶著一點驚慌地阻止了他。
      　　
      　　「別看。」
      　　
      　　那聲音很輕，卻比任何命令都堅決。
      　　
      　　光怔怔地看著他。
      　　
      　　古·拉哈·提亞的紅眼近在咫尺，裡頭有怒意，也有心疼與哀求。
      　　
      　　「不要回頭看那裡。」
      　　
      　　他低聲說。
      　　
      　　「看著前方，光，我會跟你一起。」
      　　
      　　光的唇微微動了一下，卻沒有發出聲音。
      　　
      　　古·拉哈·提亞便放輕了力道，拇指小心地擦過他臉側凝結的血污，隨後再度覆上他緊握著武器的指節。
      　　
      　　「沒事的，我都在你的身邊。」
      　　
      　　話一落，沉重的巨劍終於滑落到雪地裡，發出一聲悶響。古·拉哈·提亞扶住他搖晃的身體，光也下意識地將重量交給他。兩人沒有再說話，只是在風雪之中互相攙扶著，一步一步往營帳深處走去。
      　　
      　　雪越下越大，逐漸模糊了營火的光，也將身後那些爭執、悲鳴與血跡一點一點覆蓋。
      　　
      　　遠遠望去，只剩下兩道相互依靠的背影，在蒼白的雪幕裡緩慢前行。
      　　
      　　一個撐著另一個，另一個也仍勉強扶住對方，男子緊緊盯著身旁的貓魅，而他也一直朝他露出溫暖的笑容。
      　　
      　　他們誰都沒有完全站穩，卻誰也沒有放開彼此。
      　　
      　　直到風雪將他們的身影徹底吞沒。
