  - body: |-
      　　今晚的夜色沉得很深。
      　　
      　　荒野裡沒有城鎮的燈火，只有遠處起伏的山影，以及三人面前那一小簇燃得正旺的營火，乾柴不時發出細碎的爆裂聲，火星隨著夜風飄起，又很快消失在黑暗裡。
      　　
      　　艾斯蒂尼安坐在一塊平坦的石頭上，手肘隨意搭著膝，阿爾菲諾望著火光，悠遠的眼神透露出幾分懷念。
      　　
      　　「像這樣坐在野外，好像回到我們在伊修加爾德旅行的時候。」
      　　
      　　某些難忘的回憶，在相似的夜裡總會自行浮現。
      　　
      　　寒冷的風雪、漫長的旅行、龍詩戰爭，還有坐在他們身邊的這名冒險者。
      　　
      　　光撥了撥火堆裡的木柴，讓快要暗下去的火焰重新亮起。
      　　
      　　「是有點像。」他笑了笑，「只不過那時候比現在冷多了。」
      　　
      　　阿爾菲諾也笑出聲。
      　　
      　　「至少今晚不必擔心半夜被積雪掩埋。」
      　　
      　　「也不用聽某人一路板著臉催我們趕路。」
      　　
      　　艾斯蒂尼安瞥了光一眼。
      　　
      　　「我若不催，你們現在大概還被莫古力玩得團團轉。」
      　　
      　　笑聲迴盪在火光間。
      　　
      　　片刻後，光忽然看向艾斯蒂尼安。
      　　
      　　「不過，你也確實很久沒有回來了。」
      　　
      　　他的語氣平靜，艾斯蒂尼安卻莫名從那句話裡聽出了一點責怪。
      　　
      　　「我又不是拂曉的人，沒有時常向你們報到的必要。」
      　　
      　　「話是這麼說。」光低下頭，用靴尖輕輕碰了碰腳邊的碎石，「但偶爾回來看看也不錯，至少別讓艾默里克總是找不到你。」
      　　
      　　艾斯蒂尼安不免想起自己前一次返回石之家時的情景。
      　　
      　　他剛踏進門，古·拉哈·提亞便遠遠看見了他。那雙鮮紅的眼睛瞬間亮起，像看見了什麼只存在於傳說中的人物，接著便帶著一股毫不掩飾的敬佩迎上前來。
      　　
      　　那眼神實在太過直接，讓人無從招架。
      　　
      　　古·拉哈·提亞先是提起龍詩戰爭，又提起他在蒼天龍騎士時期的事蹟，語氣比本人還要激昂，甚至連一些艾斯蒂尼安自己都忘記的細節都記得清清楚楚。
      　　
      　　他不是討厭那名青年，只是無法理解，為何有人能把崇拜表現得如此坦然。
      　　
      　　想到這裡，艾斯蒂尼安下意識抬起手，試圖透過揮動來遺忘尷尬的記憶。
      　　
      　　「還是免了，我不擅長應付那個。」
      　　
      　　「哪個？」阿爾菲諾偏了偏頭。
      　　
      　　艾斯蒂尼安沒有回答，只是看向光。
      　　
      　　「管好你家的貓。」
      　　
      　　阿爾菲諾忍著笑，輕咳了一聲，顯然不用明說都知曉他在講誰。
      　　
      　　「他對你的敬仰，的確相當直率。」
      　　
      　　「那已經不是直率的程度了。」
      　　
      　　艾斯蒂尼安蹙起了眉，低聲抱怨。
      　　
      　　光原本也在笑，可不知為何，那笑意很快便淡了下去，他望著火焰，眼睫微微垂著。跳動的火光落在他的側臉上，將神情映得忽明忽暗。
      　　
      　　艾斯蒂尼安注意到了那點變化，卻沒有出聲。
      　　
      　　「其實，」光說，「我一直覺得，英雄這種東西，很像陪伴孩子長大的故事。」
      　　
      　　阿爾菲諾看向他，光藍色的眼睛仍望著火堆。
      　　
      　　「孩子小的時候，會相信故事裡的人永遠不會失敗，只要英雄出現，所有事情就一定能得到解決。」
      　　
      　　他停頓了一下，像是在斟酌接下來的話。
      　　
      　　「但等到他們長大，就會知道，英雄終究只是故事裡的角色。」
      　　
      　　「你是在說古·拉哈？」艾斯蒂尼安問。
      　　
      　　「他看著我的時候，總像是在看某個了不起的人。」
      　　
      　　光沒有否認，他笑了一下，那笑容卻沒有多少喜悅。
      　　
      　　「可我不是。」
      　　
      　　艾斯蒂尼安皺了皺眉。
      　　
      　　光像是沒察覺，只是平靜地繼續說下去。
      　　
      　　「我只是一個普通的冒險者，剛好去了某些地方，遇見某些人，又剛好被捲進一些與世界有關的事。」
      　　
      　　「你所歷經的一切，並不是這麼普通的事情。」阿爾菲諾忍不住說。
      　　
      　　光笑著搖頭。
      　　
      　　「但人們需要一個可以傳唱的故事，需要一個能夠相信的路標才能向前邁進，所以他們把那些事整理好，替我加上英雄的名字。」
      　　
      　　他的聲音很輕，幾乎與柴火燃燒的聲音混在一起。
      　　
      　　「拉哈也是聽著那樣的故事走到今天的。」
      　　
      　　艾斯蒂尼安看著他。
      　　
      　　他曾以為，像光這樣的人早就習慣了旁人的期待。
      　　
      　　無論走到哪裡，都有人認得他；無論遭遇什麼難題，眾人總會自然而然地看向他，彷彿只要他還站著，就沒有任何事真正到得了絕境。
      　　
      　　可此刻坐在火邊的人，卻比任何人都清醒。
      　　
      　　他從未真正相信那些落在自己身上的稱呼。
      　　
      　　「我不認為自己會一直是他的英雄。」光說。
      　　
      　　阿爾菲諾的神情微微一變。
      　　
      　　「總有一天，他的世界會出現其他人，也許比我更強，比我更適合被寫進新的故事裡。」
      　　
      　　光伸出手，手掌在火焰上轉了轉。
      　　
      　　「到那時候，他就會發現，我其實沒有那麼重要。」
      　　
      　　營火爆出一聲脆響，一點火星落在地面，很快便熄滅了。
      　　
      　　阿爾菲諾沉默許久，才低聲開口。
      　　
      　　「我覺得，這樣的想法太孤單了。」
      　　
      　　「會嗎？」
      　　
      　　「是的。」阿爾菲諾認真地說：「或許英雄確實是故事裡的角色，可實際和我們一起旅行的你，早就不是普通的英雄了。」
      　　
      　　艾斯蒂尼安沒有插話。
      　　
      　　他很少參與這類談論感情的話題。與其費心揣摩，不如直接拔槍解決眼前的敵人。
      　　
      　　可此刻的他也贊同阿爾菲諾的說法。
      　　
      　　光卻像是沒有聽進去，他望著掌心，好半晌後才笑了笑。
      　　
      　　「我倒不覺得孤單。」
      　　
      　　「為什麼？」
      　　
      　　「因為拉哈早就是英雄了。」
      　　
      　　阿爾菲諾怔住，就連艾斯蒂尼安也挑了挑眉。
      　　
      　　光抬起頭，看向營火之外的遠方，語氣逐漸柔和下來。
      　　
      　　「無論是對第一世界的人們，還是對於我，他做過的事，早就足以被寫成故事了……只是他自己從來沒有意識到。」
      　　
      　　光垂下眼，嘴角浮現出一點極淡的笑意。
      　　
      　　「他總是看著別人的背影，所以才沒發現，自己也早就成了會讓人追隨的那一個。」
      　　
      　　阿爾菲諾沒有立刻回答。
      　　
      　　他注視著光，神情裡帶著某種複雜的溫柔，最後只輕輕嘆了一口氣。
      　　
      　　「這些話，如果你親口對他說，我想他會很高興的。」
      　　
      　　光沒有回答，只是拿起一旁的木柴，重新丟進火裡，火焰猛地竄高，短暫照亮了他的臉。
      　　
      　　艾斯蒂尼安看見他眼底那一閃而過的遲疑。
      　　
      　　或許光並不是不在意古·拉哈·提亞如何看待自己，而是恰恰相反，才總想著有朝一日應該從對方的故事裡退場。
      　　
      　　英雄可以被取代，傳說可以被新的冒險覆蓋。
      　　
      　　只要一開始便將自己放在那樣的位置上，那麼真正分別的時候，或許就不會顯得太過殘忍。
      　　
      　　實在過於糾結了。
      　　
      　　艾斯蒂尼安在心裡評價道，滿臉寫著不贊同。
      　　
      　　因為他所歷經的一切都能證明，真正放不下的東西，從來不會因為刻意遠離而消失。
      　　
      　　三人趕在夜深之前熄了營火，踏上返回石之家的路，等他們抵達時，門前仍亮著燈。
      　　
      　　塔塔露抱著手臂站在門邊，腳一下下地點著地面。古·拉哈·提亞則站在她身旁，一聽見腳步聲便立刻抬起頭來。
      　　
      　　「你們回來了！」
      　　
      　　他的目光先掃過阿爾菲諾與艾斯蒂尼安，確認兩人平安無事後，便自然而然地落在光身上。
      　　
      　　亮得過分。
      　　
      　　艾斯蒂尼安在心中嘖了一聲。
      　　
      　　「都這麼晚了，至少也該傳個消息回來呀！」塔塔露走上前，語氣雖是責備，眼裡更多的卻是放心，「古·拉哈從剛才開始就在門口來回走，害得我也沒辦法安心休息。」
      　　
      　　「塔塔露！」
      　　
      　　古·拉哈·提亞慌忙出聲阻止，耳尖一下便紅了。
      　　
      　　光轉頭看向他，什麼也沒說，只是走到古·拉哈·提亞面前，抬起手，輕輕摸了摸他的頭。
      　　
      　　「在路上休息耽誤了點時間，讓你擔心了。」
      　　
      　　光收回手，語氣平靜。
      　　
      　　「早點休息。」
      　　
      　　說完，他便越過幾人，逕自朝屋內走去。
      　　
      　　阿爾菲諾看看光離去的背影，又看了看仍站在原地的古·拉哈·提亞，像是想起了營火旁的談話，神情頓時有些微妙。
      　　
      　　塔塔露也眨了眨眼。
      　　
      　　只有艾斯蒂尼安站在一旁，將一切看得清楚。
      　　
      　　古·拉哈·提亞慢慢抬起手，覆上剛才被光摸過的地方。
      　　
      　　他的指尖先是輕輕碰了碰自己的髮絲，隨後一點一點收緊掌心，彷彿握著什麼並不存在的東西。
      　　
      　　緊接著，他低下紅透的頭。
      　　
      　　艾斯蒂尼安沉默地看了他一會兒，接著又看向早已消失在走廊盡頭的光，蹙起了眉頭。
      　　
      　　他並不擅長梳理那些彎彎繞繞的東西，但至少眼前的這名貓魅賢人看向自己的眼神，明顯與望著光的眼神不同。
      　　
      　　這哪裡只是單純的憧憬。
      　　
      　　他的夥伴，恐怕根本沒弄明白，自己究竟被怎樣放在了心上。
