  - title: 上篇
    body: |-
      　　古·拉哈·提亞是在包包的最底層翻出那份古舊卷軸的。
      　　
      　　它被壓在備用繃帶與半包肉乾之間，泛黃的邊角看似有些斑駁，封口捆著的細繩卻依然穩固。貓魅好奇地將它從光的包包裡取了出來，朝英雄的眼前遞了過去。
      　　
      　　「英雄，這是什麼？」
      　　
      　　光接過來看了一眼，困惑地掃了搔頭。
      　　
      　　「完全沒印象……我有買過這種東西嗎？」
      　　
      　　「會不會是上次任務的報酬？還是幫忙委託人保管的？」古·拉哈·提亞湊過來，指尖也順勢搭上紙張邊緣，「上面的術式紋樣很特別，不曉得記錄著什麼魔法……」
      　　
      　　就在兩人的手指同時觸及泛黃紙面的那一瞬間，一道幾不可察的淡金色光暈自指尖交疊處散開，如水波般一閃即逝。
      　　
      　　正埋頭研究的兩人都沒注意到這點異樣。
      　　
      　　「算了，等任務回來再慢慢解讀吧。」光把卷軸隨手擱回桌角，拍了拍手將眾人的注意力拉回，「先來敲定這次討伐的分組名單。」
      　　
      　　圍在石桌旁的拂曉同伴們紛紛靠了過來，一邊甩動著武器、躍躍欲試。光攤開山域地圖，神色認真地指向東側山谷的入口。
      　　
      　　「前半段路徑狹窄，不過都是些實力不強的鳥妖，我們可以分散兩組，我負責在前鋒開路──」
      　　
      　　『我想去我想去我想去我想去我想去……』
      　　
      　　光的指尖突兀地停在了地圖上。
      　　
      　　那聲音雀躍又急切，聽起來像是古·拉哈·提亞的嗓音。光疑惑地抬起頭，卻見眼前的紅髮貓魅正端端正正地站在對面，神情嚴肅地盯著地圖。
      　　
      　　他察覺到光的視線時，還疑惑地微微歪了下頭，頭頂的耳朵輕輕抖動。
      　　
      　　光眨了眨眼，心想自己鐵定是累了，居然產生了幻聽。
      　　
      　　他清了清喉嚨，繼續將注意力放回地圖。
      　　
      　　「……接著是路線的選擇，穿過吊橋後──」
      　　
      　　『帶我去帶我去帶我去帶我去帶我去……』
      　　
      　　光瞪大眼睛、猛然抬起頭。
      　　
      　　這回的聲音更為急迫，但眼前的古·拉哈·提亞依然抿著唇，一副正襟危坐、專心聽講的好學生模樣。
      　　
      　　光深吸了一口氣，強壓下滿頭霧水，硬著頭皮繼續說道：「到了分叉口，我們就必須分頭行動。一隊先去確認殘留乙太水晶的反應，一隊則是要往另一側探路……」
      　　
      　　『拜託拜託，想和英雄同一組！什麼位置都可以，想一起去──』
      　　
      　　「會啦！」光終於忍無可忍，啪地一掌拍在地圖上，轉頭對著古·拉哈·提亞脫口而出：「這次一定會帶你一起去，別這麼擔心！」
      　　
      　　原本熱絡的大廳瞬間陷入一片寂靜。
      　　
      　　古·拉哈·提亞僵在原地，茫然地微張著嘴，一旁的阿莉塞微微傾身，狐疑地在兩人之間來回掃視。
      　　
      　　「好好的講路線怎麼突然大吼，拉哈什麼都沒說吧？」
      　　
      　　「嚇我一跳。」阿爾菲諾也滿臉困惑，「這是怎麼了？」
      　　
      　　「你們什麼都沒聽見？」
      　　
      　　光愣住了。
      　　
      　　「但我明明一直聽見拉哈的聲音，就在耳邊，一直喊著想去……」
      　　
      　　話音未落，古·拉哈·提亞的耳朵瞬間豎得筆直。
      　　
      　　他像是猛然意識到了什麼，紅眼睛瞬間瞪得圓滾，臉頰以肉眼可見的速度轟地一下漲紅，一路燒到了耳尖。
      　　
      　　『等、等等……這不可能吧？！英雄該不會──聽得見我心裡在想什麼？！』
      　　
      　　驚恐的聲音再次無比清晰地傳到光的腦海裡。
      　　
      　　光也震驚地瞪大眼睛，眼神茫然地望向貓魅，「……好像真的聽得見。我剛才聽到的全是你心裡的話？！」
      　　
      　　「啊？怎麼會有這種事？」阿莉塞一頭霧水。
      　　
      　　然而這句話對古·拉哈·提亞來說無異於晴天霹靂，他的貓尾碰地炸了起來，腳步慌亂地連連後退。
      　　
      　　『騙人的吧？！為什麼！是剛才那個卷軸的魔法嗎？不不不不行，如果聽得見心聲，那秘密豈不是──』
      　　
      　　光原本還跟著一頭霧水，可一捕捉到這句話，好奇心瞬間被勾了起來。他的眼神立刻變得意味深長，甚至忍不住往前逼近了一步。
      　　
      　　「……什麼秘密？」
      　　
      　　「沒！什、什麼秘密都沒有！」古·拉哈·提亞雙手緊緊握著法杖，眼神游移，連說話都結結巴巴，整張臉紅得快要冒煙，「你聽錯了！我剛才什麼都沒想！」
      　　
      　　『慘了慘了慘了！冷靜點啊古·拉哈·提亞！不要想！不可以被英雄發現……不不不不是英雄，不要聽！什麼都沒有！啊啊啊為什麼腦子裡全都是──』
      　　
      　　那一連串慌亂的心聲就這麼盡數傳了過來，光忍笑忍得肩膀都在發抖，好整以暇地歪頭看著他。
      　　
      　　「──全都是我？到底是什麼秘密？」
      　　
      　　「別聽啊啊啊啊！」
      　　
      　　古·拉哈·提亞像是被逼到了絕境的小動物，羞恥心徹底擊穿了理智的防線。在光邁出腳步的瞬間，他猛地將手中的法杖重重往地上一敲──伴隨著一串極度倉促的詠唱，一圈柔和澄澈的魔法光環自他腳下散了開來。
      　　
      　　光甚至還來不及伸手阻止，就看見古·拉哈·提亞如同斷電一般閉上雙眼，筆直地往前倒去。
      　　
      　　「喂！」
      　　
      　　他急忙快步向前，穩穩將失去意識的貓魅接了個滿懷。
      　　
      　　大廳鴉雀無聲，雅·修朵拉緩緩靠了過來，垂眼看著安安穩穩倒在光胸口、雙眼緊閉的古·拉哈·提亞，平靜的語氣帶了點讚嘆。
      　　
      　　「是睡眠術。看來他真的不想讓你知道他的秘密。」
      　　
      　　「所以，有人能解釋一下到底發生什麼事嗎？」
      　　
      　　桑克瑞德卸下環抱著的手，朝光聳了聳肩。
      　　
      　　光低頭看著懷裡那張雖然陷入沉睡、但臉頰依然泛紅的青年，又無奈地瞥了眼桌角那份惹禍的卷軸，輕嘆了口氣。
  - title: 下篇
    body: |-
      　　黃昏的霞光從窗外鑽了進來，將室內染上一層暖橘。
      　　
      　　古·拉哈·提亞迷迷糊糊地睜開眼，只覺得腦袋昏昏沉沉。等視線重新聚焦，他才發現自己正躺在熟悉的床鋪上，而光就沿著床邊而坐，手裡正百般無聊地轉著短刀。
      　　
      　　看見他醒來，光直起腰，利落地轉了圈武器、將刀刃收入側腰的暗袋。
      　　
      　　「醒了？」
      　　
      　　古·拉哈·提亞猛然想起昏睡前發生的事情。
      　　
      　　他慌張地環顧四周，發現房內僅有他們兩人，房外似乎沒了白日裡的喧鬧聲，窗外的天色也已經暗了下來。
      　　
      　　「……討伐任務呢？」
      　　
      　　貓魅撐著床鋪坐起身，有些遲疑地問。
      　　
      　　「延期了。」光語氣輕鬆地聳聳肩，「畢竟我們的重要戰力突然把自己給放倒了。說好帶你去的，就不能丟下你直接出發。」
      　　
      　　一聽因為自己而耽誤了委託，古·拉哈·提亞的耳朵瞬間扁了下去，連尾巴都垂在床沿動也不動，滿臉都是自責與過意不去。
      　　
      　　光看著他這副喪氣的模樣，忍不住低笑了一聲。他搔了搔頭，傾身湊近了一些，眼底終究還是壓不住那股濃濃的好奇。
      　　
      　　「所以……到底是什麼天大的秘密，讓你寧可對自己下沉睡術、甚至連冒險都不去了，也不肯讓我知道？」
      　　
      　　古·拉哈·提亞渾身一僵，下意識抓緊了被單，眼神驚惶地左右漂移，又小心翼翼地偷看著光。
      　　
      　　光被他的反應逗笑了，拿起一直放在床頭櫃上的古舊卷軸，在他眼前晃了晃。
      　　
      　　「別緊張，雅·修朵拉檢查過了，那只是個短效的法術，效力早在幾個小時前就徹底消散了。」光把卷軸放回原處，目光放柔了些，「現在你心裡在想什麼，我一點都聽不見。要是你真的不想說，我也不勉強你。」
      　　
      　　房間裡陷入了一陣漫長的沉默。
      　　
      　　夕陽慢慢沉下地平線，餘暉拉長了兩人的影子。古·拉哈·提亞垂著頭，手指緊緊扣著被角，喉結上下動了動，像是正在下定極大的決心。
      　　
      　　「秘密……秘密是……」
      　　
      　　「嗯？」
      　　
      　　光的神情並不催促，甚至有些平靜。看著這樣的英雄，古·拉哈·提亞內心始終緊緊把持著的界線開始有些鬆動，也或許是不想讓光認為自己對他有所隱瞞，幾經掙扎後，終於小心翼翼、微弱地脫口而出：「……是我從很久很久以前……就一直很喜歡英雄……」
      　　
      　　光愣了愣，隨即彎起眼睛。
      　　
      　　「什麼啊，原來是這個。」他輕快地回應：「我也很喜歡你啊，能跟拉哈一起冒險，我一直都覺得很安心。」
      　　
      　　聽到這句回答，古·拉哈·提亞遲疑地抬起頭。
      　　
      　　他看得出來，光根本沒有聽懂──英雄嘴裡的「喜歡」，不過是同伴之間的信賴與並肩作戰的情誼。
      　　
      　　他知道英雄總是這樣遲鈍，可胸口那股壓抑了太久的情緒已經撕開了一點破口，再也收不住了。
      　　
      　　他心一橫，突然伸出手，一把將床頭的卷軸抓了過來。
      　　
      　　「等等，拉哈？！」
      　　
      　　古·拉哈·提亞不給光阻止的機會，毫不猶豫地將手再次放上卷軸的術式，紙張瞬間泛起一陣金色光芒。他緊緊抓著卷軸，耳朵半垂著，那雙倒映著夕陽的紅眼有些濕潤，就這麼直勾勾、毫無保留地盯著眼前的光。
      　　
      　　下一刻，埋藏在心底的心聲直接湧入光的腦海，只是這一次，心裡呼喚的不再是遙遠的「英雄」，而是專屬於眼前這個人的名字──
      　　
      　　『不是那種喜歡！……我想永遠跟光在一起。』
      　　
      　　『想陪光去所有你想去的地方，看遍這個世界所有的風景。不管是艱難的險境還是痛苦的長夜，我都想站在光的身邊，和你一起分擔……』
      　　
      　　『想靠你更近一點，近到一轉頭就能看見你的眼睛，想牽你的手，想擁抱你……想成為光心裡最特別、最重要、無可替代的那個人……』
      　　
      　　滾燙的心意一句接著一句，毫不間斷地在腦海裡響起。古·拉哈·提亞的臉頰漲得通紅，但他沒有移開視線，那雙眼睛就這樣堅定又坦然地望著光。
      　　
      　　光整個人都懵了。
      　　
      　　排山倒海的情感就這麼直衝而來，光只覺得臉頰燙得快要燃燒起來。他徹底慌了手腳，手臂無措地在半空中胡亂比劃，完全不知道該往哪裡擺，整個人恨不得找個地洞鑽進去。
      　　
      　　見光這副難得慌亂失措的模樣，坦露心聲的古·拉哈·提亞雖然同樣快被羞恥淹沒，但既然已經毫無退路，他索性一咬牙，高舉著尾巴、撐著床鋪慢慢傾身向前。
      　　
      　　他伸出一隻微微發顫的手，輕輕按在了光的胸口上。
      　　
      　　「……心跳好快。」古·拉哈·提亞仰著臉，聲音輕輕顫抖，眼底卻帶著孤注一擲的執著，「我全都說完了……現在，換我也聽聽看這裡的心聲好不好？」
      　　
      　　「等、等一下，你想做什麼──」
      　　
      　　說完，他不容分說地將那份發光的卷軸一把塞進了光的手心，兩人的手指再次緊緊相貼。
      　　
      　　金色的光芒瞬間將兩人籠罩。
      　　
      　　古·拉哈·提亞下意識屏住了呼吸，耳邊很快響起了光凌亂又震驚的聲音。
      　　
      　　『……拉哈居然是這樣看我的？我以為……我一直以為在他心裡，我只是人們口中的英雄……如果有更厲害的人，隨時都可以取代我……』
      　　
      　　聽見這句話，古·拉哈·提亞的心一沉，頭頂的耳朵慢慢垂了下去，然而，那混亂的聲音與凌亂的思緒，卻開始漸漸沉靜了下來。
      　　
      　　『……是嗎。』
      　　
      　　『原來拉哈……是喜歡著我的啊。』
      　　
      　　熟悉的聲音漸漸放慢，帶著一絲不可置信，還有微微顫動、小心翼翼地脆弱。
      　　
      　　『那……是不是代表，以後我不再是一個人了？』
      　　
      　　古·拉哈·提亞猛然抬起頭。
      　　
      　　他怔怔地望著那雙艱難睜著的藍眼，眼底藏著很深、從不輕易示人的孤獨，被欣喜與懷疑漸漸推了出來。
      　　
      　　那一瞬間，所有的退縮、猶豫與膽怯全被疼痛沖得乾乾淨淨，古·拉哈·提亞連發熱的眼底都顧不上，直接對著光大喊出聲：「我都在！」
      　　
      　　貓魅的聲音迴盪在狹小的臥室裡，堅定得沒有半點遲疑。
      　　
      　　「不管是去哪裡、面對什麼敵人，我都在！不會再讓你一個人了！」
      　　
      　　光被這聲突如其來的直白吶喊給震住了。
      　　
      　　他呆呆地看著眼前眼角泛紅、卻無比認真的古·拉哈·提亞，已然無暇顧及自己剛才到底洩漏了什麼心聲，但對方那雙過於堅定的眼眸所給予的安心感，彷彿真能讓他把一切都交付出去。
      　　
      　　光很慢很慢地伸出手指，輕輕牽住古·拉哈·提亞的衣角，用力地點點頭。
      　　
      　　古·拉哈·提亞看著光這副難得一見、乖順又害羞的模樣，整個人也呆了半秒。
      　　
      　　隨後，巨大的喜悅如火山爆發般湧發。
      　　
      　　光還沒來得及說些什麼，腦袋裡就冷不防湧入排山倒海的心聲──
      　　
      　　『好喜歡好喜歡好喜歡好喜歡好喜歡！』
      　　
      　　過於強烈的聲音讓他下意識閉上眼睛，但心聲卻依然沒有停止，反而越來越響亮。
      　　
      　　『好喜歡光！真的好喜歡光！最喜歡光了！喜歡光喜歡光喜歡光喜歡光──』
      　　
      　　那聲音甚至比白天喊著要去冒險時還要急切千百倍，簡直就像有一百隻開心的貓魅族在光的大腦裡歡呼鼓舞，震得光耳膜嗡嗡作響。
      　　
      　　『喜歡到沒辦法停下來！光光光光光光光光光──』
      　　
      　　「等等、拉哈！心聲太吵了──唔？！」
      　　
      　　光的抗議還沒喊完，古·拉哈·提亞就已經開心地整個人直撲了上來。
      　　
      　　貓魅的雙臂緊緊環住光的脖頸，力道大得差點把毫無防備的英雄直接撞翻在床上。古·拉哈·提亞把通紅的臉頰埋進光的頸窩裡用力蹭著，身後的尾巴啪啪啪地高速甩動，連床單都被拍得直響。
      　　
      　　雖然腦袋裡依然充斥著無限循環的「好喜歡好喜歡好喜歡」，吵得人頭腦發疼，但感受著懷裡這團毛茸茸又炙熱的重量，光無奈地嘆了口氣，嘴角卻怎麼也壓不下去，伸手把身上這隻完全失控的貓抱了個滿懷。
