      　　桑克瑞德回到委員會時，光正安靜地替古·拉哈·提亞整理散落在桌邊的幾冊書。紅髮貓魅則低著頭，像是努力閱讀眼前的書頁，然而背後迅速甩動、毛躁得幾乎炸開的尾巴，卻徹底暴露了主人並不平靜的心情。
      　　
      　　桑克瑞德挑了挑眉，視線先掃過桌上的資料，又注視著古·拉哈·提亞泛紅的側臉，最後落在光衣襟間微微露出的銀鏈上。

      　　他停了片刻，隨後好奇地伸手指了指光的胸口。
      　　
      　　「那是什麼？」

      　　古·拉哈·提亞整個人一僵，頭垂得更低，像是恨不得把自己的存在感也一併收進書頁裡。

      　　光倒是很平靜，他低頭用手勾住銀鏈，將它從衣襟裡拉了出來，銀鏈上方串著的環形飾品在燈下輕輕一晃，透出水晶般晶亮的光彩。

      　　迅速辨認出那是什麼的桑克瑞德吹了聲口哨。

      　　「戒指？」

      　　古·拉哈·提亞慌亂地伸出手，嘗試想阻止什麼，可惜已經太晚了。
      　　
      　　
      　　
      　　事情要從前幾天說起。
      　　
      　　受古·拉哈·提亞所託，回到第一世界取東西的英雄熟門熟路地穿越水晶塔的通道。他手中握著的吸魂晶前端閃耀著結晶化的血，讓他能在塔內暢行無阻，順利抵達目的地。
      　　
      　　踏入水晶公的書房後，光低頭讀著古·拉哈·提亞手寫紙條上提示的位置，一邊在書架上搜尋。水晶公對書籍分門別類的習慣，與現在的他幾乎完全相同，光很快便找齊了紙上所列的清單。
      　　
      　　他正準備離開時，暫放在桌上的吸魂晶忽然發出紅光。隨後，伴著一聲輕柔的「喀」響，光發現身後的書架深處竟滾落出一個小盒子。
      　　
      　　倒不是想刺探那人的隱私，但需要用亞拉戈皇血保護起來的物品，想必十分重要。光猶豫了半晌，終究還是走了過去，拾起那掉落在地的盒子。
      　　
      　　盒子是深色木製的，邊角已被打磨得圓潤，表面沒有過多裝飾。光將盒蓋打開時，驚訝地發現裡面竟然放著一枚戒指。

      　　那戒指做工並不繁複，戒圈線條樸實，沒有張揚的雕飾，只有中央鑲著一顆紅色寶石，周圍妝點著艷麗的藍色水晶。那光彩讓他想起夜裡在海港看見的星辰，也想起月光照耀下，貓魅賢人那雙清澈的眼睛。
      　　
      　　比起水晶塔主人的手，戒圍明顯大了一些。光細細檢查，才發現戒指內側刻著一行極細的字。
      　　
      　　──願我的光永不熄滅。
      　　
      　　光怔怔地看著那行字許久，隨後低頭一笑，輕聲說道：「……不是被你好好保護下來了嗎。」
      　　
      　　塔裡十分寧靜，回答他的，只有微微閃爍的水晶光彩。
      　　
      　　光在身上找了找，隨後從腰間抽出一條銀鏈。他席地取出工具稍作調整，很快便將銀鏈改成能掛在脖子上的長度，接著，他將戒指串上銀鏈，小心地把那枚溫潤的金屬製品收進離心口最近的地方。
      　　
      　　
      　　
      　　幾日後，光帶著書去巴爾德西昂委員會找古·拉哈·提亞時，對方正埋首於桌前的資料堆裡。紅髮青年一聽見腳步聲便抬起頭，見到光時，耳朵立刻精神地豎了起來。

      　　「你回來了！」

      　　他眼中的笑意幾乎藏不住，下一秒又像是意識到自己太過急切，有些害羞地輕咳一聲，硬生生把語氣壓得端正。

      　　「我是說，辛苦了。第一世界那邊還順利嗎？」

      　　光輕輕點頭，一邊把書袋放到桌上。

      　　「一切平安。你要的資料大概都找到了。」

      　　古·拉哈·提亞眼睛一亮，連忙起身翻看。

      　　「唔，太好了。這些文獻當時蒐集得很辛苦，沒能帶來，我一直覺得很可惜……」

      　　他的尾巴在身後輕快地搖晃著。光在伸手撫摸與不打斷他思考之間掙扎了片刻，最後還是放棄了內心的打算。

      　　沉浸在思緒裡的古·拉哈·提亞，忽然察覺到光的視線。他耳尖微微一動，抬頭問道：「怎麼了？我臉上有什麼嗎？」

      　　「沒有。」

      　　「那你為什麼一直看著我？」

      　　「只是覺得你很高興。」

      　　古·拉哈·提亞眨眨眼，神采奕奕地說道：「珍貴資料能保存下來，自然值得高興。這是學術上的喜悅，也我個人對亞拉戈特別……」

      　　他的話突然停住了。

      　　那雙明亮的紅色眼睛，定定地凝視著光的胸前。

      　　那枚戒指被銀鏈串著，安靜地貼在衣襟上。藍色水晶在室內燈光下折出細碎的光，像極了第一世界那座美麗的塔。

      　　他的瞳孔猛地縮了一下，長尾也在同一瞬間炸開，膨成毛茸茸的一大叢。

      　　「你、你那個──！」

      　　光低頭看了一眼，這才想起自己忘了把它收起來。

      　　「這個？」

      　　貓魅賢人張了張嘴，臉色從驚愕轉為茫然，又從茫然轉為通紅，最後停在一種快要冒煙的狀態。

      　　「你在哪裡找到的？」

      　　「水晶塔書庫的暗格裡。」

      　　「暗格……」他喃喃重複，整個人像被雷劈中一樣僵在原地，「等等，書庫深處那個暗格？你為什麼會打開那個地方？不對，那個地方不應該這麼容易被打開，機關明明……」

      　　他說到一半，像是忽然想到了什麼，隨即沉默下來。

      　　羞赧迅速爬滿他的臉，讓他看起來恨不得當場把自己埋進桌上的書堆裡。

      　　光看著他，語氣倒是很平靜。

      　　「吸魂晶亮了一下，然後它就自己滾了出來。」

      　　古·拉哈·提亞慢慢抬起手，摀住自己的臉。

      　　「……我就知道。」

      　　「知道什麼？」

      　　「知道那個時候的我，偶爾會做出一些……不太冷靜的事情。」

      　　「偶爾？」

      　　古·拉哈·提亞從指縫裡看著光疑惑的目光。

      　　兩人對視片刻，最後還是古·拉哈·提亞敗下陣來，耳朵又垂下去了一點。

      　　「好吧，也許不只偶爾。」

      　　光忍不住笑了。

      　　古·拉哈·提亞卻像被那笑聲燙到，立刻放下手，臉上的紅幾乎要逼近他清澈的瞳色，仍不放棄地再次問道。

      　　「你、你也看過裡面的字了？」

      　　「看過了。」

      　　「……」

      　　這下完了。貓魅的耳朵徹底垂了下去。

      　　光覺得他的反應十分有趣，伸手碰了碰胸前的戒指。

      　　「我很喜歡。」

      　　古·拉哈·提亞猛地抬頭，貓眼瞪得極大。

      　　「可是那是……那是以前的我留下的東西。嚴格說來，它不該……」

      　　「為什麼不該？」
      　　
      　　面對光的詢問，古·拉哈·提亞一時間不曉得該從何回答。
      　　
      　　承接那人的記憶時，橫跨百年的決心與堅毅確實好好地傳了過來。可隨之而來的，也有那些孤身一人的寂寞、害怕計畫無法達成的憂慮，以及絕不能辜負那些傾盡全力將他送往過去的夥伴的決絕。
      　　
      　　即使到了現在，古·拉哈·提亞依然覺得，來自未來的自己，為了拯救英雄所下的決心，沉重得令人窒息。
      　　
      　　而他也很清楚，按照那個計畫，水晶公原本根本不可能擁有與英雄並肩走下去的未來。
      　　
      　　混亂的思緒間，光溫暖的手輕輕覆上他的頭。
      　　
      　　「我也想問，明明準備了這個東西，怎麼不親手交給我？」
      　　
      　　古·拉哈·提亞的臉本來就紅著，這下連眼眶都泛起一點濕意。他很快地低下頭，匆忙整理湧上的情緒，良久才小聲說道：「他大概……不敢吧。」

      　　他抬手，指尖很輕地碰了碰那枚戒指。藍色水晶映在他的紅眸裡，與戒指上紅寶石的倒影相互重疊。

      　　「他從未奢望過自己能活下來。」古·拉哈·提亞低聲說，「按照他的計畫，很多事情……都會永遠被埋葬起來。」
      　　
      　　無論是那份渴望、那份感情，還是這枚戒指，都一樣。
      　　
      　　光閉了閉眼，輕輕揉著那頭蓬鬆的紅髮，隨後沉聲宣告。
      　　
      　　「但既然是給我的，那要怎麼使用，就由我來決定。」
      　　
      　　古·拉哈·提亞的眼神蒙上一層水霧。他連忙伸手抹去，隨後小心翼翼地瞄向光胸前的戒指，臉上的熱度依然沒有退去。

      　　「……你要一直戴著它嗎？」

      　　「嗯。」

      　　「在外面也戴？大家都會看見。」

      　　「沒什麼不好。」

      　　古·拉哈·提亞吸了一口氣，尾巴再次澎起。

      　　「光！」

      　　「怎麼了？」

      　　「你至少該、該稍微有一點自覺吧！」

      　　面對他的指控，光只是偏了偏頭。

      　　古·拉哈·提亞看著他那副無辜模樣，崩潰地發出幾聲嗚咽，最後只能摀住臉，聲音從指縫裡悶悶地傳出來。

      　　「真是……太狡猾了。」

      　　對此，光倒是沒有反駁。他只是認真地伸手，將那枚戒指仔細地收入衣襟內側，讓它更貼近胸口。

      　　而貓魅從指縫裡看見這個動作，整個人又冒出了熱氣。

      　　「……你不要在我面前做這種事。」

      　　「為什麼？你不高興嗎？」

      　　「高興！」

      　　古·拉哈·提亞幾乎是立刻回答，可話一脫口，他自己也愣住了。

      　　光忍不住笑出聲。

      　　古·拉哈·提亞的臉紅到快要燒起來，最後自暴自棄般低下頭，尾巴在身後不安分地甩了一下。

      　　「……很高興。」

      　　他小聲說。

      　　「只是太高興了，所以不知道該怎麼辦。」
      　　
      　　光走上前，將整隻紅透的貓魅擁入懷裡，好不容易才將他安撫得稍微平靜一些。而後，他們便迎來了桑克瑞德的歸來。
      　　
      　　
      　　
      　　聽完整段原委的人族青年笑得瀟灑，決定偷偷推某位快要蒸熟的貓魅一把。
      　　
      　　他托著腮，語氣十分自然地說：「但戒指這種東西，不是應該戴在手上的嗎？」

      　　輕描淡寫的一句話，又成功讓古·拉哈·提亞好不容易稍稍放鬆的耳朵，以肉眼可見的速度再度豎起，然後僵住。

      　　光低頭看了看胸前的戒指，又抬眼看向桑克瑞德，神情仍是那副平靜得近乎無辜的模樣。

      　　「那要看有沒有人願意幫我戴上。」

      　　「啪」地一聲，書掉落在地上。

      　　桑克瑞德很努力忍住笑，表面上仍一本正經地回應。

      　　「原來如此。」

      　　「嗯。」

      　　光也應得很自然，自然到古·拉哈·提亞終於受不了了。

      　　「請、請不要把話說得好像……好像……！」

      　　他說到一半，又不知道該怎麼接。整張臉紅得像下一秒就能拿來燒開水。最後，他只能再次抬手掩住臉，耳朵完全壓了下去，聲音從掌心後方崩潰地傳出來。

      　　「你們兩個……請至少稍微顧慮一下我的心情……！」

      　　桑克瑞德終於笑出聲。

      　　「我倒覺得，他已經很顧慮你了。」

      　　古·拉哈·提亞從指縫裡瞪他，紅眸濕亮，毫無威嚇力。

      　　光則低頭摸了摸那枚戒指，用手指一下下點著，神情若有所思。

      　　「所以，」他看向古·拉哈·提亞，「你願意嗎？」

      　　貓魅的呼吸停住了。

      　　桑克瑞德本來還想再加把勁，但看見光肯定的眼神，與古·拉哈·提亞怔在原地的模樣，便露出了放心的微笑。
      　　
      　　他站起身，迅速把門帶上，離開前只留下了一句話。

      　　「我什麼都沒看見，你們慢慢來。」

      　　門闔上的聲音很輕，房間裡重新安靜下來。

      　　古·拉哈·提亞仍摀著臉，半晌沒有說話。光也沒有催促，只是坐在原處，耐心等著。

      　　過了很久，他才慢慢放下手。

      　　他的臉還是紅的，耳尖軟軟地垂著，連聲音都像被熱氣燙軟了一點。

      　　「你是……認真的嗎？我是說，你真的願意──」

      　　光認真地看著他，沒有半分猶豫，便溫聲回應。

      　　「我一直都願意。」
      　　
      　　那個肯定的答案過於溫柔。紅眸裡仍帶著幾分不確定，可那些羞窘與慌亂，終於慢慢沉澱下去，留下更深、更柔軟的東西。
      　　
      　　光垂下眼，索性用行動表示。
      　　
      　　他乾脆地解下銀鏈，把戒指、選擇，與那份深埋百年的心意，全數放進古·拉哈·提亞的掌心。
      　　
      　　然後，他朝他遞出了手。比水晶更加耀眼的藍眼平靜地凝視著他。
      　　
      　　而那歷經久遠時光淬煉，依然不變的真心，便透過這枚平凡樸實的戒指，由顫抖著的手指，推入了英雄的後半生。
      　　

      　　至於事後，光決定自己也要親手打造一枚鑲著藍色寶石的戒指，並拉著古·拉哈·提亞一起出發冒險的故事，那又是後話了。
