  - title: 主篇
    body: |-
      　　今天的英雄又是好好地出門，然後一身傷回來。
      　　
      　　阿爾菲諾的治療術細緻得很，原本還滲著血的傷口如今只剩下淡淡的新生痕跡，連疼痛都消去了大半。可真正麻煩的，反倒是那些沒辦法單靠治療術解決的東西。
      　　
      　　比如，喝藥一類的事情。
      　　
      　　「我覺得沒必要。」
      　　
      　　光坐在床沿，語氣十分篤定。
      　　
      　　古·拉哈·提亞半跪在他身前，一邊膝蓋幾乎壓上他的腿，另一隻手扣著光的手掌，試圖用身體把人固定在原地。他捏著一只透明藥瓶，瓶中的液體紫綠交雜，黏稠得近乎不像能入口的東西，稍稍一晃，便像沼澤裡的泥水似的緩慢流動。
      　　
      　　光盯著那瓶東西，臉色比方才受傷時還難看。
      　　
      　　「阿爾菲諾可以幫我治。」
      　　
      　　「已經治過了。」古·拉哈·提亞耐著性子說。
      　　
      　　「那尤里安傑。」
      　　
      　　一旁的尤里安傑平靜地開口：「此藥正是針對治癒術無法消除的後遺症所配。」
      　　
      　　光沉默了一瞬。
      　　
      　　「……那想想別的辦法，只要不喝藥，什麼都可以。」
      　　
      　　古·拉哈·提亞耳朵抖了一下，「這就是最好的辦法。」
      　　
      　　「我是說用治療術。」
      　　
      　　「不行。」
      　　
      　　「為什麼不行？」
      　　
      　　「因為你現在需要的是喝藥！」
      　　
      　　說話間，古·拉哈·提亞已經伸手去壓他的肩膀，想趁人不備把瓶口往他嘴邊送。
      　　
      　　然而成年貓魅的力氣雖然不小，單憑一隻手要壓住光，顯然還是太勉強了些。光只是肩膀一扭，便硬生生把他的手推開，兩人頓時僵持在床邊，一個拼命想灌，一個死活不肯喝。
      　　
      　　桑克瑞德靠在不遠處，看了片刻，終於十分好心地問：「需要幫忙嗎？」
      　　
      　　光立刻轉過頭，咬牙切齒。
      　　
      　　「你敢過來，下次琳寫給你的信，我一封都不幫你帶。」
      　　
      　　桑克瑞德舉起雙手，退得乾脆俐落。
      　　
      　　「當我沒說。」
      　　
      　　阿爾菲諾看了看僵持的兩人，努力想幫忙安撫，過於溫柔的語氣卻彷彿是在和幼童說話。
      　　
      　　「塔塔露有準備莓果，喝完藥吃一點，就不會那麼難受了。」
      　　
      　　「我拒絕！」
      　　
      　　阿莉塞望著眼前這場拉鋸，慢條斯理地嘆了一聲。
      　　
      　　「只可惜雅·修朵拉不在這。要是她在，你才不會這樣。」
      　　
      　　光動作一頓。
      　　
      　　古·拉哈·提亞像是從那一瞬的沉默裡看見了希望，立刻又把藥瓶壓近了一點。
      　　
      　　「所以聽話，把藥喝了就好了，只有這一瓶。」
      　　
      　　「放著不管也會自己好。」
      　　
      　　「那要拖多久？」
      　　
      　　「總之會好！」
      　　
      　　「光！」
      　　
      　　「而且，」光瞇起眼睛，忽然冷笑了一聲，「你自己明明也很討厭喝藥。」
      　　
      　　古·拉哈·提亞一怔，像是沒預料到光居然還能反擊。
      　　
      　　「……我才沒有。」
      　　
      　　「沒有？」
      　　
      　　光看著他，神情一下子變得意味深長。
      　　
      　　「水晶都的人可不是這麼告訴我的。」
      　　
      　　古·拉哈·提亞的耳朵猛地豎了起來。
      　　
      　　光維持著兩人僵持的姿勢，慢悠悠地繼續說：「他們說，水晶公以前每次要喝藥，都會想辦法拖延。不是說等等再喝，就是趁人不注意把藥放到一邊，有幾次還乾脆躲回觀星室，還交代萊楠說自己不在。」
      　　
      　　「那、那是──」
      　　
      　　「現在倒好。」光豪毫不客氣地打斷他，「自己不喝，還來強迫我喝？」
      　　
      　　古·拉哈·提亞的耳尖一點點往後壓。
      　　
      　　「那是因為貓魅族的鼻子很靈！」他忍不住替自己辯解，「對身體好的藥都很難聞，我只是……需要一點時間做好準備而已。」
      　　
      　　光揚起眉毛。
      　　
      　　「那我的鼻子也很靈。」
      　　
      　　「你又不是貓魅族！」
      　　
      　　古·拉哈·提亞瞪著他，光也毫不退讓地直視回去。
      　　
      　　兩人對視半晌，古·拉哈·提亞氣得耳朵都往後扁了許多。
      　　
      　　「幼稚！」
      　　
      　　「你都可以不喜歡喝藥，那我也可以。」
      　　
      　　「這根本不是一回事！」
      　　
      　　「哪裡不一樣？」
      　　
      　　古·拉哈·提亞張了張嘴，似乎想反駁，卻一時找不到半句有力的話。
      　　
      　　最後，他低頭看了一眼自己手裡那瓶紫綠交錯、散發著可疑氣味的藥水，又看了看死活不肯配合的光。
      　　
      　　片刻後，他像是終於下定了什麼決心。
      　　
      　　「……好。」
      　　
      　　光一愣，警戒地看著他。
      　　
      　　「好什麼？」
      　　
      　　「既然你說我自己也不肯喝，」古·拉哈·提亞握緊藥瓶，「那我喝給你看。」
      　　
      　　「……等等。」
      　　
      　　光臉上的神情一下子變了。
      　　
      　　古·拉哈·提亞卻已經坐直身體，他盯著瓶裡那團彷彿還在緩慢翻湧的液體，臉色明顯僵了幾分，卻還是硬著頭皮拔開瓶塞。
      　　
      　　一股難以形容的氣味立刻飄了出來。
      　　
      　　古·拉哈·提亞整張臉都皺了起來，可他顯然不打算反悔。
      　　
      　　他閉緊眼睛，一手捏住鼻子，另一隻手將藥瓶舉到嘴邊，耳朵扁得幾乎看不見，只差下一刻就要把那瓶東西灌進自己嘴裡。
      　　
      　　光眼明手快，一把扣住了他的手腕。
      　　
      　　「你做什麼？」
      　　
      　　古·拉哈·提亞閉著眼，聲音因為捏著鼻子而有些含糊。
      　　
      　　「喝給你看。」
      　　
      　　「你沒受傷喝這個幹嘛！」
      　　
      　　「我就喝一口。只要我喝了，你也要乖乖喝藥。」
      　　
      　　古·拉哈·提亞勉強睜開眼睛。
      　　
      　　那雙紅色的眼睛看著他，明明連耳朵都還委屈似的壓著，神情卻十分堅定。
      　　
      　　光盯著他好半晌，掙扎許久，然後重重嘆了一口氣。
      　　
      　　「……拿來。」
      　　
      　　古·拉哈·提亞的眼睛亮了起來。
      　　
      　　「你願意喝了？」
      　　
      　　「趁我還沒反悔。」
      　　
      　　他這才立刻鬆開捏著鼻子的手，把藥瓶遞了過去。
      　　
      　　光接過來，低頭看了一眼裡頭那團詭異的紫綠色液體，只能屏住呼吸，認命地閉上眼，一口氣灌了下去。
      　　
      　　周圍竟響起了一陣掌聲與讚嘆聲。
      　　
      　　桑克瑞德更是毫不客氣地撞了撞古·拉哈·提亞的肩膀，笑著說他居然辦成了平時只有雅·修朵拉才能辦到的事。
      　　
      　　尤里安傑也露出一副頗為欣慰的神情，想來往後若再碰上光不肯喝藥，至少不必再為該由誰出面逼他就範而煩惱了。
      　　
      　　至於真正把那瓶東西喝下去的當事人……
      　　
      　　光整張臉都皺了起來。
      　　
      　　「……這到底是什麼東西。」
      　　
      　　然而沒有人回答他。
      　　
      　　圍在古·拉哈·提亞身邊的幾人正忙著稱讚貓魅做得漂亮，氣氛十分歡欣。
      　　
      　　至於英雄本人喝完之後是什麼感受，顯然沒人在乎。
  - title: 番外
    body: |-
      　　一陣鬧騰過後，其他人總算陸續散去。
      　　
      　　古·拉哈·提亞回到臥室時，光正坐在桌邊擦拭武器。他的動作一如往常熟練，只是臉上的表情明顯有些哀怨。
      　　
      　　古·拉哈·提亞站在門邊看了一會兒，耳朵慢慢垂下來。
      　　
      　　他多少也有些過意不去。
      　　
      　　並不是故意要用那種近乎威脅的方式逼光把藥喝下去，只是當時不管怎麼勸都沒有用，連塔塔露的莓果都沒能讓人動搖，他實在想不到別的辦法。
      　　
      　　現在回想起來，自己好像確實做得有些過頭。畢竟利用自己在別人內心份量這種事，即使有正當理由，怎麼說都過於狡猾。
      　　
      　　古·拉哈·提亞猶豫了一下，還是慢慢走了過去。
      　　
      　　光當然早已聽見他回來的動靜，只是低垂著頭，繼續手上的動作。
      　　
      　　古·拉哈·提亞湊近了一點。
      　　
      　　「光，你生氣了？」
      　　
      　　對方完全不說話，也不打算理睬他。
      　　
      　　古·拉哈·提亞乾脆挨到他身邊坐下，把臉湊過去，討好地蹭了一下他的臉頰。
      　　
      　　光的手停了一瞬，還是沒吭聲，但至少沒躲開。
      　　
      　　古·拉哈·提亞立刻又蹭了一下，柔軟的髮絲和耳側一併挨過來，細細地擦過光的臉頰。
      　　
      　　「不虧是我憧憬的英雄，今天真的很厲害。」
      　　
      　　光淡淡地瞥了他一眼。
      　　
      　　「哪裡厲害？」
      　　
      　　古·拉哈·提亞乾脆直接貼上他的臉邊。
      　　
      　　「就算是那麼難聞的藥，你還是有辦法把它喝完。能戰勝強敵跟內心最討厭的事物，不厲害嗎？」
      　　
      　　光的眉頭依然緊皺，但似乎鬆動了一點點。
      　　
      　　古·拉哈·提亞趁勝追擊。
      　　
      　　「況且願意為了讓我們安心而把藥喝完，這樣溫柔又可靠的英雄，全艾奧傑亞大概找不出第二個。」
      　　
      　　光偏頭，對上古·拉哈·提亞晶亮的一雙眼睛，終於伸手捏了捏他的鼻子。
      　　
      　　「怎麼？如果有第二個，你心目中的大英雄就要換人了嗎？」
      　　
      　　「怎麼可能。」古·拉哈·提亞繼續轉著臉，「世界的英雄有很多個，但我心目中第一的只有你。要知道你可是──」
      　　
      　　「好了。」
      　　
      　　光原本還板著臉，被他這樣來回蹭了半天，終於有些繃不住了。
      　　
      　　「再這麼蹭下去，臉都要著火了。」
      　　
      　　聞言，貓魅總算是退開了一點距離，但兩人還是挨得很近。古·拉哈·提亞垂在臉龐的長髮撓得光的臉頰發癢，他忍不住伸手抓了抓發熱的側臉。
      　　
      　　「那藥真的很可怕。」他低聲抱怨，「我現在滿口都是那個味道。」
      　　
      　　古·拉哈·提亞的耳朵立刻豎了起來。
      　　
      　　他連忙站起身、快步跑到一旁，隨後便捧著一個托盤上來。
      　　
      　　亮晶晶的眼神示意光打開蓋子，裡面是幾塊散發著香氣的甜點。
      　　
      　　「這是阿莉塞帶我去買的。」他獻寶似地笑著，「給你壓壓味道。」
      　　
      　　光盯著那滿臉期待的神情，最後還是垂下眼，從中挑走了一塊。
      　　
      　　古·拉哈·提亞的耳朵一下子高興地豎起來。
      　　
      　　光用手掰開一半，將另一半遞給身旁的貓魅，後者笑著接過，也低頭咬了一口。
      　　
      　　甜味很快在舌尖化開，沖淡留在鼻間與喉底的可怕藥味。
      　　
      　　光慢慢吃著手裡的那一半，神情總算不像剛才那麼陰沉。
      　　
      　　古·拉哈·提亞偷偷看了他幾眼。
      　　
      　　「好吃嗎？味道有壓下去一點嗎？」
      　　
      　　光點了點頭，古·拉哈·提亞立刻把托盤又往他面前推近。
      　　
      　　「那再吃一個。」
      　　
      　　「你是打算把我餵到吃不下晚餐嗎？」
      　　
      　　「只要藥味能沖散就好。」
      　　
      　　光忍不住看了他一眼。
      　　
      　　古·拉哈·提亞的表情認真又真誠，似乎很小心地留意著他的反應。

      　　光沉默片刻，忽然伸手揉了揉他的耳朵。
      　　
      　　「你怎麼好像比我還在意？」
      　　
      　　古·拉哈·提亞的耳尖輕輕動了一下，他垂下眼、兩手有些侷促地搓了搓，最後才小聲嘟囔。
      　　
      　　「畢竟是我逼你喝的。」
      　　
      　　那句話說得有些心虛。
      　　
      　　光這才明白他剛剛又蹭又誇、忙碌了老半天，原來真正在意的是這個。
      　　
      　　他低低嘆了一口氣。
      　　
      　　「我也不是真生你的氣。」
      　　
      　　古·拉哈·提亞抬起眼。
      　　
      　　「真的？」
      　　
      　　「只是你拿自己來威脅我，感受實在不好。」
      　　
      　　古·拉哈·提亞的耳朵肉眼可見地垂了下去。
      　　
      　　光終於忍不住笑出聲。
      　　
      　　「我自己都不願意喝的東西，怎麼可能讓你喝。」他搖了搖頭，「不會有人願意看自己喜歡的人受苦，哪怕只是一瓶藥。」

      　　古·拉哈·提亞安靜了一陣。
      　　
      　　他垂著頭，兩腳交錯地踢著，低聲說：「對不起嘛。」
      　　
      　　光看了他一眼。
      　　
      　　那雙耳朵還扁著，連剛才那股高興勁都沒了。
      　　
      　　他只好伸手握住古·拉哈·提亞的手，往自己這邊拉了一點。

      　　「但我知道你是擔心我，而且我也有錯。」
      　　
      　　古·拉哈·提亞眨了眨眼。
      　　
      　　「所以這次就算了。」
      　　
      　　那雙紅色的眼睛一下子亮了起來。
      　　
      　　光還來不及收手，古·拉哈·提亞便又順勢貼了上來，額頭抵著他的額頭，深深望著光的眼睛。
      　　
      　　「這是原諒我了嗎？」
      　　
      　　「看在你這麼真誠的份上。」
      　　
      　　古·拉哈·提亞高興地抱了抱光，又把臉貼了過來。
      　　
      　　光無奈地眨眨眼。
      　　
      　　「不是說了臉都快著火了嗎？」
      　　
      　　「那換另一邊。」
      　　
      　　「跟哪邊沒有關係！」
      　　
      　　古·拉哈·提亞並不打算理會他，喉間發出呼嚕嚕的聲音，臉頰一下下擦過光的側臉。
      　　
      　　「因為高興嘛。」
      　　
      　　光頓時沒了話。
      　　
      　　最後只能伸手拿起托盤裡另一塊點心，直接塞進他嘴裡。
      　　
      　　「快吃。」
      　　
      　　古·拉哈·提亞叼著點心，眼睛還彎著。
      　　
      　　光看了他一會兒，也忍不住跟著笑了。
