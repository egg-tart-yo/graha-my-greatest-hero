title: 那些肢體的表達
cp:
  - 拉哈光
  - 歡樂/甜文向
updated: 2026-10-16
summary: 無
series: 短篇
chapters:
  - body: |-
      　　午後的草原依然艷陽高照，卻不會讓人覺得過分燥熱，在微風帶來青草與濕土的氣味中，光抱著雙臂靠在圍欄邊，眼神有些複雜地望著不遠處的一人一鳥。
      　　
      　　溫順的陸行鳥正歡快地發出鳴叫，腦袋一個勁地往前湊，親暱地蹭著青年的臉頰。古·拉哈·提亞被逗得笑彎了眼，也順勢將臉貼了上去，任由陸行鳥蓬鬆柔軟的羽毛埋住自己半邊側臉。
      　　
      　　柔軟的貓耳在輕輕貼著的羽毛間愜意地顫動。
      　　
      　　光扁著臉看著溫馨的一幕。
      　　
      　　他忍不住抬手、摸了摸自己的頭頂──那裡除了一頭略帶硬度、被風吹亂的短髮以外，什麼都沒有。
      　　
      　　英雄有些挫敗地搔了搔髮根，心底冷不防生出一股莫名奇妙的哀怨。
      　　
      　　身為人類，天生就少了一點毛茸茸的東西。
      　　
      　　他向來不怎麼在意種族間體魄或外型的差異，可此時此刻卻罕見地羨慕起貓魅族來。不僅僅是那對能隨心意轉動、溫暖柔軟的耳朵，連那條長長的尾巴也彷彿擁有自己的意識一樣，高興時會輕快地捲起弧度，放鬆時又會無意識地在空氣中悠悠晃動。
      　　
      　　有時候比起語言，甚至能更直白地表露情緒。
      　　
      　　在冒險的旅途中，他曾數次造訪不同努恩的領地，也曾看過專屬於貓魅一族的交流方式，大部分就是透過那蓬鬆的尾巴。
      　　
      　　無論是微微勾起尾尖、任由柔軟的毛在試探中輕輕蹭過，或是難分難捨地緊緊交纏，就算只是安靜地交疊在一起，也會讓人聯想到親密的十指交扣。
      　　
      　　要是自己也有尾巴，或許就能夠……
      　　
      　　「光？」
      　　
      　　熟悉的呼喚拉回了他的思緒。
      　　
      　　光有些慌亂地抬起頭，正巧撞上不知何時轉過身來的古·拉哈·提亞。青年偏著頭，清澈乾淨的紅眼好奇地望向他，長尾也隨之揚起一個詢問的弧度。
      　　
      　　「怎麼了？為什麼一直盯著我看？」
      　　
      　　被一語道破，光的臉默默地紅了起來，但他怎麼樣都不能透漏自己方才腦袋裡那些亂七八糟的念頭。
      　　
      　　例如，也想長一條能纏上紅色貓尾的尾巴……之類的。
      　　
      　　無處躲藏、十分尷尬的英雄只得朝他們靠了過去，隨後張開雙臂，將陸行鳥與貓魅一同摟進了懷抱裡，順道偷偷摸摸地、把發燙的臉頰藏入紅色的頭頂，朝兩耳間埋了進去。
      　　
      　　「咕欸！」
      　　
      　　陸行鳥發出抗議的鳴叫，腦袋被擠在兩人間動彈不得，被勒得喘不過氣的古·拉哈·提亞先是愣了一下，隨後笑得縱容又無奈。
      　　
      　　他任由光無來由地抱著，笑道：「這樣抱著不舒服，你先放開我。」
      　　
      　　光最後留戀地在一片毛茸茸中轉了轉臉，才慢吞吞、滿臉僵硬地抬起頭來。他裝作若無其事地低咳了一聲，避開青年的視線含糊道：「……不會，這樣就好。」
      　　
      　　古·拉哈·提亞看著他泛紅的耳廓，唇角無聲地勾起一抹柔軟的弧度。
      　　
      　　說來有趣，貓魅族天生擁有能夠表露情緒的耳朵與尾巴，可眼前這個人分明沒有這些特徵，卻總能以另一種笨拙而直白的方式，將心意傳達得一清二楚。

      　　無論是欲言又止的神情，還是那些不經意流露的親暱，早已熟悉得不能再熟悉。
      　　
      　　畢竟，那是自己仰望了很久、很久的人啊。

      　　他抬起手，在陸行鳥的尾羽上輕輕一拍，示意牠稍稍讓出空間，隨後往前跨出半步，踮起腳尖、雙手無比自然地環住了英雄寬厚的後頸。
      　　
      　　紅眼像是不願放過光所有反應似地認真凝視，古·拉哈·提亞微啞的嗓音壓得極低，帶著幾分調侃與誘惑。
      　　
      　　「……真的這樣就好？」
      　　
      　　光困惑地偏頭，尚未反應過來，貓魅空著的另一隻手已緩緩抬起。柔軟的指腹輕輕按上了光的嘴唇，慢條斯理地摩挲了一下。
      　　
      　　青年偏著頭，眼底跳動著澄澈卻曖昧的碎光，輕聲問道。
      　　
      　　「那這裡呢？」
