      　　最近，冒險者行會裡流傳著一樁趣聞。
      　　
      　　光之戰士與古·拉哈·提亞，竟然同時被禁止承接行會委託，為期一個月。
      　　
      　　阿莉塞才在第七天堂聽說此事，推開石之家的門，便正好看見兩位當事人隔著一張長桌，分坐在大廳兩端。
      　　
      　　光抱著手臂，面無表情地盯著牆，古·拉哈·提亞捧著茶杯，耳朵微微往後壓，也一聲不吭。
      　　
      　　任誰都看得出來，他們正在互相生悶氣。
      　　
      　　「所以，」阿莉塞壓低聲音，轉頭問其他人，「到底發生什麼事了？」
      　　
      　　雅・修朵拉閉著眼睛喝茶，一副完全不想摻和的模樣，桑克瑞德則揉了揉眉心，彷彿光想起來就覺得頭痛。
      　　
      　　一旁的尤里安傑慢條斯理地開口。
      　　
      　　「據聞，他們日前與其他冒險者組成小隊，前往攻略一處迷宮。」
      　　
      　　「然後呢，」桑克瑞德接過話，「他們兩個都以騎士的身份入隊。」
      　　
      　　阿莉塞蹙著眉，尚且不覺得這有什麼問題，畢竟在某些隊伍裡，確實是有這樣的編制。
      　　
      　　真正的問題，是古·拉哈·提亞從進入迷宮開始，就一直把「保護」牽在光身上。
      　　
      　　起初，光沒有說什麼。
      　　
      　　經過第一群魔物時，他只是低頭看了一眼連在兩人之間的淡淡光線，討伐完第一層精英怪物後，他又看了一眼。
      　　
      　　在第二層的入口，身上再次出現連接著的光線時，光終於停下腳步，眼神直盯著若無其事的古·拉哈·提亞。
      　　
      　　「這樣比較安全。」後者眨眨眼，理直氣壯。
      　　
      　　「我也是騎士。」
      　　
      　　「領頭的人比較危險。」
      　　
      　　「但我是騎士。」
      　　
      　　「你還要負責牽制魔物，不像我，負責殿後不太會有什麼危險。」
      　　
      　　光看了他幾秒，蔚藍的眼睛微微一暗。
      　　
      　　接著，他抬起手，也對古·拉哈·提亞施放了「保護」，瞬間，兩道光線就這麼交錯在兩人之間。
      　　
      　　古·拉哈·提亞愣了愣，光卻帶著沒得商量的神色，再度向前邁進。
      　　
      　　於是，兩名騎士就這麼互相牽著「保護」，一路走完了整座迷宮。
      　　
      　　隊伍裡的兩位補師站在後面，頻頻面面相覷，看著他們爭著在危急時替對方施放深仁厚澤，手裡的治療法術舉起又放下、放下又舉起。
      　　
      　　最後，補師們欲哭無淚，渾身傷的進攻職業更是面色陰沉，分完寶箱的物品便頭也不回地直奔行會櫃檯，七嘴八舌地控訴兩名騎士，為什麼能為了誰保護誰爭吵整整一路。
      　　
      　　那為期一個月的禁令，正是針對他們的處分。
      　　
      　　「這樣啊。」
      　　
      　　阿莉塞聽完整件事，扯了扯嘴角。
      　　
      　　「啊哈……啊哈哈哈……」
      　　
      　　光緩緩轉頭看她，古拉哈提亞也抬起眼睛。
      　　
      　　「不是我的問題。」光冷冷地說。
      　　
      　　「怎麼會是我的錯？」古·拉哈·提亞立刻反駁，「是你莫名其妙地對我使用保護。」
      　　
      　　「先牽我的人可是你。」
      　　
      　　「因為你每次戰鬥都衝在最前面。」
      　　
      　　「哦？地牢那邊是誰搶在我前面，還差點分走了仇恨？」
      　　
      　　眼看兩人又要吵起來，桑克瑞德默默往旁邊挪了一個位置。
      　　
      　　光皺著眉，終於下定決心般說道：「總之，以後你想跟我一起出門，就不許開騎士。」
      　　
      　　古·拉哈·提亞的耳朵壓得非常低，紅尾甚至氣得澎起，用力地在身後甩動。
      　　
      　　「那我去練暗黑騎士。」
      　　
      　　光一怔，「什麼？」
      　　
      　　「聽聞至黑之夜的盾很厲害，」古·拉哈·提亞認真地說，「在第一時間我曾見你用過。」
      　　
      　　「那個要消耗魔力！」光立刻提高聲音，「不要隨便亂放！」
      　　
      　　「控制魔力對我來說不怎麼難，我可是黑魔專家。」
      　　
      　　「你才不會控制，一定會每次冷卻好就丟給我。」
      　　
      　　「有需要的話。」
      　　
      　　「重點不是這個！」
      　　
      　　古·拉哈·提亞想了想，忽然轉頭看向桑克瑞德，後者整個人一僵。
      　　
      　　「為什麼這樣看我？」
      　　
      　　「請你也教我絕槍戰士吧。」
      　　
      　　「別把我拖下水！」
      　　
      　　「不要鬧了！」光重重拍了一下桌子。
      　　
      　　古·拉哈·提亞也站了起來，和光怒目瞪視。
      　　
      　　光怒氣沖沖地喊：「騎士不行就換暗黑騎士，暗黑騎士不行就換絕槍戰士，你到底為什麼非得一直把減傷技能丟給一個防護職業？」
      　　
      　　「因為我想保護喜歡的人，有什麼錯！」
      　　
      　　古·拉哈·提亞的聲音在房間裡清清楚楚地迴盪開來。
      　　
      　　阿莉塞張大嘴巴。
      　　
      　　桑克瑞德默默抬起手，按住了自己的臉。
      　　
      　　雅・修朵拉端著茶杯，嘴角似乎輕輕揚了一下。
      　　
      　　古·拉哈·提亞看著夥伴們的神色，後知後覺地僵在原地，臉頰以肉眼可見的速度紅了起來，連耳朵尖都染上了顏色。
      　　
      　　「我、我的意思是──」
      　　
      　　「難道只有你想保護喜歡的人嗎！」
      　　
      　　沒想到光也吼了回去，瞬間，愣住的人換成了另一個。
      　　
      　　兩個紅著臉的人隔著桌子看著彼此，誰也沒有再說話。
      　　
      　　過了好一會兒，古·拉哈·提亞才小心翼翼地開口。
      　　
      　　「所以……你、你也喜……」
      　　
      　　「別問。」
      　　
      　　「可是──」
      　　
      　　「就說了別問！」
      　　
      　　「那以後我們一起出門時──」
      　　
      　　「隨便你要開什麼職業。」
      　　
      　　古·拉哈·提亞的眼睛立刻亮了起來。
      　　
      　　光別開臉，補充道：「但別再亂放技能，我沒那麼脆弱，你該優先保護你自己。」
      　　
      　　「我會視情況判斷。」
      　　
      　　「古、拉、哈、提、亞。」
      　　
      　　「……也會稍微克制。」
      　　
      　　光沉默片刻，勉強點點頭。
      　　
      　　阿莉塞在旁邊看得目瞪口呆。
      　　
      　　「這樣就算和好了？」
      　　
      　　「大概吧。」桑克瑞德疲憊地說。
      　　
      　　下一秒，古·拉哈·提亞偏頭想了想，突然亮起了眼睛。
      　　
      　　「既然這樣，戰士的原初的勇猛似乎也能──」
      　　
      　　「你敢去練戰士，我就一個月不跟你出門。」
      　　
      　　光咬著牙，陰沉沉地祭出最後通牒。
      　　
      　　古·拉哈·提亞頓時收起了方才的躍躍欲試。
