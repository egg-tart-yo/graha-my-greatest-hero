title: 歸宿
cp:
  - 拉哈光
  - 光拉哈
updated: 2026-09-26
summary: 無
series: 短篇
chapters:
  - body: |-
      　　森林中央的空地被激烈的氣流與魔法震得落葉紛飛，一路追趕魔獸的光發現他們已經過於深入這片茂密的山林，突然有些拿不準下山的路。
      　　
      　　正當光環顧四周時，身後傳來踩過落葉的腳步聲。
      　　
      　　古·拉哈·提亞走到他身邊，神情專注地閉上雙眼，一段光從未聽過的語言自他口中流洩而出，帶著某種肅穆且莊嚴的聲調，低聲吟唱著。
      　　
      　　隨著咒文收尾，他的掌心泛起一陣溫柔的微光，光暈隨即化作一縷細長而明亮的光束，筆直穿透茂密的樹林，指向了遠處平緩下坡的方向。
      　　
      　　「走這邊吧。」他望向光，耳尖微微動了動，語氣帶著一貫的可靠。
      　　
      　　順著光線的指引，兩人果然沒花多少時間便穿過了盤根錯節的密林，順利踏上下山的小徑。眼前的視野驟然開闊，甚至能看見山腳下村落的燈火。
      　　
      　　光忍不住回頭看向古·拉哈·提亞，真心讚嘆這個咒語對冒險者來說實在太方便了。
      　　
      　　「拉哈果然很厲害。」他由衷感嘆道。
      　　
      　　突如其來的直白稱讚讓貓魅有些手足無措，他微微抖動的耳尖泛起一陣紅，下意識抓了抓頸側的髮絲，神情既靦腆又有些掩不住的欣喜。
      　　
      　　「沒、沒什麼啦……這只是以前在亞拉戈文獻裡學到的小把戲。原理其實很單純，只要施術者的目的足夠明確，和乙太產生共鳴，就能引導人前往『內心想去的地方』。」
      　　
      　　他清了清嗓子，認真地補充道：「比方說，如果我現在心裡想著要回去的地方，它就會指向石之家的方向──」
      　　
      　　話音剛落，他再次輕聲吟唱咒語，掌心重新凝聚起那團柔和的光芒。光束輕輕一顫，在半空中旋轉了半圈，隨後──
      　　
      　　「啪」地一下，不偏不倚，筆直落在了站在他正前方的光身上。
      　　
      　　空氣瞬間安靜了下來。
      　　
      　　光低頭看了看自己胸口被光束照亮的地方，又抬起頭看向他。
      　　
      　　古·拉哈·提亞也看著光，眼睛微微睜大，整個人僵在原地，尾巴可疑地慢慢蓬了起來。
      　　
      　　「咦……？咦？怎、怎麼會這樣？明明是石之家才對啊……」
      　　
      　　青年瞬間慌了神，連忙散去手心的乙太，深吸一口氣，閉上眼睛更用力地想著拂曉的據點，重新施法。
      　　
      　　他認真地整張臉都皺了起來，然而光芒再次亮起，細細的光束依然堅定無比地轉了個彎，緊緊黏在光身上。
      　　
      　　「等、等等，等一下！為什麼突然失靈了……」
      　　
      　　古·拉哈·提亞手忙腳亂地試了好幾次。光看著他慌張得不知如何是好的模樣，有些好奇又帶點故意往旁邊跨了幾步。
      　　
      　　光束立刻緊跟著移動，牢牢指向他所在的位置。
      　　
      　　看著古·拉哈·提亞紅透的貓耳和急得結結巴巴的樣子，光終於忍不住噗哧一聲笑了出來，胸口泛起了一陣暖意。
      　　
      　　是嗎，原來這就是你想回來的地方。
      　　
      　　光不再走動，而是站在原地，大大地張開了雙臂，笑著望向古·拉哈·提亞。
      　　
      　　而他看著那個坦然向自己敞開的懷抱，臉上的紅暈一路蔓延到了脖頸。他垂下毛茸茸的耳朵，有些害羞又有些無奈地抿了抿唇，最終還是順從地邁開步伐，一步一步朝光走了過去。
      　　
      　　光收攏手臂，結結實實地將走上前來的貓魅緊緊收進了懷裡。
