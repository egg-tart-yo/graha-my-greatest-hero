title: 愛情放大靈藥
cp:
  - 拉哈光
updated: 2026-10-14
summary: 無
series: 短篇
chapters:
  - body: |-
      　　烏爾達哈的烈日總是將旅人的頭頂烤得發燙。穿梭於遮陽棚的光壓低了視線，正尋找著最近的傳送水晶，藍玉大街的一隅卻冷不防傳來一陣歡快的喧嘩。
      　　
      　　藍眼抬起，只見幾個年輕女孩聚在一個不起眼的攤位前，又是推擠又是摀嘴偷笑，彼此咬著耳朵，興奮地竊竊私語著。
      　　
      　　「……真的嗎？只要喝下去就能確認心意？」
      　　
      　　「要看喜歡的程度啦！如果本來就暗戀很久，甚至會直接撲上來哭著表白呢！」
      　　
      　　「天啊！我要買去試探那位騎士大人……」
      　　
      　　攤位中央，認真兜售的拉拉菲爾男子長著兩撇油亮的鬍鬚，正捧著幾個裝著淡粉色液體的玻璃瓶，口沫橫飛地吹噓著他手中的「愛情放大靈藥」。
      　　
      　　光的腳步不自覺地停了下來，視線不由自主地在那被豔陽照射得閃亮的玻璃瓶上打轉。
      　　
      　　他的腦海裡莫名其妙浮現出一對晃動的紅色貓耳。
      　　
      　　待回過神，光已經默默轉了個身，逆著人流走了過去。
      　　
      　　「哎呀？那位不是……！」
      　　
      　　「是那位英雄？！」
      　　
      　　攤位旁的女孩們紛紛驚呼，隨後主動讓出一條路。光在眾目睽睽之下維持著平靜的神色，伸出手，極其乾脆地拿起男子手中的瓶具。
      　　
      　　周圍傳出一陣曖昧的哄笑。
      　　
      　　「原來英雄有喜歡的人了？」
      　　
      　　「號外號外！我要投書報社！」
      　　
      　　「天哪會是誰？該不會是哪國的貴族吧？」
      　　
      　　此起彼落的討論讓光的耳根有些發熱，但英雄終歸是英雄，無論是臉皮還是戰力都掛保證。他只是淡淡朝周圍的人群點點頭，隨後低聲向攤主發問：「多少錢？」
      　　
      　　老闆賊溜的眼睛轉了轉，隨即比出一個讓人眼珠差點掉下來的天價數字。
      　　
      　　「貴。」
      　　
      　　光沒有絲毫猶豫，將藥水放回他的手上，轉身就要離去。
      　　
      　　這金額實在過於荒謬，他得搓多少茶才賺得來？
      　　
      　　果然跟羅薇娜商會和拉拉菲爾族做生意，都得小心再小心。
      　　
      　　遠方的塔塔露打了個響亮的噴嚏，好險光聽不見。
      　　
      　　「等等！英雄請留步！」
      　　
      　　著急的老闆連忙跨出攤位，一把扯住光的斗篷，低沉的嗓音神神秘秘地道：「您難道就不好奇心中的『那一位』到底對您是什麼樣的情感？如果一瓶藥就能買到一個肯定的答案，甚至獲取一顆真心，這價格真的一點都不過分！」
      　　
      　　光邁出去的長靴僵在了原地。
      　　
      　　他扁起嘴，滿臉寫著掙扎與懷疑，猶豫了半晌才悶悶地反問一句：「……要是對方喝了，完全沒反應呢？」
      　　
      　　小小的臉上寫滿了意味深長的笑容。
      　　
      　　老闆伸手撫著鬍鬚、呵呵笑了起來，不急不徐回答英雄的聲音被淹沒在市場鼎沸之中。
      　　
      　　
      　　
      　　*
      　　
      　　
      　　最後，行囊裡真的多了一瓶粉色的藥劑。
      　　
      　　入夜，難得全員到齊的拂曉聚在一起享用晚餐，桌上擺滿了熱氣騰騰的燉菜與烤肉。眾人有說有笑，唯獨光有些心不在焉，目光總是不受控制地往旁邊飄去。
      　　
      　　坐在他身側的古·拉哈·提亞正捧著一片抹了厚厚果醬的麵包，紅色的貓耳隨著咀嚼一抖一抖，尾巴在椅背後愜意地搖晃。每當光看過去時，貓魅總能敏銳地察覺到視線，轉過頭對光露出一個毫無防備的溫暖笑容，「怎麼了？光，要來點湯嗎？」
      　　
      　　「……好。」
      　　
      　　光假裝低頭喝水，靜靜等待那個時機。
      　　
      　　終於，當古·拉哈·提亞站起身，替光拿取遠方剛出爐的麵包時，英雄以極快的速度拉過藏在一旁的藥瓶，用手臂的陰影蓋住瓶身，隨後長手一揮、趁著無人注意的時候，往古·拉哈·提亞的果汁杯裡滴了兩滴。
      　　
      　　身手用在這種地方，他感到有些心虛，愧疚混雜著緊張的心跳，彷彿雷鳴般響亮。
      　　
      　　粉色的液體瞬間化開，彷彿什麼都沒發生過，而端著麵包坐回來的貓魅，也毫無戒心地端起杯子、啜飲了一大口。
      　　
      　　光屏住呼吸，放在膝蓋上的手心全是汗，死死盯著古·拉哈·提亞上下滑動的喉結，一邊靜靜數著心跳。
      　　
      　　但放下杯子的貓魅只是抹了抹嘴邊的果汁，紅寶石般明亮的眼睛滿足地瞇起，隨後神色如常地將麵包掰了一半，將較為大塊的部分毫不猶豫地塞到光的盤子裡，又將熱湯推了過去。
      　　
      　　……完全沒有變化。
      　　
      　　沒有臉紅，沒有熱淚盈眶，沒有撲過來表白，連貓耳朵轉動的角度都跟平時一模一樣，尾巴也維持著原本搖晃的頻率。
      　　
      　　光的心沉了下去，垂頭喝了兩口悶湯，一陣說不出的失落與挫敗湧上心頭。
      　　
      　　果然只是騙錢的假藥水吧……或者是那個最壞的猜想？他在心底煩悶地嘆了口氣，發洩似地把長腿往前一伸，卻不偏不倚踢到了前方人的腿。
      　　
      　　「噢！好痛……你踢我幹嘛？」
      　　
      　　坐在對面的桑克瑞德慘叫了一聲，揉著小腿抗議，隨後目光掃到了光手邊還沒來得及收回的粉色小瓶子。
      　　
      　　「這是什麼？看起來粉粉嫩嫩的，哪裡帶回來的甜酒？」
      　　
      　　桑克瑞德好奇地湊上前。
      　　
      　　「等等！別碰這個──」
      　　
      　　光甚至來不及伸手阻攔，行動敏捷的桑克瑞德已經用一股看小氣鬼的目光輕蔑地掃了光一眼，然後以迅雷不及掩耳的速度搶過玻璃瓶，一把拔開瓶塞。
      　　
      　　隨著他仰頭啜飲的動作，餐廳裡的空氣在一瞬間凝固了。
      　　
      　　臉龐先是閃過一絲困惑，接著眼眶迅速泛紅，嘴唇也劇烈顫抖起來。在所有人驚愕的目光中，這位歷經滄桑的男子把頭埋進旁邊艾斯蒂尼安的衣袖裡，爆發出一陣撕心裂肺的嚎啕大哭。
      　　
      　　「嗚啊啊啊──！琳！我想見琳啊！那個魔女穿越世界的研究到底什麼時候可以成功！我的女兒──」
      　　
      　　「喂！你發什麼瘋？！」
      　　
      　　艾斯蒂尼安整張臉一青一白，嫌棄地伸直手臂、試圖推開掛在自己身上的人，「嘖……鼻涕！別蹭到我身上！快把他弄走！」
      　　
      　　餐廳瞬間亂成一團。
      　　
      　　在阿莉塞的大笑與雅·修朵拉頗具威脅的凝視中，只有塔塔露慌忙地掏出手帕，與尤里安傑一同上前安慰。
      　　
      　　「桑克瑞德先生！冷靜一點！琳小姐在第一世界一定過得很好的啦！」
      　　
      　　光怔怔地看著哭得驚天動地的桑克瑞德，下意識低頭、看著桌上的空玻璃瓶。
      　　
      　　原來真的有用？！那拉哈究竟……
      　　
      　　光僵硬地轉過頭，再次看向身旁的貓魅族青年。
      　　
      　　幫忙收拾好阿爾菲諾打翻的濃湯，重新坐回來的古·拉哈·提亞也轉頭回望著光，他的眼神在一片混亂中帶著一絲慶幸與柔軟，嗓音像是自言自語，又像是無比虔誠的感嘆。
      　　
      　　「跟桑克瑞德比起來……我很慶幸，自己能像現在這樣陪伴在你身邊。」
      　　
      　　古·拉哈·提亞彎起眼睛，唇角揚起一抹無比溫柔的弧度。
      　　
      　　「謝謝你將我帶回來，光。」
      　　
      　　毛茸茸的尾巴從身後探來，輕輕蹭過光的指節，最後順著手腕纏繞而上，牢牢牽住了他。
      　　
      　　光垂下頭，撞進那雙柔軟的眼睛。從瞳孔的倒影裡，他能看見自己正愣愣地望著身旁的貓魅。
      　　
      　　攤位老闆的話，瞬間在腦中一閃而過。
      　　
      　　「藥水只放會大真情，不會憑空捏造。要是喝了真的毫無反應，那只有兩種可能……他內心並沒有您的存在，又或者是──對您的愛意，早已經濃烈到徹底融入了生活的每一處細節，再也找不出一絲能夠被『放大』的空隙了。」
      　　
      　　原本他只當是過於浮誇的推銷言詞，內心卻開始躁動了起來。
      　　
      　　奇、奇怪，明明自己沒碰藥水，怎麼突然很想──
      　　
      　　「拉哈。」
      　　
      　　在意識到之前，話語就自行脫口而出。
      　　
      　　「我喜歡──」
      　　
      　　「琳──啊───」
      　　
      　　兩人身後再度傳來激烈的哭聲。
      　　
      　　好不容易鼓起勇氣的光臉脹得極紅，也不知道是害羞還是氣惱，他的神情一下慌張，又被憤怒取代，複雜的表情忍不住逗笑了古·拉哈·提亞。
      　　
      　　貓魅沒有回應，只是輕輕眨眼，將光映在瞳孔的倒影收入比眼底更深的地方。
      　　
      　　隨後，纏繞在手腕的長尾輕輕一鬆，順勢站起身。光還來不及喊住他，古·拉哈·提亞卻又突然轉了過來，抬手將什麼晶瑩剔透的物品舉至眼前，朝光輕輕搖晃。
      　　
      　　正是那個沾染著粉色液體的玻璃瓶。
      　　
      　　他偏過頭，透過剔透的玻璃凝視著驚慌的光，眼底滿是過於柔軟的笑意。
