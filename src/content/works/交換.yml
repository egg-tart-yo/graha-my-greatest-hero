summary: 有明顯的身位交換，堅定某一方的朋友請慎入
series: 短篇
chapters:
  - body: |-
      　　發現英雄歸來時，阿爾菲諾是第一個快步迎上前的人。
      　　
      　　「傷得重嗎？先讓我看看。」
      　　
      　　他一邊說著，一邊熟練地抬手施放治癒之光，柔和的白光在掌心凝聚，落在英雄肩側滲血的傷口上，光也十分配合地卸下上身的部分裝備，讓破損的衣料滑落到手臂間，好讓他確認傷勢。
      　　
      　　傷口不算太深，約莫是討伐時被魔物利爪擦過，邊緣有些撕裂，血跡沾在肌膚與布料上，看起來嚇人，實際上並不難處理。阿爾菲諾專注地替他止血，眉頭微微蹙著，直到傷口在治癒魔法下逐漸收攏，才稍稍鬆了口氣。
      　　
      　　然而下一刻，他的目光卻停住了。
      　　
      　　英雄的後背上，除了那道真正需要治療的傷以外，還遍佈著許多暗紅色的抓痕。
      　　
      　　那些痕跡並不深，甚至稱不上傷口，卻因為數量不少而格外顯眼。它們從肩胛附近一路斷斷續續延伸到後腰，有些還清晰地泛著紅，像是被人用指尖用力抓過所留下的痕跡。
      　　
      　　阿爾菲諾困惑地眨了眨眼。
      　　
      　　他仔細回想這次討伐的魔物種類，又低頭看了看那些抓痕的位置，怎麼想都覺得不太對，那完全不像戰鬥造成的傷，也不像是怪物的攻擊。
      　　
      　　「這些是……」
      　　
      　　他才剛開口，身旁便傳來一道明顯比平時更快的腳步聲。
      　　
      　　尤里安傑走上前來，神情仍舊端正，卻難得帶著一絲尷尬。他看了一眼英雄背上的痕跡，又看了一眼完全沒察覺異樣的阿爾菲諾，沉默片刻，最後十分慎重地開口。
      　　
      　　「阿爾菲諾少爺，接下來便交由我處理吧，可否勞煩你先去準備些熱水？」
      　　
      　　「啊，好的。」
      　　
      　　阿爾菲諾沒有多想，立刻點頭離開。
      　　
      　　一名年輕精靈快步走遠，另一名成年精靈則站在原地，表情微妙地承接了接下來的治療工作。
      　　
      　　偏偏這時，桑克瑞德也被動靜吸引過來。
      　　
      　　他原本只是想確認英雄的傷勢，視線往光背上一掃，隨即挑了挑眉。那副表情沒有半點驚訝，倒像是看見某種非常有趣、非常值得記錄，卻不適合被討論的東西。
      　　
      　　他慢悠悠地吹了一聲口哨。
      　　
      　　「嗯，是另一種光榮的戰績呢。」
      　　
      　　尤里安傑的表情更僵硬了。
      　　
      　　光倒是平靜得很，他只是側過臉看了桑克瑞德一眼，眨了眨眼，既沒有承認，也沒有否認。
      　　
      　　這種反應讓桑克瑞德笑得更愉快。
      　　
      　　「你還真是一如既往地坦然啊。」
      　　
      　　光想了想，誠實地回答。
      　　
      　　「到這裡就可以了，這不是什麼需要治療的傷。」
      　　
      　　尤里安傑默默閉上了眼，修長的手指捏住自己的鼻樑。
      　　
      　　就在氣氛即將往更難以收拾的方向發展時，聽見騷動而趕來的阿莉塞也探頭湊了過來。
      　　
      　　「怎麼了？光傷得很重嗎？」
      　　
      　　她才剛往前一步，後領便被人從身後拎住。
      　　
      　　艾斯蒂尼安面無表情地把人拎了回來，阻止她繼續靠近。
      　　
      　　「別湊熱鬧，我們去幫阿爾菲諾。」
      　　
      　　「裝個水還要人幫？」阿莉塞立刻掙扎起來，「你放我下來，我自己會走──欸？」
      　　
      　　她抗議到一半，忽然察覺不對。
      　　
      　　少女環顧四周，視線掃過幾名夥伴，最後停在空蕩蕩的一角。她後知後覺地發現，那個理應在英雄受傷時第一個衝上前來、比誰都緊張的紅髮身影，不知何時竟然消失得無影無蹤。
      　　
      　　這實在有點奇怪。
      　　
      　　明明以往光身上多一道傷，古·拉哈·提亞不是已經拿著法杖衝到最前面，就是在旁邊急得尾巴亂甩。
      　　
      　　阿莉塞皺起眉，困惑地發問。
      　　
      　　「拉哈呢？剛剛不是還在這裡嗎？」
      　　
      　　面對少女疑惑的目光，艾斯蒂尼安選擇看向天花板。
      　　
      　　雅·修朵拉輕輕一笑，語氣平穩地補上答案。
      　　
      　　「療傷的時候，他直接回房間了。」
      　　
      　　「回房間？」阿莉塞更加困惑。
      　　
      　　尤里安傑則低聲咳了一下，試圖把整個場面從深淵邊緣拉回來。
      　　
      　　「總之，英雄的傷勢並無大礙。阿莉塞小姐，若熱水已備妥，接下來便不必過度擔憂。」
      　　
      　　「你這個轉移話題也太生硬了吧！」
      　　
      　　阿莉塞終於察覺自己被排除在某種真相之外，頓時更加不滿，然而艾斯蒂尼安已經拎著她往外走，完全不打算讓她繼續追問。
      　　
      　　「等等，放開我！你們是不是有什麼事瞞著我？桑克瑞德，你不要笑了！光，你也不要裝沒事！」
      　　
      　　少女的聲音一路遠去，房間裡只剩下幾名知情者各自維持著微妙的表情。
      　　
      　　打破沉默的是神情嚴肅的女性貓魅。
      　　
      　　「雖說以你的身手，不需要過於擔心……」雅·修朵拉慢悠悠地說，語氣裡富含著無聲的壓力，「但畢竟是戰鬥任務的前一日，還請稍微收斂一點，不要太放縱了。」
      　　
      　　「就目前的痕跡來看，我倒覺得這句話應該對另一個人說。」
      　　
      　　桑克瑞德出聲調侃，尤里安傑又再度咳了起來。
      　　
      　　而他們的英雄面對雅·修朵拉的視線，只得乖乖地點了點頭。
      　　
      　　
      　　
      　　夜間，回到房間的光果然見到一個縮在床邊、把自己用棉被裹起來的背影，旁邊還露出僵硬蜷在身側的紅色尾巴。
      　　
      　　「拉哈？」
      　　
      　　「……我不在。」
      　　
      　　裹著棉被的身影與他保持著一段十分明顯的距離。光輕手輕腳地湊了上去，毫不客氣地將頭搭上他的肩，吸了口熟悉的氣味，又忍不住發出一聲滿足的喟嘆。
      　　
      　　古·拉哈·提亞雖然沒有推開他，卻從陰影縫隙裡瞪了他一眼，那目光委屈得十足。他低低嗚咽了一聲，心裡知道自己無法責怪眼前的人，卻又羞得無地自容。
      　　
      　　光輕笑著，偏頭蹭了蹭屬於自己的貓魅。
      　　
      　　「那沒什麼的。」他一本正經地說，「我不在意，反而很開心，因為那代表拉哈很舒服……」
      　　
      　　「請！請不要就這麼說出來！」
      　　
      　　棉被一翻，古·拉哈·提亞急忙伸手摀住光的嘴。他的臉紅得像顆熟透的番茄，崩潰地喊道：「為什麼你能面不改色地說出這種話！我、我……」
      　　
      　　「……難道不是嗎？」
      　　
      　　激烈震動的紅眸對上無辜的藍眼，而後看見英雄眼底開始瀰漫著落寞，古·拉哈·提亞的耳朵焦躁地抖動著，幾乎快要冒出煙來。
      　　
      　　「……是、是很舒服，但重點是這個嗎──」
      　　
      　　這人、這人什麼時候學壞了！
      　　
      　　他明明知道自己就是沒辦法對英雄說謊！
      　　
      　　現在的古·拉哈·提亞真想把水晶公的兜帽戴回來，最好連臉一起遮住。
      　　
      　　光見眼前的貓魅都快把自己急哭了，終於忍不住笑出聲來，將羞得熱騰騰的貓魅抱進懷裡，安撫地撫摸著他的頭。
      　　
      　　看來這次把人欺負得太過分了。
      　　
      　　光稍稍檢討著自己，隨後想了想，又認真地提出建議。
      　　
      　　「還是，下回換我來當承受的一方？」
      　　
      　　「……什麼？」
      　　
      　　轟的一聲，懷中的貓魅渾身僵硬，毫無察覺的英雄還認為自己提出了不錯的建議。
      　　
      　　「不好嗎？這樣就不會再發生一樣的事了。」
      　　
      　　他伸手捧起貓魅的臉頰，認真地望著那雙濕漉漉的貓眼。
      　　
      　　「而且，我也想感受拉哈的全部。」
      　　
      　　「就、就說了不要講這麼害臊的話……」
      　　
      　　光困惑地偏頭，一向秉持有問題就該溝通的直白思路，讓古·拉哈·提亞只能拼命搖頭，完完全全拿眼前的人沒辦法。
      　　
      　　「但是承受的一方……一開始很辛苦，特別是第一次……」
      　　
      　　面對他微弱的勸阻，一臉自信的英雄卻認為這不是什麼問題。他垂下頭，把自己的腦袋埋進貓魅的頸窩，模仿他平常撒嬌的模樣，用力蹭了蹭。
      　　
      　　「不會，拉哈也會很溫柔。」他笑了笑，「對嗎？」
      　　
      　　驚疑不定的紅眼左右猶疑，像是在最後確認他的意願。而得到肯定的答案後，柔軟的唇顫巍巍地貼了上來，一口咬住光的下唇。
      　　
      　　
      　　
      　　而隔日早晨，後頸被咬得都是痕跡的英雄，被手插著腰的雅·修朵拉認真教訓的模樣，又是另一日的風波了。
