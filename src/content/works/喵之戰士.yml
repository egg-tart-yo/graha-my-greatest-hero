  - title: 第一章
    body: |-
      　　今日的石之家比平日熱鬧一些。
      　　
      　　準備出發的光、桑克瑞德與古·拉哈·提亞都湊在大廳準備行囊，阿莉塞則站在一旁，看著艾斯蒂尼安把行李縮減到幾乎只剩一把武器，眉頭皺得越來越深。

      　　「你至少再帶一份繃帶吧。」
      　　
      　　龍騎士不以為然，伸手指了指不遠處正低頭檢查藥水的古·拉哈·提亞。
      　　
      　　「不是有奶媽嗎。」
      　　
      　　「別說得這麼篤定，萬一出什麼意外呢？」
      　　
      　　事實證明，有些話確實不能說得太早。
      　　
      　　阿莉塞的話才剛落下沒多久，角落便傳來一聲清脆的玻璃碎裂聲，緊接著，一陣淡色煙霧毫無預兆地瀰漫開來。
      　　
      　　眾人紛紛停下手中的動作，抬頭望向煙霧的方向。
      　　
      　　只見方才還站在行李旁的古·拉哈·提亞已經不見了，原地只剩散落一地的玻璃碎片，地板上還殘留著些許散發微光的淡色液體，正沿著石磚縫隙緩慢流淌。
      　　
      　　而在那片狼藉正中央，一隻毛色鮮紅的大貓正僵硬地坐在一疊紅與黑的衣物之間。
      　　
      　　牠一動也不動，兩隻前爪規規矩矩地併在身前，長長的尾巴則像是受到了驚嚇，整隻炸了開來。
      　　
      　　那雙紅色的眼睛睜得極大，呆滯地看著四周，彷彿還沒明白自己身上發生了什麼。
      　　
      　　眾人一時誰也沒說話。

      　　小紅貓低下頭，抬起一隻前爪，很慢地翻過來，看了看自己粉色的肉墊。

      　　「……」

      　　空氣安靜得有些異常。

      　　阿莉塞已經用力抿住了嘴，一張臉憋得發紅。

      　　小紅貓像是察覺到什麼，猛地抬起頭，目光在眾人臉上一一掃過，最後牢牢落在光身上。

      　　牠的觸鬚動了動，急忙張開嘴，大概原本是想解釋，口中發出的聲音卻已經與預期的截然不同。

      　　「喵！」

      　　聲音出口的瞬間，小紅貓整隻都石化了。

      　　看見他這副模樣，阿莉塞終於轉過身，肩膀劇烈地抖了起來。　

      　　阿爾菲諾無奈地看了她一眼。

      　　塔塔露倒是很快便接受了眼前的狀況。

      　　她小跑步過來，蹲到小紅貓面前，先是左看右看，確認牠似乎沒有哪裡不舒服，這才鬆了口氣。

      　　「看起來只是變成了貓咪呢。」

      　　雅·修朵拉走近幾步，目光落在地上剩餘的液體。

      　　「應該是短期的變形藥，好在劑量看似不多，最多一天便會恢復。」
      　　
      　　「哪個白癡在背包放這種東西！」
      　　
      　　桑克瑞德蹙眉轉了過來，光連忙舉高了雙手。
      　　
      　　「瞪我幹嘛！我一點印象都沒有！」
      　　
      　　「可能僱員蒐集回來的吧。」
      　　
      　　比起幫忙緩頰的尤里安傑，艾斯蒂尼安倒是只在乎一件事。
      　　
      　　「這下沒補了，怎麼辦？」他轉頭看向阿爾菲諾，「如何？一起去嗎？」

      　　聞言，還在石化的小紅貓瞬間立起了耳朵。

      　　沒發現他的異常，塔塔露立刻笑著拍拍手。

      　　「那正好！今天古·拉哈就留下來跟我們一起看家吧。」

      　　小紅貓猛地轉頭，一臉緊張地盯著塔塔露。

      　　「你現在這樣也不方便出門呀。」塔塔露語氣溫柔，完全沒注意到牠瞬間僵硬的尾巴，「放心，我會好好照顧你的。」

      　　小紅貓沉默了一會。

      　　下一刻，牠突然轉身往光的方向衝去，爪子抓過石地的聲音急促地傳了出來。
      　　
      　　一陣紅光竄過。
      　　
      　　光低下頭，小紅貓已經緊緊貼在他腿邊，蓬鬆的腦袋仰頭望著他，一雙可憐兮兮的瞳孔放得又大又圓，幾乎把原本的紅眼擠得只剩薄薄一圈。
      　　
      　　雖然說怎麼樣都不可能帶一隻貓出門戰鬥，但畢竟是自己弄回來的藥水，光也有些不忍心。更別提昨晚古·拉哈·提亞才親口對自己說他有多期待這次的旅行。
      　　
      　　他默默往前踏一步，小紅貓也跟著往前，在他靴子旁邊來來回回打轉，長長的尾巴很努力地纏著光的小腿，也不管自己會不會被腳步踢到。
      　　
      　　光只能蹲下身，想嘗試說服他。
      　　
      　　但小紅貓立刻抬起前腳，用後腳努力站了起來，頭用力地撞了下光伸出的手，眼神裡全是無法明說的期盼與哀求。
      　　
      　　「……」
      　　
      　　光摀住臉，對桑克瑞德搖了搖頭。
      　　
      　　「我不行了，我沒辦法。」他聲音含糊地說，「就照原定計劃吧。」
      　　
      　　桑克瑞德的眉頭抖了抖，大大嘆了口氣。
      　　
      　　「好險這次的任務倒也不怎麼危險……就多帶幾瓶藥水吧。」
      　　
      　　他嘟囔道，與艾斯蒂尼安交換了眼神。
      　　
      　　後者皺起眉，長槍用力掃了下光的手臂。
      　　
      　　「藥水你背，別塞我包裡。」
      　　
      　　「你根本就沒帶背包吧！」
      　　
      　　於是就這麼定了。
      　　
      　　小紅貓整張臉總算是重新亮了起來。

      　　牠的觸鬚有精神地豎著，猛地站起身，前爪朝光的方向伸去。

      　　「喵！」

      　　下一刻，銳利的爪子已經牢牢勾住光的褲管，不等他反應過來，那團紅毛便開始往上爬。

      　　踩過大腿、扒住腰帶，順著披風一路往肩膀攀。

      　　光不得不抬手護了一下，免得牠真的從背後翻下去。

      　　一番折騰後，小紅貓已經穩穩趴在光的肩膀上，兩隻前爪緊緊圈著他的頸側，胸口貼著肩甲，整隻貓幾乎黏在他身上。

      　　光被那股熱呼呼又毛茸茸的身軀壓得微微偏了偏頭。

      　　「……你是不是比看起來重？」

      　　小紅貓沒有回應，只是低下頭，用臉頰慢吞吞地蹭了一下他的耳側，尾巴很輕地在光的背後晃了晃。

      　　阿莉塞看得一臉複雜。

      　　「這傢伙變成貓以後是不是更會撒嬌了？還是故意靠光這麼近？」

      　　阿爾菲諾思考了一下。

      　　「我認為只是更難掩飾。」

      　　小紅貓立刻將視線望向遠方，當作沒聽見。
      　　
      　　見他們總算準備好，桑克瑞德連忙伸出手，將一人一貓往外推去。

      　　「走了走了，再待下去今天就不用出發了。」
  - title: 第二章
    body: |-
      　　三人一貓趕路至正午，尋了處背風的林地升火歇息，順道解決午餐。

      　　帶油脂的肉排落入平底鍋，頓時煎得滋滋作響。光正打算從行囊裡翻出調味料，一轉身，便瞧見腳邊早已端坐著那抹毛茸茸的身影。

      　　小紅貓看似規規矩矩地在一旁坐著等待，濕潤的鼻子卻忍不住頻頻抽動，嗅著空氣中濃郁的肉香，連帶兩側的鬍鬚都跟著微微輕顫。那雙圓溜溜的紅眼睛直勾勾盯著光手裡的鍋鏟，亮得令人無法忽視。

      　　「好好好，怎麼可能忘了你。」

      　　光想了想，將拿出的香料先擱在一旁，隨後單獨分了一份完全不加鹽與香料的肉排。待起鍋後，他仔細用小刀切成適口的丁塊，盛在盤中稍作放涼。

      　　桑克瑞德在一旁看得目瞪口呆。

      　　「你是不是被調包了？」他一臉難以置信地嚷道，「以前分給我們的料理都隨便得要命，有時鹽巴還下得不曉得想鹹死誰，結果原來是能這麼細心處理的嗎！」

      　　靠在樹幹旁一邊等開飯、一邊拿著工具打磨槍尖的艾斯蒂尼安，頭也不抬地涼涼反駁。

      　　「那是對你隨便，對另一位可沒有。」

      　　「喂，說得好像你分到的有多好。」

      　　光沒搭理兩人的日常拌嘴，他端著那盤溫度剛好的肉塊，低頭看著滿地碎石枯枝，眉頭微微蹙起。

      　　桑克瑞德見他站在原地盯著地面發愣，又忍不住出聲。
      　　
      　　「只能放著吧，頂多拿片葉子墊著？」

      　　光抬起眼，臉上的神情認真又嚴肅。

      　　「放地上會沾灰。」

      　　「牠現在就是一隻貓的高度，不放低一點怎麼吃。」桑克瑞德揉了揉發疼的太陽穴。

      　　「是貓也是拉哈。」

      　　光答得理所當然，語氣裡沒有半點妥協的意思。

      　　桑克瑞德張了張嘴，一口氣結結實實卡在喉嚨裡，最後只能認命地把話吞回肚子，扭開自己的水壺猛灌了一口。

      　　艾斯蒂尼安依然專注於手中的長槍，平靜地補了一刀：「你跟他爭這個做什麼。」

      　　「……我只是覺得這支隊伍裡總得有個人保有基本的常識。」

      　　最後，那個小盤子自然是沒沾上地面的泥沙。

      　　光挑了塊相對平整的石塊坐定，伸手把腳邊的貓撈了起來，穩穩放在自己的大腿上。

      　　小紅貓兩隻粉嫩的前爪拘謹地勾起，隨後並攏踩在光的皮褲上，背脊挺得筆直，似乎還難以在人類與貓的生活方式間取得平衡。

      　　光用指尖拿起一小塊溫熱的肉丁，遞到牠唇邊。

      　　小紅貓貌似有點害羞，僵著沒張嘴，鼻子卻極其誠實地動了兩下。

      　　光見狀，又往前輕輕遞了一點。
      　　
      　　小紅貓在原地天貓交戰了片刻，終於矜持地微張開嘴，小心避開光的指尖，輕巧地把肉叼了過去。

      　　第一塊牠吃得克制又斯文，嚥下第二塊後，粉色的舌頭便忍不住開始舔舐嘴角。等到光遞出第三塊時，那條毛茸茸的紅色長尾巴已經悄無聲息地纏上了光的手腕，親暱地繞了半圈。

      　　光低頭安靜地看著牠吃，見那毛茸茸的嘴邊不小心沾上肉汁，他便順手用拇指指腹替牠擦拭乾淨。
      　　
      　　「原來養寵物是這種感覺。」還挺新鮮的，光忍不住笑道。

      　　小紅貓耳朵猛地往後一壓，嘴裡還塞著肉，當即發出抗議的聲音。
      　　
      　　「嗚！」

      　　「知道了知道了。」光忍不住又彎了彎嘴角，「只是比喻一下嘛。」

      　　說著，光伸出另一隻手托向小紅貓的後半身，打算替牠換個稍微放鬆一點的趴姿。然而掌心才剛往後腿的間隙一摸，指腹隔著軟毛傳來的某種奇妙觸感，卻讓他的動作突然定住了。

      　　「……嗯？」

      　　光微微挑起了眉。

      　　腿上那團毛茸茸的身軀也因為突然被觸及敏感的部位，整隻貓瞬間像石化一般，動彈不得。

      　　光低頭、小紅貓僵硬地仰頭，一人一貓在沉默無聲的對視中僵持了幾秒。

      　　光思索了會，像是為了印證某個突如其來的猜想，忽然伸出雙手，從腋下抱住毛茸茸的身軀，一把將牠高高舉了起來。

      　　「喵？！」

      　　四隻爪子頓時無處著力地懸在半空，小紅貓發出了一聲短促而慌亂的驚叫。

      　　光將牠舉到與自己平視的眼前，手腕輕巧地轉了半圈，把小紅貓的後方轉向了自己。

      　　小紅貓懸空的尾巴猛地一直。

      　　下一秒，牠像是終於明白身後的人到底想確認什麼，以觸電般驚人的速度將長尾巴死死夾進了兩條後腿中間。

      　　「……」

      　　光神色平靜，目光認真地盯著牠防守嚴密的屁股看了半晌。

      　　小紅貓的瞳孔瞬間張成一片黑夜，眼神從原本的茫然，迅速轉為極度的羞憤與驚恐。牠開始用力扭動四肢，前爪胡亂在空氣中揮舞，後腿也像兔子般奮力踢蹬、用盡全力掙扎。
      　　
      　　「喵！喵嗷！」
      　　
      　　牠的抗議卻徒勞無功，因為光已經看見了他剛才摸到的軟肉是什麼。
      　　
      　　「原來是蛋蛋啊，」他若有所思道，「怪不得觸感那麼奇怪。」

      　　「噗──咳咳咳咳咳！」

      　　一旁，桑克瑞德剛喝進嘴裡的水毫無防備地全數噴灑而出，就連艾斯蒂尼安磨槍的動作都硬生生剎住。

      　　空氣中只剩下被水嗆到的劇烈咳嗽聲。

      　　「咳、咳咳！你這傢伙──」桑克瑞德咳得滿臉通紅，抹著嘴巴崩潰地大喊，「你無緣無故突然去看那種地方幹什麼？！」

      　　光依然保持著舉貓的姿勢，臉不紅氣不喘地坦蕩回答：「剛才抱牠換姿勢的時候摸到了。」

      　　「摸到就給我道歉啊！還特地舉起來看！」

      　　懸空的小紅貓整張臉徹底死絕了。

      　　牠的耳朵緊緊貼著腦門，壓成了扁平的飛機耳。倘若此刻還是人形，恐怕從臉頰早就紅得足以滴出血來。

      　　光眨了眨眼，看著手裡那團快要冒煙的紅色毛球。
      　　
      　　「拉哈？」

      　　「……嗚。」喉嚨深處擠出一聲細若游絲的悲鳴。

      　　「害羞了？」

      　　「嗚……嗷！」

      　　小紅貓像是被戳中最後的死穴，爆發出全身力氣在空中劇烈扭騰。光怕摔著牠，最後只得依著牠的掙扎，將這顆滑得驚人的毛球重新擱回自己腿上。

      　　爪子一觸及他的腿，小紅貓立刻俐落地原地旋轉半圈，以一個圓滾滾的後腦勺和繃得死緊的背脊對著光。整隻貓緊縮成團，尾巴牢牢盤在身下，全身上下每一根紅色軟毛都在散發著拒絕交流的氣場。

      　　光忍耐了幾秒，還是伸出食指，輕輕戳了戳牠圓潤的脊背。

      　　沒動靜，毫不領情。

      　　他又順著毛撫了一下。

      　　啪的一聲脆響，毛茸茸的前掌極其不悅地揮出貓拳，但即使如此，小紅貓依然沒有伸出爪子，只是用熱呼呼的肉墊拍開光的手指。

      　　光憋著笑，只得重新拿起裝肉的小盤子，挑了一塊火候最完美的焦香肉丁，湊到了牠側臉邊。

      　　肉香再次縈繞在鼻端。

      　　小紅貓壓低的耳朵微微動了動。牠斜著眼睛，目光沉痛地死死盯著那塊肉，在憤然絕食與光的餵食間劇烈拉扯，足足僵持了好幾秒鐘。

      　　最後，牠還是悲壯地低下了頭，一口把肉叼進了嘴裡，慢吞吞地嚼了起來。

      　　對面，桑克瑞德默默抹掉臉上的水痕，面無表情地把水壺扔到角落敞開的背包裡。
  - title: 第三章
    body: |-
      　　一夥人披著午後的陽光在樹林中搜尋。

      　　前方的灌木叢猛然傳來枝葉折斷的聲響，伴隨著刺耳的嘶吼，數隻在林中盤踞的魔獸自陰影處現身，泛著血光的豎長獸瞳鎖定闖入領地的幾人。

      　　光眼神一凜，手掌在聽見動靜的瞬間就搭上武器的握柄，錯開的腳步隨時做好突進的準備。

      　　而就在他預備動作的瞬間，原本一直老實趴在他肩頭的小紅貓也跟著豎起耳朵。

      　　按照以往的默契，在光踏入敵陣的前一刻，若自己位於隊伍中治療者的位置，就會在第一時間先上一層持續治療的術法。然而，現在的牠就算舉著前爪，也無法驅使任何乙太，溫暖的治癒之風也不可能出現。

      　　小紅貓極其緩慢地低下頭，默默翻過自己的兩隻前爪，盯著兩片柔軟卻毫無戰鬥用處的肉墊看。

      　　「……」

      　　察覺到肩頭動靜的光頓時停下了衝勢，他低頭看了一眼肩上明顯有些失落的毛球，無奈地捏了捏牠後頸蓬鬆的軟毛。

      　　「肩上待好，別想些多餘的事。」

      　　光說得無比直接，隨即把牠的兩隻舉起的前爪往自己的皮甲邊緣攏了攏。

      　　被這麼一說，小紅貓的耳朵徹底垂了下去，牠趴在肩甲上，一動也不動。
      　　
      　　理智上，古·拉哈·提亞完全理解光的判斷，就憑兩隻貓爪再怎麼樣都不可能搓出再生術，但情感上，眼看光即將進入戰鬥，自己卻連最基本的輔助都做不到，實在讓人感到喪氣。

      　　牠頹喪地將整顆毛茸茸的腦袋埋進光的頸窩，圓滾滾的背影繃得死緊，整隻貓看起來委屈得快要化成一灘水。

      　　光單手拔出武器，感受著頸邊傳來的沉重與低落，在原地沉默了兩秒。

      　　「……不要露出那種表情。」

      　　沒有反應，只有尾巴尖微弱地拍打了一下。

      　　「我不是嫌棄你。」

      　　即使這麼解釋，小紅貓還是把臉死死埋在光的披風褶皺裡，喉嚨深處甚至溢出了一聲微弱的嗚咽，看起來低落得不得了。

      　　前方的魔獸發出暴躁的咆哮，艾斯蒂尼安已然持槍躍起牽制住其中一頭。光卻在真正迎擊之前，將劍重新插回劍鞘，無奈又溫柔地將肩上那團自閉的紅毛撈了起來，重新抱進了懷裡。

      　　「再忍耐一下。」

      　　光抬起手指，極其輕柔地搓了搓小紅貓低垂的耳尖。

      　　「雅·修朵拉不是說了嗎，藥水效果應該一天就會退了。」

      　　懷裡的小紅貓聞聲微顫了一下，這才慢吞吞地抬起頭，那雙泛著水光的紅眼睛滿是不甘地望著光。

      　　光迎著牠的視線，低下頭，將自己的額頭抵在牠毛茸茸的腦門上，輕輕碰了碰。

      　　「等你變回來還有很多場戰鬥，我會等你。」

      　　額頭相觸的溫度真切而溫暖。

      　　小紅貓怔了怔，原本死死夾在身後的紅色長尾巴，悄悄地、一節一節重新翹了起來。

      　　最後，尾巴尖輕巧地勾住了光的手腕，像是用拇指打勾一般，下了一記鄭重的約定。

      　　一旁早就拔出槍刃、隨手格擋開魔獸爪擊的桑克瑞德，眼角劇烈地抽搐了兩下。

      　　「……我說那邊卿卿我我的兩位，到底好了沒有？」

      　　光俐落地將小紅貓放回肩上，反手抽出了武器，眼神重新變得銳利。
      　　
      　　「好了。」

      　　小紅貓一爪緊緊扒穩光的皮甲，挺直胸膛，極具氣勢地高舉另一隻肉球附和。

      　　「喵！」

      　　桑克瑞德面無表情地踢翻面前的一頭魔獸，長長嘆了口氣。

      　　「就該留這傢伙在家嚕貓，沒事抓他出來幹嘛。」

      　　「我就說要找阿爾菲諾。」
      　　
      　　艾斯蒂尼安利落地揮槍，連頭都懶得回。

      　　這一次，連桑克瑞德也沒辦法幫光說話了。
  - title: 第四章
    body: |-
      　　夜幕降臨，一行人在山谷的岩壁下紮了營。
      　　
      　　林間的喧囂隨著日落沉寂下來，只剩篝火劈啪作響，然而今晚的營地，卻比以往都要安靜得多──更準確地說，是那抹平日最活潑的紅色身影，忽然安靜得有些反常。
      　　
      　　第一班守夜的桑克瑞德正靠在樹樁整理著晶壤，艾斯蒂尼安則早早鑽進了自己的睡袋。光在帳篷前鋪平厚毯，拍落上面的碎屑，回頭才注意到不遠處那個孤零零的毛團。
      　　
      　　小紅貓沒有像白天那樣黏上來，只是端端正正地蹲坐在帳篷角落的陰影裡，安靜地看著光的背影。
      　　
      　　一人一貓在昏黃的火光中無聲對視了片刻。
      　　
      　　光在鋪好的睡毯邊坐下，抬手拍了拍身側空出來的位置。
      　　
      　　「拉哈？怎麼了，不過來嗎？」
      　　
      　　小紅貓的耳尖輕輕動了一下，卻沒有像早上那樣立刻小跑過來。牠極其緩慢地垂下腦袋，看了看自己沾著些許草屑的四隻肉爪，又看了看自己這一身厚重蓬鬆、在野外滾了一天的紅毛。
      　　
      　　沉默了幾秒，牠才邁開腳步走上前。
      　　
      　　然而走到睡鋪邊緣時，牠卻自覺地停了下來，轉身走向旁邊一塊光隨手放在石頭上的粗布巾，默默用爪子踩了踩，蜷縮起身子打算就這麼窩在上面。
      　　
      　　光看著牠這副顧慮的模樣，有些無奈地嘆了口氣。
      　　
      　　他直接傾身向前，長臂一攬，不由分說地把貓一把撈了起來，穩穩抱到了厚實溫暖的毯子上。
      　　
      　　「有什麼好猶豫的，一起睡又沒關係。」光認真地注視著牠，語氣裡滿是不容拒絕的溫和，「我睡相沒那麼差，會小心不壓到你的。」
      　　
      　　聽到這句話，小紅貓那雙圓溜溜的紅眼睛睜大，原本垂著的長尾巴總算精神地重新豎立起來，尖端甚至高興地微微顫動。
      　　
      　　光將牠抱進懷裡，順勢盤腿坐定，寬大的手掌覆上了小紅貓的頭頂，粗糙卻溫暖的拇指指腹順著那對尖尖的毛耳朵根部細細揉捏，隨後手掌下移，沿著背脊一路緩緩梳理下去，將凌亂的紅毛撫得平平整整。
      　　
      　　小紅貓舒服得瞇起了眼睛，下巴不自覺地往光的掌心裡拱。
      　　
      　　光望著眼前跳躍不定的暖色篝火，夜風吹過林梢，帶來一陣空曠的沙沙聲。
      　　
      　　「真安靜啊。」他低聲輕嘆了一句。
      　　
      　　以往野營的夜晚，古·拉哈·提亞總有說不完的話。他會就著星光攤開地圖，興致勃勃地跟光比劃明天的路線，或是認真地復盤白天戰鬥中驚險的細節，待話題盡畢，光還是想聽他的聲音，便會任性地從行囊底層翻出各式樂器硬塞進他手裡，非要他唱歌給自己聽。
      　　
      　　貓魅雖然每次都會臉紅著推脫兩句，最後卻總會抱著琴，用那副清澈溫柔的嗓音唱到夜深。
      　　
      　　光垂下眼簾，看著懷裡那一團安靜的紅色毛球，唇角不自覺地漾開一抹笑意。
      　　
      　　「雖然偶爾這樣也挺新鮮……」光屈起手指，搔了搔牠軟乎乎的下巴，「不過，果然還是懷念你陪我說話的時候。」
      　　
      　　仰著頭的小紅貓身子微微一頓。
      　　
      　　牠定定地望著光的眼睛，那雙紅寶石般的瞳孔裡倒映著整片火光與夜空，片刻後，牠迎上光的視線，以一種極其緩慢的速度，輕輕眨了一下眼睛。
      　　
      　　光愣了愣，隨即低聲笑了出來。他曾聽說過，在貓的語言裡，這樣緩慢的眨眼是全然的信任與愛意。
      　　
      　　「知道啦。」光眼底的笑意化開，低頭湊近牠耳邊，「我也愛你。」
      　　
      　　小紅貓的耳尖唰地一下紅透了，雖然隔著毛看不出來，但牠顯然害羞得不行，急忙轉過頭去，用溫熱毛茸茸的側臉用力蹭著光的手掌，喉間溢出一聲含糊的軟哼。
      　　
      　　夜色漸深，篝火的火勢漸漸弱了下去。
      　　
      　　光抱著牠順勢躺進了睡毯裡，拉起厚實的斗篷充當被褥，一同仰望著林隙間灑落的漫天星斗。
      　　
      　　平時這個時候，兩人總是習慣摟抱在一起入睡，然而現在的身形顯然讓小紅貓有些困擾。
      　　
      　　牠在光的枕邊和胸口周圍轉了好幾圈，踩踩這裡、嗅嗅那裡，怎麼躺都覺得不對勁。最後，牠索性邁著小碎步爬到了光的肩膀旁，一頭扎進光的頸窩處。
      　　
      　　牠毛茸茸的身軀往那處溫熱的凹陷裡擠了擠，硬是將自己卡在光的下頜與鎖骨之間，長長的尾巴繞了半圈，溫柔地搭在光的側頸上，像是平常擁著他的手臂一般。
      　　
      　　那股微小的體溫緊緊貼著跳動的脈搏，光失笑，抬起手撫摸著牠後背柔軟的絨毛。
      　　
      　　忽然，一陣極其微弱卻持續不斷的呼嚕聲，自頸窩處悶悶地傳了出來。
      　　
      　　光眨了眨眼。
      　　
      　　他聽塔塔露說過，這是貓咪感到極致放鬆、無比幸福時才會發出的聲音，意識到這一點，他的手指也跟著放輕了力道。
      　　
      　　寬大的掌心順著牠的脊椎一路向下，滑到了小紅貓最為脆弱柔軟的胸口與下腹，輕輕撫弄著。被摸得極度舒適的小紅貓完全沒有任何防備與抗拒，喉嚨裡的呼嚕聲愈發響亮，甚至十分放鬆地在光的懷裡側翻過身子，坦率地露出了柔軟的肚皮，任由光的手指陷進更深、更細密的軟毛裡。
      　　
      　　光輕輕靠在牠的毛腦袋上，閉上眼睛。
      　　
      　　「晚安，拉哈。」
      　　
      　　「嗚……」小紅貓從鼻腔裡擠出一聲黏糊糊的應答，前爪下意識地張開又縮起、彷彿幼貓一般，在空氣中踩了兩下虛擬的奶。
      　　
      　　光帶著笑意，指腹慢條斯理地撓著牠微熱的肚子，感受著掌心下平緩起伏的呼吸。
      　　
      　　然而撓著撓著，光的指尖卻突然摸到異樣的觸感。
      　　
      　　在厚實柔軟的底絨下方，似乎隱藏著幾個極小、整齊排列成兩列的小硬點，一路自胸口延伸至下腹，摸起來彷彿是結痂的傷口。
      　　
      　　光猛地睜開眼，眉頭微微蹙起。
      　　
      　　一想到可能是自己未知的傷口，光頓時緊張起來，立刻伸出手，小心翼翼地把正迷迷糊糊打著呼嚕的小紅貓翻了個面，讓牠肚皮朝天、完全攤開在毯子上。
      　　
      　　「喵……？」小紅貓睡眼惺忪地半睜開眼，有些茫然地踢了踢腿。
      　　
      　　光一臉嚴肅，動作極其認真地撥開了腹部那些細密厚實的紅毛，湊近了視線，藉著殘存的微弱火光仔細端詳。
      　　
      　　指尖在那些整整齊齊的小硬點上輕輕按了按。
      　　
      　　下一瞬，光緊鎖的眉頭倏地鬆開，臉上露出了恍然大悟的放鬆神情。
      　　
      　　「原來是長在這種地方啊。」他放鬆地呼了口氣，認真說出自己的推論。
      　　
      　　「拉哈，這個排列……應該就是你的乳──」
      　　
      　　「喵嗷────！！！」
      　　
      　　一聲劃破寂靜夜空的尖聲抗議，震得林間的鳥紛紛飛起。
      　　
      　　小紅貓渾身的毛炸成了原本的三倍大，兩隻後爪以兔蹬的力道狠狠踹向光的掌心，整隻貓化作一道猩紅的閃電，連滾帶爬地一頭撞進了睡毯最深處的褶皺裡，死死把自己埋了進去，連尾巴都沒留給他。
      　　
      　　不遠處，剛要陷入熟睡的艾斯蒂尼安猛地翻身坐起，長槍瞬間落入手中，神情冷厲如霜：「有敵襲？！」
      　　
      　　另一邊的桑克瑞德痛苦地捂住臉，發出了一聲飽含滄桑的長嘆。
      　　
      　　「……再不睡我看不會有人跟我換班了。」
  - title: 終章
    body: |-
      　　清晨，光是被熱醒的。
      　　
      　　那股熱源並非來自早已熄滅的營火，也不是穿透林隙的朝陽，而是有人結結實實地緊抱著他。
      　　
      　　光迷糊地動了動眼皮，微弱的光線刺得他慢吞吞地眨了眨眼，前方是他無比熟悉的紅色髮絲，隨著微弱的呼吸輕輕起伏，還有一張近得不能再近的睡臉。
      　　
      　　古·拉哈·提亞已經變回來了。
      　　
      　　熟睡的他雙臂牢牢環扣在光的腰後，整顆腦袋幾乎深埋進光的鎖骨與頸窩之間，雙腿因側睡的緣故，毫不客氣地夾著光的腿，順帶將尾巴也搭上他的腳踝。
      　　
      　　光維持著仰躺的姿勢，眨了眨逐漸清醒的眼，隨後視線順著對方的肩頸往下挪。
      　　
      　　「……」
      　　
      　　果然，由小紅貓恢復原狀的青年身上什麼都沒穿。
      　　
      　　用來充當被褥的斗篷，經過了整夜早就滑落到了腰際，他勻稱的身軀就這麼貼著自己，背脊、腰線、修長的四肢全都毫無遮蔽。
      　　
      　　難怪這麼燙。
      　　
      　　光又陷入了一陣微妙的沉默。
      　　
      　　沒過多久，沉睡的貓魅青年睫毛微微動了動，發出了一聲模糊低軟的鼻音。
      　　
      　　「……唔。」
      　　
      　　古·拉哈·提亞半夢半醒間察覺到了懷裡的動靜，下意識收緊了環在光腰上的手臂，臉頰在光的頸窩裡習慣性地蹭了幾下。
      　　
      　　「光……」
      　　
      　　沙啞的夢話說到一半，古·拉哈·提亞的意識驟然回籠。
      　　
      　　他緩緩睜開眼，看見了光帶著戲謔笑意的眼眸，目光凝滯了會，隨後往下飄，看見自己正光溜溜地騎在光身上。
      　　
      　　又是一陣死寂般的停頓。
      　　
      　　光語調極其平靜地開口打破沉默。
      　　
      　　「早安，拉哈。」
      　　
      　　下一瞬，古·拉哈·提亞整張臉以肉眼可見的速度轟地炸紅，那抹顏色迅速蔓延過臉頰、脖頸，一路燒到頭頂那對猛然豎起的耳朵。
      　　
      　　「我──」
      　　
      　　他發出一聲驚嚇的抽氣，連滾帶爬地抓起滑落在旁的被毯，手忙腳亂地往自己身上一裹，將整個人嚴嚴實實包成了一球。
      　　
      　　「等等、光，這、這不是你想的那樣──！」
      　　
      　　「沒事，我很歡迎你夜襲。」
      　　
      　　光雙手墊在腦後，神情自若。
      　　
      　　「就說了不是！昨、昨日那瓶藥的效果應該是在睡夢中解除了，我睡著了沒發現，也來不及找衣服穿──」
      　　
      　　「嗯。」
      　　
      　　「而、而且我並不是故意要纏著你抱那麼緊的！我只是習慣了，那是身體本能，我──」
      　　
      　　「拉哈。」
      　　
      　　「是、是！」被叫到名字的貓魅青年瞬間繃直了身軀，只在被子邊緣露出一雙驚慌失措的紅眼睛。
      　　
      　　光看著那對因羞恥而壓得極低、幾乎快要貼平頭頂的貓耳，眼底泛起難以自抑的笑意。
      　　
      　　「我知道你不是故意的，」光慢條斯理地撐起上半身，靠近那團被子，「畢竟昨晚在我脖子旁邊呼嚕了一整夜的貓，聲音可大得很，睡那麼熟也不可能起來穿衣服吧。」
      　　
      　　被子猛地抖了一下。
      　　
      　　光挑了挑眉，壞心眼地補了一句：「況且……該看的不該看的，昨天不都已經看過了嗎？從肚子到蛋──」
      　　
      　　「……別再提了！」
      　　
      　　「再說昨天我可是一路抱著你、全身都摸透了。」光舉起雙手，指尖還意猶未盡地抓握了兩下，「昨晚讓你占點便宜抱著睡，算起來還是我比較大方吧？」
      　　
      　　「………光。」
      　　
      　　被子深處傳來的聲音既羞憤又虛弱，像極了一聲快要窒息的悶哼。
      　　
      　　「嗯？」
      　　
      　　「我都不知道你居然這麼無賴……」
      　　
      　　光隔著布料，順手揉了揉那顆拱成一團的腦袋。
      　　
      　　果然還是這個手感最習慣。他心情極佳地勾起唇角，痞痞地輕笑一聲。
      　　
      　　「沒錯，而且只對你無賴。」
      　　
      　　「……」
      　　
      　　空氣陷入了一段漫長的安靜。過了良久，那團被子才極其緩慢地挪動了一下，古·拉哈·提亞小心翼翼地從邊緣露出了半張臉。
      　　
      　　雖然臉頰和鼻尖依舊紅得透徹，但他看著光的眼神卻軟了下來，像是始終拿這人毫無辦法。
      　　
      　　那雙紅寶石般的眼眸透著無奈，在晨光中泛起溫潤的微光。
      　　
      　　「那……」古·拉哈·提亞微不可察地垂下眼，聲音輕得像呢喃，「昨晚……有睡好嗎？我有沒有吵到你？」
      　　
      　　光認真思索了半秒。
      　　
      　　「很好，很暖和。」他煞有其事地補了一句：「就是稍微重了點。」
      　　
      　　「光──！」
      　　
      　　正當古·拉哈·提亞準備拿枕頭砸過去時，帳篷外頭忽然傳來了桑克瑞德帶著哈欠的說話聲。
      　　
      　　「喂，你們兩個醒了沒有？今天總算可以回歸正常的冒險行程了，我可不想再看一整天──」
      　　
      　　話音未落，帳篷的布簾被唰地一聲掀開了一角。
      　　
      　　桑克瑞德探進頭來，後方跟著雙手抱胸的龍騎士。
      　　
      　　第一眼，看見了坐在睡鋪上的光。
      　　
      　　第二眼，看見了裹著薄毯、露著整截肩膀與鎖骨、正死死抓住被角滿臉通紅的古·拉哈·提亞。
      　　
      　　空氣在這一瞬間徹底凍結，連呼吸聲都聽不見。
      　　
      　　三個人大眼瞪小眼，僵持了一會。
      　　
      　　桑克瑞德臉上的肌肉抽動了一下，隨後極其鎮定、甚至帶有一種超然脫俗的平靜，緩緩地把手裡的布簾重新放了下來。
      　　
      　　「……沒事，你們繼續。我們倆就先出發了。」
      　　
      　　帳篷外隨即傳來了他們踩著碎石腳步聲，隱約還伴隨著低聲嘆氣或相互拍背的聲音。
      　　
      　　古·拉哈·提亞發出一聲絕望的哀嚎，整張臉重新埋進了被子裡，縮成一團再也不肯出來。
      　　
      　　光坐在原地愣了兩秒，嘴角終於不可遏制地上揚，最後實在沒忍住，伏在膝蓋上低低地笑出了聲。
      　　
      　　被子裡立刻傳來貓魅青年悶悶的抗議。
      　　
      　　「不要笑啊！」
      　　
      　　「嗯，不笑了。」
      　　
      　　「你的肩膀都在抖！」
      　　
      　　光笑意未減，伸手一撈，逕自連人帶被子一把緊緊抱進了懷裡。
      　　
      　　被子裡掙扎的力道頓時停了下來。
      　　
      　　短暫的沉默後，一截泛著薄紅的手臂慢吞吞地從被角裡探了出來，微涼的指尖猶豫了片刻，最終還是順從地攀上光的後背。
      　　
      　　就在古·拉哈·提亞稍稍放鬆下來、將額頭輕輕靠在光的頸窩時，身旁的英雄忽然低下頭，溫熱的呼吸壞心眼地拂過那隻敏感的耳朵，極其輕快地低語了一句。
      　　
      　　「對了，拉哈。」
      　　
      　　「……嗯？」
      　　
      　　「昨天走得太急，我好像……忘記把你的衣服塞進行李了。」
      　　
      　　懷裡的身軀猛然一僵。
      　　
      　　下一秒，一聲響徹整座山谷的崩潰吶喊再次毫無預兆地穿透了晨曦。
