  - title: 序章
    body: |-
      　　空曠的迴廊裡，迴響著沉重而急促的腳步聲。

      　　英雄手中緊握著吸魂晶，晶體散發出溫暖的光輝，為他開啟一扇又一扇唯有亞拉戈皇族才有資格通過的大門。他穿越長廊，從寬闊的大廳旁奔跑而過，隨著他越來越深入水晶塔，往事也一點一點浮上心頭。

      　　這段路，在過去探索水晶塔時，他曾與諾亞調查團的夥伴一同走過一次，在第一世界追趕艾里迪布斯時，他也曾與卸下兜帽的水晶公一同奔跑過一次。

      　　那雙始終注視著自己的眼睛，橫跨了兩個世界與百年的歲月，終於在重逢之後，添上了更多他後知後覺才明白的情緒。

      　　在諾亞調查團時，他還只是個初出茅廬的冒險者，古·拉哈·提亞也只是個充滿熱情、好奇與聰慧的薩雷安賢人。那時的他們一同面對亞拉戈時代留下的謎團，曾並肩戰鬥，也曾在夜裡就著篝火談論遺跡、未來，以及那些等待他們去探索的千年謎團。

      　　那時的古·拉哈·提亞有一雙漂亮的異色眼睛。

      　　每當提起自己的身世之謎，或是談起水晶塔深處仍未解開的秘密時，那雙眼睛總是亮得驚人，神采奕奕，映著火光，也映著尚未熄滅的夢。

      　　那時的光，總以為那樣的光芒只是源於他對古代謎團的熱情，所以即使他曾注意到，到了旅程末期，古·拉哈·提亞投注在自己身上的視線似乎越來越頻繁，越來越難以輕易移開，他也始終沒有細想心中那股異樣的感覺究竟是什麼。

      　　尚未萌芽的感情，就這樣在懵懂之間，隨著貓魅賢人陷入沉睡，與水晶塔一同被封印在漫長的時間裡。

      　　光只是沒有想到，這份本該停留在過去的感情，會隨著第一世界水晶塔的甦醒，再度擁有重見天日的可能。

      　　水晶公經過百年的孤寂，在計畫完成的最後一刻，才終於鼓起勇氣，將那份感情告訴了他。

      　　而光在給予回應之後，卻又再一次目送他被水晶化侵蝕，留在第一世界的水晶塔頂，永遠守望著他的人民。

      　　想起水晶化的身影，胸口就緊得發疼。

      　　光握著吸魂晶，停在最後一扇門前。

      　　只要走進去。

      　　只要將吸魂晶放在沉睡的古·拉哈·提亞身旁，水晶公就會回來。

      　　這本該是沒有什麼好猶豫的事，光從第一世界帶回了他的靈魂，帶回了他的記憶，也帶回了他未能完成的願望。光的心底同樣期盼著，自己能與甦醒過來的古·拉哈·提亞一同踏上未來的冒險。

      　　可是此刻，他的腳卻像被釘在原地。

      　　因為他也沒有忘記，水晶公在水晶都獨自度過的那一百年。

      　　那不是一個可以被輕易說出口的數字。

      　　那是一百年的等待，一百年的策劃，一百年的殫精竭慮。一百年裡，他幫新生的嬰孩取名，陪伴他們老去，再目送他們離去，看著世界被無盡的光逐漸吞噬，也注視著被召喚而來的光踏上旅途，並在黑暗中靜靜倒數著自己完成使命的時間。

      　　這些也要交給古·拉哈·提亞嗎？

      　　交給那個此刻還沉睡在塔中的、年輕的古·拉哈·提亞？

      　　光閉上眼，緊握著的吸魂晶壓得掌心發疼。

      　　他想起過去的諾亞調查團，想起自己曾與古·拉哈·提亞閒聊未來、謎團，還有許多許多未知的冒險。那時候的古·拉哈·提亞還沒有經歷第八靈災，沒有見過人們為了活下去而無止盡地爭鬥，也沒有踏上跨越時空的艱辛旅途。

      　　他還沒有成為水晶塔的終端。

      　　還沒有承受身體逐漸被水晶侵蝕的痛楚。

      　　還沒有被迫驅使魔法，讓自己看起來像個正常人一樣活著。

      　　也還沒有成為水晶都人民的指引，將所有疲憊、恐懼與孤獨都藏在溫和穩重的聲音之下。

      　　如果只是要實現願望──

      　　如果只是想和古·拉哈·提亞一同踏上旅途──

      　　那些痛苦，真的必須還給他嗎？

      　　光低頭看著掌心裡的吸魂晶。

      　　那裡面有水晶公。

      　　有他愛的人。

      　　可是那裡面也有太多傷痛。

      　　那不是一段可以被輕易歸還的記憶，而是一百年的孤寂、犧牲、等待與瀕臨崩毀的執念。水晶公曾經承受過一次，難道如今的古·拉哈·提亞還要再承受一次嗎？

      　　光咬緊牙，指節因用力而泛白。
      　　
      　　百年帶來的影響太過巨大，儘管他依然對冒險充滿熱情，但已經學會壓抑，就算從不放棄對未來追尋的希望，追逐的腳步卻也不再輕盈。
      　　
      　　他已經獨自背負了太多，現在好不容易有機會遺忘這一切，即使除了痛苦的過去，他也會遺忘對自己的感情──

      　　許久之後，光終於慢慢後退了一步。

      　　然後是第二步。

      　　光轉過身，帶著那枚本該交還的吸魂晶，逃離了水晶塔深處。

      　　他的腳步過於倉促，心緒也過於混亂，以至於完全沒有發現，在他離去之後，身後那扇沉寂已久的門，因吸魂晶殘留的光芒而微微震動。

      　　片刻之後，門縫間滲出淡淡的輝光。

      　　那扇門緩緩打開了。

      　　而水晶塔深處，原本沉睡的人，也隨之慢慢睜開了鮮紅的眼睛。
  - title: 第一章
    body: |-
      　　光回到石之家時，臉色蒼白得讓塔塔露驚叫出聲。

      　　「冒險者先生？怎、怎麼了……」

      　　聽見騷動而趕來的眾人先是一愣，隨即不約而同地望向光的身後。

      　　他們原以為會看見的另一個身影，並沒有跟著回來。

      　　最先反應過來的阿莉塞快步越過光，往窗外與門口張望了一圈，依然沒有任何發現。

      　　她皺起眉，轉身看向光，臉上是滿滿的困惑。

      　　「拉哈怎麼了？他沒跟著你一起回來嗎？」

      　　阿爾菲諾走上前，望著光異常的神色，刻意放輕的語氣也顯露出擔憂。

      　　「出了什麼意外嗎？」

      　　面對他們的疑惑，光沒有立刻回答。

      　　他的手垂在身側，緊握散發溫潤光芒的吸魂晶，收攏的手指近乎發白。眾人一頭霧水、面面相覷，卻因為從未看過光異常的模樣，一時之間不知該說些什麼。

      　　許久之後，光才緩緩開口。

      　　「有沒有辦法──」他的聲音乾澀得幾乎不像自己，話語裡的決心卻十分堅毅，「只喚醒古·拉哈·提亞，而不讓他繼承這些記憶？」

      　　語畢，屋內霎時安靜下來。

      　　雅·修朵拉微微瞇起眼。

      　　透過她的眼睛，靈魂與記憶的光輝仍清晰地保存在光手中的吸魂晶裡。那枚晶體並沒有被使用過，它依舊完整地承載著水晶公所託付的一切。

      　　「你並沒有喚醒他。」

      　　她的語氣平靜，卻十分篤定。

      　　而垂下眼的光，等於是默認了這句話。

      　　桑克瑞德沒有立刻開口，只是斂起了平日輕鬆的神情，安靜地看著他；尤里安傑的手指停在書頁邊緣，久久沒有翻動；阿爾菲諾怔了一下，神色從驚訝慢慢轉為擔憂。

      　　阿莉塞則睜大了眼，錯愕地驚呼。

      　　「為什麼要這麼做？」
      　　
      　　光將藍眼轉向他的夥伴，眼底原本壓抑著的防備，隨著眾人不解的目光逐漸加深。

      　　「水晶公最後的願望，是想再度踏上冒險。」他低聲說，「這個願望，不需要讓原初世界的他承受那一百年的記憶，也可以達成。」

      　　他所說的每個字都像是從胸口深處硬生生剜出來，生硬又倨傲，卻無可退讓。

      　　「如果那些記憶只會讓他痛苦，那為什麼一定要還給他？」

      　　聞言，阿莉塞的眉頭皺得更緊。

      　　「那是他的記憶吧？就算痛苦，那也不是我們能替他決定要或不要的東西。」

      　　「阿莉塞。」阿爾菲諾輕聲提醒，但阿莉塞沒有退開，她看著光，語氣比方才更嚴肅了些。

      　　「我知道你絕對不想傷害他，我也不想。可是你現在說的，聽起來就像是……只要你覺得對他好，就可以替他把一部分人生拿走。」

      　　光的神情沉了下來，石之家幽暗的燈光落在他臉上，將眼底原本就壓抑著的情緒襯得越發沉重。

      　　「那本來就不是現在的古·拉哈·提亞的人生，也不是他應該被迫承接的未來。」

      　　這句話讓眾人再次沉默。

      　　「他已經用自己的未來，換取了第一世界、原初世界，還有我的未來。」

      　　他停頓片刻，指尖幾乎嵌進掌心。
      　　
      　　「他本不該背負這些的。」

      　　阿爾菲諾咬著下唇，目光游移著垂下了頭。

      　　光繼續說下去。
      　　
      　　「現在已經沒了靈災的威脅，他甚至不需要再面對這些選擇……」他的聲音有些不穩，說出來的話也斷斷續續，卻仍倔強地堅持著把話說完，「如果我就這樣把所有記憶交給他，只因為水晶公希望如此，或者只因為我想讓水晶公回來──那對現在的他公平嗎？」

      　　這一次，阿莉塞也說不出話來。

      　　她原本想反駁，想說他們本來就是同一個人，想說水晶公的願望不該被否定，可是光所說的話語，也是眾人內心一直隱約覺得不對勁的地方。
      　　
      　　原初世界的古·拉哈·提亞，真的該背負未來的自己所選擇的道路嗎？

      　　雅·修朵拉懷抱雙臂，靜靜接過話。

      　　「原來如此，你是認為水晶公的選擇，不該被直接視為古·拉哈·提亞的選擇。」

      　　她的語氣並不嚴厲，甚至稱得上平穩，可不曉得為什麼，光總有一種被審視的感覺。

      　　儘管如此，他也不打算退讓。

      　　「我不是想奪走他的選擇。」

      　　「但你現在確實正這麼做。」雅·修朵拉道，「你選擇不讓他知道，也選擇不讓他有機會回答。」
      　　
      　　尖銳直白的話語讓光垂下頭，手中緊握著的拳頭隱隱發抖，一片凝重的氣氛中，從頭到尾都沒開過口的桑克瑞德，突然輕聲嘆了口氣。

      　　「我明白你在說什麼。」

      　　那雙總是帶著輕鬆情緒的眼睛，此刻看起來竟有些沉重，桑克瑞德的視線並沒有離開光，卻也不像是直視著他。
      　　
      　　低沉的語氣陷入悠久的回憶，甚至染上些許苦澀。
      　　
      　　「光之巫女……對那些孩子們來說，她們從一開始就被迫背負敏菲莉亞的使命、毫無選擇。」
      　　
      　　人們期待她們成為敏菲莉雅，期待她們回應那份力量，也期待她們承接本不該由她獨自背負的希望。
      　　
      　　桑克瑞德的聲音很沉，像每個字都經過反覆咀嚼才說出口。他自嘲地笑了笑，看似不在意地揮了揮手。

      　　「我也曾經混淆過，看著琳時，想起的是另一個人，想保護她，卻又不自覺地把過去的影子壓在她身上。」

      　　「所以我知道，那並不公平，我們似乎也選不出最完美的解答。」

      　　桑克瑞德與終於抬起眼的光對視，神情比平日任何時候都要嚴肅。
      　　
      　　「但比起他，我更擔心你。」

      　　「你或許以為，只要你分得清楚，只要你不將那些記憶交給他，就能把水晶公和古·拉哈·提亞分開看待。」

      　　他停頓片刻，聲音低了些。

      　　「可是人的眼神沒有那麼容易說謊。」

      　　光的指尖微微一顫。

      　　「當你透過那雙眼睛看著他時，如果心裡同時看見的是另一個人的影子，他遲早會察覺。」

      　　桑克瑞德的語氣並不尖銳，卻將某個光一直不願面對的事實放到他眼前。

      　　「到時候，痛苦的不只會是你。對古·拉哈·提亞來說，他也會開始懷疑，你究竟是在看著他，還是在看著那個你失去過、又想帶回來的人。」
      　　
      　　「這對他來說，同樣也不公平。」

      　　屋內靜了下來。

      　　桑克瑞德沉默片刻，才繼續說下去。

      　　「琳最後之所以能成為琳，不是因為我們替她把所有真相隔絕在外，也不是因為我們替她決定哪一部分命運太沉重，所以她不該知道。」

      　　他的聲音放得更低。

      　　「而是因為她最後能親自選擇自己要成為誰。」

      　　桑克瑞德看向光手中的吸魂晶，拉起一抹微笑。

      　　「水晶公把靈魂託付給你，不是為了讓你把他當成另一個只能由你記住的人，原初世界的他，也絕不是一個只能被你保護在真相之外的人。」

      　　雅·修朵拉輕聲補上：「問題或許不在於那些記憶是否該歸還，而在於歸還之前，他是否有被告知與選擇的權利。」

      　　「可若他尚未醒來，要怎麼選？」光低聲問，聲音終於透露出無助的顫抖。
      　　
      　　他抬起頭，試圖向夥伴們求援，因為正如桑克瑞德所說，光也不明白什麼才是最好的選擇。

      　　「我站在塔前時，想過要喚醒他，再告訴他一切，可是他們經歷的一切根本無法比較，更無法理解那一百年意味著什麼，那他的選擇又算是真的嗎？」
      　　
      　　他的話語越來越激動，甚至脫口而出另一個讓自己害怕的可能。
      　　
      　　「況且，繼承了記憶的他，究竟還是不是古·拉哈·提亞，還是由水晶公取而代……」
      　　
      　　說到這，光甚至被嗆得連連咳嗽，身旁的阿爾菲諾連忙起身拍著他的背，微弱的力氣卻沒有多大的安撫作用。
      　　
      　　這些問題，其實沒人能告訴他答案。
      　　
      　　眾人的沉默讓他眼底最後一抹光亮徹底熄滅。看著這樣的他，阿莉塞抹了抹眼角，卻一句話都說不出來。

      　　「水晶公既將自身託付於你，想必是相信你所做出的選擇。」尤里安傑垂下眼，溫聲說道：「靈魂與記憶的歸屬，確實沒有標準答案。」

      　　「只是，信任英雄的選擇，與剝奪古·拉哈·提亞自身的選擇，或許並非同一件事。」

      　　阿爾菲諾彎下腰，語氣放得很輕。

      　　「我們也許可以先喚醒他，再由可露兒檢查吸魂晶與他的靈魂是否能安全共鳴。也許記憶的融合並不會像你想像中那樣殘酷，這樣的話，水晶公也不會被遺忘──」

      　　「我並不想冒這種風險。」
      　　
      　　光沉聲打斷他，語氣既平板又生硬。

      　　「即使他不再是水晶公，我們的旅程還是可以繼續下去。」
      　　
      　　「我還是可以實現他的願望。」

      　　看著光堅毅的眼神，阿爾菲諾的神情更加憂慮。

      　　「你只想……獨自背負這些過去嗎？」

      　　他的聲音很輕。

      　　「那也太……」

      　　光卻只是自嘲似地笑了一下。

      　　那笑意很淡，很快就消失了。

      　　「不只他。」他說，「每一個消逝在我面前的人，其實都一樣。」

      　　此話一出，室內陷入一片死寂。

      　　沒有人能接話。

      　　因為他們其實都很清楚，隨著光歷經的戰鬥越多，由他帶往未來的託付與祈願也越來越多。那些逝去之人留下來的傷痛，最後無一不是由生者一肩扛起，再繼續向前邁進。

      　　英雄總是被期待如此。

      　　不倒下，不停留，不回頭。

      　　然後帶著所有人的願望抵達明天。

      　　桑克瑞德看著他，眉心微微收緊。

      　　「所以你打算讓他也變成其中之一？」

      　　光的眼神一震，桑克瑞德放慢了語氣。

      　　「但他沒有消逝，光。他在等你把他帶回來。」

      　　光的手指收緊了。

      　　他當然知道。

      　　正因為知道，才會痛苦又猶疑不決。

      　　就在這時，地面忽然一震。

      　　書架上的物品發出細碎的碰撞聲，塔塔露驚呼一聲，扶住了身旁的桌緣，眾人同時抬頭，短暫的錯愕後，立刻衝出石之家。

      　　喪靈鐘的廣場上已經聚集了不少人。

      　　人們停下手邊的工作，紛紛望向遠方，議論聲在空氣中擴散開來，帶著驚疑與不安。

      　　光也順著眾人的視線望去。

      　　下一瞬，他的呼吸停住了。

      　　高聳壯闊的水晶塔，正發出耀眼通天的光芒。

      　　那光芒沿著塔身一路向上流動，像沉睡已久的血脈重新甦醒，水晶映照著天色，將整片遠方都染上一層澄澈而刺目的輝光，生物紛紛躁動、沖向天際，彷彿活躍的能量就這麼從塔內源源不絕地激起地脈的流動。

      　　「這是……」

      　　阿爾菲諾還未說完，便看見光的臉色驟然變了。

      　　「等等，光！」

      　　阿莉塞的喊聲被拋在身後。

      　　眾人還來不及反應，光便已經朝水晶塔的方向衝了出去。

      　　不對。

      　　不該是這樣。

      　　他明明沒有把吸魂晶交出去。

      　　古·拉哈·提亞應該還在塔裡沉睡。

      　　水晶塔不該在這個時候甦醒。

      　　奔跑的速度越來越快，風從耳畔刮過，遠處的水晶輝光越來越近，刺得他的眼睛發疼。

      　　他不知道自己在害怕什麼，但懸空的內心正在叫囂著、督促他的腳步。

      　　等光趕到水晶塔底時，曾經緊閉的大門已經敞開。

      　　巨大的門扉靜靜立在兩側，塔內流瀉出柔和的光，照亮了門前的石階。

      　　光停下腳步，胸口劇烈起伏。

      　　然後，他看見一抹紅色的身影，正緩緩從塔內走出來。

      　　那人背上背著慣用的弓，肩上仍留著賢人的紋飾，陽光落在他的紅髮上，映得那顏色鮮明得近乎灼眼。他似乎才剛從漫長的沉睡中醒來，緩慢的步伐還帶著些許遲疑，可當他抬起頭，看見站在塔外的光時，那雙異色眼睛立刻亮了起來。

      　　光的瞳孔止不住地顫動。

      　　那一瞬間，他幾乎忘了呼吸。

      　　是古·拉哈·提亞。
      　　
      　　他的臉頰不曾被冰冷的水晶所包覆，鮮紅的髮尾也不曾染上灰白，那雙明亮的眼底還留著沉睡前的熱情與直率。他看見光時，毫不掩飾地露出喜悅，隨即努力地朝他走來。

      　　可正因如此，光才覺得胸口像被什麼緊緊攥住。
      　　
      　　是啊，這就是桑克瑞德所說的──
      　　
      　　「光！」
      　　
      　　『英雄！』
      　　
      　　沉穩與歡快、不同的語調卻有相同的聲線。
      　　
      　　他還以為自己分得清楚，還以為自己還能選擇。
      　　
      　　其實退無可退的，根本就是自己。
      　　
      　　「你果然在這裡，剛才塔裡的動靜是你造成的嗎？我醒來以後就察覺到有人來過，還留下了你的以太痕跡，所以我想……」
      　　
      　　熟悉的嗓音正朝他說著話，光的眼眶卻越來越熱。
      　　
      　　眼前模糊成一片，就連那人的身影，他也再也看不清了。
  - title: 第二章
    body: |-
      　　在引起騷動之前，他們將剛甦醒的貓魅賢人帶回了石之家。

      　　儘管才剛從漫長的沉睡中甦醒，那雙紅色的眼睛卻仍神采奕奕地到處張望，對拂曉的根據地與英雄的同伴都充滿好奇。

      　　「剛醒來一定要好好補充體力才行，來，這是特別準備的點心！」

      　　「謝謝你，那我就不客氣了。」古·拉哈·提亞小心地從塔塔露手中接過盤子，一邊緊張地頻頻道謝，一邊興奮又害羞地偷偷打量著聚集在他身邊的人。

      　　「身體還可以嗎？有沒有什麼異常？」

      　　雅·修朵拉站在古·拉哈·提亞身前，神情一如往常冷靜，那雙能看見乙太流轉的眼睛，正仔細地審視著他。

      　　「還好。」古·拉哈·提亞放下杯子，嘗試性地動了動手腕，又轉了下胳膊，「身體的感覺正在慢慢找回來，比起剛醒的時候好很多了，剛才走路還有些不穩，現在應該沒什麼問題。」

      　　「有頭痛、暈眩，或是記憶混亂的情況嗎？」

      　　「記憶……應該沒有。」他想了想，「我記得水晶塔封閉前的事，也記得沉睡前的事，只是剛醒來的時候，有一瞬間覺得時間好像過去了很久。」

      　　雅·修朵拉的目光微微停了很短的一瞬。

      　　「長時間沉睡後，有這樣的感覺並不奇怪，之後還是需要多觀察幾日。」

      　　同一時間，尤里安傑也收回施展治癒魔法的手，朝她輕輕頷首。

      　　「以身體狀況而言，並無顯著異常，乙太流動也亦趨於穩定，想來暫且不必過度憂心。」

      　　古·拉哈·提亞鬆了一口氣。

      　　「那就好，希望沒給你們添太多麻煩。」

      　　「你才剛醒來，就別想著添不添麻煩了。」阿莉塞坐在一旁，語氣有些生硬，「先把身體顧好才是最重要的吧。」

      　　她說得很快，聲音像是在壓抑著什麼，好險後者並未察覺到異樣，只是朝她露出笑容。

      　　「嗯，我會注意的。」

      　　阿莉塞別開臉，沒有再說話。

      　　坐在古·拉哈·提亞前方的阿爾菲諾清了清喉嚨，他稍稍向前傾身，清澈的眼睛裡帶著誠懇。

      　　「那麼，就如同剛才簡單提過的那樣，古·拉哈·提亞，你有興趣加入我們拂曉血盟嗎？」

      　　古·拉哈·提亞的耳朵立刻顫動了一下。

      　　「真的可以嗎？」

      　　他的語氣裡有驚訝，更多的是掩飾不住的期待。鮮紅的眼睛環顧著周圍一圈的人，眼裡映著止不住的光彩。

      　　雖然並未實際接觸過拂曉血盟，但同為薩雷安出身，古·拉哈·提亞早在很久以前便聽過他們的傳聞。他知道這群人為了解決蠻神問題，活躍於整片艾奧傑亞，也知道他們曾與許多龐大的危機對峙。

      　　更何況，光也在這裡。

      　　想到這裡，他忍不住望著站在稍遠處的光。

      　　從回到石之家開始，他就沒有說過話。其他人詢問古·拉哈·提亞身體狀況時，他也只是沉默地站在一旁，靜靜地聽著。

      　　古·拉哈·提亞看向他時，光正垂著眼。

      　　他看不清那雙藍眼裡的情緒。

      　　「當然可以。」阿爾菲諾的聲音將他的注意力拉回來，「若你願意加入，我們會非常歡迎。以你的知識、經驗，以及對水晶塔和亞拉戈技術的理解，一定能給予我們許多幫助。」

      　　「這、這樣說也太抬舉我了。」古·拉哈·提亞不好意思地笑了笑，「不過，如果我能幫上忙的話，我當然願意。」

      　　「好了好了。」

      　　可露兒笑著走出來打圓場。

      　　她朝眾人擠了擠眼，語氣卻刻意放得嚴肅。

      　　「我知道大家對新夥伴都很興奮，但也該讓拉哈君先好好休息。他可是才剛從水晶塔裡醒來，連身體狀況都還需要觀察呢。」

      　　說著，她又看向拂曉眾人。

      　　「何況，大家也剛結束一場旅行，你們每個人的狀況都還沒完全恢復吧？」

      　　聞言，眾人無奈地笑了笑。

      　　古·拉哈·提亞則是好奇地看向可露兒。

      　　「剛結束旅行？是去哪裡冒險嗎？」

      　　「這個……」

      　　可露兒的話語稍稍停了一下。

      　　「沒錯，是去異世界進行了一場驚心動魄的冒險。」

      　　桑克瑞德抬手搭上古·拉哈·提亞的肩，朝他擠了擠眼，身體卻不著聲色地擋住了光所在的位置。

      　　「有機會再慢慢說給你聽，要是現在講起來，恐怕你今晚就別想休息了。」

      　　「異世界？」古·拉哈·提亞的眼睛果然亮了起來，「真的嗎？那是怎樣的地方？你們是怎麼去的？」

      　　問題脫口而出後，他意識到自己太過急切，有些不好意思地停住。

      　　「抱歉，我是不是問太多了？」

      　　「以你的性格，這點問題還算少了。」可露兒笑著說。

      　　就在這時，阿莉塞突然用力站起身，椅腳與地面摩擦出短促的聲響。
      　　
      　　古·拉哈·提亞下意識抬頭看去，只見少女踏著大步朝他走來，氣勢洶洶、眉頭緊皺，微紅的眼眶直直注視著他。

      　　古·拉哈·提亞被她看得有些困惑。

      　　「呃……阿莉塞？」

      　　少女沒有回答。

      　　她盯著他好一會兒，像是想說些什麼，又硬生生把話吞了回去。下一瞬，她伸手搶過桌上塔塔露為古·拉哈·提亞準備的食物，一口塞進嘴裡。

      　　古·拉哈·提亞睜大眼。

      　　「啊！這、這是……那不是我的嗎？」

      　　「誰叫你們只顧著聊天都不吃！」

      　　阿莉塞含糊地說完，又拿起桌上的餅乾，毫不客氣地塞到古·拉哈·提亞面前。

      　　「這可是塔塔露特別準備的，吃下去才有精神！不然我就搶走了！」

      　　「怎麼可以！」古·拉哈·提亞手忙腳亂地接過餅乾，耳朵因困惑而垂了下去，「好嘛，我吃就是了。」

      　　「還有阿爾菲諾！」

      　　阿莉塞猛地轉向自己的兄長，被妹妹氣勢嚇住的阿爾菲諾怔了一下。

      　　「我？」

      　　「你也不該在這種時候提加入拂曉的事！大家狀態都還沒恢復啊！」

      　　「我、我也有錯嗎……」

      　　阿爾菲諾無奈地苦笑。

      　　塔塔露立刻附和：「就是說嘛！討論正事也要等大家吃飽休息好之後再說！」

      　　「怎麼連塔塔露也……」
      　　
      　　爭執聲讓熱鬧逐漸充盈著整個空間，跟著露出微笑的古·拉哈·提亞望著眼前打鬧著的眾人，內心泛起一絲暖意。
      　　
      　　他低頭咬了一口餅乾，又忍不住往光所在的方向看去，卻驚訝地發現那裡空無一人。

      　　古·拉哈·提亞怔了一下，眼睛四處尋找著，卻只來得及看見英雄盔甲後方的披風，靜靜地從門縫抽走的黑影。
      　　
      　　
      　　
      　　
      　　待夜幕降臨，一個靈巧的身影從窗邊鑽了出來。

      　　石之家早已安靜下來，走廊裡只剩下夜風穿過縫隙時細微的聲響。古·拉哈·提亞落地時幾乎沒有發出聲音，紅色的尾巴在身後輕輕一晃，隨即又被他壓低了些。

      　　他小心地將窗關好，隨後拉緊身上的披風，快步踏出城門、往遠方跑去。
      　　
      　　白日裡光離開時的背影，始終留在他的腦海裡。
      　　
      　　能再次見面已經是欣喜的事，古·拉哈·提亞內心積累了好多話想跟對方說，奈何早上並沒有合適的時機。
      　　
      　　光在水晶塔前看見自己的反應，也讓他十分在意。
      　　
      　　過去的他總是在遠處觀察這位英雄，直到他們一同調查水晶塔時也總是如此，那時的光與現在大不相同，雖然還只是個小有名氣的旅行者，卻堅毅果決、勇往直前，彷彿什麼困難都無法將他打倒。
      　　
      　　古·拉哈·提亞十分憧憬那樣的身影。
      　　
      　　然而再見面時，他沒想到那雙藍眼睛會盛滿這麼多沉重的情緒。

      　　他很想知道為什麼。
      　　
      　　想知道自己沉睡的這段時間，光歷經了什麼、看過了什麼，或者說背負了什麼。
      　　
      　　他還想再靠近那個人一點。

      　　哪怕光不願意說，他也至少想親眼確認對方是不是平安。

      　　古·拉哈·提亞穿過城門，沿著銀淚湖畔往外走去。夜色深沉，湖面映著稀薄的星光，水聲在岸邊輕輕拍打，將喪靈鐘裡白日殘留的喧囂一點一點推遠。

      　　紅色的眼睛在夜裡四處張望。

      　　最後，他在銀淚湖一處隱蔽的彎道，看見了要找的人。

      　　光獨自坐在湖邊。

      　　篝火在他身旁安靜燃燒，火星偶爾隨風升起，又很快消散在夜色裡，湖面的影子與火光交錯，映在他的盔甲上，將那道向來令人安心的背影襯得有些遙遠。

      　　眼前的畫面讓他想起很久以前的夜晚。
      　　
      　　那時他們也是在同一個地點休息，光坐在離篝火不遠的地方，沉默地擦拭武器，而他抱著資料卷軸坐在另一邊，埋頭苦思於解讀亞拉戈的文字，偶爾從書頁間偷偷地觀察英雄的側臉。

      　　那段過去，好像已經離現在十分久遠，可對他而言，又好像只是剛剛閉上眼、再睜開。

      　　古·拉哈·提亞放輕腳步，最後還是用輕快的語氣開口。

      　　「就知道你在這。」

      　　光的肩膀微不可察地一僵，但他並沒有回頭。

      　　古·拉哈·提亞朝篝火走近，在距離他幾步遠的地方停下。

      　　「怎麼啦？這麼久沒見，明明看到我都喜極而泣了，怎麼還獨自一人跑出來？」

      　　他故意說得輕鬆，尾音甚至帶著一點熟悉的調侃。

      　　光沉默了片刻，才低聲回答。

      　　「我只是……沒想到你會醒來。」

      　　「唔，其實我也不曉得為什麼。」

      　　古·拉哈·提亞偏了偏頭。針對這件事，他內心也有許多疑問，但現在並不是討論這個的好時機。
      　　
      　　貓魅懷念地朝他咧嘴一笑。

      　　「但不管怎麼樣，能再見到你，我還是很開心。」

      　　他在光的另一側坐下，忍不住伸長脖子打量對方的臉。

      　　「明明沒過多久，怎麼變成這副變成鬍子大叔的樣子。」

      　　聞言，光終於沒好氣地抬眼看了他一下。

      　　「……據我所知，貓魅族也是會長鬍子的。」

      　　「我才不會像你現在這麼滄桑的樣子。」

      　　他說完，便笑了起來。

      　　那笑聲很輕，就像他們從前相處的節奏。他抱著膝蓋坐在火邊，紅色眼睛望向遙遠的天際線。

      　　「不過，沒想到才過了這麼短的時間，你已經有這麼好的同伴了。」

      　　光垂下眼，睫毛的陰影在臉頰上搖曳著。

      　　「他們也是你的同伴。」

      　　古·拉哈·提亞的耳朵微微動了動。

      　　「能這樣我當然很開心。」他笑著說，「在薩雷安的時候，我早就久仰他們的大名。拂曉血盟的賢人，與蠻神和帝國對峙的英雄們……光是想像能和這樣的人一起冒險，就讓人有點坐不住。」

      　　他越說眼睛越亮，語氣也不自覺快了些。

      　　「阿爾菲諾和阿莉塞雖然年紀小，看起來卻很可靠，雅·修朵拉小姐的觀察力果然名不虛傳，尤里安傑先生說話雖然……嗯，有些艱深，但魔法造詣感覺就很驚人，桑克瑞德先生看起來很隨性，但我總感受不到他的氣息，老是被他嚇到，還有塔塔露小姐，她準備的點心真的很好吃。」
      　　
      　　光靜靜地聆聽，火光在兩人之間跳動。

      　　古·拉哈·提亞說了一會兒，忽然又不好意思地停下。

      　　「抱歉，好像有點興奮過頭了。」

      　　「不會。」

      　　光的聲音很輕。

      　　「這樣很好。」

      　　古·拉哈·提亞看向他。

      　　不知道是不是火光的緣故，那一瞬間，光的神情顯得比白日時柔和許多。雖然眼底仍有某種他看不懂的沉重，但至少不像在水晶塔前那樣，帶著彷彿即將破碎的眼神，怔怔地望著自己。

      　　古·拉哈·提亞悄悄鬆了口氣。

      　　就在這時，他的肚子忽然發出一陣清楚的聲響，在寧靜的夜裡，咕嚕聲顯得格外響亮。

      　　古·拉哈·提亞整個人僵住。

      　　下一刻，他的貓耳迅速垂了下來，連尾巴都尷尬地收在身邊。

      　　「……」

      　　在光的注視下，古·拉哈·提亞試圖鎮定地清了清喉嚨。

      　　「剛才塔塔露小姐準備的東西我有吃。」

      　　光沉默地挑了挑眉。

      　　「只是也許沉睡太久，身體還需要補充能量。」

      　　光微微點頭，仍然沒有說話。

      　　古·拉哈·提亞終於有些撐不住，耳尖紅了起來。

      　　「你、你倒是說句話嘛！從剛剛開始都是我在說……」

      　　光垂下眼，唇邊卻終於露出了一點極淡的笑意，像湖面上晃過的一點星光。

      　　「我烤魚給你吃。」

      　　光輕笑道，古·拉哈·提亞眨了眨眼。

      　　「真的？但我記得你以前的料理……很隨性？」

      　　「在外旅行，總會學會一些事。」

      　　光站起身，往湖邊走去。古·拉哈·提亞看著他的背影，忍不住又笑了起來。

      　　「已經變得這麼可靠啊，英雄。」

      　　光沒有回頭。

      　　「別這樣叫我。」

      　　那句話說得很平靜，卻讓古·拉哈·提亞敏銳地停了一下。

      　　他很快又將那點疑惑壓了下去。

      　　「那就拜託你了，光。」

      　　湖邊很快響起細微的水聲。

      　　古·拉哈·提亞坐在篝火旁，看著光熟練地處理魚，簡單調味後用木枝固定好，再放到火邊慢慢烤，那些動作帶著長年旅行才會留下的沉穩。火舌舔過魚皮，香氣逐漸散開，驅散了夜裡湖畔的寒意。

      　　光坐回火邊時，似乎比方才放鬆了一點。

      　　他低頭翻動烤魚，動作安靜而專注，過了一會兒，古·拉哈·提亞聽見他很輕地哼起了歌。

      　　起初只是幾個模糊的音，混在火焰燃燒與湖水拍岸的聲音裡，幾乎難以分辨。

      　　可古·拉哈·提亞的耳朵動了一下，他慢慢抬起頭，帶著不可思議地怔愣神情。

      　　哼唱的旋律，他很熟悉。

      　　那並不是艾奧傑亞城邦間流行的曲子，而是貓魅族裡流傳的古老旋律，曲調簡單，卻是在夜色與荒野之間一代代傳下來的歷史之一。

      　　在諾亞調查團的旅途中，他曾經唱給光聽過。

      　　那時他們夜裡紮營，調查團的夥伴們鬧著要他唱些薩雷安以外的歌。他推辭不過，最後只好紅著耳尖，小聲哼了一段族裡傳下來的旋律。

      　　他以為光那時並沒有特別注意，卻沒想到他記得。

      　　古·拉哈·提亞垂下眼，手指不自覺地按上懷裡的豎琴。

      　　那把小巧的樂器在他沉睡以前便一直帶在身邊，他猶豫了一下，將它取了出來，試探性地撥了撥弦。

      　　清亮的琴音落進夜裡，光卻止住了哼唱，抬眼看著他，像是在等待演出的觀眾。

      　　古·拉哈·提亞有些不好意思地笑了笑。

      　　「很久沒彈了，上一次唱這首歌，好像還是諾亞調查團的時候。」

      　　光點點頭，那雙藍眼在火光裡格外安靜。

      　　古·拉哈·提亞的耳尖又有些發熱。

      　　「唱得不好可別笑我。」

      　　「不會。」

      　　光說道，他的聲音低而溫和。

      　　於是古·拉哈·提亞低下頭，指尖再次撥過琴弦。

      　　旋律慢慢從他手中流淌出來。

      　　起初還有些生澀，像沉睡太久的記憶正在一點一點找回自己的位置。可很快，那些音符便順了起來，與湖水、夜風、篝火燃燒的聲音交織在一起。

      　　古·拉哈·提亞輕聲唱了起來。

      　　他的嗓音不算高昂，隨性哼唱也十分純樸，柔和的歌聲帶著一點少年人尚未完全褪去的青澀，卻也帶著旅人圍坐火邊時才會有的安然。

      　　光坐在火邊，靜靜看著他。

      　　看他被火光映亮的紅髮，看他隨著旋律微微晃動的耳尖，看他因久違地唱起舊歌而逐漸放鬆的眉眼。
      　　
      　　輕柔的歌聲彷彿將這段時間以來的煩惱全數拂去。恍惚間，他似乎又回到那個尚且懵懂的時候──那時的他還只是個對冒險充滿熱忱的冒險者，正準備與古·拉哈·提亞一同挑戰上古時代遺留下來的謎團。
      　　
      　　如果能一直這樣下去就好了。
      　　
      　　光忍不住這麼想。
      　　
      　　他並不是後悔第一世界經歷的一切，也不是想否定自己與水晶公共度過的那些時光。只是，在這一刻，他的心底竟湧出一股近乎自私的渴望。
      　　
      　　即使得不到眾人的諒解，即使那或許是錯誤的選擇，可此時此刻的溫暖，不正是他們一直期盼的嗎？

      　　「……光？」
      　　
      　　唱著歌的古·拉哈·提亞感受到身側的重量，驚訝地側過身，這才發現光不知道什麼時候已經挪動到他的背後，將額頭輕輕地抵在後背上。
      　　
      　　「怎、怎麼了，唱得不好嗎？」
      　　
      　　「別停。」
      　　
      　　沙啞的聲音讓貓魅有些不知所措，光的神色隱藏在陰影之中，也並沒有讓他看見，但儘管如此，古·拉哈·提亞還是低下頭，繼續輕聲吟唱。
      　　
      　　他的耳尖也悄悄地染上與篝火一樣的顏色。
  - title: 第三章
    body: |
      　　不知不覺間，喪靈鐘的人們已經習慣了那樣的光景──背著行囊的英雄身側，總會多出一道裝備著弓箭的紅髮身影。
      　　
      　　這回他們接下的是一件尋找遺物的委託，目的地位於沙漠中央的遺跡深處。
      　　
      　　古·拉哈·提亞在一路上都顯得興致高昂，從遺跡入口的浮雕、牆面刻痕的排列，到機關運作時殘留的乙太流向，每一樣都能讓他停下腳步，眼神發亮地細細觀察。
      　　
      　　若不是光在前方提醒，恐怕光是第一道石門，他就能研究上一整天。
      　　
      　　「拉哈！還沒好嗎！」
      　　
      　　此時，光正橫舉著劍，用力架住眼前雙頭怪揮下的利爪，沉重的衝擊讓靴底在石地上擦出刺耳聲響，臂膀也因反震而微微發麻。
      　　
      　　包圍他們的異形是迷宮最深處的守衛，它們從牆縫與陰影中一隻接一隻爬出，被此處的古老機關驅使著，全力排除入侵者。
      　　
      　　而古·拉哈·提亞正蹲在房間中央的石板前，專心一致地研究眼前的謎題，他的手中握著最後一顆綠寶石，正與石板上數個凹槽比對著。
      　　
      　　「『三羽指日，一眼向月……』」
      　　
      　　古·拉哈·提亞低聲念著石板上的古語，眉心微微蹙起，指尖在石板花紋延伸而成的兩處凹槽之間移動，卻遲遲沒有落下。
      　　
      　　光一劍挑開雙頭怪的攻勢，轉身斬斷另一隻異形的前肢，怪物在劍光中崩裂，化成灰燼般的碎屑，可視線才剛從那片灰霧中穿過，他便看見另一隻體型較小、動作更快的異形，正貼著地面疾衝而去。
      　　
      　　目標正是古·拉哈·提亞的背後。
      　　
      　　光幾乎沒有猶豫，迅速切換武器，從腰間掏出火槍；槍口抬起的瞬間，子彈已帶著火光甩了出去，精準打穿那隻異形的腦門。
      　　
      　　怪物在距離古·拉哈·提亞僅有數步之處翻倒，撞上石板邊緣，隨即碎裂成一灘黑色的粉塵。
      　　
      　　古·拉哈·提亞忍不住抬起頭，帶著一雙發亮的眼睛。
      　　
      　　「這就是伊修加爾德的火槍術嗎！」
      　　
      　　光無奈地喊道：「回去你想看多少次都可以！現在還是先──」
      　　
      　　「說好了喔！約定不可以反悔！」
      　　
      　　古·拉哈·提亞開心地動了動耳朵，語氣裡帶著藏不住的雀躍，下一刻，終於確認了答案的他毫不猶豫地舉起手，將綠寶石按進石板上方的凹槽裡。
      　　
      　　一道清晰的光從石板的縫隙處亮起、向外擴散。
      　　
      　　原本還在咆哮逼近的異形們動作同時一頓，隨即身體自內部裂開，化為無數碎片，跟著光的餘波一一崩散。
      　　
      　　石室裡終於安靜下來，只剩下光略顯沉重的喘息聲，確認再沒有新的敵人出現後，他才鬆開握劍的手，背靠著牆跌坐下來。
      　　
      　　古·拉哈·提亞也跟著走了過來，臉上帶著明亮的笑意。
      　　
      　　「謝謝你保護我。」
      　　
      　　「真不愧是你，這種複雜的謎題也解讀得這麼快。」
      　　
      　　兩人幾乎同時開口，又在聽見彼此聲音的瞬間相視而笑。光看著古·拉哈·提亞不好意思地垂下頭，忍不住伸手揉了揉他兩耳之間的頭髮。
      　　
      　　隨後，藍色的眼睛的越過他，將視線投向石室後方。
      　　
      　　伴隨機關解開，原本看似普通的牆面緩緩向兩側移開，露出一條幽暗狹窄的通道，盡頭閃爍著微弱的火光。
      　　
      　　「看來前方就是我們要找的東西了。」
      　　
      　　兩人交換了眼神，沿著通道往前走去。
      　　
      　　與外頭充滿機關與守衛的石室不同，暗門後的空間沉靜得連風都停止流動。牆上刻著早已斑駁、無法辨識的紋樣，地面更覆蓋薄薄一層塵埃，只有他們的腳步聲在空洞中輕輕迴響。
      　　
      　　房間中央擺放著一具石棺。
      　　
      　　光將古·拉哈·提亞護在身後，自行上前檢查了一圈，確認沒有新的機關後，才將手按上石棺邊緣。
      　　
      　　「我推開看看。」
      　　
      　　古·拉哈·提亞點點頭，舉著弓、站在一旁戒備。
      　　
      　　厚重的石蓋在光的推動下緩緩移開，摩擦聲低沉地響徹整間密室，塵埃紛紛被震落，細碎地飄散在微光之中。
      　　
      　　待浮塵散去，兩人才得以看清石棺內部，那裡並沒有屍骨一類的殘骸，只靜靜躺著一組項鍊。
      　　
      　　「看來就是這個了。」
      　　
      　　光蹲下身，打開隨身的背包，熟練地取出布巾拾起光芒璀璨的珠寶。
      　　
      　　古·拉哈·提亞也跟著靠近，探頭看著光的動作，視線卻在不經意間落入敞開的背包深處。
      　　
      　　那裡有一個發著微光的錐形晶體。
      　　
      　　它被幾層布仔細包著，只露出一小截暗色的尖端，其沾染上的紅與自己眼睛的顏色完全相同。
      　　
      　　那一瞬間，彷彿有什麼正在牽引著他。
      　　
      　　在回過神以前，他的手已經緩緩伸了出去。
      　　
      　　晶體前端散發出十分微弱的波動，彷彿其中壓縮著驚人的能量，在指尖靠近的瞬間，錐形晶體甚至亮了起來。
      　　
      　　古·拉哈·提亞猛地怔住。
      　　
      　　那股波動他絕不會錯認，那是──
      　　
      　　「拉哈。」
      　　
      　　光的聲音忽然響起。
      　　
      　　回過神的古·拉哈·提亞轉頭看向他，這才發現自己的手已被光牢牢緊握，寬大的手不知怎地，竟微微發顫。
      　　
      　　光的藍眼並沒有與他對視，而是怔怔地望著那枚晶體，不等他開口，光便迅速地將包裹著的布料再次拉開、蓋住散發著的微光。
      　　
      　　古·拉哈·提亞的胸口浮起一陣說不清的違和感。
      　　
      　　他當然清楚自己並不瞭解光的全部，在對方主動坦承之前，古·拉哈·提亞也不會刻意去刺探那些英雄並未提及的事情。
      　　
      　　可是那股能量──
      　　
      　　「……那是亞拉戈皇血所結晶而成，對嗎？」
      　　
      　　在意識到之前，話語就脫口而出，事關自己的身世，他也無暇顧及會不會過於唐突。
      　　
      　　古·拉哈·提亞向前半步，目光仍落在光的背包上。
      　　
      　　「你還有遇過其他擁有血脈的人嗎？」他急切地問：「這是他交給你的東西？你就是用這個打開水晶塔的嗎？」
      　　
      　　空曠的石室裡，一次次迴盪著他的問題。
      　　
      　　剛才因委託完成而生的輕快，隨著自己的回聲盡數消失，兩人之間的沉默變得無比清晰，帶著窒息的壓迫，迴盪在身側。
      　　
      　　光沒有立刻回答。
      　　
      　　他低頭整理背包的扣帶，像是試圖避開古·拉哈·提亞的視線。
      　　
      　　心裡的不安正慢慢擴大。
      　　
      　　在古·拉哈·提亞的記憶裡，英雄很少欲言又止，但自從自己甦醒後，沉默似乎時常伴隨在談話之間，特別是自己觸碰到某些話題時，會更加明顯。
      　　
      　　過去這段日子，他總是告訴自己不要在意，但這次卻無法再視而不見。
      　　
      　　沉默良久後，光靜靜地看著他堅持的眼神，垂下了眼睛。
      　　
      　　「那是一個人託付給我的東西。」他背起行囊，輕聲說道：「那很重要，但並不是你想的那樣。」
      　　
      　　光的語氣平穩，卻也到此為止。
      　　
      　　古·拉哈·提亞的手指用力地握緊，又強迫自己放開。
      　　
      　　而光依然未給予回應。
      　　
      　　「先離開這裡吧。」他轉過身，「委託人的東西已經找到了，這座迷宮也不一定安全。」
      　　
      　　若是在平時，古·拉哈·提亞或許會點頭，跟上他的步伐，可這一次，他的雙腳彷彿定住般，只是在原地看著光離去的背影。
      　　
      　　那背影他曾經追逐過無數次，也曾以為自己已經稍稍追趕上他的腳步，卻在這一刻，忽然察覺他們之間仍有一道因隱瞞而生的陰影。
      　　
      　　古·拉哈·提亞垂下眼，手指輕輕按上自己的胸口。那裡還殘留著剛才晶體喚起的悸動，近乎微弱，卻鮮明得無法忽視。
      　　
      　　「……嗯。」
      　　
      　　最後，他只低低應了一聲。
      　　
      　　光似乎聽見了，腳步停了一瞬，卻沒有回頭。
      　　
      　　兩人沿著來時的通道離開密室，牆上的光芒一盞接一盞在身後熄滅，將那具石棺、那段未解的對話，以及古·拉哈·提亞心底悄然滋生的不安，一同留在越來越深的黑暗裡。
      　　
      　　
      　　
      　　疑慮一旦敲開了一塊裂縫，就會一發不可收拾。
      　　
      　　從遺跡回來之後，古·拉哈·提亞好幾次想當作什麼都沒有發生，他仍舊照常與光同行、一同因為委託而踏上旅途，也會與拂曉的夥伴研究知識、或者共同討伐威脅城內的怪物。
      　　
      　　能與志同道合的夥伴一同冒險，曾是他最盼望的時光，他並不想親手破壞這得來不易的一切。
      　　
      　　可是光的隱瞞，還有那枚錐形晶體的秘密，卻像一根細針，悄悄扎進了他心裡。

      　　亞拉戈皇血。
      　　
      　　沒有人會比古·拉哈·提亞更熟悉這件事。
      　　
      　　早在當年調查水晶塔之時，他便已反覆確認過自己的血脈。那不只是他與古代帝國之間的聯繫，更是打開水晶塔、承接那份沉重責任的鑰匙。
      　　
      　　他知道自己理應是這個世界上唯一存活下來的皇血繼承人，也背負著多加與烏內託付給自己的使命。
      　　
      　　所以，那枚晶體究竟從何而來？
      　　
      　　又是誰將那樣的東西託付給光？
      　　
      　　而光為何對此閉口不談？
      　　
      　　數不清的疑問經過時間的積累，令他逐漸開始懷疑身邊的一切。
      　　
      　　每當自己單獨行動時，總是恰巧遇見桑克瑞德，或者是碰上結伴而行的精靈雙胞胎，而雅·修朵拉檢查自己身體狀況時，神情總是帶著謹慎，像是在思考著什麼，尤里安傑也時常用欲言又止的眼神望著自己。
      　　
      　　至於光──
      　　
      　　光一直都對他很好。
      　　
      　　會為他演示不同職能的要領，會為他親手做許多料理，也會在自己埋頭研究知識時，靜靜地陪在一旁。
      　　
      　　他知道那些陪伴都是真的，眼底的溫柔也都是真的。
      　　
      　　也正因為是真的，才讓古·拉哈·提亞更加無法開口詢問。
      　　
      　　但越是裝作沒有看見，越能聽見心底的裂縫，越發劈啪作響。
      　　
      　　那日下午，石之家內難得安靜。
      　　
      　　古·拉哈·提亞路過走廊，恰巧在轉角處看見可露兒抱著幾份資料從房間裡出來。她似乎正要去找誰，腳步很急，眉間也帶著幾分疲色。
      　　
      　　他幾乎是在思考以前便開了口。
      　　
      　　「可露兒。」
      　　
      　　可露兒停下腳步，回過頭來。
      　　
      　　「怎麼了，拉哈君？」
      　　
      　　她的笑容一如往常，溫和而親切。
      　　
      　　古·拉哈·提亞張了張口，可是話到嘴邊，他卻忽然說不出口。
      　　
      　　可露兒的目光微微一動。
      　　
      　　她似乎看出了他的遲疑，卻沒有催促，只是靜靜等著。
      　　
      　　那份安靜反而讓古·拉哈·提亞更加不知所措。他垂下眼，手指無意識地搓著手臂，最後只能勉強擠出一句完全無關緊要的話。
      　　
      　　「我只是想問……先前的那幾份古代文字抄本，現在還在你那裡嗎？我想再借來看看。」
      　　
      　　可露兒看了他一會兒，隨後露出他十分熟悉的微笑。
      　　
      　　「在我房間裡，晚點拿給你吧。」
      　　
      　　「麻煩你了。」
      　　
      　　古·拉哈·提亞點點頭，隨即狼狽地從她身旁快速離去。
      　　
      　　他走得匆忙，因此沒有看見在他的身後，可露兒臉上的笑容一點一點滑落。
      　　
      　　走廊重新安靜下來。
      　　
      　　可露兒抱著資料站在原地，直到那道腳步聲徹底消失在另一端，她才低低嘆了一口氣。
      　　
      　　「到極限了嗎。」
      　　
      　　陰影處傳來輕微的動靜。
      　　
      　　桑克瑞德從牆邊走出來，雙臂抱胸，神情比平時更加凝重。
      　　
      　　「他注意到了？」
      　　
      　　「恐怕不只是注意到。」可露兒低聲說，「他原本想問我，但最後忍住了。」
      　　
      　　桑克瑞德沉默片刻。
      　　
      　　「看來，留給我們的時間不多了。」
      　　
      　　「光也快到極限了。」她輕聲道：「他內心的掙扎越來越明顯，聲音也越來越破碎，恐怕……」
      　　
      　　可露兒低頭看著懷中的資料，指尖無意識地按緊了紙頁邊緣。
      　　
      　　「雅·修朵拉他們那邊還沒有結果嗎？」
      　　
      　　「沒有。」桑克瑞德搖了搖頭，「她和尤里安傑都還在尋找答案，一個身體如果同時容納兩份靈魂與記憶，究竟會發生什麼事……還有最後身體的主人，究竟會是誰。」
      　　
      　　可露兒的眉頭皺得更深。
      　　
      　　「這和我們的情況不一樣，也和敏菲莉亞與琳的情況不一樣。」
      　　
      　　桑克瑞德沒有立刻接話。
      　　
      　　他們翻閱古書、探訪故人，卻依然無法確定，若兩份人生在同一具身體裡相遇，究竟會彼此融合，還是彼此拉扯。
      　　
      　　「在找到答案之前，光不會願意冒風險。」桑克瑞德說。
      　　
      　　可露兒輕聲道：「我知道。可他也不是能一直被保護在真相之外的人。」
      　　
      　　「況且，我們也未必找得到答案。」
      　　
      　　這句話落下後，兩人都陷入了沉默。
      　　
      　　
      　　
      　　那天晚上，古·拉哈·提亞很早便回到了房間。
      　　
      　　他原本想讀點書，嘗試逃離內心的煩悶，可書頁攤在桌上，卻半天沒有翻過一頁。
      　　
      　　那些熟悉的文字在眼前排列成行，卻怎麼也無法進入腦中。
      　　
      　　他索性熄了燈，躺上床。
      　　
      　　然而黑暗也沒有帶來安寧。
      　　
      　　他在床上翻來覆去，耳朵不時因走廊外的細微聲響而動一下。每一次閉上眼，那枚錐形晶體便會在腦海中浮現。
      　　
      　　古·拉哈·提亞抬起手，遮住自己的眼睛。

      　　他不知道自己究竟是什麼時候睡著的。
      　　
      　　意識下沉時，周遭的黑暗像水一樣漫過耳畔。原本熟悉的房間氣息逐漸遠去，取而代之的是一種遙遠而冰冷的空曠感。
      　　
      　　他睜開眼時，發現自己站在一片寂靜而寬大的空間。
      　　
      　　四周包圍著璀璨的水晶牆，明亮且刺眼，他完全看不到牆外的世界，前方只有一面落地的鏡子，正散發著一陣陣輕柔的水波。
      　　
      　　古·拉哈·提亞下意識握緊手中的弓，卻發現掌心空空如也。
      　　
      　　「這裡是……夢？」
      　　
      　　他的聲音在空間中輕輕迴盪，很快便被遠方傳來的一聲嘆息截斷。
      　　
      　　那聲嘆息很輕，帶著漫長歲月累積出的疲憊。
      　　
      　　「雖然我的確有想過這種可能，才預留了一點保險……」
      　　
      　　古·拉哈·提亞猛地轉身。
      　　
      　　不遠處站著一個披著兜帽的身影。那人抬頭望向他，身形被寬大的外袍包裹，外袍下露出的右手，已經完全化為與周圍水晶相同的模樣。
      　　
      　　古·拉哈·提亞盯著他，心中升起一股奇異的熟悉感。
      　　
      　　他說話的聲音與自己如此相近，卻又截然不同，更為低沉的嗓音像是躺在河流淺層的礫石，在流過漫長歲月後，被磨去了所有急促與天真。
      　　
      　　「你是誰？」
      　　
      　　兜帽下的人沒有立刻回答。
      　　
      　　他只是輕輕笑了一聲。那笑聲並不愉快，更多的是無奈、自嘲，還有一點近乎自責的嘆息。
      　　
      　　「英雄他……太溫柔了。」他說，「是我的錯。我明明知道，卻還是把殘酷的事情託付給了他。」
      　　
      　　古·拉哈·提亞的呼吸停了一瞬。
      　　
      　　「你在說什麼？」他向前一步，「你認識光？那枚晶體就是你──」
      　　
      　　話還沒有說完，披著兜帽的人便微微仰起頭。
      　　
      　　那雙與自己一模一樣的鮮紅眼睛，正帶著歉意與平和的目光，靜靜地凝視著他。
  - title: 第四章
    body: |-
      　　古·拉哈·提亞怔在原地。

      　　兜帽的陰影仍遮住了那人大半張臉，可僅僅只是那雙眼睛，便已足以成為解答。

      　　「你……」

      　　古·拉哈·提亞張了張嘴，卻沒能立刻說出後面的話。

      　　披著兜帽的人似乎早已預料到他的反應，他抬起尚未結晶化的左手，緩緩拉下兜帽。

      　　末端染成銀白的鮮紅髮絲，自布料下滑落。

      　　那張臉與古·拉哈·提亞極其相似，卻又不完全相同。歲月在他的眉眼間留下了過於漫長的痕跡，將原本屬於青年的鋒芒磨得沉靜而溫和，臉頰與頸側覆著半透明的水晶，細碎的光芒沿著結晶的紋路緩緩流動。

      　　古·拉哈·提亞望著他，心臟重重跳了一下。

      　　「你是……我？」

      　　這句話脫口而出時，連他自己都覺得不可思議。

      　　那人聞言，眼中浮起一點淡淡的笑意。

      　　「是，也不是。」

      　　他的聲音輕而柔和，卻帶著一股令人不由自主想要信服的力量。

      　　「我所經歷的未來，並不屬於你如今所在的世界。那是一條已經被改變，也不會再次抵達的道路。」

      　　古·拉哈·提亞皺起眉。

      　　「未來？」

      　　「很久以後的未來。」那人說，「在那裡，世界迎來了災厄。我與水晶塔一同甦醒，而後為了改變災厄所帶來的結局，前往了另一個世界。」

      　　他停頓了一下，像是在斟酌該說到什麼程度。

      　　「那段旅程持續了很久，比你所能想像的……還要久一些。」

      　　古·拉哈·提亞的視線落在他結晶化的右手上。

      　　那隻手安靜地垂在身側，透著冰冷的光，像是早已與這座由水晶構成的空間融為一體。

      　　「你的身體……為什麼會變成這樣？看起來簡直像是──」

      　　「水晶塔的一部分？」

      　　那人笑了笑。

      　　「這是為了實現願望而付出的一點代價。不過對我而言，十分值得。」

      　　他略微停頓，平靜地望著古·拉哈·提亞。

      　　「你可以稱呼我為水晶公。」

      　　古·拉哈·提亞的腦中一片混亂，震驚卻並未讓他失去思考的能力。

      　　他忽然想起桑克瑞德曾經提過的，那場發生在異世界的冒險。

      　　「那段旅程……光也在嗎？」他的語氣有些生硬，「光也認識你？」

      　　水晶公垂下眼。

      　　「是。」

      　　僅僅一個字，卻溫柔得讓古·拉哈·提亞胸口發緊。

      　　他想起光凝視那枚晶體時的神情，想起那些未曾說出口的話，也想起每一次自己靠近時，對方眼底一閃而逝的遲疑與悲傷。

      　　原來那並不是他的錯覺。

      　　「所以，是你在晶體裡呼喚我？」

      　　「我的靈魂與記憶，正沉睡在那枚晶體之中。」水晶公微微點頭，「英雄將它們從另一個世界帶了回來。本來，是為了讓我能夠回到你的身體裡。」

      　　古·拉哈·提亞立刻抬眼看他。

      　　「可是他沒有這麼做？」

      　　「他並不打算這麼做。」

      　　水晶公糾正得很溫和。

      　　古·拉哈·提亞沉默下來。

      　　他聽得出那句話裡的維護。即使光沒有按照原先的計畫行動，眼前的人依然沒有半點責怪的意思。

      　　「為什麼？」

      　　他可能隱約猜到答案，仍舊忍不住問。

      　　水晶公望著他。

      　　「因為那並不是一段只有喜悅的記憶。」

      　　水晶牆上的光微微流轉，映在他蒼白而平靜的臉上。

      　　「其中有漫長的等待，有無法挽回的失去，也有許多……我曾經以為自己早已習慣的孤獨。英雄知道那些事情，也親眼見過我走到最後。」

      　　他說得極為簡略，甚至刻意避開了其中的細節。

      　　「他不願意讓你承受這一切。」水晶公的目光柔和下來，「他希望你可以只是你自己。」

      　　古·拉哈·提亞抿緊嘴唇。

      　　「難道接收了你的記憶，我就不再是我了嗎？」

      　　「會，也不會。」

      　　這個回答讓他一愣，水晶公卻坦然地迎著他的目光。

      　　「你依然會是你，我的記憶不會抹去你，也不會讓我取代你。」

      　　他輕輕抬起結晶化的右手。

      　　「但它們會成為你的一部分，影響你的情感，也可能改變你看待許多事物的方式，甚至影響你往後做出的選擇。」

      　　古·拉哈·提亞望著那隻手，沒有說話。

      　　「你不會因此成為我。」水晶公輕聲說，「可是從你接納那些記憶的那一刻起，我曾經歷過的一切，便再也不只是屬於我的過去了。」

      　　古·拉哈·提亞沉默了許久。

      　　「你早就知道，光可能不會把晶體交給我。」

      　　水晶公露出一點無奈的笑。

      　　「我只是想過，他或許會猶豫。」

      　　他低頭看向自己逐漸結晶化的手。

      　　「所以我稍微改動了術式，在晶體外層留下了一小部分靈魂。它不足以長久存在，也無法強行將任何東西交給你。充其量，只能在你開始接近那些記憶時，與你見上這一面。」

      　　古·拉哈·提亞怔怔地看著他。

      　　看著這個存在於另一段未來、歷經了遠比自己更加漫長歲月的自己。

      　　他如此從容、坦然地面對這一切，眉眼之間卻依然帶著不可思議的平和與溫暖。

      　　「我之所以留下，並不是為了說服你接納我。」

      　　古·拉哈·提亞抬起眼。

      　　「那你想要我怎麼做？」

      　　「由你自己決定。」

      　　水晶公回答得很慢，也很清楚。

      　　「但在那之前，你必須先真正想清楚，自己為什麼想要那些記憶。」

      　　他凝視著古·拉哈·提亞。

      　　「無論是因為不甘心被隱瞞，還是好奇另一個自己的人生，或者是希望藉由那些記憶……再靠近英雄一些──」

      　　「這些話，有些過分了。」

      　　古·拉哈·提亞不禁握緊拳頭，耳朵也不自在地向後壓低了些。

      　　可眼前的人只是坦然地望著他。

      　　正因為同樣是「古·拉哈·提亞」，對方才比任何人都更明白，那些埋藏在心底、連他自己也不曾正視過的渴望。

      　　「抱歉。」

      　　水晶公輕聲說，卻沒有移開話題的意思。

      　　「但那些念頭並不是錯。無論你是出於什麼樣的心情想要接近那段過去，都不必為此感到羞愧。」

      　　他的神情逐漸認真。

      　　「只是，你必須確認，那是你真正願意承擔的選擇。一旦接納，就再也無法將那些歲月當作他人的故事。」

      　　古·拉哈·提亞垂下頭。

      　　「那些痛苦，也會變成我的？」

      　　「是。」

      　　「那那些快樂呢？」

      　　水晶公怔了一下。

      　　古·拉哈·提亞抬起頭，直直望進他的眼睛。

      　　「你一直說那段記憶裡有痛苦、有等待，也有失去。可是你也曾經和光一起走過一段旅程，不是嗎？」

      　　水晶公的目光輕輕顫動。

      　　「你一定也有過快樂的時候。」古·拉哈·提亞語氣堅定地說：「否則，你不會用那樣的表情提起他。」

      　　漫長的沉默落在兩人之間。

      　　「有。」

      　　水晶公閉了閉眼，像是在回望某段遙遠得幾乎觸不可及的時光。

      　　「有過許多。」

      　　再睜眼時，他眼中泛起了柔和的光。

      　　「與英雄相伴的時光，在我那段漫長的旅程中，其實只佔了很短的一部分。」

      　　他的唇角微微揚起。

      　　「可正是那段短暫的時間，成了我漫長生命中最珍貴的回憶。」

      　　水晶公仰起頭，露出自兩人見面以來最為平和的笑容。那笑容裡帶著懷念，也帶著一點直到如今仍未完全熄滅的希冀。

      　　「那段時光甚至足以動搖我好不容易才下定的決心。」

      　　他望向遠處散發著水波的鏡面，聲音變得悠遠。

      　　「按照原先的計畫，在世界得救之後，英雄不會知道我究竟是誰。他會回到自己的世界，繼續走向我們為他奪回的未來，而那個未來之中，本不會有我的存在。」

      　　他笑得很輕，臉頰上的水晶裂紋卻在光芒下閃爍，宛如一道凝固的淚痕。

      　　「水晶公的旅途會到此結束，而英雄的未來仍將繼續。」

      　　他停頓片刻。

      　　「可是英雄帶來的希望，最終也改變了我的未來。」

      　　古·拉哈·提亞胸口一窒。

      　　水晶公從沒有說出那份感情的名字。

      　　可當他提起光時，那雙眼睛裡流露出的神情，竟與古·拉哈·提亞每一次望向光的背影時，如此相似。

      　　仰慕、嚮往，想要追上對方的腳步。

      　　以及一種尚未被他仔細辨認，卻早已悄然生根的感情。

      　　古·拉哈·提亞避開了他的目光。

      　　「你……喜歡光。」

      　　「是。」

      　　水晶公沒有否認，也沒有用任何模糊的言語遮掩。

      　　「而且，我想這份感情最初萌生的時刻，你也曾經歷過才對。」

      　　「我……」

      　　古·拉哈·提亞一時語塞，連尾巴都不自然地僵住了。

      　　面對他的尷尬，水晶公卻顯得十分坦然。

      　　「我們有著相同的起點，也懷抱相同的憧憬。」

      　　他輕輕笑了一聲。

      　　「所以，請相信此刻的我，多少能夠明白你的心情。」

      　　那份坦然反而令古·拉哈·提亞更加無所適從。

      　　「也正因如此，我才不能替你做出選擇，也不希望你同情我、或者想取代我而採取行動。」
      　　
      　　「我希望你能做出屬於『古·拉哈·提亞』自己的選擇。」

      　　水晶公凝視著他。

      　　「為此，我想問你一個問題。」

      　　他的聲音很輕，神情卻前所未有地認真。

      　　「倘若英雄的前方只剩下死亡，而你的面前出現了一條艱難而痛苦的道路──那條路遍布荊棘，或許要付出漫長歲月，甚至承受難以想像的失去，卻有可能改變他的未來……」

      　　水晶公微微停頓。

      　　「你會選擇走上那條路嗎？」

      　　古·拉哈·提亞沉默了片刻。

      　　他沒有立刻回答，只是重新抬起頭，迎上水晶公的目光。

      　　那雙鮮紅的眼睛裡不再有最初的混亂與遲疑，只剩下一道清晰而堅定的光。

      　　水晶公怔怔地看了他一瞬。

      　　隨後，他忽然笑出了聲。

      　　那笑聲裡有懷念，也有釋然，彷彿積壓在心中許久的沉重，終於在這一刻被輕輕卸下。

      　　「謝謝你。」

      　　他的身形周圍開始閃爍起微弱的光芒，輪廓也隨之一點點變淡。

      　　「等一下！」

      　　古·拉哈·提亞急忙向前一步。

      　　他還有太多事情想問。

      　　那個已經消失的未來，那段跨越百年的旅程，還有光與他一同經歷過的一切。

      　　然而水晶公只是站在逐漸漫開的光芒中，安靜地笑著望向他。

      　　「仔細思考，然後親自將你的選擇告訴英雄。」他輕聲說：「放棄這段過去或是承接一切，無論你的答案是什麼，他大概都會懷疑自己是否做錯了。」

      　　水晶公的語氣裡帶著熟悉而無可奈何的溫柔。

      　　「他就是這樣的人。」

      　　古·拉哈·提亞無法反駁。

      　　「所以，真正重要的並不是你選擇哪一邊。」

      　　水晶公抬起眼，最後一次看向他。

      　　「而是讓他知道，那是出於你自己的意願。」

      　　四周的水晶光芒驟然亮起。

      　　在那道身影徹底消逝前的最後一瞬間，古·拉哈·提亞猛地睜開眼，發現自己已經回到了石之家的臥室。

      　　黑暗籠罩著房間，窗外仍不見天明。

      　　他急促地喘息著，伸手按住胸口，耳邊只剩下一句輕柔的話，隔著遙遠的夢境反覆迴盪。

      　　『光……就拜託你了。』
  - title: 第五章
    body: |
      　　越是努力平復心緒，內心的躁動越是明顯。

      　　古·拉哈·提亞閉著眼躺在床上，卻遲遲無法再次入睡，腦海裡不斷迴盪著與水晶公的對話。
      　　
      　　當想到水晶公提及光時，溫柔且懷念的神情，還有這段時間以來，光無意間顯露出的猶豫與痛苦，他胸口像壓著一塊沉重的石頭，彷彿窒息般無法呼吸。

      　　古·拉哈·提亞的紅眼裡流轉著掙扎的情緒。

      　　良久，他終於放棄似地坐起身，低低嘆了口氣。

      　　他披上外衣，踏出自己的臥室。
      　　
      　　深夜的走廊裡聽不見人聲，只有窗外淡薄的月光落在地面，將他的影子拉得細長。
      　　
      　　沒有目的的腳步最終停在光的房門前，古·拉哈·提亞望著緊閉的門扉，耳朵不安地動了一下。
      　　
      　　混亂的內心根本無法靜下來，好好尋找自己的答案。他甚至沒有把握再見到光時，自己能否隱瞞今夜所發生的事情。
      　　
      　　古·拉哈·提亞輕嘆口氣，正準備離開，卻忽然聞見一股從門縫間滲出的酒氣。

      　　他的眉頭立刻皺了起來。

      　　「光？」

      　　他壓低聲音喚了一句，房內並沒有回應。

      　　一股難以言明的不安驟然掠過心頭。

      　　古·拉哈·提亞猶豫片刻，最終還是抬起手，輕輕推開了沒有落鎖的房門。

      　　眼前的景象，讓他的瞳孔止不住地震動。

      　　即使夜已深，光也還沒有入睡。

      　　屋內沒有點燈，唯有微薄的月光從窗外落下，照亮他隱沒在黑暗中的側臉。

      　　光坐在窗邊，腳下散落著幾個空酒瓶，桌上也擺著尚未喝完的酒。濃烈的氣味充斥著整個房間，沉悶得令人幾乎無法呼吸。

      　　而他的手中，正握著那枚錐形晶體。
      　　
      　　光低著頭，靜靜地凝視著它。

      　　修長的手緊緊包覆著水晶，手指一次次撫過水晶的紋路。

      　　古·拉哈·提亞的胸口猛地一緊。

      　　他下意識後退半步，鞋底卻不慎擦過門檻，發出細微的聲響。

      　　窗邊的人動了一下。

      　　「拉哈……？」

      　　那聲音很輕，帶著濃重的醉意與沙啞。

      　　古·拉哈·提亞渾身一僵。

      　　光緩緩抬起頭。

      　　那雙向來澄澈而堅定的藍眼，此刻蒙著一層模糊的水霧，他的目光落在古·拉哈·提亞身上，卻帶著茫然與迷惘，如同迷路的旅人，找不到前進的方向。

      　　「拉哈……」

      　　光又喚了一次，比方才更低，也更加清晰。

      　　古·拉哈·提亞的手指無聲地蜷緊。

      　　這個名字，明明也屬於他。

      　　可在知曉光與水晶公的過去後，他的呼喚卻像一根冰冷的針，緩慢而精準地刺進胸口。

      　　光看見的是誰？

      　　是現在站在他面前的古·拉哈·提亞，還是那個曾在其他世界，與他並肩走過漫長旅程的水晶公？

      　　「你喝得太多了。」

      　　古·拉哈·提亞竭力壓下內心種種負面的想法，讓自己的聲音維持平穩。

      　　「我去找點醒酒的東西。」

      　　他轉身便想離開，身後卻傳來一陣凌亂的腳步聲。

      　　下一瞬，光抓住了他的手腕。

      　　「別走。」

      　　古·拉哈·提亞停住了。

      　　抓著他的手指收得很緊，像是害怕只要稍微鬆開，他便會立刻從眼前消失。

      　　「……先放開我。」

      　　光沒有回答。

      　　他只是向前一步，從身後緊緊抱住了古·拉哈·提亞。

      　　那力道大得近乎疼痛，彷彿試圖將他按入骨髓之中。

      　　古·拉哈·提亞的背脊瞬間僵住。

      　　光將臉埋進他的髮間，灼熱而急促的氣息落在耳側。他的身體正在微微顫抖，像是在懼怕著什麼。
      　　
      　　「別總是讓我看著你的背影……從我眼前離去。」

      　　那句話落下時，古·拉哈·提亞只覺得胸口驟然一痛。
      　　
      　　確實，他們上一次的分別，來自於自己封閉水晶塔之時。
      　　
      　　但或許，這句話也適用於另一位離去的人。

      　　現在的他根本無法確認，這句話究竟是對誰說，更不知道光是不是透過他，來擁抱另一個時空的自己。

      　　古·拉哈·提亞垂下眼，視線落在光仍握著晶體的手上。

      　　那枚晶體近在咫尺。

      　　其中沉睡著水晶公，也沉睡著光無法放下的一切。

      　　一股苦澀湧上心頭。

      　　他不想承認，竟然會羨慕起另一個自己，即使已經無法醒來，仍舊能讓光露出這樣的神情。
      　　
      　　而對於懷抱這樣想法的自己，他也感到厭惡。

      　　古·拉哈·提亞抬手，覆上環在自己腰間的手臂。

      　　「放開我。」

      　　他的聲音很低，語氣顫抖卻十分堅定。

      　　光的手臂卻反而收得更緊。

      　　「別走。」

      　　那句近乎哀求的低語，使古·拉哈·提亞的動作停頓了一瞬，可他還是咬緊牙關，試圖轉過身。

      　　「你喝醉了，你並不知道自己在做什麼。」

      　　光像是沒有聽見。

      　　在古·拉哈·提亞轉身的瞬間，他忽然俯下身，重重吻住了他的唇。

      　　濃烈的酒氣與滾燙的呼吸一同壓了下來，連同急切又凌亂的渴望，齊齊壟罩住他。

      　　古·拉哈·提亞睜大眼睛。

      　　短暫的空白過後，胸口立刻湧起尖銳的刺痛。

      　　「唔……光……」

      　　他偏過頭，試圖避開那道灼熱的氣息，緊握成拳的雙手抵上光的胸膛，用力將他向外推。

      　　「住手……！」

      　　光被推開了些許。

      　　可下一刻，他便再次低下頭，吻過古·拉哈·提亞的臉頰與唇角，動作依然急促，甚至帶著某種壓抑不住的絕望。

      　　「拉哈……」

      　　光一遍又一遍地喚著他的名字，急切地渴求令他安心的溫度與氣息，但每一次的呼喚，卻將古·拉哈·提亞再度往懷疑的深淵推近了些。
      　　
      　　這撕心裂肺的呼喊，究竟是對誰的渴求？

      　　他用力掙扎，眼眶卻不受控制地泛起一陣熱意。
      　　
      　　胸口好痛、內心好痛、痛得不知道該怎麼辦才好。

      　　「我不是……」

      　　話到了嘴邊卻驟然停住。

      　　他沒有說下去，他無法看著光的眼睛說下去。

      　　那雙藍眼裡沒有平日的堅定，也沒有英雄面對眾人時近乎無所不能的從容，只有濃烈得幾乎令人窒息的孤獨與悲傷。
      　　
      　　酒精完全擊碎了他一直以來的偽裝，現在在古·拉哈·提亞面前的，不過是一個失去重要之人的普通人。

      　　古·拉哈·提亞的力道不由自主地鬆了一瞬，而光立刻察覺了。

      　　他重新將人抱緊，低頭埋進古·拉哈·提亞的頸側。炙熱得幾乎讓人灼傷的親吻沿著臉頰落下，一路蔓延到頸間。
      　　
      　　冰涼的淚珠忽然落在光的手背上，打斷了這一切。

      　　光的動作驟然停住。

      　　他抬起頭，怔怔地望著古·拉哈·提亞。那雙因醉意而顯得渙散的藍眼，發愣地看著溢滿水霧的紅眼。

      　　古·拉哈·提亞別過臉，不願讓他看見自己此刻的表情。

      　　「對……不起……」

      　　光的聲音沙啞而破碎。

      　　他抬起手，小心翼翼地捧住古·拉哈·提亞的臉，指腹笨拙地拭過那道淚痕。

      　　「我只是……想保護你。」

      　　光低聲說，藍眼仍蒙著醉意，神情卻痛苦得近乎清醒。

      　　古·拉哈·提亞僵著身體，眼睛驚訝地微微瞪大。
      　　
      　　光並沒有察覺，斷斷續續地用破碎的嗓音喃喃。
      　　
      　　「我看過他走了太久。」

      　　「看著他把所有痛苦都藏起來，裝作什麼事都沒有，無論背負著什麼都不讓我知道，總是笑著面對一切……」

      　　光低下了頭，嗓音從緊咬著的唇洩出。

      　　「我不能……再讓你也變成那樣。」

      　　古·拉哈·提亞怔怔地望著他，猶豫的瞬間，光將他逼退了幾步。

      　　他的膝彎撞上床沿，失去平衡，向後跌坐在柔軟的床褥上。

      　　光緊跟著俯下身，將他困在雙臂之間。

      　　那雙藍眼近在咫尺。

      　　醉意讓他的目光變得模糊，可其中的痛苦卻清晰得無處可藏。

      　　古·拉哈·提亞再次抬手抵住他的肩膀。

      　　「光……」

      　　他試圖想讓眼前的人清醒一點。

      　　然而光只是低下頭，額頭抵著他的肩頸，呼吸凌亂得不像話。

      　　「我不能再失去你。」

      　　他的祈願低得幾乎破碎。

      　　古·拉哈·提亞的手指顫了一下，拒絕的力氣瞬間消失殆盡。

      　　眼前的人已經獨自懷抱這些記憶太久。

      　　他明明帶回了水晶公，卻不敢真正讓那個人醒來，明明守著失而復得的靈魂，卻只能一次又一次回想自己目送對方消失的瞬間。

      　　在喚醒水晶公與保護現在的古·拉哈·提亞之間，光做出了選擇。

      　　他只能將所有痛苦都留給了自己。

      　　古·拉哈·提亞不知道，光清醒後是否會記得今晚，不知道當光真正看清楚他時，是否還會願意用這樣的目光注視他。

      　　更不知道自己此刻若是留下，究竟是出於愛，還是出於不忍。

      　　可是這些疑問，都無法讓他放任光獨自一人。

      　　因為即使沒有水晶公的記憶，即使沒有共同旅行的歲月，他也已經喜歡上了光。

      　　從第一次聽見那些冒險，第一次仰望英雄的背影，第一次想追上那個人的腳步開始。

      　　那份感情或許還不及水晶公漫長歲月中的深沉，卻同樣真實、無可退讓。

      　　也正因如此，他無法看著光在自己面前露出這樣的神情，然後轉身離去。

      　　古·拉哈·提亞緩緩放下抵在光肩上的手。

      　　光像是感覺到了他的退讓，重新吻住了他。

      　　他閉上眼，任由那道灼熱的氣息覆上自己。

      　　胸口仍然疼得厲害。

      　　可那擁抱著自己的力道實在太過絕望，彷彿一旦失去懷裡的溫度，他便會再度墜落。

      　　古·拉哈·提亞的眼角泛起濕意。

      　　他抬起手，抓住了光胸前的衣料，一點點將人拉得更近。

      　　光的動作停頓了一瞬。

      　　緊接著，那些壓抑已久的情緒便更加猛烈地傾瀉下來。

      　　光吻過他的唇角，吻過頸側，雙臂緊緊纏著他，不肯留下任何能讓他逃離的縫隙。

      　　古·拉哈·提亞的呼吸逐漸凌亂。

      　　他很害怕。

      　　害怕明日醒來後，光會為這一切後悔，也害怕自己只是在承接另一個人的位置。

      　　可當他睜開眼，看見那雙近在咫尺的藍眼時，心中的拒絕卻再次鬆動。

      　　古·拉哈·提亞無法將這樣的他推開。

      　　至少今晚不行。

      　　至少此刻，他做不到。
      　　
      　　是他自己選擇留下，哪怕只是暫時。
      　　
      　　哪怕天亮之後，他們終究必須面對一切。

      　　光的手指抓住他的衣襟，動作急切而凌亂，隨後再次俯下身，灼熱的吻落在他的頸側。

      　　古·拉哈·提亞抓緊了身下的床褥，呼吸微微發顫。

      　　而當光的手指探向他的衣襟時，他只是閉緊眼睛，緩慢地鬆開了原本緊握的手。
  - title: 第六章
    body: |-
      　　光是被劇烈的頭痛喚醒的。
      　　
      　　意識尚未完全清明，太陽穴便先傳來一陣一陣的抽痛，他皺起眉，下意識抬手按住額頭。
      　　
      　　指尖才剛碰上皮膚，昨夜殘留的酒氣便隨著呼吸湧了上來。
      　　
      　　濃烈、苦澀，還帶著令人作嘔的酸意。
      　　
      　　光閉著眼，緩慢地吸了一口氣，他的腦中一片混亂，破碎的畫面在意識深處浮浮沉沉。
      　　
      　　月色。
      　　
      　　散落在地上的酒瓶。
      　　
      　　掌心冰冷的吸魂晶。
      　　
      　　還有一雙盛滿淚水的紅眼。
      　　
      　　光的呼吸忽然停住，急忙睜開眼睛。
      　　
      　　清晨的光從窗簾縫隙間照進房裡，在凌亂的床褥上落下一道刺眼的亮色。
      　　
      　　視野尚未完全聚焦，他便感覺到身旁傳來另一個人的呼吸。
      　　
      　　很輕，很安靜。
      　　
      　　光的身體驟然僵住，不可置信地望著床邊的身影。
      　　
      　　古·拉哈·提亞正背對著他，蜷縮在床的另一側，以往編成辮子的鮮紅髮絲凌亂地散落在枕間，浸在晨光裡顯得格外清晰。被褥只拉到肩下，露出後頸與一小片背脊。
      　　
      　　那片皮膚上，殘留著過於明顯的痕跡。
      　　
      　　光的瞳孔微微收縮。
      　　
      　　腦海中那些斷裂的片段，忽然像被一股無形的力量強行拼湊在一起。
      　　
      　　急促的呼吸。
      　　
      　　被自己緊緊抓住的手腕。
      　　
      　　他偏過頭時，從眼角滑落的淚。
      　　
      　　還有自己一次又一次的渴求，近乎失控地喊著他的名字。
      　　
      　　光的臉色瞬間褪得一片蒼白，他試圖朝前方伸手，床鋪卻因他的動作微微下陷。
      　　
      　　古·拉哈·提亞的耳朵輕輕動了一下。
      　　
      　　「……醒了？」
      　　
      　　他的聲音帶著剛醒時的沙啞。
      　　
      　　光的動作停住。
      　　
      　　古·拉哈·提亞沒有立刻轉身，他依舊背對著光，不知是刻意留給彼此一點能夠喘息的空間，還是已經不願再看見他。
      　　
      　　房裡安靜得令人難受。
      　　
      　　光起身坐在床沿，垂著頭，許久都沒有說話。
      　　
      　　「酒醒了……有好點嗎？」
      　　
      　　古·拉哈·提亞先打破了沉默，他的語氣很平靜，甚至平靜得有些不自然。
      　　
      　　光張了張嘴。
      　　
      　　「拉哈……」
      　　
      　　才剛喊出名字，他的聲音便啞了下去。
      　　
      　　古·拉哈·提亞慢慢睜開眼，他沒有回頭，只是望著眼前被晨光照亮的牆面。
      　　
      　　「嗯。」
      　　
      　　光的喉結艱難地滾動了一下。
      　　
      　　「昨晚……」
      　　
      　　「事情沒有你想得那麼嚴重。」
      　　
      　　過於平淡的嗓音接近冷漠，卻意外地十分堅定，彷彿這句話已經在內心醞釀多時，古·拉哈·提亞此刻只不過是將它平靜地背誦而出。
      　　
      　　光的臉色更加蒼白。
      　　
      　　「但我……」
      　　
      　　「是我自己選擇留下的。」
      　　
      　　古·拉哈·提亞打斷了他。
      　　
      　　「我並不是想說昨晚什麼都沒有發生，也不是要你假裝忘記。」他垂下瀰漫著水霧的紅眼，「只是，這是我自己做出的決定。」
      　　
      　　光的唇動了動，卻沒有發出聲音。
      　　
      　　他顯然並沒有因為這句話感到安慰，反而更加無法理解。
      　　
      　　「為什麼？」
      　　
      　　他問，那聲音輕得近乎無力，雙拳卻用力地握緊。
      　　
      　　「明明是我強迫你，為什麼你要將一切擔在自己身上？」
      　　
      　　聽見他憤怒的聲音，古·拉哈·提亞終於翻過身，拉高被褥，遮住自己的肩頸。
      　　
      　　他的耳朵微微向後壓著，臉頰也泛起不自然的紅。
      　　
      　　「因為我沒有辦法放著你不管。」
      　　
      　　「那也不能是你勉強自己的理由！」
      　　
      　　憤怒與自責佈滿光的臉龐，古·拉哈·提亞卻仍舊勉強維持著平靜。
      　　
      　　他垂著頭，紅髮垂落下來，遮住了大半神情。
      　　
      　　「昨晚的事，不是只有你的錯。」
      　　
      　　他說得很慢，每一個字都像經過了艱難的掙扎。
      　　
      　　「我並不後悔自己的選擇……除非，你眼裡看見的，並不是現在的我。」
      　　
      　　「這是……什麼意思？」
      　　
      　　「我見過水晶公了。」

      　　古·拉哈·提亞輕聲說。

      　　話音落下的瞬間，光的神情驟然凝固。

      　　古·拉哈·提亞緩緩坐起身，隨著他的動作，被褥自肩頭滑落，露出頸側與鎖骨間尚未消退的紅痕。

      　　他緩緩伸手攏緊被子，將那些過於鮮明的痕跡遮住。也不知是因為清晨的寒意，還是終於說出了埋藏在深處的心意，他的肩膀始終微微顫抖著。

      　　光卻已經無暇注意其他。

      　　「為什麼……」

      　　他的嗓音驟然收緊。

      　　「為什麼你會見到他？」

      　　下一刻，光猛地伸出手，握住古·拉哈·提亞的肩膀，那動作太過急切，指尖幾乎立刻陷入被褥之中。

      　　「你碰過吸魂晶了嗎？」

      　　「那些記憶呢？你看見了多少？有沒有哪裡不舒服？」

      　　他的問題接連落下，語速快得幾乎沒有留下回答的空隙。

      　　「頭痛嗎？意識有沒有混亂？有沒有突然想起不屬於你的事情？」

      　　古·拉哈·提亞怔怔地看著他。

      　　透過光按在肩上的雙手，他能清楚感覺到那份顫抖。

      　　那雙藍眼才剛因酒意退去而恢復清明，此刻卻又蒙上了近乎碎裂的陰影。

      　　「光。」

      　　古·拉哈·提亞輕聲喚他，可光彷彿沒有聽見，如同正處於惡夢之中，且無法甦醒。

      　　「我應該把它收得更好……不，我根本不該把它留在這裡！」

      　　他的手指越收越緊，聲音也逐漸失去平穩。

      　　「是我疏忽了，如果那些記憶已經影響你──」

      　　「光。」

      　　古·拉哈·提亞再次叫住他，伸手覆上他的手背。

      　　「我沒事。」

      　　光的話音戛然而止。

      　　古·拉哈·提亞迎著他驚惶的目光，緩慢而清楚地搖了搖頭。

      　　「我沒有接收那些記憶，也沒有碰到完整的靈魂。」

      　　光仍然僵著身體，像是尚未真正理解他的意思。

      　　「水晶公只在吸魂晶的外層留下了一小部分自己。」古·拉哈·提亞低聲解釋，「不足以影響我，他也沒有將任何記憶強行交給我。」

      　　「他只是來見我一面。」

      　　他的指尖在光的手背上輕輕收攏。

      　　「把你一直不願意告訴我的事情，簡略地向我說了一遍。」

      　　光的瞳孔微微顫動，緊繃的手指終於鬆開了一些，臉上的血色卻沒有因此恢復。

      　　他垂下眼，無法直視古·拉哈·提亞。

      　　「……原來……是這樣。」

      　　那聲音很低，帶著深沉而無力的疲憊。

      　　古·拉哈·提亞看著他，胸口忽然泛起一陣酸澀。

      　　明明是光選擇了隱瞞。

      　　可此刻，他看起來卻不像一個秘密被揭穿的人，反而像是那道苦苦支撐的防線，終究還是在自己眼前崩塌了。

      　　「光。」

      　　古·拉哈·提亞輕喚到。

      　　「你昨晚告訴我，你只是想保護我。」

      　　光的身體僵了一下。顯然，那句話已經不在他殘存的記憶之中。

      　　古·拉哈·提亞繼續說了下去。

      　　「你說，你看著他走了太久，也看著他把所有痛苦都藏起來，總是裝作若無其事的模樣。」

      　　他停頓片刻。

      　　「你不想讓我也變成那樣。」

      　　光的嘴唇微微張開，卻沒有發出聲音。
      　　
      　　古·拉哈·提亞望著他，努力牽起唇角，卻發現自己無論如何也笑不出來。
      　　
      　　「可是，我也不想看見你獨自懷抱著這些記憶，孤單地走下去。」
      　　
      　　「我不想看著你，每天都活在掙扎跟痛苦中。」

      　　古·拉哈·提亞垂下眼，緊緊攥住身前的被褥。

      　　接下來的話明明早已在心裡翻湧了無數次，真正到了必須說出口的時候，喉嚨卻像被什麼堵住，連呼吸都變得困難。

      　　可他不能再退縮。

      　　水晶公將選擇交給了他，那麼，他至少也該將自己的心意好好傳達給光。

      　　「我也想守護你。」

      　　古·拉哈·提亞終於開口，他的嗓音在顫抖，卻沒有移開視線。

      　　「守護我最喜歡、最憧憬的英雄。」

      　　光的呼吸停了一瞬。

      　　古·拉哈·提亞的耳尖迅速染上紅色，眼眶卻也跟著泛起一陣酸熱。

      　　「而且，我真的很不甘心。」

      　　最後幾個字幾乎帶上了哽咽。

      　　光怔怔地看著他。

      　　古·拉哈·提亞用力吸了一口氣，可第一滴淚仍舊在他開口之前，毫無預兆地落了下來。

      　　他知道自己現在的模樣一定很狼狽。

      　　聲音發顫，眼淚也止不住，連攥著被褥的手都在微微發抖，但這是屬於他的感情，是此刻最真實、也最不願再隱藏的心意。
      　　
      　　他無論如何，都得靠自己完整地傳達出來。

      　　「明明我們是同一個人……」

      　　古·拉哈·提亞努力維持著聲音。

      　　「可他比我更早遇見你，也陪伴了你更久。」

      　　「他為你跨越了漫長的時間，前往另一個世界，和你一起走過了我不曾參與的旅程。」

      　　他的聲音裡透出一點無法掩飾的苦澀。

      　　「他比我更加了解你。」

      　　「知道你曾經經歷過什麼，知道你會為什麼事情猶豫，也知道該怎麼站在你的身邊。」

      　　古·拉哈·提亞抬手抹著臉頰，手背上滿是濕潤的眼淚，卻很快又有新的濕意湧上眼眶。

      　　「他甚至在你的心裡，留下了一個我怎麼也追不上的位置。」

      　　光的神色一痛。

      　　「拉哈，那不是──」
      　　
      　　「我知道這麼說另一個自己很奇怪。」

      　　古·拉哈·提亞打斷他，語氣並不尖銳，只帶著一種近乎難堪的坦白。

      　　「我也知道，他所做的一切，都是為了你。就連你現在能好好地在我面前，也都是他的功勞。」

      　　「可是就算明白，我還是會羨慕。」

      　　他抿緊唇。

      　　「還是會覺得不甘心。」

      　　光望著他，眼底的情緒劇烈地翻湧，卻始終沒有打斷。

      　　古·拉哈·提亞緊握著被褥的手慢慢鬆開。

      　　「我也想陪在你身邊。」

      　　他說。
      　　
      　　「不是被你保護在身後，而是能站在你的身邊，和夥伴們一起挑戰各種謎團，就像我們調查水晶塔時一樣。」
      　　
      　　『與志同道合的夥伴們迎難而上……揭開千年謎團的面紗……』

      　　那道久遠的聲音，毫無預兆地在耳邊響起。

      　　光怔怔地望著古·拉哈·提亞。

      　　晨光從窗邊落下，將眼前人的輪廓照得模糊。那張尚且年輕的臉，與記憶中覆著水晶的面容緩慢重疊。

      　　明明是不同的神情。

      　　可當他們說出那份願望時，聲音竟如此相似。

      　　「我想親眼看見你所見過的風景，一起體會你經歷的一切。」
      　　
      　　『如果你的未來有我──』

      　　兩道聲音在光的耳中交疊。

      　　而光直到現在，才真正聽懂那句話。

      　　那不是臨別前脫口而出的奢望，也不是漫長等待後，終於不願再壓抑的任性，而是從很久以前，早在水晶塔甦醒以前，便存在於古·拉哈·提亞心中的願望。

      　　無論是否經歷百年，無論是否成為水晶公，無論世界被改變成何種模樣，他都想走到自己身邊。
      　　
      　　光一直害怕，接納水晶公的記憶後，古·拉哈·提亞便會失去現在的自己，可他直到此刻才明白，那份想要陪伴在自己身邊的心意，並不會是水晶公的記憶強加給他的。

      　　那本來就是屬於古·拉哈·提亞的願望，是無論走過哪一條道路、無論經歷多少歲月，都不會輕易改變的東西。
      　　
      　　光的視線逐漸模糊。

      　　眼前的古·拉哈·提亞堅定地凝視著他。

      　　那雙鮮紅的眼睛裡有淚光，也有難堪與不甘，卻沒有半分退縮。
      　　
      　　光終於無法再維持平靜，胸口積壓已久的情緒一瞬間潰散，連呼吸都變得支離破碎。

      　　他幾乎沒有經過思考，便伸手將古·拉哈·提亞緊緊抱進懷裡。

      　　古·拉哈·提亞被那突如其來的力道撞得微微一晃，卻沒有掙扎。

      　　光將臉埋進他的肩頸間，眼淚毫無預兆地落了下來。

      　　潰堤一旦開始，便再也無法停下。

      　　那些積壓了太久的悲傷、愧疚與恐懼，終於在這個清醒的早晨徹底宣洩。
      　　
      　　他沙啞的嗓音不斷地喚著他的名字，止不住地道歉。

      　　古·拉哈·提亞沒有說話，只是抬起手，安靜地環住他，手掌輕柔又小心翼翼，一下下撫著他的背。
      　　
      　　窗外的晨光逐漸明亮。

      　　落在凌亂的床褥上，也落在那枚安靜躺在一旁的吸魂晶上，晶體溫潤的光芒照映著兩抹受傷的靈魂。
      　　
      　　一端朝向光，另一端則指向古·拉哈·提亞。
  - title: 終章
    body: |
      　　清晨的喪靈鐘仍籠罩在一層薄霧之中。

      　　天色才剛亮起不久，遠方的山巒還沉在灰藍色的陰影裡，道路兩旁尚未消散的霜塵已經被清冷的晨風捲起。

      　　光與古·拉哈·提亞並肩走出第七天堂。

      　　兩人的手仍牽在一起。

      　　起初只是光下意識地伸出手，緊緊地握住他，彷彿害怕他隨時消散。

      　　古·拉哈·提亞低頭看了一眼，也稍微收緊手指，將彼此的掌心貼得更近了一些。

      　　從喪靈鐘前往水晶塔的道路並不算短。

      　　他們沿著湖畔向前，腳下的石路因長年風霜而顯得斑駁，縫隙間生著低矮而堅韌的雜草。淡白色的霧氣浮在摩杜納的湖面上，遮去了大半倒映其中的塔影，只餘下高處閃爍的藍光，時隱時現地穿透晨霧。

      　　越是靠近，水晶塔的輪廓便越發清晰。

      　　那座沉睡了漫長歲月的巨塔，如今依舊安靜地矗立在天地之間。

      　　古·拉哈·提亞抬起頭，望著那座自己曾經親手封閉的高塔。

      　　明明只是離開了一段時間，此刻再度站在這裡，心情卻與過往截然不同。

      　　他曾以為，自己踏入水晶塔的那一天，便已經做好了將一切託付給未來的準備。

      　　可直到如今他才知道，那個未來遠比自己想像中漫長，也更加曲折。

