  - body: |-
      　　鋒利的劍尖漫不經心地戳著一隻縮成一團的礦石爬蟲，一聲聲清脆但毫無殺氣的頓聲迴盪在四周。魔物用堅固的礦石背部保持防禦的姿勢，兩隻眼睛卻困惑地盯著眼神空洞的英雄。
      　　
      　　握著劍柄的光正毫無形象地癱在石堆旁，像是一具被抽乾了靈魂的空殼。
      　　
      　　「光……拜託你快起來吧……這樣坐在地上，盔甲會沾上泥土的……」
      　　
      　　阿爾菲諾一臉頭疼地站在一旁，雙手努力提拉著光的手臂，然而一名成年男子哪是他能扛起的對象，光只是懶洋洋地看了精靈一眼，手中的劍依然有一下沒一下地戳著困惑的魔物。
      　　
      　　這副半死不活的模樣，從古·拉哈·提亞因為研究不得不暫時離開拂曉起算，已經持續了整整大半個月。
      　　
      　　儘管出發前，古·拉哈·提亞曾多次重申自己會盡快回來，光也確實很聽話，既沒有耍賴吵著要跟，也沒有每天用通訊珠打擾他，看似懂事又體貼，整個人卻以肉眼可見的速度乾枯了下去。
      　　
      　　他該死地想念那總是追隨自己的紅色眼眸、那回過頭就能看見的毛茸茸貓耳，還有活力滿滿、喚著自己名字的聲音。自從那人不在身邊，光彷彿對冒險失去了興致，哪怕拂曉把各種驚險刺激又玩命的委託塞到他面前，光也只是擺著一張生無可戀的臉，連出門都像是在夢遊。
      　　
      　　現在他的狀態，如果不是熟識的人，根本不會將這名乾巴巴的男子與拯救世界的大英雄聯想在一起。
      　　
      　　「喂，這副樣子像什麼話。」
      　　
      　　一旁的艾斯蒂尼安看了看阿爾菲諾因過度使力而漲紅的臉，雙手環胸、眉頭緊緊擰在一起。
      　　
      　　「前面的氣息不太對，我們要找的水晶應該就在前面。」他沉聲道：「別亂戳了，跟我進去看看。」
      　　
      　　若是放在平時，不用其他人提點，感知到的英雄早就提著武器第一個往前衝。然而此刻，光只是維持著癱倒的姿勢，眨了眨無神的雙眼，慢吞吞地重複了一句：「……水晶啊。」
      　　
      　　那雙藍眼稍稍亮了起來，眼底卻閃過一絲危險的光芒。
      　　
      　　光幽幽地低喃著：「有水晶的話……如果現在祈禱，是不是就可以召喚出拉哈？」
      　　
      　　站在不遠處的桑克瑞德差點把武器掉在地上，他嘴角抽搐了兩下，絕望地扶住額頭。
      　　
      　　「拂曉的英雄居然開始考慮召喚蠻神，這還有救嗎？」
      　　
      　　阿莉塞也沒好氣地雙手抱胸，大聲問道：「拉哈的研究到底要持續多久？」
      　　
      　　眼見狀況不對，尤里安傑伸手拍了拍她的肩膀，一邊走了過來、在光的身旁蹲下。吟詩般的溫和嗓音柔聲勸著：「別忘了你們的約定……他曾說回來之時，要聆聽你講述這段日子裡歷經的全新冒險……」
      　　
      　　聞言，光手上的動作終於停了下來。礦石爬蟲逮住機會，一溜煙地逃走了。
      　　
      　　英雄沉默了半晌，終於慢吞吞地從地上撐起身，隨後一言不發地跟在尤里安傑身後，遊魂般地朝著洞窟深處挪動腳步。
      　　
      　　這種度日如年的折磨，拂曉的眾人忍受了整整一個月。直到某日午後，石之家的門終於被推開，風塵僕僕的古·拉哈·提亞大包小包地踏了進來，他精神地豎著耳朵、習慣性地喊道：「我回來了──」
      　　
      　　凝結的氣氛，讓他臉上的笑容頓時僵住。
      　　
      　　雙胞胎的眼神一個哀怨一個擔憂，阿莉塞的臉上甚至寫著『你再不回來我就要瘋了』；桑克瑞德像是陪了十個孩子玩了數個日月的疲憊父親，臉頰上一貫掛著的笑容都有些苦澀。
      　　
      　　古·拉哈·提亞困惑地望著艾斯蒂尼安意味深長的眼神，耳朵不安地往後壓了壓。
      　　
      　　「大、大家怎麼都用這種眼神看著我？難道我離開的這陣子發生了什麼大事嗎？」
      　　
      　　還沒等任何人開口回答，陰影處忽然飄過來一道幽靈般的身影。
      　　
      　　古·拉哈·提亞甚至還沒看清對方的動作，懷裡的行囊便被一股不容分說的力道卸到一旁的地毯上。下一秒，一個沉重的溫熱身軀猛地撞進了他懷裡。
      　　
      　　「唔哇？！」
      　　
      　　貓魅被撞得踉蹌了半步，他豎著尾巴、努力找回平衡，一雙長臂已經往前伸出、牢牢環住了他的後腰。
      　　
      　　光將整張臉深深埋進了古·拉哈·提亞的頸窩處，用力吸了一大口，又滿足地嘆了口氣。他整個人黏糊糊地掛在貓魅身上，不負責任地將所有重量都交給古·拉哈·提亞。
      　　
      　　青年先是一愣，隨後看見了同伴們紛紛翻著白眼、搖著頭鳥獸散的背影，終於明白了這幾天究竟發生了什麼。
      　　
      　　他忍不住笑了笑，低沉的嗓音在胸腔鳴響，一邊努力騰出雙手、抱住身前的人，手掌輕輕地放上後腦的頭髮，一下又一下安撫地順著他的後頸。
      　　
      　　古·拉哈·提亞低下頭，臉頰親暱地蹭了蹭光的鬢角，聲音裡帶著欣喜與忍耐多日的眷戀。
      　　
      　　「回來了回來了……讓你久等了。」
      　　
      　　「真的等很久。」光低聲埋怨，但聲音總算有了些精神，「消失一個月，你接下來得陪我旅行兩個月，算是補償。」
      　　
      　　紅眼笑得彎成了兩道弦月。
      　　
      　　古·拉哈·提亞垂下手，悄悄勾住光的小指，認真地許諾。
      　　
      　　「別說兩個月，」他笑著說：「兩年都陪你。」
