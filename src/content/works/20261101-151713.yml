      　　深夜的石之家，比白日安靜許多。
      　　
      　　走廊上的燈只留了幾盞，昏黃的光沿著牆面緩緩延伸，從門縫滲入賢人們各自的房內。
      　　
      　　古·拉哈·提亞坐在書桌前，手邊還攤著幾份尚未整理完的資料。儘管夜已深，他原本並沒有休息的打算，此刻卻再也無法繼續下去。
      　　
      　　他將靠在桌面的右手輕輕握緊，又慢慢放開，試圖舒緩末梢傳來的異狀。
      　　
      　　方才還只是指尖微微發麻，如同長時間維持著同一個姿勢，血液不流通所導致，可下一瞬，疼痛便沿著右手猛然竄了上來。
      　　
      　　他倒抽一口氣，下意識咬緊牙關。
      　　
      　　手臂上沒有傷口，也沒有任何肉眼可見的異常。
      　　
      　　那隻手依舊屬於一個活生生的人，皮膚溫熱，關節靈活，不是半透明的結晶，也沒有閃爍著冷光的晶簇自血肉中生長。
      　　
      　　然而疼痛卻真實得可怕。
      　　
      　　彷彿有無數尖銳的碎片在皮膚之下緩慢凝結，先是指尖、接著越過掌心，一寸一寸向手腕攀附，每一根骨骼都像被冰冷的水晶包裹，在細微的摩擦中，發出只有他能聽見的碎裂聲。
      　　
      　　古·拉哈·提亞閉上眼，左手緊緊扣住右腕。
      　　
      　　「……已經不是終端了，沒事的。」
      　　
      　　他低聲安撫自己的身體，聲音在空蕩的房間裡顯得格外清晰。
      　　
      　　可身體並不聽從他的勸說，疼痛竟愈演愈烈。
      　　
      　　就像是最初水晶化時的感覺。

      　　最初是全身無處可逃的鈍痛，水晶塔的力量在體內膨脹，讓原本的血肉逐漸失去它原始的模樣。後來，完全結晶的部分徹底失去活動能力，他最後只得將凝固的晶體敲碎，再以魔法重新連接。
      　　
      　　那方法確實亂來，卻也意外地有效。此後，水晶化的部位不再時刻傳來劇痛，只有在他過度借用水晶塔的力量時，那股刺骨的感覺才會再次襲來。

      　　諷刺的是，每當疼痛出現，他竟會感到一絲安心──至少那證明了，身體的那一部分仍確實屬於自己。
      　　
      　　第一世界有太多必須由水晶公完成的事。
      　　
      　　守護水晶都、召喚異界的英雄、等待那個或許永遠不會降臨的希望。
      　　
      　　相比之下，一具逐漸化為水晶的軀體，實在算不了什麼。
      　　
      　　古·拉哈·提亞緩緩伏下身，額頭抵在交握的雙手上。
      　　
      　　冷汗自鬢角滑落，他嘗試透過深呼吸來沖淡疼痛，卻徒勞無功。
      　　
      　　他咬緊牙關，試著伸手去拿桌角的藥瓶，手指卻在碰到瓶身前失去了力氣。
      　　
      　　玻璃瓶被他掃落，撞上地面，發出清脆的聲響。
      　　
      　　房門幾乎在同一時間被推開。
      　　
      　　「拉哈？」
      　　
      　　那個聲音出現的瞬間，古·拉哈·提亞的身體本能地僵了一下。
      　　
      　　光站在門外，手還停在門把上，顯然只是恰好經過，卻被方才的聲音引了過來。
      　　
      　　他抬起頭，很快便露出了微笑。
      　　
      　　「抱歉，吵到你了嗎？」他說，「不小心碰倒了東西。」
      　　
      　　光沒有回答，視線落在他按著右腕的左手上。
      　　
      　　注意到他的目光，古·拉哈·提亞下意識鬆開手，輕微的動作卻仍被英雄收盡眼底。
      　　
      　　「手怎麼了？」
      　　
      　　「看資料看得太久，手有些發麻，休息一會兒就沒事了。」
      　　
      　　不理會他的解釋，光走進房間，反手關上門。或許早就知道古·拉哈·提亞沒打算說實話，他乾脆地來到桌前，在貓魅的身前蹲下。
      　　
      　　「給我看看。」
      　　
      　　古·拉哈·提亞眨眨眼，再次溫和地朝他微笑。
      　　
      　　「真的沒有大礙。」
      　　
      　　「古·拉哈·提亞。」
      　　
      　　被那人直呼名字，古·拉哈·提亞忽然說不出下一句話。
      　　
      　　他看著眼前的人，恍惚間，又想起很久以前那個站在水晶塔下的身影。
      　　
      　　那時他是水晶公。
      　　
      　　跨越漫長的光陰，隔著一身不願被認出的長袍與兜帽，克制著幾乎要溢出胸口的喜悅，只敢以異鄉的引路人自居。
      　　
      　　那時初見面的光，也是這麼喚著那個超越百年不曾使用的名字。
      　　
      　　他完全無視自己的辯解，一雙藍眼直直地凝視著他，像是早已看透一切。
      　　
      　　古·拉哈·提亞輕笑著垂下了頭。
      　　
      　　也許從一開始，他在這人面前，便早已無所遁形。
      　　
      　　他慢慢將右手伸了出來，光握住了它、仔細看了一會兒，又用掌心輕輕托住他的手。
      　　
      　　溫度貼上來時，古·拉哈·提亞的指尖不受控制地顫了一下。
      　　
      　　「還在痛？」
      　　
      　　「……嗯。」
      　　
      　　「什麼樣的感覺？麻痺、刺骨、還是灼燒感？」
      　　
      　　「像是……以前水晶化的時候。」
      　　
      　　光微微瞪大眼，隨後蹙起眉頭，像是在思考。
      　　
      　　「回來的時候有檢查過，這具身體沒有任何問題，乙太流動正常，也沒有水晶化的跡象。」古·拉哈·提亞望著兩人交疊的手，一邊斟酌著用語、緩緩補充，「所以，大概只是記憶所造成的錯覺。」
      　　
      　　他停了一下，唇邊浮起一絲很淡的笑意。
      　　
      　　「明明這副身體未曾經歷過，靈魂卻還記得，聽起來似乎有些可笑。」
      　　
      　　「一點都不可笑。」
      　　
      　　光的回答很快，讓古·拉哈·提亞怔了怔。
      　　
      　　「那些都是你真實經歷過的事。」光說，「你的記憶、疼痛、水晶塔的侵蝕，都是真的。」
      　　
      　　古·拉哈·提亞低下頭，額前的紅髮落下來，遮住了眼睛。
      　　
      　　「……原來如此。」他勉強笑了一聲。
      　　
      　　「被你這麼一說，我倒像是在刻意逞強了。」
      　　
      　　「不是像，根本就是。」
      　　
      　　光低沉的嗓音平靜地說。
      　　
      　　古·拉哈·提亞微微一愣，隨即無奈地嘆了口氣。
      　　
      　　「你如今說話，似乎比以前更不留情面了。」
      　　
      　　「對某個不怎麼誠實的貓魅，確實需要。」
      　　
      　　「英雄真是嚴格。」
      　　
      　　光站起身，卻沒有放開他，而是將古·拉哈·提亞從椅子上拉了起來。
      　　
      　　「今晚別看了。」
      　　
      　　「但這些資料明早──」
      　　
      　　光看了他一眼。
      　　
      　　古·拉哈·提亞安靜片刻，識趣地把話收了回去。
      　　
      　　他被帶到床邊坐下，光沒有離開，而是在一旁坐了下來。
      　　
      　　「你不回去休息嗎？」
      　　
      　　「等你睡著。」
      　　
      　　「我不是需要人守著的孩子。」
      　　
      　　「孩子確實不會在半夜一個人忍痛。」
      　　
      　　古·拉哈·提亞頓時啞口無言。
      　　
      　　光的手還握著他。
      　　
      　　拇指緩慢摩挲過他的手背，一下下地輕輕揉搓，像是在安撫。
      　　
      　　古·拉哈·提亞看著那個動作，眼神漸漸安靜下來。
      　　
      　　「你還會怕嗎？」光問。
      　　
      　　沒來由地，但他知道對方問的是什麼。
      　　
      　　「會。」
      　　
      　　他坦率地說。
      　　
      　　「偶爾發作時，我甚至不敢立刻睜開眼睛。」他垂下了眼眸，「然後開始思考，是不是最近過度使用力量，讓水晶塔的侵蝕再度開始……」
      　　
      　　光的手忽然收緊。
      　　
      　　古·拉哈·提亞看著兩人交握的手，慢慢低下頭，將額頭抵在光的肩上。
      　　
      　　疼痛仍在掌心深處一陣陣泛起，像遙遠歲月中傳來的回音。
      　　
      　　身旁的另一個溫度，卻讓它似乎不再那麼難受。
      　　
      　　「其實，」他低聲說，「有一件事，我一直沒有告訴你。」
      　　
      　　「在第一世界時，每當水晶化的疼痛變得難以忍受，我便會想起你。」
      　　
      　　「我總告訴自己，只要再多堅持一日，便能離與你重逢的那一天更近一些。」
      　　
      　　「然後，那些疼痛的夜晚，就突然沒那麼難熬了。」
      　　
      　　他的聲音漸漸低下去。
      　　
      　　光沉默了一會兒，伸手將他攬入自己的胸膛。
      　　
      　　古·拉哈·提亞閉上眼，順勢讓自己更貼近那抹溫度。
      　　
      　　他的唇角浮起一抹很輕、卻不再勉強的笑。
      　　
      　　「但是現在，我似乎已經沒辦法忍耐了。」
      　　
      　　「這是不是代表，我變得比以前任性了？」
      　　
      　　光輕輕應了一聲。
      　　
      　　「你可以再要求更多。」他輕聲道：「這點程度，還不算是問題。」
      　　
      　　貓魅的瞳孔微微一震。
      　　
      　　「若是害怕，也可以告訴你？」
      　　
      　　「可以。」
      　　
      　　「若是偶爾……希望你留在身邊呢？」
      　　
      　　「也可以。」
      　　
      　　古·拉哈·提亞安靜了片刻，然後用很輕很輕的嗓音，小聲地說出自己的祈願。
      　　
      　　「那麼，今晚能請你留到天亮嗎？」
      　　
      　　而光沒有用言語回答。
      　　
      　　只是再次握緊他的手。
