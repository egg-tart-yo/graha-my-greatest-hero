title: 守護天節
cp:
  - 拉哈光
  - 光拉哈
  - 歡樂/甜文向
updated: 2026-10-23
summary: 季節活動衍生，有提到一點6版結局，建議6.0跑完再點開
series: 短篇
chapters:
  - body: |-
      　　裝飾著應景雕刻南瓜與漂浮燭火的戶外庭園，此刻正洋溢著熱鬧歡騰的氣氛。在南瓜頭女子的盛情邀請下，跟著來到此處的光站在一盞巨型南瓜燈旁，有些出神地看著庭院中熙熙攘攘的冒險者與市民。
      　　
      　　稍早，他與古·拉哈·提亞約好在這裡碰面，但也不曉得對方是不是被路邊攤販的烤派香味拐走，光等了好一陣子都沒見到人影。正當他百無聊賴地踢著腳邊的落葉時，眼角餘光忽然捕捉到一抹再熟悉不過的紅色身影。
      　　
      　　側邊的頭髮還未用夾子攏起，垂落的紅色髮絲遮蔽了些許面容，但裸露在手臂上的紋身，還有那身線條簡潔、輕便又俐落的弓箭手獵裝，他卻絕不可能錯認──甚至連腰間的配件，都與諾亞調查團那時分毫不差。
      　　
      　　英雄的腳步快過錯亂的思緒，他根本沒多想就急匆莽撞地衝了上去，一把從背後將那隻貓魅族摟進懷裡，熟練又親暱地伸手揉了揉對方毛茸茸的耳尖。
      　　
      　　「拉哈！你這是因為守護天節才特地打扮成我們剛相遇的模樣嗎？」光的聲音裡滿是驚喜與笑意，雙臂更是毫不客氣地收緊，「要是早點跟我說，我也可以把當年戰士的裝備找出來啊！我有時候還真懷念你這時候的模樣……」
      　　
      　　與此同時，兩人的身後也傳來熟悉的腳步聲。
      　　
      　　真正的古·拉哈·提亞正捧著雙人份的食盒──從裡頭的味道判斷，確實是剛出爐的烤南瓜派──朝他們快步走來。青年一見到親暱模樣的兩人，腳步瞬間僵在原地，一雙眼睛不可置信地放大，呆呆地看著自己心儀的英雄正無比親密地緊摟著另一隻紅髮貓魅，甚至還在撫摸人家的耳朵。
      　　
      　　聽見動靜的光一臉疑惑地轉過頭，隨後也嚇了一跳，藍眼來回在目瞪口呆的他與懷裡的「拉哈」之間穿梭。
      　　
      　　一陣尷尬的靜默逐漸蔓延了開來。
      　　
      　　「唔……那個……英雄大人……」
      　　
      　　懷裡的「拉哈」發出微弱的求救聲，整個人被光那怪力級別的擁抱勒得臉色泛白、頭暈目眩，「雖、雖然被您抱住是莫大的榮幸……但我快要不能呼吸了……」
      　　
      　　光一驚、慌忙仔細一看，這才發現眼前的紅髮貓魅雖然體型相近、服裝打扮都相同，但那雙紅眼卻並非帶著他所熟悉的視線。
      　　
      　　「抱歉！你……」
      　　
      　　那位好不容易喘過氣的冒險者揉了揉被勒疼的肩膀，有些不好意思地抓了抓耳根，臉頰通紅地解釋道：「是廣場前小妖怪的魔法……只要借用幻影的力量，大家都能在今晚扮演成拂曉的英雄們。我想著這是個千載難逢的機會，就在腦海裡回想聽過的英雄傳說，試著扮成您當年的同伴……」
      　　
      　　他邊說，邊示意光看看四周，英雄這才猛然驚醒，環顧這座被魔幻霧氣籠罩的花園。
      　　
      　　不遠處，一個身材高挑的冒險者正穿著尤里安傑那身繁複華麗的星袍，磕磕絆絆地用古語說話；另一邊甚至還有正在擺出帥氣姿勢的桑克瑞德，與四處張望的雅·修朵拉。
      　　
      　　「原、原來是這樣啊……」光乾笑了兩聲，尷尬地摸了摸鼻子。
      　　
      　　「……光。」
      　　
      　　一個低沉、幽怨，彷彿從地底深處飄上來的聲音在身側響起。
      　　
      　　古·拉哈·提亞不知什麼時候已經站在光的旁邊，一雙紅耳緊緊扁平貼在髮間，瞇起的紅眼眨也不眨、死死盯著光那隻還搭在陌生冒險者肩上的手臂，語氣裡酸得彷彿他把自己扔在石之家、獨自出門旅行一年，「……你可以把人家放開了。」
      　　
      　　光觸電般地收回雙手，舉在胸前以示清白。那位冒險者倒是沒發現什麼，朝英雄深深鞠躬後便一溜煙鑽進熱鬧的人群裡。
      　　
      　　古·拉哈·提亞看著光心虛地戳著食指，耳朵抖了抖、無奈地嘆了一口氣。他正想將手中的食盒遞給身前的人，眼角餘光卻冷不防掠過一抹飄逸的純白。
      　　
      　　古·拉哈·提亞渾身一震，迅速回頭看去。只見方才與他擦身而過的人，是一位神情肅穆、身披白色披風的人族男子，他身上的衣著與當初前往天外天垓的英雄鎧甲完全相同，連帶著凝重神情的模樣都如出一轍。
      　　
      　　那一刻，深埋在心底的恐懼與痛楚瞬間擊穿了古·拉哈·提亞的理智。最終決戰後光滿身是血、差點失去呼吸的模樣毫無預兆地在腦海中炸開，淚水甚至連凝成淚滴都來不及，就這麼「哇」的一聲如湧泉般噴了出來。
      　　
      　　「沒有受傷……是沒有受傷的──太好了──」
      　　
      　　他完全將吃醋的事情拋到九霄雲外，帶著哭腔發出一聲撕心裂肺的哀嚎。貓魅敏捷的身影一閃，紅色身影就這麼撲了上去，結結實實地把那個「白衣英雄」抱了個滿懷，眼淚鼻涕全蹭在對方的白斗篷上。
      　　
      　　對方嚇了一大跳，而真正的光站在原地、眼神不忍卻又不甘，整臉苦得像是剛吞了魔界花的果實。
      　　
      　　他無力地抬起手，虛弱地往前抓了抓。
      　　
      　　「喂……拉哈……我在這裡啊……那個不是我……」
      　　
      　　在不遠處的石柱旁，雙手抱胸看著這場鬧劇、真正的桑克瑞德冷哼了一聲，轉頭看向身旁優雅啜飲著熱香料酒的雅·修朵拉。
      　　
      　　「這兩個傢伙……根本半斤八兩吧。」桑克瑞德揉了揉眉心，語氣好笑又無可奈何。
      　　
      　　雅·修朵拉唇角微揚，語調帶著一貫的從容。
      　　
      　　「也許對他們來說，還需要點時間適應普通、沒有危險的生活吧。」
      　　
      　　桑克瑞德垂頭輕笑，隨後將視線往旁一繞，然而當轉到某個方向時，他的瞳孔也跟著凝結了。
      　　
      　　南瓜燈火微微照映著純白的洋裝，留著淺色長髮的少女正安靜地坐在巨樹下休息。那側臉與身形，像極了那個他用生命去守護、如今卻分隔在另一個世界的孩子。
      　　
      　　「琳……？」
      　　
      　　剛才還在一臉冷靜吐槽同伴的傢伙眼眶瞬間泛紅，隨後兩道熱淚嘩地流了下來。
      　　
      　　「琳啊啊啊──！妳怎麼會在這裡？！過得好不好啊──！」
      　　
      　　看著桑克瑞德像一陣風似地衝向那個同樣嚇傻了的無辜少女，雅·修朵拉手裡的酒杯輕輕頓了頓，隨後掩著嘴角，露出了一個極淡卻無比溫柔的微笑。
      　　
      　　「……我看你也差不多，桑克瑞德。」
