  - 光拉哈
  - 歡樂/甜文向
updated: 2026-10-19
summary: 7版新月島衍生
series: 短篇
chapters:
  - body: |-
      　　「光──你那邊如何──」
      　　
      　　古·拉哈·提亞急匆匆地穿過草地跑來，在他身後，一隻矮胖古怪的撒嬌罐正東倒西歪地跟著漂浮而來。
      　　
      　　光側過身，腳跟退了半步，露出自己腳邊那隻正仰著腦袋、眼巴巴盯著腰間背包的同類。
      　　
      　　「我也有打到，一起去看看？」
      　　
      　　貓魅紅色的眼睛瞬間亮了起來，連帶著身後的尾巴都輕輕揚起一道弧度。
      　　
      　　兩人各自從背包裡掏出聖靈藥，蹲下身餵了一小口，罐子裡的妖魔隨即發出心滿意足的咕嚕聲，短短的手臂一揚，便歡快地帶起路來。
      　　
      　　起初，兩個罐子指示的尋寶方向完全相同。隨著日光被茂密的林蔭遮蔽，行徑逐漸靠向西邊，竟一路奔向島嶼邊緣，直直鑽入一條陰森森的幽暗岩洞。
      　　
      　　「藏得可真夠深的……」
      　　
      　　光抬手撥開垂掛在洞口的濕黏藤蔓，先一步踏上潮濕的石階，隨後轉身、向身後的人遞出手。跟著向前的古·拉哈·提亞借力跨過長滿青苔的岩塊，身後那兩個圓滾滾的罐子也一前一後地飄了進來。
      　　
      　　然而，他們好不容易躲過長得駭人的魔物、穿越狹長的洞窟通道，抵達的終點既沒有古代銅箱，也沒有燦金的寶箱，只有一小片被微光所照亮的僻靜空地。
      　　
      　　兩隻罐子停在原地、轉來轉去，不再往前走了。
      　　
      　　「是線索斷了，還是藥給得不夠？」
      　　
      　　光蹲下身，拔開瓶塞又餵了一口清透的藥液。
      　　
      　　吸飽藥水的撒嬌罐歡快地蹦了兩下，短小的手臂筆直一伸──指向了站在一旁的古·拉哈·提亞。
      　　
      　　貓魅眨了眨眼，帶著幾分疑惑跟著蹲下身，將自己的藥瓶遞到另一隻罐子嘴邊，而他喝完後同樣沒有遲疑，小手啪地一轉，筆直朝向了光。
      　　
      　　兩人面面相覷了片刻，身側只有水珠滴落至石地的迴聲。
      　　
      　　兩隻陶罐小手交錯指著彼此，在幽暗的微光中，像極了某種不言而喻的宣告。
      　　
      　　所謂的「寶物」，指的是……
      　　
      　　空氣裡的溫度悄然攀升，光看著仰頭望著自己的古·拉哈·提亞，忽然覺得臉頰有些發燙，連握著空藥瓶的手指都微微收緊。
      　　
      　　確實，跨越了漫長時空與旅途的他們，能像現在這樣並肩站在同一個地方，單純享受一趟刺激又有趣的尋寶之旅，本來就比任何傳說中的秘寶都要珍貴千萬倍。
      　　
      　　光張了張嘴，臉上浮起一層紅，試圖打破這尷尬的氣氛。
      　　
      　　「那個……拉哈，這罐子好像……」
      　　
      　　「啊、嗯！我、我知道！」
      　　
      　　貓耳刷地一下豎直，臉頰也一路紅到了耳尖。同樣手足無措的他尾巴繃得筆直，支支吾吾地連話都說不連貫。
      　　
      　　「他們指的……可能、可能只是某種比喻！不對，我是說……如果真的是那個意思的話……我……」
      　　
      　　兩人的視線撞在一起，又慌慌張張地挪開，空氣中瀰漫著羞澀與曖昧。
      　　
      　　光的心跳快得厲害，剛想踏前半步說點什麼──
      　　
      　　「喂──你們也是來找寶箱的嗎？在這裡喔──」
      　　
      　　陌生的呼喊冷不防從岩洞轉角處傳來。
      　　
      　　一名背著櫻色大劍的白髮貓魅從轉角探出頭。突如其來的打擾讓洞裡的兩人渾身一震，彷彿觸電般猛地拉開距離。
      　　
      　　光立刻仰起頭，極其專注地盯著黑漆漆的洞穴天頂，而古·拉哈·提亞則把頭埋得低低的，單手握拳、掩著嘴輕咳了一聲，腳尖無意識地摩擦著地上一塊無辜的石子。
      　　
      　　貓魅冒險者騎在水豚背上，兩雙眼睛狐疑地打量著這兩個行為詭異的同行。
      　　
      　　隨後，她發出一陣「原來如此」的低吟。
      　　
      　　「好不容易打到罐子卻跑來這種地方約會，現在的冒險者真難懂。」她忍不住壓低聲音咕噥，隨後又好心地提醒：「抱歉打擾兩位了，但是罐子十五分鐘後就會消失。在那之前，要把該做得做完噢──」
      　　
      　　「不、不是你說得那樣！」
      　　
      　　不理會同族辯解的她拍了拍坐騎的腦袋，遵循指令的水豚邁著短腿啪嗒啪嗒地轉出洞口，很快地消失在轉角。
      　　
      　　洞穴內重新恢復了寂靜。
      　　
      　　踢石頭的動靜停了，望著洞頂的視線也悄悄落了下來。
      　　
      　　光低下頭，正好撞上古·拉哈·提亞偷偷看過來的目光，看著對方那對通紅的耳朵和無奈的神情，光忍不住噗嗤一聲笑了出來。古·拉哈·提亞微微一愣，隨即也跟著揉了揉鼻尖，有些不好意思地彎起眼睛。
      　　
      　　笑聲持續了一段時間，總算有人伸出了手。
      　　
      　　「……走吧，大寶箱。」他笑著說：「我們該去找那個普通的寶箱了。」
