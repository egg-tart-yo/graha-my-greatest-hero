      　　光第一次注意到這件事，是在一個再普通不過的早晨。
      　　
      　　那天的委託不算危險，只是路程長，來回少說也要兩三天。偏偏古·拉哈·提亞前一天才為了處理魔物騷動施展過大規模魔法，直到早上臉色都還有些蒼白。
      　　
      　　所以光一邊整理裝備，一邊很自然地開口。
      　　
      　　「拉哈，你今天留下來休息。」
      　　
      　　古·拉哈·提亞握著地圖的手微微一震。
      　　
      　　「我已經沒事了。」
      　　
      　　光抬頭看他，他立刻急切地補了一句。
      　　
      　　「真的，只是有一點累而已，路上慢慢恢復也沒關係──」
      　　
      　　光伸出手指，點了一下他的額頭。
      　　
      　　「休息。」
      　　
      　　古·拉哈·提亞安靜了兩秒，最後還是笑了。
      　　
      　　「……好吧。」
      　　
      　　他乖順地點點頭。
      　　
      　　之後他探過頭，幫光確認了背包裡的藥水、食物和備用裝備，像平常一樣細細叮囑著路上的事。
      　　
      　　「這次要走山路吧？晚上的溫度會降得很快，保暖裝備記得帶。」
      　　
      　　「嗯。」
      　　
      　　「如果遇到突發狀況，也別急著一個人處理，桑克瑞德和艾斯蒂尼安都在。」
      　　
      　　「知道了。」
      　　
      　　「還有……」
      　　
      　　古·拉哈·提亞停了一下，藏在背後的手無意識地揉搓著。
      　　
      　　光等著他繼續，可他只是把剩下的話吞了回去，朝光笑了笑。
      　　
      　　「沒什麼，一路順風。」
      　　
      　　光背起行囊，走到門口時，忽然回頭看了一眼。
      　　
      　　古·拉哈·提亞還站在原地。
      　　
      　　他沒有追上來，也沒有再說什麼，只是朝光揮了揮手。
      　　
      　　那雙紅色的眼睛微微彎著，笑容也和平常沒有什麼不同。
      　　
      　　不知道為什麼，看起來卻很寂寞。
      　　
      　　古·拉哈·提亞似乎察覺了光的目光，立刻又把笑容撐得更明亮了一些。
      　　
      　　「路上小心，英雄。」
      　　
      　　啊。
      　　
      　　原來是這樣。
      　　
      　　後來光稍微留意了一下，才發現這並不是第一次。
      　　
      　　有時候是任務需要分頭行動，或者是預計會旅行很長一段時間，有時則像今天一樣，是古·拉哈·提亞消耗過度，被勒令留下來休息。
      　　
      　　只要無法同行，古·拉哈·提亞的臉上都會是一樣的神情。
      　　
      　　「沒問題。」
      　　
      　　「我會等你回來。」
      　　
      　　「放心吧，我也有自己的事要做。」
      　　
      　　說完，再用那種看似有精神、體貼又乖巧，卻怎麼看都有一點可憐的表情送光離開。
      　　
      　　視線還會持續很長一段時間，無論向前邁進的光走了多遠，只要一回頭，便會發現那人還站在原處，目送他的背影。
      　　
      　　於是某天晚上，光忽然起了念頭。
      　　
      　　待所有人都休息之後，光一個人坐在桌前，把拆得七零八落的通訊珠零件鋪滿了整張桌子，就著一盞小燈，舉著工具研究著。
      　　
      　　經過數次失敗、兩次爆出火花，以及一次差點把自己的頭髮燒焦之後──
      　　
      　　一顆只有指尖大小的小珠子，終於被做了出來。
      　　
      　　隔天一早，古·拉哈·提亞看著被塞進自己掌心的紅色小珠子，好奇地偏了偏頭。
      　　
      　　「這是……？」
      　　
      　　「給你的。」
      　　
      　　不知道是不是錯覺，古·拉哈·提亞的耳朵似乎動了一下。
      　　
      　　光指了指珠子表面那個小小的凹槽。
      　　
      　　「想我的時候，就按這裡。」
      　　
      　　「……咦？」
      　　
      　　「按下去之後，我身上的另一個裝置就會響。」
      　　
      　　光頓了頓，像是怕他沒明白自己的意思，又補充道。
      　　
      　　「平常當然也能直接聯絡，不過有時候……也不一定真的有什麼事。」
      　　
      　　「只是想讓我知道你需要我，或者希望我早點回來，這種時候就按一下。」
      　　
      　　他看著古·拉哈·提亞，語氣很平常，卻又說得理所當然。
      　　
      　　「我收到之後，就會知道了。」
      　　
      　　「能早點回來的話，我會盡量早點回來。」
      　　
      　　古·拉哈·提亞沒有立刻說話。
      　　
      　　他的手指很輕地捲起來，把珠子攏進掌心。
      　　
      　　過了一會兒，他像是忽然想到什麼，急忙抬起頭。
      　　
      　　「可是，如果你正在戰鬥呢？」
      　　
      　　古·拉哈·提亞的眉頭微微蹙起，方才的欣喜很快又被擔憂取代。
      　　
      　　「要是這聲音反而讓你分心，出了什麼意外──」
      　　
      　　「拉哈。」
      　　
      　　光就知道他一定會這麼說。
      　　
      　　他故意板起臉，環抱起雙手。
      　　
      　　「你平常都叫我什麼？」
      　　
      　　「……光？」
      　　
      　　「不是這個。」
      　　
      　　古·拉哈·提亞困惑地眨了眨眼，想了一會兒，才試探著開口。
      　　
      　　「英雄？」
      　　
      　　「這就對了。」
      　　
      　　光滿意地點點頭。
      　　
      　　「這點小動靜還影響不了我。」
      　　
      　　他說得自信，隨即又稍稍放柔了語氣。
      　　
      　　「不如說，聽見它的時候，我反而會記得──還有人在等我回去。」
      　　
      　　古·拉哈·提亞怔怔地望著他，過了一會兒，他的嘴角才一點一點揚了起來。微微顫動的眼眸裡，那份歡喜怎麼也藏不住。
      　　
      　　他低下紅透的頭，小心翼翼地將那顆珠子攏進掌心，珍重得像是得到了什麼不得了的寶物。
      　　
      　　「……那我會好好珍惜的。」
      　　
      　　光伸出手，揉了揉古·拉哈·提亞柔軟的頭髮。
      　　
      　　「嗯。想我的時候，就按吧。」
      　　

      　　
      　　
      　　結果光很快就知道，自己最後那句話其實完全沒有必要。
      　　
      　　因為當天下午，他跟著桑克瑞德和艾斯蒂尼安離開城鎮，甚至還沒走滿一公里，柔軟清脆的一聲『叮』就從光腰間傳了出來。
      　　
      　　三個人同時停下腳步。
      　　
      　　桑克瑞德率先看向光。
      　　
      　　「什麼聲音？」
      　　
      　　光沉默了一下，突然不曉得要怎麼解釋。
      　　
      　　艾斯蒂尼安也跟著皺眉。
      　　
      　　「你的裝備壞了？」
      　　
      　　「沒有，等我一下。」
      　　
      　　光默默拿出正統的通訊珠。
      　　
      　　「我聯絡一下。」
      　　
      　　而通訊接通得快得驚人。
      　　
      　　「光？」
      　　
      　　古·拉哈·提亞的聲音立刻傳來。
      　　
      　　光沒注意到身旁兩位夥伴一臉原來如此的眼神，只顧著低聲詢問。
      　　
      　　「怎麼了？」
      　　
      　　「沒、沒什麼！」
      　　
      　　對方回答得非常迅速。
      　　
      　　「我只是想確認一下裝置是不是真的有用。」
      　　
      　　「有，我收到了。」
      　　
      　　「那就好。」
      　　
      　　「嗯。」
      　　
      　　短暫的沉默，古·拉哈·提亞又小聲補了一句。
      　　
      　　「路上小心。」
      　　
      　　光笑了笑，「知道了。」
      　　
      　　隨後通訊結束。
      　　
      　　三個人重新出發，但這回連森林都還沒走出去，又是一聲輕柔的『叮』。
      　　
      　　桑克瑞德一臉調侃地看著伸手捂著臉的光。
      　　
      　　「這就是所謂的……小別勝新婚？我們才離開多久？」
      　　
      　　光沒回答，因為就在這時，聲音又再次響起。
      　　
      　　桑克瑞德終於笑出聲。
      　　
      　　「我看你挺高興的。」
      　　
      　　「還好。」
      　　
      　　「嘴角先收一下再說。」
      　　
      　　光面無表情地把嘴角壓回去。
      　　
      　　艾斯蒂尼安仍然完全不明白。
      　　
      　　「所以那個東西到底有什麼用？」
      　　
      　　「沒什麼用。」
      　　
      　　「啊？」
      　　
      　　「就是他啟動的時候，我這邊會收到通知。」
      　　
      　　艾斯蒂尼安沉默。
      　　
      　　「……就這樣？」
      　　
      　　「嗯。」
      　　
      　　龍騎士的表情變得更加難以理解。
      　　
      　　桑克瑞德已經扶著一旁的樹、彎著腰憋笑。
      　　
      　　接下來一路上，那顆珠子都非常盡責，盡責到光甚至開始懷疑，古·拉哈·提亞是不是根本就將那顆珠子握在手中。
      　　
      　　因為如果不是的話，那這份思念的頻率，未免過於沉重。
      　　
      　　三人就這麼在『叮』聲的陪伴下趕路、夜宿溪邊、完成任務，期間艾斯蒂尼安一臉嚴肅地建議，下次還是考慮把古·拉哈·提亞帶在身邊。
      　　
      　　但想了想出發前那有些發白的神色，光還是搖了搖頭，轉而再度取出工具，拆解起從桑克瑞德身上搶來的通訊珠。
      　　
      　　幾日後，回到石之家的光，又拉過古·拉哈·提亞的手，朝他掌心放下一顆改良過的珠子。
      　　
      　　「你按這顆，我這裡會響。」他一臉認真地解釋，「現在我這裡可以按回去──」
      　　
      　　隨著光的動作，古·拉哈·提亞手中的珠子亮了亮，然後發出同樣輕柔的聲音。
      　　
      　　「這樣就可以告訴你，我收到了。」
      　　
      　　古·拉哈·提亞的眼睛跟手中的珠子一樣發亮，振奮地朝光露出微笑。
      　　
      　　但對於其他人來說，似乎開始有了新的問題。
      　　
      　　隔天早晨，坐在一旁吃著食物的桑克瑞德，面無表情地聽著迴盪在石之家的叮噹聲。
      　　
      　　他撇了眼就坐在桌子對面的古·拉哈·提亞與光，揉了揉眉心。
      　　
      　　「我說，你們現在就坐在一起。」
      　　
      　　古·拉哈·提亞手裡捏著珠子，耳朵有點紅。
      　　
      　　光抬起眼，平靜地朝他眨了眨。
      　　
      　　「然後呢？」
      　　
      　　「那為什麼還要按？」
      　　
      　　古·拉哈·提亞看向光，後者毫不在意地又按了一下。
      　　
      　　桑克瑞德閉上眼睛，決定將自己的出發時間再提早一個小時。
      　　
      　　「……算了。」
      　　
      　　旁邊的艾斯蒂尼安從剛才開始就一直皺著眉。
      　　
      　　他看看一臉平靜的英雄，與神色羞赧卻捨不得放下珠子的貓魅，再看看兩人手裡那兩顆毫無實際通訊功能、卻響個沒完的珠子。
      　　
      　　看似努力思考了很久，最後，他十分認真地問。
      　　
      　　「你們薩雷安人都這樣嗎？」
      　　
      　　桑克瑞德一口茶差點噴出來。
      　　
      　　古·拉哈·提亞愣了愣。
      　　
      　　「哪、哪樣？」
      　　
      　　艾斯蒂尼安指了指著珠子。
      　　
      　　「明明人就在前面，還要用這種方式在那邊按來按去。」
      　　
      　　光偏頭思考了會，隨後朝他搖了搖手中的珠子。
      　　
      　　「要不要我也給阿爾菲諾做一對試試？」
      　　
      　　身旁閃過一道影子，桑克瑞德將槍刃架在光的脖子前，陰沉沉地威脅。
      　　
      　　「小心我把你閃閃發亮的工具箱丟到銀淚湖裡。」
      　　
      　　「丟了下回就沒人給你修裝備了。」
      　　
      　　「……拜託你，不要增加尤里安傑的煩惱！」
      　　
      　　艾斯蒂尼安眉頭皺得更深，望著吵起來的兩人。
      　　
      　　「所以到底是不是？」
      　　
      　　沒有人回答他。
