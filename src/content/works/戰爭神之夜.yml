  - title: 上篇
    body: |-
      　　拂曉收到伊修加爾德的邀請函時，阿莉塞正坐在石之家長桌的一端，百無聊賴地用指尖推著墨水瓶。
      　　
      　　「『謹以戰爭神哈羅妮之名，邀請拂曉血盟諸位賢人，出席和約紀念宴』……」阿爾菲諾逐字讀完燙金的文字，語氣裡已有掩不住的興致，「原來如此，是為了紀念戰後議會成立，以及伊修加爾德重新與艾奧傑亞諸城邦締結盟約的日子。」
      　　
      　　「換句話說，就是不能穿著沾滿魔物血跡的裝備赴宴。」雅·修朵拉微笑著補充。
      　　
      　　艾斯蒂尼安倚在牆邊，立刻皺起眉。
      　　
      　　「我不去。」
      　　
      　　「邀請函上特別註明了你的名字。」阿爾菲諾說。
      　　
      　　「那更不去。」
      　　
      　　「宴席應該會有雲海送來的燻肉。」桑克瑞德漫不經心地說。
      　　
      　　艾斯蒂尼安沉默片刻，抱著手臂轉開了臉。
      　　
      　　「……那倒是可以考慮。」
      　　
      　　眾人正竊笑時，古·拉哈·提亞注意到信封裡還留著另一張較小的卡片，看似並非印製的公函，而是由人親筆書寫。
      　　
      　　紙上的字跡端正流暢，末尾蓋著象徵博雷爾家族的銀色紋章。
      　　
      　　『致光之戰士──
      　　
      　　倘若閣下願意，謹盼於紀念宴當晚，惠允入席於議長席側，以伊修加爾德最重要的友人與恩人之身分，與我們共同見證這個日子。』
      　　
      　　信件的署名是艾默里克。
      　　
      　　「議長席旁邊？」阿莉塞探過頭來，揚起眉毛，「那可是主賓的位置吧。」
      　　
      　　光接過卡片看了一會兒，似乎也有些意外，最後只將它收進信封。
      　　
      　　「艾默里克一向重視禮節，大概只是政治上的安排。」
      　　
      　　「是、是啊。」古·拉哈·提亞立即附和，「考量英雄在伊修加爾德的事蹟，由你擔任主賓，自然再合適不過。」
      　　
      　　他說得十分誠懇。
      　　
      　　只是那雙紅色的眼睛，在光收起卡片後，仍停在艾默里克的署名上，多看了那麼一會兒。
      　　
      　　
      　　
      　　舞會當晚，伊修加爾德罕見地沒有下雪。
      　　
      　　大廳懸滿銀白與深藍的垂幔，長槍形狀的燈架沿著石柱一字排開，燭火將挑高的頂部映得如同冬夜裡低垂的群星。來自各城邦的使節與伊修加爾德議員穿梭其中，杯盞相碰，樂聲悠緩，平日冷峻的石城也彷彿被暖意融開了幾分。
      　　
      　　拂曉一行人的到來，很快引起了賓客的注目，其中最受矚目的自然是英雄。
      　　
      　　他並未穿著平日冒險者的裝備，而是換上了由塔塔露親手製作、剪裁合身的深色禮服，衣襟以銀線繡著簡潔的紋樣，在燭光下若隱若現。那裝束並不張揚，卻使他看起來比往常更為挺拔。
      　　
      　　落在隊伍最後方的古·拉哈·提亞，已經悄悄看了第三次，紅眼第四次將目光投注而去時，阿莉塞終於忍不住了。
      　　
      　　「你再這樣盯下去，他的衣服都要被你看穿了。」
      　　
      　　「我、我才沒有……」
      　　
      　　貓魅的耳尖迅速泛紅，他低頭整理自己的袖口，試圖裝出若無其事的模樣。
      　　
      　　「我只是覺得那套衣服很適合他。」
      　　
      　　「那就去跟他說啊。」
      　　
      　　「這種場合突然說這些，未免太唐突了。」
      　　
      　　阿莉塞看了看光周圍簇擁的人，又看了看滿臉正經的古·拉哈·提亞，最後露出一種近乎憐憫的神情。
      　　
      　　「別猶豫太久，你的時間不多了。」
      　　
      　　古·拉哈·提亞還沒來得及問她是什麼意思，大廳另一端便傳來了細微的騷動。
      　　
      　　艾默里克穿過人群，朝拂曉眾人走來。
      　　
      　　他身著伊修加爾德正式典禮用的騎士禮服，銀藍色披肩從一側垂落，胸前別著象徵議長身分的胸紋與家族徽章。與周圍那些拘謹的貴族相比，他的神情依舊溫和從容，看見光時，那份禮貌的微笑裡又多了幾分真切的喜悅。
      　　
      　　「你來了。」
      　　
      　　艾默里克在光面前停下，柔和的目光帶著驚艷，不著痕跡地將他打量了一遍。
      　　
      　　「今晚的裝束很適合你。」
      　　
      　　古·拉哈·提亞身後的尾巴微微膨起。
      　　
      　　阿莉塞默默拿起一杯果汁，退到更方便觀察的位置。
      　　
      　　「謝謝。」光笑著回答，「會場很華麗，比我想像中熱鬧。」
      　　
      　　「議會為了賓客名單爭論了整整兩週，若最後還顯得冷清，我恐怕很難向他們交代。」
      　　
      　　艾默里克語帶無奈地笑了笑，隨即側身微微俯首，朝光伸出手，親自引他走向大廳前方。
      　　
      　　主桌設於神的徽記之下，艾默里克的位置居中，而他右手旁的座位上沒有放置任何議員或貴族的名牌，只有一枚以銀枝固定的藍色花朵。
      　　
      　　那是全場最醒目的位置之一，也是僅次於議長的尊位。
      　　
      　　光落座後，大廳裡難免響起幾聲壓低的議論，然而艾默里克神色不變，只在致詞時向眾人表示，伊修加爾德能夠迎來今日，除了那些願意打破沉默、揭開真相的人，為了守護家園而長存於人心的騎士們外，也不能忘記一位曾以性命為這座國家開闢未來的英雄。
      　　
      　　他並不避諱地讓所有人知道，光之戰士在伊修加爾德心中究竟占有多麼重要的位置。
      　　
      　　古·拉哈·提亞坐在拂曉的席位間，一邊認真聽著，一邊用刀叉鋸著盤裡的烤蔬菜。
      　　
      　　桑克瑞德瞥了一眼他的盤子。
      　　
      　　「那個蔬菜得罪你了？」
      　　
      　　「沒有。」
      　　
      　　「但你快把它切碎了。」
      　　
      　　「小一點比較好入口……」
      　　
      　　古·拉哈·提亞表情僵硬地叉起其中一小塊，送入口中，可他咀嚼了兩下，目光又不自覺飄向主桌。
      　　
      　　艾默里克正微微側過身，壓低姿勢附在光的耳邊，低聲交談。
      　　
      　　光靜靜聆聽後，忍不住笑了起來。
      　　
      　　古·拉哈·提亞手裡的叉子輕輕碰上瓷盤，發出清脆的一聲，雅·修朵拉的視線落在他身上，一邊優雅端起酒杯，唇邊帶著淡淡笑意。
      　　
      　　「真是稀奇，難得看見沉穩從容的水晶公，連一頓晚宴都坐不住。」
      　　
      　　「你們別老笑話我……」貓耳垂得更低了。
      　　
      　　「沒有笑你，我只是在陳述觀察結果。」
      　　
      　　「我才沒有坐不住。」
      　　
      　　「那麼，請先停止用視線測量艾默里克閣下與我們英雄之間的距離。」
      　　
      　　古·拉哈·提亞無話可說，只能又叉起一塊已經快被切碎的蔬菜。
      　　
      　　晚宴過後，樂師奏起第一支舞曲，眾人逐漸向大廳兩側退開，將中央的空間讓了出來。
      　　
      　　艾默里克從座位上起身，古·拉哈·提亞忽然有了不太好的預感。
      　　
      　　下一刻，艾默里克忽略幾位匆忙起身的貴族佳麗，他走到光的面前，彬彬有禮地伸出掌心。
      　　
      　　「今日的開場舞，象徵伊修加爾德對盟友的敬意。」
      　　
      　　他的語氣正式且坦然，藍色眼眸裡卻帶著一點發自內心的柔軟微笑。
      　　
      　　「你願意與我共舞嗎？」
      　　
      　　四周安靜了一瞬，無數目光聚集而來，其中也包括一雙格外鮮紅、專注的眼睛。
      　　
      　　光似乎遲疑了一下。
      　　
      　　「我不太擅長跳舞。」
      　　
      　　「無妨。」艾默里克仍伸著手，「跟著我就好。」
      　　
      　　光便將掌心交給了他。
      　　
      　　掌聲隨之響起，古·拉哈·提亞也跟著鼓掌，臉上保持著禮貌的微笑。
      　　
      　　只是他拍手的節奏比其他人慢上許多。
      　　
      　　「好可憐。」阿莉塞在旁邊低聲說。
      　　
      　　「……我聽見了。」
      　　
      　　「我就是說給你聽的。」
      　　
      　　大廳中央，艾默里克領著光踏入舞池。
      　　
      　　他顯然是極好的引導者，步伐沉穩，既不催促，也不會讓不熟悉舞蹈的人感到侷促。光起初有些生疏，幾次險些踏錯，但很快便抓住了節奏。
      　　
      　　一次旋身時，艾默里克的手扶上光的腰側，下一次交錯時，兩人的距離又近了些。
      　　
      　　古·拉哈·提亞端起桌上的杯子，喝了一口，卻發現杯中的酒早已飲盡。
      　　
      　　他沉默地將杯子放回去。
      　　
      　　「拉哈。」阿爾菲諾語氣關切，「你還好嗎？」
      　　
      　　「我……有什麼問題嗎？」
      　　
      　　「你的尾巴。」
      　　
      　　古·拉哈·提亞低頭一看，這才發現自己的尾巴不知何時已緊緊繞在椅腿上。
      　　
      　　他迅速鬆開，臉頰漲得通紅。
      　　
      　　「我只是……」
      　　
      　　只是什麼，連他自己也找不到足夠合理的解釋。
      　　
      　　他知道這不過是一支禮儀性的舞，是宴會必經的流程，也清楚艾默里克對光的尊敬與信賴由來已久。
      　　
      　　他明白在這樣重要的場合，由光擔任主賓是理所當然的安排，甚至真心為光受到如此重視而感到高興。
      　　
      　　可是當他看著兩人在燭光下旋身，宛如一對佳偶般充滿默契；看著艾默里克數次靠近光的耳畔，低聲提醒下一個舞步時，胸口仍像被什麼輕輕刺了一下。
      　　
      　　不算疼痛，只是酸酸的，悶悶的。
      　　
      　　糾結間，舞曲終於結束。
      　　
      　　艾默里克高舉與光牽著的手，在掌聲中向眾人致意。待他們走回席間，艾默里克並未立刻鬆手，而是藉力將光輕拉到他身邊，低聲對英雄說了句什麼。
      　　
      　　古·拉哈·提亞聽不見，但英雄藍眼中的笑意，他看得十分清楚。
      　　
      　　這時，他的背後突然被溫熱的掌心輕推了一下。
      　　
      　　古·拉哈·提亞僵硬地回頭，發現阿爾菲諾帶著溫柔的笑，輕輕推了他的背，雙手抱胸的桑克瑞德也朝他擠了擠眼睛。
      　　
      　　「快去吧，不然我看你都快憋壞了。」
      　　
      　　阿莉塞側著身，伸手戳了戳他的肩膀。
      　　
      　　「何止憋壞，我看都快哭出來了。」
      　　
      　　「我才沒有！」
      　　
      　　低聲反駁後，古·拉哈·提亞握緊拳頭，終於下定決心，往舞池快步走去。
  - title: 下篇
    body: |-
      　　他走向光，步伐比平常快了不少，同一時間，第二支舞曲前的預備間奏也一齊奏響。
      　　
      　　「光。」
      　　
      　　光回過頭，看見他時，眼底露出些許意外。
      　　
      　　「拉哈？」
      　　
      　　古·拉哈·提亞原本準備了一路的話，在真正對上他的眼睛後，忽然全忘了。
      　　
      　　光的臉頰因方才的舞蹈泛著薄紅，額前也落下了一縷頭髮，他偏著頭，一雙藍得驚人的眼睛正好奇地望著揪起臉的貓魅。
      　　
      　　古·拉哈·提亞停頓了一下，努力挺直身子。
      　　
      　　「下一支舞，可以請你和我一起跳嗎？」
      　　
      　　光眨了眨眼。
      　　
      　　古·拉哈·提亞的耳尖已紅得幾乎要與髮色融在一起，卻仍固執地站在原地，伸出手。
      　　
      　　他的手高高舉起，眼神十足堅定，只有尾巴在身後不安地晃了一下，洩露了主人遠沒有表面上那麼鎮定。
      　　
      　　光沒有立刻把手交給他，反而故作思考地蹙起眉。
      　　
      　　「你會跳舞？」
      　　
      　　「……不會，但我可以學。」他急忙說，「剛剛看過一遍，雖然未必能完全記住，但只要實際走幾次，應該很快就能──」
      　　
      　　說到一半，他才看見光眼裡越來越明顯的笑意。
      　　
      　　古·拉哈·提亞慢慢閉上嘴。
      　　
      　　他再次開口的聲音低了好幾度，顯然覺得自己的真心遭受到莫名的攻擊。
      　　
      　　「你在捉弄我。」
      　　
      　　「只有一點。」
      　　
      　　光露出微笑，終於將手放進他的掌心，手指輕捏著過燙的手掌。
      　　
      　　「讓你放鬆些，不然有人的視線，都快把我灼穿了。」
      　　
      　　古·拉哈·提亞瞬間啞住，這才發現光其實早就注意到了。
      　　
      　　英雄眼裡的笑意更深了。
      　　
      　　「走吧。我教你。」
      　　
      　　被光拉著走的瞬間，古·拉哈·提亞一直緊繃的肩膀終於放鬆下來。
      　　
      　　兩人走進舞池。
      　　
      　　古·拉哈·提亞確實記住了大部分舞步，卻也不像自己預想的那樣從容。第一次轉身便慢了半拍，險些撞上旁邊的賓客，第二次又因過於在意手該放在哪裡，踩到了光的鞋尖。
      　　
      　　「抱歉！那個……」
      　　
      　　光握緊他的手，把退縮的貓魅重新拉了回來，另一隻手牽過古·拉哈·提亞的手掌，將他的手放在自己的側腰。
      　　
      　　「不要緊，跟著我就好。」
      　　
      　　古·拉哈·提亞怔了一下，隨即紅著臉點點頭。
      　　
      　　他努力專心跟著光的引導，兩人的舞步依舊稱不上完美，甚至在旋身時差點碰到彼此的額頭，可漸漸地，總算找到了屬於他們的節奏。
      　　
      　　「拉哈。」
      　　
      　　「嗯？」
      　　
      　　「你今晚是不是不太高興？」
      　　
      　　古·拉哈·提亞腳步一亂，光立刻扶住他。
      　　
      　　「沒有。」他下意識否認。
      　　
      　　「真的？那你為什麼一整晚都盯著主桌？」
      　　
      　　「我……我在看艾默里克閣下致詞。」
      　　
      　　「連用餐的時候也在看。」
      　　
      　　古·拉哈·提亞又沉默了。
      　　
      　　樂聲在周圍流淌，燭火落進他紅色的眼睛裡，搖晃著細碎的光，過了好一會兒，他才放棄似地低聲開口。
      　　
      　　「我很高興伊修加爾德如此重視你，特別是艾默里克閣下……這是真心話。」
      　　
      　　「但看見你們一起跳舞時……我確實有一點羨慕。」
      　　
      　　光望著他，偏過頭，「只有一點？」
      　　
      　　古·拉哈·提亞的尾巴僵了一下。
      　　
      　　「……好吧，不只一點，我羨慕到都快坐不住了。」
      　　
      　　光終於笑出了聲。
      　　
      　　看見英雄的反應，古·拉哈·提亞無奈地垂下耳朵。
      　　
      　　「請不要笑我，這並不是什麼值得驕傲的事。」
      　　
      　　「不是笑你。」
      　　
      　　光稍稍靠近了一些，聲音也壓低了。
      　　
      　　「只是覺得我的拉哈很可愛。」
      　　
      　　古·拉哈·提亞的舞步瞬間定住，後方的舞伴不得不匆忙繞過他們。
      　　
      　　「可、可愛？」
      　　
      　　「嗯。」
      　　
      　　「在這麼多人面前，突然說這種話……」
      　　
      　　「你剛才不是還氣惱，艾默里克搶在你之前，稱讚我的衣服嗎？」
      　　
      　　古·拉哈·提亞睜大眼睛，隨後迅速轉過身，豎起的貓瞳緊盯著阿莉塞。
      　　
      　　不遠處，少女若無其事地移開視線，假裝自己正專心品嘗甜點。
      　　
      　　「所以呢？」光將他的注意力重新拉回自己身上，眼底仍帶著笑意，「現在機會正好，不打算把握嗎？」

      　　古·拉哈·提亞的喉結輕輕滾動了一下，臉頰也隨之染上熱意。他抬起眼，望向近在咫尺的人，燭光落進那雙藍色眼眸裡，映出一片安靜而柔軟的光，像是在耐心等待著他的回答。

      　　見光沒有催促，他緊繃的神情也一點點鬆了下來，開口時，聲音已比方才柔和許多。

      　　「你今晚……真的很好看。」
      　　
      　　他不像艾默里克那般從容，也沒有貴族優雅恭維的氣質，只是一句直白得近乎笨拙的話。
      　　
      　　可是光看著他，笑得比方才任何時候都更加開心。
      　　
      　　「謝謝。」
      　　
      　　音樂來到尾聲。
      　　
      　　最後一次旋身時，光沒有立刻退開，而是順勢停在古·拉哈·提亞面前，兩人的距離近得足以聽見彼此的呼吸。
      　　
      　　「還吃醋嗎？」
      　　
      　　古·拉哈·提亞猶豫了片刻，隨後心一橫，決定難得任性一回，「……還有一點。」
      　　
      　　「那再陪我跳一支？」
      　　
      　　他的耳朵立刻豎了起來。
      　　
      　　「可以嗎？」
      　　
      　　「當然。」
      　　
      　　光牽著他留在舞池中央，兩人相視而笑。
      　　
      　　大廳另一側，艾默里克將這一幕收入眼底，唇邊浮起一抹了然的笑。他舉起酒杯，眼睛望著英雄身旁的貓魅，遙遙向其致意，隨後轉身與前來攀談的貴族交談，體貼地將接下來的時間留給了他們。
      　　
      　　古·拉哈·提亞看見了那個動作，他遲疑片刻，也朝艾默里克輕輕頷首。
      　　
      　　胸口那股酸澀總算淡了下去。
