  - body: |-
      　　滾燙的熱浪將遠方的景色翻騰得模糊又扭曲，四人小隊已經在無邊無際的沙丘探索了大半天。桑克瑞德在前方警戒著周圍魔物的動靜，艾斯蒂尼安則扛著長槍，留意腳下沙土隨時可能竄出的巨獸。
      　　
      　　走在後頭的古·拉哈·提亞擦了擦額頭的汗珠，有些擔憂地側頭看向身旁的光之戰士。
      　　
      　　英雄的下唇有些乾裂，嘴角甚至隱隱滲著幾絲細微的血痕。古·拉哈·提亞下意識摸了摸自己腰間的水壺，根據晃動傳來的重量感，猜測裡面只剩下一兩口見底的水量，而光身上的水囊早在先前的戰鬥已見底。
      　　
      　　這樣下去可不行，好歹得補充點水分。
      　　
      　　古·拉哈·提亞抿了抿唇，他悄悄抬起眼，瞄著前方的兩道背影──桑克瑞德正低頭端詳著地圖，艾斯蒂尼安則是仰頭觀察沙丘頂端的風向，誰也沒有往後看。
      　　
      　　心跳不自覺加快起來，調皮搗蛋的貓瞳孔總是睜得渾圓，身後的尾巴也無意識地高速甩動。
      　　
      　　古·拉哈·提亞深吸一口乾熱的空氣，像是耗盡了畢生的勇氣，伸手拉住光的衣袖，示意對方停下。在英雄有些疑惑地低頭看過來的那一瞬間，古·拉哈·提亞踮起腳尖，仰起頭，將自己的唇輕輕遞了上去。
      　　
      　　柔軟的舌尖探出，極其溫柔地沿著對方乾澀的唇瓣舔吻了一圈，試圖用自己的津液滋潤那幾道細小刺眼的裂痕。唇瓣在濕潤的熨燙下微微凹陷，舌尖循著唇形細細描摹，鼻尖也輕輕擦過對方呼出的氣息。
      　　
      　　光睜大了雙眼，看著那雙微睜的紅眼專注且集中地望著自己的唇。而注意到他的視線，古·拉哈·提亞雙頰的緋紅瞬間暈滿整張臉。
      　　
      　　他像隻受驚的小貓一樣猛地向跳開了一大步，頭頂的貓耳完全壓平成了飛機耳。
      　　
      　　「……繼、繼續走吧！」
      　　
      　　古·拉哈·提亞根本不敢看光的眼睛，拋下一句含糊不清的話後，拔腿就往前跑，慌亂地衝到了隊伍中間。
      　　
      　　傻站在原地的光摸了摸嘴唇，殘留的濕潤與被充分滋潤過的乾澀嘴皮確實軟化了許多。
      　　
      　　短暫的錯愕過後，光的唇角忍不住揚起一抹帶著端詳與玩味的笑意。
      　　
      　　──這可不能怪他，是這隻貓先動手撩撥的。
      　　
      　　沒過多久，光快步跟了上去，故意並肩貼在古·拉哈·提亞身邊，將自己的體溫遞了過去，隨後調笑地喚著：「拉哈。」
      　　
      　　古·拉哈·提亞的眼神依然飄移，「怎、怎麼了？」
      　　
      　　「嘴唇又乾了。」
      　　
      　　光一臉理所當然地指了指自己的嘴角，神情無辜得像個誠心請求幫助的可憐隊友，「剛才那個挺管用的。要不再來一次？」
      　　
      　　「哪……哪有這麼快！」古·拉哈·提亞整張臉頓時漲得通紅，壓低了音量辯解：「剛才只是、只是看它乾得太厲害！不想讓你感到痛所以……」
      　　
      　　「嗯，它現在又開始抽痛了。」光煞有其事地嘆了口氣，這次乾脆把臉無賴地湊了過去，「你看，這邊跟這邊，應該都裂開了……再親一下就會好，順便舔一下，好嗎？」
      　　
      　　古·拉哈·提亞急得直搖頭，柔軟的耳朵隨著劇烈的動作啪搭作響，兩隻手放在光的肩上，試圖想維持一點距離，偏偏力道又捨不得用得太重。
      　　
      　　貓魅羞恥得快當場蒸發。
      　　
      　　「不行！絕對不行！桑克瑞德他們還在……你別靠這麼近！」
      　　
      　　而後方的動靜，從一開始就瞞不過身經百戰的另外兩人。
      　　
      　　桑克瑞德面無表情地放慢腳步，轉頭看了一眼那個正死皮賴臉纏著紅髮貓魅的光之戰士，又看了看縮成一團、滿臉羞憤又炸著尾巴抗議的古·拉哈·提亞。
      　　
      　　「……」
      　　
      　　他深吸了一口氣，默默別過頭，閉上眼睛，右手按著發疼的太陽穴，白眼已經翻超過了兩百圈。
      　　
      　　另一邊也沒好到哪去。
      　　
      　　艾斯蒂尼安的眉頭皺得死緊，長槍在手裡微微轉了半圈，眼神冰冷地遞給桑克瑞德一個充滿嫌棄與詢問的目光──這傢伙一直都這樣？
      　　
      　　桑克瑞德回給他一個生無可戀的眼神──準確地說，是只有他們倆在一塊才這樣。
      　　
      　　都不看一下場合嗎？！
      　　
      　　別問，問就是你還沒習慣。
      　　
      　　「拉哈，行行好，救救你的英雄吧。」後面的光依然不知收斂，整個人已經不管不顧、雙手並用地纏上那退無可退的身影，「真的，就一下，一下就好。剛才你不是親得很順手嗎？」
      　　
      　　「光！你……不要……再說了……！」
      　　
      　　被逼到絕境的古·拉哈·提亞，只剩下一根無地自容的紅尾在身後瘋狂甩動。
      　　
      　　這場充滿調情與無奈的折磨路程，終於在他們看見沙漠中央城鎮的拱門時迎來了終點。當四人的靴子一前一後地踏入城門的那一刻，艾斯蒂尼安的視線落在某個傳來水聲的造景上，隨後停下腳步、冷冷地側過頭，看向桑克瑞德。
      　　
      　　桑克瑞德嘴角抽動了一下，無聲地點了點頭。
      　　
      　　把臉貼在古·拉哈·提亞身上的光甚至還沒把剩下的半句話說完，身側的陰影突然籠罩下來。
      　　
      　　艾斯蒂尼安以迅雷不及掩耳之勢伸出手，一把鉗住了光的手臂，桑克瑞德則默契十足蹲了下來，一鼓作氣扛起光的雙腿。堂堂拯救世界的光之戰士，在毫無防備之下竟被兩位同伴像扛麻袋一樣直接扛了起來。
      　　
      　　「喂！幹嘛？！」
      　　
      　　「閉嘴。」艾斯蒂尼安言簡意賅。
      　　
      　　「替你解渴。」桑克瑞德笑得極其和善。
      　　
      　　兩人同時將視線往前方投去──城鎮中央的廣場上，正矗立著一座巨大而清涼的石製噴泉，雕刻的造景歡快地噴灑著水花，在烈日下拉出數道虹彩。
      　　
      　　桑克瑞德與艾斯蒂尼安邁著大步走到池邊，甚至連倒數都省了，雙臂同時一發力，直接將英雄扔進了池裡。
      　　
      　　廣場濺起巨大的水花。
      　　
      　　光從清澈見底的噴泉池裡狼狽地探出頭來，濕透的碎髮全貼在臉頰上，身上的輕甲也吸滿了水。
      　　
      　　艾斯蒂尼安單手扛著長槍，居高臨下地站在池邊，冷哼了一聲：「嘴唇還乾嗎？」
      　　
      　　「這下水分夠充沛了吧，英雄閣下？」桑克瑞德煞有其事地交叉拍著手，笑得一臉幸災樂禍。
      　　
      　　站在不遠處的古·拉哈·提亞先是驚呼了一聲，隨後看著泡在池子裡一臉懵然、還在滴水的光，忍不住笑出聲來。
      　　
      　　但歡快的表情還是參雜著些許心虛，畢竟是他自己挑起的事端，面帶不忍的古·拉哈·提亞小步跑到池邊，蹲下身朝光伸出手。
      　　
      　　「……」
      　　
      　　看著那雙關切的眼睛，光感到又好氣又好笑。他握住古·拉哈·提亞的手，拇指卻依然學不乖似地，緩慢又刻意地摳弄著貓魅的掌心。
      　　
      　　「光！你……！」
      　　
      　　被這麼一鬧，貓魅終於羞憤地一把抽回手，隨後頭也不回地朝著城鎮大街的方向快步走去，留下一串氣呼呼的腳步聲，以及身後艾斯蒂尼安與桑克瑞德再度無奈望天的長長嘆息。
