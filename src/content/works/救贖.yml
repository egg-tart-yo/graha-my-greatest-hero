      　　武器碰撞的激烈聲響迴盪在廣闊的空間裡。
      　　
      　　劍鋒擦過盾面，火星短促地迸開，又在下一瞬間被魔法結界吞沒。沉重的人偶踏碎地面的回音，隨著最後一次交擊戛然而止。
      　　
      　　待比試結束，完成任務的亞拉戈人偶單膝跪下，核心中的光芒逐漸黯淡，失去動力後便維持著臣服般的姿勢，不再動彈。
      　　
      　　水晶公這才緩緩垂下手中的劍盾。
      　　
      　　他站在原地停了片刻，調整因激烈訓練而失衡的呼吸，隨後才以手臂拭去額上的汗珠，順手理開貼在側臉的銀白色髮絲。
      　　
      　　過去因為必須隱藏身份，他並不與水晶都的衛兵一同訓練，水晶公從容可靠的一面會留給他的人民，而真正揮劍、施法、調整身體狀態的時間，幾乎都藏在水晶塔深處。
      　　
      　　如今，他們已經奪回了第一世界的黑夜。
      　　
      　　漫長的使命像是終於落下帷幕，然而對水晶公而言，平靜不是懈怠的理由，他依然保留著自我訓練的作息，好應付隨時可能發生的戰鬥。
      　　
      　　他緩步走向牆邊，將練習用的劍與盾仔細放回架上。
      　　
      　　牆邊整齊排列著各式武器。咒杖與法杖佔據了大半位置，從簡樸的練習用具到精巧的亞拉戈製式皆有，旁邊也放著短劍、盾牌與幾件備用的護具。
      　　
      　　而在武器架的高處，懸掛著一把黑色的弓。
      　　
      　　水晶公抬起頭，紅色的眼睛無聲地望著那把弓。
      　　
      　　它被收得很好，弓身沒有落塵，弦也被妥善保養著，完全看不出是百年來從未被使用過的樣子。
      　　
      　　水晶公靜靜看了它一會。
      　　
      　　隨後，他像是突然被某種念頭牽引，抬起手，朝高處的弓伸去。
      　　
      　　然而手停在了半空。
      　　
      　　指節輕輕收緊，卻沒有再往前。
      　　
      　　紅色眼眸中的光微微沉了下去，水晶公輕嘆了口氣，最終還是選擇垂下手。
      　　
      　　就在這時，身後傳來熟悉的聲音。
      　　
      　　「為什麼不拿了？」
      　　
      　　水晶公的肩膀幾不可察地一頓。
      　　
      　　他回過頭，看見本該還在外頭處理委託的人不知何時已站在入口處，對方身上還帶著外界夜風的氣息，目光越過他，落在武器架上那把黑色的弓，又重新回到他臉上。
      　　
      　　水晶公怔了一下，隨即露出溫和的笑，立起的貓耳微微顫動著。
      　　
      　　「英雄？」他語氣裡帶著幾分意外，「怎麼這麼快就回來了？」
      　　
      　　光朝他走來。
      　　
      　　那雙比水晶塔周圍還明亮的蔚藍眼睛盯著他看了好一會，隨後危險地瞇起。
      　　
      　　「不是我回來得早。」他伸出手，無奈地揉了揉紅色貓耳中間的髮絲，「是你練習得太久了。」
      　　
      　　水晶公的耳朵被他揉得往旁邊偏了偏，忍不住仰起頭、露出了微笑。
      　　
      　　「沒事的。」他輕聲說，「只是上回一起冒險後，有幾分心得想趕快嘗試。」
      　　
      　　提起上回的冒險，水晶公的眼睛忽然明亮了起來，那份藏不住的雀躍，使他看起來更接近光記憶中的古·拉哈·提亞。
      　　
      　　光原本還想數落他幾句，見狀卻只能笑著嘆了口氣。
      　　
      　　他收回手，視線又落到那把黑色的弓上。
      　　
      　　水晶公順著他的目光看去，唇邊的笑意淡了些，卻沒有完全消失。
      　　
      　　「最近總被叫喚自己的真名，不免想起了一些過去的事情。」
      　　
      　　他朝光眨了眨眼，語氣仍舊溫和。
      　　
      　　「剛來到第一世界的時候，我也是用弓戰鬥的。不過後來水晶的侵蝕變得嚴重，弓箭所需的精細操作，我已經無法達成了。」
      　　
      　　平靜的話語看似接受了一切，光卻沒有立刻回答。
      　　
      　　他靜靜看著水晶公，最後伸出手。
      　　
      　　粗糙且佈滿厚繭的指尖，先是碰了碰他冰涼的水晶手臂，隨後緩緩向上，停在前胸，在水晶化與真實身體交界的地方輕點著。
      　　
      　　「疼嗎？」
      　　
      　　光聽見自己輕聲問。
      　　
      　　水晶公垂眼看著他的手，片刻後，只是給了他一個溫和的眼神。
      　　
      　　「跟靈魂被光之力衝碎比起來，我這根本不算什麼。」
      　　
      　　光無奈地看了他一眼。
      　　
      　　他有時候真的很想告訴這個人，拿更痛的事情來比較，並不會讓眼前的痛變得不存在。
      　　
      　　得找個機會，好好跟對方說說這個糟糕的觀念。
      　　
      　　光忽然抬起手，將那把黑色的弓從高處取了下來。
      　　
      　　「英雄？」
      　　
      　　他沒有理會對方的疑惑，而是盤腿坐了下來，低頭端詳起手中的武器。
      　　
      　　這是一把很不錯的弓。
      　　
      　　即使許久未被用於實戰，弓身依然保持得很好。選木極佳，彈性與硬度都恰到好處，弓弦也沒有明顯鬆弛。
      　　
      　　光用指腹細細檢查弓身各處，時不時撥動弓弦，又試著拉開弓臂，感受它所需的力道。
      　　
      　　水晶公一頭霧水地跟著蹲在他身邊，兩手垂在身前，長尾因困惑而輕輕搖動。
      　　
      　　「英雄，你這是……？」
      　　
      　　「看能不能改。」
      　　
      　　「改？」
      　　
      　　「嗯。」光又試著拉了一次弦，眉頭微微蹙起，「水晶化的臂膀大概沒辦法驅使它所需的拉力，如果調整一下拉動弓弦所需的力道，應該就可以了。」
      　　
      　　水晶公一怔，而後抬起頭。
      　　
      　　「真的？」
      　　
      　　他的聲音很輕，甚至帶著一點自己都沒有察覺的期待。
      　　
      　　光朝他投去肯定的眼神。
      　　
      　　「殺傷力可能會下降一些，射程也未必能和過去一樣，但只要準度還在，就不算什麼大問題。」
      　　
      　　他頓了頓，又補上一句。
      　　
      　　「更何況，這又不是要你現在就拿它上戰場。」
      　　
      　　水晶公張了張口，卻一時沒有接話。
      　　
      　　過了片刻，他才低聲道：「但是，這樣也太麻煩英雄了。而且……我恐怕還需要花很多時間找回手感。」
      　　
      　　「那就找回來。」
      　　
      　　光回答得毫不猶豫。
      　　
      　　「我認識的古·拉哈·提亞，是個優秀的弓箭手。」光說，「那些過去的練習與努力，不會因為你有一段時間不能使用它，就全部消失。」
      　　
      　　水晶公的指尖微微動了一下，光將弓直接塞了過來。
      　　
      　　「你的身體一定還記得。」
      　　
      　　弓身落入掌中的重量比記憶中陌生了一些，卻又並非完全不同。他垂眼望著它，指腹輕輕撫過弓身，像是在確認自己是否真的還能握住它。
      　　
      　　光看著他，唇角微微揚起。
      　　
      　　「下回冒險，再拉響它吧。」
      　　
      　　水晶公抬起眼。
      　　
      　　紅色的眼眸裡仍有動搖，卻也在那份動搖之中，亮起了久違的光。
      　　
      　　他輕輕收緊手指，將弓抱在懷中。
      　　
      　　「好。」
      　　
      　　停了一會，他又像是終於忍不住似的，露出一個比方才真切許多的笑。
      　　
      　　「若真有那一日，還請英雄務必在旁見證。」
      　　
      　　光看著他，也跟著露出微笑，而後又揉了一把那對紅色的貓耳。
