title: 任務的插曲
cp:
  - 拉哈光
updated: 2026-01-01
summary: 無
series: 短篇
chapters:
  - body: |-
      　　陰暗的地下深處，潮濕的氣息彷彿黏在了喉間，讓人無法喘息。這裡沒有通風的窗口，唯有幾盞昏黃的光源，與空氣中瀰漫的腥羶、汗酸，以及一股說不上來的黏膩甜香攪在一起。
      　　
      　　光眉頭緊皺，抬起手掩住了口鼻，胸口一陣作嘔。
      　　
      　　那股氣味太過混雜，刺鼻得讓人神經緊繃，身側的古·拉哈·提亞同樣壓低了身形，兩人腳步極輕地穿過長廊，隨後拉開了走廊盡頭那扇沉重的鐵門。
      　　
      　　房間裡的景象，讓光的眼神在一瞬間降到了冰點。
      　　
      　　凌亂的床褥之間，倒躺著一名年輕的貓魅族，那人渾身如落水般被冷汗浸透，雙眼渙散地盯著天花板，眼眶周圍泛著病態的深紅，唇角還不受控制地淌著混濁的唾沫。
      　　
      　　他像是陷在一場永遠醒不來的噩夢中，喉嚨裡發出斷斷續續的微弱呻吟，連衣物被撕扯得殘破不堪、私處裸露在外都毫無知覺。
      　　
      　　不用特別調查，就知道他曾遭受什麼對待。
      　　
      　　光心頭滿是難以遏制的厭惡與怒火。
      　　
      　　他快步走上前去，拔出短刃俐落地斬斷了捆在床柱上的繩索，又脫下斗篷遮掩他傷痕累累的身軀。
      　　
      　　正當光俯身想要將他扶起時，鼻尖忽然捕捉到床頭木桌上飄來的一抹異香。
      　　
      　　那是一個打翻的玻璃瓶，殘留的液體正順著桌緣一滴滴滲入地面，散發出一種極其濃烈、帶著強烈刺激性的花麝香氣。
      　　
      　　光猛地一愣，幾乎是反射性地回過頭，慌忙大喊：「拉哈，快離開──」
      　　
      　　然而太遲了。
      　　
      　　古·拉哈·提亞靠在門框邊，單手死死按著胸口，臉龐湧上一股不自然的潮紅，他的眼睛蒙上了一層水霧，胸膛劇烈起伏地急促喘息著。
      　　
      　　下唇被他自己咬得發白、滲出血絲，顯然正在用痛楚拼命壓制體內的躁動。
      　　
      　　「……我沒事。」
      　　
      　　察覺到光的視線，古·拉哈·提亞有些狼狽地撇開頭，神情藏在兩側的散髮間，他的嗓音啞得不像話，連帶著指尖都在微微發顫。
      　　
      　　「先、先把人帶出去……快點。」
      　　
      　　他們不能在這裡倒下。
      　　
      　　光咬緊牙關，將已經喪失意識的人扛上肩頭，古·拉哈·提亞則強撐著拔出劍，在前方開路。兩人一路打退殘存的守衛，直到將受害者安全轉交給接應的軍團，重新踏入幽靜的林間月夜。
      　　
      　　清冷的夜風迎面而來，古·拉哈·提亞緊繃的神經驟然一鬆，整個人像是被抽乾了所有力氣，雙膝一軟、脫力地跪倒在鬆軟的草地上。
      　　
      　　「哈啊……呼……」
      　　
      　　他雙手撐著濕潤的泥土，手指深深陷進草根，大口大口地用力換氣，額前的紅髮全被冷汗打濕，黏在滾燙的額頭上。
      　　
      　　「拉哈！」
      　　
      　　光快步走到他身側蹲下。
      　　
      　　「光……抱歉……」
      　　
      　　古·拉哈·提亞偏過頭去，羞恥得根本不敢與光對視，眼眶裡滿是強忍著生理本能而逼出的淚水，連話語都結結巴巴、斷斷續續。
      　　
      　　「我、我可能得……自己去遠一點的地方……解決一下……那個迷藥……咳、恐怕對貓魅族的嗅覺……特別有效……」
      　　
      　　看著古·拉哈·提亞痛苦又難堪的模樣，光的心底被密密麻麻的自責填滿。
      　　
      　　如果他能早一點發現，就不至於讓眼前人遭受折磨。
      　　
      　　光牽過那雙顫抖著的手，找了隱蔽的樹幹下坐定，隨後伸出雙臂，不由分說地將渾身滾燙的古·拉哈·提亞撈了過來，讓他穩穩地坐在自己的懷中。
      　　
      　　「在這裡就好。」光湊在他耳邊，語氣認真而平靜，「我幫你。」
      　　
      　　「等、等等──光？！這種事……」
      　　
      　　古·拉哈·提亞驚慌地想要掙扎，但全身的力氣早已在與藥性的抗衡中消耗殆盡，稍微一動便軟得像水一樣。
      　　
      　　光沒有猶豫，隔著衣物撫上早已堅硬滾燙的下腹，隨後解開了腰帶與束縛。當夜風拂過那早已挺立得發脹、前端甚至開始滲出清液的分身時，古·拉哈·提亞整個人猛地顫抖了一下。
      　　
      　　英雄的掌心帶著常年握持兵刃磨出的薄繭，乾燥又粗糙，他稍加用了點力氣，握住發熱的部位，古·拉哈·提亞發出了一聲近乎崩潰的咽嗚。
      　　
      　　貓魅羞恥得無地自容，耳朵死死壓在髮絲間，將通紅發燙的臉龐深深埋進了光的頸窩裡。他的尾巴緊緊纏在光的腿上，渾身都在劇烈地戰慄。
      　　
      　　「別……不要看……別看我這副模樣……！」
      　　
      　　藥物即將耗盡他死死把持的理智，渴望被碰觸、釋放的慾望逐漸取代腦內所有的念頭。他只能微弱地哀嚎、手掌無力地推著光的身軀，指尖卻緊緊地抓皺了衣襟。
      　　
      　　「沒事的，別在意。」光吻了吻他的髮頂，柔聲安慰著懷裡劇烈顫抖的人，「出來會好一點的。」
      　　
      　　光的手指開始上下滑動，指腹偶爾蹭過敏感脆弱的頂端，帶來一陣陣讓古·拉哈·提亞發抖的刺激感。
      　　
      　　掌心的動作逐漸加快，混著前端溢出的濕潤，發出而令人面紅耳赤的水聲。古·拉哈·提亞癱軟在光的頸側，急促的喘息灼燒著光的皮膚，喉間斷斷續續地溢出破碎的嗚咽與微弱的抽泣。
      　　
      　　「光……光……」
      　　
      　　「我在。」
      　　
      　　他無措地呼喚著，直到光猛地收緊力道、指尖刺進頂端細微的小縫，古·拉哈·提亞整個人如弓弦般猛然繃緊，渾身劇烈地發抖著。
      　　
      　　「光……光……哈啊……！」
      　　
      　　伴隨著一聲帶著哭腔的尖銳抽氣，滾燙濃稠的白濁劇烈地噴濺在指縫與草地上。古·拉哈·提亞重重地癱軟下來，劇烈地喘息著，淚水與唾沫把光的衣領浸得一片深濕。
      　　
      　　然而，想像中的解脫並沒有到來。
      　　
      　　光低頭看著掌心，眉頭卻微微蹙起。
      　　
      　　分身在發洩過後，非但沒有半點消退軟化的跡象，反而在藥力的肆虐下漲得更加滾燙，前端也依舊持續吐著透明的黏液。
      　　
      　　光正煩惱著該如何是好，懷中的古·拉哈·提亞卻突然動了起來，體內那股無處發洩的烈火彷彿徹底燒斷了最後一根名為理智的弦。

      　　古·拉哈·提亞猛地轉過身，渾身向下一倒，竟連帶將光推倒在冰涼的草地上。
      　　
      　　「拉哈？先別起來──」
      　　
      　　話還沒說完，身軀便沉沉地壓了上來，他像是溺水的人抓住浮木一般，垂下的頭深深埋入他的頸窩，鼻尖貪婪地嗅著熟悉的氣味，通紅滾燙的下體急迫地抵在光的雙腿之間，隔著布料克制又隱忍地磨蹭著。
      　　
      　　古·拉哈·提亞一邊混亂地蹭著，咬著牙掉下了眼淚，大顆大顆滾燙的淚珠砸在光的鎖骨上，他的聲音破碎得幾乎聽不清字句，滿是絕望與自厭的痛苦。
      　　
      　　「對不起……對不起……光……我沒辦法克制……藥效退不掉……」古·拉哈·提亞近乎哀求地抽噎著，雙手死死抓著光兩側的草葉，卻不敢真正擁抱住他，「你不該……你必須離開這裡……不能再讓我……」
      　　
      　　明明身體渴求得快要發瘋，理智卻依然在為這份可能冒犯到光的欲望而痛苦掙扎。
      　　
      　　看著這樣的古·拉哈·提亞，光眼底沒有一絲厭棄，只剩下無邊無際的柔軟與疼惜。
      　　
      　　他知道，這個人從來不願強迫自己。

      　　過去兩人之間若有似無的曖昧，也從未因一句明言的承諾，而真正替彼此的關係冠上什麼名字。

      　　可若不是這場意外，他或許永遠也不會知道，那個守望了自己百年、始終克制而溫柔的人，竟將如此濃烈的渴望，獨自壓在心底這麼久。
      　　
      　　自己究竟是如何被珍視著呢。
      　　
      　　光輕輕嘆息了一聲，主動抬起手臂，雙手環過古·拉哈·提亞汗濕滾燙的後頸，將他拉向自己，任由他的硬挺緊緊嵌在自己的腿間。
      　　
      　　「是你的話，」光注視著他赤紅的雙眸，認真而溫柔地低語，「怎麼樣都可以。」
      　　
      　　這句話宛如一道驚雷，狠狠劈進了古·拉哈·提亞混沌的腦裡。
      　　
      　　他撐起發軟的手臂，呆呆地低頭看著身下的光，眼裡滿是不敢置信的震顫，淚水還掛在長長的睫毛上，他的嘴唇顫抖著，小心翼翼地、甚至帶著幾分恐懼地確認。
      　　
      　　「我……我真的可以嗎……？」
      　　
      　　光看著他那副像受驚小貓般小心翼翼的模樣，忍不住低低地笑了一聲，眼神滿是縱容與寵溺

      　　「不如先說說，你想怎麼做？」
      　　
      　　古·拉哈·提亞像是被這句反問給徹底擊潰了防線，通紅的顏色從臉頰一路蔓延到耳根與脖頸，他羞恥得連耳尖都在發燙，卻再也無法抵擋體內那股想要將彼此融為一體的渴求。
      　　
      　　他將滾燙的額頭重新抵在光的鎖骨上，把臉深深埋了起來，用微弱、沙啞卻直白的聲音，帶著哭腔低聲喃喃。
      　　
      　　「想……想進去……」
      　　
      　　「想把裡面攪得一團糟……」
      　　
      　　「想要……完完全全在裡面釋放……在你的裡面……」
      　　
      　　光輕輕撐起了上半身，湊上前去，親暱地蹭了蹭毛茸茸的頭頂，又安撫地蹭過他那對忍不住輕顫的耳尖。
      　　
      　　他在古·拉哈·提亞滾燙的耳廓旁，低聲給出了回應。
      　　
      　　「那就來吧，做任何你想做的。」他輕笑道，「只要是拉哈的一切，我都接受。」
