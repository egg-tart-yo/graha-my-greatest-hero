      　　門反鎖上的瞬間，古·拉哈·提亞整個人脫力地靠在門板上，順著木紋滑坐在地。
      　　
      　　他雙手死死捂住嘴，滿臉都是滾燙的紅暈，躁動的胸口劇烈起伏，連喉間都溢出狼狽的喘息。腦海裡揮之不去的全都是方才在大廳裡的畫面，像烈火般灼燒著他的理智。
      　　
      　　當阿爾菲諾蹲在負傷的光身旁，解開沾黏傷口的衣袍、將藥水小心地淋在血痂上時，光隱忍地蹙起眉頭，仰起修長的脖頸，喉嚨深處洩出了一聲壓抑的呻吟。
      　　
      　　那聲混雜著痛楚、脆弱與微微顫抖的氣音，就像一根細針，毫無預警地刺進古·拉哈·提亞的理智。
      　　
      　　他看著光，看著被汗水浸濕的碎髮、因喘息而滾動的喉結，以及那雙在疼痛中泛著水光的眼眸。那一瞬間，只覺得一股陌生的燥熱直衝下腹，下身沉甸甸地、緊繃得發疼。
      　　
      　　他甚至不敢等傷口完全包紮完，將手中備用的繃帶塞給一旁的尤里安傑，找了個藉口便狼狽地落荒而逃。
      　　
      　　「唔……哈啊……」
      　　
      　　不能被任何人發現，尤其是……光。
      　　
      　　古·拉哈·提亞顫抖著手解開腰帶，將長褲連同底褲一同褪下，早已充血挺立的灼熱迫不及待地彈了出來，頂端甚至早已滲出一圈晶瑩黏稠的液體，在幽暗的室內泛著羞恥的水光。
      　　
      　　他的耳朵緊緊壓平，長尾焦躁地不斷擺動，最後終是熬不過內心最原始的慾望，顫巍巍地垂下了手。
      　　
      　　因過度壓抑而泛白的指節覆上那根滾燙的欲望，指腹緩緩向上、貼著濕黏的鈴口狠狠一壓，立刻引來自己一聲難耐的嗚咽。
      　　
      　　「哈……唔嗯……」
      　　
      　　腦袋發暈的他開始上下擼動，掌心帶著薄汗，與滲出的腺液攪在一起，發出細微而淫靡的水聲。隨著每一次收攏掌心，腦海裡浮現的不是別的，全都是光那張隱忍的側臉，以及低沉誘人的呻吟。
      　　
      　　古·拉哈·提亞被慾望浸濕的眼底泛著一絲無措，他覺得自己的實在太卑劣了，居然對著受傷的光起了這種骯髒的心思。可罪惡感非但沒能澆熄欲望，反倒在浴火上添了柴。他仰起頭、腰無意識地向上一挺，配合著掌心的動作急促抽送。透明的黏液被塗抹得整根都是，濕滑、黏膩，像是無處發洩的慾望，遍佈每一吋皮膚。
      　　
      　　「英雄……」
      　　
      　　意亂情迷的貓早就分不清自己到底是在心裡默念，還是已經失控地喊出了聲。發紅的眼蒙著一層濃重的水汽，眼前一片模糊，他只能憑著本能，加快了掌中套弄的速度，指尖甚至難耐地劃過自己發燙的腿根，帶起一陣陣戰慄。
      　　
      　　「哈啊……想要你……唔！光……！」
      　　
      　　攀上頂點的瞬間，一聲壓抑不住的甜膩叫喊從咬緊的唇縫間溢出。
      　　
      　　灼熱的白濁伴隨著劇烈的抽搐噴薄而出，大股大股地澆在他自己的掌心、又順著指縫溢出，甚至濺上了敞開的衣襬與小腹。
      　　
      　　黏膩的腥羶氣息在狹小的房間裡迅速擴散開來。
      　　
      　　古·拉哈·提亞癱軟在地上，大口喘氣、努力平復著胸口，失神的眼眸還沒來得及聚焦，整個人沉浸在高潮的餘韻中。
      　　
      　　突然──
      　　
      　　「咚、咚。」
      　　
      　　沉穩的敲門聲毫無預兆地在耳後響起，隔著一扇薄薄的門板，清晰得宛如雷鳴。
      　　
      　　「拉哈？你在裡面嗎？」
      　　
      　　是光的聲音。
      　　
      　　古·拉哈·提亞全身的毛瞬間炸開，整個人嚇得猛地一縮，險些失聲叫出來。
      　　
      　　他手忙腳亂地想爬起來，然而手上滿是黏糊糊的白濁，濕滑得根本使不上勁，甚至在慌亂中抹到了旁邊的石磚上。他光著下身，周圍一片狼籍，滿室揮不去的羞人氣味更是赤裸裸地宣告著，這裡才剛發生過多麼荒唐的事。
      　　
      　　這副模樣別說開門，根本連躲藏都毫無辦法。
      　　
      　　「拉哈？聽得到嗎？」門外的聲音遲遲等不到回應，不免染上一絲急迫，「為什麼剛才跑得那麼急？你是不是也受傷了？不許瞞著我，把門打開。」
      　　
      　　光的聲音那麼溫柔、那麼擔憂，甚至還帶著戰鬥歸來的疲倦。
      　　
      　　強烈的羞恥與愧疚瞬間將古·拉哈·提亞淹沒。
      　　
      　　他垂著腦袋，狼狽地靠在門板上，眼眶泛紅，委屈與慌亂交織成一團亂麻。左手緊緊抓著乾淨的衣角，將那隻沾滿白濁的右手藏在身後，聲音微弱得幾乎要被呼吸掩蓋。
      　　
      　　「……別進來……我、我沒事……」
      　　
      　　「拉哈？」
      　　
      　　門把被輕輕擰動了一下，門外的語氣逐漸嚴肅了起來。
      　　
      　　「把門打開。無論發生什麼，我都想確認你沒事。」
      　　
      　　古·拉哈·提亞吸了吸鼻子，眼淚幾乎要急得掉下來。他知道光的脾氣，如果不開門，這個人會乾脆在門外席地而坐，等到耐心耗盡就會不顧自己的傷勢，直接將門撞開。
      　　
      　　他咬了咬泛白的下唇，額頭抵在門上，用幾乎帶著哭腔的微弱聲音，顫巍巍地開口：「那……那你要先答應我……」
      　　
      　　「等等開門……看到什麼，都絕對……不可以討厭我……」
      　　
      　　門外安靜了一瞬。
      　　
      　　短暫的沉默讓古·拉哈·提亞的心跳比震鼓雷鳴還響亮，然而，門外傳來光無比認真、溫和卻又堅定得不容置疑的回答：「說什麼傻話，你的一切我都會接受。」
      　　
      　　那句承諾擊碎了所有的防線。
      　　
      　　古·拉哈·提亞臉紅得彷彿正在灼燒，他狼狽地拉好衣物，顫抖著伸出那隻唯一乾淨的左手，小心翼翼地搭上了門鎖。
      　　
      　　嗒。
      　　
      　　鎖芯轉動，門被顫巍巍地拉開了一條縫隙。
