summary: 5.0完結後衍生，請進度到5.x再點開
chapters:
  - body: |-
      　　自城主與他的同鄉們身披夜星的光芒、滿身是傷從黑風海底歸來，水晶都的歡騰與慶祝之聲就從未停止。人們總是聚集在街道或窗台邊，一同仰望著百年未曾降臨諾弗蘭特的長河星辰。
      　　
      　　而黑夜與希望的引路人，此刻依然端坐在水晶塔房內的長桌之中，與過去百年相同，埋首在那堆幾乎將貓魅淹沒的公文與書籍。
      　　
      　　「水晶公。」
      　　
      　　一道溫和的呼喚打斷了紙張的書寫聲。
      　　
      　　久未示人的貓耳微微一動，看見來人的水晶公勾起與平日相同的溫和微笑。
      　　
      　　「阿爾菲諾？這麼早過來，有什麼事嗎？」
      　　
      　　「只是想來看看你的身體。」
      　　
      　　少年緩步走進，目光在看見桌上堆著一大疊待審批的紙張時蹙起眉，語氣也添了點無奈，「畢竟才剛歷經一場大戰，還請好好休養，別過度勞累。」
      　　
      　　「謝謝關心，這點還不算什麼。」
      　　
      　　水晶公笑著搖了搖頭。
      　　
      　　「畢竟我與這座水晶塔已是一體，只要塔還在，這副身體就算受了致命傷也能修復。倒是拂曉的各位，以靈魂的姿態經歷了長時間的戰鬥，在還沒辦法回歸肉體之前，請務必以休養為先。」
      　　
      　　一貫讓人看不出破綻的微笑卻瞞不住阿爾菲諾，清澈的眼睛在貓魅的神情上逗留片刻，最終無奈地嘆了口氣。
      　　
      　　真是的，怎麼連逞強的模樣都和某位英雄一模一樣。
      　　
      　　年輕的精靈定了定神，唇角揚起一抹笑意，「既然身體沒有大礙，那麼……有件事我想趁這個機會，和你聊一聊。」
      　　
      　　水晶公好奇地偏了偏頭，耳尖跟著輕輕一顫，「聊聊別的事？是指城裡的物資調配，還是……」
      　　
      　　「不，不是那些公務。」
      　　
      　　阿爾菲諾收斂了幾分笑意，一雙清透的藍眼彷彿能看透人心，真摯又溫和地望著貓魅。
      　　
      　　「例如說……未來的事情。」
      　　
      　　
      　　*
      　　
      　　
      　　「阿莉塞……我想問你一件事。」
      　　
      　　「問啊，吞吞吐吐的，真不像你。」
      　　
      　　「如果……我是說如果，想要帶一個人出去旅行，要怎麼安排才會比較好？」
      　　
      　　「叮」的一聲脆響。
      　　
      　　原本坐在露台一角、用銀匙緩慢攪拌果汁的阿莉塞，手的動作微微一頓。她緩緩放下茶匙，抬起同樣清澈的眼瞳，帶著一絲狐疑與打量，直勾勾地盯著坐在對面的英雄。
      　　
      　　「……你剛剛說什麼？」
      　　
      　　光不自在地輕咳了一聲，試圖掩蓋住自己尷尬的神色。
      　　
      　　「我的意思是……如果希望一個人能覺得『旅行是一件非常快樂的事』，行程該怎麼規劃比較妥當？」
      　　
      　　阿莉塞眨了眨眼睛，花了一些時間咀嚼英雄的問題，隨後，少女的眼眸微微彎起，唇角掛上了一抹極具玩味的弧度。
      　　
      　　「嗯哼？」
      　　
      　　「……你那是什麼眼神。」
      　　
      　　「沒什麼啊。」
      　　
      　　阿莉塞單手托著下巴，纖瘦的腰微微前傾，用新奇又審視的目光望著眼前的同伴。
      　　
      　　「只是覺得新奇。平常那個說走就走、路線跟行程都毫不規劃的大英雄，居然會問這種問題？」
      　　
      　　光有些狼狽地把視線移開，直盯著桌上的木紋。見他這副模樣，阿莉塞嘴角的笑意更為明顯，甚至帶上了一絲調侃。
      　　
      　　「看來這次的旅伴很特殊？特殊到連你都得瞻前顧後？」
      　　
      　　「不是你想的那樣……」
      　　
      　　「該不會……」少女壓低了聲音，眼底閃爍著淘氣的光芒，「你想拐出去的那個人，是水晶公吧？」
      　　
      　　一聽見那人的名字，光的脊背幾不可察地僵直，耳根悄悄泛起了一層薄紅。
      　　
      　　「噗！猜中了？！」
      　　
      　　阿莉塞再也忍不住笑出了聲。
      　　
      　　光被她笑得有些尷尬，伸手抓了抓頭髮，無奈地嘆了口氣。
      　　
      　　「……你是怎麼看出來的？」
      　　
      　　「拜託！我倒是想問誰看不出來！」
      　　
      　　阿莉塞揩了揩眼角的眼淚。
      　　
      　　不過看到對方確實有些無所適從，向來體貼的少女還是見好就收，很快地端正起神情，認真地清了清嗓子。
      　　
      　　「好啦，言歸正傳──所以呢？你打算帶他去哪？」
      　　
      　　「就是豪無頭緒，才想來聽聽你的建議。」
      　　
      　　光雙手撐著桌面，眉頭微微皺了起來。
      　　
      　　「你也知道拉哈的身體狀況，不能離開水晶塔太久，所以過長的路線就不太可行，也得保留發生萬一能平安回程的空間。另外，沿途如果能有些小小的挑戰，那就再好不過……」
      　　
      　　阿莉塞聽著他一條一條、細心地陳述著那些不曉得在腦海裡兜轉了幾個日月的考量，笑意漸漸化為了一股柔軟的情緒。
      　　
      　　「總之……」
      　　
      　　自顧自說著的光沒發現阿莉塞神色的變化，他的聲音漸漸低了下來，方才的拘謹逐漸消失，取而代之的是一種極其沉靜的溫柔。
      　　
      　　「我想帶他去親眼看看……這個世界。」
      　　
      　　少女微微一怔。
      　　
      　　順著光的視線，藍眼一同投向繁華的水晶都市街。
      　　
      　　清脆的鈴鐺聲從廣場傳來，歡騰喧鬧的市集總會延續到夜幕。他們相信這座充滿生命力的城市會是諾弗蘭特的一個縮影，而過去旅行所造訪的地方，終有一日，也會如此處般溢滿久違的生機。
      　　
      　　「雖然他說過，是為了拯救一個人，才順道拯救了世界。」光收回視線，澄澈的藍瞳裡映著微光，「但至少……我想讓他親眼看一看，這個被他拼盡全力挽救下來的諾弗蘭特，是多麼美好的地方。」
      　　
      　　精靈眼底的笑意化為理解與動容。
      　　
      　　她輕輕抿了口果汁，隨即歪了歪頭。
      　　
      　　「不過，你怎麼就那麼篤定他一定會喜歡出門旅行？說不定那位水晶公大人更喜歡待在塔裡看書呢。」
      　　
      　　「他會喜歡旅行的。」
      　　
      　　面對阿莉塞探尋的目光，英雄十分肯定地點了點頭。
      　　
      　　「之前從古代隆卡帝國回來的時候，守護者們給了我一份同盟者的記錄。」他沉聲解釋，「我想著或許提供給書庫，對於歷史研究會有幫助，就轉交給了水晶公。」
      　　
      　　「結果，他居然拉著我問了好多好多問題，從遺跡內的迷宮到牆上的壁畫，還有困住我們的機關……」
      　　
      　　光有些不好意思地摸了摸鼻尖。
      　　
      　　「畢竟大森林是得到允許才能進入的地方。我也是直到那時才發現，原來也有水晶公不曉得的事情，而且他也會因為聽見驚險刺激的冒險，而感到振奮。」
      　　
      　　英雄的唇角不自覺地泛起笑意，似乎沉浸在了某些溫暖的回憶裡。
      　　
      　　靜靜聽著的阿莉塞眼眶有些發熱，她輕咳一聲，露出了然的微笑。
      　　
      　　「所以我就在想，」光的語氣很輕，微小卻純粹的發想從話語裡逐漸散開，化為起步的契機，「如果不是聽我轉述，而是真正能踏上那些地方，他一定會笑得比任何人都開心。」
      　　
      　　單純的心意輕輕振盪著阿莉塞的內心。
      　　
      　　她長長地呼了一口氣，隨即用力拍了一下桌子，元氣十足的擺出自信的姿態。
      　　
      　　「……好吧！」
      　　
      　　「既然你都說到這個份上了，那本小姐就勉為其難，幫你把把關好了！」
      　　
      　　少女手叉腰，精神抖擻地伸出食指，開始一條一條分析。
      　　
      　　「首先是位置！既然水晶公不能長時間離開塔，那目的地就沒辦法超出雷克蘭德的範圍太多。」
      　　
      　　「其次是步調！把你平日裡那種接了委託就一路狂奔、一下跑到森林裡，沒多久又繞到洞窟裡的步調給我收起來！這次是去散步，不是去討伐魔物，要好好享受旅途！」
      　　
      　　「……我平常哪有那麼誇張。」
      　　
      　　阿莉塞不理會光微弱的抗議，語氣嚴厲地接著往下。
      　　
      　　「沿著湖邊的步道走是最好的，那一帶鋪了木板，地勢平坦，而且湖邊種滿了藤花。沒有了光之氾濫後，湖水重新倒映出藍天和雲彩，風景好得沒話說。」
      　　
      　　光已經不曉得從哪掏出了筆記，認真地埋頭書寫。
      　　
      　　「然後，食物也是關鍵！」少女繼續比劃，「水晶公一忙起來只會啃那種乾巴巴的硬麵包，記得去找彷徨階梯亭的老闆娘預訂方便攜帶的野餐籃。最後──」
      　　
      　　阿莉塞的神情突然變得無比嚴肅，光也停下抄寫的筆尖，像好學生般認真聽著。
      　　
      　　「出發之前，你必須清清楚楚、毫不含糊地告訴他──這次出門，跟拯救世界沒有半點關係，跟暗之戰士的使命也毫無關聯，更不需要他再扮演著『水晶公』！」
      　　
      　　光的神色頓了一頓，困惑又複雜的眼神望著氣勢洶洶的精靈。
      　　
      　　阿莉塞認真地補充：「得講清楚，不准他帶任何公務出來處理，只單純享受旅行就好。」
      　　
      　　英雄的筆尖再次動了起來，將這句話抄在紙張的最後，隨即低低地笑出了聲。
      　　
      　　腦海中，那幅尚未發生的畫面彷彿已經無比鮮明地浮現了出來──
      　　
      　　當他拿著這張滿是塗改的筆記，走到觀星室的那張大桌子前，對那個正襟危坐的男人發出邀請時……對方會露出什麼樣的神情？
      　　
      　　一開始一定會手足無措吧。
      　　
      　　那雙總是沉穩從容的赤紅雙瞳，一定會因為驚訝而睜得圓滾滾的，耳尖大概還會不受控制地微微抖動。
      　　
      　　然後……當確認這不是在開玩笑後，那雙眼睛裡，一定會重新燃起像百年前那樣純粹、耀眼、不再被任何陰霾遮蔽的光芒。
      　　
      　　想到那一幕，光的心口便泛起一陣溫熱的悸動。停下動作的英雄望著眼前的紙張，臉上泛起溫柔的微笑。
      　　
      　　「阿莉塞，你說……」
      　　
      　　「如果他能親自體會到，這個世界還有那麼多值得留戀的小事、那麼多等待他探尋的秘密……發現活著，本該是一件多麼令人期待的事情……」
      　　
      　　光的低喃帶著一絲孩子氣的執拗，也富含冒險最純粹的初衷。
      　　
      　　「那麼下一次再遇到困難的絕境，他或許……就不會再那麼理所當然地，把『自我犧牲』當成唯一正確的選項了吧。」
      　　
      　　微風拂過露台，揚起少女額前的碎髮。
      　　
      　　沉默了片刻後，阿莉塞猛地站起身來，動作俐落地挽起了雙臂的袖口。
      　　
      　　「……那這樣哪夠啊！筆記給我翻去下一頁！」
      　　
      　　光被她突如其來的動作嚇了一跳，「阿莉塞？」
      　　
      　　「既然是要讓那個老是把自己排在最後一位的超级大笨蛋明白活著有多棒……」
      　　
      　　阿莉塞看著笨拙的光，忍不住一把將桌上的筆記本搶了過去，眼底燃燒著前所未有的鬥志。
      　　
      　　「那就必須拿出更多更完美無瑕的旅行！讓他光是走完這一次，就忍不住開始期待下一次、下下次，還有未來幾十年數都數不清的每一次冒險才行啊！」
      　　
      　　光怔愣了片刻。
      　　
      　　隨即，困擾多日的煩惱最終化為一聲無比暢快的輕笑。
      　　
      　　「那就麻煩你了，阿莉塞大人。」
      　　
      　　「哼，交給我吧！」
      　　
      　　露台的陽光就這麼陪伴著湊在木桌前的兩人。
      　　
      　　他們全神貫注地為那場尚未告知主角的旅行，塗塗改改地添上一個又一個溫暖的座標。
      　　
      　　而激烈的討論與嬉鬧聲，或許也順著微風，被帶到了觀星室內。
      　　
      　　「未來……」
      　　
      　　水晶公低低地重複了一遍這個字眼，隨即露出一抹寬慰的微笑，「黑夜歸來之後，諾弗蘭特各地都在逐漸復甦，這座城市也是。大家終於能從那場醒不來的惡夢中解脫，開始重新建立秩序與希望了。」
      　　
      　　「不，我所指的，並非僅僅是水晶都的未來。」
      　　
      　　阿爾菲諾微微搖頭。
      　　
      　　「自大戰結束以來，我走遍了水晶都的各個角落。衛兵與工匠、農場與市集的人民，已經完全具備了獨自面對未來的勇氣與力量。這裡正朝著生機勃勃的方向前進，也歸功於你百年建構的奠基。」
      　　
      　　年輕精靈稍微停頓了一下，迎向水晶公有些茫然的視線。
      　　
      　　「所以……也差不多該談談，你對自己『未來』的想法。」
      　　
      　　觀星室的空氣靜靜地沉寂。
      　　
      　　貓魅那張向來溫和的臉龐罕見地浮現出空白的錯愕。他的嘴唇微張，耳尖下意識地向後壓低，像是被這突如其來的提問定在了原地。
      　　
      　　顯然，是從未將「自己的未來」列入過任何計劃中。
      　　
      　　阿爾菲諾看著他這副神情，眼簾微微低垂，心頭泛起一陣酸楚。尤里安傑私下坦白的那場密談，至今仍像一根細針扎在拂曉眾人的心口。
      　　
      　　察覺到阿爾菲諾的注視，水晶公微微斂下眼眸，神情沉了幾分，試圖用理性去化解這份動搖。
      　　
      　　「……現在談這些，似乎還太早了。」
      　　
      　　他的聲音壓得很輕，語調沉穩，卻帶著一絲難以掩飾的退縮，「眼下最重要的，是必須先想辦法將拂曉的各位送回原本的世界。你們的靈魂滯留在第一世界越久，原初世界的肉體便越危險……我身為將你們召喚至此的人，無論如何都必須先完成這份責任。」
      　　
      　　「確實，這是我們必須共同面對的問題。」
      　　
      　　阿爾菲諾並未反駁，只是溫和地接下了他的話，隨後，少年的話鋒極其自然地一轉，清澈的目光毫無閃躲地落在他身上，「那麼你呢？我們的同鄉──來自原初世界的古·拉哈·提亞。」
      　　
      　　這份自己使用多年的說詞，讓水晶公徹底怔住了。
      　　
      　　阿爾菲諾的語氣輕柔，卻帶著無比篤定的力量，「你要跟我們一起回去嗎？」
      　　
      　　貓魅像是被某個過於龐大而遙遠的命題擊中，他眼中的錯愕漸漸化為了深刻的猶豫。
      　　
      　　「但是……我……」
      　　
      　　他下意識地望向自己水晶化的手掌，又看向身後深不見底的水晶壁，有些艱澀地低語：「回去……那個世界嗎？我真的還能……」
      　　
      　　「無論你最後做出什麼樣的選擇，大家都一定會支持你。」
      　　
      　　阿爾菲諾站起身，朝著長桌對面的貓魅邁出步伐，眉眼間滿是明朗的溫暖。
      　　
      　　「但是你的人民總告訴我，是水晶公教導了他們，即使在無邊的白晝下，也絕不能失去對明日的貪婪。是水晶公讓他們明白，活下去、並且去期待未來，是多麼理所當然的一件事。所以……」
      　　
      　　「你一定也如此相信著希望，對嗎？」
      　　
      　　精靈的目光清澈而溫暖，朝他遞出了手。那些毫無保留的善意與期許，正輕輕敲擊著那顆早已被水晶層層封閉的心。
      　　
      　　試圖讓那太久太久不曾為自己跳動過的心臟，再一次，因期待而悸動。
