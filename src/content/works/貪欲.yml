  - title: 上篇
    body: |-
      　　午後的陽光斜斜落進石之家的窗臺，古·拉哈·提亞停下手中書寫的筆，目光卻不由自主地飄向不遠處的窗邊。
      　　
      　　那裡站著拂曉的英雄，雙手隨意撐在窗臺上，正望著外頭喧鬧的廣場出神。
      　　
      　　光最近似乎有些反常。
      　　
      　　平日裡的他向來是直來直往、大剌剌的性子，喜怒哀樂幾乎都坦率地寫在臉上，既不擅長掩飾，也鮮少刻意隱瞞。可這幾天，光卻頻頻陷入沉思，像是獨自煩惱著什麼。
      　　
      　　拂曉的其他人若關心地湊上前詢問，光也只是含糊地笑笑，或摸著後腦，隨口找個欲蓋彌彰的理由搪塞過去。任誰都看得出來他沒有坦白的打算，基於尊重，眾人雖將這些異樣看在眼裡，倒也沒有特意戳破。
      　　
      　　那副心不在焉的模樣，像是不經意落入靴底的小石子，雖不會造成疼痛，卻也無法讓人忽視。
      　　
      　　至少，古·拉哈·提亞有些在意，光是不是遇到了什麼難以言說的麻煩。
      　　
      　　直到昨夜，他才無意間瞥見光順手將一張宣傳單反扣在桌上──那是森都即將舉辦的夏季慶典，單子旁還端端正正地擺著一張小地圖，上頭標記了慶典會場的位置。
      　　
      　　恰巧一旁的阿莉塞問起光隔日的安排，也只得到一番支支吾吾的含糊回應。英雄沒有多作解釋，只說自己有約。
      　　
      　　接連幾日的異樣，讓古·拉哈·提亞心裡除了原先的擔憂，又悄悄添上了幾分好奇。
      　　
      　　若只是去逛慶典，為什麼不和大家說呢？
      　　
      　　他眨了眨眼，目光不知不覺落向雜物間的木櫃。
      　　
      　　幾番掙扎之後，古·拉哈·提亞終究還是趁著無人注意，悄悄拉開櫃門，從裡頭取出了那套不知是誰留下來的、圓滾滾的小象布偶裝。

      　　
      　　
      　　*
      　　
      　　
      　　慶典當天的格里達尼亞熱鬧非凡。
      　　
      　　古·拉哈·提亞把自己嚴嚴實實地裹在厚重的小象布偶裝裡，手裡握著一大把五顏六色的氣球，認真扮演著慶典的工作人員。厚實的頭套十分悶熱，但他卻無暇顧及，隔著玩偶眼部的孔隙，在熙熙攘攘的人潮中仔細地搜尋著那道熟悉的身影。
      　　
      　　沒過多久，光的身影便撞進了他的視野。
      　　
      　　然而，古·拉哈·提亞的心臟卻毫無預兆地漏跳了一拍。
      　　
      　　光並不是獨自前來，身旁跟隨的人也並非拂曉的同伴，而是一名身姿靈巧、留著一頭亮麗紅髮的貓魅族。女子穿著精緻的祭典短衫，正帶著活潑的笑容仰頭對光說著什麼，一雙大眼專注地望著身旁的英雄，耳尖也隨著話語俏皮地輕輕晃動。
      　　
      　　相較之下，光顯得安靜許多。
      　　
      　　他不算擅長熱絡的交際，面對女子一路興致勃勃的話題，多半只是聽著，偶爾應上一兩句，或在對方回頭時露出一點淡淡的笑意。話雖不多，腳步卻始終沒有落下。
      　　
      　　經過販售烤物的攤位時，女子才剛接過紙袋，便被熱氣燙得連忙換手，光見狀便自然地替她接了過去；到了投環的攤子前，女子試了幾次都沒能套中想要的獎品，光看著她垂下的耳朵，便順手取走她手裡的木環、稍加瞄準便投了出去。
      　　
      　　木環穩穩套中最遠處的獎品，引得女子一下子笑開懷，開心地拉著光的手連聲誇讚。光只是略顯無措地任她拉著，沒有多說什麼，唇角卻也跟著彎起一點淡淡的笑意。
      　　
      　　再往前是撈金魚的攤位。
      　　
      　　女子蹲在水盆旁試了半天，最後回過頭拉了拉光的衣角，光垂眼看了看她，又看了看手中的紙網，片刻後還是順著她的意思，在一旁蹲了下來。
      　　
      　　他顯然不是會主動投入這些遊戲的人，卻也沒有顯出不耐。女子停在哪個攤位前，他便跟著停下；她一時興起想嘗試什麼，他多半也都陪著。
      　　
      　　不算熱絡，卻足夠耐心。
      　　
      　　古·拉哈·提亞並沒有看過光的這一面。
      　　
      　　圓滾滾的小象在十幾步之外，笨拙地挪動著腳步，偷偷摸摸地跟在樹蔭與攤棚交錯的陰影下。
      　　
      　　日暮漸漸西沉，天際被晚霞染成一片豔麗的橘紅，慶典的人潮仍舊熙熙攘攘，兩人的腳步也沒有停下的意思。相處了一整個上午，原先略顯生疏的氣氛不知不覺鬆弛下來，彼此之間的互動也自然了許多。
      　　
      　　穿過擁擠的攤販間時，女子偶爾會順手拉住光的衣袖，光沒有特意避開，只在有人迎面擠來時抬手扶住她的肩，將人稍稍帶向自己這側。到了後來，連並肩而行的距離都在不經意間拉近了些，手臂偶爾輕輕碰上，也沒有誰刻意退開。
      　　
      　　古·拉哈·提亞覺得胸口莫名有些發沉。或許只是這身布偶裝太過厚重，連呼吸都顯得悶了些。
      　　
      　　既然光並沒有遇上什麼麻煩，也不像是在為難以啟齒的事情困擾，那麼自己似乎也沒有再看下去的理由了。
      　　
      　　小象垂下了長長的玩偶鼻子，拖著步伐緩慢離去。他找了一處僻靜的水車旁，脫力般坐在長椅的一角，手中的氣球在晚風中無聲地飄晃。
      　　
      　　沉浸在思緒的他沒有注意到，自己轉身離去時，原本停在攤位前的光忽然回過頭，視線落在小象脖頸繫著的紅色領巾上。
      　　
      　　長椅邊很安靜，只有潺潺的水聲。
      　　
      　　古·拉哈·提亞說不上來，胸口那股悶悶的酸澀究竟從何而來。

      　　他明明一直都認為，只要光能擁有未來，就已經足夠了。

      　　那曾是支撐他走過漫長歲月的念頭，也是他甘願付出一切的理由。只要那個人能活下去，能繼續看見明日，能在某個他未必存在的世界裡笑著走下去，那麼無論自己要承受多少代價，都甘之如飴。

      　　而如今，他甚至已經得到了比當初所求更多的東西，不會成為英雄事蹟裡的一段回憶，而是真真正正站在他的身邊，和他說話、同行，參與那些曾經連想都不敢想的日常。
      　　
      　　照理來說，他應該已經足夠滿足了。

      　　可方才遠遠看著另一個人走在光身側，心底卻還是生出了一點說不清的失落。

      　　很輕，卻固執得揮之不去。

      　　直到這一刻，古·拉哈·提亞才隱約察覺，原來不知不覺間，自己早已比從前奢求得更多了。

      　　他彷彿不知從什麼時候開始，所期盼的已經不再只是英雄的未來。
      　　
      　　竟也悄悄地開始期盼自己的未來。
  - title: 下篇
    body: |-
      　　腦海裡反覆浮現著方才兩人並肩而行的背影，古·拉哈·提亞忍不住開始猜測起那名貓魅女子的來歷。

      　　看起來並不像是光原先熟識的人，可從那些細微的互動裡，卻又能察覺出光少見的慎重與體貼。像是在人潮間自然伸出的手，還有那些沒有刻意避開的碰觸──

      　　古·拉哈·提亞猛地搖了搖頭，連帶著小象兩側的耳朵也跟著晃得厲害。

      　　無論那個人是誰，就算真的是光所中意的對象，也不是自己有資格過問的事。

      　　他試著制止自己繼續從那些微不足道的細節裡尋找答案。畢竟如今的他，也不過只是站在同伴的位置上而已。

      　　至於方才才隱約察覺到的那些貪心，也該趁著還來得及的時候，好好收回去。

      　　正胡思亂想著，身旁的長椅忽然輕輕一沉。
      　　
      　　古·拉哈·提亞嚇得渾身一僵，猛地轉過頭。
      　　
      　　不知何時，光已經離開了慶典的會場，獨自一人出現在這裡。他有些疲憊地揉了揉眉心，側過臉看向縮在旁邊的小象，唇角揚起一抹極其柔和的笑意。
      　　
      　　「抱歉，走得有點累了，可以在你旁邊休息一下嗎？」
      　　
      　　頭套下的古·拉哈·提亞大氣都不敢喘一口，死死咬住嘴唇，生怕洩露了半點聲音，只能僵硬地把笨重的玩偶軀體往旁邊偏了偏，極其侷促地把自己縮得更小一點。
      　　
      　　光沒有在意他的沉默，只是自顧自地仰起頭，望著夕陽落幕後逐漸顯露的繁星，對著空氣喃喃自語。
      　　
      　　「前陣子去討伐盜賊的時候，敵人比預想得還要多，有個女孩不顧危險、幫忙找了救兵，我才能脫身。」
      　　
      　　小象頭套裡的貓耳微微動了一下。
      　　
      　　「她很勇敢，還營地照顧了我好幾天。」光輕笑了一聲，聲音平靜而溫和，「說是作為回禮，她今天約我來慶典，希望能陪她玩一天……我想著救命之恩確實該好好答謝，才答應了下來。」
      　　
      　　原來是這樣……
      　　
      　　古·拉哈·提亞在心底長長鬆了一口氣，但隨即又因為自己的情緒起伏而泛起更深的慌亂。
      　　
      　　他依舊緊閉著嘴不敢吭聲。
      　　
      　　光頓了頓，目光微微垂落，注視著小象握著氣球的手。
      　　
      　　「不過，她跟我告白了。」
      　　
      　　古·拉哈·提亞的心跳猛然漏了一拍。
      　　
      　　他迅速回頭、對上光平靜的眼神，卻乍然想起自己不能暴露身份，急急忙忙又垂下了頭。
      　　
      　　慌亂間，一隻溫熱而粗糙的掌心扣住了小象的手腕。
      　　
      　　光的力道並不大，卻堅定得不容抗拒。
      　　
      　　「但我拒絕她了。」
      　　
      　　光的嗓音在夜風中低沉了下來。
      　　
      　　「我告訴她，我喜歡的人也是貓魅族，還有著跟她一樣的紅髮。他在混亂的世界中，用超乎想像的時間與毅力、跨越時空只為了挽回我的未來的人，也是我早已暗自下定決心，想要牽著他的手，一起度過下半生旅途的人。」
      　　
      　　小象的身體徹底僵住了。
      　　
      　　長椅邊只剩下林間被風溫柔拂過的沙沙聲。頭套下的古·拉哈·提亞睜大了模糊的雙眼，喉嚨哽咽得發不出半點聲音。
      　　
      　　光側過身、抬起雙手，扣住小象頭套的邊緣，一點一點、將那沉重的面具、隱藏的心思、或是早在罩著兜帽時就隱去的私心，慢慢地取了下來。
      　　
      　　微涼的夜風拂過，露出了底下一頭被汗水浸得微濕的紅髮，以及那雙蓄滿了淚水、通紅卻比繁星還亮的眼眸。
      　　
      　　「她早在離開盜賊窩的時候就跟我表白過，我這幾天一直在發愁到底該怎麼正式、鄭重地拒絕她，才不會傷害到人……」光嘆了口氣，有些無奈又心疼地看著眼前的人，指腹輕輕擦過他泛紅的眼角，「你知道的，我向來不擅長應付這種事。」
      　　
      　　古·拉哈·提亞緊緊咬著下唇，淚水終於撲簌簌地滾落下來，狼狽地吸了吸鼻子，又哭又笑地啞聲問道。
      　　
      　　「你……你什麼時候認出我的？」
      　　
      　　光忍不住低聲笑了出來，伸手扯了扯小象領口那條隨風輕揚的領巾。
      　　
      　　「你是不是不曉得這身衣服是我帶回來的？」他輕笑，「領巾還是我自己選的，是跟你一樣的紅色，還有我眼睛的藍色。」
      　　
      　　古·拉哈·提亞猛然低頭，這才發現自己居然疏忽這個細節，他的耳根瞬間紅得徹底，連同那對軟軟的貓耳也害羞地拉了下來。
      　　
      　　光凝視著他這副淚眼汪汪卻又手足無措的模樣，目光緩緩移向被古·拉哈·提亞死死抓在手裡的繽紛氣球。
      　　
      　　「所以……」
      　　
      　　光朝他伸出了攤開的掌心，眼底閃爍著些許羞赧與期待。
      　　
      　　「如果那位紅髮的貓魅族，願意接受我的心意……可以分給我一個氣球嗎？」
      　　
      　　古·拉哈·提亞定定地看著眼前伸來的手，又抬眼望向光那雙真摯又直接的眼睛。
      　　
      　　他再也無法克制胸口翻湧的情緒，喉間溢出一聲細碎的嗚咽，整個人不管不顧地撲進了光的懷裡，雙手緊緊環住對方的脖頸，將滿是淚水的臉深深埋進光的頸窩。
      　　
      　　緊攥著氣球線的指尖，也在這一瞬間徹底鬆開。
      　　
      　　數十隻五彩斑斕的氣球掙脫束縛，伴隨著慶典遠處隱約傳來的樂聲，悠悠升向綴滿繁星的夜空，在月色下四散開來。
      　　
      　　「我可以……」
      　　
      　　古·拉哈·提亞的聲音埋在光肩頭，帶著止不住的顫抖。
      　　
      　　「我真的可以嗎……？」
      　　
      　　光安靜地抱著他，掌心一下又一下地撫過古·拉哈·提亞的後背，忍不住輕嘆道。
      　　
      　　「你明明一直都很勇敢。」
      　　
      　　古·拉哈·提亞怔了一下。
      　　
      　　「敢一個人獨自走過那麼長的路，敢賭上一切去改變一個幾乎不可能改變的未來。」光低低地笑了一聲，「結果怎麼到我面前，總是這麼小心翼翼。」
      　　
      　　古·拉哈·提亞的手臂不由得又收緊了些。
      　　
      　　「那樣……太貪心了。」他吸著鼻子，「明明能像現在這樣留在你身邊，就已經是我從前想都不敢想的事了。」
      　　
      　　「貪心又有什麼關係。」
      　　
      　　光望著那些已經飄得很遠的氣球，聲音也跟著柔了下來。
      　　
      　　「如果你已經開始覺得不滿足，開始想要得更多一點，那不是壞事。」
      　　
      　　他停了一下。
      　　
      　　「那代表你終於願意相信，自己也可以在這個世界上留下什麼，也可以和誰真正有牽絆，而不是總把自己當成某個注定會離開的人。」
      　　
      　　光往後退了退，注視著古·拉哈·提亞的眼睛。
      　　
      　　「別隨便犧牲自己。」他認真地說，「若要答應我，就要陪我到最後一刻。」
      　　
      　　古·拉哈·提亞怔怔地看著他，眼眶仍紅著，卻忍不住笑了起來。

      　　他抬起雙手，小心地捧住光的臉頰，指腹輕輕擦過那熟悉的輪廓，感受著真實的溫度。

      　　下一刻，他微微傾身，帶著仍未止息的淚意與笑意，輕輕吻上了光的唇。
      　　
      　　誓言從緊貼著的唇瓣間流瀉而出，卻誰都沒有聽漏。

      　　「我答應你。」
