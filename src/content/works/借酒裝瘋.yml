      　　酒館裡的長桌上一片杯盤狼藉。
      　　
      　　慶功宴上瀰漫著濃烈的麥芽酒香與烤肉的焦香味，坐在長桌中央的光紅著臉，顯然喝得有些過頭了。他眼神渙散、單手撐著下巴，另一手則晃著還剩大半杯的琥珀色烈酒。
      　　
      　　藍眼漫無目的地在桌上游移，最後落在了身旁正埋頭喝著熱湯的古·拉哈·提亞身上。平日裡總是靈動的貓耳正放鬆地微微垂著，腮幫子一鼓一鼓，平和的模樣讓人忍不住想惡作劇。
      　　
      　　光眨了眨不怎麼清醒的視線，酒意混合著玩心，在胸口逐漸發酵。
      　　
      　　接著，他毫無預兆地側過身，長臂攬過古·拉哈·提亞的後頸，就這麼當著整桌人的面，低頭在古·拉哈·提亞鼓起的臉頰上響亮地啄了一口。
      　　
      　　「啵」地一聲，吵雜的長桌瞬間陷入寂靜。
      　　
      　　古·拉哈·提亞手裡的木匙啪嗒一聲掉進了碗裡，湯汁濺了出來，他整個人像中了石化術，整張臉由白轉粉，再以肉眼可見的速度轟地燒成一片豔陽。
      　　
      　　惡作劇得逞的光輕笑了聲，十分滿意對方的反應，隨即若無其事地收回手，端起酒杯抿了一口。
      　　
      　　然而，平日裡溫順好說話的古·拉哈·提亞，在極度的羞恥與酒精的催化下，腦中的某根弦顯然也斷了。他的耳朵壓得極平、猛地吸了一口氣，然後伸手搶過光手上的烈酒，仰起頭咕嚕咕嚕喝得精光。
      　　
      　　「拉哈？！喝太快了！」阿爾菲諾驚得差點站起來。
      　　
      　　咚！
      　　
      　　木酒杯被重重砸在桌面上。
      　　
      　　古·拉哈·提亞整個人搖搖晃晃地站起身，胸膛認真地挺了起來，他的目光雖然有些渙散，卻燃燒著非比尋常的鬥志，氣勢洶洶地指著光宣佈：「不……不公平！我也要……親回來！」
      　　
      　　原本還在一旁看好戲的光，臉上的笑容瞬間僵住。
      　　
      　　「等等，」他下意識把椅子往後挪了挪，喉結抖動了一下、心虛地擺手，「我只是開個玩笑……你別當真。」
      　　
      　　這話不說還好。
      　　
      　　一說出口，原本就喝懵了的古·拉哈·提亞眼底立刻泛起了一層十分強烈的委屈。
      　　
      　　「開玩笑？」古·拉哈·提亞吸了吸鼻子，語氣裡甚至帶上了幾分酸澀，「英雄難不成……對誰都可以隨便親嗎？！還是說，換我的話就不行？」
      　　
      　　這記帶著醉意的控訴瞬間把戰火引向了整張長桌。
      　　
      　　桑克瑞德幾乎在同一秒彈起身，雙手誇張地在身前比了個叉，整張臉寫滿了嫌惡與抗拒。
      　　
      　　「別看我，我可不要！誰跟大英雄扯上關係，明天走在路上肯定會被可怕的愛慕者圍毆。」
      　　
      　　光立刻轉過頭，沒好氣地狠狠瞪了桑克瑞德一眼，「說得好像我願意一樣，鬼才要親你！」
      　　
      　　滴酒未沾的阿爾菲諾則是微微一愣，手握拳抵在唇邊，耳尖有些不自然地泛紅，輕咳了一聲：「咳……如果是慶功宴的玩笑話，倒也……」
      　　
      　　啪！
      　　
      　　話還沒說完，坐在旁邊的阿莉塞已經滿臉通紅地一巴掌拍在自己雙胞胎哥哥的後腦勺上，咬牙切齒地低吼：「少在那邊認真考慮這種荒唐的事情！」
      　　
      　　阿爾菲諾委屈地抱著腦袋，不敢出聲。
      　　
      　　至於站在陰影處的艾斯蒂尼安，則是一臉認真地嚼著食物，彷彿眼前這群鬧哄哄的人類與他完全無關。他身旁的尤里安傑也優雅地晃動著杯中的飲料，兩個人神情淡定地並立，完全不打算加入戰場。
      　　
      　　長桌邊鬧成一團，但風暴中心的古·拉哈·提亞顯然沒有忘記自己的目標。
      　　
      　　即便醉得腳步不穩，他還是邁著有些笨拙卻執著的步伐，繞過椅子走到光面前。
      　　
      　　「英雄，請你……坐好。」
      　　
      　　古·拉哈·提亞小聲地要求著，雙手按在光的雙肩上，動作帶著不容反抗的執拗。
      　　
      　　光整個人都慌了，他從來沒發現貓魅的力氣這麼大，兩人的距離近在咫尺，古·拉哈·提亞身上混雜著熱湯、麥酒與淡淡墨水香的暖熱氣息，與背光的陰影一同襲來，紅色的眼睛執著地揪著他，讓光的心臟開始不受控制地狂跳。
      　　
      　　「拉哈！別鬧了，大家都在看……」
      　　
      　　「我不管。」古·拉哈·提亞委屈地抿著唇，耳朵垂了下來，整個人堅定地往下壓，「說好了要親回來的……」
      　　
      　　發熱的手輕輕捧住了光的下頜，滾燙的溫度一路蔓延到光的耳朵。眼看無處可逃，英雄自暴自棄地閉上了眼睛，任人宰割般昂起下巴──
      　　
      　　空氣卻突然安靜了下來，彷彿所有人都跟著屏住呼吸。
      　　
      　　預想中落在唇上或臉頰上的觸碰並沒有發生，取而代之的，是一個軟綿綿的腦袋啪嗒一聲倒了下來，不偏不倚地砸在光的頸窩處。
      　　
      　　「……呼……」
      　　
      　　微弱而均勻的呼吸聲，伴隨著濃濃的酒氣，灑在光的鎖骨上。
      　　
      　　他猛地睜開眼，不可置信地垂頭望著紅色的蓬鬆頭頂。
      　　
      　　方才還氣勢洶洶討要公道的古·拉哈·提亞，竟然在即將碰上他的最後一刻，腦袋一歪、徹底醉倒了。
      　　
      　　整間酒館安靜了兩秒，隨即爆發出哄堂大笑。
      　　
      　　桑克瑞德挑起眉毛，晃了晃手裡的酒杯，戲謔地朝著渾身僵硬的光吹了聲口哨。
      　　
      　　「哎呀呀，英雄大人，調戲完人家可得好好負起責任啊。」
      　　
      　　「這醒來可能不得了了。」
      　　
      　　尤里安傑微微苦笑，艾斯蒂尼安則是輕哼一聲，絲毫不同情，「自作自受。」
      　　
      　　光的臉頰一路紅到了脖子根，整個人又羞又惱，咬牙切齒地對著那群看熱鬧的同伴低吼：「吵死了！都給我閉嘴！」
      　　
      　　他嘴上雖然凶神惡煞地罵著，可落在身側的手，卻偷偷攏住了古·拉哈·提亞逐漸下滑的肩膀。
