  - title: 第一章
    body: |
      　　魔大陸上空的風總帶著一股乾燥而古老的氣息。
      　　
      　　光跟在古·拉哈·提亞身後，踏過一個個金屬通道，每當兩人經過一處設施，周圍便會亮起幽藍色的光芒。
      　　
      　　這次他們是為了調閱一批與乙太傳輸相關的資料而來。
      　　
      　　原本還擔心設備年久失修，沒想到兩人才剛抵達終端區，數十顆圓滾滾的球形終端便像是嗅到了什麼氣息一般，紛紛從各自的基座上浮起，迅速地圍了過來。
      　　
      　　「沙沙……皇族血脈，確認。」
      　　
      　　「身分認證完成，權限等級：最高。」
      　　
      　　「資料調閱需求，接收。」
      　　
      　　「開始搜尋相關紀錄……沙沙……」
      　　
      　　一顆顆終端在古·拉哈·提亞身邊打轉，光幕接連展開，將海量的資料整齊排列在兩人面前。
      　　
      　　古·拉哈·提亞仰頭看著飛快捲動的文字，神情很快便專注起來。
      　　
      　　「果然還保存著……光，你看這裡，這段紀錄提到了乙太轉換時的損耗，或許能解釋先前那個裝置為什麼會──」
      　　
      　　他側過臉，正準備說明，卻發現光站得比預想中還要近。
      　　
      　　兩人的鼻尖差點撞在一起，古·拉哈·提亞的聲音頓時停了半拍。
      　　
      　　「……為什麼會，呃，失去穩定。」
      　　
      　　光眨了眨眼，沒有察覺異樣，只順著他指的地方湊近了些。
      　　
      　　「是這一段？」
      　　
      　　「對、對，就是這裡。」
      　　
      　　古·拉哈·提亞下意識挺直背脊，紅色的眼眸不自然地飄向光幕，耳尖卻在無人留意的地方悄悄染上薄紅。
      　　
      　　至少是他以為的無人留意。
      　　
      　　「沙沙……偵測到異常生理數值。」
      　　
      　　一顆體型略小、外殼上裝著數片感應板的球形終端忽然飄了過來。
      　　
      　　它先繞著古·拉哈·提亞轉了一圈，又停到兩人中間，感應板一開一闔，發出細碎的機械聲。
      　　
      　　「心跳速度異常提升。」
      　　
      　　古·拉哈·提亞一怔，「什麼？」
      　　
      　　「體表溫度上升，瞳孔變化，呼吸頻率紊亂。」
      　　
      　　感應終端轉向光，毫不客氣地放出光波，將他掃描了一遍。
      　　
      　　「偵測到平民個體。」
      　　
      　　「……是指我嗎？」
      　　
      　　感應終端又轉回古·拉哈·提亞。
      　　
      　　「異常於平民個體接近時發生。」
      　　
      　　「等等，這並不是什麼需要分析的──」
      　　
      　　感應終端的運算速度驚人，完全無視貓魅驚慌的制止。
      　　
      　　「沙沙……資料比對中。」
      　　
      　　古·拉哈·提亞迅速伸手，試圖按住它的外殼，感應終端卻靈活地向上一浮，避開了他的手。
      　　
      　　光抬起頭，好奇地看著它。
      　　
      　　「分析出什麼了？」
      　　
      　　「光！」
      　　
      　　古·拉哈·提亞回頭，神情十分驚慌。
      　　
      　　感應終端發出一陣毫無起伏的嗡聲，隨後高聲宣告：「分析完成。」
      　　
      　　「目標古·拉哈·提亞，對目標平民之情感，超出普通個體範圍。」
      　　
      　　空氣安靜了一瞬。
      　　
      　　古·拉哈·提亞整個人僵直，完全出乎意料的展開讓他一時做不出任何反應，就連光也愣在原地。
      　　
      　　周圍正在調閱資料的其他終端紛紛停下動作，像是接收到了某種重要訊息，整齊地轉向兩人。
      　　
      　　「沙沙……情感類別：愛慕。」
      　　
      　　感應終端平板地補充。
      　　
      　　「判斷為戀愛傾向。」
      　　
      　　「你、你們──」
      　　
      　　古·拉哈·提亞的臉頰以肉眼可見的速度紅了起來。
      　　
      　　「都別說了！」
      　　
      　　「資訊無誤，無須修正。」
      　　
      　　「我並不是在質疑準確性──不對，我是說，這根本不應該說出來！」
      　　
      　　感應終端的外殼閃了兩下。
      　　
      　　「皇族需求確認，準確性得到保證。」
      　　
      　　「為亞拉戈皇族感興趣之對象進行必要處置。」
      　　
      　　「需求已推定，執行輔助。」
      　　
      　　還來不及阻止，感應終端突然放出一道淡金色的光。
      　　
      　　古·拉哈·提亞臉色驟變。
      　　
      　　「光，快躲開！」
      　　
      　　然而已經太遲了。
      　　
      　　金色光芒將光整個籠罩，四周的術式紋路迅速展開，又在一陣短促的嗡鳴中猛然收束。
      　　
      　　古·拉哈·提亞伸手擋住刺眼的光線，待光芒散去，原本站在他面前的人已經不見蹤影。
      　　
      　　取而代之的，是一個坐在地上、只有巴掌高的小小身影。
      　　
      　　光低頭看了看自己，又抬起頭，看向忽然高得像座塔一樣的古·拉哈·提亞。
      　　
      　　古·拉哈·提亞呆住了。
      　　
      　　「……光？」
      　　
      　　光舉起手，朝他揮了揮。
      　　
      　　感應終端在上方平靜宣布。
      　　
      　　「縮小處理完成。」
      　　
      　　「體積降低後，攜帶便利性上升。」
      　　
      　　「皇族可將目標留置身側。」
      　　
      　　「你到底做了什麼！」
      　　
      　　古·拉哈·提亞難得失了平時的從容，慌忙蹲下身，小心翼翼地用雙手將光捧起來。
      　　
      　　「你有沒有哪裡不舒服？頭暈嗎？手腳還能動嗎？」
      　　
      　　光站在他的掌心，原地走了兩步，又跳了一下。
      　　
      　　「好像沒事。」
      　　
      　　「怎麼可能沒事！」
      　　
      　　古·拉哈·提亞滿臉愧疚，連聲音都顫了起來。
      　　
      　　「都是因為我，如果不是我的血脈啟動了這些終端，如果不是那個終端擅自分析，又擅自使用術式──」
      　　
      　　「警告。」
      　　
      　　周圍忽然響起整齊的機械音。
      　　
      　　古·拉哈·提亞抬頭，這才發現原本負責調閱資料的終端已經全部圍了上來，它們外殼上的光由藍轉紅，數十道準星同時鎖定了那顆感應終端。
      　　
      　　「確認目標使皇族陷入悲傷狀態。」
      　　
      　　「判定：有害。」
      　　
      　　「開始排除。」
      　　
      　　「沙沙……拆解程序準備完成。」
      　　
      　　感應終端停在半空中，外殼閃爍了幾下。
      　　
      　　「反對。行動目的：協助皇族。」
      　　
      　　「協助失敗，建議：拆解。」
      　　
      　　數顆終端絲毫不理會同伴的解釋，而是伸出細長的機械臂，緩緩逼近。
      　　
      　　感應終端後退了一小段距離。
      　　
      　　「沙沙……重新計算。生存機率：下降。」
      　　
      　　古·拉哈·提亞看著眼前這一幕，內心感到有些複雜。
      　　
      　　那顆感應終端仍舊維持著平板的語氣，可不知為何，在一群準備把它拆成零件的終端包圍下，竟顯得有些可憐。
      　　
      　　古·拉哈·提亞嘆了口氣，沉聲發出命令。
      　　
      　　「都停下。」
      　　
      　　數十顆終端同時停止動作。
      　　
      　　「皇族指令，接收。」
      　　
      　　古·拉哈·提亞把光護在胸前，神情嚴肅地看向感應終端。
      　　
      　　「先回答我，這個術式會維持多久？」
      　　
      　　「標準維持時間：二十四小時。」
      　　
      　　「是否會對他的身體造成損害？」
      　　
      　　「否。」
      　　
      　　「可能出現後遺症？」
      　　
      　　「機率低於百分之零點零零一。」
      　　
      　　古·拉哈·提亞的眉頭仍沒有鬆開。
      　　
      　　「二十四小時後，一定能恢復？」
      　　
      　　「確認，無須額外處理。」
      　　
      　　他沉默片刻，又低頭看向掌心中的光。
      　　
      　　光盤著腿坐在他手上，看起來倒是十分放鬆，顯然比起自己的處境，更在意那顆差點被同類拆掉的終端。
      　　
      　　「既然明天就能恢復，先放過它吧。」
      　　
      　　古·拉哈·提亞無奈地笑了一下。
      　　
      　　「你總是這麼寬容。」
      　　
      　　他重新看向感應終端，語氣重新嚴肅了起來。
      　　
      　　「這次就算了，但不許再對任何人使用這種術式。」
      　　
      　　「指令已記錄……沙沙……禁止擅自縮小皇族愛慕對象。」
      　　
      　　「不必把後面那幾個字一起記錄！」
      　　
      　　「無法理解。」
      　　
      　　「請你刪掉。」
      　　
      　　「無法執行。」
      　　
      　　古·拉哈·提亞閉上眼，深深吸了一口氣。
      　　
      　　光坐在他的手掌上，忍不住笑出了聲，安撫地用小小的手掌拍了拍他。
      　　
      　　最後，本該進行的資料調閱自然是無法繼續。
      　　
      　　古·拉哈·提亞將需要的部分匆匆記錄下來，便帶著變小的光離開了魔大陸。
  - title: 第二章
    body: |-
      　　回程途中，古·拉哈·提亞始終沒有開口。

      　　光坐在他的肩上，起初還以為他只是在專心趕路，可等了一段時間，身旁仍只有風聲與規律的腳步聲，便漸漸察覺出些許異樣。

      　　他奮力抬起頭，試圖看清古·拉哈·提亞的表情。

      　　然而如今的身體實在太小，無論光怎麼伸長脖子，映入眼簾的都只有鮮紅的髮絲，以及近在咫尺的領巾。

      　　至於那張臉，則恰好藏在視線之外。

      　　這讓光感到有些苦惱。

      　　順帶一提，離開魔大陸之前，古·拉哈·提亞原本十分堅持，要把光放進外袍口袋裡。

      　　「以你現在的體型，只要稍微起一陣強風，就有可能被吹走。」

      　　古·拉哈·提亞神情嚴肅地說著，還特地用手指撐開了口袋，好讓光確認裡頭確實足夠寬敞。

      　　「待在這裡最安全。」

      　　光低頭看了看那片黑壓壓的空間。

      　　「不要。」

      　　「可是──」

      　　「什麼都看不到。」

      　　「我可以隨時告訴你周圍發生了什麼。」

      　　光抬起頭，雙手環抱，堅定地重複。

      　　「不要。」

      　　最後，在幾番爭論與古·拉哈·提亞反覆叮囑下，光才終於爭取到坐在肩上的權利，代價是必須抓好他的領巾，不許隨意亂動，更不許站起來。

      　　然而現在，光盯著古·拉哈·提亞那微微發紅的側臉，只覺得這個位置仍然不夠好。

      　　他偏著頭思考了一會兒，隨後伸手抓住近在眼前的領巾，想順著布料再往前挪一點。

      　　只要再靠近些，或許就能看清古·拉哈·提亞現在究竟是什麼表情。

      　　可惜這副縮小後的身體顯然比預想中更加難以控制。

      　　光才剛拉住領巾往前一探，腳下便踩了個空。

      　　「唔──」

      　　他的身體順著布料向下一滑，整個人跌進了領巾內側的凹折之中。

      　　古·拉哈·提亞的腳步猛地停下。

      　　「光！」

      　　他立刻抬手護住肩頸。

      　　「你還好嗎？」

      　　光原本正想回答，才剛吸了一口氣，卻忽然聞到一股淡淡的氣息。

      　　領巾裡仍殘留著古·拉哈·提亞身上的溫度，柔軟的布料裹在四周，將外面的風隔開大半。那股若有似無的清香也變得格外清晰，像是乾燥紙頁、草藥與日光混合在一起的味道，乾淨而溫暖。

      　　光安靜了片刻。

      　　接著，他乾脆整個人埋了進去。

      　　古·拉哈·提亞等了好一會兒，仍沒有聽見回答，頓時更加緊張。

      　　「光？」

      　　領巾裡傳出悶悶的聲音。

      　　「我沒事。」

      　　古·拉哈·提亞鬆了口氣，正準備重新邁開腳步，卻發現藏在領巾裡的小小身影不只沒有出來，反而還舒適地往裡縮了縮。

      　　他的耳尖瞬間紅了起來。

      　　「既然沒事，就回到肩上吧。」

      　　光沒有動。

      　　「這裡很暖。」

      　　「那也請不要這樣。」

      　　古·拉哈·提亞的聲音明顯有些僵硬。

      　　光從領巾邊緣探出頭來，仰頭看向他。

      　　從這個角度，總算能看見古·拉哈·提亞的臉了。

      　　果然，方才只能看見一點的紅意，此刻早已蔓延到整張臉，就連藏在髮絲間的側臉都沒有倖免。

      　　只是除了羞赧之外，那雙紅色眼眸裡似乎還沉著一點難以形容的情緒。

      　　不像生氣，反而像是某種失落。

      　　光忍不住問道：「拉哈，你為什麼看起來不開心？」

      　　古·拉哈·提亞怔了怔。

      　　「我沒有不開心。」

      　　「有。」

      　　光毫不猶豫地否定。

      　　「從離開終端區之後，你就一直沒有說話。」

      　　古·拉哈·提亞沉默片刻，目光落向遠處。

      　　魔大陸乾燥的風拂過他的髮絲，紅色的髮尾輕輕掃過光的頭頂。

      　　「我只是……沒有預料到事情會變成這樣。」

      　　「我變小嗎？」

      　　「不是。」

      　　古·拉哈·提亞苦笑了一下。

      　　「是我的心意，竟然以那種方式被你知道。」

      　　光眨了眨眼。

      　　古·拉哈·提亞的手仍護在領巾外側，像是擔心他隨時又會摔下去，語氣卻逐漸放輕。

      　　「我原本以為，若有一天真要告訴你，至少該更慎重一些，或許是在一個不會被打擾的地方，也該先仔細想過，怎麼說才比較好。」

      　　他停頓了一下，眼中浮現一點無奈。

      　　「至少不該是由一顆亞拉戈終端，在數十個同類面前，直接宣告什麼『戀愛傾向』。」

      　　回想起當時的情景，古·拉哈·提亞的臉頰又紅了幾分。

      　　光卻沒有笑。

      　　他從領巾裡爬出來，重新站到古·拉哈·提亞的肩上。

      　　「可是，如果不是今天的意外，你真的會告訴我嗎？」

      　　古·拉哈·提亞沒有立刻回答。

      　　光雙手抱胸，盯著他的側臉。

      　　「拉哈，你總是這樣。」

      　　「什麼？」

      　　「把自己的想法壓抑得太深了。」

      　　光伸出手，輕輕碰了碰古·拉哈·提亞的臉頰。

      　　指尖觸及的皮膚比想像中還要柔軟，溫度卻高得驚人。

      　　他忍不住又摸了兩下。

      　　古·拉哈·提亞僵住身體。

      　　「光……」

      　　「你想做什麼，喜歡什麼，期待什麼，並不會每一項都坦然告訴我。」

      　　光一邊說，一邊用小小的手掌貼住他的臉。

      　　「甚至有時候乾脆把自己的願望藏在心裡，就這麼抱著、什麼都不說。」

      　　古·拉哈·提亞垂下眼。

      　　「我只是不希望自己的願望影響你的選擇。」他低聲說道：「你已經……背負著許多人的願望了。」

      　　「可是藏得太好，我就什麼都不會知道。」

      　　光不服氣地說道。

      　　「你也不會知道我的選擇是什麼。」

      　　古·拉哈·提亞的目光微微一動。

      　　光盯著那片紅透的臉頰，忽然覺得只用手掌碰觸還不夠，於是他向前一步，張開雙臂，整個人抱了上去。

      　　以現在的體型，那動作幾乎像是抱住一片溫熱柔軟的牆。

      　　古·拉哈·提亞徹底停下腳步。

      　　「所以，我反而很感謝這場意外。」

      　　光將臉貼在他的臉頰上，笑得十分坦然。

      　　「不然我不會知道拉哈的心意，也沒辦法像現在這樣靠近你。」

      　　古·拉哈·提亞安靜了片刻。

      　　「像現在這樣？」

      　　他的聲音壓得很低，似乎帶著幾分試探。

      　　「你指的是怎樣的靠近？」

      　　光鬆開手，偏頭想了想。
      　　
      　　下一刻，他湊上前，張口在發熱的臉頰上咬了一下，力道並不重，與其說是咬，更像是故意留下的一點挑釁。

      　　古·拉哈·提亞猛地睜大眼睛。

      　　「你──」

      　　光迅速鬆口，趁他尚未反應過來，又沿著領巾邊緣往下一探，在他的頸側偷偷親了一下。

      　　柔軟的觸感轉瞬即逝。

      　　古·拉哈·提亞陷入了沉默。

      　　光若無其事地坐回他的肩上，彷彿方才只是做了兩件再普通不過的事。

      　　「就是這樣的靠近。」

      　　古·拉哈·提亞沒有回答。

      　　他的腳步停在原地，紅色眼眸低垂著，不知道正在思考什麼。

      　　光等了一會兒，忽然覺得氣氛似乎有些不對。

      　　「拉哈？」

      　　古·拉哈·提亞這才抬起手。

      　　修長的手指小心地靠近，將光從肩上捧了下來。

      　　光坐在他的掌心裡，抬頭對上那雙紅色眼眸。

      　　方才還滿是慌亂與羞赧的神色，此刻似乎沉了幾分。

      　　那雙眼睛一眨不眨地注視著他，讓光莫名產生一種自己做得有些過火的錯覺。

      　　「明天。」

      　　古·拉哈·提亞終於開口。

      　　「什麼？」

      　　「等你恢復之後，我也會用自己的方式『靠近』你。」

      　　他的聲音很輕，語氣卻不像玩笑。

      　　光眨了眨眼。

      　　「不可以欺負一個變小的人。」

      　　古·拉哈·提亞沒有理會這句抗議。

      　　他只是垂下頭，將掌心抬高一些。

      　　隨後，那張仍泛著薄紅的臉慢慢靠近。

      　　光下意識向後仰了仰，卻沒有躲開。

      　　古·拉哈·提亞用臉頰極輕地蹭了他一下。

      　　溫熱柔軟的觸感將光整個人籠罩，紅色的髮絲從身旁輕輕拂過，帶來方才在領巾中聞見的淡淡清香。

      　　那動作十分克制，甚至稱得上小心。

      　　可古·拉哈·提亞靠得實在太近，光幾乎能清楚看見他微微顫動的睫毛，以及眼底那點再也沒有隱藏的笑意。

      　　光怔了片刻。

      　　古·拉哈·提亞已經重新抬起臉，像是什麼都沒有發生一般，準備把他放回肩上。

      　　光忽然伸手拉住他的指尖。

      　　「等等。」

      　　光低頭看了看纏在他頸間的領巾，抬手指向它。

      　　「這個送我。」

      　　古·拉哈·提亞微微挑眉。

      　　「我的領巾？」

      　　「對。」

      　　光一本正經地點頭。

      　　「明天就隨便你。」

      　　空氣安靜了幾秒。

      　　古·拉哈·提亞看著掌心裡滿臉坦然的人，像是在確認自己是否聽錯。

      　　片刻後，他忽然笑了，笑意從紅色眼眸深處一點點浮現，甚至帶上幾分得逞般的愉快。

      　　「好。」

      　　古·拉哈·提亞答應得毫不猶豫，光反而愣了一下。

      　　「……這麼快？」

      　　「是你自己提出的交換條件。」

      　　古·拉哈·提亞伸手解下領巾。

      　　失去束縛的布料落入掌心，還帶著他的體溫。古·拉哈·提亞仔細地將領巾折好，又把光輕輕放進柔軟的布料中央。

      　　「我沒有拒絕的理由。」

      　　光整個人陷在寬大的領巾裡，只露出一顆頭，像是陷入了什麼陷阱之中。

      　　他忽然覺得，古·拉哈·提亞剛才那個笑容似乎有些危險。

      　　「拉哈。」

      　　「嗯？」

      　　「我說的隨便，是有限度的。」

      　　「剛才的交易裡並沒有提到限度。」

      　　「現在我要說清楚。」

      　　古·拉哈·提亞將裹著光的領巾捧回肩上，細心地調整好位置，確保不會被風吹落。

      　　「請抓穩。」

      　　「你不要轉移話題。」

      　　「我們該繼續趕路了。」

      　　「拉哈。」

      　　「我在。」

      　　「你剛才是不是故意的？」

      　　沒有回答，反而顯得更加可疑。

      　　光裹在領巾裡盯著他的側臉，卻只能看見古·拉哈·提亞悄悄揚起的嘴角。

      　　片刻後，他伸出手，再次摸了摸那片仍帶著熱度的臉頰。

      　　古·拉哈·提亞沒有躲。

      　　只是微微側過臉，讓他的手掌能貼得更安穩些。
  - title: 第三章
    body: |-
      　　蔚藍的眼睛正被墨黑的領巾覆蓋著。

      　　柔軟的布料從額前垂落，鬆鬆纏過眼際，將視野遮得嚴實，屬於古·拉哈·提亞的氣味也隨之落在鼻尖，混著乾燥紙頁、藥草與一點被體溫熨暖的清香，近得彷彿連呼吸都會沾染上他的氣息。

      　　光急促地喘了一口氣。
      　　
      　　他的內心正在哀嚎，到底是哪一步出了差錯，才導致事情變成這樣。

      　　論起初衷，他真的只是想要一件帶著古·拉哈·提亞氣味的東西。
      　　
      　　得知那人喜歡自己的欣喜大於一切，他仗著自己只有巴掌大，膽子比平時更大，沒多加思考就說了什麼隨便你之類的話。

      　　現在想來，那句話實在說得太輕率。

      　　更糟的是，古·拉哈·提亞顯然記得一清二楚。

      　　「拉哈……」

      　　光試著抬手去碰覆在眼前的領巾，手腕卻先被輕輕握著、扣了下來。

      　　古·拉哈·提亞並沒有用力，只是將他的手帶回身側，指腹貼著腕間緩慢摩挲了一下。

      　　「別拿下來。」
      　　
      　　一陣陰影覆蓋在自己身上，古·拉哈·提亞沙啞的嗓音留在他的耳邊，令光不自覺地輕顫著。
      　　
      　　那平時總是溫和而克制的聲音，染上一點情慾後，怎麼就這麼令人難以招架呢。

      　　「這可是昨天你自己說的。」

      　　古·拉哈·提亞的髮絲擦過光的臉側。

      　　「領巾給你，等你恢復之後，就隨我處置。」

      　　「我可沒有說處置……」

      　　光立刻反駁，輕喘著的呼吸早已亂了套。

      　　「意思相近。」

      　　「差很多吧……」

      　　古·拉哈·提亞低低笑了一聲。

      　　那點笑意貼著頸側，震得他渾身酥麻，光還來不及抗議，便感覺溫熱的呼吸落了下來。

      　　先是耳後，接著是頸側。

      　　古·拉哈·提亞的動作並不急，像是刻意要讓他清楚感受到每一次靠近，唇瓣在皮膚上短暫停留，濕潤的氣息一點點向下，偶爾混入極輕卻黏膩的舔舐。

      　　光難耐地扭動，渾身開始發著熱。

      　　被領巾遮住視線後，其他感覺反而變得格外清晰。

      　　他看不見古·拉哈·提亞的表情，只能感覺對方的手仍握著自己的手腕，另一隻手則穩穩扶在腰側，掌心隔著衣料輕輕摩挲，鮮明的熱度一陣陣傳了過來。

      　　古·拉哈·提亞每靠近一寸，那股熟悉的氣味便更濃一分。

      　　光忍不住偏過頭，試圖躲開落在頸間的氣息。

      　　「癢……」

      　　「只是癢嗎？」

      　　古·拉哈·提亞問得很輕。

      　　光沉默了。

      　　覆在眼前的布料像是也染上熱度，讓臉頰更加發燙。

      　　「不回答的話，我只能自己判斷了。」

      　　話音落下，古·拉哈·提亞的唇再次貼近。

      　　這次停得更久。

      　　光下意識收緊手指，扯著身下的床單，頸間傳來細微的刺痛，像是被不輕不重地咬了一下，隨後又被溫柔地輕吻安撫過去。

      　　「拉……哈……」

      　　他已經說不出完整的句子。

      　　古·拉哈·提亞應了一聲，卻沒有停下。

      　　「你……這是……報復嗎？」
      　　
      　　「跟你昨天一樣。」

      　　古·拉哈·提亞回答得理所當然。

      　　光咬緊牙關，一時竟找不到反駁的話。

      　　他直到現在才知曉，古·拉哈·提亞平時不坦露慾望，不代表真的沒有。
      　　
      　　正因為壓抑太久、藏得太深，一旦敞開了一點，就彷彿太陽一樣灼熱。

      　　古·拉哈·提亞像是察覺到他的走神，扶在腰間的手稍微收緊，將人輕輕摟了起來。

      　　「在想什麼？」

      　　「……」
      　　
      　　光別過頭，不願意說出那些羞恥的話。

      　　古·拉哈·提亞倒也不急著逼迫他。

      　　光感覺他抬起頭，溫熱的氣息移到唇邊，卻偏偏停在僅差一點的位置，近得只要任何一人稍微向前，就會碰在一起。
      　　
      　　「第一次的話，我會等你說可以再繼續。」
      　　
      　　都什麼時候了還說這種話！
      　　
      　　從沒被這麼刺激過的光，內心沒來由生出一股氣。他的下身早已脹得發疼，兩條腿無意識地扭動著，渾身散發出催促的氣息。
      　　
      　　伏在他身上的貓魅看起來仍舊遊刃有餘，蓬鬆的尾巴甚至還有一下沒一下地輕拂過他裸露的腿側。
      　　
      　　「說得好像……你不是一樣……」
      　　
      　　他咬著牙抗議，引來古·拉哈·提亞一陣輕笑。
      　　
      　　「現實的話，是第一次。」低沉的嗓音發出愉悅的氣息，「但夢裡的話……可能數不清。」
      　　
      　　這都是些什麼──
      　　
      　　光覺得自己快瘋了。
      　　
      　　他實在無法想像，平日總以澄澈崇拜的目光望著自己的貓魅賢人，究竟在夢裡將他翻來覆去折騰了多少回。
      　　
      　　那隻方才摟住自己腰間的手，此刻還放肆地往下滑，手指在自己腿間的突起打轉。
      　　
      　　赤裸裸地調戲，他卻毫無招架之力。
      　　
      　　「別擔心，我有事先做過功課。」
      　　
      　　像是感受到光的氣惱，古·拉哈·提亞溫聲安撫著他。
      　　
      　　「不會傷到你的。」
      　　
      　　語尾透露出的一絲謹慎，還是稍稍軟化了光的內心。
      　　
      　　隔著領巾，他看不清古·拉哈·提亞現在的神情，但仔細一想，一定也是滿臉通紅、內心緊張地等待他的答案吧。
      　　
      　　光在內心無奈地嘆了口氣。
      　　
      　　他微微撐起手肘，湊上前去，「啵」地親了古·拉哈·提亞一下。

      　　礙於視野受限，他並不確定自己究竟親中了哪裡，為了慎重起見，儘管羞窘得幾乎想把自己埋起來，他仍硬著頭皮開口問道。

      　　「你不是說……要『靠近』嗎……」
      　　
      　　伏在自己身上的人，呼吸止住了一瞬。
      　　
      　　光輕輕笑了聲，伸手環住他的肩。
      　　
      　　「那就……來啊……」
      　　
      　　停在他下身的那隻手似乎再也按捺不住，手指一勾、猛地往下一扯，便將他的褲子徹底褪了下來。
  - title: 第四章
    body: |-
      　　最脆弱的部位突然暴露於空氣中，光不自覺地打了個哆嗦。
      　　
      　　剛才還伏在自己身上的身軀逐漸下滑，灼熱的呼吸灑落在腿間。光還沒反應過來，下身便猝不及防地被一股濕軟的溫熱緊緊包覆。
      　　
      　　「唔、啊……」
      　　
      　　前所未有的刺激讓光渾身緊繃，喉間被逼出破碎的喘息。他狼狽地扭過頭，湛藍的眼睛透過領巾的縫隙向下看去，發現古·拉哈·提亞正跪在他的腿間，將那已然發脹挺立的分身含入口中。
      　　
      　　「等、你不需要做這種……拉哈……！」
      　　
      　　強烈的羞恥感讓光無措地扭動身體，試圖壓抑瘋狂攀升的慾望。
      　　
      　　古·拉哈·提亞輕輕搖了搖頭，手掌帶著安撫的意圖，溫柔地包覆著光扯著床單的手指。
      　　
      　　他在吞吐間發出含糊不清的低語。
      　　
      　　「什麼都不用想……只要享受就好。」
      　　
      　　話音剛落，他再次垂下頭，一鼓作氣將光的挺立深深含至喉底，那雙赤紅色的貓瞳直勾勾地望著光，彷彿要將他所有失控的反應收進眼底。
      　　
      　　光的理智在潰散的邊緣打轉。
      　　
      　　包覆著下身的口腔既濕潤又軟熱，貓魅族帶有微小倒刺的舌尖舔舐著柱身，一點點熨過前端的皺摺，最後停留在微張的鈴口，緩慢地打轉著。
      　　
      　　光死死咬住下唇，試圖阻止那些過於羞恥的呻吟，但一陣陣伴隨著酥麻與酸軟的劇烈快感不斷從下身襲來，讓他毫無招架之力。
      　　
      　　更別提那道灼熱的視線，彷彿盯著獵物般，正看著他的反應。
      　　
      　　口腔吞吐的速度，模仿著交合的頻率不斷加快。

      　　在對方的一次用力吸吮下，光猛然弓起身體，伴隨著脫口而出的尖叫，徹底釋放了出來。
      　　
      　　古·拉哈·提亞卻沒有鬆口，就含著分身的姿勢，將射出來的熱液全數嚥了下去。
      　　
      　　「唔……你……」
      　　
      　　光止不住地喘著氣，眼眶莫名湧起一陣熱意。他顧不得發軟的腰身，急忙撐起身體，伸手將古·拉哈·提亞拉了起來。
      　　
      　　湛藍的眼睛裡寫滿了慌亂與愧疚，他支支吾吾了半天，反倒是古·拉哈·提亞看見他這副模樣，忍不住笑了出來。
      　　
      　　「我願意的，光。」
      　　
      　　身後的貓尾輕快地擺動著，顯然心情非常好。
      　　
      　　「只要能看見你舒服的樣子，我就很開心了。」
      　　
      　　古·拉哈·提亞傾身抱住他，溫柔地親了親光的臉頰，手掌安撫似地一下又一下輕順著他的頭髮。
      　　
      　　光瞅著笑得無比滿足的貓魅，眼神忍不住帶了點哀怨。
      　　
      　　「你……預謀這天很久了吧。」
      　　
      　　「明明是你自己答應我的。」
      　　
      　　古·拉哈·提亞微微往前，前額抵上了光的額頭。
      　　
      　　「不過……確實呢。」他輕輕閉上眼，語氣裡帶著滿溢的幸福與不真實感，「能像現在這樣被你接受……簡直就像在做夢一樣。」
      　　
      　　光沉下眼，凝視著眼前這個守候了自己超過百年的人。
      　　
      　　他恬靜地微笑著，眼角隱約泛著晶瑩的水光。那份深藏多年、從未奢望能得到回應的心意，化作近乎不真實的滿足。
      　　
      　　光的內心感到一陣酸澀，他忍不住湊過去，咬了口他的嘴角。
      　　
      　　「這才不是做夢。」
      　　
      　　藍眼堅定地凝視著對方。
      　　
      　　「好好看清楚，你擁抱的是誰。」
      　　
      　　古·拉哈·提亞怔怔地望著他，似乎沒料到他會給出這樣的回應。
      　　
      　　短暫的呆滯後，那雙赤紅色的貓瞳微微瞇起，眼裡的溫和漸漸被情慾取代。
      　　
      　　古·拉哈·提亞重新將他推回床舖間，很是無奈似地輕嘆了口氣。
      　　
      　　「你這人真是……」
      　　
      　　沉在眼底的戀慕濃得像要將人淹沒，古·拉哈·提亞的手指再度順著腹肌，往下撫摸著。
      　　
      　　「再這麼挑逗我，小心等等真的下不了床。」
      　　
      　　光一愣，正想反駁自己沒那個意思，古·拉哈·提亞卻已經重新俯身吻住了他。
      　　
      　　這次的吻比剛才用力得多，帶著不容拒絕的強勢，探入口腔的舌頭毫不留情地捲走所有呼吸，唇齒間甚至還留有剛才接納過光的、淡淡的腥羶氣味。
      　　
      　　溫熱的手再度向下滑去，靈巧地握住發洩過後微軟的慾望，上下套弄起來。
      　　
      　　「嗯、唔……」
      　　
      　　光難耐地哼了一聲，思緒瞬間有些恍惚。
      　　
      　　他忍不住想起那隻此刻正肆意作亂的手──分明前幾日，自己才牽著這隻手，認真地與對方探討著揮劍的姿勢與力度。
      　　
      　　強烈的反差讓羞恥感如潮水般層層湧上，他甚至無法想像，未來的自己究竟要用什麼樣的心情，去面對古·拉哈·提亞日常裡熱切的呼喚。
      　　
      　　但在那帶著體溫的指腹撫摸與親吻雙重攻勢下，剛消停不久的下身，又極具誠實地再度挺立了起來。
      　　
      　　「這麼精神？」
      　　
      　　古·拉哈·提亞停下了吻，唇貼著唇輕笑。光狠狠瞪了他一眼，但那雙瀰漫著水霧的眼卻沒有半點殺傷力。
      　　
      　　貓魅忍不住又啄了啄他的唇瓣，隨後撐起身子，手臂往床頭櫃伸去，取出一罐散發著淡淡香氣的小玻璃瓶。
      　　
      　　光震驚地發現，古·拉哈·提亞居然在他的床頭櫃裡，悄悄藏了一瓶潤滑油。
      　　
      　　「你……你……」
      　　
      　　「又要說我預謀已久？」
      　　
      　　這一回，古·拉哈·提亞倒是沒再否認，他仔細地用掌心捂熱倒出的透明液體，一邊偏過頭，朝光微微一笑。
      　　
      　　那雙赤紅色的眼眸裡，毫不掩飾的濃烈慾望終於讓光意識到了危險。
      　　
      　　同為男人，他很清楚那個眼神代表著什麼。
      　　
      　　「等、等一下──」
      　　
      　　「不等。」
      　　
      　　古·拉哈·提亞牽過他的手，直接往自己的胯下探去，那裡早已隆起如小山般高昂的凸起。
      　　
      　　「我等了你那麼久。」壓低的嗓音沙啞地說道，帶著令人發麻的性感，「現在不想再等了。」
      　　
      　　語畢，他重新俯下身，將沾滿液體、泛著亮光的手指朝光的後穴探去。
      　　
      　　未經人事的穴口極為緊緻，即使有潤滑輔助，異物侵入的過程依然帶着難熬的異樣感。光緊緊咬著牙，努力承受體內被異物撐開的不適，連帶著前端剛抬頭的分身都微微疲軟了些。
      　　
      　　古·拉哈·提亞安撫似地吻去他額前的細汗，隨後一路向下，連同光的貼身上衣與胸前的突起，一同含入嘴裡。
      　　
      　　「唔……啊……！」
      　　
      　　隔著濕透布料的刺激本該微弱，但貓魅的尖牙無意間擦過尖端時，瞬間帶來一陣如觸電般的麻癢。
      　　
      　　過度的感官衝擊讓光無措地抱緊了他，再也顧不得羞恥，失控地發出破碎的呻吟。
      　　
      　　等他從迷亂中回過神，體內擠入的手指已經增加到了三隻。
      　　
      　　光張著迷濛的雙眼，望向正壓在自己身上的男人。
      　　
      　　貓魅好看的眉頭微微蹙起，即使非常有耐心地進行著擴張，但因為忍耐而出汗、黏在臉側的紅髮卻極為明顯。
      　　
      　　明明自己也忍得辛苦，卻依然耐著性子不進行下一步，只為了等他完全適應。
      　　
      　　意識到自己正被對方這樣小心翼翼地捧在手心珍視著，光的內心泛起一股蔓延至全身的暖熱。
      　　
      　　他伸出手，掌心摸上那雙微微發燙的貓耳，指尖捏了捏柔軟的尖端。
      　　
      　　古·拉哈·提亞動作一頓，抬起頭看向他。
      　　
      　　光強忍著眼底的濕意與羞赧，輕輕朝他眨了下眼睛。
      　　
      　　得到了明確的授意，濕黏的手指終於緩緩從後穴退了出來。古·拉哈·提亞直起身，乾脆俐落地上抬手臂，將身上的衣物褪了下來。
      　　
      　　沒了衣服遮擋的胸膛結實而寬闊，線條分明的前胸中央，溝壑間甚至還有些許汗珠，順著肌肉紋理緩緩流下。
      　　
      　　光一直都知道古·拉哈·提亞平時從不落下鍛鍊，兩人以往外出冒險、露宿野外時，也沒少過赤裸相見的時刻。
      　　
      　　但這副模樣放在眼下的情景裡，怎麼就這麼色氣呢。
      　　
      　　「……可惡，身材怎麼這麼好。」
      　　
      　　聽見他的埋怨，古·拉哈·提亞低低笑了聲，將光的雙腿弓起、掛在自己的腰側。他扶著自己早已脹得發硬的熱源，將碩大的前端抵在軟肉入口處。
      　　
      　　灼熱的氣息交織在一起，兩人都屏住了呼吸。
      　　
      　　「放輕鬆……光，看著我。」
      　　
      　　古·拉哈·提亞俯下身，握住光的左手，與他十指緊扣，隨後腰身向前一挺，沉甸甸的熱硬破開緊繃的甬道，一點點深深地嵌入體內。
      　　
      　　前所未有的撕裂感讓光猛地仰起脖頸，指節因用力而泛白。
      　　
      　　「嗯痛……唔……！」
      　　
      　　「抱、抱歉，還是太痛了嗎？」
      　　
      　　古·拉哈·提亞看起來也不好受，眼見光喊疼，他瞬間不敢再深入，只得咬牙卡在一個不上不下的位置。
      　　
      　　光忿忿地瞪著他，啞著聲音喊。
      　　
      　　「你怎麼……這麼大……」
      　　
      　　沒預料到居然會聽到這句話，方才還滿臉擔憂的古·拉哈·提亞先是一愣，隨後沒能忍住，噗哧一聲笑了出來。
      　　
      　　光痛得冷汗直流，見狀頓時氣不打一處來，抬手憤怒地捶了他胸口一下。
      　　
      　　「還笑！」
      　　
      　　「對不起對不起……但這個……」
      　　
      　　笑開懷的貓魅連忙求饒，一邊擦了擦眼角，隨後低笑著湊近。
      　　
      　　「能被你這樣稱讚，我真的很高興。」
      　　
      　　「少囉嗦……要動就快點！」
      　　
      　　古·拉哈·提亞抬起兩人依然扣在一起的手，極其溫柔地放在唇邊吻了一下。
      　　
      　　「遵命，我的英雄。」
      　　
      　　他沒有急著抽動，而是緊緊貼著光的唇瓣，落下一個又一個綿密而細碎的吻，手掌安撫地順著他的頭髮，嘗試化解著體內的緊繃。
      　　
      　　直到感受著懷裡的人呼吸漸漸平復、僵硬的身軀終於鬆弛下來，他才放緩了語氣。
      　　
      　　「還好嗎？」
      　　
      　　光小聲哼唧著，把臉深深埋進對方的頸窩裡，雙腿纏緊了些。
      　　
      　　古·拉哈·提亞眼神一暗，腰腹一動，開始有節奏地抽動起來。
      　　
      　　濕軟的內壁被一次次頂開，每一次的抽插都帶起一陣令人瘋狂的酸麻。
      　　
      　　貓魅的體溫高得嚇人，重重撞擊體內的分身無論到達何處，都彷彿像是灼燒般炙熱。
      　　
      　　光的聲音被撞得斷斷續續，眼眶泛紅，原本清亮的雙眼此時全被淚水與失控的情慾覆蓋。
      　　
      　　「拉哈……太深了……唔啊……！」
      　　
      　　「光……」
      　　
      　　古·拉哈·提亞如同虔誠的信徒，沙啞地呼喚著他的名字，蓬鬆的貓尾不自覺地勾了勾，纏上光的腿根。
      　　
      　　在幾次深頂下，光尖叫著再次釋放了出來，溫熱的情液盡數灑在兩人緊貼的腹間。高潮帶來的強烈痙攣讓後穴劇烈收縮，緊緊擠壓著體內那根依然堅硬碩大的熱源。
      　　
      　　光脫力地癱在床鋪上，胸口劇烈起伏，然而，體內那柄灼熱卻完全沒有消退的跡象，反而因為內壁的刺激而變得更加高漲。
      　　
      　　「唔……哈啊……拉哈，退、退出來……」光有些慌亂地推了推對方的肩膀。
      　　
      　　古·拉哈·提亞俯下身，在他發燙的耳邊低低笑了笑，沙啞的嗓音帶著尚未滿足的濃重情慾，還有點壞心眼的親暱。
      　　
      　　「可我還沒到。」
      　　
      　　話音剛落，古·拉哈·提亞的手扣住他的腰，將精疲力竭的光翻過身去，趴伏在床墊上。
      　　
      　　「等等……！」
      　　
      　　還沒等他從天旋地轉中反應過來，貓魅已經從後方重新覆了上來，他張開嘴，不輕不重地叼著光暴露出的後頸。
      　　
      　　「嗯啊──！」
      　　
      　　刺痛與酥麻感同時從頸後傳來，與此同時，埋在體內的碩大再次發狠般狠狠撞向最深處，帶起一陣令人崩潰的酥軟感。
      　　
      　　窗外的夜色沉沉，星光隱沒在雲層之後。
      　　
      　　這漫長的一夜，不過才剛剛開始。
  - title: 第五章
    body: |-
      　　光醒來時，第一個感覺不是清晨灑進窗內的陽光，也不是身旁那道熟悉的氣息。

      　　而是痛。

      　　後頸痛、腰痛、大腿痛，連平時握著武器的手臂都透著一股說不清的痠軟。

      　　他躺在床上，睜著眼睛望了好一會兒天花板，腦中只浮現出一個十分嚴肅的結論。

      　　他現在的狀態，比獨自挑戰完一整座迷宮、順便把沿途所有魔物都清得乾乾淨淨還要糟糕。

      　　光試著翻身，才剛動了一下，腰間便傳來一陣強烈抗議，逼得他重新躺回原位。

      　　「……」

      　　昨晚的記憶頓時一股腦湧了回來。

      　　某個平時總用澄澈且熱切的眼神望著他、開口閉口都是「英雄」的貓魅，在床榻上根本不是那麼一回事。

      　　什麼溫和克制，什麼會小心一點，通通都是假的。

      　　那人纏了他整整一夜，像是要把過去那些沒能靠近的日子一口氣補回來似的，抱著不肯鬆手，親也親不夠，光甚至懷疑自己身上還有哪裡是沒被對方碰過的。

      　　最令人生氣的是，他中途分明不只一次嘗試喊停。

      　　古·拉哈·提亞也確實每次都停下來，滿臉關切地問他是不是不舒服。

      　　可只要他紅著臉搖頭，那雙赤紅色的眼睛就會立刻亮起來，然後再一次纏上來，帶著黏黏糊糊的熱氣，緊緊地抱住他。

      　　光越想越氣。

      　　他緩慢地轉過頭，看見枕邊放著那條墨黑的領巾。

      　　布料凌亂地捲在一旁，帶著古·拉哈·提亞身上熟悉的氣息，也是他一時得意忘形換來的戰利品。

      　　光盯著領巾，眼神說有多哀怨就有多哀怨，又低頭看了看自己連坐起來都有些困難的身體。

      　　最後，他將視線移向另一側。

      　　古·拉哈·提亞早就醒了。

      　　他側躺在光的身邊，一頭紅髮微微散亂，臉上卻看不出半點疲倦。晨光落進那雙紅色眼眸裡，讓他整個人顯得精神奕奕，甚至連身後的尾巴都愉快地在被褥上輕輕擺動。

      　　察覺光終於看了過來，古·拉哈·提亞立刻露出一個滿足得近乎發亮的笑容。

      　　「早安。」

      　　那聲問候朝氣十足，跟自己內心的怨氣形成強烈的對比。

      　　古·拉哈·提亞朝他眨了眨眼。

      　　「睡得還好嗎？」

      　　光再次看向領巾，接著又看向那張笑得毫無愧疚的臉。

      　　一股強烈的不平衡感油然而生。

      　　「我覺得我虧大了。」

      　　古·拉哈·提亞微微一怔。

      　　「什麼？」

      　　光抬手指向枕邊，眼神無比沉重。

      　　古·拉哈·提亞順著他的手指看去，似乎花了一點時間才理解這句話的意思。
      　　
      　　然後，他笑了。

      　　不是平時那種含蓄溫和的笑，而是肩膀都輕輕顫起來，明顯忍耐得十分辛苦的那一種。

      　　光的臉頓時黑了。

      　　「你還笑！」

      　　「抱歉。」古·拉哈·提亞連忙收斂神情，然而眼底的笑意依然藏不住，「可是，這明明是你自己提出的交換條件。」

      　　「我怎麼知道『隨便你』是指這件事！」

      　　光忿忿不平地抗議。

      　　古·拉哈·提亞眼神無辜。

      　　「哪件事？」

      　　「就是……！」

      　　光張了張口，話到嘴邊，臉卻先熱了起來。

      　　就是會把他翻來覆去一整晚，黏在他身上、用唇舌撫摸過每一處，一次次用發燙的分身貫穿他，還用沙啞眷戀的聲音無數次呼喚他的名字。

      　　這些話，要他怎麼說出口。

      　　光憋了半天，最後惱羞成怒地拉起被子，將自己蓋到鼻尖。

      　　「總之，以後只能兩次！」

      　　古·拉哈·提亞方才還停留在臉上的笑意瞬間凍住。

      　　「兩次？」

      　　「對。」

      　　棉被裡的人鄭重點了點頭。

      　　古·拉哈·提亞思索片刻，小心翼翼地問：「一天兩次？」

      　　光猛地掀開被子。

      　　「一週兩次！」

      　　房間裡陷入一片寂靜。

      　　古·拉哈·提亞看著他，神情像是被宣判了酷刑，就連原本愉快擺動的尾巴都僵在了半空中。

      　　「一週……只能兩次？」

      　　「兩次已經很多了！」

      　　古·拉哈·提亞睜大眼睛。

      　　「那怎麼行？」

      　　「怎麼不行？」

      　　古·拉哈·提亞慌張地靠了過來。

      　　光本想往後退，可痠痛的腰根本不允許他做出過大的動作，才剛挪開一點，便被古·拉哈·提亞連人帶被抱進懷裡。

      　　「拉哈！」

      　　「是昨天有哪裡不舒服嗎？」

      　　古·拉哈·提亞的語氣瞬間認真起來。

      　　他低下頭，臉頰貼著光的額角輕輕磨蹭，手臂則小心圈在腰間，完全避開了讓他不適的位置。

      　　「是我太勉強你了？還是哪裡弄疼了？」

      　　「……不是。」

      　　「那是我有哪裡做得不好？」

      　　「也不是。」

      　　「那為什麼只能一週兩次？」

      　　光噎住了。

      　　古·拉哈·提亞又湊近一點，在他髮間親了親，語氣軟得彷彿能融化霜雪。

      　　「你不要一直靠過來。」

      　　「可是你還沒回答我。」

      　　古·拉哈·提亞不但沒有鬆手，反而將光抱得更緊了一些，尾巴也悄悄纏上光的小腿。

      　　「我正在確認你的狀況。」

      　　「你分明是在耍賴。」

      　　「我很擔心。」

      　　古·拉哈·提亞說得誠懇，手掌還安撫似地輕輕拍著他的背。

      　　光本來還想反駁，卻在對上那雙眼睛時停了下來。

      　　從某個角度來說，古·拉哈·提亞確實是在擔心。

      　　那份擔憂藏在眼底，雖然臉頰依然因為兩人的距離而泛著淡淡的紅，神情卻已經沒有半點玩笑的意思。

      　　「光，告訴我吧。」

      　　他放輕聲音。

      　　「就算只有一點不舒服，我也希望能知道。」
      　　
      　　「不是你告訴我，應該要坦然一點的嗎？」

      　　光抿起唇。

      　　他其實沒有哪裡不舒服。

      　　或者該說，正因為沒有，事情才變得更加麻煩。

      　　昨夜那些陌生而強烈的感覺，到現在仍殘留在身體深處。每當他回想起古·拉哈·提亞落在耳邊的聲音、擁抱時毫不掩飾的珍惜，以及那雙始終只注視著自己的赤紅眼眸，心跳便會不受控制地加快。
      　　
      　　平時自己雖然也會解決慾望，但遠不及與真正喜歡的人纏綿時的感受。

      　　況且昨夜在情動時，自己還跟著擺動起腰肢、主動尋求更進一步的歡愉，口中發出的聲音也是清醒的自己根本無法想像的。

      　　他不是討厭，只是感到陌生。
      　　
      　　對炙熱的快感陌生，也對自己呈現出來的脆弱感到陌生。

      　　那種將自己完全交給另一個人、被毫無保留地渴望與珍視的感覺，既讓人安心，又令人害怕。

      　　光習慣獨自面對強敵，習慣承擔重任，也習慣在任何危險中握緊武器。

      　　可他不知道該怎麼面對這種會讓人主動卸下防備的溫柔。

      　　「……就是太舒服了。」

      　　聲音小得幾乎聽不見。

      　　古·拉哈·提亞的耳朵輕輕一動。

      　　「什麼？」

      　　「沒聽見就算了。」

      　　光立刻轉過臉，古·拉哈·提亞卻沒有被敷衍過去。

      　　他怔怔地看了光片刻，眼神一點點柔軟下來。

      　　「你害怕了嗎？」

      　　光的肩膀微微一僵，這已經足夠成為答案。

      　　古·拉哈·提亞沒有繼續追問，他只是稍微鬆開手臂，給了光足夠的空間，卻仍將掌心貼在他的背上。

      　　「抱歉。」

      　　光抬起頭。

      　　「為什麼道歉？」

      　　「我只顧著高興，沒有發現你會不安。」

      　　古·拉哈·提亞垂下眼，額頭輕輕抵住他。
      　　
      　　「仔細想想，距離讓你知道我的心意開始，也不過才過了那麼幾天。」
      　　
      　　「是我太急了。」
      　　
      　　古·拉哈·提亞的紅眼靜靜地眨了眨。
      　　
      　　光沉默了會，仰起頭，蹭了蹭他的額頭。
      　　
      　　「……也不能這麼說。」他難為情地囁嚅，「兩個互相喜歡的人，做這些事情也算正常。」
      　　
      　　古·拉哈·提亞搖了搖頭。

      　　「下次我會慢一點，只要你覺得害怕，我們隨時都可以停下來。」

      　　光看著近在咫尺的紅色眼眸。

      　　「真的會停？」

      　　「當然。」

      　　「昨晚我說夠了，你也沒有停。」

      　　「因為你後來又抱住我，還說沒有不舒服，而且還主動親了我。」

      　　「………不要記得那麼清楚。」

      　　古·拉哈·提亞忍不住笑了笑。

      　　光瞇起眼睛，伸手捏住他的臉頰。

      　　「總之，一週兩次。」

      　　古·拉哈·提亞的笑容頓時淡了幾分。

      　　「光……」

      　　「不准撒嬌。」

      　　「三次。」

      　　「兩次。」

      　　「四次。」

      　　「為什麼還往上加？」

      　　「我以為我們正在協商。」

      　　「這不是協商，是規定！」

      　　古·拉哈·提亞沉思了一會兒。

      　　接著，他低下頭，先親了親光的額頭，又親了親鼻尖，最後停在唇邊，十分克制地落下一個柔軟的吻。

      　　「那這樣算一次嗎？」

      　　光愣住了。

      　　古·拉哈·提亞眨著那雙澄澈的紅眼睛，一副純粹求知的模樣，和昨夜那個將他折騰得渾身痠痛的人簡直判若兩人。

      　　光盯著他半晌，終於忍無可忍地抬起枕頭，重重拍在那張無辜的臉上。

      　　「不算！」

      　　古·拉哈·提亞抱住枕頭，笑得尾巴都揚了起來。

      　　「那就好。」

      　　光這才意識到自己又被繞了進去。

      　　他氣得正要再拿另一顆枕頭，痠痛的腰卻突然一軟，整個人重新跌回床上。

      　　古·拉哈·提亞立刻收起玩笑，俯身將他穩穩接住。

      　　「小心。」

      　　光靠在他懷裡，疲憊地閉上眼睛。

      　　「都是誰害的……」

      　　「是我。」

      　　古·拉哈·提亞答得坦然，手掌輕柔地替他揉著痠痛的腰側。

      　　「我會負起責任的。」

      　　「今天不准再做奇怪的事。」

      　　「好。」

      　　古·拉哈·提亞很快地應下，卻又想起其它問題。

      　　「那親跟抱呢？」

      　　光本想一併拒絕，卻發現自己正舒舒服服地靠在對方懷裡，腰間的按摩也確實緩解了不少痠痛。

      　　他安靜片刻，悶悶地說道：「只能抱。」

      　　古·拉哈·提亞的耳朵垂了下來。

      　　「親……不可以？」

      　　「不准得寸進尺！」

      　　眼看那雙眼睛即將泛起水霧，光只能摀住臉，無奈地讓步。
      　　
      　　「………不擦槍走火的話，可以。」
      　　
      　　「遵命。」
      　　
      　　那聲回答輕快得令人懷疑。

      　　古·拉哈·提亞拉起被子，將兩人重新裹好，隨後小心調整姿勢，讓光能靠得更舒服一些。

      　　光閉著眼睛躺了一會兒，忽然想起什麼似的，伸手摸索到枕邊的墨黑領巾，將它一併拖進懷裡。

      　　古·拉哈·提亞低頭看了看。

      　　「不是說虧大了嗎？」

      　　「虧歸虧。」

      　　光將臉埋進仍殘留著熟悉氣味的布料裡，聲音變得有些含糊。

      　　「東西都換來了，當然要好好留著。」

      　　古·拉哈·提亞安靜片刻，手臂緩緩收緊。

      　　他沒有再逗弄光，只是低下頭，將臉埋進對方柔軟的髮間。

      　　光感受到他的體溫，原本緊繃的身體也漸漸放鬆下來。

      　　就在意識即將重新沉入睡意時，他聽見古·拉哈·提亞在耳邊很輕地說了一句。

      　　「那就說好了，一週兩次。」

      　　光半睜開眼。

      　　「真的？」

      　　「嗯。」

      　　古·拉哈·提亞溫柔地笑著。

      　　「能讓你安心的話，我可以等。」

      　　光愣了一會兒，藏在領巾裡的手悄悄伸了出去，握住古·拉哈·提亞的手指。

      　　「……三次。」

      　　「什麼？」

      　　「最多三次。」

      　　古·拉哈·提亞的耳朵猛地豎了起來。

      　　光立刻閉上眼睛，故意裝作已經睡著。

      　　然而下一刻，那條蓬鬆的尾巴便抑制不住喜悅，在被褥底下緊緊纏住了他的腳踝。

      　　古·拉哈·提亞雖然遵照約定，沒有再親他，但抱著光的手臂，明顯又收緊了一點。
  - title: 第六章
    body: |-
      　　光最近深刻地體悟到，許多由自己種下的因果，最後都會回到自己身上。

      　　特別是在與古·拉哈·提亞有關的事情上。

      　　一週三次的規矩是光自己立下的，古·拉哈·提亞也確實遵守得很好。

      　　然而，光當初訂下規矩時，顯然沒有考慮到許多實際層面的問題。

      　　兩人在外奔波、處理委託或深入危險區域時，古·拉哈·提亞仍是那個值得信賴的冒險夥伴。他的術法精準，判斷敏銳，只要光回頭，幾乎都能看見那雙赤紅色的眼睛專注地望著自己。

      　　沉穩、澄澈，帶著一如往常的信任與憧憬。

      　　那時候的古·拉哈·提亞，簡直可靠得無可挑剔。

      　　可一旦兩人回到房內，不小心滾到了一塊，或者周圍的氣氛稍微變得曖昧一些，光便會立刻深刻體會到什麼叫作自食惡果。

      　　比方現在，古·拉哈·提亞正從背後貼著他。

      　　溫熱的胸膛隔著薄薄的衣料抵在背脊上，雙臂不緊不鬆地環在腰間，將他整個人圈進懷裡。

      　　光原本只是坐在床沿，隨意地擦著微濕的頭髮，古·拉哈·提亞也只是走過來，順手接過他手中的毛巾，一邊輕輕按壓著光的髮梢，一邊說夜深了，該休息了。

      　　撇開那慢慢撫摸自己耳後、被毛巾包覆的手指外，一切都很正常。

      　　直到那張臉埋進他的頸側，柔軟的紅髮隨之垂落，一縷縷搔過肌膚，撩得他輕顫了一下。

      　　「拉哈。」

      　　光警告地喊了一聲，可惜身後的人沒有理會。

      　　柔軟的唇先輕輕碰了碰他的側頸，停留片刻後才緩慢移開。

      　　再次落下時，舔吻便深了一些。

      　　濕熱的氣息貼著皮膚，沿著頸側一點點向上，牙尖偶爾輕輕叼住一小片軟肉，雖然稱不上疼，卻偏偏磨得人渾身發癢。

      　　古·拉哈·提亞咬住他，又很快放開，留下的熱度遲遲沒有散去。

      　　「你……」

      　　光下意識縮了縮肩膀。

      　　身後的人卻順勢貼得更近，鼻尖蹭過他的耳後，低沉的呼吸幾乎全灑在耳邊。

      　　距離實在太近了，光甚至能清楚聽見古·拉哈·提亞微微加快的呼吸聲。

      　　那個平時總是溫和沉穩的聲音，此刻壓得很低，貼著耳廓傳來時，莫名帶上一股令人難以招架的沙啞。

      　　「怎麼了？」

      　　然後他居然還用那副嗓音，附在自己耳邊說話。

      　　光咬了咬牙，聲音沉了下來，「你明知故問。」

      　　古·拉哈·提亞似乎笑了一下。

      　　那點笑意沒有化成聲音，只隨著呼吸落在頸間，帶來一陣細微的顫動。

      　　接著，他又低下頭。

      　　這一次，吻落在稍微靠近鎖骨的位置。

      　　光的手指不自覺收緊，原本握在手中的被褥頓時被捏出一道皺摺。

      　　古·拉哈·提亞顯然注意到了，卻沒有停下來的打算。

      　　唇舌緩慢地磨過裸露的皮膚，偶爾留下淡淡的濕意，牙尖再次輕輕陷入皮肉，在光忍不住發出一聲短促的吸氣後，又溫柔地吻了吻那處。

      　　「你現在根本就是在……」

      　　光抗議到一半，聲音忽然停住。

      　　環在腰間的手緩慢鬆開。

      　　古·拉哈·提亞的指尖卻沒有立刻離去，而是順著腰側輕輕滑過，若有似無地擦過前胸。

      　　那動作極輕，也能狡辯成衣料與指腹短暫相觸。

      　　偏偏就是這一下，讓光原本還算平穩的呼吸瞬間亂了半拍。

      　　到此，古·拉哈·提亞終於放開他。

      　　方才還緊密相貼的體溫突然撤離，身後一下變得空蕩，反而令殘留在皮膚上的熱度更加鮮明。

      　　光僵坐在原地，還沒來得及轉身，便聽見古·拉哈·提亞用一如往常的溫柔語氣說道：「晚安，光。」

      　　光猛地回過頭，他已經走到床的另一側，放下的紅髮柔順地垂在頰邊，赤紅色的眼睛彎著，唇角掛著一抹柔和而滿足的笑意。

      　　那無辜的眼神朝光眨了眨，彷彿方才那個貼著他的頸側又親又咬、還故意在耳邊喘息的人根本不是他。

      　　「就這樣？」

      　　光難以置信地問。

      　　古·拉哈·提亞眨了眨眼。

      　　「該睡了。」

      　　光死死盯著他。

      　　他當然知道古·拉哈·提亞是故意的，畢竟一週三次的額度早就用完了，而且還是在前幾天便用得乾乾淨淨，一點也沒有留下。

      　　親吻和擁抱不算在那三次裡，也是光自己說的。

      　　當時他只是覺得，總不能連普通的親近都設下限制，現在想來，這簡直和親手替自己挖好陷阱沒有分別。

      　　古·拉哈·提亞確實沒有違反規定，他只是會在兩人獨處時忽然從身後抱住光，將臉埋進頸窩，慢吞吞地親上一會兒，或是在替光整理領口時，指尖若有似無地擦過敏感的皮膚。

      　　甚至連那條蓬鬆的尾巴，都學會了趁光不注意時，很慢地滑過他的手腕或腳踝。

      　　每次都在即將越界前停下，像是個耐心的獵人，等待著光自己放棄那條親手劃下的底線。

      　　「你分明是故意的。」

      　　光咬牙道。

      　　古·拉哈·提亞神情坦然。

      　　「我做了什麼？」

      　　「你還敢問？」

      　　光指著自己的頸側。

      　　雖然看不見，但他完全能想像那裡現在大概留下了多少痕跡。

      　　古·拉哈·提亞順著他的手看去，耳尖稍微紅了一點。

      　　「只是晚安吻而已。」

      　　「有誰會像你這樣親？」

      　　「你不喜歡嗎？」

      　　光頓時噎住。

      　　古·拉哈·提亞那雙眼睛直勾勾地盯著他，彷彿只要光說出一句不喜歡，便再也不會這樣擁抱他。

      　　偏偏光最氣的正是這一點。

      　　他並不討厭，甚至還有些眷戀。

      　　喜歡那雙手環在腰間的感覺，喜歡古·拉哈·提亞的氣息落在頸側，也喜歡那條尾巴黏黏糊糊地纏上來。

      　　更糟的是，每當古·拉哈·提亞在最難耐的時候停下，光心裡總會產生一種想要主動將人拉回來的衝動。

      　　而這分明就是對方想要的。

      　　「……我根本沒有想過你會鑽這種漏洞。」

      　　光又羞又氣地瞪著他。

      　　古·拉哈·提亞站在不遠處，身上只穿著寬鬆的衣物，領口微微敞開，紅髮也沒有像平時那樣仔細束好。

      　　明明剛才才做了那麼故意的事，這時卻笑得溫和又好看。

      　　燭光映在他的側臉上，讓本就柔和的輪廓顯得更加深邃。赤紅色的眼睛裡帶著一點掩不住的狡黠，卻又始終專注地望著光。

      　　光看了一會兒，隨後敗給了自己的內心。

      　　他明知道古·拉哈·提亞是故意的，明知道那人在等自己先舉旗投降。

      　　可那張臉一露出笑容，他便怎麼也生不起真正的氣。
      　　
      　　自己真是太沒用了。

      　　古·拉哈·提亞似乎察覺到光的眼神逐漸軟化，尾巴在身後輕輕擺了一下。

      　　「你要睡了嗎？」

      　　「不然呢？」

      　　光語氣悶悶地反問。

      　　「你都已經跟我說晚安了。」

      　　古·拉哈·提亞點點頭，掀開另一側的被子，安分地躺了進去。

      　　他果然沒有再靠過來，甚至十分守規矩地與光保持了一小段距離。

      　　光也跟著躺下，背對著他，拉起被子蓋到肩上。

      　　房間很快安靜下來，只剩下彼此平穩的呼吸，以及窗外偶爾傳來的風聲。

      　　過了一會兒，光睜開眼睛。

      　　身後一點動靜也沒有。

      　　他又等了片刻，古·拉哈·提亞依然沒有靠近。

      　　光心裡忽然有些不是滋味。

      　　那人方才還抱著他不肯放，現在說停就真的停了，未免也太過刻意。

      　　他悄悄往後挪了一點，等了等，又往後退了一些。

      　　直到背脊終於碰上熟悉的體溫，古·拉哈·提亞才像是剛察覺般動了動。
      　　
      　　原本背靠著他的光，此刻轉了過來，一雙藍眼難為情地看著他。
      　　
      　　古·拉哈·提亞輕聲笑了出來，眉眼裡是溢滿的溫柔。
      　　
      　　「這次不會埋怨我了吧。」他笑道：「是你自己靠過來的。」
      　　
      　　光咬緊牙關。

      　　內心糾結了半晌後，他伸出手，慢慢環住古·拉哈·提亞的肩膀。
      　　
      　　赤紅色的眼睛微微沉了沉，古·拉哈·提亞也跟著拉進兩人的距離，嘴角勾起一抹笑意。
      　　
      　　「光，你知道嗎……」
      　　
      　　他輕聲說。
      　　
      　　「你現在看著我的樣子，實在很像是在等我親你。」
      　　
      　　「既然都看出來了，那你還等什麼？」
      　　
      　　光鼓起發熱的臉，沒好氣地看著他。
      　　
      　　古·拉哈·提亞垂下了眼睛。
      　　
