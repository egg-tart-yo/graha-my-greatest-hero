title: 吃醋
cp:
  - 拉哈光
  - 歡樂/甜文向
updated: 2026-01-01
summary: 無
series: 短篇
chapters:
  - body: |-
      　　光又收到了一封情書。
      　　
      　　那封信被仔細摺好，夾在一束剛採下不久的花裡，花瓣上還沾著清晨的露水。送信的人似乎鼓足了極大的勇氣，把東西交到英雄手裡後，連一句完整的話都沒能說完，便紅著臉匆匆跑遠了。
      　　
      　　光站在原地，看著懷裡的花，又看了看那道逐漸消失在街角的背影，最後只能無奈地嘆了一口氣。
      　　
      　　「又來了啊。」
      　　
      　　坐在不遠處的古·拉哈·提亞原本正低頭翻閱手中的書，聞言，耳朵微不可察地動了一下。
      　　
      　　他沒有立刻抬頭，只是翻頁的動作停頓了片刻。
      　　
      　　「又是情書嗎？」
      　　
      　　他的語氣平穩，聽起來彷彿只是隨口一問。
      　　
      　　光抱著花走到桌邊，在他對面坐下，將那封信抽了出來。
      　　
      　　「大概是，雖然我對他沒什麼印象……好像是在委託裡幫過的人。」
      　　
      　　古·拉哈·提亞低低應了一聲，視線仍落在書頁上。
      　　
      　　光拆開信，認真地讀了起來。
      　　
      　　信上的字跡有些歪斜，顯然書寫的人十分緊張，內容卻很誠懇，從第一次見到光時的憧憬，到受到幫助後的感激，再到鼓起勇氣坦白心意，每一句都寫得小心翼翼。
      　　
      　　光一向不擅長面對這種事。
      　　
      　　他可以毫不猶豫地踏入險境，可以在危急之際做出最果斷的選擇，卻總會在收到情書時陷入漫長的苦惱。
      　　
      　　因為他不想敷衍任何人的心意，就算不能回應，也至少應該好好地把話說清楚。
      　　
      　　於是光取來紙筆，將信攤在桌上，對著空白的信紙思考了許久。
      　　
      　　古·拉哈·提亞終於忍不住從書頁上抬起眼。
      　　
      　　光正微微蹙著眉，筆尖停在紙面上方，似乎在斟酌該用什麼措辭，才能既不讓對方有所誤會，也不至於顯得太過冷淡。
      　　
      　　那副認真的模樣，反而讓古·拉哈·提亞心裡湧起一股酸澀的情緒。
      　　
      　　「你每一封都要回嗎？」
      　　
      　　光頭也不抬地答道：「總不能當作沒看見吧。」
      　　
      　　「人家認真寫了，我也應該認真回。」
      　　
      　　語畢，光又再度陷入了苦思。
      　　
      　　他寫了幾句，覺得太過冷淡，便劃去重寫，斟酌了一陣仍不滿意，乾脆換了一張信紙。
      　　
      　　筆尖走走停停，房間裡一時只剩下細微的落筆聲。
      　　
      　　古·拉哈·提亞看似專注於書本，視線卻不時越過書頁邊緣，悄悄落到光身上。
      　　
      　　他知道光一向如此。
      　　
      　　無論面對的是多麼微小的請託，又或者是旁人託付而來的情感，只要光接到了手中，便不會隨意處置。
      　　
      　　那正是光的溫柔，他比任何人都清楚，也比任何人都喜愛這一點。
      　　
      　　只是理解，並不代表他就能坦然看著光為另一個人的告白苦惱這麼久。
      　　
      　　桌邊安靜了許久，沒有書頁翻動的聲音，只剩筆尖摩擦紙面的細微聲響。
      　　
      　　直到光停下筆，無意間抬起頭，才發現對面的人雖然捧著書，神情卻明顯有些鬱悶。
      　　
      　　古·拉哈·提亞的耳朵微微向後壓著，尾巴也安靜地垂在椅邊，偶爾不太高興似地輕輕掃動一下。
      　　
      　　光盯著他看了片刻。
      　　
      　　「拉哈。」
      　　
      　　「嗯？」
      　　
      　　「你是不是在吃醋？」
      　　
      　　古·拉哈·提亞的耳朵猛地豎了起來。
      　　
      　　「我沒有。」
      　　
      　　回答得太快了，這肯定是有。
      　　
      　　古·拉哈·提亞輕咳一聲，故作鎮定地給予建議：「我只是覺得，只要明確表達你無意接受就好，不用太過苦惱。」
      　　
      　　光沒有立刻反駁，只是看著他泛紅的耳尖，若有所思地低下頭。
      　　
      　　古·拉哈·提亞等了一會兒，沒有等到回應，忍不住又偷偷將視線移過去。
      　　
      　　光已經再次提起筆。
      　　
      　　他似乎終於想好了該怎麼寫，這回落筆十分順暢，幾乎沒有停頓。
      　　
      　　古·拉哈·提亞看不見信上的內容，只能看見光寫到一半時，唇角似乎輕輕揚了起來。
      　　
      　　這讓他更加在意了。
      　　
      　　「你寫了什麼？」
      　　
      　　「回信。」
      　　
      　　古·拉哈·提亞一時語塞，向後壓著的耳朵卻更平了。
      　　
      　　光看了他片刻，忍著笑意，將信紙推了過去。
      　　
      　　「那你自己看。」
      　　
      　　古·拉哈·提亞伸手接過信紙，默默低下了頭。
      　　
      　　信的前半段寫得一如往常地誠懇。
      　　
      　　光先感謝了對方的心意，也說明自己很珍惜這份真誠，只是無法給予同樣的回應。
      　　
      　　直到最後一段，古·拉哈·提亞的目光忽然停了下來。
      　　
      　　──況且，我已經有一位很棒的戀人了。
      　　
      　　──他聰明、溫柔，無論何時都願意相信我。有時候，他會把許多事情藏在心裡，獨自煩惱許久，偶爾也會因為一些小事吃醋，卻又總是不肯坦率承認。
      　　
      　　──但對我而言，他是無可取代的人，也是我能付出性命守護他的人。
      　　
      　　古·拉哈·提亞看著那幾行字，久久沒有出聲。
      　　
      　　他的耳朵微微僵住，接著一點一點染上紅意，連握著信紙的手指都不自覺收緊了一些。
      　　
      　　光支著下巴，安靜地觀察他的反應。
      　　
      　　「怎麼樣？這樣算是說清楚了吧？」
      　　
      　　古·拉哈·提亞張了張口，徹底說不出話來。
      　　
      　　光看著他紅透的耳尖，心情很好地伸出手，輕輕碰了一下。
      　　
      　　「這樣還吃醋嗎？」
      　　
      　　古·拉哈·提亞抬起眼。
      　　
      　　那雙紅眼裡原本還帶著幾分羞赧，可在看清光眼中的笑意後，某種情緒卻逐漸變得深沉。
      　　
      　　光很快察覺到了不對。
      　　
      　　「拉哈？」
      　　
      　　古·拉哈·提亞將信紙放回桌面，接著起身繞過桌子，走到了光的面前。
      　　
      　　光仰頭看他，困惑問道：「怎麼了？」
      　　
      　　「我只是忽然覺得，」古·拉哈·提亞俯下身，雙手撐在光身旁的椅背上，將人困在自己與椅子之間，「英雄有時候實在太狡猾了。」
      　　
      　　光一臉無辜，「我做了什麼？」
      　　
      　　「明知道我在意，還故意看我的反應。」
      　　
      　　「誰叫你平時都隱藏得太好了。」
      　　
      　　「那現在呢？」古·拉哈·提亞的尾巴在身後輕輕擺動，語氣低了下來，「看清楚了嗎？」
      　　
      　　兩人的距離近得幾乎能感受到彼此的呼吸。
      　　
      　　光終於有了一點危機感，卻沒有躲開，反而笑著抬手，勾住了古·拉哈·提亞垂落在肩側的髮絲。
      　　
      　　「還沒有。」
      　　
      　　古·拉哈·提亞的眼神微微一暗，下一刻便攬住光的腰，將人從椅子上抱了起來，光只來得及發出一聲短促的驚呼，便被他帶著倒進了一旁柔軟的長榻裡。
      　　
      　　古·拉哈·提亞一手護在光的腦後，避免他撞疼，另一隻手仍牢牢扣著他的腰。
      　　
      　　光陷在軟墊中，眨了眨眼。
      　　
      　　「做什麼？」
      　　
      　　古·拉哈·提亞俯在他上方，紅著臉，卻沒有退開。
      　　
      　　「這是招惹一個正在吃醋的人，會導致的後果。」
      　　
      　　「所以你果然在吃醋。」
      　　
      　　「……是。」
      　　
      　　他無奈地輕嘆，像是不知多少次敗給身下的英雄。
      　　
      　　「我知道你不會接受他們的心意，也明白你只是想認真回應每一個向你表達感情的人。可是每當看見你收到這些信，我還是會忍不住想……究竟還有多少人，會因你向他們伸出過手，便從此無法將目光從你身上移開。」
      　　
      　　他停頓了一下，笑得很苦惱。
      　　
      　　「不過，這也是理所當然的事。畢竟，連我也──」
      　　
      　　直白的傾訴被光伸手環住他的動作打斷。
      　　
      　　懷裡的英雄眨眨眼，手指安撫地捏了捏他環住的後頸。
      　　
      　　「既然這樣，往後的每一封信，我都這麼回吧。」他露出微笑，「這樣大家都會知道，我有一個很棒的戀人。」
      　　
      　　古·拉哈·提亞怔了一瞬。
      　　
      　　隨著眼底最後一絲克制鬆動，他俯下身，帶著幾分佔有意味，狠狠咬住了光正含笑的唇。
