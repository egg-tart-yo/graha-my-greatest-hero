title: 光之郵務士
cp:
  - 拉哈光
  - 光拉哈
  - 女光
updated: 2026-01-01
summary: 有4版與2版小支線注意
series: 短篇
chapters:
  - body: |-
      　　紅玉海的潮風帶著濕潤的鹹味，遠方海面在日光下閃著細碎的銀光。光站在碼頭邊，將委託書重新折好收進行囊，又低頭確認了一次身上的裝備。
      　　
      　　這趟任務的目的地在紅玉海深處。
      　　
      　　那是陸上之人難以輕易踏足的地方。幸好光曾受甲人族祝福，得以長時間閉氣，也能在水中行動自如。只可惜同樣的加護並非人人都有，這一次她只能單獨行動。
      　　
      　　「只是下個海而已嘛。」她拍了拍自己的臉頰，朝無人聽見的海風替自己打氣，「很快就回來。」
      　　
      　　話說得輕巧，光卻還是忍不住看向掌心中稍早卸下的通訊貝。
      　　
      　　一旦入水，她就無法穩定對外通訊。紅玉海深處的環境特殊，紫水宮那邊更是有阻隔外界的術法保護，等她真正開始行動，恐怕好幾天都沒辦法傳回消息。
      　　
      　　光的腦海中忍不住浮現那位紅髮貓魅的身影。
      　　
      　　那個人平時看起來穩重可靠，遇到正事也總能冷靜判斷，可只要事情牽扯到她，這些標準偶爾就會朝失靈的方向前進。
      　　
      　　除了自己多日失聯可能會引發的擔憂外，光也擔心總是熬夜埋首研究到廢寢忘食的他會變本加厲。兩人在一起的時候，光總是靠耍賴，才讓他笑著放棄手中的工作，為了陪她而乖乖休息。現如今自己不在身邊，光一點都不想猜測古·拉哈·提亞究竟會看見幾次日出。
      　　
      　　想到這裡，雙手插腰的光蹙起眉，輕聲嘟囔。
      　　
      　　「不行，得先想個辦法。」
      　　
      　　於是她在紅玉海附近四處打聽，終於在一座熱鬧的海盜聚落旁，找到了一隻正在努力整理郵袋的莫古力郵差。
      　　
      　　那隻莫古力看起來年紀不大，頭頂的絨球晃來晃去，面前的信封卻已經快堆得比他還高。他一邊翻看地址，一邊小聲唸著什麼，神情既嚴肅又認真。
      　　
      　　光蹲到他面前，笑著揮了揮手。
      　　
      　　「你好呀，我想拜託你幫我送幾封信。」
      　　
      　　莫古力抬起頭，看清她的臉後，整隻猛地彈了一下。
      　　
      　　「咕、咕波？！光、光之郵務士大人？！」
      　　
      　　「不用這麼緊張啦。」光笑得更加燦爛，「只是普通的送信委託而已。」
      　　
      　　普通。
      　　
      　　菜鳥莫古力抱著郵袋，顯然完全不覺得這兩個字能和眼前這位傳說中的光之郵務士扯上關係。
      　　
      　　畢竟在莫古力郵務圈裡，光之郵務士可不是普通稱號。
      　　
      　　那是曾經協助過無數郵務任務、跨越各地送達重要信件，甚至被許多前輩莫古力反覆提起的存在。對這隻剛開始獨立送信不久的莫古力來說，光站在他面前，就足以讓他嚇到絨球發直。
      　　
      　　光沒有察覺他心中正在掀起多麼壯烈的郵務風暴。她在木箱旁坐下，拿出紙筆，開始一封封寫信。
      　　
      　　第一封寫著她已經抵達紅玉海，天氣很好，海風有點鹹，附近的商人賣的魚乾味道很香。
      　　
      　　第二封寫著她即將下水，雖然無法聯絡，但一切都在掌握之中，叫古·拉哈·提亞不要擔心，也不要因為她不在就熬夜查資料。
      　　
      　　第三封寫著她順利進入海底，水中的景色漂亮得不像話，魚群像發光的緞帶一樣從身旁游過。
      　　
      　　第四封寫著紫水宮比起上回又更加華麗，宮殿的色彩在水光中像夢一樣搖晃。
      　　
      　　寫到第五封的時候，光停頓了一下。
      　　
      　　她咬著筆桿，想了想，最後十分自然地開始捏造還沒發生的冒險。
      　　
      　　「今天遇到了一隻很大的水蛇，不過別擔心，我把牠打跑了。」
      　　
      　　她寫完，思考片刻，又補上一句。
      　　
      　　「如果牠其實是守護神獸之類的，那我接下來還得小心一點。」
      　　
      　　第六封裡，她寫自己在紫水宮深處找到了一顆漂亮的貝殼，顏色很像古·拉哈·提亞的眼睛。
      　　
      　　第七封裡，她稍微回想了一下紫水宮周圍的景色，乾脆把腦海中的畫面全都畫了下來。
      　　
      　　第八封裡，她寫自己找到了很多有趣的土產，雖然還沒決定哪些能帶回去，但已經先全部收進包包了。
      　　
      　　最後一封，她寫得比前面都慢。
      　　
      　　紙上原本活潑跳躍的字跡逐漸安靜下來。
      　　
      　　她寫了紅玉海的光，寫了深海裡聽不見風聲的寂靜，寫了自己明明才剛離開，卻已經想念第七天堂熱鬧的夜晚。
      　　
      　　也寫了古·拉哈·提亞。
      　　
      　　寫他讀書時垂下的眼睫，寫他聽見她回來時總是忍不住先一步抬起的耳朵，寫他偶爾太過認真、太過努力，就算再疲累，只要對上她，眼底的倦意也會被收得乾乾淨淨。
      　　
      　　筆尖在紙上輕輕點了點，她隨後寫道。
      　　
      　　我會平安回去。
      　　
      　　所以你也要好好吃飯，好好休息。
      　　
      　　等我回來，再把紅玉海的故事全部說給你聽。
      　　
      　　你也要告訴我，這幾天你過得怎麼樣。
      　　
      　　最後，她握著筆，望著遠方被夕陽染紅的海面，唇角彎了彎。
      　　
      　　然後在信尾加上一句。
      　　
      　　我很想你，是非常、非常想的那種。
      　　
      　　寫完之後，光把信一封封整理好，依照日期標上順序，慎重地交給莫古力。
      　　
      　　「我接下來要前往紫水宮，途中可能沒辦法對外聯絡。」光將整理好的信件遞給他，仔細叮囑，「所以想麻煩你照著信封上的日期，一封一封送到古·拉哈·提亞手上。」
      　　
      　　「照、照日期，一封一封咕波……」
      　　
      　　「對，不是全部一起送喔。」
      　　
      　　「不是全部一起送咕波！」
      　　
      　　「第一天送第一封，第二天送第二封。」
      　　
      　　「第一天第一封，第二天第二封咕波！」
      　　
      　　莫古力用力點頭，絨球晃得像快要飛出去。
      　　
      　　光看他答得這麼認真，便放心地笑了。
      　　
      　　「那就拜託你了。」
      　　
      　　「交、交給我咕波！我一定不會辜負光之郵務士大人的信任咕波！」
      　　
      　　後來事實證明，這句話通常是災難開始前最響亮的號角。
      　　
      　　數日後，喪靈鐘的第七天堂。
      　　
      　　古·拉哈·提亞結束了一天的野外探索，正準備回房整理資料，便聽見窗外傳來一陣急促的翅膀拍動聲。
      　　
      　　「咕波！收信，咕波！」
      　　
      　　他抬起頭，一隻莫古力從窗邊努力鑽進來，身後拖著一個比他還大的郵袋。
      　　
      　　古·拉哈·提亞微微一愣。
      　　
      　　「給我的？」
      　　
      　　「給古·拉哈·提亞先生的信咕波！」
      　　
      　　莫古力啪地一下把郵袋放到桌上，袋口鬆開，裡面的信立刻嘩啦啦地滑了出來。
      　　
      　　一封、兩封、三封。
      　　
      　　最後堆成了一座小小的信山。
      　　
      　　古·拉哈·提亞沉默地看著那堆信。
      　　
      　　莫古力也沉默地看著那堆信。
      　　
      　　空氣安靜了幾秒。
      　　
      　　古·拉哈·提亞伸手拿起最上面的一封，看見信封上熟悉的字跡，眼神先是柔和下來，隨即又因為信封角落標著「第一天」而微微一頓。
      　　
      　　他接著拿起下一封。
      　　
      　　「第二天」。
      　　
      　　再下一封。
      　　
      　　「第三天」。
      　　
      　　他終於抬起眼，看向那隻渾身僵硬的莫古力。
      　　
      　　莫古力的絨球顫了一下。
      　　
      　　「咕波……？」
      　　
      　　古·拉哈·提亞沒有立刻說話。
      　　
      　　他垂眸看著桌上那疊信，已經猜到了事情的全貌，卻仍在努力忍住笑意。
      　　
      　　「這些信，原本應該不是同一天送到的吧？」
      　　
      　　面對他的問題，莫古力整隻僵住。
      　　
      　　他張了張嘴，又閉上，抱著郵袋的手越收越緊。
      　　
      　　「我、我以為……光之郵務士大人把所有信都交給我，就是要立刻送到最重要的人手上咕波……可是她又說第一天、第二天……我想了很久咕波……」
      　　
      　　他的聲音越來越小。
      　　
      　　「然後我覺得，重要的信應該越快送到越好咕波……」
      　　
      　　古·拉哈·提亞看著他，終究沒忍住笑了出來。
      　　
      　　那笑聲很輕，並沒有責備的意思，反倒讓莫古力更加慌張。
      　　
      　　「對、對不起咕波！我搞砸了光之郵務士大人的委託咕波！」
      　　
      　　「不。」古·拉哈·提亞搖搖頭，伸手將桌上的信一封封理齊，「並沒有搞砸。」
      　　
      　　莫古力愣住。
      　　
      　　古·拉哈·提亞垂下眼，看著那些熟悉的字跡，聲音柔和了下來。
      　　
      　　「你只是讓我比預定更早收到她的消息而已。」
      　　
      　　他溫柔地朝莫古力露出微笑，隨後拆開了第一封信。
      　　
      　　光的字跡一如既往明亮，像她本人那樣，連落在紙面上的筆畫都帶著風與陽光。她說紅玉海的海風很舒服，說自己吃到了味道不錯的魚乾，還說如果他在場，一定會認真分析這裡的海產保存方式。
      　　
      　　古·拉哈·提亞低低笑了一聲。
      　　
      　　第二封裡，她叮囑他不要熬夜。
      　　
      　　古·拉哈·提亞默默看了一眼桌上堆到一半的資料，無奈地把它們推遠了一點。
      　　
      　　第三封裡，她形容海底的魚群像發光的緞帶。
      　　
      　　第四封裡，她說紫水宮漂亮得像夢。
      　　
      　　第五封裡，她寫自己打跑了一隻巨大的水蛇，還細緻地描述了戰鬥的細節。
      　　
      　　古·拉哈·提亞越讀，眉眼間的笑意越深。
      　　
      　　光的信沒有一天真正寄出，卻像真的陪著她走過那段旅程。她把還沒發生的事寫得煞有其事，把孤身前往深海的危險藏在玩笑後面，只把燦爛的景色和荒唐的見聞寄回來。
      　　
      　　他知道她是故意想讓他安心，內心感到無奈，卻又覺得溫暖。
      　　
      　　直到他拆開最後一封。
      　　
      　　信紙被展開時，古·拉哈·提亞的動作慢了下來。
      　　
      　　那封信的語氣比前面安靜許多。
      　　
      　　她寫紅玉海深處很美，卻也很安靜。寫有些時候，她會忽然想念他們臥房裡的燈，想念翻書的聲音，想念有人在她回頭時，總是望著她的眼睛。
      　　
      　　她寫要他好好吃飯，好好休息。
      　　
      　　要等她回來。
      　　
      　　最後一行字停在信紙下方，單獨留下了一句筆觸很深的思念。
      　　
      　　古·拉哈·提亞安靜地看著那行字，指尖細細滑過紙上的痕跡，隨後停在那一句話上方。
      　　
      　　窗外的風輕輕吹動窗簾，桌上的信紙發出細微的聲響。
      　　
      　　菜鳥莫古力縮在桌邊，小心翼翼地看著他。
      　　
      　　「古、古·拉哈·提亞先生……？」
      　　
      　　古·拉哈·提亞抬起頭，他的臉頰泛著一點紅，眼神卻比方才更溫柔。
      　　
      　　「請問，你知道她是從哪裡出發前往紫水宮的嗎？」
      　　
      　　「知道，光之郵務士大人是在紅玉海那邊交給我信的咕波。」
      　　
      　　古·拉哈·提亞將最後一封信仔細收好，隨後拎起放在一邊的行囊，開始收拾簡便的物品。
      　　
      　　「那麼，能請你帶路嗎？」
      　　
      　　「咕波？」
      　　
      　　「我想去紅玉海。」他說，「去迎接她。」
      　　
      　　莫古力怔了一下，隨後絨球猛地亮了起來。
      　　
      　　「帶、帶路嗎咕波？」
      　　
      　　「是的。」古·拉哈·提亞微笑，「如果你願意的話。」
      　　
      　　「願意！當然願意咕波！」
      　　
      　　莫古力用力點頭，幾乎要把自己點得從半空掉下去。
      　　
      　　「這一次我一定會好好完成任務，咕波！」
      　　
      　　古·拉哈·提亞看著他認真的模樣，笑意更深。
      　　
      　　「那就拜託你了。」
      　　
      　　
      　　
      　　
      　　等他們抵達紅玉海時，天色正被夕陽染成溫暖的橘紅。
      　　
      　　潮水一層層推上岸，又慢慢退去，留下濕亮的沙痕。海面遠方有飛鳥掠過，叫聲被風拉得很長。
      　　
      　　古·拉哈·提亞依據過去光所描述的經歷，找到了她熟識的海盜，並暫時落腳在岸邊一間簡陋的小屋。小屋的窗正對著大海，從那裡望出去，能看見波光粼粼的海面，也能看見她可能歸來的方向。
      　　
      　　他並沒有細數等了多久，只是一邊讀著帶來的書，時不時望向海面。
      　　
      　　直到水面忽然泛起漣漪，一道人影從海中冒了出來。
      　　
      　　光甩了甩濕透的髮，水珠在夕陽下飛散成細小的光。她背上背著鼓鼓的行囊，兩手還提著幾包用防水布包好的東西，腰側甚至掛著一串不知道從哪裡蒐集而來的貝殼飾品。
      　　
      　　古·拉哈·提亞怔了一下，隨後快步踏出屋外。
      　　
      　　同樣發現他的光眨了眨眼，先是驚訝，隨即露出燦爛的笑容。
      　　
      　「拉哈！」
      　　
      　　她踩著淺水跑上岸，行囊在背後晃得驚心動魄。古·拉哈·提亞急忙上前接住她手上的東西，下一刻又被她大大的擁抱撞得往後退了一步。
      　　
      　　懷裡的人帶著海水的涼意，髮梢還在滴水，卻炙熱的像剛從陽光裡跑出來。古·拉哈·提亞原本想說些什麼，最後只是先抬手扶穩她的背，又替她把黏在臉側的濕髮輕輕撥開。
      　　
      　　「慢一點。」他低聲說，語氣裡沒有責備，只有無可奈何的溫柔，「我就在這裡，不會跑掉的。」
      　　
      　　「你怎麼在這裡？」光笑著問，「我還以為要回去才能見到你。」
      　　
      　　古·拉哈·提亞看著她濕漉漉卻明亮的眼睛，視線不自覺地在她臉上停了一圈，又不著痕跡地確認了下身上有沒有多餘的傷勢，才終於放下心來。
      　　
      　　許多話到了唇邊，最後只化成一句很輕的回答。
      　　
      　　「我來迎接你。」
      　　
      　　光愣了一下，臉上的笑容比夕陽還要明亮。
      　　
      　　「那正好。」她迫不及待把手上的東西捧進他懷裡，「我帶了好多東西要送你。」
      　　
      　　古·拉哈·提亞低頭看著懷中的土產。
      　　
      　　貝殼、海草乾、奇妙的魚形點心，還有一個包得格外仔細的小盒子。看來他的光確實記得自己信上寫了什麼，也真的根據那些內容把東西帶了回來。
      　　
      　　「這些全都是？」
      　　
      　　「嗯。」光點頭，眼神驕傲得像在獻寶，「我每看到一樣都覺得你可能會喜歡，結果回過神來就變成這樣了。除了這些之外呢……」
      　　
      　　她神神秘秘地擠了擠眼睛，隨後大聲宣告：「這次的冒險跟信裡寫的比起來，驚險好多！我有好多好多話想跟你說！」
      　　
      　　古·拉哈·提亞看著她驕傲又雀躍的模樣，眼神柔軟得幾乎能將人整個包住。
      　　
      　　「那我可得好好聽了。」他說，「畢竟這是最棒的禮物。」
      　　
      　　光笑瞇瞇地看著他，忽然發現另一股注視著她的視線。
      　　
      　　那隻菜鳥莫古力正躲在古·拉哈·提亞身後，絨球微微發抖。被光訝異地盯著看後，他終於鼓起勇氣，猛地飛到她面前。
      　　
      　　「對不起，光之郵務士大人！」他深深低頭，「我把信全部一次送出去了咕波！」
      　　
      　　光愣了一下，隨後看向古·拉哈·提亞。
      　　
      　　後者朝她眨了眨眼，帶著藏不住的笑意，那雙會說話的紅色眼睛似乎在告訴她，他已經把所有笨拙又溫柔的心意都好好收下了。
      　　
      　　光瞬間明白了。
      　　
      　　「全部？」
      　　
      　　莫古力低著頭。
      　　
      　　「是的咕波……」
      　　
      　　光安靜了幾秒，然後噗哧一聲笑了出來。笑聲輕快地混進潮聲裡，也連帶捲去了莫古力的不安。
      　　
      　　「沒關係啦。」光彎下腰，用指尖輕輕碰了碰他頭頂的絨球，「雖然和我原本想的不太一樣，不過你確實把信送到了最重要的人手上，還幫我帶來了最好的回信。」
      　　
      　　她笑著補了一句。
      　　
      　　「很棒地完成任務了喔。」
      　　
      　　莫古力的絨球慢慢停止顫抖，眼前的兩人都笑著望著他。
      　　
      　　「真的……沒關係嗎咕波？」
      　　
      　　「真的。」光笑瞇瞇地說，「不過下次要記得，一天一封就是一天一封。」
      　　
      　　「我會記住的咕波！」
      　　
      　　莫古力用力點頭，隨之開心地轉了一圈。
      　　
      　　光直起身，看向古·拉哈·提亞。
      　　
      　　「所以，你都看完了？」
      　　
      　　古·拉哈·提亞抱著那些土產，臉頰被夕陽照得更紅了些。
      　　
      　　「信嗎？看完了。」
      　　
      　　「最後一封也看了？」
      　　
      　　「……看了。」
      　　
      　　光的眼裡浮起一點狡黠。
      　　
      　　「那我就不用再說一次了？」
      　　
      　　古·拉哈·提亞抬起眼，看著她被夕陽照亮的臉。
      　　
      　　他沒有立刻回答，只是將懷裡的東西暫時放到一旁，終於能騰出手來，輕輕握住她被海水浸得微涼的指尖。
      　　
      　　「你不說也沒有關係。」他低聲說，指腹溫柔地覆過她的手背，「我已經收到了。」
      　　
      　　光瞇起眼，古·拉哈·提亞又笑著補充。
      　　
      　　「只是，如果你願意再說一次，我會很高興。」
      　　
      　　坦誠的答案終於讓光露出滿意的眼神，她微微踮起腳尖，湊到古·拉哈·提亞耳邊。
      　　
      　　「我很想你喔。」
      　　
      　　她說。
      　　
      　　「而且是超級、超級想的那種。」
      　　
      　　回答英雄的，是比太陽還要炙熱的擁抱。
      　　
      　　菜鳥莫古力在一旁悄悄擦了擦眼角，似乎覺得自己雖然搞砸了送信順序，卻意外完成了一項非常偉大的郵務任務。
      　　
      　　至少他自己是這麼認為的。
      　　
      　　他突然感到非常驕傲，開心地旋轉著，大聲宣告。
      　　
      　　「莫古有好好完成任務了咕波！」
