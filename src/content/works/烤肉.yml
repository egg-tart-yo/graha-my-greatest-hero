  - body: |-
      　　營火在溪邊劈啪作響，跳動的火光將圍坐眾人的影子拉得老長。鐵架上的肉排被油脂烘烤得滋滋作響，散發出濃郁的焦香，肉汁順著紋理滴落進炭火中，激起一陣陣細微的青煙。
      　　
      　　光盤腿坐在火堆旁，手裡拿著烤肉夾，神情專注地盯著肉的顏色，時不時添點醬汁。在他手邊最近的位置，古·拉哈·提亞也跟著坐在溪邊的石頭上，雙手捧著一塊剛烤好、吹得微涼的肉塊，吃得兩腮微微鼓起。
      　　
      　　那雙紅色的眼眸滿足得微微瞇起，毛茸茸的貓耳也愜意地輕輕晃動，連身後的尾巴都極其放鬆地在草葉間有一搭沒一搭地輕輕掃著。
      　　
      　　每咬下一口，古·拉哈·提亞便發自內心地發出一聲滿足的輕哼。那副享受的模樣，讓人毫不懷疑大英雄料理肉排的能力。
      　　
      　　光微微側過臉，目光無聲地在那張鼓鼓的腮幫子上停留了兩秒。他一句話也沒說，只是靜靜地夾起鐵架上剛熟透的一大塊肋排，往古·拉哈·提亞面前的盤子塞。
      　　
      　　而那裡原本就已經壘著好幾層冒著熱氣的烤肉。
      　　
      　　古·拉哈·提亞嘴裡還嚼著食物，有些驚訝地眨了眨眼，剛想開口說自己吃不完，光卻連頭都沒回，又熟練地拾起另一串烤菇，再次穩穩地將菇串疊了上去。
      　　
      　　短短幾分鐘，古·拉哈·提亞面前的盤子已經被堆成了一座顫巍巍、名副其實的「肉山」。
      　　
      　　「……」
      　　
      　　吞著口水的桑克瑞德終於看不下去了。
      　　
      　　他看著自己空空如也的盤子，無奈地嘆了口氣。
      　　
      　　「我說英雄大人……我們的份呢？」
      　　
      　　另一邊，艾斯蒂尼安已經朝古·拉哈·提亞的盤子伸出手，卻被光眼明手快地拍開了。
      　　
      　　「喂……」
      　　
      　　「你等下一輪。」
      　　
      　　「已經等了好幾輪了！」
      　　
      　　分到一塊蜂蜜肉片的阿爾菲諾忍不住笑出了聲，他一邊優雅地吃著嘴裡的東西，有些哭笑不得地看著那幾乎要遮住古·拉哈·提亞整張臉的盤子。
      　　
      　　「光，就算拉哈的胃口再好，這個分量也未免太誇張了些。」
      　　
      　　面對同伴們的聲討與調侃，光終於停下了手中的動作。
      　　
      　　他一本正經地轉過頭，看了看古·拉哈·提亞尚且平坦的腹部，頗不滿意地搖了搖頭。
      　　
      　　「太瘦了，得養成貓小胖。」
      　　
      　　營地周圍瞬間陷入了短暫的寂靜。
      　　
      　　「噗哈哈哈哈！」阿莉塞大笑出聲，漂亮的眼睛不懷好意地瞇起，「要我說，你少跟拉哈出去冒險，都把他留在家裡，效果會更好喔。」
      　　
      　　「那、那怎麼可以！」
      　　
      　　古·拉哈·提亞整張臉瞬間爆紅，他嘴裡還塞著滿滿的肉塊，腮幫子鼓鼓的，含糊不清卻極其抗議地反駁道：「光，你別聽她亂說！不可以把我留在家裡！」
      　　
      　　阿爾菲諾也跟著湊了過來，好心地提醒。
      　　
      　　「不想變成圓滾滾的樣子，你就得放棄光的料理喔。」
      　　
      　　古·拉哈·提亞嘴裡的動作驟然一僵。
      　　
      　　那雙紅色的眼睛慌亂地游移了一下，看了看面前香氣四溢、堆得滿滿的肉山，又看了看身旁正拿著夾子、一臉平靜注視著自己的光。
      　　
      　　放棄光的料理？
      　　
      　　那怎麼可能……這可是光親手烤的啊。
      　　
      　　在眾人戲謔的注視下，古·拉哈·提亞的貓耳肉眼可見地扁了下來，整個人徹底縮了下去。他默默低下頭，紅著臉一言不發，只是賭氣似地把整張臉埋進肉山後方，洩憤般地大口嚼著嘴裡的肉排。
      　　
      　　營火溫暖地跳躍著。
      　　
      　　光看著那對垂下去的耳尖，眼底泛起了一抹極淺、卻溫柔至極的笑意。他沒有再說話，只是順手拿起旁邊乾淨的布巾，輕輕擦去了古·拉哈·提亞嘴角蹭上的一點醬汁。
