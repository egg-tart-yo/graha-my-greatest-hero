  - body: |-
      　　拂曉的眾人很早以前就發現了一件事──光之戰士似乎特別喜歡招惹古·拉哈·提亞。
      　　
      　　至於這種「特別」究竟是哪一種，本人大概是整個石之家最後一個察覺的人。
      　　
      　　事情其實都不大，就比方剛才，光經過古·拉哈·提亞身邊時，手可疑地舉在身側。見對方十分認真地閱讀手中的書籍，他趁人不備、伸手一拉，將古·拉哈·提亞平時圍在脖頸的黑色領巾向上拋起。
      　　
      　　古·拉哈·提亞只覺得眼前一暗，整張臉便被厚實的布料蓋住。
      　　
      　　「哇！什麼！」
      　　
      　　光站在他身後，兩手抓著圍巾兩端，又往上繞了一圈，轉眼間便把古·拉哈·提亞的腦袋包得嚴嚴實實，只露出頭頂那對紅色的耳朵。
      　　
      　　耳朵在布料上方用力抖了兩下。
      　　
      　　「光！是你吧！」
      　　
      　　「耳朵真靈活。」
      　　
      　　「別捉弄我！這樣什麼都看不見阿！」
      　　
      　　「這是新的防具。」
      　　
      　　「哪有防具會把視野一起封住的！」
      　　
      　　古·拉哈·提亞一邊抗議，一邊伸手胡亂摸索圍巾的邊緣。光看著他兩手在半空中摸來摸去，覺得很有趣，甚至還故意往後挪了一步。
      　　
      　　古·拉哈·提亞的手立刻跟著聲音追過去。
      　　
      　　「你在那裡對吧？」
      　　
      　　光瞬間隱去了所有動靜，一邊憋著笑、一邊又往後挪了一步。
      　　
      　　「不要躲我！說話！」
      　　
      　　等古·拉哈·提亞終於從圍巾裡掙脫出來時，罪魁禍首早就跑得無影無蹤。
      　　
      　　他站在原地，頭髮被弄得亂七八糟，尾巴也因為剛才的慌亂微微炸開。
      　　
      　　沉默半晌，古·拉哈·提亞卻也沒有真的生氣，只是帶著一臉無奈的神情，低頭重新整理圍巾。
      　　
      　　這大概就是所有問題的開端。
      　　
      　　因為光發現，逗弄古·拉哈·提亞真的很好玩，而且對方的容忍度似乎高到不可思議。
      　　
      　　比如耳朵，不僅遠比他的表情誠實，對聲音的反應也很靈敏──看書看得專心時，從背後叫他一聲，耳朵會先朝聲音的方向轉過來；稱讚他準備的食物好吃，耳朵會高高豎起；若是故意靠近一點，看著他不說話，耳朵又會不自在地往外撇。
      　　
      　　光甚至在某一天，古·拉哈·提亞站在櫃子前翻找東西時，從後面無聲無息地靠近，然後偷偷碰了一下他的耳尖。
      　　
      　　古·拉哈·提亞整個人差點跳起來。
      　　
      　　他猛地轉過身，一手摀住自己的耳朵，瞪大眼睛。
      　　
      　　「嚇我一跳！」
      　　
      　　「我就碰一下，看起來很好摸。」
      　　
      　　「那也不能突然──」
      　　
      　　爭論間，光的視線突然落向另一隻耳朵。
      　　
      　　古·拉哈·提亞立刻警覺地往後退了一步，雙手護住自己的頭頂。
      　　
      　　「不行。」
      　　
      　　光又往前了一步。
      　　
      　　「光，我說真的，不可以。」
      　　
      　　眼見人完全不理會，古·拉哈·提亞只能轉身逃跑，兩人的追逐在阿爾菲諾身側刮起一陣風，伴隨著各種「我再摸一次」與「不要」的爭執。
      　　
      　　他困惑地停下手中的筆，將視線投注於一旁保養武器的桑克瑞德。
      　　
      　　「……他們平常在外面冒險，也是這個樣子嗎？」
      　　
      　　桑克瑞德頭也不抬，似乎早就習以為常。
      　　
      　　「跟上次比起來，摸耳朵算好了。」
      　　
      　　「上次？」
      　　
      　　「上次光居然搶了古·拉哈的點心。」
      　　
      　　阿爾菲諾的表情更困惑了。
      　　
      　　「為什麼？」
      　　
      　　「不知道。」
      　　
      　　桑克瑞德沒有隱瞞，因為確實沒有人知道，包含光自己也是。
      　　
      　　倒也不是因為他沒東西吃，只是覺得古·拉哈·提亞被搶東西時的反應很有意思。
      　　
      　　那天古·拉哈·提亞才剛從廚房拿回一塊新烤好的塔，還特地分成兩份，滿心期待地端去找光。
      　　
      　　「光，你在這裡啊。我剛剛……」
      　　
      　　不等他說完，光只低頭看了一眼，隨後直接整盤端走、轉身就跑。
      　　
      　　整套動作行雲流水，與其說他是拯救世界的大英雄，倒不如說是熟練的小偷。
      　　
      　　古·拉哈·提亞捧著空空的托盤，愣了足足兩秒，接著那雙紅色的眼睛慢慢睜大。
      　　
      　　「……等等。」
      　　
      　　光已經一溜煙地跑到門邊。
      　　
      　　「那個是我的！」
      　　
      　　吶喊出聲卻已經來不及了，因為回過頭的光，嘴裡正咬著僅剩一點點的塔皮。
      　　
      　　「──光！」
      　　
      　　古·拉哈·提亞連尾巴都氣得在身後甩來甩去。
      　　
      　　「我明明就分好一人一半！」
      　　
      　　「聞起來太香了，一半不夠吃。」
      　　
      　　「那我怎麼辦！」
      　　
      　　當時恰巧路過的桑克瑞德，只能把手中的蘋果放到古·拉哈·提亞空空的托盤上，一邊安撫地拍了拍他垂下的肩膀。
      　　
      　　但有句話說得好，人的忍耐終究是有限度的，就算那個人是古·拉哈·提亞也一樣。
      　　
      　　又是一個平靜的午後。
      　　
      　　那天古·拉哈·提亞忙了一整個上午，好不容易整理完一份厚厚的調查紀錄，正準備拿去交給雅·修朵拉。
      　　
      　　閒來無事的光從旁邊經過，藍眼輕輕一瞥他抱在懷裡的文件。
      　　
      　　只一個眼神，古·拉哈·提亞渾身的毛都豎了起來，立刻抱緊資料。
      　　
      　　「不行。」
      　　
      　　光看似無辜地眨了眨眼。
      　　
      　　「我什麼都沒做。」
      　　
      　　「你那個表情就是想做什麼。」
      　　
      　　古·拉哈·提亞警戒地往後退，一臉不信任。
      　　
      　　「真的不行。」古·拉哈·提亞再次強調，「為了這些資料，我整晚幾乎都沒睡。」
      　　
      　　聞言，光只得垂下手，看似乖巧地點了點頭。
      　　
      　　「好吧。」
      　　
      　　古·拉哈·提亞狐疑地盯著他，直到光轉過身，他才鬆了口氣。
      　　
      　　不料才剛鬆懈下來，對方就以迅雷不及掩耳的速度回過頭，伸手一拉他緊緊抱在懷裡的紙張──
      　　
      　　啪。
      　　
      　　由於雙方都出了力氣，整疊紙張散了一地。
      　　
      　　努力了整整一日的分類、排序、做過標記的資料，像被一陣突如其來的風捲過，沿著地板與桌子下方，滑得到處都是。
      　　
      　　空氣突然靜了下來。
      　　
      　　古·拉哈·提亞怔怔地望著散落一地的白紙，頭垂得極低。
      　　
      　　光也愣了愣，但還來不及說句話，一聲清晰的水聲便傳了過來。
      　　
      　　啪嗒。
      　　
      　　一滴眼淚落在散亂的紙頁上，暈開一小片深色的水痕。

      　　古·拉哈·提亞沒有出聲，只是站在原地，肩膀微微垂著，然後又一滴淚沿著臉頰滑下來，墜落在地。

      　　啪嗒。

      　　他像是這時才察覺自己哭了，抬起手，用袖口安靜地擦過眼角，可才剛擦乾，新的淚水便又無聲地湧出來，一顆一顆掛過睫毛，再順著臉頰往下掉。

      　　啪嗒、啪嗒。

      　　古·拉哈·提亞抿緊嘴唇，低著頭，一次又一次擦著眼淚，卻怎麼也擦不完。那雙耳朵早已低低垂下，連尾巴都沒了平日的精神，只無力地落在身後。

      　　「……這些……」

      　　他的聲音很小，帶著壓不住的哽咽。

      　　「我整理了一整個晚上……」

      　　說完，他又抬手抹了一下臉，像是不想讓任何人看見似的，可眼淚還是接連不斷地落下來。

      　　啪嗒。
      　　
      　　光渾身僵住，阿莉塞立即轉頭瞪向他。
      　　
      　　「你惹哭拉哈了。」
      　　
      　　阿爾菲諾也跟著皺起眉。
      　　
      　　「你惹哭他了……」
      　　
      　　連尤里安傑都嘆了口氣。
      　　
      　　「竟害他哭了。」
      　　
      　　接連三句落下，光像是直到這時才真正意識到事情的嚴重性。
      　　
      　　他看看滿地散亂的紙張，又看看低頭不停擦著眼淚的古·拉哈·提亞，整個人難得顯得有些手足無措。

      　　「我……」

      　　才剛開口，一條手臂已經從後方勾了上來。
      　　
      　　「玩過頭了你。」
      　　
      　　桑克瑞德一把架住光的肩膀，毫不客氣地將人往後拖了半步。
      　　
      　　艾斯蒂尼安也板著臉走了過來。
      　　
      　　他低頭看了一眼還在掉眼淚的古·拉哈·提亞，又看向被桑克瑞德架住的光。
      　　
      　　「我幫你教訓他。」
      　　
      　　語畢，艾斯蒂尼安也伸手抓住光的另一邊手臂。
      　　
      　　兩個人一左一右，當真就準備把堂堂光之戰士拖出去。

      　　然而這番動靜似乎完全沒有傳進古·拉哈·提亞耳中。

      　　他仍舊安安靜靜地站在原處，垂著眼睛，一手慢慢擦過濕潤的臉頰。
      　　
      　　「……」
      　　
      　　艾斯蒂尼安與桑克瑞德面面相覷，隨後同時瞪著光。
      　　
      　　石之家迴盪在尷尬的氣氛中。

      　　半晌，古·拉哈·提亞才終於抬起眼，那雙眼睛濕漉漉的，眼尾泛著紅，臉上卻沒有多少怒氣，甚至平靜得有些過了頭。
      　　
      　　他看著慌亂的光，靜靜開口。

      　　「大笨蛋。」
      　
      　　光挨了罵，卻難得不敢回嘴。
      　　
      　　「為什麼每次……都這麼欺負我……」

      　　古·拉哈·提亞吸了吸鼻子，聲音仍然低低的。
      　
      　　「你這種人……我最討──」
      　　
      　　啪。
      　　
      　　一聲清脆的闔書聲突然響起。

      　　所有人同時一僵。

      　　雅·修朵拉闔上手中的書，臉上帶著極為溫和的笑容。

      　　「好了。」
      　
      　　桑克瑞德幾乎在她開口的同一瞬間鬆開了光。

      　　下一秒，他已經無比自然地往旁邊退了兩步，躲到了尤里安傑身後。
      　　
      　　雅·修朵拉沒有理會桑克瑞德，只是走到光的身邊，面露微笑看著他。
      　　
      　　「現在，你知道要做什麼了嗎？」
      　　
      　　光沉默片刻。
      　　
      　　「……道歉。」

      　　「很好。」
      　
      　　雅·修朵拉抬手，穩穩按住光的後腦勺，一雙眼睛直直地看著光。
      　　
      　　「對不起。」
      　　
      　　古·拉哈·提亞沒有回應。
      　
      　　光維持著低頭的姿勢等了一會兒，只能又喚了他的名字。

      　　「拉哈。」

      　　但還是沒反應。
      　　
      　　光慢慢直起身，看了古·拉哈·提亞片刻，接著小心翼翼地往前挪了一步，然後伸出手，很輕地拉了拉古·拉哈·提亞的衣角。
      　　
      　　「我陪你整理。」
      　　
      　　光低聲說道。
      　　
      　　「雖然順序我不知道，但你可以告訴我。」
      　　
      　　「你說放哪裡，我就放哪裡。」
      　　
      　　「整理完，我做好吃的給你賠罪。」
      　　
      　　古·拉哈·提亞依舊垂著頭，連看都不看他。
      　　
      　　拉著衣角的手不免有些急了，光又往前挪了幾步，低聲囁嚅著。
      　　
      　　「……但是，不要討厭我。」
      　　
      　　聞言，古·拉哈·提亞終於慢吞吞地抬起臉，眼眶還紅著，睫毛也是濕的，眼淚滾過的臉頰甚至還泛著水光。

      　　他盯著光看了好一會兒，像是在考慮這個人究竟值不值得原諒。
      　　
      　　光露出可憐兮兮的表情看著他，連姿勢都比平常老實了許多。
      　　
      　　阿莉塞在一旁環抱雙手，嘖嘖稱奇。
      　　
      　　「……原來他真的會怕。」
      　　
      　　桑克瑞德壓低聲音。
      　　
      　　「看來我們知道大英雄的弱點了。」
      　　
      　　光像是聽見了，抬起頭，狠狠地瞪著他們。
      　　
      　　兩人立刻同時移開視線，裝作什麼都沒說。
