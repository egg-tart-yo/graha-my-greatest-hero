  - title: 主篇
    body: |-
      　　今晚的夜色沉得很深。
      　　
      　　荒野裡沒有城鎮的燈火，只有遠處起伏的山影，以及三人面前那一小簇燃得正旺的營火，乾柴不時發出細碎的爆裂聲，火星隨著夜風飄起，又很快消失在黑暗裡。
      　　
      　　艾斯蒂尼安坐在一塊平坦的石頭上，手肘隨意搭著膝，阿爾菲諾望著火光，悠遠的眼神透露出幾分懷念。
      　　
      　　「像這樣坐在野外，好像回到我們在伊修加爾德旅行的時候。」
      　　
      　　某些難忘的回憶，在相似的夜裡總會自行浮現。
      　　
      　　寒冷的風雪、漫長的旅行、龍詩戰爭，還有坐在他們身邊的這名冒險者。
      　　
      　　光撥了撥火堆裡的木柴，讓快要暗下去的火焰重新亮起。
      　　
      　　「是有點像。」他笑了笑，「只不過那時候比現在冷多了。」
      　　
      　　阿爾菲諾也笑出聲。
      　　
      　　「至少今晚不必擔心半夜被積雪掩埋。」
      　　
      　　「也不用聽某人一路板著臉催我們趕路。」
      　　
      　　艾斯蒂尼安瞥了光一眼。
      　　
      　　「我若不催，你們現在大概還被莫古力玩得團團轉。」
      　　
      　　笑聲迴盪在火光間。
      　　
      　　片刻後，光忽然看向艾斯蒂尼安。
      　　
      　　「不過，你也確實很久沒有回來了。」
      　　
      　　他的語氣平靜，艾斯蒂尼安卻莫名從那句話裡聽出了一點責怪。
      　　
      　　「我又不是拂曉的人，沒有時常向你們報到的必要。」
      　　
      　　「話是這麼說。」光低下頭，用靴尖輕輕碰了碰腳邊的碎石，「但偶爾回來看看也不錯，至少別讓艾默里克總是找不到你。」
      　　
      　　艾斯蒂尼安不免想起自己前一次返回石之家時的情景。
      　　
      　　他剛踏進門，古·拉哈·提亞便遠遠看見了他。那雙鮮紅的眼睛瞬間亮起，像看見了什麼只存在於傳說中的人物，接著便帶著一股毫不掩飾的敬佩迎上前來。
      　　
      　　那眼神實在太過直接，讓人無從招架。
      　　
      　　古·拉哈·提亞先是提起龍詩戰爭，又提起他在蒼天龍騎士時期的事蹟，語氣比本人還要激昂，甚至連一些艾斯蒂尼安自己都忘記的細節都記得清清楚楚。
      　　
      　　他不是討厭那名青年，只是無法理解，為何有人能把崇拜表現得如此坦然。
      　　
      　　想到這裡，艾斯蒂尼安下意識抬起手，試圖透過揮動來遺忘尷尬的記憶。
      　　
      　　「還是免了，我不擅長應付那個。」
      　　
      　　「哪個？」阿爾菲諾偏了偏頭。
      　　
      　　艾斯蒂尼安沒有回答，只是看向光。
      　　
      　　「管好你家的貓。」
      　　
      　　阿爾菲諾忍著笑，輕咳了一聲，顯然不用明說都知曉他在講誰。
      　　
      　　「他對你的敬仰，的確相當直率。」
      　　
      　　「那已經不是直率的程度了。」
      　　
      　　艾斯蒂尼安蹙起了眉，低聲抱怨。
      　　
      　　光原本也在笑，可不知為何，那笑意很快便淡了下去，他望著火焰，眼睫微微垂著。跳動的火光落在他的側臉上，將神情映得忽明忽暗。
      　　
      　　艾斯蒂尼安注意到了那點變化，卻沒有出聲。
      　　
      　　「其實，」光說，「我一直覺得，英雄這種東西，很像陪伴孩子長大的故事。」
      　　
      　　阿爾菲諾看向他，光藍色的眼睛仍望著火堆。
      　　
      　　「孩子小的時候，會相信故事裡的人永遠不會失敗，只要英雄出現，所有事情就一定能得到解決。」
      　　
      　　他停頓了一下，像是在斟酌接下來的話。
      　　
      　　「但等到他們長大，就會知道，英雄終究只是故事裡的角色。」
      　　
      　　「你是在說古·拉哈？」艾斯蒂尼安問。
      　　
      　　「他看著我的時候，總像是在看某個了不起的人。」
      　　
      　　光沒有否認，他笑了一下，那笑容卻沒有多少喜悅。
      　　
      　　「可我不是。」
      　　
      　　艾斯蒂尼安皺了皺眉。
      　　
      　　光像是沒察覺，只是平靜地繼續說下去。
      　　
      　　「我只是一個普通的冒險者，剛好去了某些地方，遇見某些人，又剛好被捲進一些與世界有關的事。」
      　　
      　　「你所歷經的一切，並不是這麼普通的事情。」阿爾菲諾忍不住說。
      　　
      　　光笑著搖頭。
      　　
      　　「但人們需要一個可以傳唱的故事，需要一個能夠相信的路標才能向前邁進，所以他們把那些事整理好，替我加上英雄的名字。」
      　　
      　　他的聲音很輕，幾乎與柴火燃燒的聲音混在一起。
      　　
      　　「拉哈也是聽著那樣的故事走到今天的。」
      　　
      　　艾斯蒂尼安看著他。
      　　
      　　他曾以為，像光這樣的人早就習慣了旁人的期待。
      　　
      　　無論走到哪裡，都有人認得他；無論遭遇什麼難題，眾人總會自然而然地看向他，彷彿只要他還站著，就沒有任何事真正到得了絕境。
      　　
      　　可此刻坐在火邊的人，卻比任何人都清醒。
      　　
      　　他從未真正相信那些落在自己身上的稱呼。
      　　
      　　「我不認為自己會一直是他的英雄。」光說。
      　　
      　　阿爾菲諾的神情微微一變。
      　　
      　　「總有一天，他的世界會出現其他人，也許比我更強，比我更適合被寫進新的故事裡。」
      　　
      　　光伸出手，手掌在火焰上轉了轉。
      　　
      　　「到那時候，他就會發現，我其實沒有那麼重要。」
      　　
      　　營火爆出一聲脆響，一點火星落在地面，很快便熄滅了。
      　　
      　　阿爾菲諾沉默許久，才低聲開口。
      　　
      　　「我覺得，這樣的想法太孤單了。」
      　　
      　　「會嗎？」
      　　
      　　「是的。」阿爾菲諾認真地說：「或許英雄確實是故事裡的角色，可實際和我們一起旅行的你，早就不是普通的英雄了。」
      　　
      　　艾斯蒂尼安沒有插話。
      　　
      　　他很少參與這類談論感情的話題。與其費心揣摩，不如直接拔槍解決眼前的敵人。
      　　
      　　可此刻的他也贊同阿爾菲諾的說法。
      　　
      　　光卻像是沒有聽進去，他望著掌心，好半晌後才笑了笑。
      　　
      　　「我倒不覺得孤單。」
      　　
      　　「為什麼？」
      　　
      　　「因為拉哈早就是英雄了。」
      　　
      　　阿爾菲諾怔住，就連艾斯蒂尼安也挑了挑眉。
      　　
      　　光抬起頭，看向營火之外的遠方，語氣逐漸柔和下來。
      　　
      　　「無論是對第一世界的人們，還是對於我，他做過的事，早就足以被寫成故事了……只是他自己從來沒有意識到。」
      　　
      　　光垂下眼，嘴角浮現出一點極淡的笑意。
      　　
      　　「他總是看著別人的背影，所以才沒發現，自己也早就成了會讓人追隨的那一個。」
      　　
      　　阿爾菲諾沒有立刻回答。
      　　
      　　他注視著光，神情裡帶著某種複雜的溫柔，最後只輕輕嘆了一口氣。
      　　
      　　「這些話，如果你親口對他說，我想他會很高興的。」
      　　
      　　光沒有回答，只是拿起一旁的木柴，重新丟進火裡，火焰猛地竄高，短暫照亮了他的臉。
      　　
      　　艾斯蒂尼安看見他眼底那一閃而過的遲疑。
      　　
      　　或許光並不是不在意古·拉哈·提亞如何看待自己，而是恰恰相反，才總想著有朝一日應該從對方的故事裡退場。
      　　
      　　英雄可以被取代，傳說可以被新的冒險覆蓋。
      　　
      　　只要一開始便將自己放在那樣的位置上，那麼真正分別的時候，或許就不會顯得太過殘忍。
      　　
      　　實在過於糾結了。
      　　
      　　艾斯蒂尼安在心裡評價道，滿臉寫著不贊同。
      　　
      　　因為他所歷經的一切都能證明，真正放不下的東西，從來不會因為刻意遠離而消失。
      　　
      　　三人趕在夜深之前熄了營火，踏上返回石之家的路，等他們抵達時，門前仍亮著燈。
      　　
      　　塔塔露抱著手臂站在門邊，腳一下下地點著地面。古·拉哈·提亞則站在她身旁，一聽見腳步聲便立刻抬起頭來。
      　　
      　　「你們回來了！」
      　　
      　　他的目光先掃過阿爾菲諾與艾斯蒂尼安，確認兩人平安無事後，便自然而然地落在光身上。
      　　
      　　亮得過分。
      　　
      　　艾斯蒂尼安在心中嘖了一聲。
      　　
      　　「都這麼晚了，至少也該傳個消息回來呀！」塔塔露走上前，語氣雖是責備，眼裡更多的卻是放心，「古·拉哈從剛才開始就在門口來回走，害得我也沒辦法安心休息。」
      　　
      　　「塔塔露！」
      　　
      　　古·拉哈·提亞慌忙出聲阻止，耳尖一下便紅了。
      　　
      　　光轉頭看向他，什麼也沒說，只是走到古·拉哈·提亞面前，抬起手，輕輕摸了摸他的頭。
      　　
      　　「在路上休息耽誤了點時間，讓你擔心了。」
      　　
      　　光收回手，語氣平靜。
      　　
      　　「早點休息。」
      　　
      　　說完，他便越過幾人，逕自朝屋內走去。
      　　
      　　阿爾菲諾看看光離去的背影，又看了看仍站在原地的古·拉哈·提亞，像是想起了營火旁的談話，神情頓時有些微妙。
      　　
      　　塔塔露也眨了眨眼。
      　　
      　　只有艾斯蒂尼安站在一旁，將一切看得清楚。
      　　
      　　古·拉哈·提亞慢慢抬起手，覆上剛才被光摸過的地方。
      　　
      　　他的指尖先是輕輕碰了碰自己的髮絲，隨後一點一點收緊掌心，彷彿握著什麼並不存在的東西。
      　　
      　　緊接著，他低下紅透的頭。
      　　
      　　艾斯蒂尼安沉默地看了他一會兒，接著又看向早已消失在走廊盡頭的光，蹙起了眉頭。
      　　
      　　他並不擅長梳理那些彎彎繞繞的東西，但至少眼前的這名貓魅賢人看向自己的眼神，明顯與望著光的眼神不同。
      　　
      　　這哪裡只是單純的憧憬。
      　　
      　　他的夥伴，恐怕根本沒弄明白，自己究竟被怎樣放在了心上。
  - title: 番外
    body: |-
      　　深夜，石之家裡卻仍亮著幾盞燈，眾人圍繞著的桌面攤開著一張北薩納蘭的地圖，數枚棋子標記出帝國殘黨可能藏匿的位置。
      　　
      　　雅·修朵拉站在桌邊，指尖沿著其中一條山路緩緩滑過，最後停在一處狹窄的峽谷。
      　　
      　　「對方在這裡設置了魔導裝置。」她說，「數量不多，但周圍的乙太流動十分混亂，恐怕還藏著其他機關。」
      　　
      　　「我先去看看。」
      　　
      　　光站在桌子的另一頭，語氣平靜得像是在談論明日的天氣。
      　　
      　　阿莉塞立刻抬起頭。
      　　
      　　「你一個人？那可是敵人大本營！」
      　　
      　　「人多反而容易被發現。」光伸手取走代表自己的棋子，放到峽谷入口，「我先確認情況，若真的有問題，再傳消息回來。」
      　　
      　　「等你傳消息回來，事情通常都已經被你解決一半了。」
      　　
      　　阿莉塞的語氣有些衝，光卻只是溫和地笑了笑。
      　　
      　　古·拉哈·提亞站在稍遠的位置，手裡還握著尚未整理完的報告，他沒有像往常那樣立刻提出同行，只是安靜地望著地圖。
      　　
      　　桑克瑞德靠在牆邊，靜靜地觀察著沉默的貓魅。
      　　
      　　良久，古·拉哈·提亞終於開口。
      　　
      　　「既然如此，明日便由英雄先行探查吧。」
      　　
      　　阿莉塞猛地轉頭看他，光似乎也有些意外。
      　　
      　　古·拉哈·提亞卻只是將報告放到桌上，眼神專注地凝視著地圖。
      　　
      　　「那一帶地形狹窄，單獨行動確實更不容易驚動敵人。」他指向峽谷西側，「不過若魔導裝置突然啟動，或者是引發爆炸一類的機關，原路返回未必安全，峽谷還可能有崩塌的危險。」
      　　
      　　他將另一枚棋子放在西側山道。
      　　
      　　「我會事先設置轉移用的術式。若有需要，你只要破壞攜帶的水晶，術式便會立刻將你帶離峽谷。」
      　　
      　　光看著那枚棋子，沒有說話。
      　　
      　　「只是保險。」古·拉哈·提亞補充道，「不會妨礙你的行動。」
      　　
      　　蔚藍的眼睛靜靜地凝視著堅定的紅眼，片刻後，光點了點頭。
      　　
      　　「好。」
      　　
      　　會議結束時，已經接近午夜。
      　　
      　　光將地圖收好，與眾人道過晚安後便先行離開，木門在他身後闔上，室內安靜了短短一瞬。
      　　
      　　阿莉塞立刻轉向古·拉哈·提亞。
      　　
      　　「你居然真的讓他一個人去？」
      　　
      　　「我若反對，他只會半夜偷偷出發。」
      　　
      　　古·拉哈·提亞無奈地笑了笑。
      　　
      　　「所以你打算只設一個逃生術式？」桑克瑞德問。
      　　
      　　「不只。」
      　　
      　　雅·修朵拉挑了挑眉，注視著突然彎下腰的貓魅賢人。
      　　
      　　古·拉哈·提亞從報告底下抽出另一張地圖，上面密密麻麻標記了數條路線，甚至連附近魔物可能活動的區域都被圈了出來。
      　　
      　　「尤里安傑已經確認過明日的天象。正午前後，峽谷內的風向會改變，適合從南面潛入。雅·修朵拉先前提供的乙太觀測紀錄也很詳盡，已經足夠用來推算裝置啟動的位置。」
      　　
      　　他指向地圖外圍。
      　　
      　　「桑克瑞德熟悉帝國軍的偵察方式，可以提前清除外圍的暗哨。阿莉塞若願意，能在北側待命，截斷他們的退路。」
      　　
      　　「而你呢？」阿莉塞問。
      　　
      　　古·拉哈·提亞的手指離開了地圖。
      　　
      　　「我會留在這裡維持術式。」
      　　
      　　「也就是說，」雅·修朵拉淡淡地說，「表面上是讓他獨自探查，實際上卻將他可能遇見的危險全都拆開，分到我們每個人手上。」
      　　
      　　古·拉哈·提亞沒有否認。
      　　
      　　「就算被留下來，我也會做所有我能做的事。」
      　　
      　　他的聲音帶著果決與堅定。
      　　
      　　室內重新安靜下來。
      　　
      　　尤里安傑站在燭火照不到的角落，聞言微微垂下眼。
      　　
      　　「既已知曉他的心思，仍願如此守候嗎？」
      　　
      　　古·拉哈·提亞握著地圖邊緣的手，幾不可察地收緊了一下。
      　　
      　　他一直都知道，光總會在自己靠近的同時，溫柔而謹慎地退後半步。
      　　
      　　因為光總認為，自己所憧憬的對象，不過是世人傳唱、歷史遺留下來的英雄，而並非他眼前的這個人。
      　　
      　　曾數次接觸過死亡的人，對於離別所做的準備，超乎常人想像得多。
      　　
      　　「在過去的百年旅程間，我曾經奢望過很多事。」
      　　
      　　古·拉哈·提亞垂著眼，慢慢放開手。
      　　
      　　「但真正回到他身邊後，反而覺得現在已經很好了。」
      　　
      　　阿莉塞皺起眉，「哪裡好了？」
      　　
      　　「能看見他平安回來，能在他需要時幫上一點忙。」古·拉哈·提亞低頭看著地圖中央那枚代表光的棋子，輕輕勾起微笑，「一點點就足夠了。」
      　　
      　　阿莉塞像是想說些什麼，卻被雅·修朵拉抬手攔住。
      　　
      　　「既然如此，便照你的安排吧。」她微微一笑，「不過，他沒有發現，不代表你能一直瞞過去。」
      　　
      　　古·拉哈·提亞怔了怔。
      　　
      　　「英雄或許不會對旁人的心意做出反應，但那個人並不遲鈍。」
      　　
      　　她意味深長地看了他一眼。
      　　
      　　「至少，沒有你以為的那麼遲鈍。」
      　　
      　　翌日清晨，光獨自離開了石之家。
      　　
      　　出發前，古·拉哈·提亞將一枚水晶交到他手裡，水晶只有拇指大小，表面流轉著微弱的紅色光芒。
      　　
      　　「只要捏碎就好。」古·拉哈·提亞說，「無論發生什麼，術式都會將你帶回來。」
      　　
      　　光低頭看著掌心。
      　　
      　　「無論何時？」
      　　
      　　「在維持術式的當下都有效。」
      　　
      　　話一出口，古·拉哈·提亞才察覺自己回答得太快。
      　　
      　　光抬起眼，與他對視片刻，古·拉哈·提亞有些不自在地移開目光。
      　　
      　　「我的意思是……在你回來之前，我會留在這裡。」
      　　
      　　光沒再追問，只是安靜地將水晶收入胸前的皮袋。
      　　
      　　「我知道了。」
      　　
      　　他轉身離開，很快便消失在清晨尚未散去的薄霧裡。
      　　
      　　任務進行得比預想順利。
      　　
      　　光進入峽谷前，桑克瑞德已經處理掉藏在岩壁上的哨兵；魔導裝置啟動時，雅·修朵拉事先計算的乙太節點恰好暴露出核心；逃往北側的帝國兵，則被等候已久的阿莉塞攔了下來。
      　　
      　　光仍舊一個人踏進了最危險的核心地帶。
      　　
      　　直到日暮，設置在石之家內的術式都沒有被觸發。
      　　
      　　古·拉哈·提亞握著法杖，站在法陣中央，始終注視著懸浮在半空的水晶。
      　　
      　　阿莉塞回來時，身上沾了不少塵土。她推門看見古·拉哈仍維持著早晨的姿勢，臉色當即沉了下來。
      　　
      　　「你連水都沒喝？」
      　　
      　　「我不渴。」
      　　
      　　「少騙人。」
      　　
      　　她將水壺重重放到他面前，古·拉哈·提亞只好伸手接過。
      　　
      　　「其他人呢？」
      　　
      　　「桑克瑞德在後面，雅·修朵拉還在排查有沒有遺漏。」阿莉塞頓了頓，「沒有發現敵方援軍，光那邊應該也結束了。」
      　　
      　　「應該？」
      　　
      　　古·拉哈·提亞立刻抬起頭。
      　　
      　　「你別露出那種表情。」阿莉塞沒好氣地說，「他好得很，只是堅持要繞去確認附近村落的狀況。」
      　　
      　　聞言，他的肩膀才微微鬆了下來。
      　　
      　　阿莉塞在他對面坐下，盯著他看了半晌。
      　　
      　　「你究竟打算這樣到什麼時候？」
      　　
      　　古·拉哈·提亞眨眨眼，一臉不明白。
      　　
      　　「什麼？」
      　　
      　　「明明擔心得要命，卻連跟他一起去都不敢說。」
      　　
      　　「……這不是敢不敢的問題。」
      　　
      　　「就是。」
      　　
      　　阿莉塞的語氣毫不客氣。
      　　
      　　「你怕只要再靠近一點，他就會退得更遠，所以乾脆在他看不到的地方，替他把所有事情都處理好。和以前在第一世界一樣，總遠遠地望著他的背影。」
      　　
      　　古·拉哈·提亞沉默下來。
      　　
      　　「這樣他怎麼可能知道？」
      　　
      　　「不知道也沒有關係。」
      　　
      　　「怎麼可能沒關係！」
      　　
      　　阿莉塞猛地站起身，似乎真的生起了氣，眼底卻又帶著一點難以掩飾的難過。
      　　
      　　「你總覺得只要不說出口，就不會讓他為難，但這、這不是……你可是好不容易才來到這裡的！」
      　　
      　　古·拉哈·提亞張了張口，最後仍沒有出聲。
      　　
      　　就在這時，門外傳來熟悉的腳步聲。
      　　
      　　阿莉塞的神情微微一變。
      　　
      　　古·拉哈·提亞幾乎立刻站起來，甚至沒有注意到膝上的水壺滾落到了地面。
      　　
      　　木門被人從外推開，光站在門口，披風沾著沙塵，臉上也帶著幾分疲憊。看見兩人時，他的腳步短暫地停了一下。
      　　
      　　「我回來了。」
      　　
      　　古·拉哈·提亞迅速地掃了一眼，確認沒有明顯的外傷，呼吸也很平穩後，緊繃了整日的胸口才終於緩慢放鬆。
      　　
      　　「歡迎回來。」他的聲音有些啞。
      　　
      　　光走進屋內，從懷裡取出那枚水晶，水晶仍舊完整，紅色的光芒安靜流轉。
      　　
      　　「沒有用上。」
      　　
      　　古·拉哈·提亞伸手想將它接回，光卻沒有立刻鬆開，兩人的指尖隔著水晶短暫地碰在一起。
      　　
      　　他慌忙想收手，光卻先一步握住了他的手腕，輕輕施力、將他拉了過去。
      　　
      　　英雄直視古·拉哈·提亞有些慌亂的眼睛，緩慢說道。
      　　
      　　「峽谷外的哨兵，不知怎地都被放倒了。」
      　　
      　　古·拉哈·提亞的身體細微地震了下。
      　　
      　　「北側有人攔住了逃兵，乙太核心的位置也和雅·修朵拉標記的完全一樣。」
      　　
      　　光俯下身，在他耳邊低語，平靜的嗓音讓人一時間無法辨識出他的情緒。
      　　
      　　「你所謂的保險，似乎比我想像中多了一點。」
      　　
      　　古·拉哈·提亞一時無法回答。
      　　
      　　光鬆開他的手腕，可下一刻，又將那枚水晶重新放進自己的皮袋。
      　　
      　　「這個我先收著，以防下次用得上。」
      　　
      　　古·拉哈·提亞怔怔地看著他，忽然覺得胸口湧上一股難以言明的情緒。
      　　
      　　這是否意味著，光默許了他以這樣的方式陪伴在身邊？
      　　
      　　光收回目光，轉身準備離開，經過阿莉塞身旁時，忽然停下腳步。
      　　
      　　「阿莉塞。」
      　　
      　　「做、做什麼？」
      　　
      　　「下次躲在岩石後面的時候，記得把紅色的衣角收好。」
      　　
      　　阿莉塞整張臉頓時漲紅，喊道：「你早就看見了？！」
      　　
      　　光輕輕笑了一聲，沒有回答，逕自朝走廊另一端走去。
      　　
      　　阿莉塞惱怒地瞪著他的背影。
      　　
      　　古·拉哈·提亞仍站在原地。
      　　
      　　直到那道身影消失在走廊盡頭，他才慢慢垂下眼，看向自己方才被握住的手腕。
      　　
      　　那裡仍殘留著鮮明的熱度。
      　　
      　　他閉上眼，試圖像過去無數次那樣，將翻湧的情緒重新壓回心底。
      　　
      　　在第一世界的百年間，他早已學會等待，學會隔著漫長的歲月守望一個人，學會將所有無法說出口的話藏進沉默裡。
      　　
      　　可如今，他重新站到了那個人的身邊。
      　　
      　　而自己年輕衝動的靈魂，正強烈地盼望著──
      　　
      　　能再靠近那憧憬的身影一點。
