title: 追趕
cp:
  - 桑克瑞德 & 光
  - 歡樂/甜文向
updated: 2026-11-13
summary: 4版後再點開，CP左右不分
chapters:
  - body: |-
      　　劍與槍刃在空中猛地相撞，激起的強勁氣流以兩人為中心向外擴散，震得細沙飛濺，連空氣都嗡嗡作響。順勢向後一躍的光垂低劍尖，前端在沙地上劃出一道長痕，重整姿態的英雄很快地抬起武器，冷光一閃、再次欺身而上。

      　　他的攻勢激烈而張揚，帶著與個性相同的直率，每一次揮砍的力道卻毫不馬虎。破空而至的劍以刁鑽的角度逼得桑克瑞德架槍格擋，單純的力氣比拚卻並未持續多久，算準對方視線死角的光直接扭轉手腕，刀劍蠻橫無禮地狠狠刮過槍身，在兩者分開的瞬間以極快的速度向上一抬。

      　　桑克瑞德的視野中，只來得及看見一閃而過的白光，他憑藉著本能反應向後仰身、避開朝胸口橫掃而出的劍尖。

      　　相較於光逼人的銳氣，桑克瑞德顯得遊刃有餘得多。

      　　扛在肩上的槍刃並不隨著英雄每次的進攻起舞，大多時候藉由單純的側身或步伐移轉便能輕盈躲開。即使犀利的劍氣已經擦過幾縷銀白髮絲，他依然不慌不忙地將刀鋒貼著長劍，借力使力地將攻擊引至身側。

      　　趁著光攻擊落空、重心側斜的瞬間，他用槍刃的刀背輕輕在對方手腕上一敲，隨即又靈巧地退開半步，穩穩接住光緊接著反手撩起的劍鋒。

      　　幾番過招下來，光敏銳地察覺到了不對勁。每一次以為自己的攻勢已經逼近破綻，桑克瑞德卻總能用游刃有餘地將劍氣化開，卻也不趁勝追擊，就這麼不疾不徐地見招拆招。過於鬆弛的戰鬥節奏讓他不滿地蹙眉，率先垂下了劍尖。

      　　光的語氣裡帶著幾分不服氣，「喂，桑克瑞德！好不容易有機會切磋，倒是使出全力啊！」

      　　跟著止住攻擊的桑克瑞德將槍刃重新扛上肩膀，嘴角勾起帶著幾分戲謔的笑容。他挑了挑眉，審視的目光落在英雄身上，慢條斯理地反問：「你自己不也一樣有所保留嗎？」

      　　光怔了怔，原本理直氣壯的氣勢瞬間弱了許多。

      　　他不自然地偏過頭，眼神飄向一旁的沙地，含糊地咕噥了一句：「……你前陣子出任務受傷的肩膀，不是還沒完全好嗎。」

      　　桑克瑞德眼底的笑意更深了些。

      　　他當然知道，從交手的第一刻起他就察覺到了。

      　　雖然只是戰技的切磋，但光若是真的想贏，憑他那身千錘百鍊的本事與直覺，大可以專挑自己因為傷勢未癒、使不上勁的左側進攻。光是利用身位造成的視線死角，就能讓自己疲於應付。但看似橫衝直撞的英雄，卻從頭到尾都規規矩矩地正面進攻，硬是把一場理論上應該動用武技與智力判斷的實戰演練，打成了光明正大的劍術比試，還一邊笨拙又直白地替對手維護弱點。

      　　桑克瑞德輕笑一聲，語氣裡帶著幾分無奈，卻又隱隱透著難以察覺的縱容。

      　　「太小看我的話，可是讓人有點困擾喔。」

      　　話音剛落，周圍的氣氛驟然一變。

      　　上一秒還輕鬆隨興的男人彷彿在瞬間融進了風中，腳步輕輕錯開、整個人就這麼憑空隱去了氣息。

      　　光的神經在一瞬間繃緊到了極致。

      　　經歷無數場戰鬥的他比誰都清楚，實戰中對手散發出的殺氣、細微的喘息或腳步動靜、甚至是沸騰的鬥志，都是用來預判攻勢的關鍵信號——那種能讓人本能感到寒毛直豎的氣息，往往比眼睛看到的還要真實，卻也能更迅速作出反應。

      　　然而此刻，空氣中卻安靜得可怕。

      　　潛行狀態的桑克瑞德，不僅將氣場與動靜抹得乾乾淨淨，身上更沒有半分殺氣。毫無敵意、也沒有逼人的壓迫感，甚至連切磋常有的好勝心都不存在。在沉靜得連風都不曾浮動的空白裡，光只有捕捉到一絲細微、幾乎無法用言語形容的氣息——既放鬆又溫暖、彷彿利姆薩·羅敏薩午後的微風般，讓人根本生不出半點戒心。

      　　那是什麼？為什麼在戰鬥中會出現這種感覺？

      　　就在光感到困惑的瞬間，開始流動的風輕輕拂過耳畔。下一秒，冰涼的金屬觸感極為輕柔地貼上了光的脖頸。

      　　「輸了喔。」

      　　桑克瑞德的聲音在耳邊響起，帶著幾分得逞後的笑意，溫熱的呼吸若有似無地掃過光的耳廓。他收起槍刃，一邊無奈地搖了搖頭，「怎麼突然走神了？在戰鬥中分心可是大忌。」

      　　光回過神來，卻一點也沒有輸掉比試的氣餒，反而眨了眨眼、一臉坦然地轉過頭看著他，「我剛才是在想……桑克瑞德你在戰鬥的時候，為什麼對我都不會有殺氣，也沒有那種很激昂的情緒？」

      　　過於直白的問句毫無掩飾，單純是出自於好奇。

      　　桑克瑞德愣了愣，隨即無奈地笑道：「同伴之間的單純比試而已，為什麼要有殺氣？」

      　　「因為感覺，你並不想贏嘛。」光的眼睛直勾勾地望著他，帶點埋怨的眼神卻單純得像是毫無雜質的清泉，「我可是費了好大的勁，才勉強變得跟你一樣可靠……每次對練你都這樣有所保留，我怎麼知道自己到底有沒有追上你啊！」

      　　桑克瑞德的喉結滾動，想說出口的話全數被堵在了嘴邊。

      　　他避開那道過於直白的視線，順手從旁撈來一條乾淨的布巾，隨意地往光頭上一拋，蓋住了那頭被汗水浸溼的髮絲。接著他伸出手，隔著布巾在對方頭頂不輕不重地揉了幾下。

      　　「與其胡思亂想，不如趕快把汗擦乾。」

      　　桑克瑞德一邊念叨著，手掌順勢往下滑，隔著布巾按壓著對方的側臉。光順從地任由他擺佈，被布巾遮住半張臉的模樣顯得有些滑稽，可就在布巾滑落些許的瞬間，桑克瑞德的動作卻再次停住。

      　　縫隙間，那雙藍得驚人的眼睛又再次露了出來，毫無防備的眼底是最純粹的信任與依賴。

      　　而曾用同樣眼神這樣注視過自己的人，他根本無法守護——

      　　「桑克瑞德？」

      　　光困惑的呼喚讓男人忽然驚醒。

      　　他渾身一震、極不自然地撇開視線，收回了還停留在對方臉頰邊的手。向前傾身的光卻拉住他的衣袍，不高興地指責：「只顧著我，你自己的汗也沒擦啊！感冒了怎麼辦！」

      　　看著光拿著另一條布巾，一臉認真地想往自己臉上湊，桑克瑞德眼底的陰影被這股直率的暖意衝散了幾分。他無奈地輕笑，抬手按住對方的肩膀，順勢將那隻拿著布巾的手輕巧地推了回去，趁著光還沒反應過來，便從容地往後退出一段距離。

      　　「好好好，我知道了，回去就洗把臉。」他重新背起槍刃，在肩上輕敲兩下，轉身朝著訓練場的出口邁開步伐，背影很快融進了走廊的微光裡，「剛才敲到的手腕，記得回去找尤里安傑看一下。」

      　　「看不起誰啊！我才沒有這麼脆弱！」

      　　直到拐過轉角、徹底脫離了光的視線與叫喊，桑克瑞德臉上那副輕鬆的笑容才緩緩滑落。他靠在冰冷的石牆邊，重重地吐出一口氣，低頭看了一眼方才還貼在對方臉頰上的掌心。

      　　真是拿那傢伙沒辦法。

      　　明明早已是獨當一面的英雄，卻還在為是否能追上自己這點小事而煩惱。

      　　但究竟是誰在追趕誰呢？

      　　當那道背影一次次義無反顧地奔向險境、甚至獨自扛起整個世界的重量時，緊隨在後、踏步而起的自己，究竟在無意間向他託付了多少信任，又曾多少次被那雙毫無陰霾的藍眼給拯救？

      　　男人直起身子，離開了牆邊的陰影，朝著陽光灑落的長廊大步走去。
