      　　難得平靜的幕間，拂曉眾人接下了一份簡單的委託──護送商隊穿過一段常有野獸出沒的林地。
      　　
      　　任務本身並無難度，倒像是一場久違的郊遊。一行人走得極為放鬆，甚至連平時習慣在高處警戒的艾斯蒂尼安，都只是鬆垮垮地扛著長槍，落在隊伍最後方，聽著阿爾菲諾與阿莉塞為了某種罕見草藥的藥效爭論不休。

      　　光與古·拉哈·提亞則並肩走在商隊領頭者的身側。

      　　「這次真的太感謝你們了，英雄大人！」

      　　商隊老闆是個熱情爽朗的拉拉菲爾族，留著一把油亮的大鬍子。他擦了擦額頭的汗，沿路打量著身旁這對形影不離的青年。

      　　貓魅的雙眼總是亮晶晶的，抱著一本隨身筆記，時不時因為路邊奇異的景色或植披而拉扯身旁人的衣角，難掩興奮地分享自己的發現，而揹著大劍的英雄也總是自然而然地配合他的腳步慢下來，耐心地湊過去看，一邊專注聽著貓魅小聲的分享。

      　　老闆摸了摸鬍子，越看越覺得氣氛好極了，忍不住露出了過來人那種心領神會的慈祥笑容。

      　　「果然，兩位特別合拍阿。」他豪邁地哈哈大笑，豪不避諱地用手肘輕輕推了推光的手臂，「老夫走南闖北這麼多年，這點眼力還是有的──這位紅頭髮的小哥，想來就是英雄傳聞中的伴侶吧？果然再怎麼危險的道路，有心愛的人相伴都能勇往直前啊！」

      　　被如此稱呼的古·拉哈·提亞整個人猛地一僵，滾燙的溫度從被輕輕一撞的胸口迅速向上蔓延，脹紅的臉頰燒得熟透，連脖頸的賢人紋身都浸染在可疑的緋紅中。

      　　「等、等等等等一下！！老、老闆！您誤會了！這、這可不能隨便亂說啊！」

      　　古·拉哈·提亞的雙手在胸前胡亂揮舞，連筆記本掉落都顧不上，只急於吞吞吐吐地解釋。他慌亂地在原地轉了半圈，隨後一把抓住身邊光的衣袖，整個人湊上前去，仰著那張紅透了的臉，拼命朝光遞眼色。

      　　「光！你、你快跟老闆解釋啊！我只是……我只是個普通的同行者、同伴……不對，是憧憬你的冒險者……總之不是那種關係！要是傳出奇怪的流言，造成什麼麻煩……！」

      　　紅髮貓魅焦急地抓著他的臂甲，兩耳緊繃地壓在髮間。

      　　然而，光只是垂著眼眸看著他。

      　　英雄本來確實是打算開口的，但放下視線的瞬間，他正好看見了古·拉哈·提亞那雙因為激動而瞪得渾圓的眼睛──慌亂的眼神裡，竟藏著一絲僅有熟悉之人才看得出來的，喜悅的情緒。

      　　光又將視線從貓魅的眼底移開，轉而觀察起那條蓬鬆卻緊繃、以極小幅度劇烈搖晃、簡直快螺旋升天的，古·拉哈·提亞的尾巴。

      　　矛盾的模樣瞬間勾起光內心深處惡作劇的心思。

      　　最後，英雄不僅沒有開口否認，反而微微歪了歪頭，嘴角勾起了一抹極其溫柔、甚至帶著幾分默認意味的淺笑，朝商隊老闆點了點頭。

      　　「光……？你、你怎麼不說話？」

      　　看著光那張毫無反駁意圖、反而滿是縱容寵溺的笑臉，古·拉哈·提亞的腦子嗡嗡作響，瞬間一片空白。

      　　「……光？」

      　　他抓著光衣袖的指尖漸漸失去了力氣，逐漸滑落在身側，同一時間，即將過載的腦袋正高速地運轉著毫無根據的推測。

      　　光沒有否認？為什麼不否認？他為什麼笑得這麼好看？為什麼不跟老闆解釋？傳聞中的伴侶，是多久以前的傳聞？傳了多遠？難不成光早就聽過那些傳聞？難道……難道在光的心裡……

      　　毫不嚴謹的推論最終得出驚世駭俗的結論。
      　　
      　　貓魅的腦中像是引發了只屬於古·拉哈·提亞的小型靈災，豎起的兩耳瞬間冒出了蒸氣。他腳步虛浮地在原地打轉，彷彿踩著棉花糖般的碎步，在商隊老闆呵呵笑著的視線與拂曉眾人狐疑的注視下，頭上甚至出現一個個夢幻又映射透亮虹彩的泡泡。

      　　「騙……騙人的吧……伴……伴侶……？光的……」

      　　不再清明的紅眼此刻只剩下兩圈恍惚的漩渦。

      　　眼睜睜看著貓魅賢人的理智原地蒸發，後方看不下去的阿莉塞三步併兩步地衝上前，壓低嗓音罵到：「光！你沒事對他笑得那麼曖昧幹什麼！」

      　　「我只是覺得他開心的樣子挺好的。」光一臉無辜地聳了聳肩，富含笑意的目光卻一刻也沒從那隻熟得膨起的貓魅身上移開。

      　　「拉哈！拉哈！不要忘記呼吸！」阿爾菲諾險些撞到貓魅周圍的粉色泡泡，擠上前的他急忙在古·拉哈·提亞毫無焦距的眼前晃動手掌。

      　　商隊老闆摸著鬍子，忍不住驚嘆道：「哎呀……雖然早就聽說貓魅族性格熱情，但這激動得整個人都在發光的樣子，老夫這輩子還是第一次見到呢！」

      　　「老闆，請您別再火上澆油了。」桑克瑞德按著隱隱作痛的太陽穴，深深嘆了一口氣。

      　　「看這樣子……我想接下來的護送任務就交給我們，英雄先帶古·拉哈回去吧。」

      　　尤里安傑的溫聲建議獲得眾人一致贊同，雅·修朵拉甚至揚起玩味的笑容，「我想你應該有很多事情需要解釋喔，受歡迎的大英雄。」

      　　同伴的好意，光也欣然接受──除了某位經過他身邊偷踢了自己一腳的龍騎，附帶沒好氣地輕哼，「自己惹出來的麻煩，自己收拾。」

      　　「當然。」

      　　光笑了笑，動作溫柔地將身旁早就分不清楚東西南北、喉間甚至開始發出呼嚕聲的貓魅攬肩一抱，隨後抬頭看向石化的眾人，眼底盛滿了藏不住的得逞笑容。

      　　「那就在這分別吧。我的『伴侶』走不動了，任務就拜託你們了。」

      　　「你這分明是故意的吧！」

      　　商隊老闆困惑的目光與桑克瑞德的怒吼並未沖淡光唇角的笑意，相互依偎的兩人轉身邁開腳步。搭在肩頭的手在寬鬆衣料的遮掩下自然地滑落，順著手臂一路向下，最終穩穩收攏，握住了那隻依舊滾燙的掌心。
      　　
      　　牽著他的手，一如過往般牽引著前進的方向。
