      　　經過一番尋找，古·拉哈·提亞總算在湖邊發現那抹熟悉的背影。
      　　
      　　光的手隨意搭在膝頭，任由夜風將額前的碎髮吹得凌亂。月色勾勒出他沉默的側臉，微微抿著的唇隨著力道有些發白，整個人透著一股平日裡罕見的鬱悶與沉重。
      　　
      　　緩步向前的古·拉哈·提亞踩過枯枝，張了張嘴，那聲習慣性的呼喚在喉嚨裡醞釀了半天，最終還是沒能喊出口。
      　　
      　　他知道光為什麼會坐在這裡。
      　　
      　　白天討伐盜賊的委託發生了一場措手不及的意外，年久失修的木吊橋在激烈的衝擊下極近斷裂。混亂中，一名被逼至崖邊的年輕村民腳下一空，差點和踏板與碎石一同掉落至下方的峽谷中；而同一時間，另一側和敵人纏鬥的古·拉哈·提亞，也隨著斷裂的橋板滑向懸崖邊緣。
      　　
      　　兩邊的距離相隔太遠，那一瞬間，光只能救一個人，而就在電光火石之間，古·拉哈·提亞在英雄的眼底看見了從未有過的慌亂與動搖。
      　　
      　　光的腳步下意識朝向他轉了過去，伸出的手掌死死對著他的方向──那幾乎是出於本能地想要先奔向他。
      　　
      　　好在古·拉哈·提亞在最後一刻憑著敏捷的身手扣住岩壁、自己翻了上來。而光也在此刻硬生生收住衝向他的腳步，轉而奔向村民緊緊巴著吊橋邊緣的手。
      　　
      　　最終，所有人都平安無事。
      　　
      　　村民對著光千恩萬謝，重新團聚的欣喜與劫後餘生的慶幸化作歡騰的淚水。可只有古·拉哈·提亞知道，從那一刻起，光眼底的光芒就暗了下去。
      　　
      　　那是身為「英雄」的人，對自己那一瞬間不可原諒的動搖所產生的自我審判。
      　　
      　　「……怎麼不過來？」
      　　
      　　幽幽的嗓音打斷了古·拉哈·提亞的思緒。
      　　
      　　得到同意的他邁步走上前去，在光身旁的岩石上輕輕坐了下來。兩人並著肩，湖面上的波光映在他們身上，緩緩流轉著。
      　　
      　　光沉默了良久，終於再次開口。
      　　
      　　「白天……」
      　　
      　　他的聲音被夜風吹得有些發散，帶著極少流露的沮喪與黑暗，「如果那時候你沒能脫困……我真的會先救你。」
      　　
      　　古·拉哈·提亞轉過頭望著身旁的人。
      　　
      　　他以為隨意垂在膝上的手，實則死死扣緊了自己的膝蓋，指節也跟著泛白。
      　　
      　　「在你看向我的那一瞬間，我腦子裡什麼英雄的責任、什麼民眾的安危……全都消失得乾乾淨淨。」
      　　
      　　光垂下眼睫，眼底是一片濃得化不開的自我厭惡。
      　　
      　　「我只看見你快要掉下去，然後什麼都顧不得……我是真的打算拋下那個村民不管的。」
      　　
      　　光轉過頭，迎上那雙在月下澄澈透亮的紅色眼眸，聲音帶著不易察覺的微顫與自嘲。
      　　
      　　「這樣……你會不會責怪我？一個在關鍵時刻會拋棄別人、滿心私慾的人……這樣的傢伙，根本算不上你心目中的英雄吧。」
      　　
      　　古·拉哈·提亞靜靜地看著他。
      　　
      　　那雙平日裡總是坦率、溫暖的紅色眼眸緩緩垂了下來，沒有震驚、沒有失望，只有溢滿眼底的心疼。
      　　
      　　「……英雄果然是個太過溫柔的人啊。」古·拉哈·提亞輕輕嘆了一口氣，聲音柔得像湖面上的微風，「居然會為這種事苛責自己。」
      　　
      　　光怔了怔，「……會嗎？」
      　　
      　　「生命是平等的，可是落在人的心底，重量本來就因人而異。」古·拉哈·提亞抬起頭，目光認真得近乎虔誠，「面對無法兩全的抉擇時會動搖、會想要保護對自己最重要的人，這再正常不過了。那是人心的本能，不是什麼需要被審判的罪過。」
      　　
      　　他挪動了一下身子，悄悄拉近了兩人的距離。
      　　
      　　「正因為『心』才會使人們強大……才能讓人跨過痛苦、義無反顧。」
      　　
      　　古·拉哈·提亞側過身，輕輕將自己的額頭和臉頰靠上了光的肩膀，身後的長尾巴也無聲地探了過來，搭上了光的手背，安撫地輕輕拍動著。
      　　
      　　「而且啊……」古·拉哈·提亞彎起眼睛，聲音悶在光的肩頭，帶著一點純粹的笑意，「只要英雄有把自己的性命，認真地放在那些偉大宏願的前面……對我來說，其他的都無所謂。」
      　　
      　　他收緊了挨著光的肩膀，語氣無比篤定：「不管發生什麼事，不管你做出了什麼樣的選擇──你在我心裡，永遠都是那個無可替代的大英雄。」
      　　
      　　緊繃了整整一天的心臟，在這一瞬間彷彿被一雙柔軟的手輕輕托住。
      　　
      　　光長長地吐出一口濁氣，緊扣著膝蓋的手指慢慢放鬆下來，最後無奈又好笑地搖了搖頭。
      　　
      　　「……你就是每次都說這種話，才把人拐走的。」
      　　
      　　「我可是發自內心的。」
      　　
      　　光轉過身，反手握住了早已纏上手腕的貓尾。
      　　
      　　古·拉哈·提亞的貓耳肉眼可見地紅了起來，卻沒有掙開，他仰頭望向光認真的藍眼，不解地偏了偏頭。
      　　
      　　「那你可得照顧好自己。」光垂下頭，將額前貼上古·拉哈·提亞的胸膛，「那個英雄現在最重視的東西，就在這裡。」
      　　
      　　古·拉哈·提亞伸長雙臂，環住光的後腰，紅眼滿足地彎了起來。
      　　
      　　「嗯，放心交給我吧。」
