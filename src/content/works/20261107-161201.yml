  - body: |-
      　　魔物的震耳咆哮，夾雜著令人屏息的威壓。
      　　
      　　光握著武器的手微微收緊，看著四人眼前這頭體型堪比山丘、外皮硬得像堅石的古代獅獸，眼角微微抽搐。
      　　
      　　這根本不是委託書上寫的「稍微棘手的凶暴異形」，分明是某個遠古遺蹟裡爬出來的毀滅級怪物。
      　　
      　　身經百戰的他們早已輕鬆判斷出實力差距。
      　　
      　　「這可不在報酬的預算範圍內啊。」
      　　
      　　桑克瑞德果斷地輕笑，甚至連出手試探的意思都沒有，「先撤退吧！」
      　　
      　　舉著長槍的艾斯蒂尼安面色平淡地點點頭，顯然持有同樣看法。
      　　
      　　光只覺得身側刮過一陣微風。
      　　
      　　不過須臾，桑克瑞德已經徹底隱蔽氣息，眨眼間消失在所有人的視線裡。
      　　
      　　「你──」閃這麼快？
      　　
      　　光急急偏頭，正想招呼另一位龍騎士一同撤退，卻只見銀髮精靈輕輕一蹲、然後發力一跳，整個人化作一道銀藍色的流光，直衝洞窟頂端的岩縫。
      　　
      　　艾斯蒂尼安高高躍起，身影成為遠方的一抹流星，乾脆俐落地溜了。
      　　
      　　「……也跳太高了吧你！身上真的沒偷藏龍眼嗎！！！」
      　　
      　　光忍不住破口大罵，回音與魔獸的鳴叫聲共同震盪著洞穴。
      　　
      　　然而，另一邊的古·拉哈·提亞完全無暇顧及光的崩潰。頂著治療職能的貓魅正嚴肅地緊握法杖，目光緊盯著魔獸緩慢沉重的踏步，全神貫注地計算著對方的攻擊軌跡，試圖尋找一個最合適、最安全的撤退時機。
      　　
      　　「那個距離的話……如果我留下來用爆炸干擾視線，或許能……」
      　　
      　　被「可靠的隊友」接連拋下的英雄，聽見古·拉哈·提亞還在低聲喃喃自語，腦內的理智線瞬間斷裂。
      　　
      　　他大步衝上前，盯著那隻連逃跑都打算以身殿後的綠職傻貓，長臂一伸，直接將毫無防備的貓魅攔腰抱起，乾脆俐落地往自己肩上一扛，拔腿就往反方向狂奔。
      　　
      　　「哇啊啊啊？！光？！」
      　　
      　　突如其來的失重感讓古·拉哈·提亞嚇得驚呼，長長的尾巴下意識筆直豎起以維持平衡。但他整個人被頭朝後扛著，視野正好對上那頭暴怒追來的魔獸，只得硬生生把尖叫吞回喉嚨，慌亂地充當起貓肉後照鏡。
      　　
      　　「光！左邊！往左邊跑！牠的攻擊從右邊來了！」
      　　
      　　「你的左邊還是我的左邊──啊啊啊真是的！那兩個混蛋！！」
      　　
      　　「回、回去再說！前面那條路應該能通往洞穴外側！」
      　　
      　　奔跑的顛簸讓兩人的對話變得斷斷續續，光一邊狂奔一邊頂著狂風大喊：「你能不能先不要一直晃尾巴！？」
      　　
      　　「我、我沒有！」
      　　
      　　「尾巴都快抽到我臉上了！」
      　　
      　　貓魅漲紅了臉，試圖在一片混亂中用意志力壓抑住驚慌失措的尾巴，但兩人逃命的路途實在太過顛簸。魔物發出的怒吼震得洞窟內石頭紛紛砸落，光只能在間隙中艱難地跳來跳去，單手抱住貓魅大腿後側的同時，另一隻手被迫拋棄武器，轉而緊緊固定住他的腰。
      　　
      　　隨著一次避開落石的跳躍，古·拉哈·提亞整個人一滑，毛茸茸的尾巴下意識地收緊，順勢牢牢纏上了光緊繃的手臂。
      　　
      　　「對、對不起！我馬上解開──」
      　　
      　　「先別說這個！抓穩！」光咬緊牙關，右腳猛然踏上岩壁，在洞口即將崩塌的前一刻，縱身躍出了昏暗的迷宮。
      　　
      　　外頭陽光明媚。
      　　
      　　先一步優雅脫身的兩名同伴正氣定神閒地站在樹蔭下，桑克瑞德甚至已經好整以暇地環抱著雙手，而艾斯蒂尼安正抱著長槍靠在巨木旁，朝氣喘吁吁地兩人點了點頭。
      　　
      　　重見天日的古·拉哈·提亞這才驚覺自己還被扛在光肩上，尾巴甚至還像藤蔓一樣纏著對方的胳膊。他的頭上冒出了蒸氣，手忙腳亂地拍了拍光的後背，微弱地囁嚅著：「光……那個，可以放我下來了……」
      　　
      　　英雄沒好氣地蹲下身，轉過頭時，那雙藍眼裡正燃燒著熊熊烈火，直勾勾地瞪著眼前的兩名損友。
      　　
      　　桑克瑞德迎著光殺人的視線，無辜地聳了聳肩。
      　　
      　　「放輕鬆，以你們兩個的身手，脫身根本不是問題吧？再說了……」他朝貓魅抬了抬下巴，調侃道，「拉哈不是能用傳送術嗎？」
      　　
      　　光猛地一愣，下意識回過頭。
      　　
      　　兩隻毛茸茸的貓耳早已心虛地完全壓扁在髮間，眼神飄忽不定，拚命盯著頭頂的樹冠，彷彿上面的樹葉長得格外引人入勝。
      　　
      　　……這隻貓剛剛被扛著跑了一整路，居然完全不提醒他。
      　　
      　　光張了張嘴，正準備發作，一旁沉默許久的艾斯蒂尼安卻突然若有所思地開了口。
      　　
      　　「原來如此。」
      　　
      　　光一口氣卡在胸口，沒好氣地橫了他一眼，「……原來如此什麼？」
      　　
      　　艾斯蒂尼安認真地端詳著兩人，語氣平靜得像是在討論今天的天氣，「下次我也站著不動好了。」
      　　
      　　「你敢試試看。」光咬牙切齒。
      　　
      　　「看來待遇不一樣啊。」龍騎士冷不防補了一刀。
      　　
      　　「你──」
      　　
      　　旁邊的古·拉哈·提亞臉色已經一路從臉頰紅到了耳尖，他看了看憋著一股氣無處發作的英雄，小心翼翼地踏了一步，語氣微弱地解釋：「確、確實是有傳送術沒錯……不過剛剛實在太危險了，我中途才想起來。而且……」
      　　
      　　光眉頭一挑，用即將噴火的眼神盯著他，「而且怎麼樣？」
      　　
      　　貓耳又垂下去了幾分。但他猶豫了一下，還是鼓起勇氣抬起頭。
      　　
      　　「就是覺得……被你這樣扛著跑，其實挺新鮮的。」貓魅微微鼓起腮幫子，聲音雖然輕，眼神卻逐漸變得堅定，「要是以後還有機會的話──」
      　　
      　　他把手裡的法杖往背後一收，朝光伸出雙臂，那雙明亮的眼眸裡滿是不加掩飾的期盼與渴望，直勾勾地望著他的英雄。
      　　
      　　吹了吹口哨的桑克瑞德露出戲謔的笑容，望著原地石化的英雄與伸手討扛、渾身發光的貓魅。唯獨艾斯蒂尼安抱著長槍，眉頭微微皺起，臉上的不解反而更深了幾分。
      　　
      　　「被舉高逃命有這麼好玩嗎？」
      　　
      　　精靈認真地發問，只可惜沒人能回答他。
