      　　晨起，光忽然發現古·拉哈·提亞身上多了一股好聞的味道，不刺鼻也不濃烈，只是從身邊經過時，會留下一點淡淡的、乾淨的氣味，像是曬過太陽的布料，又混著一點他說不上來的花香。
      　　
      　　一開始他還以為是偶然，直到幾天後，光看見古·拉哈·提亞坐在自己房內，正低著頭，非常認真地用專用的護理劑，梳理自己的尾巴。
      　　
      　　那股好聞的氣味，便是從那罐小玻璃瓶裡傳出來的。
      　　
      　　光抱著手臂，靠在門邊看了半天，忍不住出聲。
      　　
      　　「拉哈。」
      　　
      　　「嗯？」
      　　
      　　古·拉哈·提亞抬起頭，手上還拿著梳子。
      　　
      　　「你最近是不是怪怪的？」
      　　
      　　那雙赤紅的眼睛眨了眨。
      　　
      　　「我？怎麼突然這麼說？」
      　　
      　　「不然怎麼一直在整理尾巴。」光若有所思地盯著他，「以前也沒看你這麼勤快。」
      　　
      　　古·拉哈·提亞的耳朵瞬間立了起來。
      　　
      　　只可惜光完全沒注意到。
      　　
      　　他只是走進房裡，還伸手偷摸了一下那條剛被梳得蓬鬆漂亮的尾巴。
      　　
      　　古·拉哈·提亞的耳尖悄悄紅了些，臉可疑地偏向一邊，避開他的目光。
      　　
      　　「……只是覺得，偶爾也該好好整理一下。」
      　　
      　　「哦──」
      　　
      　　光拖長了聲音，古·拉哈·提亞莫名有些坐立難安。
      　　
      　　「怎、怎麼了？」
      　　
      　　光看他紅通通的臉，忽然笑出聲。
      　　
      　　「該不會遇到喜歡的貓魅族了吧？」
      　　
      　　聞言，古·拉哈·提亞臉上的神情瞬間變得僵硬。
      　　
      　　毫無察覺的光卻越想越覺得合理。
      　　
      　　「我聽說你們越是這種時候越在乎自己的毛髮……快跟我說說，是在哪遇見的？什麼時候？怎麼沒介紹給大家認識？」
      　　
      　　古·拉哈·提亞一聲不吭，頭默默地低了下來。
      　　
      　　見他這個反應，光徹底誤會成完全錯誤的方向。
      　　
      　　「該不會……還是單戀？」
      　　
      　　這話一出，原本立著的貓耳慢慢垂了下去，古·拉哈·提亞靜靜地看了光一眼，又收回視線。
      　　
      　　那副眼神完全不是被發現秘密的害羞，反而像是有什麼東西被人毫不知情地踩了一腳，疼得厲害，偏偏踩人的那位還渾然不知。
      　　
      　　光這時才發現，氣氛好像有哪裡不太對。
      　　
      　　他試探性地伸出手，古·拉哈·提亞卻將尾巴收了回去。
      　　
      　　「拉哈？」
      　　
      　　那雙垂著的紅眼很勉強地望著光，就連聲音都有些悶悶的。
      　　
      　　「……大概吧，至少現在看來是這樣。」
      　　
      　　古·拉哈·提亞靜靜地回了一句，隨後默默地站起身，從光旁邊走了出去。
      　　
      　　「至於能不能等到那個人回頭看我……就不知道了。」
      　　
      　　「……」
      　　
      　　光困惑地搔了搔頭，回頭看著他離開的背影，完全沒明白隨口的玩笑怎麼讓他反應這麼奇怪。
      　　
      　　結果半刻鐘後，試圖尋求幫助的光開始遭受整個拂曉的圍剿。
      　　
      　　「你是笨蛋嗎？」
      　　
      　　阿莉塞第一個開罵。
      　　
      　　當事人坐在桌邊，一臉的茫然。
      　　
      　　「啊？」
      　　
      　　「不，這已經不是普通程度的遲鈍了。」
      　　
      　　雅·修朵拉慢悠悠地喝了一口茶。
      　　
      　　「某方面而言，甚至令人佩服。」
      　　
      　　「等一下，我做錯什麼了？」
      　　
      　　「你還問！」
      　　
      　　阿莉塞差點把桌子拍裂。
      　　
      　　桑克瑞德站在旁邊，雙手抱胸，看光的眼神像是在看某種無可救藥的生物。
      　　
      　　「我原本以為，有些事情就算再遲鈍，至少也該有個限度。」
      　　
      　　「到底什麼事情？你們可不可以說明白一點？」
      　　
      　　就連艾斯蒂尼安都皺眉。
      　　
      　　「……蠢啊。」
      　　
      　　「唯獨不想被你這樣說！」
      　　
      　　光覺得自己非常委屈。
      　　
      　　他不就是問了一句拉哈是不是有喜歡的貓魅嗎？
      　　
      　　好吧，可能玩笑開得過分了些……仔細想想，他的眼神的確有些受傷。
      　　
      　　光摸了摸鼻子。雖然他完全搞不懂為什麼，但既然讓對方難過了，自己好歹得負起責任。
      　　
      　　「……知道了啦。」
      　　
      　　光站起來，眾人一臉警戒地看他，彷彿害怕光把事情弄得更糟。
      　　
      　　「你要去哪？」
      　　
      　　「道歉啊。」
      　　
      　　「你知道自己錯哪了？」
      　　
      　　「不知道。」
      　　
      　　「你……」
      　　
      　　「可是拉哈生氣了嘛。」
      　　
      　　光說得理所當然。
      　　
      　　「既然我惹他生氣，怎麼樣都得先道歉。至於為什麼……問本人不是最快嗎？」
      　　
      　　阿莉塞張了張嘴，一時間居然說不出話，只能用手掌用力地拍了拍自己的額頭。
      　　
      　　而光已經轉身走了。
      　　
      　　桑克瑞德沉默半晌，忍不住感嘆。
      　　
      　　「這傢伙到底是聰明還是笨？」
      　　
      　　雅·修朵拉輕笑了一聲。
      　　
      　　「大概得看是哪一方面吧。」
      　　
      　　
      　　*
      　　
      　　
      　　光尋了尋，發現古·拉哈·提亞果然躲在房裡。
      　　
      　　他敲了敲緊閉的門，發現裡頭絲毫沒有回應的意思，沒經多少思考便很自然地喚著。
      　　
      　　「拉哈？我進來囉。」
      　　
      　　「等等──」
      　　
      　　古·拉哈·提亞才剛出聲，門就被推開了。
      　　
      　　他坐在床沿，尾巴沒精神地垂在一邊，看到光進來，耳朵立刻往後壓了壓。
      　　
      　　「……你怎麼來了？」
      　　
      　　「來道歉。」
      　　
      　　過於乾脆的意圖，反而讓古·拉哈·提亞愣了一下。
      　　
      　　光徑直走到他面前，一雙藍眼坦誠地看著他。
      　　
      　　「剛才是我不好，玩笑好像開得太過頭了。」
      　　
      　　「……嗯。」
      　　
      　　「所以對不起。」
      　　
      　　古·拉哈·提亞低著頭，尾巴尖輕輕晃了一下。
      　　
      　　看起來還是沒完全消氣。
      　　
      　　光在他身邊站了一會兒，突然開始感到尷尬。
      　　
      　　他完全不知道下一步該怎麼辦。
      　　
      　　平常古·拉哈·提亞很好哄──這麼說好像也不太對，應該說，他根本很少真的生光的氣。
      　　
      　　這種狀況自兩人相遇以來，還是頭一遭。
      　　
      　　困惑的光乾脆蹲下來，從下往上看古·拉哈·提亞。
      　　
      　　「可是……」
      　　
      　　古·拉哈·提亞靜靜地望著他。
      　　
      　　「我還是不懂啊。」
      　　
      　　「……什麼意思？」
      　　
      　　「你最近本來就變很多嘛。身上香香的，又每天保養尾巴。」光非常誠實，「我就想說，你一定是有什麼理由。」
      　　
      　　古·拉哈·提亞很緩慢地眨了眨眼。
      　　
      　　「如果不是因為有喜歡的人，那是為什麼？」
      　　
      　　蓬鬆的尾巴動了動，古·拉哈·提亞的耳朵慢慢紅起來。
      　　
      　　「……因為你。」
      　　
      　　光愣住。
      　　
      　　「啊？」
      　　
      　　「我說，」古·拉哈·提亞咬了咬牙，臉也開始泛紅，「都是因為你。」
      　　
      　　「我？」
      　　
      　　光指著自己，滿臉不可置信。
      　　
      　　「為什麼是我？」
      　　
      　　古·拉哈·提亞很深很深地吸了口氣，看似想說些什麼，但最後一刻還是忍住了。
      　　
      　　他的臉上揚起一絲無奈，但儘管如此，聲音還是維持一貫的平和。
      　　
      　　「你前陣子……不是養了一隻貓小胖嗎？」
      　　
      　　光偏了偏頭，腦海裡突然想起那隻渾圓肥美的寵物。
      　　
      　　「你說那隻胖貓？」
      　　
      　　古·拉哈·提亞點了點頭。
      　　
      　　「有一次你跟桑克瑞德他們聊天……說到牠有沒有尾巴。」
      　　
      　　光眨了眨眼，努力在回憶裡翻找著。
      　　
      　　好像有這件事。
      　　
      　　但他那時候說了什麼來著？
      　　
      　　「你說，」古·拉哈·提亞的聲音越來越小，「你很喜歡貓咪長尾巴摸起來的感覺。」
      　　
      　　聞言，光的腦袋空白了一瞬。
      　　
      　　古·拉哈·提亞的聲音像是點亮了他的記憶，那天的對話突然非常清晰地回來了。
      　　
      　　那天他確實抱著貓小胖，左右旋轉著端詳，最後遺憾地感嘆了一句──
      　　
      　　如果尾巴再長一點就好了，長尾巴的貓摸起來手感多好。
      　　
      　　尤其毛梳得順順的，從尾巴根一路摸到尖端，毛髮從指縫間慢慢順過的感覺，特別感到舒服。
      　　
      　　當時的他就是這麼隨口一說。
      　　
      　　然後──
      　　
      　　光的視線緩緩往下，落在古·拉哈·提亞那條最近保養得蓬鬆柔順的長尾巴上。
      　　
      　　古·拉哈·提亞瞬間側過身，把尾巴往身後藏。
      　　
      　　「……」
      　　
      　　房裡陷入一片死寂，兩人就這麼尷尬地對視著。
      　　
      　　光的臉開始慢慢燒了起來。
      　　
      　　終於搞懂情形的他彷彿心口被真相撞了一下，光突然不太敢直視古·拉哈·提亞的眼睛，視線左右游移著，完全不曉得該往哪擺。
      　　
      　　他覺得他必須要冷靜一下，對，現在就去。
      　　
      　　「我、我突然想到還有事──」
      　　
      　　光猛地站起來，轉身拉開房門，卻發現門外居然站著兩個人。
      　　
      　　桑克瑞德跟艾斯蒂尼安一左一右地卡在門邊，帶著意味深長的笑注視著滿臉通紅的光。
      　　
      　　「你們幹嘛？」
      　　
      　　光的腦內警鈴大作，笑得十分和善的桑克瑞德卻直接越過他，與一臉驚訝的古·拉哈·提亞說話。
      　　
      　　「如何？這傢伙聽懂了嗎？」
      　　
      　　聞言，貓魅怔了怔，隨即很快地反應過來。
      　　
      　　他雙手抱住弓起的腳，靜靜地搖了搖頭。
      　　
      　　「那你原諒他了嗎？」
      　　
      　　紅色的腦袋又搖了搖，耳朵垂了下來。
      　　
      　　桑克瑞德收回視線，平靜地宣布。
      　　
      　　「就是這麼一回事。」
      　　
      　　「到底在說什麼啊！放我出去！」
      　　
      　　光的抗議被無情地忽略，兩人一左一右架住他，毫不客氣地將他扔回房間，隨後甚至碰地一聲關上門，還很好心地上了鎖。
      　　
      　　光難以置信地撲到門前，門外卻只傳來桑克瑞德悠哉又逐漸遠去的聲音。
      　　
      　　「慢慢聊啊。」
      　　
      　　「……」
      　　
      　　身後傳來一聲很輕的笑。

      　　光僵硬地轉過身，發現古·拉哈·提亞已經從床邊站起來，正一步一步朝他走近。
      　　
      　　他下意識吞了口口水，喉結跟著滾動了一下。隨著古·拉哈·提亞靠近，眼前的光線也被他的身影一點點遮去。
      　　
      　　古·拉哈·提亞卻沒有做什麼逾矩的事。

      　　他只是走到光面前，稍稍低下頭，將額角輕輕靠上那僵硬得不像話的肩膀，像是拿這個人沒辦法似的，無聲嘆了口氣。

      　　而那條光曾經親口說過喜歡的長尾，就這麼輕輕垂落，搭在他的手邊。
      　
      　　「所以……英雄……」

      　　古·拉哈·提亞停了一下，尾尖不安似地輕輕捲起，聲音也跟著低了下去。
      　
      　　「我都已經站到你面前了。」
      　
      　　他抬起眼，紅色的瞳孔安靜地望著光。
      　
      　　「你現在願意回頭看看我了嗎？」
