      　　晚間，阿莉塞抱著一疊資料走過迴廊時，遠遠便看見那名賢人的房門前聚著幾個人。
      　　
      　　桑克瑞德半蹲在門邊，側著臉，把耳朵貼在門板上，阿爾菲諾站在他後方，神情看似無奈，身體卻十分誠實地微微前傾，就連塔塔露也踮起腳，試圖從兩人中間擠出一個位置。
      　　
      　　雅·修朵拉則抱著手臂站在一旁，看似並未參與，卻也在旁靜靜地聽著。
      　　
      　　阿莉塞停下腳步，「你們在做什麼？」
      　　
      　　幾個人同時回頭。
      　　
      　　桑克瑞德立刻朝她揮了揮手，壓低聲音道：「噓，小聲一點。」
      　　
      　　阿莉塞狐疑地看著他，隨即走了過去，塔塔露立刻讓出一小塊位置，熱情地朝她招手。
      　　
      　　阿莉塞盯著眾人看了一圈，最後還是彎下腰，把耳朵貼到了門板上。
      　　
      　　房裡傳來細碎的翻找聲，抽屜被拉開又關上，還有瓶罐碰撞與紙張被翻動的沙沙聲。
      　　
      　　過了一會兒，古·拉哈·提亞自言自語的聲音清楚地傳了出來。
      　　
      　　「備用藥水……兩瓶應該夠了。不、還是三瓶吧。若是在途中遇上意外……」
      　　
      　　短暫的停頓後，又傳來一陣金屬碰撞聲。
      　　
      　　「劍跟盾牌……還是帶法杖好？」
      　　
      　　門外幾人安靜地對視了一眼。
      　　
      　　阿莉塞皺起眉，突然想起貓魅賢人明日似乎要與他們的英雄外出一趟，但──
      　　
      　　「這麼慎重，他們明天到底要去哪裡？」
      　　
      　　阿爾菲諾壓低聲音回答：「聽說是個尋物的委託。」
      　　
      　　而房裡的古·拉哈·提亞顯然毫無所覺。
      　　
      　　「乾麵包帶兩份……不，若是臨時想繞路，多花上一天也不是沒有可能，還是四份吧。」
      　　
      　　阿爾菲諾的嘴角已經忍不住上揚，塔塔露摀住嘴，眼睛也彎了起來。
      　　
      　　「這可是期待得有些過頭了。」
      　　
      　　「這不是很好嗎？」桑克瑞德低聲笑道，「難得有人邀他出去，當然得好好準備。」
      　　
      　　雅·修朵拉淡淡地看了他一眼。
      　　
      　　「你說得像是我們平日把他關在房裡，不許他出門一樣。」
      　　
      　　「我可沒有這個意思。」
      　　
      　　「這可是他期待已久的冒險呢。」
      　　
      　　門外的低聲討論，並未打斷屋內專心思考的貓魅。
      　　
      　　「明日的天氣應該很穩定，但午後山區可能起霧，若沿東側小徑前進，視野會受影響……」
      　　
      　　隨即是紙張被迅速翻動的聲音。
      　　
      　　阿莉塞聽了一會兒，終於忍不住了。
      　　
      　　「他該不會連路線都全部查過了吧？」
      　　
      　　「看起來是。」阿爾菲諾輕聲說，「我方才聽見他在確認附近魔物的分布。」
      　　
      　　塔塔露小聲補充：「還有休息地點、天氣變化和沿途可以補充物資的地方。」
      　　
      　　阿莉塞蹙起眉，轉頭看向她的夥伴。
      　　
      　　「你們到底在這裡聽多久了？」
      　　
      　　眾人眨眨眼，一齊朝她露齒微笑。
      　　
      　　「從他打包開始，沒有很久啦。」
      　　
      　　這時，房裡突然安靜了一會兒，害怕被發現的一群人急忙朝彼此比了噓的手勢，隨後不約而同地，再度將耳朵貼上門板。
      　　
      　　阿莉塞看著這群人，覺得額角正微微抽動。她乾脆地舉起手，用力敲了敲門。
      　　
      　　屋內頓時沒了聲音，反而是為了偷聽而將身體彎成奇怪姿勢的眾人，急急忙忙地整理自己的衣著。
      　　
      　　過了好一會兒，門被打開了。
      　　
      　　古·拉哈·提亞站在門後，神情從容平靜──若不是他身後的桌上攤滿了地圖、筆記和各式各樣的冒險用品，看起來幾乎毫無破綻。
      　　
      　　他瞪大紅色的眼，驚訝地看著門口聚集的夥伴。
      　　
      　　「為、為什麼……」
      　　
      　　「晚安，路過。」桑克瑞德舉手問好，回答得十分自然。
      　　
      　　「我也是剛好經過。」阿爾菲諾緊接著說。
      　　
      　　阿莉塞抱起手臂，毫不心虛地越過他肩膀，看向那張佈滿大量物品的桌子。
      　　
      　　「你在裡面做什麼？」
      　　
      　　古·拉哈·提亞稍微側了側身，試圖擋住她的視線。
      　　
      　　「收拾行囊。」
      　　
      　　「哦──」她瞇起眼，冷冷笑了一下，「我看起來倒像是想和那個人私奔。」
      　　
      　　「不是那樣！」
      　　
      　　古·拉哈·提亞脹紅著臉，急忙想解釋，卻又被她的話紮紮實實地嗆了一下。
      　　
      　　塔塔露摀著嘴笑道：「不過已經很晚了，還是早點睡比較好哦。」
      　　
      　　「沒錯。」阿爾菲諾也溫聲勸道，「明日既然要出門，就更應該養足精神。」
      　　
      　　古·拉哈·提亞像是沒料到所有人都會站在門口勸他休息，他垂下了耳朵，一時有些窘迫。
      　　
      　　「好的。」
      　　
      　　「可不能只是說說，也得做到才行。」
      　　
      　　阿莉塞瞇起眼，故作樣態地威脅：「他如果知道你不好好休息，明天可能就不帶你出門了喔。」
      　　
      　　古·拉哈·提亞的表情瞬間僵住，桑克瑞德忍著笑拍了拍他的肩膀。
      　　
      　　「早點休息，英雄大人明天還等著帶你去冒險呢。」
      　　
      　　「若是一刻鐘後還看見你房裡亮著燈，我會親自過來替你熄滅。」
      　　
      　　「怎麼連雅·修朵拉也……」
      　　
      　　古·拉哈·提亞的耳朵紅得更加明顯，門外頓時響起一陣壓低的笑聲。
      　　
      　　等眾人終於散去，古·拉哈·提亞關上門，看著桌上已經整理好的物品，默默站了一會兒。
      　　
      　　沒發多久呆，他又想起阿莉塞的威脅，隨後急急忙忙地熄了燈，迅速鑽入了被窩。
      　　
      　　一雙眼睛卻還是亮晃晃。
      　　
      　　光是想到明天的路程中，可能會歷經的新奇冒險，又或者光在旅途間會分享其他趣聞，亦或是遇上無傷大雅的小麻煩，然後像過去那些冒險故事裡寫的那樣，彼此照應著度過難關，他就期待地無法入睡。
      　　
      　　隔天，光在約好的地方見到他時，眉頭先是一皺，聲音也跟著沉了下來。
      　　
      　　「你昨晚沒睡？」
      　　
      　　古·拉哈·提亞豎起耳朵，眼神亢奮地望著光。
      　　
      　　「有！」
      　　
      　　光盯著他眼下淡淡的青色。
      　　
      　　「睡了多久？」
      　　
      　　「不會拖累委託的。」
      　　
      　　光沒有說話，只是細細地打量著他。
      　　
      　　古·拉哈·提亞不安地甩著尾巴，努力打起自己所剩無幾的精神，生怕光隨時改變想法，不願意帶他同行。
      　　
      　　好在，英雄最後沒再說些什麼，還是與他並肩出發。
      　　
      　　一開始，一切都很順利。
      　　
      　　古·拉哈·提亞對他們踏入的遺跡充滿興致，無論是古時遺留下來的壁畫，還是室內遺留的物品擺飾，都能讓他停下腳步多看幾眼，甚至拿出筆記紀錄。
      　　
      　　只要光回過頭，他便會立刻跟上來，眼神亮得像第一次真正踏上旅途的少年。
      　　
      　　光看在眼裡，嘴角也不由得帶了笑。
      　　
      　　直到他們走進一處遺跡間的小徑，那裡本來沒有什麼危險，頂多只有幾隻不具威脅性的魔物，偏偏古·拉哈·提亞昨夜幾乎沒睡，又一路過度興奮，強撐起的精神到了中午，終於開始有些渙散。
      　　
      　　他一邊低頭確認地圖，一邊往前走，下一刻，腳下不小心踩了個空。
      　　
      　　「拉哈！」
      　　
      　　光連忙一把抓住他的手臂。
      　　
      　　雖然及時將人拉了回來，貓魅的小腿卻仍被坡邊突出的石塊劃出一道傷口。
      　　
      　　雖然僅是皮肉傷，光的臉色卻瞬間沉了下來，他黑著臉、將人拖到一旁的石塊，不由分說地按住他的肩膀，強迫古·拉哈·提亞坐下休息。
      　　
      　　他垂著頭，看著光替他清理傷口，原本還想說些話緩和氣氛，才剛開口，便被光瞪了一眼。
      　　
      　　「你昨晚是不是根本沒睡？」
      　　
      　　光處理傷口的動作很輕，語氣卻明顯壓著火氣。
      　　
      　　古·拉哈·提亞沉默了一會兒，只得避重就輕地回答。
      　　
      　　「……是沒有睡得很好。」
      　　
      　　「為什麼不告訴我？」
      　　
      　　光的神色徹底沉了下去。
      　　
      　　古·拉哈·提亞內心一驚，他知道光是真的生氣了，急急忙忙開口解釋。
      　　
      　　「我、我只是太期待了！」他急切地揮舞著手，「畢竟難得像這樣出來探險，怕遇到什麼危險，我也事先蒐集了點資料……」
      　　
      　　光緊盯著古·拉哈·提亞的臉，視線落在他手中充滿筆記的地圖，又看了看他背在背後，那明顯塞滿備用物品的後背包。
      　　
      　　他的視線越來越冷。
      　　
      　　古·拉哈·提亞無措地搓著手，內心慌得無所適從。
      　　
      　　「而、而且……」他垂著頭，低低地說：「只要是和你一起，我就很難只把它當作普通的一天。」
      　　
      　　光手上的動作停住了。
      　　
      　　方才還滿腔怒火的人沉默半晌，最後用力將繃帶繫好，抬起頭看著他。
      　　
      　　「古·拉哈·提亞，你聽好。」
      　　
      　　貓魅下意識挺直了背。
      　　
      　　「今天不會是唯一一次。」
      　　
      　　他怔了一下。
      　　
      　　光握住他的手腕，神情仍然有些生氣，語氣卻認真得不容置疑。
      　　
      　　「以後我還會帶你去很多地方。很多、很多、很多地方。」光刻意重複道，「沒去過的大陸或小島、雲海或遺跡，甚至是地界邊緣的洞窟，只要你願意，我們都會一起同行。」
      　　
      　　古·拉哈·提亞亮起的眼睛安靜地看著他。
      　　
      　　「所以你不用每次都弄得像這輩子只有這一次。」光伸手捏了捏他的臉，力道不重，語氣卻帶著警告，「平常心一點，不要讓自己累得連路都看不清楚。」
      　　
      　　「可若是你邀請我，我恐怕還是會期待得睡不著。」
      　　
      　　古·拉哈·提亞小聲地囁嚅，光終於被他氣笑了。
      　　
      　　回到石之家後，眾人很快便發現古·拉哈腿上的繃帶。
      　　
      　　塔塔露最先捧著藥水迎了上來。
      　　
      　　「怎麼受傷了？嚴重嗎？」
      　　
      　　「只是一點小擦傷。」古·拉哈·提亞連忙解釋。
      　　
      　　「因為有人期待得一整晚沒睡，走路看地圖，差點從坡上摔下去。」
      　　
      　　光站在旁邊，語氣冷冷地補充。
      　　
      　　整個房間安靜了一瞬。
      　　
      　　接著，桑克瑞德率先別過臉，肩膀微微抖動，阿莉塞則毫不客氣地笑出了聲。
      　　
      　　「我就知道！昨晚我們叫你去睡，你根本沒聽！」
      　　
      　　光的視線淡淡地掃了過來。
      　　
      　　古·拉哈·提亞連忙抓住阿莉塞的手，急切地朝她搖頭，可惜腿上剛包紮好，動作稍微快了一些，便又皺了皺眉。
      　　
      　　塔塔露趕緊搬來椅子，阿爾菲諾也跟著蹲下身，確認繃帶下的傷口。
      　　
      　　古·拉哈·提亞被眾人圍在中間，一時竟不知道該先阻止誰。
      　　
      　　桑克瑞德笑著瞥了光一眼，故意朗聲問道：「這樣你下回還會帶他同行嗎？」
      　　
      　　「原本是答應了……」
      　　
      　　光臉上的笑容令人發寒。
      　　
      　　「但若是他一直這樣，我不排除收回承諾。」
      　　
      　　古·拉哈·提亞瞬間抬起頭，一臉難以置信。
      　　
      　　「你是英雄！」
      　　
      　　「所以呢？」
      　　
      　　「承諾怎麼可以說改就改！」
      　　
      　　「那得看你表現。」
      　　
      　　一雙紅色的眼睛急切得快漫起汪洋，眾人臉上的笑意更深了。
      　　
      　　「再給你最後一次機會。」
      　　
      　　兩人僵持了會，光最後面無表情地伸手抓住古·拉哈的手腕，把人往房間方向帶，「我親自看著你睡。」
      　　
      　　四周頓時響起一片意味深長的聲音，古·拉哈·提亞的臉一下子紅到了脖子。
      　　
      　　「等等，這句話是不是有些容易讓人誤會──」
      　　
      　　「你需要休息，快走。」
      　　
      　　「可是他們都在笑！」
      　　
      　　「你再說，明天不出門了。」
      　　
      　　貓魅立刻安靜。
      　　
      　　走了幾步，他又忍不住小聲問。
      　　
      　　「那後天呢？」
      　　
      　　光停下腳步。
      　　
      　　古·拉哈·提亞站在原地，眼神雖然充滿各種複雜的情緒，眼底仍舊藏不住滿滿的期待。
      　　
      　　光看了他半晌，最後伸手揉亂他的頭髮。
      　　
      　　「後天再說。」
      　　
      　　古·拉哈·提亞笑了起來。
      　　
      　　那副模樣，顯然已經開始期待後天了。
