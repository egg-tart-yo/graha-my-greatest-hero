  - title: 第一章
    body: |-
      　　光是在偶然聞到那股氣味時，才終於發覺哪裡有異樣。
      　　
      　　從第一世界回來後，唯一沒經過靈魂分離、不需要休養的光幾乎沒能真正閒下來。
      　　
      　　日常的委託、帝國的調查，一個個事件交雜而來。光往往才剛從外頭回到石之家，把沾滿塵土或血跡的衣服換下來，隔不了多久便又得重新整裝出發。
      　　
      　　久而久之，他連自己的衣服是誰洗的、誰收的都沒特別留意，反正回來時，乾淨的衣物總會整整齊齊放在該放的位置。
      　　
      　　所以第一次聞到時，光也沒多想。
      　　
      　　那天他趕著船班的時刻，隨手抓了件乾淨的上衣套了便出門，直到坐上坐騎、出發了好一段路後，才後知後覺地低頭嗅了嗅衣領。
      　　
      　　隱約有一股很淡的氣味。

      　　不是過去熟悉的洗劑香氣，而是帶著些許乾燥草葉，以及毛皮被陽光曬過後留下的溫暖氣息。

      　　光怔了一下，忽然想起這個味道，他似乎曾在拉哈身上聞到過。

      　　大概是衣服洗混了吧。
      　　
      　　得出結論後，光十分自然地把這件事拋到了腦後，卻沒料到接下來的一段時間，貼身的衣物都隱約藏著同樣的味道。
      　　
      　　幾番下來，光終於開始感到疑惑。
      　　
      　　難不成幫忙整理衣物的人，每回都把他跟古·拉哈·提亞的東西混在一起洗了？
      　　
      　　可仔細想想，古·拉哈·提亞平時穿的衣服和自己的樣式差了十萬八千里，怎麼看也不至於混錯成這樣。
      　　
      　　懷抱著這樣的疑惑，他依然單獨持續著任務。直到那天，原本預計要花上數日的委託意外順利，光在調查結束的第二天深夜便回到了石之家。
      　　
      　　時間已經很晚，酒館後的大廳十分安靜，走廊裡只剩幾盞微弱的光。光放輕腳步，腦內盤算著先把裝備丟回房間，再去找點吃的。
      　　
      　　經過古·拉哈·提亞房門前時，他卻發現門沒有完全闔上，溫暖的微光自細縫中流出，在長廊上拉出一條細線。
      　　
      　　光停了下來，隨意朝內望了一眼，卻發現裡頭傳來的呼吸聲有些不太規律，像是有人睡得不安穩。
      　　
      　　他在門外站了一會兒，伸出的手遲疑了幾秒，還是輕輕推開門。
      　　
      　　古·拉哈·提亞蜷縮在床上。
      　　
      　　平時總是精神得像有用不完力氣似的貓魅，此刻卻縮著肩膀、眉心微微蹙起，懷裡緊緊抱著一團東西。
      　　
      　　光好奇地悄聲走近，這才發現那團布料似乎是件眼熟的衣服，是他前陣子穿過、換下之後就沒再看見的上衣。
      　　
      　　而那件上衣，現在不僅被古·拉哈·提亞抱著，甚至幾乎把半張臉都埋在了裡頭。
      　　
      　　光蹙起眉，沒搞清楚這是什麼狀況，腦內一瞬間冒出了許多可能。
      　　
      　　貓魅族有抱東西睡覺的習慣？還是拿錯衣服了？就是因為這樣，他的衣服才總是有拉哈身上的味道嗎？
      　　
      　　就在他猶豫要不要把人搖醒時，古·拉哈·提亞忽然動了一下，懷裡的衣服被抱得更緊。
      　　
      　　接著，在鵝黃色的微弱光線下，光看見他的眼角似乎有什麼微微亮了一下。
      　　
      　　彷彿是點沒擦乾淨的水光。
      　　
      　　光的動作停住了。

      　　他垂下眼，沒有立刻出聲，只是站在床邊，靜靜看著古·拉哈·提亞的睡顏。

      　　他似乎睡得並不安穩。

      　　眉心微微蹙著，呼吸又短又急，那雙平日總是隨著情緒靈活轉動的耳朵也偶爾輕輕顫動，像是在睡夢中仍警戒著什麼，又像正試圖躲避某個看不見、也無法擺脫的東西。

      　　光沉默地看了好一會兒。

      　　他本來還有些疑惑，甚至想過要不要把人叫醒，可看見古·拉哈·提亞此刻的模樣，那點不怎麼重要的疑問最後還是被他暫時壓了下去。

      　　光放輕腳步走近，伸手將一旁的被子重新拉回來，小心覆到古·拉哈·提亞身上。貓魅青年沒有醒，只是在被角落下時，抱著懷中衣物的手又無意識地收緊了一點，像是察覺到動靜，怕衣物被搶走似地警備著。

      　　光的視線在那件衣服上停留片刻。

      　　最後，他依然保持沉默，只替古·拉哈·提亞攏好被角，便悄無聲息地退出房間、輕輕帶上了門。
      　　
      　　隔天早上，古·拉哈·提亞依舊朝氣十足地跟他打招呼，一雙紅眼精神奕奕，端著早餐坐到光旁邊。
      　　
      　　「早安，英雄！」他動了動耳朵，「沒想到你這麼快就回來，委託還順利嗎？」
      　　
      　　光悄悄瞥了眼古·拉哈·提亞眼下那抹極淡的青黑，腦海裡揮之不去的，全是他昨夜側蜷著身子、把衣物緊緊摟在懷裡的模樣。
      　　
      　　「怎、怎麼了？」
      　　
      　　「……沒事。」
      　　
      　　光迅速埋頭解決盤中的食物，隨後找了個眾人各自忙碌的空檔，敲響雅·修朵拉的房門。他甚至顧不得自己是否突兀，一迎上她彷彿能洞穿一切的眼眸，便直截了當地低聲發問。
      　　
      　　「你們貓魅族是不是……有什麼築巢的習性？」
      　　
      　　話音剛落，雅·修朵拉翻動書頁的指尖明顯頓了頓。她不疾不徐地闔上厚重的典籍，將臉微微轉向光的方向，神情裡浮現出一抹耐人尋味的笑容。
      　　
      　　「說得更詳細一點。」
      　　
      　　於是光將事情挑著重點說了一遍──當然，省略了古·拉哈·提亞眼角泛著微光的水氣。
      　　
      　　「與其說是築巢習性……」
      　　
      　　她刻意拉長了尾音，引得光不自覺地屏住了呼吸。
      　　
      　　「倒不如說，單純是氣味使然吧。」
      　　
      　　「啊？」
      　　
      　　雅·修朵拉唇角揚起一抹了然的弧度，卻絲毫沒有說明到底的打算，反而重新將手搭回了書脊上。
      　　
      　　「至於真正的原因，我想你親自去問他會比較好。」
      　　
      　　「看來你知道？」
      　　
      　　「知道，跟適不適合由我告訴你，是兩回事。」她優雅地翻開書頁，嗓音裡帶著藏不住的笑意，「就當作是關心同伴的問候，也是好事？」
      　　
      　　光陷入了沉默，眉頭微微蹙起，忽然覺得這番話聽起來好像有道理。
      　　
      　　當天夜裡，他真的找上了古·拉哈·提亞。
      　　
      　　房門被推開時，貓魅青年正專心整理桌上散亂的文獻，一見到光，連忙手忙腳亂地挪開書籍，空出身側的長椅。
      　　
      　　「這麼晚過來，有什麼事嗎？」
      　　
      　　光站在原地沉默了片刻，實在想不出合適的委婉說法，乾脆開門見山：「拉哈，你為什麼要抱著我的衣服睡覺？」
      　　
      　　古·拉哈·提亞手中的紙頁應聲滑落，在安靜的室內發出細微的窸窣聲。他整個人僵直，極其不自然地彎下腰去撿，連指尖都在微微發顫。
      　　
      　　「你、你什麼時候看見的……？」
      　　
      　　「前幾天，我提早回來的那次。」
      　　
      　　貓耳肉眼可見地垂了下去，緊緊貼在髮絲間。
      　　
      　　「……這樣啊。」
      　　
      　　光沒有催促，只是靜靜用那雙湛藍的眼睛注視著他。
      　　
      　　古·拉哈·提亞將拾起的紙張攏好放在桌上，默默坐回椅中。他的肩膀緊緊繃著，放在膝上的雙手無意識地收攏成拳，連指節都泛了白。
      　　
      　　「……其實，不是什麼要緊的大事。」他試圖讓嗓音聽起來輕鬆些，「只是我……最近偶爾睡得不太安穩。」
      　　
      　　光眉頭微蹙。
      　　
      　　古·拉哈·提亞像是怕他擔心，慌忙抬頭補充：「真的沒事！我私下去請教過雅·修朵拉，她也說只是身體還需要一點時間適應……」
      　　
      　　「原因呢？」
      　　
      　　這一次，古·拉哈·提亞徹底安靜下來，目光落在窗外沉寂的夜色裡。
      　　
      　　「……大概是那一百年的記憶吧。」
      　　
      　　他的語氣沉了下去，帶著一絲度過漫長時光才有的悵然。
      　　
      　　「還是水晶公的時候，我早就忘了該怎麼正常入睡，水晶化的軀體本來就不需要歇息。可是……現在這副原本的身體，又沉睡得太久了。」
      　　
      　　他低下頭，看著自己恢復肉體溫度的手掌。
      　　
      　　「有時候閉上眼，會感受到兩邊的靈魂與記憶像是還沒完全融合，步調也不一致。醒著的時候我還能夠控制，但睡著後……偶爾就會做夢。」
      　　
      　　他勉強牽動嘴角笑了一下，卻明顯有些苦澀。
      　　
      　　光想起他睡夢中眼角殘留的水痕，忍不住往前傾了傾身子。
      　　
      　　「你都夢見了什麼？」
      　　
      　　古·拉哈·提亞垂著眼簾，神色在掙扎與隱忍間游移，最終在光不容迴避的目光中敗下陣來，嗓音輕得像隨時會消散的霧氣。
      　　
      　　「有時候……會夢到自己還留在第一世界，但計劃卻屢屢失敗……」
      　　
      　　「也有的時候，會夢回第八靈災之前……那個失去了英雄、無論怎麼呼喊都得不到救贖的世界。」
      　　
      　　光呼吸微微一窒。
      　　
      　　他這才驚覺，自己從未真正細問過眼前的人，在那漫長無望的一百年裡究竟是如何渡過，而古·拉哈·提亞也永遠只將那些過往深埋心底，對他隻字不提。
      　　
      　　「不過醒來就沒事了。」古·拉哈·提亞重新揚起平靜的笑意，像是又變回了水晶公，總是扮演安撫眾人的領導者，「你看，現在大家都在，你也好好地站在我面前，根本就不算什麼──」
      　　
      　　「拉哈。」光出聲打斷了他的逞強。
      　　
      　　古·拉哈·提亞的話語驟然停住。
      　　
      　　「所以，衣服呢？」光直直凝視著他，「為什麼是我的衣服？」
      　　
      　　古·拉哈·提亞整張臉徹底僵住了。
      　　
      　　「這、這個……」
      　　
      　　方才強裝鎮定的青年，此刻臉頰卻倏然燒了起來，連耳尖都泛起深紅。
      　　
      　　「這只是……偶然發現的……」他窘迫得眼神漂移，解釋的聲音也十分微弱，「身邊如果留著你的氣味……好像就能睡得比較好。」
      　　
      　　『倒不如說，單純是氣味使然吧。』
      　　
      　　雅·修朵拉的話在腦海中再次響起。
      　　
      　　光眨了眨眼，徹底明白了。
      　　
      　　在意識無法控制的睡眠裡，用原始的方法告訴感官，或許是最快的方法──透過氣味確認英雄確實活著、是真實存在於世，而不僅僅是傳說或奢望。
      　　
      　　光沉默了會，直接跨步上前，一把將古·拉哈·提亞用力攬進懷裡。
      　　
      　　突如其來的擁抱讓貓魅猛然一顫，身後的長尾瞬間繃得筆直，連話語都支支吾吾：「等、等等？！為什麼突然──」
      　　
      　　「如果味道能派上用場，那這樣睡不就好了。」光說得理所當然，語氣裡沒有半分遲疑，「衣服上的殘留氣味，哪有我本人管用？」
      　　
      　　不等他從混亂中回神，光順手熄滅了桌邊大部分的光源，只留下一盞微弱的壁燈，隨後不由分說地拉著他倒向床榻。
      　　
      　　光很清楚，這傢伙顯然已經被惡夢折磨了許久，否則決不會輕易向拂曉其他人求援。光可是好不容易才把他帶回來，絕不可能任由對方因為這種原因而無法好好休養。
      　　
      　　光在柔軟的床褥間翻過身，朝著整個人徹底石化的古·拉哈·提亞挪了挪，自然地張開雙臂。
      　　
      　　「來。」
      　　
      　　「……」
      　　
      　　古·拉哈·提亞僵硬地半撐在床上，紅瞳裡的情緒劇烈翻湧，整張臉紅透得幾乎要與眼眸融為一色。
      　　
      　　「不是容易做惡夢嗎？」光見他毫無動靜，有些不解地催促。
      　　
      　　「是……話是這樣說沒錯……」
      　　
      　　「那就抱著睡。」
      　　
      　　古·拉哈·提亞喉結艱難地滑動了一下，在心底天人交戰了許久，才極其緩慢地挪動身軀，小心翼翼地靠向光的懷抱。
      　　
      　　他試探著將手搭在光的腰側，動作拘謹而克制，連手指都不敢隨意收攏。光有些無奈於他的謹慎，索性乾脆地伸臂環住他的背，猛地將人往自己懷裡按近。
      　　
      　　「這樣才叫抱著。」
      　　
      　　伴隨著低低的呢喃，光放鬆地闔上了眼。
      　　
      　　身側傳來的體溫高得驚人，他忍不住迷迷糊糊地想著：貓魅族的體溫向來都是這麼燙的嗎？
      　　
      　　逐漸沉入夢鄉的光並未察覺，被他緊緊鎖在懷裡的青年，連呼吸都屏住了。
      　　
      　　古·拉哈·提亞睜著泛起薄霧的紅眸，胸膛劇烈起伏著，耳邊全是他朝思暮想、無數次祈求能再次聽見的心跳聲──沉穩、鮮活，且真實地近在咫尺。
      　　
      　　他終於抑制不住眼底湧上的酸澀，緩慢而極其珍視地收攏雙臂，指尖深陷進光的衣料中，抓出了一道道深刻的褶皺。
      　　
      　　他小心翼翼地將臉埋進光的頸窩，感受著英雄真實的溫度。
      　　
      　　光在半夢半醒間動了動，像是本能地給予安撫一般，將手掌更踏實地覆在了他的背脊上。
  - title: 第二章
    body: |-
      　　這樣的日子持續了好一會兒。

      　　只要光留在石之家的夜晚，到了差不多該休息的時間，他便會十分自然地拎著自己的被子，熟門熟路地推開古·拉哈·提亞的房門，然後往床上一躺、張大手臂，把貓魅一把撈進懷裡，一同進入沉穩的夢鄉。
      　　
      　　古·拉哈·提亞從最初幾夜的拘謹與無措，到後來終於逐漸放鬆了緊繃的神經。雖然一開始還是會緊抓著光的衣物，但沉沉睡去時，指尖的力道便會慢慢放鬆，就連平日裡靈活甩動的長尾，也會在迷迷糊糊間，順著光的腿輕輕纏上來。
      　　
      　　光對此習以為常，甚至覺得透過這種方式就能治療失眠的問題，十分簡單又方便。
      　　
      　　直到某天，光接到緊急的遠程委託，臨走前，他特意將自己蓋著的那床被子留在古·拉哈·提亞的床上，又搬來一大堆穿過的衣服，才滿意地匆匆離去。
      　　
      　　當天深夜，在外野宿的光像過去無數次冒險那樣，把披風隨意鋪在草地上，又往腦後墊了個簡單捲起的布包，便仰面躺了下來，一邊聽著營火在身旁劈啪作響。

      　　夜空一片澄澈，群星像散落在深色布幕上的碎光，一直延伸到目光所及的盡頭。
      　　
      　　但一向沾枕即睡的他，此刻望著滿天星斗，居然毫無睡意。
      　　
      　　「……」
      　　
      　　他閉了閉眼，腦中將渡渡鳥從一數到一百，翻來覆去很久，最後又絕望地睜開明亮的眼睛。
      　　
      　　他突然發現自己有些想念起懷裡的溫度。
      　　
      　　那份溫度除了能將整片胸口烘暖，靠在下巴附近、偶爾蹭過皮膚的毛茸茸耳朵也讓人懷念，就連環在他側腰的手臂，原本還覺得有些拘束，習慣後居然帶來一股踏實的感覺。
      　　
      　　除了這些，光也有點懷念拉哈身上的味道。

      　　他默默抬手，把上衣領口往上扯了扯、蓋住鼻尖，一邊用力嗅著淡到幾乎聞不到的氣味，一邊在心底默默嘆了口氣。
      　　
      　　明明最初是為了解決對方的惡夢，怎麼到頭來，反倒是自己也開始失眠了？
      　　
      　　
      　　*
      　　
      　　
      　　幾天後，好不容易完成委託的光風塵僕僕地趕回石之家。他頂著眼下濃重的黑眼圈，腳步搖晃地踏入大廳，一見到站在桌邊正和阿爾菲諾說話的古·拉哈·提亞，腦袋頓時斷了理智的弦，直直地撲了過去。
      　　
      　　眾目睽睽之下，英雄就這麼掛在貓魅身上，把臉埋在對方的肩窩裡，迷迷糊糊地嘟囔了一句：「……好想睡覺。」
      　　
      　　大廳裡忽然安靜了下來。

      　　慌亂將光接了滿懷的古·拉哈·提亞僵硬地抬起頭，眼睛無措地環視著拂曉的同伴。

      　　桑克瑞德端著杯子的手停在半空，和挑眉的阿莉塞交換了眼神。

      　　阿爾菲諾的視線在兩人之間來回了一圈，尷尬地咳了一聲，然後迅速地低頭假裝自己正在看資料。

      　　只有雅·修朵拉優雅地靠在一旁，唇角慢慢浮起熟悉的笑意。
      　　
      　　古·拉哈·提亞整張臉瞬間脹紅，他硬著頭皮扛起眾人意味深長的視線，一邊半拖半抱地拉著渾身脫力的英雄往房裡走去。
      　　
      　　「等、等等！英雄！你先去洗漱一下啊！」
      　　
      　　一番折騰後，室內終於只留下一盞微弱的光暈。
      　　
      　　光滿足地栽進柔軟的床鋪，長臂一伸、十分自然地將古·拉哈·提亞拉進懷裡，把臉深埋進青年的胸口，發出一聲放鬆的嘆息。
      　　
      　　熟悉的草木氣息湧入鼻腔，緊繃了數日的精神終於徹底鬆懈下來。
      　　
      　　兩人都只穿著單薄的睡衣，光閉著眼睛，手掌習慣性地往後搭，指尖順著對方的背脊游移，無意間碰到了貓魅腰後柔韌的線條。
      　　
      　　當初在水晶塔並肩作戰時，光便注意到古·拉哈·提亞露出的手臂肌肉勻稱俐落，貓魅族特有的體格具備靈巧、柔軟與爆發力，如今即便處於靈魂與肉體融合的休養期，光知道他依然不懈於鍛鍊，努力回到最好的狀態。
      　　
      　　摸著後腰那層緊實卻富有彈性的肉，光在半夢半醒間漫不經心地胡思亂想，手感確實很好。
      　　
      　　然而指尖無意識的摩挲還沒持續多久，頭頂上方忽然傳來一聲極力壓抑的嗓音。
      　　
      　　「英雄……今天是……怎麼了？」
      　　
      　　光渾身一震，理智瞬間回籠。
      　　
      　　意識到自己剛才在做什麼，他像是被燙到似地猛然收回手，放開了古·拉哈·提亞。光整張臉瞬間燒成了熟透的番茄，一路紅到了耳根與頸側，羞窘得連眼神都不知道該往哪裡擺才好。
      　　
      　　「抱、抱歉……！我不是故意的……！」
      　　
      　　光結結巴巴地道歉，不敢直視貓魅的眼睛，連忙窘迫地抬起手臂、遮住自己的半張臉，恨不得找條縫鑽進去。
      　　
      　　古·拉哈·提亞側躺在他身邊，雙眼凝視著手足無措的英雄，眼底暗湧著許多複雜的情緒，最終卻只化作一聲極輕的嘆息。
      　　
      　　「英雄……」
      　　
      　　青年的嗓音輕得彷彿隨時會融化在空氣裡，微弱得又像是喃喃自語。
      　　
      　　「你總是這樣……會讓我誤會的。」
      　　
      　　光眨了眨眼，混亂的腦袋頓時一愣，完全沒明白這句話的意思。他遲疑地放下了遮著臉的手臂，有些茫然地仰起眼睛。
      　　
      　　「……誤會什麼？」
      　　
      　　古·拉哈·提亞沒有回答。
      　　
      　　他只是極其緩慢地在床褥上挪動身子，湊上前來，微溫的手掌輕輕覆上了光的臉頰。
      　　
      　　帶著熱度的指尖沿著側臉緩緩游移，輕輕撫過柔軟的耳邊、眼眶的輪廓，最後停留在發紅的臉頰上。那動作克制又小心翼翼，就像是在用指尖的觸覺，一點點地確認眼前的溫度。
      　　
      　　室內安靜得只剩下兩人交錯的呼吸。
      　　
      　　光睜大眼、動也不敢動，任由那隻手在自己臉上摩挲。
      　　
      　　古·拉哈·提亞注視著他發愣的模樣，眼底浮現出一抹有些無奈、卻柔軟得不可思議的笑意。
      　　
      　　「……不打算推開我嗎？」他輕聲問道。
      　　
      　　光怔了怔，幾乎是反射性地脫口而出：「為什麼要推開？」
      　　
      　　古·拉哈·提亞望著光那雙乾淨純粹的眼眸，呼吸微微一滯。
      　　
      　　他張了張嘴，似乎想說些什麼，可最終還是將那些話語咽了回去。
      　　
      　　「……沒什麼。」
      　　
      　　貓魅青年彎起嘴角，沒再多作解釋，只是傾過身子，默默地伸出雙臂環住了光的肩膀，像過去這段日子的無數個夜晚一樣，自然而然地埋進了他的懷抱中。
      　　
      　　「晚安，英雄。」
      　　
      　　他的聲音貼在光的耳際，沉穩而安心。
      　　
      　　光怔怔地點點頭，也跟著收攏雙手，重新將那副溫熱的身軀擁入懷中，遲疑地閉上眼睛。
      　　
      　　他隱約覺得今晚的古·拉哈·提亞似乎有些不太對勁，胸口像是壓著什麼沉甸甸的東西，可那股熟悉的體溫與淡淡草木香氣卻令他渾身放鬆，這幾日累積的所有疲憊在此刻全數竄了出來。
      　　
      　　強烈的睡意鋪天蓋地席捲而來，光的眼皮沉重得再也支撐不住，意識逐漸陷入朦朧。
      　　
      　　恍惚間，額前的髮絲似乎被輕輕撥開，有什麼溫熱而柔軟的東西，悄無聲息地印上了他的額頭。
      　　
      　　那份觸感溫柔的像是一場幻覺。
      　　
      　　然而，光已經連睜開眼睛確認的力氣都沒有了，只能在那股被徹底包圍的安心與暖意中，沉入了深沉的夢境。
  - title: 第三章
    body: |-
      　　古·拉哈·提亞一直都很清楚，自己對那位英雄抱持著近乎貪婪的渴望。
      　　
      　　每當在第一世界的觀星室，他注視著水晶裡英雄的旅途時，鏡面上倒映出的，除了那令人眷戀的身影外，唯有自己那雙執著深沉的紅色眼睛。
      　　
      　　寬大的兜帽可以瞞過所有人，瞞過整座水晶都的子民，甚至瞞過無影，卻唯獨瞞不過環繞在周圍、水晶壁倒影中的自己。
      　　
      　　但即使如此，那也是不被允許的事情。
      　　
      　　他是水晶塔的終端，是第八靈災人們希望的代表，是換取英雄未來的代價。對這樣的人而言，渴望是不該有的情緒。
      　　
      　　在水晶都，他向人們宣揚希望，費盡心血建起安穩的城池，只為了用行動告訴那群飽受苦難的人──哪怕身處光之氾濫的世界，懷有希望、期盼明日也是理所當然的事情。
      　　
      　　可惟獨對他而言，明日是不存在的。
      　　
      　　他深知將自己徹底從對方的未來抽離，本就是這場漫長計畫中既定的一環，所以無論多想與英雄拉近距離，他的腳步也必須留在原地。
      　　
      　　可如今，那個人卻真真切切地將他擁入了懷中。
      　　
      　　那雙擊碎黑暗的手毫無保留地敞開，溫暖的胸膛理所當然地允許了他的靠近與觸碰。
      　　
      　　古·拉哈·提亞深怕自己任何一絲過界的心思，都會將這好不容易靠近的距離再度拉開。然而，當英雄閉上雙眼沉沉睡去時，那份隱藏了百年的渴望卻不斷膨脹。
      　　
      　　從指尖到手掌，以至於將整個人擁入懷，他的理智逐漸壓抑不住內心咆哮的聲音。
      　　
      　　想靠近一點。
      　　
      　　再近一點。
      　　
      　　這是他最珍視的英雄。
      　　
      　　是他的、此刻僅屬於他的光──
      　　
      　　
      　　
      　　*
      　　
      　　
      　　
      　　自上次有些越界的夜晚之後，光的睡相明顯拘謹了許多。
      　　
      　　以往他往床上一躺就是大刺刺地張開雙臂，如今每一次伸手摟住貓魅時，神情總會掠過一抹不自然的猶豫。一雙湛藍的眼睛時不時直勾勾地盯著古·拉哈·提亞看，臉上盡寫著藏不住的胡思亂想。

      　　近幾天古·拉哈·提亞被他抱著時，都能感覺到英雄渾身僵硬的肌肉繃得死緊，被他勒得無奈又好笑。
      　　
      　　今晚，古·拉哈·提亞微微動了動耳朵，終於忍不住出聲點破。
      　　
      　　「英雄……放鬆一點，你的手臂好硬。」
      　　
      　　「啊、喔……抱歉。」
      　　
      　　光慌忙鬆開了些力道。
      　　
      　　他原本只是想把放在對方後腰的手掌移開，免得自己又像上次那樣無意識地亂摸，引來更尷尬的場面，然而，手掌往下一滑、試圖尋找合適的著力點時，指尖卻恰好拂過腰椎末端與貓尾相接的部位。
      　　
      　　「唔……那邊……」
      　　
      　　一聲極輕卻低啞短促的喘息，從古·拉哈·提亞的口中溢出，溫熱潮濕的鼻息直接噴灑在光的耳側。
      　　
      　　光整個人宛如被雷劈中了一樣，幾乎是連滾帶爬地瞬間彈開了半張床的距離。
      　　
      　　「咚」的一聲，英雄整整齊齊地在床尾雙膝跪坐，整張臉脹得通紅，對著古·拉哈·提亞深深低下頭去。

      　　「對、對不起！我真的不是故意的！拉哈你聽我解釋──」
      　　
      　　古·拉哈·提亞側趴在床褥上，身後的長尾因為剛才的觸碰而敏感地輕顫，耳尖更是燒得通紅。他深呼吸了幾口氣，才勉強平復體內那股竄起的酥麻，有些狼狽地坐起身、擺了擺手。
      　　
      　　「……是、是我自己失態了，尾巴根部本來就比較……」
      　　
      　　他話沒說完，光已經羞憤地抓了抓自己亂糟糟的頭髮，徹底自暴自棄似地脫口而出。
      　　
      　　「那不然換你抱我好了！免得我每次躺著都不知道手該放哪裡，又莫名其妙摸到不該碰的地方！」
      　　
      　　古·拉哈·提亞整個人猛地一怔。
      　　
      　　他看著滿臉懊惱的光，原本帶著歉意的眼神漸漸沉了下來，甚至浮現出一絲嚴肅。垂在身側的手指微不可察地收緊，嗓音有些沙啞地確認道：「這句話……是真的嗎？」
      　　
      　　「當然是真的啊。」
      　　
      　　光破罐子破摔地說著，隨後側過身子，把自己規規矩矩地蜷成一團。
      　　
      　　他把兩隻無處安放的手老老實實地收攏在兩人的胸口中間，閉緊雙眼，一副「隨你處置、我絕不亂動」的模樣。
      　　
      　　古·拉哈·提亞看著他這副毫無保留的姿態，眼底閃過一絲無奈又寵溺的笑意。
      　　
      　　他輕輕挪動身子，伸出手臂緩緩環住了英雄寬闊結實的後背。
      　　
      　　溫暖的氣息鋪天蓋地籠罩下來。
      　　
      　　然而下一瞬，古·拉哈·提亞的手指卻沒有停在原地，而是帶著幾分探尋，隔著單薄的衣料，輕柔地自光的頸椎一節節撫平緊繃的背脊。
      　　
      　　指腹劃過的每一寸都引起酥麻的顫慄，光縮了縮脖子，咬著牙抗議道。
      　　
      　　「……拉哈，你是不是故意的？你這根本是在報復我剛才摸到你吧……？」
      　　
      　　「不是報復。」
      　　
      　　古·拉哈·提亞的手掌停在他脊椎的中段，沒有退開，語氣卻認真得讓人心頭一緊。
      　　
      　　「只是……能像這樣觸碰英雄，對我來說，是連作夢都不會有的奢望。」
      　　
      　　聽著那熟悉又透漏一絲沉重的嗓音，光腦海裡立刻浮現出青年在第一世界孤獨的百年。
      　　
      　　藍眼靜靜垂了下來，他沒辦法對這樣的古·拉哈·提亞說出任何拒絕的話。
      　　
      　　而那雙沿著他背脊輕撫的手，見他縱容自己的踰矩，隨即收了回來、轉而小心翼翼地向上探去，輕柔地捧住了他的臉。
      　　
      　　「拉哈？」
      　　
      　　光困惑地眨了眨眼，迎上古·拉哈·提亞那雙滿是自己倒影的眼眸。
      　　
      　　「英雄……」
      　　
      　　古·拉哈·提亞的嗓音很輕，帶著光所不理解的壓抑。
      　　
      　　「你願意……陪我確認一件事情嗎？」
      　　
      　　光被那專注的目光看得有些心慌，下意識嚥了嚥口水，遲疑地問道：「確認……也跟失眠有關？」
      　　
      　　「嗯……算是吧。」
      　　
      　　古·拉哈·提亞牽動嘴角，露出有些複雜、又帶著幾分緊張的淺笑。他順勢拉過光那隻無處安放的手，引導著掌心放在自己的肩膀上。
      　　
      　　「如果不喜歡，你隨時可以推開我。」
      　　
      　　古·拉哈·提亞低聲說著，目光像是釘在光的雙眸裡，認真地確認他的反應。
      　　
      　　「我為什麼要推──」
      　　
      　　光的反問還沒完全出口，便驟然屏住了呼吸。
      　　
      　　古·拉哈·提亞微微仰起頭，緩慢、卻無比珍重地將唇瓣貼上了他的額頭。
      　　
      　　柔軟的觸感如同羽毛落下，還不等光回過神來，啄吻已一路向下，極輕地點在他的鼻尖、泛紅的側臉，最終擦過嘴角，停在他因為過度緊張而急促呼吸的唇邊。
      　　
      　　「拉、拉哈……為什麼……等等……」
      　　
      　　光的心臟狂跳得像要躍出胸膛，另一隻手無所適從地扯著床單，喉嚨乾澀得幾乎發不出聲音。
      　　
      　　古·拉哈·提亞沒有回應，他收回了捧著臉頰的手，雙臂撐在光的身側兩旁，稍微拉開了些許距離。
      　　
      　　懸在光上方的貓魅青年低低平復著呼吸，目光落在身下之人的臉上，怔怔地望著他。
      　　
      　　光整個人僵在床褥間，胸膛劇烈起伏著，那雙向來澄澈而堅定的眼眸，此刻全是不知所措的動搖與慌亂，像個全然不知防備、卻第一次被某種陌生的悸動狠狠撞擊而失神的孩子。
      　　
      　　恍惚間，古·拉哈·提亞彷彿看見了自己。
      　　
      　　看見了當年在水晶壁前，自己第一次意識到對英雄的憧憬早已悄悄變質時，那抹同樣慌亂、卻毫無防備的倒影。
  - title: 第四章
    body: |-
      　　深埋已久的渴望僅撕開了一角，便如決堤的潮水般蜂擁而出。

      　　看著英雄眼底浮現的無措，以及一路漫上耳尖的潮紅，古·拉哈·提亞幾乎能確信那份未被明言的情感，並非只懷抱於自己心中。

      　　胸口像是忽然被什麼柔軟的東西填滿，連心跳都雀躍得失去了原本的節奏。

      　　那份欣喜來得太快也太出乎意料，他甚至覺得眼眶微微發熱。漫長歲月裡從不敢奢望的東西，竟就這麼深藏在蔚藍的眼底。

      　　眼神是不會說謊的。

      　　即使光或許還沒真正弄明白，那份慌亂、羞赧與親近究竟代表著什麼，古·拉哈·提亞卻已經從那雙毫無防備的眼睛裡，窺見了足以讓自己心口發酸的答案。

      　　至少，光並不討厭他的靠近。

      　　甚至……或許也有一點喜歡。

      　　只是這麼想著，古·拉哈·提亞的耳朵便不受控制地輕輕動了一下，連原本繃緊的尾巴都開心地高高豎起、尾尖輕顫著。

      　　他幾乎想笑，又有一點想哭，然後又再次深刻地意識到──
      　　
      　　自己真的，無可自拔地喜歡著他的英雄。

      　　喜歡，非常喜歡，喜歡到只要光願意朝他伸出手，他甚至甘願把自己擁有的一切都捧出去，半點都不想保留。

      　　那份微小的確信像是一份只屬於他的獎賞，讓他原本勉強維持的克制逐漸鬆開，也讓心底那些藏了太久、從來不敢真正索求的念頭，一個接一個冒了出來。

      　　他忍不住再次俯下身。

      　　這一次比起試探，更像是得到了允許後小心翼翼的親近。

      　　他的鼻尖蹭過英雄柔軟的臉頰，像是怎麼靠近都嫌不夠似的，帶著一點幾乎藏不住的依戀。

      　　每一次觸碰都很輕，如同真正的貓輕柔地撒嬌，可其中藏著的珍惜與歡喜，卻濃得像要從每一道呼吸裡漫出來。
      　　
      　　他忍不住又親了親他的英雄。
      　　
      　　溫熱的舌尖隨著親吻輕輕蹭過皮膚，細小的倒勾只留下些微酥麻的癢意，像柔軟的毛尖一下一下掃過。古·拉哈·提亞並不急著留下什麼痕跡，只是近乎貪戀地感受著那份真實的溫度，偶爾輕輕含住一小片發燙的軟肉，又很快鬆開。

      　　小心翼翼地靠近，碰一下，又忍不住再蹭一下。

      　　這一切都美好得近乎不像真的。

      　　古·拉哈·提亞甚至不敢太用力呼吸，唯恐只要稍微驚動眼前的人，這場夢就會忽然醒來。

      　　可胸口那份酸酸熱熱的欣喜又實在太過真切，真切得讓他只想把這一刻牢牢抱住。

      　　最好久到，他可以一直一直沉溺其中。
      　　
      　　「拉、拉哈……」
      　　
      　　光帶著喘息的微弱輕喚，猝不及防地將古·拉哈·提亞自夢裡喚了回來。
      　　
      　　他猛地一震，倉促地撐起身體、再度拉開距離。
      　　
      　　身下的英雄眼角泛著一層生理性的薄薄水霧，整張臉紅得幾乎要滴出血來。儘管渾身發顫，光還是艱難地深呼吸，一手有些脫力地撐起半邊身子，努力平復著快要跳出胸膛的心跳。
      　　
      　　他避開了古·拉哈·提亞的紅眸，漲紅著臉，嗓音帶著尚未褪去的沙啞，結結巴巴地問：「結、結果……確認好了嗎？」
      　　
      　　光不安地揉搓著身下的床單，語氣裡滿是單純的困惑與無措：「這樣……對失眠……真的有幫助嗎？」
      　　
      　　古·拉哈·提亞撐在床鋪上的手，指節驟然收緊，深深陷進了棉被裡。
      　　
      　　這人為什麼……總是這樣。
      　　
      　　從第一世界開始，光總是無條件地信任他、近乎答應他的所有要求，而他，現在正在利用這份毫無保留的溫柔與信賴，仗著英雄因擔憂而授予自己靠近的權力，肆意妄為地宣洩著見不得光的慾望。
      　　
      　　「那個……可能……」古·拉哈·提亞慌亂地扯了扯嘴角，一時間不曉得從哪裡開始解釋。
      　　
      　　「……行不通嗎。」
      　　
      　　見他眼神閃爍著複雜的情緒，光原本就慌亂的心更是沉了下去。他有些沮喪地垂下頭，隨後又強打起精神，出聲安慰道。
      　　
      　　「沒關係，總會找到辦法的……」
      　　
      　　儘管故作鎮定，光的視線卻慌亂地在室內四處飄移，連一秒都不敢與眼前的人對視。他只覺得自己渾身上下的血液都在逆流，胸膛裡有團火燒得他口乾舌燥、坐立難安。
      　　
      　　「但、但是我現在覺得……不太舒服，整個人有點燥熱……」他像隻受驚的野獸般慌忙翻身下床，手忙腳亂地抓過搭在椅背上的斗篷，胡亂往身上一套，「我、我去外頭喝點水！」
      　　
      　　他幾乎是用逃跑的步伐衝向門口，腳步踉蹌而倉促。然而就在拉開門的那一刻，英雄卻又硬生生地剎住了腳步。
      　　
      　　他背對著房間，肩膀繃得死緊，微微側過那張依然通紅的側臉，有些彆扭卻又極其認真地低喊道：「如、如果你累了……就先抱著我的被子睡！」
      　　
      　　古·拉哈·提亞怔在原地。
      　　
      　　走廊上傳來了逐漸遠去的急促腳步，房間裡重新回歸了沉靜。
      　　
      　　空氣中還殘留著升高的溫度，以及英雄身上那股讓人發瘋的氣息。古·拉哈·提亞望著門邊好一會，才緩緩低下頭，看著自己因極力忍耐而微微發顫的雙手。
      　　
      　　他紅著臉、握緊拳頭垂下了頭，嗚咽地笑出了聲。
      　　
      　　
      　　
      　　*
      　　
      　　
      　　
      　　光一路走出了石之家。

      　　夜風迎面吹來，冰涼地掃過仍舊發熱的臉頰，可胸口那股莫名其妙的燥意卻遲遲沒有消退。

      　　他走得很快，幾乎沒有回頭，直到石之家徹底隱沒在身後，光才終於放慢腳步，抬手用力抹了一把臉。

      　　掌心碰到的皮膚依然滾燙。

      　　「……」

      　　他站在原地，第一次覺得自己腦袋裡亂得像被什麼攪成了一團。
      　　
      　　他試圖釐清剛才發生的一切，腦海裡卻總是不斷浮現那雙一直看著自己的紅眼，還有落在側臉、彷彿能灼燒人的溫度。
      　　
      　　但古·拉哈·提亞說了，那只是在確認失眠的原因，自己也確實答應了。

      　　光猛地甩了甩頭，嘗試撫平內心躁動的情緒。
      　　
      　　這種事情，他也不曉得還能找誰商量，但至少他得先讓自己冷靜下來。
      　　
      　　於是過了不久，一個用深色斗篷把自己遮得嚴嚴實實的人影便出現在城內的一間酒館。

      　　光把兜帽壓得很低，特地挑了靠角落、最不起眼的位置，單手撐著臉頰，隔著人群望向酒館中央。

      　　那裡一如既往地熱鬧歡騰。

      　　旅人們高舉酒杯，笑聲與碰杯聲此起彼落。幾名剛結束工作的冒險者正圍著桌子大聲吹噓今天的戰果，另一頭有人隨著樂聲拍手，還有幾對男女靠得很近，親暱又甜蜜地低頭交談著。

      　　光原本只是無意識地看著，視線在人群之間毫無焦距地游移，直到眼角餘光忽然捕捉到酒館最裡側的一抹動靜。

      　　那裡坐著一對伴侶，肩膀緊挨在一起，光的視線轉移過去的同時，其中一人恰巧伸手托住了對方的臉，整個身體跟著傾近。

      　　兩人的唇很快貼在了一起。

      　　光愣了一瞬，急急忙忙尷尬地撇開視線。

      　　「……」

      　　他低頭盯著自己的酒杯，耳根又開始發熱，內心忍不住挖苦自己。

      　　只是陌生人在親來親去而已，有什麼好看的。

      　　光伸手拿起點了許久卻始終沒入口的酒，一口灌下半杯，試圖把那點莫名其妙的尷尬壓下去。

      　　可越是不想去想，某張臉、炙熱的眼睛，甚至是靈動的貓耳，反而越清楚地從腦海裡浮現出來。
      　　
      　　明明只是因為失眠而已，光在內心反覆地重申。
      　　
      　　這些親暱、這些貼近，只是為了讓拉哈睡得更好，只要等他能正常睡眠，這些東西都──
      　　
      　　「都……不再會……」

      　　喃喃自語著的光整個人瞬間僵住。

      　　原本還燥熱的身體像是被兜頭澆下一盆冰水，連指尖都在那一刻變得發冷。
  - title: 第五章
    body: |-
      　　雅·修朵拉替古·拉哈·提亞做完最後一項檢查時，午後斜偏的光線正落進石之家的大廳。青年規矩地坐著，任由雅·修朵拉手中放出的探查魔法籠罩住全身。
      　　
      　　隨著光芒漸弱，雅·修朵拉滿意地收回手，朝他露出微笑。
      　　
      　　「改善不少，比前陣子穩定多了。」
      　　
      　　聽見她說的話，古·拉哈·提亞原本微微繃緊的雙肩放鬆了許多，身後的長尾也精神地在椅背旁晃了晃。
      　　
      　　「這麼說來……這副身體的調適已經沒有大礙了？」
      　　
      　　「至少目前看來是這樣。」雅·修朵拉的語氣一如既往地從容，「先前那些微弱的不協調感正在逐漸磨合。畢竟是同一人的靈魂，適應理當只是時間問題。」
      　　
      　　「那真是太好了。」
      　　
      　　古·拉哈·提亞彎起眼，露出如釋重負的笑容。
      　　
      　　而倚在門邊、抱著雙臂的光，胸口壓得沉甸甸的那口氣也總算跟著吐了出來。
      　　
      　　經過這段時間的休息，古·拉哈·提亞的氣色確實好轉了許多，眼下的青黑早已褪去，甚至還能精神奕奕地跟著拂曉的同伴外出，處理一些較為簡單的委託。
      　　
      　　照理來說，這是再令人安心不過的好消息。
      　　
      　　站起身的雅·修朵拉正準備離開，隨後像是忽然想起什麼似地側過臉。
      　　
      　　「對了，那些惡夢呢？」
      　　
      　　光原本稍稍放鬆的神經瞬間又繃緊了起來，背脊不自覺地挺直。
      　　
      　　古·拉哈·提亞微微一怔，但很快地露出讓兩人放心的微笑。
      　　
      　　「已經好很多了，最近就算偶爾還會夢見以前那些事，也不至於再像剛回來時那樣驚醒。」
      　　
      　　雅·修朵拉點了點頭，「看來恢復的進展比預期中還要順利。」
      　　
      　　「等一下。」
      　　
      　　一直沉默不語的光忽然脫口打斷。
      　　
      　　他的聲音有些突兀，連自己都愣了一下，隨後在兩人投來的視線中不自在地挪了挪身軀，放緩了聲調。
      　　
      　　「那……失眠的問題呢？」
      　　
      　　古·拉哈·提亞轉頭望向光，後者的臉上是自己未曾察覺的認真與緊繃。
      　　
      　　「既然惡夢變少了……那是不是代表，你已經能自己一個人正常入睡了？」
      　　
      　　大廳裡忽然陷入了短暫的凝滯。
      　　
      　　古·拉哈·提亞望著他，那雙紅瞳極輕微地晃動了一下，泛起了一絲光看不懂的情緒。
      　　
      　　但很快，那抹異樣就被他壓了下去，恢復平靜無波的模樣。
      　　
      　　「應該沒問題。」他溫聲道：「至少這幾天確實比過去容易睡著多了。」
      　　
      　　光怔怔地聽著，垂在身側的手指不自覺地握緊了些。
      　　
      　　接著，古·拉哈·提亞微微瞇起眼睛，朝他露出一抹毫無保留的柔和笑容。
      　　
      　　「這段時間真的太麻煩你了，英雄。」
      　　
      　　「如果不是你總是不厭其煩地過來陪著我……我大概也沒辦法這麼快找回現在的步調。」
      　　
      　　他微微停頓了一下，搭在膝頭的手指僵硬地在深色的褲子上揉出皺摺。
      　　
      　　「不過既然身體已經慢慢適應，以後……應該就不用再麻煩你特地挪出時間過來了。」
      　　
      　　光眨了眨湛藍的眼睛，胸口慢慢被一層層的鬱悶佔據。
      　　
      　　他下意識地轉向雅·修朵拉，語氣忽然染上一絲矛盾的固執。
      　　
      　　「真的嗎？」
      　　
      　　雅·修朵拉挑起一邊纖細的眉尾，「什麼？」
      　　
      　　「真的確定沒問題了？」光眉頭緊皺，一臉急切地追問，「要不要再多檢查幾次？靈魂融合這種事從來沒有前例，萬一現在的好轉只是假象──」
      　　
      　　「英雄。」
      　　
      　　古·拉哈·提亞有些無奈地輕喚了一聲，耳尖微微垂下。
      　　
      　　光卻像是沒聽見似地繼續往前跨了半步。
      　　
      　　「而且惡夢又不是完全消失了，只是『變少』而已，萬一哪天半夜又突然──」
      　　
      　　「我說，你是不是擔心得有點太誇張了？」
      　　
      　　門邊冷不防傳來一聲帶著疑惑的聲音。阿莉塞不知何時走了進來，眼神古怪地打量著拂曉的英雄。
      　　
      　　「拉哈都說好多了，你怎麼搞得好像他今晚一個人睡就會出什麼事一樣？」
      　　
      　　「就是。」桑克瑞德也端著馬克杯晃了過來，神色微妙地上下掃了光一眼，調侃道：「認識你這麼久，我受傷躺在床上動彈不得的時候，可從沒見過你緊張成這副德性。」
      　　
      　　「話不是這樣說的！」
      　　
      　　光想也沒想便脫口反駁。
      　　
      　　然而話音剛落，連他自己都僵在了原地。
      　　
      　　「哦？不然呢？」
      　　
      　　桑克瑞德好整以暇地啜了口茶，唇角勾起一抹似笑非笑的弧度，不依不饒地追問。
      　　
      　　光張了張嘴，喉嚨卻乾澀得發緊。
      　　
      　　他忽然間發現，自己答不上來。
      　　
      　　眾人困惑地面面相覷，在一片寧靜中齊齊望著光，那些帶著探尋與質疑的視線，讓胸口的急躁慢慢醞釀成無處宣洩的悶火。
      　　
      　　光最後沉下了眼睛，逃避似地別開了頭。
      　　
      　　「……我知道了。」
      　　
      　　他重新望向那抹紅色的眼睛，扯出一抹微笑。
      　　
      　　「總之……你能好轉就好。」
      　　
      　　說完，光一言不發地大步走到牆邊，一把抓起倚靠在那裡的武器，隨後頭都不回地踏出了大廳。沉重的腳步聲一路遠去，只留給室內一片寂靜。
      　　
      　　良久，桑克瑞德才慢悠悠地聳聳肩。
      　　
      　　「……他今天吃錯藥？」
      　　
      　　「誰知道呢。」
      　　
      　　雅·修朵拉饒有興致地望著光離去的方向，輕輕勾起唇角。
      　　
      　　古·拉哈·提亞始終維持著低垂的視線。
      　　
      　　他看著剛才光站著的地方，垂在身側的手指非常細微地抽動了一下。
      　　
      　　剛才那一瞬間，他差點就要忍不住伸手拉住英雄的手，阻止那道倉促離去的背影。但最後，指尖還是蜷縮起來，悄悄地收回了身側。

      　　
      　　
      　　*

      　　
      　　
      　　他們懷著各自的心思迎來了黑夜。
      　　
      　　古·拉哈·提亞站在床沿，仔細地撫平被褥上的褶皺，然後雙手將那床被子端端正正地疊好。
      　　
      　　那是這段時間以來，光每晚都會蓋著的被子。
      　　
      　　他看了看窗外高掛的弦月，想著都這麼晚了，英雄大概是真的不會來了。紅眼凝視著眼前的棉被出了神，指尖緩緩地在布料上摩挲，眼眶微酸，卻又強迫自己揚起一抹苦笑。
      　　
      　　他抱起那團沉甸甸的被子，打算趁著光還沒回來之前，替他送回隔壁的房間。然而剛轉過身，房門便被猝不及防地推開了。
      　　
      　　伴隨著木門推開的聲響，古·拉哈·提亞驚訝地抬起眼。
      　　
      　　光就那麼毫無預警地站在門口。
      　　
      　　他的神色煩躁，看不出來白日裡究竟去做了什麼，藍色的眼睛環顧了室內一圈，隨後定定落在了古·拉哈·提亞懷中抱著的被褥上。
      　　
      　　他的瞳孔幾不可察地縮了一下。
      　　
      　　「……你要把它拿到哪裡去？」
      　　
      　　「送回你的房間。」
      　　
      　　古·拉哈·提亞盡量讓自己的聲線聽起來平靜無波，甚至體貼地彎起了唇角。
      　　
      　　光站在門邊，絲毫沒有讓步的意思。
      　　
      　　在漫長而沉重的沉默中，他忽然啞著嗓子，頹然又固執地低聲喃喃：「我不能在這裡睡了嗎？」
      　　
      　　古·拉哈·提亞怔了怔，顯然沒料到光會問出這樣的話。
      　　
      　　抱在胸前的棉被被他下意識地勒緊，陷出一條明顯的摺痕。赤紅的眼睛望著一臉固執的英雄，喉結動了動，才極其艱難地放輕了聲音。
      　　
      　　「不是不能……」
      　　
      　　「只是……我的情況已經穩定很多了，英雄不必再像之前那樣特地遷就我。」
      　　
      　　光的眉心緊緊皺了起來，「那不是遷就！」
      　　
      　　急於解釋的聲音在狹窄的房間裡撞出回音，古·拉哈·提亞看似嚇了一跳，怔愣地望著他。
      　　
      　　光的胸膛劇烈起伏著，手指不自覺地用力抓緊著門框。
      　　
      　　「我……我從來沒有覺得勉強，我是自己想待在這裡的。」
      　　
      　　那些在酒館裡、在夜風中翻湧了整晚的思緒，在此刻一股腦地全湧上了心頭。
      　　
      　　光心裡很清楚，古·拉哈·提亞的隱忍與後退，只是出於他一貫體貼的性格，不想給自己添麻煩。
      　　
      　　可是，這份劃分得清清楚楚的界線，卻沒來由地令他感到煩躁。
      　　
      　　眼前的這個人明明在睡夢裡還抓著自己的衣服，明明在第一世界的最後卸下了防備、告訴他壓抑許久的願望，甚至不久前才環抱著他……為什麼到了白天，又能若無其事地退回安全的距離，好像這一切都只是治病的一環？
      　　
      　　難道只有自己，真的只有自己一個人，會為了這段說不清、道不明的關係感到混亂嗎？
      　　
      　　光討厭這股被推開的疏離感。
      　　
      　　他不喜歡古·拉哈·提亞臉上那抹看似知足的微笑，更不喜歡他面對自己時，永遠都在退讓的小心翼翼。
      　　
      　　光深吸了一口氣，直直望進那雙泛著錯愕的紅眼。
      　　
      　　「拉哈，我想問你。」
      　　
      　　他咬了咬下唇，聲音沉了下來，帶著連自己都無法隱藏的焦躁與逼問：「我對於你而言……除了英雄之外，到底還算什麼？」
