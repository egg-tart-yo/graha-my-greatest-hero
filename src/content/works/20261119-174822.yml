  - body: |
      　　撕裂空間的裂縫正在遠方無聲地擴張，濃稠得化不開的乙太在空氣中交互震動、低沉的嗡鳴，像是巨獸甦醒前的呼吸，緊貼著喉間的窒息感連賢人們都難以承受。每往前踏出一步，靈魂都會感受到被震蕩撕扯的劇痛。
      　　
      　　光之戰士站在前方，狂風捲起染著塵土的衣擺，沒有回頭的他只是抬起手，將慣用的武器召喚至掌心。金屬的冷光靜靜地停在蓄勢待發的位置，在死寂的荒原上顯得格外孤絕。
      　　
      　　身後傳來了急促的腳步聲，以及武器出鞘的聲響。
      　　
      　　「等一下！哪怕只是在後方提供支援也好，我們不能就這樣看著你一個人──」
      　　
      　　阿莉塞緊握著細劍的劍柄，指節因為過度用力而發白，眉頭緊蹙著便要往前衝。一旁的阿爾菲諾也上前了半步，目光中滿是焦灼與對未知的憂慮。
      　　
      　　他們顯然不打算讓同伴獨自踏入這片絕境，但一隻手臂卻橫了過來，穩穩地攔住精靈的腳步。
      　　
      　　是古·拉哈·提亞。
      　　
      　　阿莉塞怔了怔，轉頭看向總是衝在最前線、恨不得替英雄擋下所有災厄的紅髮貓魅。她原以為，在場最無法忍受英雄獨自涉險的人，一定是他。
      　　
      　　然而，那雙眼睛卻帶著不可意思的平靜，眨也不眨地望著前方的背影。
      　　
      　　「拉哈……？」阿莉塞的聲音裡帶著一絲急切與不解，「為什麼攔著我？」
      　　
      　　紅眼落在少女的身上，眼底卻沒有絲毫動搖，也不存在因無法比肩而產生的焦躁。
      　　
      　　「那是……我們無法到達的地方。」
      　　
      　　古·拉哈·提亞的聲音很輕，卻像是沉入深海的錨，帶著沉澱過後的重量。他的耳朵向後貼了貼，但目光始終沒有從那道背影上移開。
      　　
      　　若是可以，貓魅又何嘗不想燃盡自己的生命，去鋪平英雄穩定前行的道路。但若那是僅有光能面對的困境，那麼身為夥伴的自己應該做的──
      　　
      　　「強行跟上去，只會成為他的負擔，讓他不得不分神來保護我們。」指尖深深扎進掌心裡，借由微弱的疼痛壓抑住本能的擔憂。但儘管如此，他的聲音依舊帶著堅不可摧的平和。
      　　
      　　「現在，我們能做的只有信任，以及等待。」
      　　
      　　阿爾菲諾看著青年緊繃卻異常堅定的側臉，輕輕嘆了口氣，伸手按住了妹妹的肩膀。
      　　
      　　阿莉塞咬了咬下唇，眼眶有些發熱，最終還是緩緩放下了舉起的細劍，目光重新投向前方，「……真是的，每次都這樣，擅自把最危險的部分全攬在自己身上。」
      　　
      　　彷彿聽見了身後的低語，前方的光之戰士停下了腳步。
      　　
      　　他沒有完全轉身，只是微微側過半張臉，狂亂的風吹起他的髮絲，露出一雙依舊清亮、又有些凝重的眼眸。他越過眾人，準確地捕捉到了古·拉哈·提亞的視線，隨後極輕、極穩地點了點頭。
      　　
      　　貓魅的紅眸輕輕顫動。
      　　
      　　不需要任何言語，跨越了默契的無聲約定，悄悄地纏繞在他們之間。
      　　
      　　「去吧，我的英雄。」古·拉哈·提亞在心底無聲地默念，嘴角揚起一抹或稱苦澀，卻也帶著釋然的微笑。
      　　
      　　收回視線的光邁開大步，獨自踏入那片震盪又未知的空間中。漆黑的虛無吞沒了他的身影，空間發出更為劇烈的震動，隨後嘎然而止、回歸死寂。
      　　
      　　荒原上只剩下呼嘯的風聲，捲起細碎的沙礫拍打在眾人的衣甲上。拂曉的賢人們無聲地在周圍散開，各自高舉著武器，戒備著英雄的歸路。
      　　
      　　而古·拉哈·提亞走到虛無空間的界線旁，紅色的眼眸凝視著最靠近入口的地方。
      　　
      　　他深信不疑，無論前方的長夜是否帶著吞噬人心的幽暗、又有多少強大難纏的敵人擋在前方，那道光芒終將抵達終點、撕裂一切陰霾。
      　　
      　　而當戰鬥勝利的英雄精疲力竭、傷痕累累地轉過身時，第一眼看見的，必然是始終注視著他、從未離開過原地的眼眸。
      　　
      　　我們一直都在。
