      　　古·拉哈·提亞已經記不清自己穿過了多少片廢墟。
      　　
      　　腳下的土地被魔力與炮火翻攪得焦黑，斷裂的石柱橫倒在路中央，火焰沿著殘破的旗幟緩慢燃燒。空氣裡瀰漫著煙塵、鐵鏽與燒焦的氣味，每吸進一口，都像有細小的碎片刮過喉嚨。
      　　
      　　「光──」
      　　
      　　即使聲音又乾又啞，他仍不放棄地再次呼喊。
      　　
      　　古·拉哈·提亞身上的衣袍早已破爛不堪，袖口被利刃削去大半，肩側的布料也被鮮血黏在皮膚上。長時間的戰鬥幾乎耗盡了他全部的魔力，雙腿沉重得像灌了鉛，每往前一步，視野便跟著晃動一次。
      　　
      　　「光……你在哪裡？」
      　　
      　　回答他的只有遠處倒塌的建築發出低沉轟響，碎石沿著斷壁滾落，砸進一片死寂裡。
      　　
      　　古·拉哈·提亞咬緊牙關，扶著殘牆勉強站穩，隨後艱難地繞過一片坍塌的石牆，腳步卻忽然停住。
      　　
      　　不遠處的斷垣殘壁之間，躺著一道人影，渾身沾滿瓦礫塵灰與斑斑血跡。
      　　
      　　「光！」
      　　
      　　古·拉哈·提亞幾乎是跌撞著衝了過去。
      　　
      　　最後幾步，他連站穩的力氣都沒有，膝蓋重重跪上碎石，卻像感覺不到疼痛一般，立刻伸手將壓在光身側的石塊推開。
      　　
      　　「光，聽得見嗎？」
      　　
      　　他顫著手碰上光的臉，確認還有溫度後，急忙俯下身，想確認光身上的傷勢，卻在這時看見那雙緊閉的眼睛緩緩睜開。
      　　
      　　光的視線起初有些渙散。
      　　
      　　他看了古·拉哈·提亞好一會兒，蔚藍的目光才逐漸聚焦，接著，那雙眼睛忽然冷了下來。
      　　
      　　「誰把你傷成這樣？」
      　　
      　　古·拉哈·提亞怔了一下。
      　　
      　　「什麼？」
      　　
      　　光的視線越過他的肩膀，落向後方。
      　　
      　　「是他嗎？」
      　　
      　　他的聲音很輕，甚至仍帶著失血過多的虛弱，語氣卻冷得沒有一絲溫度。
      　　
      　　古·拉哈·提亞還來不及回頭，光已猛然撐起身體，伸手抓過倒在一旁的長槍。
      　　
      　　「等等，你不能──」
      　　
      　　長槍已經脫手而出，凌厲的破空聲自古·拉哈·提亞耳邊擦過。
      　　
      　　下一瞬，身後傳來刺耳的機械爆炸聲。
      　　
      　　古·拉哈·提亞僵硬地回過頭，一具尚未完全失去機能的魔導兵器正站在他們身後，揚起的利刃距離他的後頸只剩不到半步。
      　　
      　　光擲出的長槍貫穿了它的核心，魔導兵器的身軀劇烈震顫，殘餘的魔力沿著金屬外殼跳動數次，隨即失去了光芒、轟然倒地。
      　　
      　　「沒事了。」光低聲說道。
      　　
      　　話音才落，他支撐著身體的手臂便驟然一軟，古·拉哈·提亞猛地轉回身，正好接住向前倒下的人。
      　　
      　　「光！」
      　　
      　　大片溫熱的液體濺落在他的手背上。
      　　
      　　啪嗒。
      　　
      　　啪嗒。
      　　
      　　方才那個動作徹底撕裂了光腰腹間的傷口，鮮血從破損的護甲下大股湧出，順著身側滴落，很快便染紅了古·拉哈·提亞的雙手。
      　　
      　　他怔怔地望著護甲下的傷口。
      　　
      　　側腰深處甚至還嵌著魔導兵器的殘片，隨著光剛才的動作，尖銳的金屬碎片又往血肉裡陷得更深。
      　　
      　　「你為什麼還要動！」
      　　
      　　古·拉哈·提亞幾乎怒吼出聲。
      　　
      　　光靠在他懷裡，呼吸凌亂，臉上卻沒有多少後悔的神色。
      　　
      　　「我不會讓他傷你的。」
      　　
      　　古·拉哈·提亞的聲音哽住，他咬緊牙關，將所有情緒硬生生壓回去。
      　　
      　　「先別說話。」
      　　
      　　古·拉哈·提亞試著抬起顫抖的手，想凝聚治癒魔法，一點微弱的光芒在掌心閃爍，僅僅持續了一瞬，便像風中的火苗般熄滅了。
      　　
      　　他怔怔看著自己的手，凌亂的呼吸開始顫抖。
      　　
      　　為什麼偏偏在這個時候──
      　　
      　　「拉哈。」
      　　
      　　光撐著眼，輕聲呼喚。
      　　
      　　「抱歉。」
      　　
      　　古·拉哈·提亞咬了咬牙，手臂胡亂地抹過臉，隨後飛快地解開身上的布包。
      　　
      　　不能使用魔法，就用別的方法。
      　　
      　　他翻出僅剩的藥物與繃帶，用力撕開光傷口旁被血黏住的衣料，盡可能清理污物，再將藥粉灑上去。
      　　
      　　光的身體猛然繃緊，口中卻沒有發出任何聲音。
      　　
      　　「忍一下。」古·拉哈·提亞的聲音同樣繃得厲害，「很快就好了。」
      　　
      　　傷口太深，治療杯水車薪。
      　　
      　　藥粉沒有止血的功效，他只能用布壓住傷口，一手固定，另一手艱難地開始纏繃帶，手因力竭而顫抖，動作也不像平時那樣俐落，每當繃帶滑落，他便咬著牙重新拉緊，指尖很快沾滿了光的血。
      　　
      　　但即使如此，血還是一點點滲透繃帶，溫熱的液體順著光的腰側往下流，啪啦啪啦地落在古·拉哈·提亞的手背上。
      　　
      　　「拉哈。」
      　　
      　　光又再次低聲喚他，而古·拉哈·提亞沒有回答。
      　　
      　　他只是重新拉緊繃帶，將它一圈圈纏過光的身體。
      　　
      　　「你在哭嗎？」
      　　
      　　「沒有。」
      　　
      　　古·拉哈·提亞的聲音啞得幾乎聽不清，他低垂著頭，專心一致地包紮。
      　　
      　　「煙……太濃了。」
      　　
      　　光沒有拆穿他。
      　　
      　　古·拉哈·提亞用力打好繃帶的結，又拿出一塊乾淨些的布，壓在仍不斷滲血的位置。
      　　
      　　他的心一點點沉下去。
      　　
      　　過了片刻，光忽然低聲說：「好冷。」
      　　
      　　古·拉哈·提亞渾身震了一下，他立刻扯下自己殘破的外袍，緊緊裹在光身上，又將人抱進懷裡，試圖用自己的體溫驅散那股令人恐懼的寒意。
      　　
      　　「別睡！」
      　　
      　　他的聲音在廢墟間驟然拔高。
      　　
      　　「你聽見沒有？不許閉上眼睛！」
      　　
      　　光勉強睜開眼，臉色蒼白，唇也幾乎沒有血色。
      　　
      　　「我只是……有些累。」
      　　
      　　「那也不可以！」
      　　
      　　他用力地摟住懷裡的人，聲音發顫。
      　　
      　　「你答應過我的！你說過要帶我去很多地方，還有很多景色想讓我看，還有很多路要一起走，你、你不能丟下我……」
      　　
      　　光安靜地聽著，過了一會兒，他輕輕笑了一聲，眼神恢復了一點光輝。
      　　
      　　「我正是想著那些……才活到現在。」
      　　
      　　古·拉哈·提亞怔住。
      　　
      　　光靠在他懷裡，目光落向遠方。
      　　
      　　「每次回去之後……你大概又會坐在桌邊等我。」
      　　
      　　他的聲音很輕，每一個字都像要耗費極大的力氣。
      　　
      　　「明明睏得打瞌睡，卻還要抱著書，聽見我開門，又假裝自己根本沒在等。」
      　　
      　　「……我才沒有，真的是剛好還沒睡。」
      　　
      　　「是、是。」
      　　
      　　古·拉哈·提亞低下頭，將臉藏在光的額髮間，眼淚一絲絲慎入他的髮絲。
      　　
      　　「如果跟你說明天要一起出門……你倒是會興奮地睡不著，整晚都忙著收拾物品……藥、地圖、筆記本……」
      　　
      　　「……準備充分不是什麼壞事。」
      　　
      　　「放不下，就往我包裡塞。」
      　　
      　　光的聲音裡帶著淡淡笑意。
      　　
      　　「不過沒關係，我喜歡替你拿。」
      　　
      　　古·拉哈·提亞抱著他的手更緊了些。
      　　
      　　光的手指動了動，輕輕勾住他的衣袖。
      　　
      　　「拉哈。」
      　　
      　　「我在。」
      　　
      　　「所以我剛剛得動起來，為了這些平凡的日常。」
      　　
      　　他抬起冰冷的手，輕輕碰上古·拉哈·提亞的臉。
      　　
      　　「那才是我想守護的……所以別哭了。」
      　　
      　　「我不是說只是煙太濃了嗎。」
      　　
      　　古·拉哈·提亞蜷起身體，替懷中的人擋住所有的風，一邊艱難地抬起眼，望著遠方的友軍旗幟。
      　　
      　　一起靜靜地等待著救援。
