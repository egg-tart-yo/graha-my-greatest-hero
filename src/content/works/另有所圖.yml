      　　最近，光似乎熱衷於替古·拉哈·提亞綁辮子。
      　　
      　　那天剛起床的他正坐在桌邊準備出門的行囊，身後便忽然多了一道熟悉的氣息。還沒等他回頭，一雙手已經先按住了他的肩膀。
      　　
      　　「別動。」
      　　
      　　「光？怎麼了？」
      　　
      　　古·拉哈·提亞沒明白怎麼回事，下意識想轉頭，隨即又被按了回去。
      　　
      　　然後，古·拉哈·提亞便感覺有人從背後撥起了自己的頭髮。
      　　
      　　一開始他還以為是哪裡沾上了東西，直到梳子的觸感從髮間緩慢滑過，他才終於意識到對方打算做什麼。
      　　
      　　「這、這點事情我可以自己來！怎麼好意思麻煩你……」
      　　
      　　「拉哈。」
      　　
      　　光沒理他，反而把一卷地圖攤到他前方。
      　　
      　　「說明一下今天的路線。」
      　　
      　　「咦？」
      　　
      　　「不是要往北邊走嗎？走哪條路？」
      　　
      　　「啊……這個的話……」
      　　
      　　古·拉哈·提亞的注意力就這麼被帶走了。
      　　
      　　他低下頭展開地圖，指尖沿著標記好的道路緩慢移動。
      　　
      　　「如果照原定計畫，我們會先沿著這條路走到岔口，與委託人碰面。不過最近那附近似乎有精英怪出現的傳聞，我想稍微繞開一些……」
      　　
      　　與此同時，光依然在他身後撥弄頭髮，也不曉得有沒有聽進去。
      　　
      　　等古·拉哈·提亞終於講完整條路線，光也剛好完成了手上的工作。
      　　
      　　「好了。」
      　　
      　　「真的？」
      　　
      　　古·拉哈·提亞感到有點驚奇，沒想到光居然會綁頭髮──但伸手摸了摸後，他的眼睛微微瞇了起來。
      　　
      　　「光……」
      　　
      　　「嗯？」
      　　
      　　身後的應聲聽起來十分滿意，古·拉哈·提亞頓了頓，還是忍不住詢問。
      　　
      　　「這個形狀……好像不是辮子？而且為什麼這邊翹起來了？」
      　　
      　　「不錯吧，看起來很像陸行鳥的尾巴。」
      　　
      　　「……我怎麼覺得這不像是稱讚。」
      　　
      　　古·拉哈·提亞有些無奈，可光只是拎著梳子和地圖，心滿意足地轉身溜走了。
      　　
      　　古·拉哈·提亞望著他幾乎是蹦跳著離開的背影，又抬眼看了看時間，最後也只能默默接受這份已經完成的「傑作」。
      　　
      　　反正只要不影響接下來的冒險就好。
      　　
      　　他這麼安慰自己。沉默片刻後，還是起身走到鏡子前，從旁拿過一塊布，把鏡子嚴嚴實實地蓋了起來。
      　　
      　　從那天開始，事情便莫名其妙地成了習慣。
      　　
      　　晨起的時候，只要古·拉哈·提亞坐下來整理資料，光就會抱著梳子跟地圖、紙張或書跑過來。
      　　
      　　「拉哈，今天的路線怎麼走？」
      　　
      　　古·拉哈·提亞看著被塞進手裡的手稿，又回頭看看十分自然站到自己身後的人，眼睛微微瞇起、望著一臉無辜的光。
      　　
      　　「研究路線應該用不上髮帶？」
      　　
      　　「這是順便。」
      　　
      　　理直氣壯的答案顯然一點說服力都沒有，可古·拉哈·提亞最後仍舊認命地轉了過去。
      　　
      　　反正也不是什麼大事，而且每回結束，光看起來心情都很好。
      　　
      　　光的手其實很巧，動作大多時候也很輕。
      　　
      　　梳子穿過髮絲時，若是不小心勾住髮尾或打結，對方會停下來慢慢解開，手掌托著頭髮的力道也十分輕柔。除了最後完成的造型有時候令人難以理解以外，確實沒有什麼值得抱怨的地方。
      　　
      　　有一次是把兩側細細的髮辮繞到腦後束在一起，另一次則是在原本的辮子上多纏了幾圈品味奇特的裝飾，乍看沒什麼問題，仔細一看卻總覺得哪裡不太對勁。
      　　
      　　每回他踏出房間，桑克瑞德都會偷偷遞來眼神，然後毫不客氣地抖著肩膀。
      　　
      　　有時太誇張，阿莉塞會直接把他的頭髮解開，然後送嘻嘻笑著的光一個拳頭。
      　　
      　　不過，相較於那些古怪的辮子，更令古·拉哈·提亞無奈的，其實是另一件事──光很喜歡趁著替他梳頭時玩他的臉。
      　　
      　　這個樂趣最初只是個意外。某一次光替他束髮時不小心拉得太緊，等察覺不對時，古·拉哈·提亞的眼尾都被扯得微微向後，整雙眼睛幾乎瞇成了一條線。
      　　
      　　身後的貓尾立刻用力拍打起來，明明白白地表示抗議。光見狀卻忍不住笑出聲，也不曉得究竟是在道歉，還是乾脆順勢把這當成了新的樂趣，伸手揉了揉古·拉哈·提亞的眼尾。
      　　
      　　「光──放開我──」
      　　
      　　被揉得臉頰變形，連聲音都含糊了起來。
      　　
      　　「綁累了休息一下。」
      　　
      　　「綁頭髮為什麼還要休息……」
      　　
      　　無奈歸無奈，下一次光再拿著梳子靠近時，古·拉哈·提亞仍然會下意識往前坐一些，替對方留出足夠的位置。

      　　久而久之，連古·拉哈·提亞自己都沒發現，他已經習慣了那雙手摸著後腦杓、穿過自己頭髮的感覺。
      　　
      　　直到某一天，古·拉哈·提亞在吃早餐時，忽然注意到光側邊的頭髮被簡單束了起來，墨黑的髮絲間還混著一縷細細的紅色。
      　　
      　　那看起來不像什麼尋常的裝飾，反倒更像是一小束紅線，被仔細地編進了頭髮裡。
      　　
      　　古·拉哈·提亞盯著看了好一會兒，總覺得那抹顏色莫名熟悉，可東西實在太細，一時也分辨不出究竟是什麼。
      　　
      　　倒是一旁的雅·修朵拉只看了一眼，便像是察覺了什麼，唇邊浮起一抹饒有興味的笑意。
      　　
      　　「嗯？」
      　　
      　　光立刻十分可疑地移開了視線。
      　　
      　　古·拉哈·提亞看看他，又看看雅·修朵拉，仍是一臉茫然。
      　　
      　　「怎麼了？」
      　　
      　　雅·修朵拉掩唇輕笑，若有所思地偏了偏頭。
      　　
      　　「不曉得你有沒有聽說過東方的一項傳統。」她悠悠地說，「有些地方有所謂『結髮』的習俗。」
      　　
      　　古·拉哈·提亞眨了眨眼。
      　　
      　　「結髮？」
      　　
      　　「將彼此的髮絲結在一起，或是貼身保存。」雅·修朵拉看了他一眼，笑意更深了些，「通常是在新婚之時所行的習俗──」
      　　
      　　鏘的一聲，古·拉哈·提亞手中的叉子直接掉回了盤子裡。
      　　
      　　他的尾巴瞬間僵得筆直，連耳朵都跟著高高豎起，熱度則從脖頸一路漫上臉頰，最後連耳尖都染得通紅。
      　　
      　　「新……新婚……？」
      　　
      　　直到這時，某些先前從未被他放在心上的細節，才一下子全串了起來。
      　　
      　　他的梳子早就不知道被光拿走過多少次。後來梳頭這件事乾脆成了對方的工作，他自己更是從沒留意過梳齒間偶爾纏上的那些髮絲最後去了哪裡。
      　　
      　　古·拉哈·提亞猛地轉過頭，身旁的位置卻早就空了，只剩不遠處那扇半掩著的大門還在輕輕晃動。
      　　
      　　「光──！」
      　　
      　　古·拉哈·提亞的聲音一下子拔高。
      　　
      　　「至少解釋一下啊！」
      　　
      　　可門外早已連人影都看不見了。
      　　
      　　古·拉哈·提亞僵在原地半晌，最後只能抬手掩住整張發燙的臉。
      　　
      　　一旁的桑克瑞德看了他一會兒，什麼也沒說，只十分同情地伸手拍了拍他的肩膀。
