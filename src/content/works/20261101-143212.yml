title: 安慰
cp:
  - 拉哈光
  - 光拉哈
updated: 2026-01-01
summary: 無
chapters:
  - body: |-
      　　石之家的門被推開時，古·拉哈·提亞正坐在桌邊看書。他原本只是循著聲音抬了一下眼，隨即便注意到了走進來的人。
      　　
      　　光身上的肩甲與護手上沾著些許塵土，步伐和平時沒有太大不同，臉上的神情卻有些沉重。
      　　
      　　古·拉哈·提亞的目光在他身上停留片刻，本想開口詢問，卻見光已經先一步朝這裡走來。
      　　
      　　英雄什麼也沒說，只拉開他身旁的椅子坐了下來。
      　　
      　　沉重的盔甲發出一聲金屬摩擦的悶響。
      　　
      　　光往椅背上一靠，看似疲憊地閉上了眼睛。
      　　
      　　近日接下的是一樁營救委託。
      　　
      　　富商的孩子遭人綁走，對方索要贖金，談判的過程卻出了意外。等接到委託的光趕到藏匿孩子的地方時，現場已經亂成一團。
      　　
      　　人最後確實平安帶了回來，只是孩子還是受了傷，也不小心讓他看到血肉模糊的場面。
      　　
      　　雖說是為了擊退歹人，但那雙因害怕而顫抖的眼睛，讓光有些不好受。
      　　
      　　回程的路上，他忍不住一次次回想當時的情況，思考能做得更好的地方。細小且揮之不去的自責，就這麼一路被帶了回來。
      　　
      　　光低著頭，看著自己覆著甲片的手，不知不覺出了神，直到過了好一會兒，他才像忽然察覺什麼似地抬起頭。
      　　
      　　古·拉哈·提亞手裡的書已經闔上了。
      　　
      　　貓魅賢人安靜地坐在一旁，一雙紅色的眼睛帶著毫不掩飾的擔心，正望著自己。
      　　
      　　兩人的視線對上，古·拉哈·提亞遲疑了一下，終究還是開口。
      　　
      　　「……發生什麼事了嗎？」
      　　
      　　光沒有回答，臉上的神情依然有些緊繃。古·拉哈·提亞也沒有催他，只稍微側過身，像是在等他願意開口。
      　　
      　　光看了他一會兒，然後伸出手。
      　　
      　　古·拉哈·提亞還沒反應過來，手腕就被光握住了。
      　　
      　　「咦？」
      　　
      　　光拉著他的手，越過兩人之間的距離，最後把那隻手放到了自己頭上。
      　　
      　　古·拉哈·提亞愣了愣，光也沒解釋，只維持著那個姿勢，安靜地閉上了眼睛。
      　　
      　　貓魅眨了眨眼，對方出乎意料的反應讓他有些意外，但手還是小心地落在光的髮頂。他試探性地動了動，發現英雄沒有抗拒的神色，古·拉哈·提亞的表情一下子柔和下來。
      　　
      　　起初動作還有些拘謹，像是不確定該用什麼力道，指尖試探似地順過幾縷頭髮，慢慢放鬆下來。
      　　
      　　他一邊觀察光的神色，手掌一下一下、安靜地撫摸著。
      　　
      　　光微微低下頭。
      　　
      　　隔著髮絲傳來的掌心溫度很溫暖。
      　　
      　　雖然他沒有得到言語的安撫，但奇妙的是，那些一路糾纏著他的念頭，竟真的一點一點沉靜下來。
      　　
      　　光的肩膀漸漸放鬆，連原本緊繃著的眉間也舒展了些。
      　　
      　　就這樣過了一陣子，他終於抬起頭，正打算開口，古·拉哈·提亞的神情卻讓他愣了愣。
      　　
      　　原本滿是擔心的紅色眼睛現在全是亮晶晶的光芒，嘴角也一直微微揚著。大概是怕表現得太明顯，他甚至還刻意抿著唇，可那點笑意根本藏不住。
      　　
      　　尤其光一抬頭，他的手還停在半空中，像是有些捨不得就這麼收回去。
      　　
      　　光盯著他看了幾秒，古·拉哈·提亞似乎這才後知後覺地察覺到了什麼。
      　　
      　　「……怎、怎麼了？」
      　　
      　　被光這麼注視著，古·拉哈·提亞原本還算自然的神情，肉眼可見地僵硬起來。
      　　
      　　「我的臉上有什麼嗎？」
      　　
      　　光搖了搖頭，平靜地說出自己觀察的結論。
      　　
      　　「你看起來很開心。」
      　　
      　　「呃……」
      　　
      　　古·拉哈·提亞一下子噎住了，臉頰可疑地漲紅了起來。
      　　
      　　「那是因為看你似乎好一點了，我當然……」
      　　
      　　他說到一半，聲音便慢慢小了下去，顯然連自己都覺得這個說法沒什麼說服力。
      　　
      　　原本乖乖待在身後的尾巴，開始用力地拍打著椅子。
      　　
      　　光垂下眼，古·拉哈·提亞順著他的視線看過去，急忙猛地按住自己躁動的尾巴。
      　　
      　　「別看！」
      　　
      　　光忍不住輕笑了起來。
      　　
      　　「還真的很開心。」
      　　
      　　被直白地戳破，這下連耳朵都垂了下來。
      　　
      　　沉默了好半晌，他才囁嚅地承認。
      　　
      　　「我只是覺得，這是不是表示……你多少有一點依賴我。」
      　　
      　　「想到這，就有點開心。」
      　　
      　　光看著因難為情而縮成一球的古·拉哈·提亞，笑著搖了搖頭，然後再次伸出手，握住他的手腕。
      　　
      　　垂下的耳朵瞬間動了動。
      　　
      　　「……要繼續嗎？」
      　　
      　　「嗯。」
      　　
      　　古·拉哈·提亞一臉認真地點點頭，再次將掌心覆上光的頭。
      　　
      　　「我會努力的。」
      　　
      　　看著那雙莫名可靠的紅眼，光忍不住噗哧一笑。
