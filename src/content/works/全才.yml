  - body: |-
      　　光從第一世界回來時，除了原定要從水晶塔取回的書籍外，手裡還額外捧著一小份手稿。
      　　
      　　那是他在書架上搜尋時額外發現的一疊紙張，最上方清楚地寫著自己的名字。光原本只打算在回程路上翻翻，卻越發好奇裡面的內容，最終還是在離開水晶塔前席地而坐，將那份手稿攤開。
      　　
      　　封面除了自己的名字外，工整的字跡還寫了幾個關鍵字──戰鬥配置推演。

      　　光盯著那行字，忍不住笑了一下。
      　　
      　　手稿以他最初作為戰士的身份和那人相遇時寫起，鉅細靡遺地分析著古·拉哈·提亞記憶中的光，在戰鬥中是如何迎擊、如何行動。許多連光自己都沒發現的習慣與細節都被記錄了下來，仔細的程度讓光不免懷疑，當年在水晶塔與他並肩作戰的青年，到底是如何一邊拉弓迎戰，一邊認真地觀察自己。
      　　
      　　手稿的下一個段落，是針對他陷入沉睡後，英雄職業的推論。

      　　古·拉哈·提亞列出了許多可能，他依照第八靈災後流傳下來的英雄事蹟裡，試著尋找光往後戰鬥方式的線索。故事搭配細節，有幾頁邊緣擠滿補註，有幾處推論被劃去，旁邊另寫了一個截然不同的猜測。

      　　看到後來，光發現這份紀錄其實並沒有推論出答案。

      　　古·拉哈·提亞似乎也意識到了，他在最後筆觸有些重地寫道，英雄走過的路遠比自己所知的更多、比流傳下來的故事更廣，倘若有一天得以重逢，或許不該預先認定他會拿起哪一種武器。

      　　於是，手稿的內容改成了另一種方向。

      　　防護、治療、進攻，古·拉哈·提亞從三種職責中，各挑選了一項最能配合光戰鬥習慣的職業，分別是騎士、白魔法師與黑魔法師，後面還附著長長的練習紀錄，與第一世界能作為導師的人選清單。

      　　最末頁只有一句簡短的結語。
      　　
      　　無論何種戰鬥，願我都能與他並肩。

      　　光輕輕攏好手中的紙張。
      　　
      　　他明白，這些漫長歲月裡留下來的文字是屬於那人的思念，是他懷念英雄的方式，也是他沒有任何人可以傾訴、卻最為深刻的願望。
      　　
      　　即使在他原本的計畫裡，兩人的相遇不過很短的時間，他依舊為此做足了準備。

      　　胸口暖得發燙，卻又有些酸澀。

      　　光把手稿仔細收好，直到回到石之家，都沒有對古·拉哈·提亞提起這件事。

      　　隔天，拂曉眾人在討論下一趟任務的隊伍組成。
      　　
      　　委託不算棘手，倒是路程有些長，光翻著地圖，聽大家商量補給與出發時間。

      　　「那麼，這次的隊伍該怎麼定呢？」阿爾菲諾問。

      　　光一抬頭，便對上古·拉哈·提亞的目光，那雙紅眼睛從一開始便十分明亮。
      　　
      　　他雖然沒有開口，神情卻已經把話說得明明白白──你儘管選自己擅長的，只要能帶上我，我都能配合。

      　　光看了他一會兒，清了清喉嚨。

      　　「這回大家都有空。」他說，「拉哈，你先選吧。」

      　　「我？」古·拉哈·提亞愣住，「可是以往，不都是根據委託內容，先讓英雄選擇最能發揮的位置──」

      　　「先選你自己喜歡的。」光把地圖往桌子中央推了推，「剩下的位置，大家會補上。」

      　　古·拉哈·提亞一怔，下意識看向其他人。
      　　
      　　尤里安傑朝他露出微笑，桑克瑞德也朝他擠了擠眼睛，連艾斯蒂尼安也只是抱著手臂，示意他快些決定。

      　　他又望回一臉肯定的光，垂頭想了想，隨後有些不好意思地抓了抓頭。
      　　
      　　「那……這次我想選騎士。」
      　　
      　　「那麼我就以星盤支援大家吧。」
      　　
      　　「好耶！阿爾菲諾看家！」
      　　
      　　「為什麼這麼開心啊……」
      　　
      　　不理會身後開始喧鬧的眾人，光依然注視著那雙紅眼，帶著幾分好奇地詢問：「能說說為什麼是騎士嗎？」
      　　
      　　貓耳輕顫了顫，隨後豎了起來，古·拉哈·提亞支支吾吾了半天，但看光一臉平靜的神色，最終還是害羞地坦承道：「因為……法師職業的話，總是離隊伍有點距離吧。」
      　　
      　　他不自覺仰起頭，眼底像是承載比燈火還亮的光。
      　　
      　　「如果是騎士的話，就能在離你最近的位置了。」
      　　
      　　「這不好說，如果你的戰鬥方式跟阿莉塞一樣，可能比夥伴衝得還要前面。」
      　　
      　　「和我一樣是什麼意思你最好解釋清楚！」
      　　
      　　少女仰頭怒視龍騎士的模樣過於滑稽，光與古·拉哈·提亞相互眨眨眼，隨後不約而同地笑了出來。
