summary: 練車集中，無連貫
series: 短篇
chapters:
  - body: |-
      　　光最近對兩人的親密行為，隱隱有了那麼一點意見。
      　　
      　　倒不是說古·拉哈·提亞冷落了光之戰士，反而恰恰相反──只要一個蜻蜓點水的吻，就能輕易勾出貓魅如浪潮的溫柔。無論是炙熱的擁抱，還是綿密的親吻，從來都不是需要刻意索求的事。
      　　
      　　古·拉哈·提亞貼著他的時候，總是微微睜著眼，那雙眼眸裡盛滿專注與沉溺，是勝過任何誓言的告白。
      　　
      　　唯一的問題在於，他實在太過溫柔了。
      　　
      　　眼神澄澈、動作謹慎，對待英雄如同捧著世間脆弱的珍寶。好幾次甚至只要光先一步宣洩出來，那些黏稠滾燙的纏綿就會被對方以「明日還有任務」或「你需要好好休息」為由體貼地收尾。
      　　
      　　即便貓魅自己還忍耐得眼尾發紅。
      　　
      　　都說逐日之民會坐擁眾多伴侶，偏偏他的提亞自始至終都只專情一個人。光一點都不介意被對方當成十個甚至五十個伴侶那樣狠狠索求，甚至曾半開玩笑說過「英雄的體力與耐力就是該用在這種地方」。
      　　
      　　但那句話只有換來滿臉漲紅、羞得尾巴僵直的貓魅，一邊語無倫次地大喊「你、你到底都在說些什麼啊」，一邊手忙腳亂地捂住光的嘴。
      　　
      　　該怎麼讓他明白呢？
      　　
      　　他想要看見這個總是將英雄奉為一切、小心翼翼克制本能的貓魅，為自己徹底失控的模樣。
      　　
      　　冒險者的生命向來伴隨刺激與危險、鮮血與傷痕。與古·拉哈·提亞的親暱固然填滿了他的內心，但對於早已習慣生死交關所帶來刺激的身體而言，總覺得無法被那過分端正的尊重滿足。
      　　
      　　多一點、再更渴求一點，他想要更直白、更混亂的交融。
      　　
      　　為了這件事，光甚至曾壓低斗篷，在酒館的角落暗暗聽著那些醉漢吹噓的床第葷話，一邊沉思該怎麼撕開這隻害羞大貓的自制力。
      　　
      　　比如現在的方式，就是他在酒館聽來的。
      　　
      　　光望著眼前毛茸茸的耳朵，毫不猶豫地伸出舌，將喘息的熱氣送了進去，又從根部舔吻著耳廓的軟肉。
      　　
      　　「唔……！」
      　　
      　　古·拉哈·提亞倒抽一口氣，原本扶在光腰側的手指猛然收緊，尾巴也緊繃得豎起。還沒等他開口抗議，下身被插著的穴口竟也在同一時間縮起，帶著近乎蠻橫的力道，將長著倒刺的硬挺吞得更深。
      　　
      　　敏感的耳尖與體內的溫熱同時夾擊，貓魅的神經瞬間繃到了極致，撐在光身上的手臂也不自覺地用力，臂膀遍佈浮起的青筋。
      　　
      　　「光……別、別這樣……」古·拉哈·提亞的嗓音發著啞，整張臉連帶著耳廓都泛著紅，「太緊了……你會受傷，放鬆一點……」
      　　
      　　「受傷？」
      　　
      　　光低低笑出了聲，雙腿順勢盤上了對方的後腰。他將腳踝交差扣起，隨後抬起自己的腰、胯部用力向上一頂，硬是將埋在體內的炙熱又往深處擠壓。
      　　
      　　性事持續到現在，貓魅甚至都捨不得完完全全進入自己。
      　　
      　　無奈的英雄輕喘著氣，伸手擁抱住他。
      　　
      　　「我想被你填滿。」光湊到那發燙的耳朵旁，含住尖端的柔軟，唇齒細細摩挲，「進到最深的地方……不管是你、還是你射出來的東西。」
      　　
      　　這句話讓古·拉哈·提亞的呼吸一滯。
      　　
      　　他低頭看向光，那雙紅色瞳眸裡的情緒翻湧得厲害──有被激起的情慾，有深藏的無奈，更有被所愛之人毫無保留索求時難以遏止的熾熱。
      　　
      　　「這麼說……太狡猾了。」他低啞著嗓子埋怨，「這樣等等要是想喊停，我可不會輕易答應喔。」
      　　
      　　雖然嘴上說得是頗有氣勢的警告，但落下來的吻依然帶著貓魅刻在骨子裡的溫存。古·拉哈·提亞低下頭，珍視無比地吻住光的唇，細細密密地啄過唇瓣各處，將所有的挑釁慢慢化作來不及吞嚥的唾沫。
      　　
      　　下身的動作卻開始變了。
      　　
      　　分身慢慢退往穴口，僅留下冠狀部位後再次用力挺進，精準地碾磨著最深處的敏感點。倒刺在刮過內壁時留下劇烈的疼痛，與從尾椎處同時直衝而來的酸麻感，讓光的後背猛地弓起，指尖瞬間扯緊了身下的床單。
      　　
      　　「唔……哈啊……！」
      　　
      　　抑制的喘息與額角滲出的薄汗，滴落在光泛紅的鎖骨上。
      　　
      　　古·拉哈·提亞拉過光的一隻手，十指扣壓在枕側，一雙背著光源的紅眼逐漸銳利了起來，亮得驚人。
      　　
      　　他的英雄啊，還真是不曉得自己到底忍耐得多辛苦。
      　　
      　　律動的頻率逐漸加快，淫糜又令人臉紅心跳的肉體拍打聲混雜著滿室的低喘，分不清是誰的透明體液自兩人交合的穴口噴灑出來，在床單留下深淺不一的水漬。
      　　
      　　「拉哈……太深了……等、等一下……」
      　　
      　　混雜著哭腔的求饒，也沒有停止貓魅固執地頂弄著最承受不住的那一點。
      　　
      　　畢竟他也有屬於自己的小小貪婪──光對自己的渴求、身下的人完全打開的身體、只有自己能看見的這一面──全都想要得不得了。
      　　
      　　是用生命愛著的人啊。
      　　
      　　快感如浪潮般一波接著一波堆疊。恍惚間，腹部傳來一陣滾燙的溫度，古·拉哈·提亞眨了眨模糊的眼，這才發現光的分身在毫無撫慰的狀況下就這麼射了出來。
      　　
      　　濃稠的白濁順著腹部曲線混入恥毛中，他硬生生停下了動作，正打算退出發熱又柔軟的身體，光卻再次縮緊了後穴，緊緻溫熱的通道用盡全力挽留還發硬的分身。
      　　
      　　儘管還在高潮後的不適期，光的一雙濕潤藍眼所傳達的堅持卻十分明顯。
      　　
      　　古·拉哈·提亞的心頭軟得快要化開，眼眶發熱的他俯下身，對光一陣又親又抱，嘴裡黏黏糊糊地喚著英雄的名字，尾巴也繞上了濕黏的小腿。
      　　
      　　啊啊，怎麼辦，好喜歡，感情多得快滿出來了。
      　　
      　　這麼好的英雄，真的是自己可以私自抱在懷裡的嗎。
      　　
      　　這下真的……停不下來了。
      　　
      　　「拉哈……」
      　　
      　　催促的軟膩聲啞得不成樣子。貓魅的眼神暗了下來，隨後就著兩人相連的姿勢，將光整個人翻了過去。
      　　
      　　「──！」
      　　
      　　無聲的尖叫從悶著的被褥裡傳出，古·拉哈·提亞的那點小得意隨著聲音煙消雲散。他慌忙俯下身，鼻樑輕輕碰著光的臉頰，仔細觀察泛起薄霧的藍眼。
      　　
      　　強烈的刺激讓光根本說不出話，但絞緊的後穴傳來的陣陣痙攣卻出賣了他。看著那雙渙散失神的眼睛，古·拉哈·提亞一怔，心口的滿足感逐漸翻湧起來。
      　　
      　　他低頭咬上那截泛紅光裸的後頸，柔韌的腰部同時用力一挺，讓兩人的胯部終於緊密相連，再無任何距離。
  - body: |-
      　　後背傳來的炙熱溫度，隔著所剩無幾的布料深深烙進皮膚裡。
      　　
      　　光的視野正對著臥室裡的書牆，被情慾浸染的藍眼卻早已無法辨別書架正上方那本顯眼的紅色書籍，是屬於貓魅的筆記，還是自己的探索記錄。
      　　
      　　既然看不清，光索性仰起頭，後腦順勢沉入古·拉哈·提亞的肩窩。
      　　
      　　貓魅從不疏於鍛鍊的臂膀將他圈在懷裡，連同紅色的長尾也一同纏上了腰，尾尖悄悄鑽入上衣的空隙，在衣物間撐起一小塊凸起，逐漸朝側腹探尋而去。

      　　古·拉哈·提亞的手可以翻閱古籍、可以持劍架盾，當然也可以擁抱他的英雄，緊扣在腰間的掌心卻正在微微顫抖。光不用回頭看也知道，害羞得無以復加的古·拉哈·提亞此刻一定頂著紅得不像話的臉，恐怕連毛茸茸的柔軟耳朵都燙得驚人。
      　　
      　　「光……做嗎？」
      　　
      　　腦海裡還迴盪著方才那句帶著顫音的低啞詢問。
      　　
      　　那彷彿是鼓足了畢生的勇氣，才從內心最深處擠出來的聲音。
      　　
      　　而滾燙又灼人的心意，輕易地讓他放下所有防備，就這麼順從地被那雙小心翼翼的手抱進懷裡，跨坐上大腿，將整個後背毫無防備地靠進他的胸膛。
      　　
      　　光甚至能感受到古·拉哈·提亞劇烈的心跳，透過貼緊的後背直直地撞擊著，彷彿將身體的主人那些羞於說出的話，劇烈地、毫無保留地傳達出來。
      　　
      　　喜歡、害羞、欣喜、手足無措。
      　　
      　　為什麼這麼緊張呢？光忍不住想笑。
      　　
      　　明明是深愛的兩人做著再正常不過的事情──就算彼此都是初次，光的腦內卻早已在多次撫慰自己的時刻，將粗糙的手掌幻想成貓魅少了許多薄繭的柔軟掌心。
      　　
      　　只可惜，他的大貓咪或許比自己想像得純情許多。
      　　
      　　古·拉哈·提亞甚至在身體相貼的瞬間，將腰胯微微向後縮了縮，帶著幾分笨拙的克制，生怕那早已膨發、滾燙得驚人的慾望抵到光的臀縫，被他察覺出自己的失態。
      　　
      　　好險，即使這麼害羞又苦苦隱忍，拉開衣物繫帶的手卻並未退縮。微涼的空氣與手掌一同探了進去，與繞著腰的長尾一同讓光陷入越來越沉淪的擁抱。
      　　
      　　同一時間覆上來的，是貓魅細細密密舔吻著脖頸的軟舌。
      　　
      　　從耳後一路熨過、吮吸著光偏過頭露出的側頸，舌尖離開後在皮膚上留下炙熱的濕意，卻在溫度盡散之前，滾燙的雙唇又再次覆了上來。一次又一次、彷彿怎樣都親不夠似地不斷疊加，如同無數個日夜裡積累的情感與牽絆，細細密密地交織在一起，早已密不可分。
      　　
      　　好燙、好熱，空氣彷彿都變得稀薄起來，但光一點也不想離開這個懷抱。
      　　
      　　衣襟早已滑落肩頭，露出大片在昏暗中泛白的胸膛，正在前胸撫弄的手開始向下游移，小心地解著光的褲頭。
      　　
      　　古·拉哈·提亞的動作慢極了，向內探入的手將布料往兩側拉扯、擴大了空間，避免粗糙的邊緣磨疼了英雄彈出的慾望。過度的溫柔讓人難以分辨他究竟是在撩撥情慾，還是在小心翼翼地對待一個一觸即碎的藝術品。
      　　
      　　「拉哈……」
      　　
      　　難耐的光忍不住抬起手，牽起貓魅一瞬間因驚嚇而僵硬的手背，引導著往下身探去。
      　　
      　　掌心貼上滾燙性器的瞬間，耳邊立刻傳來一聲驚慌的嗚咽聲，隨後，一個發燙的腦袋重重撞上了自己的肩膀，埋進了他的頸窩裡。
      　　
      　　光憑著頸側傳來的驚人熱度，就知道古·拉哈·提亞的臉此刻燒得有多紅，甚至連另一隻原本還在撫弄他胸前的手，都因為這突如其來的觸碰而慌得忘了自己的任務，僵硬地懸在半空中，指尖微微蜷縮著，完全不知該往哪裡放才好。
      　　
      　　有色無膽？用這個詞形容他或許也不太對，畢竟古·拉哈·提亞可是光所認識最勇敢、最堅定的人……
      　　
      　　好吧。
      　　
      　　光在心底無聲地嘆了口氣，嘴角卻忍不住微微上揚。
      　　
      　　或許在情愛這件事上──更準確地說，在與「光」有關的事情上，他的貓魅確實會變得謹慎，也笨拙了許多。
      　　
      　　於是他側過頭，用臉頰輕蹭了蹭埋在自己肩頭的紅髮，帶著幾分故意的央求語氣，再一次輕聲喚了貓魅的名字。
      　　
      　　這聲低喚或許沒能驅散古·拉哈·提亞的羞赧，卻成功讓纏繞在腰間的尾巴倏地動了起來。
      　　
      　　毛茸茸的尾尖悄悄地、慢慢地繞上硬挺的前端，柔軟順滑的毛髮不偏不倚地停在正分泌著透明黏液的鈴口處，輕輕地試探敏感的頂端。
      　　
      　　「唔……！」
      　　
      　　如同羽毛搔癢般的細微麻感，比起直接用手握住帶來的刺激還要讓人覺得難耐。
      　　
      　　光沒來由地回想起，在兩人初次牽手之前，貓魅的尾巴也是這樣小心翼翼、輕輕地戳弄著自己的掌心。毛茸茸的尾尖總是早一步將溫暖與意圖悄悄遞了上來，試探著光的反應。
      　　
      　　也許古·拉哈·提亞的尾巴，比他本人還坦率得多。
      　　
      　　仰著頭的光呼吸徹底亂了節奏，眼尾泛起一抹潮紅，已經完全顧不得自己此刻的模樣有多狼狽。放聲低吟的同時，身旁那隻僵硬的手也終於找回了意志，握著硬挺的手指越收越緊，生澀卻逐漸掌握節奏，開始上下套弄起來。
      　　
      　　撫弄著前端的紅色尾尖逐漸沾滿或白或透明的濕黏體液，濕漉漉地、散發著腥羶的氣味──光知道他的大貓咪總是花費不少心力在打理自己的毛髮，而此刻的情景，卻彷彿是自己親手弄髒了貓魅最寶貝的心血。
      　　
      　　似乎是察覺到了光那一瞬間的走神，身後傳來了低沉而沙啞的安撫。
      　　
      　　「不要緊的，光……」
      　　
      　　帶著細小倒刺的舌尖輕輕舔過他的耳廓，將這句充滿包容的聲音一同送進了他的耳裡。
      　　
      　　英雄輕輕顫慄，理智的最後一絲防線徹底斷裂。
      　　
      　　再也忍耐不住的光伸手往後探去，手指順著貓魅緊實的腰線滑下，拇指勾住對方的褲頭，粗魯地向下扯動。
      　　
      　　「等等、光？！」
      　　
      　　身後的貓魅顯然被他這突如其來的舉動嚇了一跳，聲音裡滿是驚慌失措。
      　　
      　　太快了嗎？光不這麼認為，甚至還想反問始終隱忍著的貓魅──等了這麼久，還能再等嗎？
      　　
      　　於是光學著他方才的語氣，低聲回應：「不要緊的，拉哈。」與此同時，身體也跟著動了起來。
      　　
      　　隨著大幅度地側轉，光終於在昏暗的光線中，第一次看清了古·拉哈·提亞此刻的表情。
      　　
      　　那張總是帶著溫潤笑意的臉龐，此刻紅得簡直快要滴出水來，連眼眶都泛著濕潤的水氣，甚至羞恥得不敢與光對視。他緊緊垂著那對毛茸茸的耳朵，嘴唇開開合合，緊張又微弱地做著最後的確認。
      　　
      　　「光，你真的願意跟我……」
      　　
      　　彷彿直到現在，古·拉哈·提亞依然不敢相信，自己憧憬的英雄居然接受他的擁抱。
      　　
      　　事到如今，還說什麼傻話呢。光看著他這副模樣，心底湧上一股既無奈的暖流。
      　　
      　　如果不允許、如果不曾動心，又為什麼會一次又一次在感受到目光時回過頭來、一直與你同行至今呢？
      　　
      　　光沒有再多做言語上的解釋，他一向喜歡用行動做出回答。
      　　
      　　拇指乾脆利落地將古·拉哈·提亞的長褲與所有束縛一併卸了下來，釋放出那即將貫穿自己的慾望。在一手攬住對方脖頸、將那張紅透的臉拉近的同時，光向後探著的手扶住炙熱的分身，對準根本沒來得及擴張的穴口，毫不猶豫地狠狠坐了下去。
      　　
      　　撕裂的劇痛貫穿身體的瞬間，光覺得自己一定是瘋了。
      　　
      　　腦內疼得一片空白，他不確定自己是否發出了痛苦的呻吟，回過神來，只看見那雙溢滿慌亂與心疼的紅眼緊緊地注視著他。古·拉哈·提亞顧不得先前的羞赧，雙手慌忙用力托住光輕輕顫抖的腰側，不讓他再繼續往下坐。
      　　
      　　「光！你真的是……太亂來了……！」溫柔的嗓音居然還帶上了慍怒，但儘管如此，安撫的啄吻依然小心地落在藍眼的眼角，一點點地舔去溢出的淚水。
      　　
      　　見古·拉哈·提亞滿臉不捨，宛如寧可是自己承受疼痛般的複雜神情，光卻依然固執地扯出一抹安撫的笑，氣息不穩卻堅持地問道：「拉……哈……舒服嗎……？」
      　　
      　　貓魅發出一聲低啞的嘆息，隨後無奈地向前傾身、收緊雙臂，將他的大英雄嚴嚴實實地圈進懷裡。
      　　
      　　「真是的……都已經是什麼時候了，你還在問這種問題……！」埋在頸窩裡的悶聲帶著疼痛的嘆息，卻再次惹出光的輕笑。
      　　
      　　他早就知道了。
      　　
      　　早在發現那雙紅眼裡不僅僅是單純的憧憬時，光便已經篤定，這隻貓魅注定會徹底栽在自己手裡，拿他的英雄毫無辦法。
      　　
      　　所以不肯罷休的光再次垂下頭，用唇瓣摩挲著柔軟的貓耳，執著地追問：「舒服嗎……？」
      　　
      　　頸肩呼出的嘆息彷彿要將他灼傷。
      　　
      　　沉默維持在兩人之間很久、很久，久到貫穿體內的肉刃所造成的不再僅有疼痛，而是開始從深處傳來陣陣酸脹與麻癢。最後，貓魅終於極小、極小幅度地點了點頭，紅色的髮絲掃過光的鎖骨，窸窸窣窣地撓著。
      　　
      　　「只要是光的……我都喜歡……」微弱的聲音艱難地反問：「那你呢……？」
      　　
      　　而英雄的回答就是粗魯地握住自己的分身，將上頭濕濕黏黏的透明液體留在貓魅精壯的小腹，隨後拉開距離的他又伸長手，撈過一旁濕漉漉的紅色長尾，在古·拉哈·提亞怔著的目光下湊到唇邊，舔過自己分泌出的腥羶水漬。
      　　
      　　那一瞬間，光看見那雙豎起的貓瞳驟然向外擴張。
      　　
      　　古·拉哈·提亞原本阻止他往下坐的掌心，此刻迅速地向上游移，虎口轉而扣住腰側，柔軟的耳尖也頂開了光的下顎，然後毫不客氣地咬上了他脖頸凸起的喉結。
      　　
      　　英雄原本得意的輕笑，瞬間被猛烈往深處頂弄的動作撞成斷斷續續的呻吟。那雙原本浸滿羞赧與慌亂的雙眼，隨著身下一次比一次沉重的侵入，逐漸褪去了所有理智，轉化為最原始、毫不掩飾的渴望。
      　　
      　　天旋地轉間，光被用力地放倒在柔軟的床鋪上。昏暗的燈光隨著兩人交疊搖晃的身軀一明一滅，視野裡的一切都在劇烈晃動，唯一不變的，僅有上方那雙鎖住自己的紅瞳。
      　　
      　　光實在愛極了那副失去理智、如同野獸般的瞳孔。
      　　
      　　所以……偶爾亂來一點也沒關係吧，即使有些勉強自己也無所謂吧。
      　　
      　　你一定會接住我的，不是嗎？
