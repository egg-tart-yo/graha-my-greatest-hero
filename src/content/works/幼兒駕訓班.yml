  - body: |-
      　　光最近對兩人的親密行為，隱隱有了那麼一點意見。
      　　
      　　倒不是說古·拉哈·提亞冷落了光之戰士，反而恰恰相反──只要一個蜻蜓點水的吻，就能輕易勾出貓魅如浪潮的溫柔。無論是炙熱的擁抱，還是綿密的親吻，從來都不是需要刻意索求的事。
      　　
      　　古·拉哈·提亞貼著他的時候，總是微微睜著眼，那雙眼眸裡盛滿專注與沉溺，是勝過任何誓言的告白。
      　　
      　　唯一的問題在於，他實在太過溫柔了。
      　　
      　　眼神澄澈、動作謹慎，對待英雄如同捧著世間脆弱的珍寶。好幾次甚至只要光先一步宣洩出來，那些黏稠滾燙的纏綿就會被對方以「明日還有任務」或「你需要好好休息」為由體貼地收尾。
      　　
      　　即便貓魅自己還忍耐得眼尾發紅。
      　　
      　　都說逐日之民會坐擁眾多伴侶，偏偏他的提亞自始至終都只專情一個人。光一點都不介意被對方當成十個甚至五十個伴侶那樣狠狠索求，甚至曾半開玩笑說過「英雄的體力與耐力就是該用在這種地方」。
      　　
      　　但那句話只有換來滿臉漲紅、羞得尾巴僵直的貓魅，一邊語無倫次地大喊「你、你到底都在說些什麼啊」，一邊手忙腳亂地捂住光的嘴。
      　　
      　　該怎麼讓他明白呢？
      　　
      　　他想要看見這個總是將英雄奉為一切、小心翼翼克制本能的貓魅，為自己徹底失控的模樣。
      　　
      　　冒險者的生命向來伴隨刺激與危險、鮮血與傷痕。與古·拉哈·提亞的親暱固然填滿了他的內心，但對於早已習慣生死交關所帶來刺激的身體而言，總覺得無法被那過分端正的尊重滿足。
      　　
      　　多一點、再更渴求一點，他想要更直白、更混亂的交融。
      　　
      　　為了這件事，光甚至曾壓低斗篷，在酒館的角落暗暗聽著那些醉漢吹噓的床第葷話，一邊沉思該怎麼撕開這隻害羞大貓的自制力。
      　　
      　　比如現在的方式，就是他在酒館聽來的。
      　　
      　　光望著眼前毛茸茸的耳朵，毫不猶豫地伸出舌，將喘息的熱氣送了進去，又從根部舔吻著耳廓的軟肉。
      　　
      　　「唔……！」
      　　
      　　古·拉哈·提亞倒抽一口氣，原本扶在光腰側的手指猛然收緊，尾巴也緊繃得豎起。還沒等他開口抗議，下身被插著的穴口竟也在同一時間縮起，帶著近乎蠻橫的力道，將長著倒刺的硬挺吞得更深。
      　　
      　　敏感的耳尖與體內的溫熱同時夾擊，貓魅的神經瞬間繃到了極致，撐在光身上的手臂也不自覺地用力，臂膀遍佈浮起的青筋。
      　　
      　　「光……別、別這樣……」古·拉哈·提亞的嗓音發著啞，整張臉連帶著耳廓都泛著紅，「太緊了……你會受傷，放鬆一點……」
      　　
      　　「受傷？」
      　　
      　　光低低笑出了聲，雙腿順勢盤上了對方的後腰。他將腳踝交差扣起，隨後抬起自己的腰、胯部用力向上一頂，硬是將埋在體內的炙熱又往深處擠壓。
      　　
      　　性事持續到現在，貓魅甚至都捨不得完完全全進入自己。
      　　
      　　無奈的英雄輕喘著氣，伸手擁抱住他。
      　　
      　　「我想被你填滿。」光湊到那發燙的耳朵旁，含住尖端的柔軟，唇齒細細摩挲，「進到最深的地方……不管是你、還是你射出來的東西。」
      　　
      　　這句話讓古·拉哈·提亞的呼吸一滯。
      　　
      　　他低頭看向光，那雙紅色瞳眸裡的情緒翻湧得厲害──有被激起的情慾，有深藏的無奈，更有被所愛之人毫無保留索求時難以遏止的熾熱。
      　　
      　　「這麼說……太狡猾了。」他低啞著嗓子埋怨，「這樣等等要是想喊停，我可不會輕易答應喔。」
      　　
      　　雖然嘴上說得是頗有氣勢的警告，但落下來的吻依然帶著貓魅刻在骨子裡的溫存。古·拉哈·提亞低下頭，珍視無比地吻住光的唇，細細密密地啄過唇瓣各處，將所有的挑釁慢慢化作來不及吞嚥的唾沫。
      　　
      　　下身的動作卻開始變了。
      　　
      　　分身慢慢退往穴口，僅留下冠狀部位後再次用力挺進，精準地碾磨著最深處的敏感點。倒刺在刮過內壁時留下劇烈的疼痛，與從尾椎處同時直衝而來的酸麻感，讓光的後背猛地弓起，指尖瞬間扯緊了身下的床單。
      　　
      　　「唔……哈啊……！」
      　　
      　　抑制的喘息與額角滲出的薄汗，滴落在光泛紅的鎖骨上。
      　　
      　　古·拉哈·提亞拉過光的一隻手，十指扣壓在枕側，一雙背著光源的紅眼逐漸銳利了起來，亮得驚人。
      　　
      　　他的英雄啊，還真是不曉得自己到底忍耐得多辛苦。
      　　
      　　律動的頻率逐漸加快，淫糜又令人臉紅心跳的肉體拍打聲混雜著滿室的低喘，分不清是誰的透明體液自兩人交合的穴口噴灑出來，在床單留下深淺不一的水漬。
      　　
      　　「拉哈……太深了……等、等一下……」
      　　
      　　混雜著哭腔的求饒，也沒有停止貓魅固執地頂弄著最承受不住的那一點。
      　　
      　　畢竟他也有屬於自己的小小貪婪──光對自己的渴求、身下的人完全打開的身體、只有自己能看見的這一面──全都想要得不得了。
      　　
      　　是用生命愛著的人啊。
      　　
      　　快感如浪潮般一波接著一波堆疊。恍惚間，腹部傳來一陣滾燙的溫度，古·拉哈·提亞眨了眨模糊的眼，這才發現光的分身在毫無撫慰的狀況下就這麼射了出來。
      　　
      　　濃稠的白濁順著腹部曲線混入恥毛中，他硬生生停下了動作，正打算退出發熱又柔軟的身體，光卻再次縮緊了後穴，緊緻溫熱的通道用盡全力挽留還發硬的分身。
      　　
      　　儘管還在高潮後的不適期，光的一雙濕潤藍眼所傳達的堅持卻十分明顯。
      　　
      　　古·拉哈·提亞的心頭軟得快要化開，眼眶發熱的他俯下身，對光一陣又親又抱，嘴裡黏黏糊糊地喚著英雄的名字，尾巴也繞上了濕黏的小腿。
      　　
      　　啊啊，怎麼辦，好喜歡，感情多得快滿出來了。
      　　
      　　這麼好的英雄，真的是自己可以私自抱在懷裡的嗎。
      　　
      　　這下真的……停不下來了。
      　　
      　　「拉哈……」
      　　
      　　催促的軟膩聲啞得不成樣子。貓魅的眼神暗了下來，隨後就著兩人相連的姿勢，將光整個人翻了過去。
      　　
      　　「──！」
      　　
      　　無聲的尖叫從悶著的被褥裡傳出，古·拉哈·提亞的那點小得意隨著聲音煙消雲散。他慌忙俯下身，鼻樑輕輕碰著光的臉頰，仔細觀察泛起薄霧的藍眼。
      　　
      　　強烈的刺激讓光根本說不出話，但絞緊的後穴傳來的陣陣痙攣卻出賣了他。看著那雙渙散失神的眼睛，古·拉哈·提亞一怔，心口的滿足感逐漸翻湧起來。
      　　
      　　他低頭咬上那截泛紅光裸的後頸，柔韌的腰部同時用力一挺，讓兩人的胯部終於緊密相連，再無任何距離。
