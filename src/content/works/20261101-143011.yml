  - title: 光篇
    body: |-
      　　半夜裡，古·拉哈·提亞忽然睜開了眼。
      　　
      　　房間裡很安靜，只剩窗外偶爾傳來的風聲，以及身旁平穩緩慢的呼吸。
      　　
      　　他愣愣地坐起身，還沒完全從睡意裡清醒過來，腹部便先一步傳來一陣格外清晰的聲響。
      　　
      　　咕嚕嚕──
      　　
      　　古·拉哈·提亞低下頭，盯著自己的肚子看了一會兒。
      　　
      　　……餓了。
      　　
      　　一旦察覺，要忽視它再次入睡，似乎有點困難。
      　　
      　　他下意識轉頭看向身旁。
      　　
      　　光還睡得很熟，皺皺的被子拉到胸前，整個人陷在柔軟的枕頭裡，呼吸均勻，看起來絲毫沒有要醒來的跡象。
      　　
      　　古·拉哈·提亞望了他片刻。
      　　
      　　要是現在把人叫醒，光大概也不會生氣，甚至只要自己說一句肚子餓了，對方說不定真的會揉著眼睛爬起來，問他想吃什麼。
      　　
      　　可也正因為如此，他才不想這麼做。
      　　
      　　古·拉哈·提亞在黑暗中搖了搖頭。
      　　
      　　他輕輕掀開被子，捲在前方的尾巴小心不掃到身旁的英雄，躡手躡腳地摸下了床。
      　　
      　　房門被悄悄推開，又悄悄闔上。
      　　
      　　一路摸到餐廳時，古·拉哈·提亞還覺得這件事應該不難。
      　　
      　　找點能吃的東西、填飽肚子、再回去睡覺。
      　　
      　　然而當他打開儲放食材的櫃子，望著裡頭那些瓶瓶罐罐與尚未處理的食材時，便很快陷入了沉默。
      　　
      　　肉與蔬菜應有盡有，香料、奶油、麵粉，甚至還有他叫不太出名字、卻記得光曾經用過的材料。
      　　
      　　問題在於，他不怎麼擅長料理。

      　　古·拉哈·提亞在櫃子前站了好一會兒，最後只能默默伸手，從角落摸出一塊乾巴巴的麵包。
      　　
      　　「……至少可以直接吃。」
      　　
      　　他捧著那塊麵包坐到桌邊。
      　　
      　　只是才咬了一小口，腦海裡卻不受控制地浮現出了其他東西。
      　　
      　　光曾經做過的漢堡。
      　　
      　　剛煎好的肉排夾進鬆軟的麵包裡，還帶著熱氣，醬汁會順著指尖往下流。
      　　
      　　還有燉得軟爛的肉。
      　　
      　　鍋蓋一掀開，香氣一下子便整間屋子都是，美味到即使是湯汁，和麵包沾著吃都十分滿足。
      　　
      　　以及剛起鍋的捲心麵。
      　　
      　　熱騰騰的，冒著白煙，光每次都會在端上桌以前先嘗一口，確認味道之後才推到他面前。
      　　
      　　古·拉哈·提亞低頭看看手裡的乾麵包，忽然有些討厭起自己不受控制的腦袋。
      　　
      　　多虧方才那些回憶，手中的麵包更難吃了。
      　　
      　　明明他以前連賢人麵包都能面不改色地吃下去。
      　　
      　　應該說，那時候根本不會特別在意吃進嘴裡的是什麼，只要足以補充體力，不至於讓身體拖累行程，味道究竟如何，向來都不是值得費心的事。
      　　
      　　可是不知道從什麼時候開始，一切都變了。
      　　
      　　或許是和光一起旅行之後。
      　　
      　　吃慣了對方遞來的熱食，習慣了有人在宿營時問一句「今天想吃什麼」，也習慣了抱住腿坐在桌邊搖晃，偷偷嗅著鍋邊傳出來的香氣。
      　　
      　　過慣了這樣的生活，現在的他居然連一塊麵包都嫌棄起來。
      　　
      　　古·拉哈·提亞盯著那塊麵包，耳朵慢慢垂了下去。
      　　
      　　「……真是有點糟糕。」
      　　
      　　他小聲說。
      　　
      　　半夜的石之家十分寂靜，自然沒有人回答。
      　　
      　　古·拉哈·提亞雖然肚子還餓著，但卻失了食慾，他蜷起腿，將下巴靠在膝上。
      　　
      　　他忽然間覺得，在這麼安靜的夜裡，一個人坐在餐桌旁，想著那些平時理所當然存在的事物時，胸口竟莫名生出了一點空落落的感覺。
      　　
      　　他把腿抱得更緊了一些。
      　　
      　　下一刻，背後悄無聲息地貼上了一陣溫熱。
      　　
      　　一雙手從黑暗中環了過來。
      　　
      　　古·拉哈·提亞嚇了一跳，還沒回頭，熟悉的聲音便帶著濃濃的睡意，貼在他耳邊響起。
      　　
      　　「……怎麼一個人坐在這？」
      　　
      　　光的頭髮睡得亂七八糟，有幾撮甚至翹到了奇怪的方向，眼睛也只勉強睜開一半。
      　　
      　　他就這樣從後面抱著古·拉哈·提亞，臉幾乎靠在對方肩上。
      　　
      　　「睡不著嗎？」
      　　
      　　古·拉哈·提亞張了張嘴，還沒來得及回答，肚子就傳來一陣咕嚕聲。
      　　
      　　兩人同時安靜了一下。
      　　
      　　光眨了眨眼，低頭看向聲音傳來的地方，然後了然地笑出聲。
      　　
      　　「肚子餓了？」
      　　
      　　古·拉哈·提亞的耳朵往後壓了些。
      　　
      　　「……嗯。」
      　　
      　　「怎麼不叫醒我？」
      　　
      　　光鬆開手，繞到他面前。
      　　
      　　古·拉哈·提亞看了看他那張明顯還沒睡醒的臉，有點難為情地答道。
      　　
      　　「怎麼能因為這種事情吵醒你。」
      　　
      　　「我就找點東西吃，很快就會回去。」
      　　
      　　光的目光落到桌上，注視著那塊被咬了幾口便放在一旁的麵包，好奇地偏了偏頭。
      　　
      　　「但你也沒把它吃完。」
      　　
      　　古·拉哈·提亞沉默了下來。
      　　
      　　他低頭盯著自己的膝蓋看了好一會兒，尾巴在椅腳旁輕輕晃了一下。
      　　
      　　最後帶著像是豁出去般的表情抬起頭。
      　　
      　　「光。」
      　　
      　　「嗯？」
      　　
      　　「我現在即將要講很任性的話。」
      　　
      　　光愣了一下，隨即站直身體，雙手往腰上一插，笑著看他。
      　　
      　　「你說。」
      　　
      　　古·拉哈·提亞一本正經地望著他。
      　　
      　　「請你醒來之後，一定要忘記這些東西。」
      　　
      　　光偏了偏頭，嘴角已經明顯揚起弧度。
      　　
      　　「我視情況決定。」
      　　
      　　「怎麼這樣……」
      　　
      　　古·拉哈·提亞的耳朵更垂了。
      　　
      　　他望著光，眼睛在昏暗的燈光裡亮亮的，神情裡難得帶著幾分近乎無措的窘迫。
      　　
      　　「以前，我自己吃賢人麵包的時候，從來不覺得有什麼。」
      　　
      　　光忍著笑，認真聽著。
      　　
      　　「填飽肚子就足夠了。味道也好、口感也好，都不是很重要的事。」
      　　
      　　古·拉哈·提亞停頓了一會兒。
      　　
      　　「可是……自從跟你一起冒險以後，好像就不行了。」
      　　
      　　古·拉哈·提亞視線左右游移著。
      　　
      　　「感覺胃口……被養大了。」
      　　
      　　光終於沒忍住，笑出了一點聲音。
      　　
      　　古·拉哈·提亞弱弱地瞪了他一眼。
      　　
      　　「……現在半夜餓醒，看著這塊麵包，我腦袋裡想的全是你做過的東西。」
      　　
      　　他越說越小聲。
      　　
      　　「漢堡、燉肉，還有捲心麵……最後就覺得……我現在只想吃你做的食物。」
      　　
      　　這些話已經耗盡一個餓著肚子的貓魅所有力氣，他直接把臉埋進自己的膝間，連耳朵都藏不住地垂在兩側。
      　　
      　　「……講出來真的好丟臉，我一定是餓昏頭了。」
      　　
      　　光看著眼前縮成一團的古·拉哈·提亞，笑著搖了搖頭。
      　　
      　　「這有什麼好丟臉的。」
      　　
      　　古·拉哈·提亞悶著聲音說：「因為聽起來很任性。」
      　　
      　　「哪有這種事。」
      　　
      　　光伸出手，本來像是要拍拍他的頭，結果手掌到了半途，忽然改了方向，掌心偷偷往古·拉哈·提亞的腰間一探，接著摸了一把他的肚子。
      　　
      　　古·拉哈·提亞猛地抬起頭，尾巴嚇得膨成一叢。
      　　
      　　「光？！」
      　　
      　　英雄若無其事地收回手。
      　　
      　　他低頭打量著古·拉哈·提亞那個幾乎摸不到半點贅肉的腹部，十分認真地點了點頭。
      　　
      　　「我還有很多努力空間。」
      　　
      　　古·拉哈·提亞愣住。
      　　
      　　「什麼？」
      　　
      　　「沒事。」
      　　
      　　「等等、光，我沒有聽懂。」
      　　
      　　「不用懂。」
      　　
      　　光已經轉身走向一旁，順手拎起掛著的圍裙。
      　　
      　　古·拉哈·提亞還坐在椅子上，一臉困惑地看著他把圍裙套上，又隨手將亂翹的頭髮往後撥了兩下。
      　　
      　　「你要做什麼？」
      　　
      　　光回過頭，另一隻手已經拎起一旁的鍋子。
      　　
      　　「給我的貓魅做點好吃的，然後把他拎上床，再抱著睡覺。」
      　　
      　　古·拉哈·提亞的耳朵一下子豎了起來。
      　　
      　　光那雙藍眼睛在夜色裡顯得格外明亮，含著笑意望向他。
      　　
      　　「做點煎餅怎麼樣？」
      　　
      　　古·拉哈·提亞站起身，搖搖晃晃地走到光的身邊，伸出手一把抱住他。
      　　
      　　埋在身體裡的悶悶聲音，讓英雄笑彎了眼睛。
      　　
      　　「只要是你做的，都好。」
      　　
      　　「好。」
  - title: 貓篇
    body: |-
      　　光是在半夜裡痛醒的。
      　　
      　　起初只是手臂深處一陣一陣的抽痛，像有人拿著細針在尚未癒合的地方輕輕扎著。等他真正從睡夢裡清醒過來，那股刺痛已經慢慢變成了難耐的癢。
      　　
      　　上回被蛇鳥攻擊的傷口正在結痂。
      　　
      　　這原本應該是件好事，無奈傷口癒合時的麻癢比起疼痛還折磨，又不能碰或抓，只能忍過這段時間，等皮膚慢慢長好。
      　　
      　　光慢慢坐起身，低頭看了一眼被繃帶纏得嚴嚴實實的手。
      　　
      　　偏偏這時，空空的肚子也跟著響了起來。
      　　
      　　光蹙起眉，懊悔著晚上就不該聽信阿爾菲諾的建議，什麼身上有傷的人不能吃海鮮，而把香噴噴的烤魷魚讓給艾斯蒂尼安。
      　　
      　　現在倒好，這個時間，他上哪找東西吃。
      　　
      　　光無聲地嘆了口氣。
      　　
      　　就在他輕手輕腳想下床時，身旁卻先有了動靜。
      　　
      　　古·拉哈·提亞的耳朵輕輕一動，隨後睜開了眼睛，只是顯然還沒有完全清醒，紅眼只勉強睜開一條縫，神情也還帶著濃濃的睡意。
      　　
      　　手卻已經十分熟練地往床邊一撈。
      　　
      　　繃帶、藥膏，以及清理傷口用的鑷子與棉布，全被他一股腦地抓了過來。
      　　
      　　「怎麼了……？」
      　　
      　　古·拉哈·提亞迷迷糊糊地坐起身，聲音裡還帶著剛睡醒的沙啞。
      　　
      　　「到換藥的時間了嗎……？」
      　　
      　　光看著他反射性想揉臉，又顧著捧好工具的模樣，一時間哭笑不得。
      　　
      　　「沒事，你繼續睡。」
      　　
      　　古·拉哈·提亞眨了兩下眼睛，努力讓自己清醒一點。
      　　
      　　「那你怎麼起來了？」
      　　
      　　光有些尷尬地笑了笑。
      　　
      　　「只是手有點痛……而且也有點餓，想找東西吃。」
      　　
      　　隨著他的話語，古·拉哈·提亞原本還有些迷濛的眼神一點點清醒了過來。
      　　
      　　他伸手攔住光，耳朵輕輕一抖，又自信地拍了拍胸口。
      　　
      　　「我來。」
      　　
      　　他放下手中的工具，拎起枕間的髮繩，熟練地綁起身後半長的頭髮。
      　　
      　　「你手正在恢復，不要勉強。」
      　　
      　　光眨了眨眼睛。
      　　
      　　「沒那麼脆弱，你乖乖睡。」
      　　
      　　「要是傷口又裂開了，阿莉塞會哭喔。」
      　　
      　　見光還想反駁，古·拉哈·提亞一本正經地宣告：「我可能也會喔。」
      　　
      　　光看著他還有些睡亂的頭髮，以及睡袍下方輕輕晃動的尾巴，忍不住笑了起來。
      　　
      　　「好。」
      　　
      　　於是兩人一前一後走出房門。
      　　
      　　深夜的石之家很安靜，只有腳步聲在走廊裡輕輕響著。
      　　
      　　到了餐廳，古·拉哈·提亞先點亮了燈，又回頭看了一眼光受傷的手。
      　　
      　　「你坐著就好。」
      　　
      　　他轉身走到存放食材的櫃子前，蹲下身在裡頭翻找，尾尖在身後輕輕搖晃。
      　　
      　　「想吃什麼？」
      　　
      　　背對著光，看不見正在喃喃自語的貓魅是什麼表情，不過他的兩耳卻微微扁了一些。
      　　
      　　「雖然在你這麼厲害的烹飪師面前，我做的東西可能是獻醜……」
      　　
      　　光忍不住笑出聲，那對耳朵壓得更扁了些。
      　　
      　　「才不會。」
      　　
      　　看著古·拉哈·提亞的背影，光的腦海突然冒出一個東西。
      　　
      　　「我現在想吃的東西，只有你能做。」
      　　
      　　「我？」
      　　
      　　古·拉哈·提亞回過頭，明顯有些困惑。
      　　
      　　「嗯。」
      　　
      　　光想起很久以前的事。
      　　
      　　想起在第一世界的公館，桌上竹籃裡擺放著的食物。
      　　
      　　「三明治。」
      　　
      　　古·拉哈·提亞睜大眼睛。
      　　
      　　「……三明治？」
      　　
      　　「嗯。」
      　　
      　　光笑著點頭。
      　　
      　　「就是你在第一世界時準備的那個。」
      　　
      　　古·拉哈·提亞站在原地沒動，耳尖卻以肉眼可見的速度紅了起來。
      　　
      　　「不不、不是……等等……」他慌亂地揮著手，「你怎麼知道那是我做的？不、應該說，那不一定是我做的……是公館的人幫忙準備的……」
      　　
      　　光沒理會古·拉哈·提亞的辯解──畢竟他很清楚，貓魅這個反應就是默認了。
      　　
      　　他微微笑著，自顧自地說下去。
      　　
      　　「有時候我會突然想起那個味道。」
      　　
      　　「……」
      　　
      　　「雖然不是什麼很珍貴的食材，但總是想再吃一次。」
      　　
      　　「……光。」
      　　
      　　「嗯？」
      　　
      　　古·拉哈·提亞垂著耳朵，低下頭。
      　　
      　　「……你再講下去，我會害羞。」
      　　
      　　光故作模樣地清了清喉嚨，雖然嘴角還是可疑地勾著。
      　　
      　　「那就吃這個，可以嗎？」
      　　
      　　古·拉哈·提亞的尾巴在身後輕輕晃了一下，過了一會兒，他才終於點點頭，臉上還帶著沒完全褪去的紅。
      　　
      　　「那……」
      　　
      　　古·拉哈·提亞低聲說。
      　　
      　　「那我就準備那個吧。」
      　　
      　　光默默地坐在椅子上，看著貓魅忙碌起來的背影，思緒不知不覺飄向了更遙遠的地方。
      　　
      　　在那個殘酷、失去了黑夜的世界裡，他們隔著交錯的時間再次相會，一路走過許多艱難與離別，費盡千辛萬苦，才終於換回如今這算不上平穩，卻足夠歡快熱鬧、還能看著眼前人好好待在自己身邊的日子。
      　　
      　　想到這裡，光心底便慢慢泛起一股暖意。就連稍早還又痛又癢、惹得人心煩的傷口，似乎也變得沒那麼難熬了。
      　　
      　　過了一會兒，古·拉哈·提亞端著盤子走過來。
      　　
      　　他把三明治放到光面前，努力裝著若無其事。
      　　
      　　「不曉得味道還跟當時一不一樣。」
      　　
      　　光看了一眼，單手拿起後便大口咬了下去。
      　　
      　　古·拉哈·提亞坐在對面，雙手無意識地搓了搓圍裙，緊張地觀察他的反應。
      　　
      　　見他只顧著吃，半晌沒有開口，古·拉哈·提亞終究還是忍不住問道。
      　　
      　　「……怎麼樣？」
      　　
      　　光抬眼看他，塞滿食物的臉頰股成兩球。
      　　
      　　「不太一樣。」
      　　
      　　兩耳扁了下去。
      　　
      　　「比以前更好吃。」
      　　
      　　耳朵又瞬間立了起來。
      　　
      　　「真、真的？」
      　　
      　　那雙明亮的眼睛閃爍著不確定，光索性伸長手，將自己咬了口的三明治也遞了過去。
      　　
      　　「不信你吃吃看。」
      　　
      　　「那怎麼行！」
      　　
      　　古·拉哈·提亞連忙搖著頭。
      　　
      　　「這是給你準備的，要是不夠吃怎麼辦？」
      　　
      　　「但你也得記住這個味道。」
      　　
      　　光朝他擠了擠眼睛，又晃了晃手上的三明治。
      　　
      　　「我下次還想吃。」
      　　
      　　聞言，貓魅的臉紅得像顆蘋果。
      　　
      　　在光堅持的眼神下，他手撈著側髮，很克制地咬了一小口。
      　　
      　　光滿意地笑了。
