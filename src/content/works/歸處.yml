  - body: |-
      　　夜已經很深了。
      　　
      　　燈火一盞一盞暗下去，只剩零星幾扇窗還亮著暖黃的光，風從高處穿過迴廊，帶來一點夜晚的涼意，吹得披風邊角輕輕晃動。
      　　
      　　古·拉哈·提亞找到你的時候，你正坐在一處很少有人經過的階梯上。
      　　
      　　外表沒有受傷，身上也沒有血跡，武器好端端地放在手邊。白天該做的事情你一件也沒有少，委託完成了、該幫的人幫了，路上甚至還停下來替一個找不到母親的小孩指了方向。
      　　
      　　看起來和平常沒有任何不同。
      　　
      　　當古·拉哈·提亞走近時，他最先做的，也只是停在幾步之外。
      　　
      　　「……原來你在這裡。」
      　　
      　　你抬眼看他。
      　　
      　　「找我？」
      　　
      　　「嗯。」他笑了一下，「算是吧。」
      　　
      　　他沒有問你為什麼一個人坐在這裡，也沒有問是不是發生了什麼，只是在得到你沒有拒絕的默許後走過來，挨著你旁邊坐下。
      　　
      　　階梯不算寬，他的肩膀離你很近，近到風再次微微吹拂時，你能感覺到他衣角擦過自己的手臂。
      　　
      　　兩個人就這樣坐了一會兒。
      　　
      　　古·拉哈·提亞很少這麼安靜。
      　　
      　　至少，在只有你們兩人的時候，他總有許多事情可以對你說。可能是今天在書裡讀到的趣聞，可能是某種他覺得你會喜歡的食物，也可能只是很久以前，你們曾一起經歷過的一場冒險。
      　　
      　　但今晚，他什麼都沒說，只是這麼靜靜地陪著你。
      　　
      　　直到你低聲開口。
      　　
      　　「拉哈。」
      　　
      　　「嗯？」
      　　
      　　「你不問嗎？」
      　　
      　　他轉頭看你。
      　　
      　　「問什麼？」
      　　
      　　你沉默了一下。
      　　
      　　其實你自己也不知道。
      　　
      　　問你怎麼了，問你是不是不高興，問你為什麼明明什麼都沒發生，卻連呼吸都覺得疲倦。
      　　
      　　那些問題在腦子裡繞了一圈，最後只剩一句很含糊的話。
      　　
      　　「……我今天心情不太好。」
      　　
      　　古·拉哈·提亞眨了一下眼，然後很輕地應了一聲。
      　　
      　　「這樣啊。」
      　　
      　　他依然沒有追問。
      　　
      　　你忽然覺得有點鼻酸，大概是因為這個反應太過平常了。
      　　
      　　你是拯救過世界的人，是無數人口中的英雄，是連最絕望的時候都能繼續往前走的人。
      　　
      　　可在他眼裡，英雄今天心情很差，這件事也是可以被允許的。
      　　
      　　古·拉哈·提亞低頭想了想，忽然站起身。
      　　
      　　「等我一下。」
      　　
      　　你還沒來得及問，他已經快步跑走了。
      　　
      　　沒過多久，那道紅色的身影便重新出現在迴廊另一端，手裡多了兩個杯子。
      　　
      　　他把其中一杯遞給你，一邊仔細叮囑。
      　　
      　　「小心，有點燙。」
      　　
      　　你接過來，發現杯子裡是熱牛奶，加了一點蜂蜜。
      　　
      　　「……你特地去弄這個？」
      　　
      　　「我本來想找些更厲害的東西。」古·拉哈·提亞在你身邊重新坐下，有些不好意思地抓了抓臉，「但現在很晚，廚房的人大多都休息了，我不太好意思把人叫起來。」
      　　
      　　你低頭喝了一口，溫度剛剛好，淡淡的甜味慢慢散開，順著喉嚨一路暖進胃裡。
      　　
      　　「好喝嗎？」
      　　
      　　看見你點點頭，古·拉哈·提亞立刻笑了。
      　　
      　　那個笑容很小，卻像是完成了一件相當了不起的事。
      　　
      　　也確實了不起，畢竟他的熱牛奶可是為了拯救這個世界的英雄。
      　　
      　　你看著他，忽然說：「可是喝完這個，我可能還是不會開心。」
      　　
      　　「嗯，那也沒關係。」
      　　
      　　他回答得毫不猶豫。
      　　
      　　你怔了怔，像是在好奇他怎麼不會感到落寞。
      　　
      　　古·拉哈·提亞雙手捧著自己的杯子，望向遠處微弱的燈火。
      　　
      　　「因為有些時候，壞心情不是喝一杯甜的東西就會消失的吧。」他的聲音很輕，「也不是睡一覺，明天就一定會變好。」
      　　
      　　微風把他紅色的髮絲吹亂了一點。
      　　
      　　「有些日子，就是會很糟。」
      　　
      　　「明明沒有發生足以讓人崩潰的大事，卻好像什麼都提不起精神，平常不在意的事情會變得很刺眼，別人無意間的一句話也可能一直留在心裡。」
      　　
      　　他停了一下，垂眼看著杯中的牛奶。
      　　
      　　「甚至連自己都會懷疑，為什麼我要為這種事情不開心呢，卻沒辦法控制。」
      　　
      　　你沒有說話，也沒有否認他的話語。
      　　
      　　古·拉哈·提亞卻笑了笑。
      　　
      　　「但是我覺得……今天沒有變好，也沒有關係。」
      　　
      　　他語氣肯定地說著。
      　　
      　　「因為『今天』已經過完了。」
      　　
      　　很簡單的一句話，你卻怔住了。
      　　
      　　「早上起來，吃東西、出門，做完該做的事，和別人說話，一直走到現在。」
      　　
      　　古·拉哈·提亞一件一件數著。
      　　
      　　「忙碌了一日，終於能靜下心來坐在這裡，喝著一杯其實沒什麼特別的蜂蜜牛奶。」
      　　
      　　他彎起眼睛，笑得十分溫暖。
      　　
      　　「這一天很糟，但你還是把它走完了。」
      　　
      　　你的胸口忽然像被什麼輕輕撞了一下，彷彿是一種很久沒有被注意到的疲憊，突然被人發現，還伸手碰了碰它。
      　　
      　　你低下頭，拇指輕輕劃過杯緣。
      　　
      　　過了一會兒，你才小聲喚道。
      　　
      　　「拉哈。」
      　　
      　　「嗯。」
      　　
      　　「如果明天也很糟呢？」
      　　
      　　這一次他想了很久，然後，他把自己的杯子放到一旁。
      　　
      　　「那明天晚上，我再來找你。」
      　　
      　　「如果後天還是很糟的話，那我就天天來。」
      　　
      　　你的視線落在他身上，古·拉哈·提亞忽然有些不好意思，耳朵輕輕動了一下。
      　　
      　　「當、當然，我也不是說我一定有辦法讓你開心。」
      　　
      　　「我可能會說一些很無聊的話，沒準備到你想吃的東西，也不一定每次都知道該怎麼安慰你。」
      　　
      　　他的聲音慢慢低下來。
      　　
      　　「但是陪著你……這件事，我想我還是做得到的。」
      　　
      　　風又吹了過來，不曉得是不是蜂蜜牛奶的緣故，竟不覺得冷。
      　　
      　　你放下杯子，慢慢將額頭靠在他的肩上。
      　　
      　　古·拉哈·提亞的尾巴在身後慌亂地晃了一下，最後又像怕驚擾你似地安靜下來，默默捲在一旁。
      　　
      　　「……光？」
      　　
      　　「借我靠一下。」
      　　　
      　　「啊，好的。」
      　　
      　　他立刻坐直，過於認真的回話讓你忍不住笑出聲。
      　　
      　　古·拉哈·提亞的耳朵微微垂了些，卻還是固執又可靠地挺直了身軀。
      　　
      　　你忍不住在內心想著，他的肩膀靠起來真穩固。
      　　
      　　過了很久，你感覺有什麼東西輕輕覆上自己的手。
      　　
      　　是古·拉哈·提亞的手，他沒有握住你，只是把手放在這個位置，像是在告訴你，如果需要的話，它就在這裡。
      　　
      　　於是你慢慢把手翻過來，手指碰到他的掌心。
      　　
      　　下一秒，他便小心地握住了，掌心的溫度很暖，毫無保留地傳了過來。
      　　
      　　「拉哈。」
      　　
      　　「嗯？」
      　　
      　　「謝謝你。」
      　　
      　　他沉默了一會兒，笑著搖了搖頭。
      　　
      　　「不需要謝我。」他的拇指很輕地蹭過你的手背，「我只是想陪你而已。」
