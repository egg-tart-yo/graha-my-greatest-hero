  - title: 上篇
    body: |-
      　　桑克瑞德推開石之家的大門後，先是訝異於大夥兒居然都在，隨即又敏銳地察覺到氣氛不太對勁。

      　　先不說紅著眼眶的少女與怔愣著的少年，連靠在雙子後方牆邊的艾斯蒂尼安都眉頭深鎖。而另一桌，背對著他的古·拉哈·提亞雖然看不見神情，光是低垂著的貓耳，就足以看出對方也深受打擊。

      　　桑克瑞德沉默著，與眉毛微微抽動的尤里安傑交換了一個眼神，隨後放下懷抱著的雙手，走到現場唯一還保持平靜神色的雅·修朵拉面前，用「請說明」的眼神盯著她。

      　　後者手一揮，桑克瑞德這才發現桌上正放著一封拆開的信件。

      　　信上的蜂蠟紋飾他有印象，正是來自伊修加爾德，而她接下來所說的話，則讓他震驚地瞪大眼，忍不住按住額頭，揮手打斷貓魅的說明。

      　　「等等、先等一下……」他難以置信地確認：「你是說，伊修加爾德的議長為了鞏固政權，居然想找艾奧澤亞的英雄締結婚約？」

      　　「明智的抉擇。」

      　　雅·修朵拉的神情平靜，語調卻有些寒冷。

      　　「先不論她對龍詩戰爭的意義，單憑英雄在各國的人脈與影響力，聯姻就是最快的做法。」她放下手中的茶杯，微微一笑，「面對內亂時，尋求外援作為壓制，會是相當有效的威脅手段。」

      　　桑克瑞德沉默了半晌，又忍不住舉起手。

      　　「那我再確認一下，議長就是──」

      　　「啊，是艾默里克。」

      　　「但這八成不是那傢伙的主意。」

      　　艾斯蒂尼安出聲補充，他的神色與聲音一樣低沉。

      　　「大概是議院的意見。壓制不住正教一派，就盡出些鬼點子。」

      　　「那些都不重要！」阿莉塞縮在椅子上，大聲抗議：「哪個國家沒有不服從的聲音！這本來就是領導者該想辦法面對的事情，對吧！阿爾菲諾！」

      　　「嗯……」

      　　被妹妹點名的年輕精靈看起來依然有些發愣，和平時意氣風發的模樣截然不同。他雖然試圖維持語氣平穩，其中的顫抖卻無情地出賣了發話者的情緒。

      　　「或許我們可以再一次前往伊修加爾德，看看有沒有能幫得上忙的地方。」

      　　「噢，然後順便參加他們兩人的婚禮？真是順路。」

      　　「不……我不是這個意思……」

      　　桑克瑞德選擇忽略角落裡吵成一團的兄妹，畢竟他心中最大的疑問尚未得到解答。

      　　「但這種邀約，婉拒不就得了嗎？」他困惑地問：「以往也不是沒有發生過這種事。畢竟英雄那麼受歡迎，但只要──」

      　　「她答應了。」

      　　「……啊？」

      　　桑克瑞德這下是真的震驚了。

      　　他快步趕到垂耳的貓魅身旁，忍不住抓住他的肩膀。

      　　「你、你是說她──」

      　　「覺得只是形式上的伴侶，她不在意。」

      　　古·拉哈·提亞的目光望向角落，桑克瑞德這才發現，他們討論的主角早就靜靜倚著角落的屏風，雙手抱胸地站在那裡。陰影並沒有掩去她臉上的不解，反倒讓那份神情多了幾分難以言喻的陰沉。

      　　桑克瑞德覺得自己的頭開始微微抽痛。

      　　他緩步走到光的身側，認真地提出建議。

      　　「你先冷靜聽我說，這種問題通常有很多種解決方式，不一定非得犧牲你……」

      　　「我不覺得這是犧牲。」

      　　光的一雙眼睛在陰影裡亮得驚人。桑克瑞德覺得自己快要扛不住那道視線了，只可惜英雄並沒有察覺對方的耐受度已經瀕臨極限，只是堅定地重申：「我要喜歡誰，跟婚約沒有絕對的關係。那只是鞏固政權的手段之一。」

      　　感受到身後氣氛微妙地轉變，甚至還泛起一陣細小的騷動，桑克瑞德想了想，還是決定完全不要回頭。

      　　畢竟他很害怕談話的重點會從勸說光回心轉意，變成探究英雄的心上人到底是誰。

      　　「不，跟英雄結婚肯定會是艾奧澤亞的大事，你應該也不想應付那些流言蜚語吧。」

      　　「連你也這麼想嗎？」

      　　眼見他的立場與眾人相同，光的一雙藍眼瞬間溢滿失望，過於鮮明的情緒讓青年原本想繼續勸阻的喉嚨一緊，竟一句話也說不出來。

      　　不要用那種眼神看我！

      　　桑克瑞德忍無可忍地在心中哀號，而光也在同時輕嘆了口氣。

      　　「我知道了。」

      　　英雄的語氣聽起來並不開心，她單手抄起放在一旁的大劍，背到背上後，便逕自往門口走去。

      　　「我回絕就是了。」

      　　「等等！」

      　　跟隨英雄而去的，還有驚慌失措的紅髮貓魅。尤里安傑無奈地走到捂著臉蹲在地上的桑克瑞德身旁，安撫似地拍了拍他的肩膀。
  - title: 下篇
    body: |-
      　　古·拉哈·提亞最終在喪靈鐘外的一處廢棄營地找到了她。
      　　
      　　貓魅趕到時，此處早已被夷為平地，空地上滿是打鬥過後的痕跡，和武器刨開地面所翻起的大片泥土，奄奄一息的夜蟾蜍遍佈道路兩旁，而營地中央，背對著他的英雄靜靜站著，背後的大劍被周圍的結晶映出冷冽的光。
      　　
      　　古·拉哈·提亞吞了吞口水，最終還是鼓起勇氣走到光的身邊，而早已聽見腳步聲的英雄沒有回頭，只是靜靜望向遠方，望著水晶塔所在的方向。
      　　
      　　良久，她悶悶的聲音總算傳來。
      　　
      　　「你們一定覺得我在胡鬧。」
      　　
      　　「大家只是擔心你。」
      　　
      　　古·拉哈·提亞心中有太多疑問想問，卻還是暫時壓了下來，他望著眼前仍在氣頭上的英雄，放輕聲音道：「大家只是不希望你總是把自己放在最後。你已經為許多人做了太多事，也該多為自己想一點。」
      　　
      　　聽見他的話，光總算將目光從水晶塔移開，靜靜凝視著古·拉哈·提亞，貓魅原以為會在那雙藍眼裡看見未熄的怒火，卻訝異地發現，她眼底只有一片沉靜而深遠的憂傷。
      　　
      　　光輕輕地嘆了口氣。
      　　
      　　「我只是想保護那個地方。」她低落地說：「治理國政、維護政權什麼的，我一點都不擅長……但伊修加爾德……那可是──」
      　　
      　　──奧爾什方犧牲自己才保全的地方。
      　　
      　　話一出，古·拉哈·提亞的眼神微微一凝，原本壓在心底的諸多疑問，也在瞬間煙消雲散。
      　　
      　　身為始終注視著光的人，他怎麼會不曉得那名英勇的騎士在英雄內心的份量。
      　　
      　　光並沒有察覺古·拉哈·提亞神情的變化。她只是垂下頭，像是在自言自語，又像是在向誰傾訴。
      　　
      　　「在拂曉走投無路的時候，是伊修加爾德接納了我們。」她吸了吸鼻子，輕聲說道：「我只是想幫忙。」
      　　
      　　古·拉哈·提亞幾乎沒有看過光如此挫敗的樣子。
      　　
      　　那些自己沒有經歷的過去，貓魅認為自己無從做任何評斷，也不應說些漂亮話將傷痛抹平。
      　　
      　　於是他只是伸出手，輕輕握住光的手臂，試圖將一點溫度傳遞給她。

      　　「別擔心。」

      　　光抬起頭，對上古·拉哈·提亞溫暖的笑容。

      　　「你別忘了還有我，還有阿爾菲諾，大家都會一起想辦法的。」
      　　
      　　「……真的嗎？」
      　　
      　　「當然。」古·拉哈·提亞彎起眼睛，語氣刻意放得輕快了些，「好歹我也算是見證了水晶都的建立與成長，雖然歷史遠比不上伊修加爾德悠久就是了。」

      　　聽見他半開玩笑的口吻，光眼底總算恢復了些許光芒，也燃起一點好奇。

      　　「在諾弗蘭特的時候，你也遇過需要聯姻才能保護大家的情況嗎？」

      　　「怎、怎麼突然這麼問……」

      　　突如其來的問題讓紅色的貓耳瞬間立了起來。古·拉哈·提亞垂下眼，眼神微微柔和，像是陷入某段遙遠的懷念。
      　　
      　　「第一世界的政權間為了爭奪人類生存的資源，對立很嚴重，特別是跟游末邦……所以還真沒出現過這種狀況。」
      　　
      　　見光一臉『原來如此』的神情，貓魅淡淡一笑，將視線投注遠方。
      　　
      　　「何況，人們都知道我有等待的人，所以沒有人提議過。」
      　　
      　　「等待的人？」
      　　
      　　光偏著頭，滿是好奇與疑惑的眼睛明亮地望著他，古·拉哈·提亞卻沒有解釋的意思，只是溫柔地笑了笑，隨後將手放上英雄的頭，輕輕揉了揉。

      　　「什麼啊，這是在把我當小孩嗎，水晶公爺爺。」

      　　光不滿地咕噥著，古·拉哈·提亞卻笑得更深了。

      　　「比起這些，我倒覺得伊修加爾德有一件只有光才能辦到的事。」

      　　「真的？」

      　　英雄的眼睛一下子亮了起來，像是方才壓在心上的陰霾終於被撥開一角，她立刻繞到貓魅面前，緊盯著他，臉上清清楚楚寫著『快告訴我』。

      　　古·拉哈·提亞神秘地眨了眨眼，只說了一個字。

      　　「龍。」

      　　「什麼？」

      　　光皺起眉，認真思考了一會兒，隨後蹲下身打開自己的隨身包，將幻龍的小小分身從包裡拎了出來。

      　　「你是說米德加爾德？可是他睡了好久，我根本叫不醒他。」

      　　古·拉哈·提亞終於忍不住笑出聲，連忙制止她。

      　　「不是這個。」

      　　他輕咳一聲，重新將話題拉回正軌。

      　　「你還記得伊修加爾德人民真正改變看法的轉折點嗎？就是英雄騎著龍，降落在大廣場的那一刻。」

      　　「啊！」

      　　光恍然大悟，原本低落的神情徹底被驅散。她興奮地站起身，迅速收拾好自己的行囊，一手背好武器，另一隻手則握住古·拉哈·提亞的手腕，拉著他便往前跑。

      　　「那我們快去找維德佛尼爾吧！」

      　　她回過頭，眼睛亮得像是映進了滿地水晶的光。

      　　「這次把大家都帶上，應該也能幫到艾默里克吧！」

      　　英雄重新恢復活力、自由奔跑在前方的模樣實在太過耀眼。

      　　古·拉哈·提亞被她拉著往前，怔怔凝視著她的背影。那道背影曾經無數次出現在他的記憶與夢裡，無論是在遙遠的過去，還是在漫長等待的盡頭，都明亮得令人移不開眼。

      　　片刻後，他也跟著露出微笑。

      　　「嗯。」他輕聲回應，「一定會的。」
