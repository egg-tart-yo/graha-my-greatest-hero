      　　離開塔姆·塔拉墓園時，天色已經完全亮了起來。
      　　
      　　晨光從黑衣森林茂密的枝葉間漏下來，落在潮濕的泥土與苔蘚上。墓園入口那股陰冷腐敗的氣味仍若有似無地追在身後，直到走出好一段距離，林間尋常的蟲鳴重新浮現，光才鬆下緊繃的肩膀。
      　　
      　　他的手仍牽著古·拉哈·提亞。
      　　
      　　他也不確定究竟是什麼時候牽上的，只是看見墓園深處那道瘋狂而又可憐的身影時，胸口忽然泛起一陣沉悶，讓他下意識想確認身旁的人是否還好好地跟著自己。回過神來時，手已經握住了對方。
      　　
      　　他們一路穿過那些陰濕的墓道，四周滿是死者留下的痕跡，偶爾還得跨過散落的殘骸與破碎石棺，擊退那些渴求完好身體與靈魂的執念碎片。
      　　
      　　古·拉哈·提亞沒有放開光的手，任由他靜靜地牽著。
      　　
      　　光一路都很安靜，古·拉哈·提亞自然察覺到了。
      　　
      　　他沒有催促，只配合光稍慢的步伐走在身旁。兩人踩過林間柔軟的落葉，偶爾有風穿過樹梢，將遠處墓園入口垂掛的枯藤吹得沙沙作響。
      　　
      　　剛才看見的那些東西仍留在腦中。
      　　
      　　那名女子、那些被扭曲的屍骸，還有一個人因為無法接受摯愛的死亡，最後把自己逼向毀滅的道路。
      　　
      　　光低著頭看了片刻兩人交握的手，然後忽然開口。
      　　
      　　「拉哈。」
      　　
      　　「如果今天死的是我……你會怎麼做？」
      　　
      　　古·拉哈·提亞的腳步停了下來。
      　　
      　　光也跟著停住。
      　　
      　　但話出口的瞬間，他忽然意識到自己似乎不該這麼問。
      　　
      　　若只是普通地談論死亡，這或許稱不上多麼奇怪的問題。
      　　
      　　但自己身邊的人，是古·拉哈·提亞，是那個曾經親眼見過沒有自己的未來，也曾經背負著那個未來漫長地活下去的人。
      　　
      　　對於他來說，英雄的死亡並不是一場惡夢，而曾是一個真實存在過的世界。
      　　
      　　光張了張口，尷尬地道歉。
      　　
      　　「抱歉。我沒想到──」
      　　
      　　「不。」
      　　
      　　古·拉哈·提亞輕聲打斷了他。
      　　
      　　他沒有立刻回答。
      　　
      　　只是垂下眼，看著兩人仍然牽在一起的手。
      　　
      　　過了很久，他才像是在斟酌著一句連自己都不願承認的答案一般，低低開口。
      　　
      　　「坦白說……」
      　　
      　　「真的再次迎來那天，我還是不打算接受。」
      　　
      　　光抬眼看他。
      　　
      　　古·拉哈·提亞勉強笑了一下，與以往明亮的笑容不同，是悠遠深長、又苦又澀的勉強弧度。
      　　
      　　「光是想像，我的腦內就開始浮現過去那些知識。」
      　　
      　　「回朔時間、跳躍世界、靈魂的存在方式……這些理論，我從來不曾忘記。」
      　　
      　　他頓了一下。
      　　
      　　「有了這些，我就可以驅動水晶塔，然後想辦法把你要回來。」
      　　
      　　那句話被他說得很平靜。
      　　
      　　正因為平靜，光反而沒有質疑這份答案的真實性。
      　　
      　　因為古·拉哈·提亞曾經這麼做過。
      　　
      　　為了把一個已經死去的人重新帶回世界，他和許多人一起耗費了漫長的歲月。
      　　
      　　在那個失去光之戰士的時代裡，人們仍然記得那個名字。
      　　
      　　有人靠著那份記憶活下去，時間不夠，就把希望交給下一代。
      　　
      　　而最後，他們真的把那份希望送到了另一個時代，然後笑著迎接自己的毀滅。
      　　
      　　古·拉哈·提亞看著光不贊同的神色，手指微微收緊。
      　　
      　　「對我而言，你當然是你。」
      　　
      　　「可是對那個時代的人來說……你又不只是你。」
      　　
      　　他望向前方晨光漸濃的森林。
      　　
      　　「你是希望的形狀。」
      　　
      　　「是許多人相信世界還能變好的理由，是即使一切都已經毀壞，仍能讓人相信過去並沒有白費、未來或許還值得去期待的道標。」
      　　
      　　「所以那時候，我從來沒有認真思考過『放棄』這件事。」
      　　
      　　因為沒有人允許自己放棄，也因為他自己不願意。
      　　
      　　光靜靜聽著。
      　　
      　　過了一會兒，他才重新邁開腳步。
      　　
      　　古·拉哈·提亞也跟著他往前走，兩人依舊沒有鬆手。
      　　
      　　又走出一小段路後，光忽然說：「那我們做個約定吧。」
      　　
      　　古·拉哈·提亞看向他。
      　　
      　　「約定？」
      　　
      　　「嗯。」
      　　
      　　光望著前方。
      　　
      　　「如果有一天，我真的比你早一步離開這個世界──」
      　　
      　　古·拉哈·提亞的神情微不可察地僵了一下。
      　　
      　　「別再踏上尋找我的旅程。」
      　　
      　　腳步聲停了。
      　　
      　　這一次，是古·拉哈·提亞先停下來的。
      　　
      　　光轉過身。
      　　
      　　「不要為了改變我的結局，放棄你自己的未來。」
      　　
      　　垂著頭的古·拉哈·提亞沒有說話。
      　　
      　　光知道這個要求很殘忍。
      　　
      　　對一個曾經成功跨越時間、改變過命運的人而言，要他在第二次面對同樣的失去時什麼都不做，或許比要求一個普通人接受死亡更加困難。
      　　
      　　光無意否定他所做的一切，然而正因為親眼見證過，才不希望他再次踏上那孤單的旅程。
      　　
      　　所以光沒有逼他立刻回答，只是在對方沉默之後，輕輕晃了一下彼此牽著的手。
      　　
      　　「我們做過很多約定吧。」
      　　
      　　古·拉哈·提亞垂下眼。
      　　
      　　「……是啊。」
      　　
      　　「那你怎麼樣也得答應我唯一的一個。」
      　　
      　　風從他們之間穿過，身後那座墓園早已被樹影遮得看不見了。
      　　
      　　光沉默了一會兒。
      　　
      　　「我不想有一天，你也變成走不出那座墓園的人。」
      　　
      　　古·拉哈·提亞的瞳孔輕輕顫了一下。
      　　
      　　他自然明白光說的是誰，那名抱著死者不肯鬆手的人。
      　　
      　　那份最初或許也只是單純的悲傷與愛意，最後卻在漫長的思念之中腐爛、變形，直到連活著的人自己也一起被吞沒。
      　　
      　　光的手還在他的掌心裡，溫暖有力地緊握著他的手。
      　　
      　　古·拉哈·提亞沉默了很久。
      　　
      　　「我會記得。」
      　　
      　　最後，他只這樣說。
      　　
      　　光等了片刻，沒有再等到下文。
      　　
      　　他盯著古·拉哈·提亞看了幾秒，眉頭一點一點皺了起來。
      　　
      　　「就這樣？」
      　　
      　　「……嗯？」
      　　
      　　古·拉哈·提亞眨了眨眼，一副彷彿不明白問題出在哪裡的樣子。
      　　
      　　光頓時明白了。
      　　
      　　這個人根本沒有答應他。
      　　
      　　他只說會記得，至於記得之後究竟會不會照做，半個字都沒提。
      　　
      　　「古·拉哈·提亞。」
      　　
      　　光的語氣沉了幾分。
      　　
      　　「你是不是在敷衍我？」
      　　
      　　「我只是覺得，對尚未發生的事做出不能遵守的承諾，不是很誠實──」
      　　
      　　話還沒說完，光已經鬆開他的手，轉而一把捧住他的臉。
      　　
      　　古·拉哈·提亞愣住了。
      　　
      　　下一刻，兩邊臉頰便被毫不客氣地往中間揉。
      　　
      　　「等、等等……！」
      　　
      　　「答應我。」
      　　
      　　「光──」
      　　
      　　「快答應。」
      　　
      　　「你至少先把手放開……！」
      　　
      　　光非但沒放，反而又揉了兩下。
      　　
      　　那張平日總能把話說得漂亮又周全的臉被他捏得有些變形，連古·拉哈·提亞原本沉重的神情都維持不住了。
      　　
      　　他無奈地抓住光的手腕。
      　　
      　　「你不明白。」
      　　
      　　光停下動作。
      　　
      　　古·拉哈·提亞看著他，眼底那點被鬧散的笑意很快又淡了下去。
      　　
      　　「你不知道，在那個沒有你的世界裡，你究竟有多重要。」他的聲音很輕，「那不是一句『英雄』就足以概括的事。」
      　　
      　　「你是絕望盡頭裡唯一的一道星光，你曾經走過的路、留下的那些事蹟，讓人們即使身處絕望之中，也依然能相信──希望確實存在過，也可能再次到來。」
      　　
      　　「你的事蹟能讓從未見過你的人相信彼此，能讓原本毫無關係的人因為同一個目標站在一起。甚至到了那樣的時代，仍然有人因為相信你，而願意付出自己的全部，只為了將那份希望帶到未來。」
      　　
      　　「我親眼看過那些人。」
      　　
      　　「所以如果又有一次機會擺在眼前，我不能保證自己會什麼都不做。」
      　　
      　　光看著他。
      　　
      　　過了片刻，他忽然又伸手，把古·拉哈·提亞的臉往中間擠了一下。
      　　
      　　「我不是在說那些人，也不是在說世界。」
      　　
      　　「……什麼？」
      　　
      　　光皺著眉。
      　　
      　　「我是在說你。」
      　　
      　　古·拉哈·提亞安靜下來。
      　　
      　　「我知道有人把我當成希望，也知道如果當時沒有你們做的那些事，我根本不會站在這裡。」
      　　
      　　光的手慢慢從他的臉頰滑下來。
      　　
      　　「可是我現在問的是，假如有一天我真的不在了，你要怎麼辦。」
      　　
      　　古·拉哈·提亞沒有回答。
      　　
      　　那一瞬間，他好像忽然失去了所有可以拿來說明的理論。
      　　
      　　光看著他，神情有些無奈。
      　　
      　　「你啊……還以為只要把事情說得夠大，就可以把自己藏進去。」
      　　
      　　「……我沒有。」
      　　
      　　「明明就有。」
      　　
      　　古·拉哈·提亞張了張嘴，最後還是閉上了，大概是意識到自己再辯下去也沒有勝算。
      　　
      　　兩個人就這樣站在林間，沉默地互相看了一會兒。
      　　
      　　最後，古·拉哈·提亞像是忽然想到了什麼。
      　　
      　　「那麼……不如換一個約定吧。」
      　　
      　　光警戒地看著他。
      　　
      　　「什麼約定？」
      　　
      　　古·拉哈·提亞的神情稍微放鬆了一點。
      　　
      　　「你要一直帶我出去冒險。」
      　　
      　　光愣了一下，古·拉哈·提亞溫聲補充。
      　　
      　　「就是字面上的意思。」
      　　
      　　他重新牽起光的手，語氣甚至帶上了一點若無其事。
      　　
      　　「去那些還沒去過的地方，看沒看過的景色。遇到有趣的委託就一起接，發現新的遺跡也記得叫上我。」
      　　
      　　「只要你一直帶著我去冒險……」
      　　
      　　他故意停頓了一下。
      　　
      　　「說不定哪一天，我就膩了。」
      　　
      　　光面無表情地看著他。
      　　
      　　古·拉哈·提亞一本正經地繼續說：「到那個時候，或許就不會那麼執著了。」
      　　
      　　「……」
      　　
      　　光盯著他看了很久。
      　　
      　　「你在敷衍我吧。」
      　　
      　　「怎麼會。」
      　　
      　　「怎麼聽起來這麼不可靠。」
      　　
      　　「我可是非常認真地提出了一個折衷方案。」
      　　
      　　光看著他那副理直氣壯的模樣，只覺得方才好不容易堆起來的沉重全被這個人繞得沒了形。
      　　
      　　偏偏他又清楚，古·拉哈·提亞只是還不願意答應。
      　　
      　　身為最了解他的人，不可能沒聽懂光想表達的意思。
      　　
      　　只是不願意面對、也無法解決，只能用這種方式，把那個太過遙遠、也太過痛苦的約定推回他們仍然活著的現在。
      　　
      　　光長長嘆了一口氣，稍稍檢討了下有些強人所難的自己。
      　　
      　　「好吧。」
      　　
      　　古·拉哈·提亞的耳朵微微動了一下。
      　　
      　　「你答應了？」
      　　
      　　「答應了，反正也和原本的目的相同。」
      　　
      　　光重新握緊他的手。
      　　
      　　「我會一直帶你出去冒險。」
      　　
      　　古·拉哈·提亞笑了，終於有了幾分光熟悉的樣子。
      　　
      　　「那就說好了。」
      　　
      　　「不過。」
      　　
      　　光瞇起眼。
      　　
      　　「前面那個約定我可沒說取消。」
      　　
      　　古·拉哈·提亞的笑容頓時僵了一下。
      　　
      　　光像是終於扳回一城似的，牽著他轉身往前走。
      　　
      　　「你慢慢想，反正我們還有很多時間。」
      　　
      　　「……光。」
      　　
      　　「不許耍賴，不然我就找個時間，把水晶塔給砸了。」
      　　
      　　「……那只是蒐集乙太的裝置，只要乙太數量足夠，不一定要水晶塔……」
      　　
      　　「是不是該跟希德商量，有沒有把你知識洗掉的裝置？」
      　　
      　　「我都寫下來了。」
      　　
      　　「放哪？回去我找找。」
      　　
      　　「才不告訴你！」
      　　
      　　兩人的腳步重新走到了一起。
      　　
      　　身後是死者沉眠的墓園。
      　　
      　　前方的森林深處，已經隱約能看見道路盡頭的燈火。
