title: 永不結束的冒險
cp:
  - 拉哈光
  - 光拉哈
updated: 2026-10-22
summary: 7版新月島肝武衍生
series: 短篇
chapters:
  - body: |-
      　　新月島的海風吹起草坡上陣陣漣漪。在眾人聚集的營地旁，拯救世界的大英雄正毫無尊嚴地撅著屁股、伏趴在地上，下巴抵著溫涼的草皮，雙臂也無力地垂著，整張臉寫滿了生無可戀。
      　　
      　　「拉哈……我再也不要待在這座島上了……」
      　　
      　　古·拉哈·提亞剛整理完手邊的筆記，一轉頭就看見自家的英雄已經化成了一灘泥沼怪。他無奈又好笑地走過去，單腳屈膝在光身邊坐下，順手撈過對方的腦袋，讓英雄順理成章地把臉埋進了自己的大腿上。
      　　
      　　躺在地上的光朝貓魅滾了一圈，順勢把整張臉埋得更深，悶著嗓子控訴：「那個光頭根本是在耍我……真的有碧色的半魂晶嗎？為什麼我一顆都打不到？用其他顏色湊合著不行嗎！」
      　　
      　　古·拉哈·提亞笑得無奈，指尖穿過英雄有些凌亂的髮絲，挑掉附著在上面的野草。
      　　
      　　「別氣別氣，蒐集素材本來就需要點運氣嘛……」
      　　
      　　「而且這裡的魔物到底都是些什麼鬼東西啊！」光像是觸發了某種創傷症候群，猛地仰起頭，眼神裡滿是控訴與驚恐，「特別是那個罐子！你還記得嗎？那個罐子！它一搖起來就『噹、噹、噹』地響個沒完，到處亂吐一些詭異的光球，然後旁邊的機關人偶就炸得大家四處逃竄……」
      　　
      　　光越說越激動，甚至抓著古·拉哈·提亞的衣角瑟瑟發抖：「太恐怖了，拉哈。我昨晚閉上眼睛，夢裡全都是那個噹噹聲在耳邊繞，我是不是這輩子都忘不掉那個聲音了……」
      　　
      　　古·拉哈·提亞看著他被折磨得精神崩潰的模樣，耳尖笑得輕輕晃動。他垂下頭，用額頭輕輕碰了碰英雄的髮頂，安撫地拍著他的後背。
      　　
      　　「好好好，我們不聽那個噹噹噹了。不過……鍛造材料還是得湊齊的吧？你不是很想要漂亮的武器？再打一場好不好？」
      　　
      　　英雄把臉往古·拉哈·提亞平坦的小腹上一撞，堅決地抗議：「不要。再讓我見到那個破罐子，我直接把平台給拆了。」
      　　
      　　「那……」古·拉哈·提亞眨了眨眼，在記憶裡搜尋，隨後很快地提議道：「我記得那種顏色的半魂晶並不是只有新月島的魔物才會有，外面的某些特定區域好像也有類似的乙太反應。既然討厭這裡，我們去野外刷刷看？」
      　　
      　　光的眼睛微微亮起，終於像是活過來了一點，半信半疑地抬起頭：「真的？」
      　　
      　　「你有興趣的話，我們這就出發。」
      　　
      　　片刻之後，兩人傳送到了大陸上的野外草原，仰頭望著一隻巨大的火雞。魔物發紅的眼睛也注意到了動靜，正緊緊地盯著兩人瞧。
      　　
      　　他們相互交換了眼神，隨後很快地切換好職能──古·拉哈·提亞抬起盾牌護在身前，手中長劍向外一振，光也在同一時間揮出巨鐮。幾番纏鬥後，大型魔物鳴叫了一聲，倒在地上不再動彈。
      　　
      　　塵土飛揚間，光隨意地低頭一瞥，眼睛頓時微微睜大。
      　　
      　　就在魔物倒下的位置，鬆軟的泥土上正靜靜地躺著一枚散發著奇異光澤、稜角分明的結晶體。
      　　
      　　正是他想找的半魂晶，散發著碧色的光輝。
      　　
      　　光不敢相信地倒吸了口氣，正準備發出一聲歡呼，下意識地轉頭看向身後──
      　　
      　　只見不遠處的土坡上，古·拉哈·提亞正抬起手背，輕輕擦了擦額角滲出的薄汗。微風揚起他暖紅的短髮，毛茸茸的耳朵精神抖擻地在風中抖了抖，身後的尾巴也愉悅地微微捲起。
      　　
      　　他單手搭在眉骨上，興致勃勃地遙望著更遠的山丘，赤紅的眼眸在陽光下閃閃發亮，回頭對著英雄興奮地笑著。
      　　
      　　「光！好像挺順利的，既然外面的魔物也有反應，那我們接下來去那座山頭看看吧？」
      　　
      　　看著那雙滿是熱忱、明顯正期待著下一個探索地點的發亮眼神，英雄許久不運轉的腦子裡忽然亮起一個燈泡。
      　　
      　　打太快的話，這趟旅行就要結束了。
      　　
      　　他的神色瞬間嚴肅了起來。
      　　
      　　下一秒，使出鬼宿腳的英雄重重踏步，右腳啪地一揚、踢擊的殘影將塵土與碎石翻起，三兩下就將那枚好不容易出貨的半魂晶埋進了泥土深處。
      　　
      　　隨後，光抬起哀怨的苦瓜臉，拖著沉重的步伐轉過身，拉長了哭腔在草地裡毫無形象地哀嚎。
      　　
      　　「拉──哈──！還是沒有───！」
      　　
      　　古·拉哈·提亞愣了一下，連忙小跑著從土坡上下來，有些擔憂地走到他身邊，「咦？也沒有嗎？運氣這麼差啊……」
      　　
      　　「對啊，怎麼會這樣……」英雄雙手抱頭，「是不是太久沒做好事了……還是我們應該先去前面的村莊，問問村民有沒有需要幫忙的雜事，累積點福報再來打？」
      　　
      　　古·拉哈·提亞笑了出來，一邊無奈地搖了搖頭。
      　　
      　　「這樣得在這裡住上好一陣子了。」
      　　
      　　「那也沒辦法……但你會陪我的對吧？」
      　　
      　　「當然。」
      　　
      　　古·拉哈·提亞笑著走上前，主動遞出手掌，被英雄滿是厚繭的手一把握住。兩人並肩走在微風裡，有一句沒一句地聊著沿途的風景。
      　　
      　　在離開前，紅色的眼眸悄悄落在英雄剛埋起的小小土堆上，彎起一輪弦月。
