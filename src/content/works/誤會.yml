  - title: 第一章
    body: |-
      　　視線內一片黑暗。
      　　
      　　光說不清自己究竟身在何處，視野也模糊不清，他唯一清楚感受的，是那具覆在他身上的滾燙身軀，以及近在咫尺、幾乎要灼傷皮膚的沉重喘息。
      　　
      　　古·拉哈·提亞那雙平日裡總是坦率的紅色眼睛，此刻在昏暗的視野裡亮得驚人。他的額髮被汗水浸得微濕，有些凌亂地散落下來，垂下的黑影幾乎將光完全困在懷裡。
      　　
      　　「……哈啊……」
      　　
      　　濕熱的吻密密麻麻地落了下來。
      　　
      　　最先是額角，接著是泛紅的眼尾，再順著鼻尖一路輾轉向下，重重鎖住光的唇。他的嘴角平日裡總是笑得靦腆，此刻的吻卻帶著強烈的侵略與近乎虔誠的迷戀，舌尖撬開光的齒邊，混著濕熱的柔軟，肆無忌憚地攪弄、索取。
      　　
      　　光本能地想仰頭喘口氣，卻被對方扣緊了手指。十指相扣的掌心滿是黏膩的汗水，滑膩又滾燙。
      　　
      　　到此已足夠讓他瘋狂，身下卻又傳來一陣令人頭皮發麻的充盈與頂弄。
      　　
      　　太深了。
      　　
      　　那種被徹底填滿、每一寸內壁都被粗暴又溫柔地碾開的感覺，激得光渾身戰慄。
      　　
      　　撞擊伴隨著水聲，濕熱的觸感在相連的地方不斷研磨，快感像是細密的電流一路竄上脊椎。
      　　
      　　光難耐地弓起腰，喉嚨裡溢出破碎的嗚咽，雙腿甚至不由自主地想要攀緊對方的腰側。
      　　
      　　古·拉哈·提亞的呼吸猛地粗重了幾分。
      　　
      　　他俯得更低，汗水順著他緊繃的下頜滑落，滴在光赤裸的鎖骨上。他一邊加快了下身凶狠頂弄的節奏，每一次都精準而重重地撞在最敏感的那一點上，一邊將滾燙的唇瓣貼在光的耳側與頸窩。
      　　
      　　牙齒輕輕叼住脆弱的皮肉，舌尖安撫般舔舐而過，引來光一陣不受控的抽搐。
      　　
      　　然後，光聽見古·拉哈·提亞在喚他。
      　　
      　　「唔……」
      　　
      　　那聲音低沉、沙啞得不像平日裡的他，每一個音節都像是貼著耳骨、混著濃稠的愛意與喘息一路震進胸腔，帶著化不開的迷戀與近乎失控的情慾。
      　　
      　　那雙紅色的眼睛再次抬起，居高臨下地望進光的眼底，像是想將他所有失控的反應收盡眼底。
      　　
      　　光顫巍巍地伸出手，拉住他胸口的墜飾，催促地扯近。
      　　
      　　紅眼微瞇，古·拉哈·提亞再次發了狠似地深深頂入最深處，唇貼著光的耳垂，用那副啞透了的嗓音，又一次叫著他的名字──
      　　
      　　「──！」
      　　
      　　光猛地睜開眼。
      　　
      　　清晨尚未完全甦醒的森林，因為這聲近乎慘叫的抽氣聲瞬間驚醒。
      　　
      　　「敵襲？！」
      　　
      　　原本倚在不遠處守夜的桑克瑞德幾乎在同一時間站起身，手已經本能地摸向武器。
      　　
      　　另一邊的艾斯蒂尼安動作更快，長槍已經迅速地舉在身前，銳利的視線掃過營地外圍後，卻有些困惑。
      　　
      　　而睡在離光最近的位置，古·拉哈·提亞甚至還沒徹底清醒。
      　　
      　　一道光芒在晨霧裡驟然亮起。
      　　
      　　光呆呆地看著眼前的人。
      　　
      　　古·拉哈·提亞半跪在他的睡鋪旁，手裡舉著盾，身後甚至張開了屬於騎士的光翼。那頭紅髮還因為剛從睡夢中驚醒而亂翹，一雙眼睛卻警戒地睜著，顯然是在聽見光聲音的瞬間便憑本能做好了戰鬥準備。
      　　
      　　「敵人在哪裡？」
      　　
      　　古·拉哈·提亞急促地問，卻沒有人回答。
      　　
      　　幾秒之後，營地裡只剩下晨風吹過草葉的沙沙聲。
      　　
      　　桑克瑞德沉默地看了看四周，跟艾斯蒂尼安同時收起了武器。
      　　
      　　「……周圍沒有威脅。」
      　　
      　　「咦？」
      　　
      　　古·拉哈·提亞這才稍微清醒了一點。
      　　
      　　他撤去光翼，舉在手裡的盾也隨著職能切換化作治癒的法杖。
      　　
      　　而被他護在身後的光，狼狽地發現自己的狀態非常糟糕。
      　　
      　　滿臉發燙、身上全是汗，連貼在背後的衣料都被汗水浸得發黏，更糟糕的是他的腿間，夢裡遺留下來的溫度居然完全沒有消退──
      　　
      　　光猛地把蓋在腿上的毯子往上拉了一點，試圖掩蓋那個部位傳來又脹又熱的感覺。
      　　
      　　那個夢羞恥得讓他恨不得當場挖個洞把自己埋進去，偏偏那位當事人還什麼都不知道。
      　　
      　　「英雄？」
      　　
      　　古·拉哈·提亞已經湊了過來。
      　　
      　　「你怎麼了？」
      　　
      　　他低下身，紅色的眼睛擔心地望著渾身緊繃的光。
      　　
      　　「是不是迷宮裡妖魔的法術還有殘留？我記得你那時候雖然說沒事，可是……」
      　　
      　　古·拉哈·提亞伸出手，大概只是想碰一下他的額頭，可是他一靠近，光腦子裡竟毫無預兆地又閃過夢裡的畫面。
      　　
      　　昏暗的視野、貼近的呼吸，還有那一聲聲低得發啞的嗓音。
      　　
      　　就連此刻那雙擔憂的紅眼，也與夢中一閃而過、充滿情慾與渴求的眼睛重疊。
      　　
      　　「別、別過來！」
      　　
      　　光幾乎是反射性地揮開了他的手。
      　　
      　　啪。
      　　
      　　聲音不重，卻清楚得讓整個營地再次安靜下來。
      　　
      　　清晰的聲響讓光也跟著愣住，彷彿被人重重拍了臉、終於清醒了一點。
      　　
      　　他的手掌剛好拍在古·拉哈·提亞的手背上。
      　　
      　　古·拉哈·提亞的手停在半空，原先盛滿關切的表情空白了短短一瞬。
      　　
      　　而兩人極近的距離讓光不小心看見，那雙紅色的眼裡閃過一斯受傷。
      　　
      　　「……啊。」
      　　
      　　他慢慢把被拒絕的手收了回去。
      　　
      　　「抱歉。」
      　　
      　　光心頭重重跳了一拍。
      　　
      　　「不是，我──」
      　　
      　　他試圖想解釋。
      　　
      　　可只要一看見古·拉哈·提亞，夢裡那張近在咫尺的臉就又會浮現出來，隨之而來的還有他們在夢裡做的那事，那簡直───
      　　
      　　光覺得自己的臉更燙了。
      　　
      　　不行，再待下去一定會被發現。
      　　
      　　「我只是……」
      　　
      　　他一把掀開毯子，又在真正站起來之前突然僵了一下，只得用極其彆扭的姿勢迅速抓過外衣擋在身前。
      　　
      　　「我去洗把臉。」
      　　
      　　「你狀態真的不太好，我可以幫你檢查──」
      　　
      　　「真的沒事！」
      　　
      　　話還沒說完，光已經半跑半逃地朝河邊前進。
      　　
      　　艾斯蒂尼安握著長槍，目送他的身影消失在林間，一臉地困惑。
      　　
      　　「……那傢伙怎麼回事？」
      　　
      　　「誰知道。」
      　　
      　　桑克瑞德揉了揉剛才因為緊急起身而微微發酸的肩膀。
      　　
      　　他看向仍舊半跪在原地的古·拉哈·提亞，後者已經把法杖收了起來，只是仍低著頭，看著剛剛被光拍開的那隻手，耳朵微微地垂著。
      　　
      　　桑克瑞德看了他一會，走過去拍了拍他的肩。
      　　
      　　「別放在心上。」
      　　
      　　古·拉哈·提亞抬頭，迎上桑克瑞德彎起的眼睛。
      　　
      　　「他八成只是睡傻了。」桑克瑞德朝光離開的方向看了一眼，「那傢伙剛才明顯連自己在哪都還沒弄清楚，不是故意的。」
      　　
      　　「……我知道。」
      　　
      　　古·拉哈·提亞很快露出笑，儘管看起來十分勉強。
      　　
      　　「剛睡醒總是會有點迷糊，等他冷靜下來再幫他檢查。」
      　　
      　　「既然他說沒事，就先讓他一個人待會吧。」
      　　
      　　桑克瑞德又伸手拍拍他，轉去熄滅營火。
      　　
      　　古·拉哈·提亞點點頭，臉上的表情卻依然有些失落。
      　　
      　　那個拍開的舉動，一定只是被嚇到的本能動作。他試圖安慰著自己。
      　　
      　　只是那個神情、光那一瞬間的眼神──
      　　
      　　驚慌、閃躲，甚至是明顯的拒絕，像是用盡渾身力氣，不希望他靠近自己。
      　　
      　　古·拉哈·提亞垂下頭，眼底滿是不解與失落。
  - title: 第二章
    body: |-
      　　光原本以為，那場荒唐的夢境只是偶發性的意外。
      　　
      　　或許是前一天太累，或許真的是迷宮裡的妖魔留下了什麼奇怪的精神干擾，又或者單純只是睡得不好，才讓腦袋在半夢半醒之間胡亂拼湊出了那些根本不可能發生的畫面。
      　　
      　　只要睡一覺、忘掉就好了，光如此安慰著自己。
      　　
      　　然而事情顯然沒有他想得那麼簡單。
      　　
      　　因為幾天後，那個夢又出現了，還出現不止一次。
      　　
      　　彷彿某扇不該被打開的門已經被推開了一條縫，只要光一閉上眼睛，那些過分鮮明的畫面便會趁他毫無防備時鑽進夢裡。
      　　
      　　每一次的情景都不太一樣，也不僅限於床榻間，有時甚至會在野外，光只知道每一次自己雙腿都會被大大地分開、架在對方的腰側，完全打開的身體被牢牢壓在身下，耳畔全是急促又滾燙的粗喘，還有兩具赤裸軀體激烈撞擊時黏膩沉悶的拍打聲。
      　　
      　　無論景色如何改變，那個人始終都是古·拉哈·提亞。
      　　
      　　那雙紅色的眼睛會用一種光從未見過的眼神望著他。
      　　
      　　專注且赤裸，帶著近乎飢渴的掠奪與深情，毫不掩飾其中濃烈得讓人害怕的慾望。
      　　
      　　夢裡的古·拉哈·提亞動作溫柔卻急躁，貓魅族的腰腹勁瘦而柔韌，每一次發狠的頂弄都直直鑿進最敏感、最要命的深處，將滾燙的硬物整根沒入光緊熱的體內，倒刺碾磨過每一寸敏感的內壁，逼得光只能弓起背無助地抽搐、溢出破碎的呻吟。
      　　
      　　夢裡的古·拉哈·提亞並不會叫他英雄。
      　　
      　　那人總是將汗濕的臉埋在他的頸側，尖銳的齒輕輕咬著他鎖骨上脆弱的軟肉，一邊加快下身兇悍無比的抽送與研磨，一邊用低沉得幾乎陌生、沙啞過頭的嗓音，一次又一次喚著他的本名。
      　　
      　　每每到了那個時候，光就會在快感幾乎要滅頂的瞬間猛然驚醒，然後瞪著房間的天花板，感受著身下劇烈的脹痛與黏膩的汗水，整個人僵硬地躺上好一陣子。
      　　
      　　「……到底為什麼。」
      　　
      　　這已經是他不知道第幾次對著空氣問出這句話。
      　　
      　　當然，沒有人能回答他。
      　　
      　　光完全想不明白。
      　　
      　　他跟古·拉哈·提亞之間不是這種關係，也根本就沒有發生過任何足以讓他產生這種夢境的事情。
      　　
      　　從水晶塔開始，到第一世界，再到如今重新並肩旅行，兩人的關係的確很好。
      　　
      　　古·拉哈·提亞總是很信任他……說得更精確一點，那已經不只是普通程度的信任了。
      　　
      　　光當然看得出來。
      　　
      　　每當古·拉哈·提亞望著自己的時候，那雙眼睛總會亮得驚人，像是只要自己開口，不論要前往多麼危險的地方，對方都會毫不猶豫地跟上來。
      　　
      　　「英雄！」
      　　
      　　他總是充滿精神地這麼喚著，帶著明顯高興的神色，甚至偶爾還會因為太過興奮而讓尾巴也跟著高高豎起。
      　　
      　　那個眼神裡有憧憬、有信賴，有光一直以來都知道的、屬於古·拉哈·提亞的崇拜。
      　　
      　　但絕對不是夢裡那樣，是情慾、佔有，或者渴望。
      　　
      　　他們沒有做過什麼特別親密的事情，沒有擁抱到不願鬆手，沒有在無人的角落偷偷接吻，更不用說像夢裡那樣赤身裸體地交纏、任由對方肆意地插進自己的身體裡。
      　　
      　　可就是因為什麼都沒有發生過，才更加奇怪。
      　　
      　　「我到底在想什麼啊……」
      　　
      　　光緊緊抱住腦袋。
      　　
      　　這算什麼。
      　　
      　　古·拉哈·提亞明明什麼都不知道。
      　　
      　　每天還是照樣神采奕奕地跑過來找他，關心他有沒有休息、任務順不順利，即使只是一起吃頓飯，那雙耳朵都很有精神地豎著，認真聽光跟他說的每一句話。
      　　
      　　結果自己卻在晚上夢見兩個人做那種事，而且一次比一次過分。
      　　
      　　連對方體溫的炙熱、相連處濕軟黏膩的摩擦感，都清晰得像是親身經歷過一樣。
      　　
      　　光甚至開始覺得，自己實在太對不起古·拉哈·提亞了，明明對方的情感十分單純，卻被自己的腦海扭曲成一個個煽情的畫面。
      　　
      　　更糟糕的是──事情已經不只影響睡眠了。
      　　
      　　光開始無法直視古·拉哈·提亞。
      　　
      　　比方兩人湊在一起，專注研究眼前的地圖時，距離稍微靠近一點，光的視線就會不受控制地落在對方的唇上。
      　　
      　　然後腦袋裡立刻閃過夢中那張嘴唇是如何濡濕地吮吻自己的胸口，舌尖又是如何探入齒間肆意攪弄。
      　　
      　　他會瞬間僵住，偷偷地拉開一點距離，還不能讓毫不知情的古·拉哈·提亞發現自己的疏遠。
      　　
      　　「英雄，這份資料你看過了嗎？」
      　　
      　　明明是認真的詢問，他腦袋裡浮現的卻是對方伏在耳邊低啞喊著名字的聲音。
      　　
      　　「英雄？」
      　　
      　　再普通不過的叫喚，耳畔卻像是響起夢裡每一次撞擊時沉重難耐的喘息。
      　　
      　　「你的臉怎麼那麼紅？是不是又不舒服？」
      　　
      　　古·拉哈·提亞皺起眉，擔心地往前靠了一步。
      　　
      　　光急急忙忙往後退開，心虛地垂下頭。
      　　
      　　「沒事！」
      　　
      　　「……」
      　　
      　　古·拉哈·提亞的腳步停下來，兩人沉默地對視幾秒。
      　　
      　　最後還是光率先移開視線。
      　　
      　　「真的沒事。」
      　　
      　　他欲蓋彌彰地重申。
      　　
      　　古·拉哈·提亞看起來明顯還想追問，可光根本不敢讓他靠近。
      　　
      　　因為他現在只要看見那頭紅髮，看見那雙眼睛，看見古·拉哈·提亞站在離自己稍微近一點的位置，腦袋就會自動把對方替換成夢裡的模樣。
      　　
      　　汗濕的額髮、發紅的眼尾、低沉的喘息，還有赤裸精悍的身軀在他身上不斷律動起伏的畫面。
      　　
      　　簡直沒救了。
      　　
      　　光雖然不曉得該怎麼解決這件事，也不知道他還有誰可以商量如此難以啟齒的煩惱，但他知道再這麼下去絕對不行。
      　　
      　　他只能隨便找了個藉口，匆匆留下封信表示自己打算出遠門後，一個人逃離石之家。
      　　
      　　甚至連古·拉哈·提亞都沒有打招呼。
      　　
      　　等他真正停下來時，人已經跑到了遠在東方的黃金港。
      　　
      　　此時的光正坐在溫泉裡，長長地吐出一口氣。
      　　
      　　熱氣瀰漫在水面上，四周安靜得只剩下泉水流動的聲音。
      　　
      　　他靠著石壁，整個人緩緩往下沉了一點，直到溫熱的水淹過肩頭。
      　　
      　　都跑了這麼遠，這幾天亂成一團的腦子或許能稍微冷靜一點。
      　　
      　　光仰頭閉上眼睛，熟悉的苦惱感又湧上心頭。
      　　
      　　所以，問題到底出在哪裡？
      　　
      　　為什麼偏偏是古·拉哈·提亞？
      　　
      　　就算退一萬步來說，他真的只是因為長期冒險、精神壓力太大，才會做出一些莫名其妙的夢，那也不該每次都是同一個人吧。
      　　
      　　而且還那麼真實。
      　　
      　　光忍不住回憶起某一個夢。
      　　
      　　古·拉哈·提亞將他的雙腿壓得極開，掌心滾燙地扣住他的腰肉，然後腰部重重一挺，粗大的硬物毫無保留地整根貫穿進來──
      　　
      　　「……」
      　　
      　　光猛地睜開眼。
      　　
      　　不對，不要想！
      　　
      　　他立刻把那些畫面從腦袋裡趕出去，然而熱度卻開始迅速往下腹匯聚。
      　　
      　　光下意識低頭看去。
      　　
      　　清澈的溫泉水下，那處原本垂軟的部位不知何時已經充血腫脹、筆直地翹立起來，頂端甚至在水波中泛著明顯的暗紅，脹痛得發硬發燙。
      　　
      　　「……」
      　　
      　　光沉默了。
      　　
      　　半晌，他抬手重重抹了一把臉。
      　　
      　　「……不是吧。」
      　　
      　　只是想了一下也會？
      　　
      　　他是不是生了什麼病？這還有救嗎？
      　　
      　　光又往四周看了一圈，好險溫泉附近暫時沒有其他人。
      　　
      　　周圍十分安靜。
      　　
      　　他猶豫許久，最後還是鬼鬼祟祟地挪到比較隱蔽的角落，用石壁和水氣遮住自己。
      　　
      　　算了，趕快處理掉就好。
      　　
      　　只要把這莫名其妙的反應弄下去，腦袋應該就能恢復正常。
      　　
      　　光伸手探入水中，握住那根脹得發疼的硬物，閉上眼睛開始努力想些別的。
      　　
      　　漂亮的人……身材好的……大胸部……大長腿……
      　　
      　　隨便什麼都行。
      　　
      　　他的手掌在水下機械地上下擼動了幾次，卻很可悲地發現毫無用處。
      　　
      　　手中的柱身非但沒有因為這些幻想變得更興奮，甚至連前端吐出的快感都顯得索然無味。
      　　
      　　光睜開眼，神情第一次浮現慌亂無措。
      　　
      　　他不信邪，又在腦海裡換了幾個畫面，卻還是沒用。
      　　
      　　剛才明明只是回想起古·拉哈·提亞挺腰貫穿進來時的眼神，身體就跟被制約似地硬了起來，現在換成別人，下身卻安靜得彷彿剛才的慾火根本是假的。
      　　
      　　光開始產生一種非常不祥的預感。
      　　
      　　「不會……吧……」
      　　
      　　就在這時，安靜的溫泉邊突然響起一道聲音。
      　　
      　　光嚇得差點整個人滑進水裡，手猛地從腿間抽開。
      　　
      　　他猛然回頭，發現聲音來自他堆在池畔的裝備，被放置在盔甲最上方的通訊珠。
      　　
      　　光盯著那堆衣物的同時，聲音又響了起來。
      　　
      　　「誰啊……」
      　　
      　　偏偏挑這個時候。
      　　
      　　光煩躁地起身挪過去，一把撈過通訊珠，連對方是誰都沒有確認便直接接起來。
      　　
      　　「喂？」
      　　
      　　另一頭安靜了一下，接著傳來一個小心翼翼的聲音。
      　　
      　　「……英雄？」
      　　
      　　光整個人僵住。
      　　
      　　那一瞬間，他甚至懷疑自己是不是因為最近做夢做太多，已經開始出現幻聽。
      　　
      　　可下一秒，古·拉哈·提亞的聲音又從通訊的遠端傳了出來。
      　　
      　　「你現在……方便說話嗎？」
      　　
      　　語氣很輕，甚至帶著幾分少見的遲疑。
      　　
      　　顯然是在意光前幾天那些莫名其妙的反應，所以連主動聯絡都變得有些怯生生的。
      　　
      　　而光根本沒空注意那些。
      　　
      　　因為就在聽見古·拉哈·提亞叫出「英雄」的瞬間，那道熟悉的聲音穿過耳膜，水面下那根粗硬的性器竟狠狠地抽動了一下，前端甚至溢出一點透明的黏液，比剛才任何時候都要灼熱、精神。
      　　
      　　「……」
      　　
      　　光的瞳孔猛然一縮，隨後僵硬地低下頭，盯著自己腿間那根因為對方的聲音而劇烈跳動、脹得發紫的部位。
      　　
      　　過於誠實的身體所反映的種種跡象，只有一個答案可以解釋。
      　　
      　　他一句話也說不出來了。
  - title: 第三章
    body: |-
      　　留在桌面上的信很短，短得讓古·拉哈·提亞來來回回看了數遍，仍舊沒辦法壓下心底那股越來越強烈的不安。
      　　
      　　光說自己臨時有些事情要處理，打算暫時離開一陣子，字裡行間卻並未提及任何地點或目的一類的細節，甚至連大概什麼時候會回來，都只留下了一句含糊的「處理完就回去」。
      　　
      　　古·拉哈·提亞握著那張薄薄的信紙，耳朵微微往後壓了些。
      　　
      　　其實這原本不是什麼值得大驚小怪的事情，光向來很忙，即使沒有拂曉的任務，也總有各式各樣的委託找上門。從幫忙護送商隊、討伐魔物，到不知道從哪裡冒出來的居民請託，光偶爾突然消失幾天，對他們而言並不算罕見。
      　　
      　　可最近不一樣。
      　　
      　　古·拉哈·提亞說不上來究竟是哪裡不對，只是光這陣子的模樣，實在太反常了。
      　　
      　　光似乎一直在躲著他。
      　　
      　　雖然沒有用明確的言語拒絕，但身體卻明顯地表現出抗拒，例如古·拉哈·提亞靠近時，光會下意識地往旁邊退；他伸手想替對方檢查身體，光會立刻像觸電般避開；他只是想靠過去一起看看地圖，光的肩膀卻會莫名其妙地緊繃，視線也總是在短暫交會後匆匆移開，甚至耳根發紅地隨便找藉口溜走。
      　　
      　　他的眼神像是在害怕什麼，又像是在極力隱瞞什麼。
      　　
      　　可古·拉哈·提亞完全想不明白。
      　　
      　　他是不是做錯了什麼？是不是在什麼自己沒有察覺的地方惹光生氣了？
      　　
      　　還是說，那天早上在營地，光拍開他的手，根本不是因為剛睡醒的混亂，而是真的不希望自己靠近？
      　　
      　　想到這裡，古·拉哈·提亞的手指不自覺地捏緊信紙，紙張發出細微的聲響。
      　　
      　　紅色的眼睛低垂下來。
      　　
      　　如果只是普通的委託，光為什麼完全沒和他提過？甚至連簡單道別都不願意，就這麼不告而別。
      　　
      　　古·拉哈·提亞盯著那幾行字看了很久，等他回過神時，手已經先一步拿起了通訊珠。
      　　
      　　他愣了一下，指尖懸在上頭。
      　　
      　　要聯絡嗎？
      　　
      　　會不會讓光覺得自己太煩人？最近他每一次靠近，光幾乎都會露出那種困擾又慌張的神情，也許……對方就是想一個人待著。
      　　
      　　古·拉哈·提亞猶豫許久，最後還是沒能忍住那份沉甸甸的擔憂。
      　　
      　　通訊珠亮起淡淡的光芒。
      　　
      　　等待接通的短短幾秒裡，他整個人都不自覺地繃緊，尾巴也緊張地拍打著椅腳。
      　
      　　直到另一端終於傳來聲音。
      　　
      　　「喂？」
      　　
      　　古·拉哈·提亞的心臟重重跳了一下。
      　　
      　　真的接了。
      　　
      　　他突然不知道該說什麼，原先在腦中想好的幾句話一下子全亂成一團，最後出口的聲音甚至比自己預想得還要小心翼翼。
      　　
      　　「……英雄？」
      　　
      　　另一端沒有立刻回話。
      　　
      　　古·拉哈·提亞握緊通訊珠，掌心微微出汗。
      　　
      　　「你現在……方便說話嗎？」
      　　
      　　依舊沒有回答。
      　　
      　　只是透過魔力的震顫，從通訊另一端傳來一些很輕的聲響，不太規律，伴隨著微弱的水聲，像是壓抑不住的沉重喘息，又比平常更加低沉、黏稠，甚至隱隱帶著幾分難以自持的悶哼。
      　　
      　　古·拉哈·提亞的耳朵一下子豎了起來，語氣帶了幾分慌亂。
      　　
      　　「英雄？」
      　　
      　　這次，另一頭終於有了回應。
      　　
      　　「……嗯……」
      　　
      　　只有很短的一聲，聲音卻啞得厲害，尾音還帶著一絲難耐的顫抖。
      　　
      　　古·拉哈·提亞的眉頭立刻皺了起來，心臟猛地懸空。
      　　
      　　「你怎麼了？」
      　　
      　　「沒……呼……沒事。」
      　　
      　　「你現在在哪裡？」
      　　
      　　那頭沉默了一下，伴隨著極度壓抑的吸氣聲。
      　　
      　　「黃金港。」
      　　
      　　「黃金港？」古·拉哈·提亞愣住，居然跑到了那麼遠的地方，「為什麼突然去那裡？是因為委託嗎？」
      　　
      　　「嗯……算、算是吧……」
      　　
      　　光回答得極其艱難，每一句之間都夾著奇怪的停頓與沉重的鼻音。
      　　
      　　古·拉哈·提亞越聽越焦急，整個人站直了身體。
      　　
      　　「真的沒事嗎？」
      　　
      　　「沒事……」
      　　
      　　「可是你的聲音……」
      　　
      　　「只是……有點累……哈啊……」
      　　
      　　光回答得很快，但那聲沒能完全咬住的抽氣與破碎的喘息，順著通訊珠清晰地落入古·拉哈·提亞耳中。
      　　
      　　古·拉哈·提亞的神情徹底變了。
      　　
      　　「你受傷了嗎？是不是遇到什麼麻煩？」
      　　
      　　「沒有……真的沒有……」
      　　
      　　那邊的聲音聽起來彷彿隨時都要崩潰一般，緊繃到了極點。
      　　
      　　古·拉哈·提亞再也坐不住了，他一把抓起放在旁邊的斗篷，往門口走去。
      　　
      　　「英雄，你到底怎麼了？你現在在哪裡？我現在過去！」
      　　
      　　「不用！──哈……」光幾乎是拔高了聲音吼了出來，甚至因為情緒過於激動而嗆出了一聲帶著濕意的嗚咽。
      　　
      　　古·拉哈·提亞的動作猛然頓住。
      　　
      　　「……什麼？」
      　　
      　　「不用，不需要……我很快就會回去……」另一端的光似乎也意識到自己的失態，極力把急促的喘息壓進喉嚨深處，「不要來找我！」
      　　
      　　那句話落下的瞬間，古·拉哈·提亞整個人僵在原地。
      　　
      　　原本豎著的貓耳慢慢、慢慢地往後垂了下來，徹底貼在紅髮之間。
      　　
      　　「……」
      　　
      　　他沒有再說話，站起的身軀靠著牆，慢慢跌坐在地面。
      　　
      　　光那邊似乎也意識到了異常，沉默了幾秒，才有些生硬而倉促地補上一句。
      　　
      　　「總之……我真的沒事，先掛了。」
      　　
      　　通訊啪地一聲切斷了。
      　　
      　　微弱的光芒消散，房間重新陷入死寂。
      　　
      　　古·拉哈·提亞仍舊維持著握住通訊珠的姿勢。過了好一會，他才慢慢把脫力的手垂放下來，紅色的眼眸盯著空無一物的地面，眼底泛起一片酸澀的茫然。
      　　
      　　又是這樣。
      　　
      　　他靠近，光就退開；他伸手，光就躲避；他想給予哪怕一點點支撐，得到的卻是斬釘截鐵的拒絕與推離。
      　　
      　　「……就這麼不希望我靠近你嗎？」
      　　
      　　低喃聲輕得連他自己都聽不真切。
      　　
      　　鼻腔湧上一股酸澀，眼眶在毫無防備間迅速泛起滾燙的熱意。古·拉哈·提亞咬住下唇，試圖將那股突如其來的委屈壓回心底，可視線還是不可遏制地模糊成一片。
      　　
      　　啪嗒。
      　　
      　　一滴眼淚終於砸在手背上，暈開微小的水痕。
      　　
      　　他有些慌亂地抬起手腕，急急忙忙抹著那雙紅色的眼睛，可淚水卻像是斷了線的珠子，越擦越多。
      　　
      　　那是太長久的期盼、失而復得的珍視，在面對對方一次又一次毫無由來的排斥時，徹底碎裂開來的無措。
      　　
      　　他蜷起手指，將臉深深埋進掌心，喉嚨裡溢出幾聲極力壓抑的抽噎。
      　　
      　　他想不明白自己做錯了什麼，更害怕這段好不容易得以延續的同行，其實只是自己的一廂情願。
      　　
      　　更別提對方現在已經遠在東方的國度，且極力避免自己的打擾。
      　　
      　　這不正是他不希望自己靠近而做出的決定嗎。

      　　安靜的房間裡，只有壓抑的吸氣聲伴隨著微弱的哭腔，在空氣中一點點消磨殆盡。
      　　
      　　過了好一段時間，古·拉哈·提亞才用手掌用力揉了揉泛紅的眼角。他深吸了一口氣，將所有的失落與狼狽死死鎖進眼底，默默收拾好行囊離開石之家。
      　　
      　　他走得有些失魂落魄，甚至沒有留意到身後停下腳步的同伴。
      　　
      　　「拉哈？」
      　　
      　　阿莉塞皺眉看著他那副失落的背影。
      　　
      　　古·拉哈·提亞回過頭，勉強扯出一個和平常無異的微笑。
      　　
      　　「你要去哪？」
      　　
      　　「……去搭船。」
      　　
      　　「搭船？去哪裡？」阿莉塞眉頭皺得更深。
      　　
      　　古·拉哈·提亞沉默了一下，避開了她的視線。
      　　
      　　「只是出去一趟。」
      　　
      　　說完，他便牽過陸行鳥，翻身坐了上去。
      　　
      　　「等等，拉哈──」
      　　
      　　古·拉哈·提亞沒有解釋，只是催促著陸行鳥沿著道路遠去。
      　　
      　　阿莉塞站在原地，看著那道紅色的背影在揚塵中越來越小，半晌，她低聲嘟囔了一句：「……一個兩個都怎麼回事。」
      　　
      　　隨後，她若有所思地拿出了自己的通訊珠。
      　　
      　　古·拉哈·提亞倒是完全沒有看到身後的一切。
      　　
      　　他一路騎著陸行鳥直奔利姆薩·羅敏薩。抵達港口時，海風帶著鹹澀的濕氣撲面而來，吹得他的斗篷獵獵作響。
      　　
      　　他垂著頭，走到售票窗口前。
      　　
      　　「您好，請問要去哪裡？」櫃台人員抬頭問道。
      　　
      　　古·拉哈·提亞動了動嘴唇，那個在心底盤旋了無數次的名字幾乎要脫口而出──黃金港。
      　　
      　　只要買下船票，只要跨過無盡的大海去找他……
      　　
      　　可手指剛碰觸到錢袋，耳邊卻又血淋淋地響起剛才那句斬釘截鐵的話語。
      　　
      　　──不要來找我。
      　　
      　　那五個字像是一道不可逾越的結界，將他所有的勇氣與衝動硬生生攔腰折斷。
      　　
      　　「先生？請問目的地是？」
      　　
      　　古·拉哈·提亞沉默了許久，終於一點一點垂下眼睫，掩去了眸中翻湧的情緒。
      　　
      　　「……舊薩雷安。」
      　　
      　　「好的，這是您的船票。願利姆萊茵的清風引領您的航程一帆風順。」
      　　
      　　古·拉哈·提亞接過票券，輕聲道謝，隨後轉身走向停泊在另一側的客船。
      　　
      　　他沒有再回頭。
      　　
      　　
      　　*
      　　
      　　
      　　稍早，遠在東方的黃金港。
      　　
      　　隱蔽的溫泉角落裡，氤氳的熱氣久久未散。
      　　
      　　「哈啊……哈……唔！」
      　　
      　　在通訊切斷的最後一刻，光仰起頭靠在粗糙冰冷的石壁上，喉結劇烈滑動，從齒縫間擠出一聲沙啞的悶哼。
      　　
      　　浸在水中的右手早已失控地加快了擼動的頻率。
      　　
      　　腦海裡根本無法停止回放方才耳邊響起的那幾聲呼喚──怯生生的、帶著濃濃鼻音與擔憂的「英雄」，與夢境中那張汗濕發燙、伏在頸側的臉龐在這一刻徹底重疊。
      　　
      　　那份禁忌的渴望如同一把烈火，瘋狂燒毀了他最後的理智。
      　　
      　　手中的肉刃脹硬得發紫，青筋暴起，在掌心瘋狂跳動。隨著最後幾次近乎自虐般兇狠的套弄，一股滾燙的熱流自小腹最深處猛然炸開。
      　　
      　　「……呃啊！」
      　　
      　　伴隨著一陣劇烈的戰慄與痙攣，濃稠熾熱的白濁一股接一股地噴射在自己的掌心與水面之上。
      　　
      　　快感漫過頭頂，卻沒有帶來絲毫的釋懷，只有無邊無際的羞恥與狼狽。
      　　
      　　光大口大口地喘著粗氣，渾身脫力地滑坐在水裡。
      　　
      　　清澈的溫泉水中，幾縷濃白黏稠的精液正緩緩在指縫間化開、飄散。掌心殘留的觸感滾燙得刺骨，那是他聽著古·拉哈·提亞的聲音、對著自己最信任的同伴射出來的無可辯駁的罪證。
      　　
      　　光死死盯著自己的手掌，瞳孔顫抖著，胸口劇烈起伏，整顆心像是被浸在冰水裡一樣發沉。
      　　
      　　他居然真的對古·拉哈·提亞有了這種見不得人的慾望，甚至下流到了這種地步。
      　　
      　　光難堪地抬起手臂遮住眼睛，咬緊了牙關，在水氣蒸騰的寂靜中，近乎自棄地從喉嚨深處擠出一句沙啞的咒罵。
      　　
      　　「……混蛋。」
      　　
      　　什麼拯救世界的大英雄。
      　　
      　　明明是徹頭徹尾、無可救藥的混蛋。
  - title: 第四章
    body: |-
      　　多瑪的海風吹了好幾天，光還是沒有想出任何像樣的解決辦法。

      　　他原本天真地以為，只要離石之家遠一點、離古·拉哈·提亞遠一點，那些荒唐的夢境與無法控制的身體反應總會慢慢平息下來。
      　
      　　結果事實證明完全不是那麼回事。
      　
      　　夢照樣做、古·拉哈·提亞照樣出現在裡面，只要一不留神，腦海裡還是會不受控制地浮現那雙紅色的眼睛。
      　　
      　　光甚至開始懷疑，自己是不是根本不該跑來黃金港。

      　　因為實在太悠閒了。
      　
      　　沒有拂曉的任務，沒有同伴在旁邊吵吵鬧鬧，也沒有成堆的委託逼著他分心，反而讓那些原本還能被忙碌強行壓住的念頭更加肆無忌憚地冒了出來。

      　　白天吹海風、晚上泡溫泉，睡著之後繼續夢見古·拉哈·提亞壓在自己身上。

      　　簡直是惡性循環。

      　　光灰著一張臉坐在港邊的木箱上，望著遠處來往的船隻，忽然有種自己幾天前逃來這裡的行為根本毫無意義的體悟。

      　　偏偏現實也不允許他繼續逃避太久。

      　　就在他認真思考要不要乾脆去接個委託時，腰間的通訊珠突然亮了起來。

      　　光低頭看了一眼，心底莫名有些心虛，但最後還是接了起來。

      　　「喂？」

      　　「拉哈有沒有去找你？」
      　　
      　　阿莉塞嚴肅的聲音傳來，連一句招呼都沒有，劈頭就丟了個問題。

      　　光被問得一愣。
      　
      　　「什麼？」

      　　「我說拉哈。」

      　　阿莉塞的語氣裡明顯帶著一絲急躁。

      　　「他有沒有跑去找你？」

      　　「沒有。」光皺起眉，「他為什麼會來找我？」

      　　通訊另一頭安靜了短短一瞬，阿莉塞像是陷入了思考。
      　
      　　「……居然也沒在你那邊？」

      　　「什麼叫也沒在我這邊？」

      　　光坐直身體，摸不著頭緒。
      　
      　　「到底怎麼了？」

      　　像是沒聽見他的問題，阿莉塞自言自語般低聲說道。

      　　「等等來問問可露兒……那傢伙不是真的跑回舊薩雷安了吧。」

      　　「……什麼？」

      　　光徹底愣住。

      　　海風吹過港邊，把他額前的碎髮吹得凌亂。
      　
      　　「妳這句話是什麼意思？」

      　　「你還好意思問我？」
      　　
      　　阿莉塞沒好氣地回了一句。

      　　「你們兩個到底在搞什麼？」
      　
      　　「我？」
      　
      　　「不然呢？」
      　
      　　「不是，這跟拉哈回舊薩雷安有什麼關係？」

      　　「你先告訴我你人在哪。」

      　　「……」
      　　
      　　光默默地閉上嘴。
      　　
      　　雖然對象是其他人或許好一些，但現在的光並不想讓別人直接殺來黃金港堵他。
      　　
      　　他的沉默令阿莉塞立刻警覺起來。
      　
      　　「喂。」
      　
      　　「我沒事。」
      　
      　　「我沒問你有沒有事，我問你在哪。」

      　　「就……東方。」
      　
      　　「東方哪裡？」
      　
      　　「很安全的地方。」
      　
      　　「光。」
      　
      　　阿莉塞的聲音沉了下來。
      　　
      　　光下意識把通訊珠拿遠了一點，畢竟隔著通訊都能感受到那股「你最好現在立刻老實交代」的壓迫感。
      　
      　　他咳了一聲，試圖掩飾，「真的沒什麼。」
      　　
      　　「沒什麼你會突然留一張信就消失？」
      　
      　　阿莉塞毫不客氣地拆穿。
      　
      　　「拉哈前幾天也一副快要哭出來的樣子跑出去，你們兩個最近見面不是一個躲一個追，就是站在同一間屋子裡卻連話都說不上幾句。你現在還想告訴我什麼事都沒有？」

      　　一連串指控中，光敏銳地聽見關鍵字，手指差點拿不住通訊珠。
      　　
      　　「……他快哭出來？」

      　　阿莉塞的話很快止住，似乎意識到自己說漏了什麼，但沒多久卻又理直氣壯起來。
      　
      　　「差不多吧。」
      　
      　　「……」

      　　光的心一下子沉了下去。

      　　他忽然想起那通在溫泉裡被自己匆匆掛斷的通訊。
      　
      　　古·拉哈·提亞最後幾乎沒有說什麼，只是安靜地接受了他的拒絕。

      　　那時候光滿腦子都是自己的狼狽，根本沒來得及細想對方究竟會怎麼理解他的態度。

      　　現在回想起來，胸口忽然一陣發緊。

      　　阿莉塞沒有放棄，依然堅定地詢問。
      　　
      　　「所以你到底遇到什麼麻煩？」她的語氣稍微放緩了一點，「是不能跟我們說，還是不想說？」
      　
      　　光抿了抿唇。
      　
      　　海風依舊吹得很大，他低下頭，看著腳邊被風吹動的細小砂石，最後還是沒能把真正的理由說出口。

      　　這種事情怎麼可能跟阿莉塞說。

      　　難道要讓他一本正經地告訴她，自己最近每天晚上都在夢裡跟古·拉哈·提亞做得天翻地覆，白天看見本人還會莫名其妙產生反應，甚至幾天前還──

      　　不行。

      　　光只是想像那個畫面，他就想從碼頭直接跳進海裡。

      　　「我……」他憋了半天，只得擠出一句：「我找別人商量。」

      　　阿莉塞狐疑地「嗯？」了一聲。

      　　「找誰？」
      　
      　　光腦子裡第一個浮現的名字是尤里安傑。剛要開口，忽然又覺得有點對不起他。
      　　
      　　於是他想了想，又報上了桑克瑞德的名字。
      　　
      　　阿莉塞沉默許久，似乎無法理解。
      　　
      　　「你到底遇到什麼事，需要一次找他們兩個？」
      　
      　　「……妳不要問，總之不是危險的事。」
      　
      　　光按住額角。
      　　
      　　阿莉塞顯然還想追問，最後卻只是重重嘆了一口氣。
      　
      　　「隨便你。但是光，」她的語氣忽然正經起來，「拉哈狀態真的很不對勁。」
      　　
      　　光怔了一下，伸手掩住自己的視線。
      　　
      　　「……我知道了。」

      　　通訊切斷後，他坐在原地沉默了一會，最後還是認命似地重新拿起通訊珠。

      　　於是十幾分鐘後，一場極其詭異的三方通訊正式開始。
      　　
      　　桑克瑞德的聲音最先響起。
      　
      　　「港口的風還真大。」
      　
      　　光一愣，急忙問道：「你怎麼知道我在黃金港？」
      　
      　　另一端安靜了半秒，隨後傳來一聲毫不掩飾的輕笑。
      　
      　　「我可沒說是黃金港。」

      　　「……」

      　　光的臉瞬間沉了下去。
      　　
      　　桑克瑞德從另一端傳來的笑意更明顯。
      　
      　　「……你故意的？」
      　
      　　「這不是很有效嗎？」
      　
      　　光閉上眼，深深吸了一口氣。

      　　「桑克瑞德，你最好別讓我現在回去。」
      　
      　　「好可怕。」

      　　嘴上這麼說，語氣裡卻完全沒有害怕的意思。

      　　另一邊一直安靜聽著的尤里安傑終於低低笑了一聲。
      　
      　　「知道你在哪，至少大家可稍稍安心。」
      　
      　　「……連你也來。」
      　
      　　光揉著太陽穴，覺得頭有點痛。
      　
      　　「好了。」桑克瑞德收起笑意，總算端起正經的態度，「所以呢？」
      　
      　　「你特地把我們兩個叫進來，總不可能只是想讓我們陪你吹海風吧。」

      　　光沉默了會，忽然有點後悔。
      　
      　　剛才答應阿莉塞的時候還不覺得，現在真的要開口，他才發現這件事根本比想像中難說十倍。
      　　
      　　但自己再這麼糾結下去，好像也沒有辦法解決。
      　　
      　　他只能硬著頭皮開口。
      　　
      　　「我最近……一直夢到一個人。」
      　　
      　　桑克瑞德「嗯」了一聲，「然後？」
      　
      　　「夢的內容……」光的聲音明顯變小，「很難啟齒……」
      　　
      　　桑克瑞德好像立刻理解了什麼。
      　　
      　　「喔。」
      　
      　　只是短短一聲，光的臉卻直接燒了起來。
      　
      　　「你不要那個語氣！」
      　
      　　「我什麼都沒說。」
      　
      　　「你那個『喔』就什麼都說了！」
      　
      　　桑克瑞德笑出聲。

      　　「沒辦法，能讓你這傢伙說不出口的，除了那方面還會有什麼。」

      　　尤里安傑似乎也忍得有些辛苦，清了清喉嚨。

      　　「請繼續。」
      　
      　　光咬了咬牙。

      　　反正都已經說到這裡了，他乾脆把剩下的部分一口氣講完。

      　　當然省略了非常多細節。
      　
      　　尤其是那些夢究竟具體到了什麼程度、自己後來又聽著古·拉哈·提亞的聲音做了什麼，他一句都沒提，只含糊地說夢境非常親密，而且出現得過於頻繁，頻繁到他已經無法正常面對本人。
      　
      　　說完之後，通訊另一頭足足安靜了好幾秒。
      　
      　　最後還是桑克瑞德先開口。

      　　「……這還真是不得了的煩惱。」
      　
      　　光整個人更加頹然地縮在木箱上。
      　　
      　　「你們一定會覺得我很奇怪。」

      　　「我可沒這麼說。」

      　　桑克瑞德的語氣依舊很平穩。
      　
      　　尤里安傑則在短暫思索後問道：「所以，古·拉哈對此毫不知情？」
      　
      　　「當然不知道。」光幾乎立刻回答，「怎麼可能跟他說。」
      　　
      　　「為何不可？」
      　
      　　「這還需要問嗎？」

      　　光猛地抬頭，雖然他們根本看不到。
      　
      　　「我總不能告訴他：『拉哈，我最近每天晚上都夢到你，還夢到我們兩個──』」
      　　
      　　他的聲音戛然而止，臉色迅速漲紅。
      　
      　　「反正就是不能說！」
      　
      　　桑克瑞德低低笑了一聲。
      　
      　　「我大概懂了。」
      　
      　　光沉默下來。
      　
      　　過了一會，他才用比剛才低很多的聲音補充。
      　
      　　「而且，我不想讓他覺得我是個混蛋。」
      　　
      　　出乎意料地，這回通訊珠的另一側沒有再傳來笑聲。
      　　
      　　光低下頭，手指慢慢摩挲著通訊珠光滑的表面，突然感謝起現在沒人看得見他狼狽的表情。

      　　「他一直那麼信任我，看我的眼神也一直都……很單純。」

      　　光說到這裡，喉嚨忽然有點發緊。
      　
      　　「結果我卻用那種眼神看他，甚至光是靠近他，就會想到那些亂七八糟的東西。」
      　　
      　　「如果他知道了……如果他不能接受……」

      　　他停了一會，才終於把真正害怕的事情說出口。
      　
      　　「然後因此討厭我怎麼辦？」
      　　
      　　海風吹得耳邊呼呼作響。
      　　
      　　光盯著遠處海面，聲音越來越低。
      　　
      　　「我們明明是歷經很多人的幫助，歷經奇蹟與僥倖，才終於又走在一起。」
      　　
      　　「他等了我這麼久，我也好不容易才把他帶回來。」
      　　
      　　光的最後幾個字說得很輕，也不曉得通訊珠另一端的兩人有沒有聽見。
      　　
      　　但這是他內心最真實的願望。
      　　
      　　「我不想失去他。」
      　　
      　　通訊珠那端沉默了很久，久到光以為通訊已經切斷了。
      　　
      　　桑克瑞德卻忽然無奈地笑了一聲，尤里安傑也低低笑了起來。
      　　
      　　光整個人僵住，覺得臉頰又燥熱了起來。
      　
      　　「……笑什麼笑？」
      　　
      　　「沒什麼。」桑克瑞德憋著笑意道：「只是突然覺得，你把事情想得比我預想中還要嚴重。」
      　
      　　「這還不嚴重嗎？」
      　　
      　　光歇斯底里地大喊，瞬間覺得剛才自己的一片真誠傾訴通通打了水漂。
      　　
      　　桑克瑞德連忙制止他大吼大叫，免得傷及他們倆的耳朵。
      　
      　　「我不知道古·拉哈知道之後會是什麼反應。」他慢悠悠地說，「畢竟這種事，真正能回答你的只有本人。」
      　　
      　　「不過。」
      　　
      　　他的語氣稍微放輕了一點。
      　　
      　　「如同你剛才說的，你們好不容易才又湊到一塊，就因為你自己在這裡胡思亂想，連問都沒問一句，就先把人推開，不覺得太可惜了嗎？」
      　
      　　光抿住唇，試圖尋求一個讓自己安心的答案。
      　
      　　「……所以你覺得，拉哈不會討厭我？」
      　　
      　　面對他的提問，尤里安傑緩緩開口。
      　
      　　「無論何時，坦白皆非易事。」
      　
      　　他的聲音一如既往沉穩。
      　　
      　　「尤其當他於內心的份量越重，便越小心翼翼。」

      　　精靈沉思片刻，語氣裡多了一點溫和的笑意。
      　　
      　　「然而有些答案，若非由當事人口中親自說出，便毫無意義。」
      　　
      　　「而他正在等待你的解釋。」
      　　
      　　光怔了怔，腦海裡毫無預兆地浮現那通被自己草草切斷的通訊。
      　　
      　　這幾天的他只顧著害怕會不會被討厭，卻完全沒有想過，那些毫無理由的退讓、躲避與拒絕，在古·拉哈·提亞眼裡究竟會變成什麼。
      　　
      　　從光漫長的沉默裡，桑克瑞德像是知道他想到了什麼。
      　
      　　「想明白了？」
      　
      　　「……一點點。」
      　　
      　　「那就別一直坐在港口吹風。」
      　　
      　　他輕鬆地一笑。
      　
      　　「你不是很會跑嗎？該跑的時候怎麼反而慢吞吞的。」
      　
      　　光黑著臉，低聲抱怨。
      　
      　　「你能不能不要每次正經不到三句。」
      　
      　　「這樣比較適合你。」
      　
      　　「滾。」
      　　
      　　光用力地嘆了口氣，通訊珠那端傳來兩聲笑意。
      　　
      　　他默默站起身，一邊轉過頭，將視線投注於遠方預備出航的船隻。
      　　
      　　
      　　
      　　*
      　　
      　　
      　　
      　　等光真正踏上舊薩雷安的土地時，已經是深夜了。
      　
      　　白日裡總是充滿學者與學生腳步聲的街道，此刻正披著夜色，安靜得只剩下遠處海浪拍擊岸壁的聲音。

      　　光一路趕來，身上的旅裝被風吹得凌亂，連混著海風的斗篷邊緣都還沾著長途跋涉留下的塵埃。
      　
      　　他沒有心思整理，只是沿著熟悉的道路一路往前，直到停在一棟建築外。
      　
      　　光抬起頭，望著上方有一扇窗還亮著。

      　　暖黃色的光從玻璃後透出來，在深夜裡顯得格外明顯。
      　　
      　　原來古·拉哈·提亞還沒睡。
      　
      　　光一動也不動地站在原地，方才還快速俐落的腳步，此刻卻像是扎了根。
      　　
      　　明明都已經從黃金港一路趕到這裡了，真正站上他所在的土地時，胸口卻又開始不爭氣地發緊。
      　　
      　　光站在樓下來來回回走了兩圈，最後重新停住，又抬頭看著那扇依舊亮著的窗。
      　　
      　　過了許久，他終於下定決心。
      　　
      　　藍眼瞥了瞥關閉的大門，他若有所思地想了想，隨後伸手往背後一探。
      　　
      　　下一瞬，熟悉的龍槍落入掌心。
      　　
      　　若是這回不一鼓作氣，光怕自己再也鼓不起勇氣。
      　　
      　　他往後退了幾步，抬頭確認了一下位置，膝蓋微微屈起，緊接著，強勁的力道猛然自腳下爆發。
      　　
      　　夜色中，一道身影挾著風聲驟然躍起。
      　　
      　　光踩過外牆突出的石雕，藉力再度一蹬，幾乎沒有發出多少聲響。
      　　
      　　下一秒，他穩穩落在那扇依然亮著燈的窗外陽台，小心翼翼地朝室內探頭而去。
  - title: 終章
    body: |-
      　　陽台上傳來極輕的一聲落地聲。
      　　
      　　房裡的人動了動耳朵，過了一陣子才反應過來。
      　　
      　　古·拉哈·提亞原本正坐在桌前，面前放著幾本根本沒看進去半個字的古籍。這幾天他一直睡得不安穩，胸口總像是壓著一塊沉甸甸的石頭。
      　　
      　　白日裡他還能靠著繁瑣的研究轉移注意，可一旦到了夜深人靜，光那些閃躲的眼神、拍開他的舉動，還有通訊珠裡那句冷硬的拒絕，便會一股腦地湧上心頭。
      　　
      　　所以當窗外傳來細微的動靜時，他甚至沒反應過來要警戒，只是茫然地轉過頭。
      　　
      　　薄紗窗簾被微涼的夜風揚起一角。
      　　
      　　下一刻，那道熟悉得讓他心臟漏跳一拍的身影，就這麼毫無預兆地撞進了視線裡。
      　　
      　　光站在陽台上，手裡還握著慣用的長槍，斗篷與皮甲上沾滿了長途跋涉留下的塵土，額前的髮絲被夜風吹得凌亂不堪，眼神看起來有些緊繃。
      　　
      　　兩人隔著一扇玻璃，在微弱的燈火下沉默地對望，誰都沒有先開口。
      　　
      　　空氣像是在這一瞬間凝固了。
      　　
      　　最後還是光有些尷尬又生硬地抬起手，彎起指節輕輕叩了叩窗。
      　　
      　　「……拉哈。」
      　　
      　　古·拉哈·提亞像是這時候才被這聲呼喚猛然扯回了神。
      　　
      　　他慌忙站起身，椅腳在地板上劃出一道刺耳的摩擦聲，幾乎是跌跌撞撞地快步走過去，雙手用力一把推開了落地窗。
      　　
      　　夜風裹挾著光身上熟悉的氣息，灌進溫暖的房間。
      　　
      　　「英雄……？」
      　　
      　　古·拉哈·提亞的聲音在發顫，眼眶在看清對方的瞬間便毫無防備地泛起酸意。他的視線慌亂地在光身上來回，像是不敢相信自己眼前所見。
      　　
      　　「怎麼會在這裡？你不是在黃金港嗎？這麼晚怎麼會……」
      　　
      　　他一連串地追問著，腳步不由自主地往前邁去，手幾乎是出於本能地想要去觸碰對方。
      　　
      　　然而，就在指尖即將觸碰到光的那一剎那，古·拉哈·提亞像是突然被什麼滾燙的東西狠狠燙了一下，整個人驟然僵在半空。
      　　
      　　那些被抗拒的記憶如潮水般湧上來。
      　　
      　　他指尖顫了顫，極其艱難地一點一點把手收了回去，低垂著眉眼往後退了半步。
      　　
      　　「……對不起。」
      　　
      　　微弱的聲音，卻帶著壓抑又沉重的歉意。
      　　
      　　光看著那隻懸空又落下的手，心口像是被鈍器狠狠砸了一下。
      　　
      　　「不要道歉！」
      　　
      　　話脫口而出，甚至帶著幾分狼狽的破音。
      　　
      　　古·拉哈·提亞愣住了，茫然地抬起頭。
      　　
      　　光自己也亂了陣腳，從黃金港一路狂奔回來，他在腦海裡演練了成千上萬遍該怎麼體面地解釋、怎麼正式地向他道歉，可當他親眼看到這隻平日裡神采奕奕的貓魅，如今連伸出手這樣的動作都如此小心翼翼，所有理智築起的防線全在瞬間潰散。
      　　
      　　不要說旁人，他都厭惡起自己所造成的一切。
      　　
      　　「別道歉，你沒有做錯任何事……」光有些暴躁地抓亂了自己的頭髮，耳根泛著不自然的紅暈，移開視線嘟囔道，「是我的錯……前幾天我確實是在躲你，但那不是因為你做了什麼，我可以發誓！」
      　　
      　　古·拉哈·提亞那對垂著的耳朵極輕地抖了一下。他沒有出聲詢問，只是安靜地站在暖黃的燈影裡，用那雙泛著水光的紅色眼睛定定地望著他。
      　　
      　　那種毫無防備又受了委屈的注視，比任何嚴厲的斥責都要讓光感到無地自容。
      　　
      　　光慢慢把長槍收回身後，邁過門檻走進房內，深深吸了一口氣。
      　　
      　　「我……我最近身上出了些怪事。」
      　　
      　　古·拉哈·提亞的呼吸頓時一緊。
      　　
      　　「怎麼回事？果然是上回冒險出事了嗎？」
      　　
      　　「不是。」光的手捂住發燙的臉，聲音悶悶地從指縫裡擠出來，「是夢……我一直在做一些很荒唐的夢。」
      　　
      　　古·拉哈·提亞眨了眨眼：「夢？」
      　　
      　　「……夢裡全是你。」
      　　
      　　房內陷入了一片詭異的沉默。
      　　
      　　古·拉哈·提亞呆呆地看著光那副恨不得原地找個地縫鑽進去的模樣，腦海裡迅速串連起這陣子所有的異常──通訊珠裡壓抑古怪的低喘、營地醒來時的慌亂、以及每一次自己靠近時，光那種渾身緊繃、臉頰脹紅、彷彿像是發燒般的異狀。
      　　
      　　那對原本垂著的貓耳微微一顫，連帶著臉頰和耳廓，肉眼可見地迅速漫上一層透紅。
      　　
      　　「難道……是那種……害羞的夢？」
      　　
      　　「為什麼猜得這麼快！」光猛地放下手，崩潰地看了他一眼。
      　　
      　　古·拉哈·提亞看起來也有些不知所措，他脹紅著臉、試探性地確認：「是……是跟我？」
      　　
      　　光又逃避似地把臉埋入手掌裡，微微地點了頭。
      　　
      　　「每次……每次都是你……在那邊把我親過來又抱過去……」
      　　
      　　既然都說到這個程度，光索性破罐子破摔，羞恥與懊惱混在一起，一股腦全倒了出來。
      　　
      　　「所以我根本不知道該怎麼直視你……你一靠近，我腦子裡全是那些、那些畫面，還有你的聲音……有時候還會跟夢裡重疊……」
      　　
      　　說到最後，光的聲音虛得幾乎聽不見，羞得臉低低地垂著，連脖頸都紅成了一片。
      　　
      　　「你明明那麼信任我……我卻對你抱著這種見不得人的念頭，天天在夢裡被你……我覺得自己像個混蛋，我怕你知道了會覺得噁心，會看不起我……」
      　　
      　　他一股腦地發洩完後，房間裡安靜了很久。
      　　
      　　預想中的鄙夷並沒有到來，身前反而傳來了極輕的一聲吸鼻子的聲音。
      　　
      　　光有些彆扭地轉回視線，卻赫然看見古·拉哈·提亞的眼眶裡蓄滿了淚水，正一眨不眨地凝望著他。
      　　
      　　「……拉哈？」
      　　
      　　光愣住了。

      　　在他的印象裡，古·拉哈·提亞從來不是一個輕易落淚的人。哪怕曾經早早為自己安排好死亡，真正走到那一步時，他也依然平靜得近乎坦然。

      　　可偏偏在面對自己的事情時，光卻已經不只一次看見他紅了眼眶。一想到那些眼淚都是被自己逼出來的，光的心一下子軟得一塌糊塗，酸澀得幾乎發疼。

      　　他忍不住在心底狠狠罵了自己一句。
      　　
      　　「所以……」古·拉哈·提亞吸了吸鼻子，聲音又啞又軟，帶著濃濃的鼻音，「你不是因為覺得我礙事才逃開的？」
      　　
      　　「當然不是！」
      　　
      　　「也不是後悔讓我跟你一起旅行？」
      　　
      　　「我怎麼可能後悔！」光急得差點跺腳。
      　　
      　　「那天早上你推開我、在通訊珠裡叫我別去找你……就是因為那些夢？」
      　　
      　　講到痛處的光整個人一僵，眼神飄忽，微弱地反駁：「我總不能讓你看見我這副模樣！萬一、萬一你討厭我怎麼辦？」
      　　
      　　古·拉哈·提亞怔怔地看著他那副心虛的模樣，心頭那塊壓了數日的巨石終於轟然碎裂，委屈化作淚水滾落，嘴角卻忍不住跟著彎了起來。
      　　
      　　「什麼啊……」他抬起衣袖，胡亂抹了一把眼角，聲音糊糊地化開，「我們兩個……居然在為同一件事害怕成這樣。」
      　　
      　　光難為情地低垂著頭，很小聲的說了句抱歉。
      　　
      　　下一刻，一隻溫軟微熱的手小心翼翼地伸了過來，輕輕扯住了光的衣角，那力道很輕，帶著試探與失而復得的珍視。
      　　
      　　見光這回終於沒有甩開，那幾根修長的手指才順著他的手腕慢慢往上滑，悄悄碰了碰光的手掌。
      　　
      　　「我還以為，你真的不要我了。」
      　　
      　　古·拉哈·提亞小聲吸著氣，整個人順勢靠了過來。他慢慢地將前額抵在光的頸窩處，像一個終於找到歸處的旅人，毫無保留地將體溫熨貼在光的皮膚上。
      　　
      　　那對重新立起的貓耳輕輕晃動，毛茸茸的耳尖若有似無地掃過光的下巴，連身後的尾巴都偷偷蹭了蹭光的小腿。
      　　
      　　光被他這副四處試探的模樣弄得手足無措，心跳快得要命，掌心全是對方細膩滾燙的體溫。他僵著脊背，想稍稍拉開點足以喘息的距離，指尖卻又捨不得鬆開。
      　　
      　　「拉哈……」光撇開臉，故作鎮定地清了清喉嚨，「既然話都說開了，誤會也解除了……那、那我也該走了，免得又胡思亂想。」
      　　
      　　「走？去哪裡？」
      　　
      　　古·拉哈·提亞在他頸窩裡蹭了蹭，抬起頭來，紅通通的眼睛眨了眨，眼神裡帶著一絲捨不得放手的執拗：「這麼晚了，英雄今晚還要回哪裡去？」
      　　
      　　「當然是去找間旅館睡啊！」光的心跳又漏了一拍，「而且我們兩個現在這個樣子……待在同一個房間裡，我腦子根本冷靜不下來。」
      　　
      　　「為什麼要冷靜？」
      　　
      　　古·拉哈·提亞不僅沒有退開，反而又靠得更緊了些。他抬起那雙澄澈而認真的紅眼睛，靜靜地凝視著光，眼底的水光褪去後，浮現出的是無比柔軟卻赤誠的情感。
      　　
      　　「英雄，你剛才說……你對我有見不得人的骯髒念頭，覺得自己對不起我。」
      　　
      　　古·拉哈·提亞輕聲說著，臉頰雖然泛著羞赧的淡紅，眼神卻半點沒有閃躲。
      　　
      　　「可是，你怎麼會覺得只有你一個人是這樣想的？」
      　　
      　　光整個人一愣：「……什麼？」
      　　
      　　「我從很久以前就一直看著你。」古·拉哈·提亞拉過他的手，慢慢覆在自己的心口上。那裡跳得又快又急，隔著薄薄的布料傳遞著灼人的溫度。
      　　
      　　「最開始是憧憬，是想成為能站在你身後的人……可是後來，你接受我跟隨在你身邊後，想要的東西就越來越多。」貓魅低下頭，有些不好意思地抿了抿唇，耳朵尖泛起一層薄紅，「我想離你更近一點，想被你注視，想碰碰你、想牽你的手……甚至偶爾跟你獨處時，我也會產生一些……非常貪心、很不應該的想法。」
      　　
      　　光的瞳孔微微放大，呆呆地看著眼前這個平日裡總是靦腆微笑的人。
      　　
      　　「只是我一直不敢說。」古·拉哈·提亞吸了口氣，抬起泛紅的臉龐，聲音軟得像水，卻一字一句無比清晰，「我怕說出來會破壞我們現在的關係，怕你其實也不喜歡……所以這幾天你躲著我時，我還以為是自己的這份貪心被你發現了。」
      　　
      　　他微微踮腳、努力仰起頭，兩人的距離瞬間拉近到呼吸相聞。
      　　
      　　「所以……不要覺得自責，也不要覺得那是對不起我。」古·拉哈·提亞將臉頰貼上光的胸膛，聽著光那同樣劇烈的心跳，嘴角露出一抹釋然又依戀的笑意，「知道英雄在夢裡也會想要我……我其實，開心得快要瘋掉了。」
      　　
      　　光被這記直球砸得頭暈目眩，胸口脹滿了難以言喻的酸軟與悸動。他動了動嘴唇，所有的防備與不安在這一刻徹底化成了滿腔的無措：「你……你這傢伙……平時看起來那麼老實，怎麼這種時候說話一套一套的……」
      　　
      　　「這些話，我可是在心裡想了一百多年。」
      　　
      　　古·拉哈·提亞低低地笑了起來，胸口傳來微弱的震動。
      　　
      　　他抬起手，動作很慢、很輕，像是在給光足夠的時間後退一樣，小心翼翼地撫上了光的側臉。
      　　
      　　微涼的掌心貼上發燙的皮膚，舒服得讓光下意識顫了顫睫毛，卻沒有躲開。
      　　
      　　「光。」
      　　
      　　古·拉哈·提亞輕輕喚著，聲音裡浸滿了溫柔，他微微踮起腳尖，唇在輕輕擦過光的眼角。
      　　
      　　不過一個吻與一聲叫喚，光的呼吸徹底亂了，垂在身側的手無意識地攥緊了古·拉哈·提亞腰間的衣料。
      　　
      　　古·拉哈·提亞感覺到了他的默許，尾巴捲了上來，纏繞在光的小腿上。他將額頭抵著光的額頭，鼻尖親暱地蹭了蹭，雙眼近在咫尺地彎了起來，聲音軟糯地提出要求。
      　　
      　　「所以今晚別走了好嗎？就當是補償我。」
      　　
      　　光看著眼前這張滿是依戀與深情的臉龐，喉結上下滑動了一下。他認命般地閉上眼睛，手臂終於不再抗拒，而是極其彆扭又溫柔地回抱住身前這隻軟綿綿的貓魅，低聲嘟囔了一句：「……我都翻陽台過來了，你覺得我還能走到哪裡去。」
      　　
      　　古·拉哈·提亞聞言愣了一下，隨即忍不住笑了出來，那雙紅色的眼睛彎得更深，尾巴仍纏著光的小腿不放，甚至貪心地往他懷裡貼近了些，手掌也慢慢滑到光的腰側。

      　　「那……既然都來了。」
      　
      　　他抬起臉，語氣聽起來乖巧得不得了，眼底卻明顯多了一點藏不住的好奇與促狹。
      　　
      　　「可以跟我說說看嗎？」
      　　
      　　他的指尖輕輕勾住光腰間的衣料，隔著衣料若有似無地摩挲了一下。
      　　
      　　「夢裡的我……都是怎麼做的？」
