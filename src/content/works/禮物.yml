      　　古·拉哈·提亞的胸前總懸著一串精緻的飾物。
      　　
      　　三條長度不一的細繩上串著幾顆形狀各異的珠子與金屬裝飾，有些泛著溫潤的微光，有些則帶著磨損過的痕跡，看起來並不像出自同一位工匠之手。
      　　
      　　某日午後，光與他並肩坐在石之家外的矮牆上休息，古·拉哈·提亞正捧著一杯尚有餘溫的茶，光盯著他頸間看了好一會兒，終於伸出手，輕輕勾起了那條細繩。
      　　
      　　「拉哈，這些是什麼？」
      　　
      　　古·拉哈·提亞猝不及防地僵了一下。
      　　
      　　光的指尖離他的頸側很近，偶爾隨著細繩晃動，輕擦過頸間的皮膚，他的耳尖幾乎立刻紅了起來，連手中的茶杯也跟著晃了晃。
      　　
      　　「這、這些嗎？」
      　　
      　　他清了清嗓子，擺出平日解說學術問題時的鎮定姿態，低頭將掛墜平放，讓上方的裝飾一顆顆攤在掌心。
      　　
      　　「這一顆你應該還記得，是從水晶都回來時，萊楠請你帶回來的，是大家請工藝館準備的禮物。」
      　　
      　　那是一枚晶瑩的透明珠子，裡頭封著淡淡的銀白色光澤。
      　　
      　　「正面這一片……是從水晶塔取來的碎片。很小，也沒有什麼特別的力量，只是我想留著它，好提醒自己身上的責任。」
      　　
      　　古·拉哈·提亞垂下了眼睛，紅耳動了動，手指又指向其中一枚顏色深沉的小墜飾。
      　　
      　　「這是加拉夫爺爺留下的，算不上多麼珍貴，卻一直陪著我。至於其他幾顆，也是過去旅途中收到的紀念。」
      　　
      　　他說完，抬眼朝光笑了一下。
      　　
      　　「大多是不值錢的小東西，但每一件，都能讓我想起重要的人和重要的事。」
      　　
      　　光表示理解地點點頭，藍眼望著他掌心裡的飾物，忽然沉默下來。
      　　
      　　那串飾品裡有水晶都的居民，有水晶塔，有照護他的祖父，也有許許多多光未曾參與的過往。
      　　
      　　可是，身為他伴侶的光，理論上會存在於他後半生的光，並不在其中。
      　　
      　　這個念頭一冒出來，光莫名生出了一點不服氣。
      　　
      　　「拉哈。」
      　　
      　　「嗯？」
      　　
      　　「我也要送你一個可以放在掛鏈上的東西。」
      　　
      　　「什、什麼？」
      　　
      　　光伸手碰了碰那串飾物，神情認真得像是在宣布什麼偉大的計畫。
      　　
      　　「讓你一看到，就會想到我的東西。」
      　　
      　　古·拉哈·提亞的臉一下子紅了。
      　　
      　　他張了張口，想告訴光能陪在自己身邊便已經足夠，可對上那雙堅定的眼睛後，話到了嘴邊，最後只變成了一聲略顯慌亂的輕咳。
      　　
      　　「那麼……」
      　　
      　　他的手指無意識地緊握，紅著耳朵、輕輕朝他的戀人微笑。
      　　
      　　「我會期待著的。」
      　　
      　　
      　　
      　　說是這樣說。
      　　
      　　關於能一眼就想起自己的禮物，光一點頭緒都沒有。
      　　
      　　當天晚上，他把隨身行囊整個倒在房間地板上。
      　　
      　　各種裝備、食材、礦石、幾枚用途不明的魔晶石，以及不知道何時撿回來的奇怪零件散了一地。他蹲在那堆東西中央翻找許久，最後只挑出一根陸行鳥羽毛、一塊被火燒黑的金屬片，還有一顆看起來像是某種魔物牙齒的東西。
      　　
      　　無論哪一樣，都不像適合送給戀人的信物。
      　　
      　　光又去翻了雇員替他保管的倉庫。
      　　
      　　結果除了更多武器、素材與不知為何始終捨不得丟掉的紀念品外，仍舊一無所獲。
      　　
      　　隔日，桑克瑞德經過大廳時，正好看見光趴在桌面上，面前擺著一排用途可疑的物品。
      　　
      　　「你在準備什麼儀式？」
      　　
      　　光抬起頭，將事情原原本本說了一遍。
      　　
      　　桑克瑞德聽完，摸著下巴沉吟片刻。
      　　
      　　「原來如此，要送能讓他想起你的東西啊……」
      　　
      　　見眼前人認真思考，光立刻坐直身體，滿懷期待地看著他。
      　　
      　　桑克瑞德沉吟得更久了。
      　　
      　　「……送把劍？」
      　　
      　　光面無表情地看著他。
      　　
      　　「情聖只有這點靈感？」
      　　
      　　「我可沒這麼自稱過！」
      　　
      　　「虧我還很看好你的經驗。」
      　　
      　　「真是不好意思啊，沒能立刻替你想出感動人心的定情信物。」
      　　
      　　桑克瑞德沒好氣地拉開椅子坐下，拿起桌上的魔物牙齒端詳兩眼，又嫌棄地放了回去。
      　　
      　　「不過這種東西，貴不貴重倒是其次，最重要的是能與你本人產生連結的東西。」
      　　
      　　這場不太可靠的商議意外引來了其他人。
      　　
      　　阿莉塞認為可以送一條由光親手編成的繩結，光卻認為不夠醒目。
      　　
      　　阿爾菲諾建議訂製一枚刻有兩人名字的金屬墜飾，雅·修朵拉卻笑著指出，這樣就和加拉夫的信物重複了。
      　　
      　　塔塔露建議乾脆用金子融製成紋飾，但隨後又補了一句，她不會撥用公費做任何資助。
      　　
      　　艾斯蒂尼安站在旁邊聽了一會兒，只說送一枚龍鱗也不錯，被眾人一致否決。
      　　
      　　「還是得能讓拉哈想到光的東西。」阿莉塞總結道。
      　　
      　　光垂下眼，盯著桌面沉思。
      　　
      　　想到自己，會是什麼？
      　　
      　　他抱著頭思考，腦中忽然浮現古·拉哈·提亞望著自己的模樣。
      　　
      　　那雙如同紅寶石般明亮的紅色眼睛，無論是在第一世界，還是回到原初世界，永遠承載過於直率的憧憬。
      　　
      　　而古·拉哈·提亞也曾經說過，他很喜歡光的眼睛。
      　　
      　　光倏地站起身，椅腳在地面上發出刺耳的摩擦聲，嚇得阿爾菲諾手中的茶險些灑出來。
      　　
      　　「我知道了。」
      　　
      　　光只留下這句話，便飛快地衝了出去。
      　　
      　　幾日後的傍晚，古·拉哈·提亞剛結束與可露兒的討論，便聽見石之家的入口傳來一陣騷動。
      　　
      　　他循聲走出去，一眼就看見了光。
      　　
      　　光像是剛從泥地裡滾過一圈，衣襬與靴子上全沾著泥，肩膀還垂掛著破損的衣物碎片，手臂也纏著臨時包紮的布條，臉頰上還有一道細小擦傷。
      　　
      　　古·拉哈·提亞的臉色瞬間變了。
      　　
      　　「這是怎麼了？」
      　　
      　　他快步迎上前，將方才還抱在懷裡的書本隨手塞給一旁的人。
      　　
      　　光朝他露出燦爛的笑容，同時攤開了手掌。
      　　
      　　粗糙的掌心裡躺著一枚尚未經過打磨的藍寶石原石。
      　　
      　　寶石的外層仍沾著些許泥土與灰塵，形狀也不規則，只有其中一角在燈光下透出澄澈的藍。那顏色像拉諾西亞晴朗無雲的天空，也像古·拉哈·提亞無數次凝望過的那雙眼睛。
      　　
      　　「我本來想找一顆更漂亮的。」
      　　
      　　光搔了搔頭。
      　　
      　　「洞窟裡的礦脈比想像中深，還碰上了幾隻魔物，後來挖下來的幾塊都不夠藍，只有這顆我覺得比較像。」
      　　
      　　古·拉哈·提亞沒有接話，只是怔怔地望著那枚原石。
      　　
      　　光忽然感到有些緊張。
      　　
      　　一路採礦、躲避落石，又用礦鎬與洞窟裡的魔物對峙，他都沒有覺得這件事有多困難。可如今真的要把東西交出去，他反而開始懷疑，這顆灰撲撲的石頭是不是太寒酸了些。
      　　
      　　「等打磨之後，應該會更好看。」
      　　
      　　光把手往前遞了一點。
      　　
      　　「因為是跟我的眼睛一樣的顏色，所以我想把這個送給你。」
      　　
      　　說到最後，他的聲音也漸漸小了。
      　　
      　　「你不喜歡的話，我可以再找別的。」
      　　
      　　古·拉哈·提亞終於回過神。
      　　
      　　「不。」
      　　
      　　他立刻否認，伸手將那顆藍寶石接了過去，毫不在意上方沾染的泥沙與塵土。
      　　
      　　他的手指很輕，碰到光掌心時，卻微微發著顫。
      　　
      　　「我很喜歡。」
      　　
      　　古·拉哈·提亞低頭望著掌中的原石，眉眼一點一點柔和下來，耳尖也隨之染上薄紅。

      　　「只是……你不必為了讓我想起你，特意做到這種地步。」

      　　光困惑地看著他。

      　　古·拉哈·提亞將那枚寶石輕輕握進掌心，抬起眼，朝他露出一個略帶羞赧的笑。

      　　「曾經放在心上超越百年的人，又怎麼會被輕易遺忘呢。」

      　　光怔了一下，隨即難為情地低下了頭。

      　　古·拉哈·提亞並未察覺他的神情，只低頭提起胸前的墜飾，拿著原石仔細比劃了片刻，唇邊漸漸浮起笑意。

      　　「就放在最中央的位置吧，只要將這裡稍作加工，應該就能鑲嵌進去。」

      　　他抬起頭，眼底仍帶著未褪的羞意，語氣卻十分認真。

      　　「你覺得呢？」

      　　光迎上那雙既羞赧又坦率的紅眸，終於忍不住向前踏了一步。

      　　他微微俯身，將沾著灰塵的前額輕輕抵上古·拉哈·提亞的額頭，唇角也跟著揚了起來。

      　　「放在這麼顯眼的位置？」

      　　「嗯。」

      　　古·拉哈·提亞沒有退開，只輕輕蹭了蹭他的額頭。

      　　光的笑意更深了些。

      　　「你喜歡就好。」
