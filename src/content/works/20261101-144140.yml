      　　傍晚的舊薩雷安一如往常安靜。
      　　
      　　古·拉哈·提亞坐在堆得幾乎要將自己埋起來的手稿之間，一手撐著額角，一手握著筆，正努力讓目光停留在眼前那些年代久遠、字跡斑駁的記錄上。
      　　
      　　他已經盯著同一段文字很久了，久到墨水在筆尖凝成一小滴，終於承受不住似地落在紙面上。
      　　
      　　古·拉哈·提亞回過神，低頭看著那團暈開的墨跡，耳朵跟著無精打采地垂了下來。
      　　
      　　自回到舊薩雷安，他便一直忙著重建巴爾德西昂委員會相關的事宜。需要處理的文獻眾多，資料的清點也相當耗費時間，從早忙到深夜並不是什麼稀奇的事。
      　　
      　　本來，古·拉哈·提亞並不覺得辛苦，直到某個人離開舊薩雷安，再次踏上旅途，身旁突然安靜下來的空氣，才讓那份原本未曾察覺的寂寞一點一點浮上心頭。
      　　
      　　他慢慢伏低身子，把下巴擱在交疊的手臂上，整個人就這麼窩在了書桌前。
      　　
      　　最近實在太容易走神了，他默默地檢討著自己。
      　　
      　　有時看著書，目光便會不知不覺飄到窗外，或是在抄錄資料時不自覺地發起呆，等回過神，墨水已將紙張暈染了一大片污漬。
      　　
      　　前些日子，可露兒看著他沒精神的尾巴，還笑著說他大概是得了「英雄不足症」。
      　　
      　　古·拉哈·提亞把臉往手臂間埋得更深了一點。
      　　
      　　不行，這樣拖下去，他什麼時候才能追上英雄的腳步、一起出發冒險。
      　　
      　　他抬起頭，用力拍了拍自己的臉頰。
      　　
      　　「振作啊，古·拉哈·提亞。」
      　　
      　　明明是自己把人勸出去冒險的，現在反倒先沒精神起來，未免也太不像話了。
      　　
      　　其實，光原本是想留下來陪他，只可惜這位英雄對古籍研究和紀錄整理的興趣，低落得實在有些不可思議。
      　　
      　　他最開始還會從身後擁著古·拉哈·提亞，陪著翻看書籍，過沒多久，靠在古·拉哈·提亞肩上的重量便越來越沉，然後便開始打瞌睡。
      　　
      　　僅是這樣倒也無妨，問題在於光睡著之後，呼吸總一下又一下地落在古·拉哈·提亞耳後。
      　　
      　　溫熱又酥麻的氣息擦過頸側，近得讓人無法忽視。
      　　
      　　古·拉哈·提亞每回都努力忍耐，強迫自己將注意力放在文字上，只是每每到底看了些什麼都不知道，只記得自己的耳朵燙得厲害。
      　　
      　　而光在小憩間醒來時，往往還會若無其事地湊過來親他一下。
      　　
      　　通常到這種時候……
      　　
      　　古·拉哈·提亞默默抬手摀住臉。
      　　
      　　總之，後來書自然是沒讀成，床倒是滾了好幾回。
      　　
      　　幾次下來，原本預計三天整理完的資料硬生生拖了一週。最後還是古·拉哈·提亞忍痛，親自把人送出了舊薩雷安。
      　　
      　　「我想留下來陪你！」
      　　
      　　「但這樣委員會的重建進度……」
      　　
      　　那時，被嫌棄的光活像一隻失落的大型犬，三步一回頭地望著神色堅定的古·拉哈·提亞，最後還是在船鳴一聲聲的催促下，依依不捨地拖著腳步上了船。
      　　
      　　每回想到光那時的眼神，古·拉哈·提亞就忍不住嘆了口氣。
      　　
      　　他低頭看向手邊的資料，努力給自己打氣。
      　　
      　　再堅持一下吧，至少先把今天預定的部分做完。
      　　
      　　他重新提起筆，窗外卻在這時傳來極輕的聲響，下一秒，一道人影已經俐落地翻過陽台欄杆，單手撐著石雕跳了進來。
      　　
      　　古·拉哈·提亞猛地站起身。
      　　
      　　「光？！你、你怎麼從那裡進來？」
      　　
      　　「懶得繞路，這樣比較快。」
      　　
      　　光站穩之後拍了拍身上的灰，神情自然得不像是翻牆入室的人。他的披風沾著灰，靴子上還有泥，髮間甚至勾著一小截不知道哪裡沾來的枯草。
      　　
      　　古·拉哈·提亞原本還想問他有沒有受傷，話到了嘴邊，卻變成了另一句。
      　　
      　　「怎麼突然回來了？」
      　　
      　　光看著他，笑得十分坦誠。
      　　
      　　「想你了，回來看看你。」
      　　
      　　短短一句話，直白得讓古·拉哈·提亞連耳朵都不知道該往哪裡擺。
      　　
      　　他垂下眼，努力壓住唇角。
      　　
      　　「……至少先提前告訴我，我可以去港口接你。」
      　　
      　　「那就不驚喜了。」
      　　
      　　光推開窗走了進來，古·拉哈·提亞這才嗅見他身上的味道，除了風與草木，還混著一點洞穴與煤灰的濕潤氣息。
      　　
      　　「這回是去哪裡？」
      　　
      　　「處理一群地精的問題。」
      　　
      　　光卸下身上的斗篷，有些無奈地搔搔後腦。
      　　
      　　「本來想好好談，結果還是打起來了。」
      　　
      　　古·拉哈·提亞忍不住笑出聲。
      　　
      　　「沒辦法，他們太固執了。」
      　　
      　　光走了過來，伸手抱住他的腰，很自然地整個人靠了過來。
      　　
      　　古·拉哈·提亞下意識環住他。
      　　
      　　「如果你在場，一定能處理得比我好。」光把臉埋到他頸側，「與其叫我溝通這些東西，不如讓我上去打一架。」
      　　
      　　熟悉的重量落進懷裡，古·拉哈·提亞胸口那股盤旋了好幾天、自己努力忽視的空落感，終於慢慢被填滿。
      　　
      　　他忍不住踮起腳，蹭了蹭光的肩窩。
      　　
      　　「累了嗎？」
      　　
      　　「有點。」
      　　
      　　「那要不要先──」
      　　
      　　話還沒說完，古·拉哈·提亞忽然一僵。
      　　
      　　光原本環在他腰間的手，不知道什麼時候已經慢悠悠地滑了下去，指尖勾住他的衣服下擺，不輕不重地扯了一下。
      　　
      　　古·拉哈·提亞的尾巴瞬間豎了起來。
      　　
      　　他望著光十足無辜卻帶著笑意的眼睛，扁了扁耳朵。
      　　
      　　「光。」
      　　
      　　「嗯？」
      　　
      　　那語氣，分明知道自己在做些什麼。
      　　
      　　沒等他回應，那隻手又往腰間探了一點，古·拉哈·提亞立刻抓住他的手腕，給了最低的底線。
      　　
      　　「等等，我今天忙了一整天，還沒有洗澡。」
      　　
      　　光眨眨眼，一臉無所謂。
      　　
      　　「我可是從地精洞窟回來。」他笑著說：「你都不嫌棄我，我有什麼好在乎的？」
      　　
      　　古·拉哈·提亞張了張嘴，一時語塞。光盯著他看了一會兒，忽然露出挑釁的笑容。
      　　
      　　「還是說……」他故意拖長聲音，手指在後腰的凹處緩緩摩挲，語氣曖昧又毫不講理。
      　　
      　　「賢人大人太久沒做，已經不行了？」
      　　
      　　古·拉哈·提亞原本還發熱的耳朵輕輕動了一下。
      　　
      　　他的眼神慢慢沉了下來，一對紅光緊揪著那抹笑容。
      　　
      　　「……光。」
      　　
      　　「嗯？」
      　　
      　　「這種話，不能隨便亂說。」
      　　
      　　下一秒，光只覺得腰間一緊，位置瞬間倒了過來。
      　　
      　　古·拉哈·提亞將人推到床邊，隨後單膝跪上了床墊，整個人沉沉地覆了下來。
      　　
      　　垂落的紅髮擦過光的臉頰，織成一道不透光的陰影，身後的尾巴勾住光的腳踝，在褲管與皮靴間露出的皮膚微微刮弄。
      　　
      　　「我可是會當真的。」
      　　
      　　光陷在被褥裡，仰躺在床上看他，眼神沒有半點退縮，反而伸手拉住古·拉哈·提亞胸前墜飾垂下的皮繩，把他又往下扯近了一點。
      　　
      　　「那正好，等你證明給我看。」
      　　
      　　古·拉哈·提亞望著他，喉結輕輕滾動了一下，隨即低低笑了一聲。
      　　
      　　他沒再給光任何說話的機會，目光落在帶著笑意的唇上，直接吻了上去。
      　　
      　　平日裡的壓抑與克制，早已隨著分離的日子一點點消磨殆盡，舌尖毫無阻攔地竄入齒間，將不帶倒刺的軟舌勾了出來，濕潤的水聲響起時，手也順著光的側腰一路向上，將粗糙的布料完全推了上去。
      　　
      　　常年冒險在胸腹留下的線條被手指一道道撫過，光不自覺地弓起腰，雙腿也順著古·拉哈·提亞的動作分開，任由對方的膝蓋抵進自己的雙腿之間，擠壓著那發脹的部位。
      　　
      　　「拉哈……」
      　　
      　　短暫分開的唇瓣拉扯出一道銀絲，光的胸膛劇烈起伏著，眼底泛起一層被情慾蒸騰的水氣。
      　　
      　　「這樣……有達到英雄的標準嗎？」
      　　
      　　古·拉哈·提亞輕緩了口氣，光卻只是微微一笑，裝模作樣地思索了片刻，隨即毫無預警地撐起上身，一口叼住了他滾動的喉結。
      　　
      　　「這個嘛……」光輕喘著，帶著笑意的嗓音沙啞得厲害，「還不好說。」
      　　
      　　他用力吮吻，在喉結凹陷處留下一道顯眼的暗紅印記，手順勢扣住對方的肩膀，將人拉得更低，逼得彼此緊繃的下身隔著殘存的布料緊密相貼，磨人心神地緩緩廝磨。
      　　
      　　窗外的風正巧吹進來，掀動桌上散亂的紙頁。
      　　
      　　至於那一夜原本預定要整理完的古籍……自然又得拖延了。
      　　
      　　
      　　*
      　　
      　　
      　　翌日清晨，可露兒抱著資料走過長廊時，正好撞見古·拉哈·提亞從房間裡出來。
      　　
      　　「早安，可露兒。」
      　　
      　　可露兒停下腳步，困惑地望著眼前顯然精神非常好的貓魅，昨日還垂著的耳朵今天精神奕奕地豎著，尾巴也輕快地搖晃。
      　　
      　　可露兒眨眨眼，視線越過他的肩膀，望著房間裡的敞開的窗戶，隨後露出了然的笑容。
      　　
      　　「看來昨晚有人來過了？」
      　　
      　　「那、那個……」
      　　
      　　不等臉瞬間紅一半的人解釋，可露兒已經抱著文件轉身離開。
      　　
      　　「英雄不足症痊癒得很快嘛。」
      　　
      　　「不是你說的這樣！」
      　　
      　　清晨安靜的長廊裡，她輕快的笑聲一路傳遠，只留下古·拉哈·提亞站在原地，把臉埋在胸前抱著的書中。
      　　
      　　而房間裡，似乎有人翻了個身，慵懶地打了個哈欠，隨後懶洋洋地把古·拉哈·提亞的枕頭抱進了懷裡。
