title: 兩個靈魂
cp:
  - 拉哈光
updated: 2026-10-05
summary: 最好5版完成再點開
series: 短篇
chapters:
  - body: |-
      　　那是發生在他們剛從第一世界回到原初世界不久後的事。
      　　
      　　跨越百年的漫長等待，不以真面目示人的壓抑時光，在靈魂真正回歸原初世界的身體後徹底解放。他們不再需要克制地保持「暗之戰士」與「水晶公」的距離，從不曉得誰先將那抹溫度按進懷裡開始，便一發不可收拾。
      　　
      　　身下的床單早已被蹭得凌亂不堪，古·拉哈·提亞跨坐在光的腿上，伏低了身子、毫無保留地落下細密又急促的吻，彷彿怎麼親暱都不夠似地，像是要把那空白的一百年全數索討回來。
      　　
      　　他柔軟的紅髮垂在臉側，隨著往下的動作拂過光裸的皮膚，節節攀升的體溫與唇齒間的喘息一同失去控制，化作滿滿甜膩又濕濡的氣息。
      　　
      　　「英雄……」
      　　
      　　古·拉哈·提亞一路從唇瓣舔吻到下頜，舌尖細細地熨過與心跳一起震動的側頸。他知道，那是時常遊走於生死邊緣的冒險者最為敏感的地方，每每撫過那處，身下人都會被刺激地微微顫動。
      　　
      　　光渾身燙得像是一塊融化在青年懷裡的奶油，他的呼吸早就失去節奏，手掌滑過古·拉哈·提亞的後腰，正急切地扯著他的衣服，催促地使力著──
      　　
      　　就在這時，一個毫無預兆的念頭像雷光般突兀地閃過光的腦海。
      　　
      　　他突然想起，之前偶爾還會聽見阿爾博特的聲音。
      　　
      　　那傢伙，靈魂給了自己後，意識去了哪裡？
      　　
      　　該不會根本還沒消失吧？
      　　
      　　這個念頭彷彿一盆澆上身的冷水，光渾身的熱度瞬間退了個精光。他的手僵硬地停在古·拉哈·提亞的後背，心底抱著一萬分之一「拜託只是我想太多」的僥倖，深深吸口氣、在意識深處微弱地呼喚著。
      　　
      　　『……阿爾博特？』
      　　
      　　一陣沉默過後，意識深處極其清晰、無比真實地傳來了一聲尷尬至極的乾咳。
      　　
      　　光的腦袋「轟」地徹底炸了開來，要不是那名貓魅還在身旁，他真的會抓狂地在床上原地打滾、大聲喊叫，發洩那一路從胸口羞上臉頰的害臊。
      　　
      　　『等等等等等一下！！你為什麼真的在啊？！！』他崩潰地大喊：『之前夜襲跟偷看我睡覺也就算了，現在連我跟拉哈這、這些事情，你也要看嗎！！』
      　　
      　　意識深處的尷尬透過共享的五感傳了過來，第一世界的光之戰士顯然正在思考該怎麼回答，好保有暗之戰士最後一點薄弱的尊嚴。
      　　
      　　良久，他才聲音平板地出聲安慰。
      　　
      　　『那個……兄弟，你先冷靜點。』他又咳了一聲，彷彿就連說出這種話都十分尷尬，『我發誓，平時只要你們兩個氣氛不對……我基本上都會很自覺地迴避的。』
      　　
      　　光崩潰地咬牙切齒。
      　　
      　　『那、不就代表、你什麼都看見了嗎？』
      　　
      　　『……我也沒辦法。』
      　　
      　　『……』
      　　
      　　光整個人羞憤地無地自容，但他可悲地發現自己根本無處可躲，畢竟那可是融合在自己身上的靈魂，他能躲到哪去！
      　　
      　　「英雄？怎麼了……？你怎麼抖得這麼厲害？」
      　　
      　　古·拉哈·提亞正親得迷迷糊糊，忽然察覺到身下的人僵硬得如同石雕，連臉色都慘白如紙。他連忙撐起身子，情動而幽暗的紅色雙眸裡還泛著誘惑的水汽，發熱的掌心朝光伸了過來，試圖想捧住他的臉頰。
      　　
      　　「先、先等一下！先不要！」
      　　
      　　還在混亂狀態的光反射性地朝身後一彈，後背砰地撞在床頭板上，他慌亂地抓起身旁的被子，用力拉到脖頸處，欲蓋彌彰地露出兩隻眼睛。
      　　
      　　古·拉哈·提亞懸在半空中的手猛然頓住，他的表情愕然，彷彿從未想過光居然會從自己身邊逃走。
      　　
      　　屋子裡的空氣在一瞬間凝固了。
      　　
      　　在光滿臉通紅、語無倫次、恨不得咬舌自盡，卻又結結巴巴地解釋身體裡兩個靈魂的事情後，古·拉哈·提亞雖然極力表現出完全理解的體貼，但原本的氣氛已經徹底煙消雲散。
      　　
      　　更糟糕的是，在古·拉哈·提亞試圖重新拉近距離時，光卻開始築起防禦。
      　　
      　　當貓魅靠近一點，光的藍眼就會瞬間在房內游移，彷彿在尋找什麼不存在的身影，整個人防備得像隻受驚的野獸。
      　　
      　　古·拉哈·提亞眼底的光彩漸漸暗了下去，伸出的手也不敢再向前，只能安安靜靜地退到了床的最邊緣坐下。
      　　
      　　一向精神抖擻的紅色耳朵徹底垂了下來，長長的尾巴也低落地垂掛在床沿。他垂著頭，視線盯著自己的膝蓋，修長的手指只是無意識地、一遍又一遍撫平被單上的細小褶皺，整個人縮成小小的團塊，周圍散發出一圈灰暗的陰影。
      　　
      　　光遠遠看著那一幕，心臟像是被什麼東西狠狠揪住。
      　　
      　　明明是期待了百年的時光，他感到很抱歉，卻也深知自己只要被古·拉哈·提亞抱在懷裡，那失控又被情慾推上頂端的反應，連他自己都無法直視。
      　　
      　　但那雙低垂著的耳朵，平常只要自己喊他名字就會高興地豎立，尾巴也會黏糊糊地纏上來……明明不久之前，這個人還毫無保留地賴在自己身上……
      　　
      　　就在光自責得快要喘不過氣時，靈魂深處又傳來了一聲幽幽的嘆息。
      　　
      　　『……你該去抱抱他。』
      　　
      　　光渾身一震，險些被呼氣嗆到，『……你果然一直在看！！！』
      　　
      　　阿爾博特也是無奈至極，靈魂的聲音裡透著濃濃的冤枉。
      　　
      　　『……我本來可以好好沉睡的，只要你不要隨便呼喚我，或者在那邊大吼大叫，造成過大的心緒波動，就不會驚動我。』
      　　
      　　阿爾博特的聲音隨之低了下去，留下最後一句認真的保證：『聽好了，不用一直神經兮兮地確認我在不在。只要你不主動叫我，或者沒有遇到什麼生死攸關的危險，我就絕對不會來打擾。』
      　　
      　　說完，他彷彿關上了內心深處不存在的門，意識徹底回歸平靜，所有殘存的氣息都在這一刻退得乾乾淨淨。
      　　
      　　光在原地愣了幾秒，隨即狠狠抹了一把臉。
      　　
      　　去他的尷尬，去他的靈魂視角。
      　　
      　　現在眼前這隻快要委屈得融化成一灘水的貓才是最重要的。
      　　
      　　光放輕動作，慢慢挪到了床沿邊，他伸出手，小心翼翼地握住了古·拉哈·提亞那隻停在床單上的手。
      　　
      　　貓魅緩緩抬起頭，但沒有像往常那樣立刻黏上來，只是抿著唇，紅眼裡寫著猶豫與小心，嗓音沙啞又輕柔。
      　　
      　　「……沒關係嗎？」
      　　
      　　聽著這聲小心翼翼的確認，光的內心瞬間刺得發疼，他連忙伸長手臂，用力將古·拉哈·提亞拉進了懷裡，也顧不得貓魅到底還能不能呼吸，只顧著收緊自己的雙臂。
      　　
      　　「對不起……」光把臉深深埋進他的頸窩，聲音又悶又模糊不清，「我真的是腦袋一片混亂，快要羞死了……但我沒有不想讓你碰我，真的沒有。」
      　　
      　　古·拉哈·提亞輕嘆了口氣，好在還是回摟住了光。
      　　
      　　貓魅的尾巴悄悄地在床單上拍了兩下，悶聲悶氣地吐出兩個字：「……笨蛋。」
      　　
      　　說完，他又忍不住低低笑出了聲，帶著些許鼻音和成熟的坦然。
      　　
      　　「我能理解。如果你還是覺得怪怪的……就只是抱著你，我也很開心了。」
      　　
      　　「那怎麼行！」
      　　
      　　光慌忙地湊上前，急匆匆地覆上了那雙柔軟的唇瓣，啄吻了一口。
      　　
      　　他不由分說地攬住古·拉哈·提亞的脖頸，已然顧不得對方會怎麼看他這樣反反覆覆的模樣，藍眼只是執拗地凝視著自己戀慕的人，羞澀又堅定地央求。
      　　
      　　「剛剛的……繼續？」
      　　
      　　古·拉哈·提亞輕輕用鼻尖蹭了蹭光，確認對方的眼神依然堅持，這才放心地摸了摸他的頭，手掌扣住後腦、再度壓了下來。
      　　
      　　
      　　*
      　　
      　　
      　　古·拉哈·提亞輕手輕腳地替熟睡的光蓋好被角，隨後悄悄走到露台邊吹風。夜風拂過還在發燙的臉頰，想起剛才不可思議的一切，他忍不住低笑出聲。
      　　
      　　「真是的……沒想到英雄居然會那麼在意阿爾博特的事。」
      　　
      　　他倚著欄杆，眼底泛起一抹深思，輕聲自語：「不過，要不是我們也一樣，大概也很難理解他說的話吧……」
      　　
      　　話音剛落，腦海深處冷不防蹦出帶著濃濃不甘心的青年嗓音。
      　　
      　　『就算是這樣，你怎麼能就這麼磨磨蹭蹭地退縮了？』
      　　
      　　水晶公揉了揉太陽穴，無奈地在心底嘆了口氣。
      　　
      　　「……那是因為英雄突然意識到了靈魂的事。這種時候，當然要以他的心情為優先，怎麼能勉強他？」
      　　
      　　『才沒有勉強！』年輕氣盛的古·拉哈·提亞顯然很不滿意這個解讀，語氣激烈地反駁，『光明明就很喜歡我們抱他，剛才他主動來道歉的時候，你心跳快得連我都快被震聾了，那時候就該直接撲上去，還問什麼問！』
      　　
      　　「你那是莽撞。」水晶公成熟的聲音帶著幾分好笑與無可奈何，「英雄本來就害羞，要是像你那樣不管不顧地撲上去，他真的會從我們身邊逃走，去雪國吹冷風。」
      　　
      　　『我看你也沒多從容。』年輕的意識毫不客氣地戳穿他，『剛才被光推開的時候，是誰縮在床邊快要委屈得心都碎了？』
      　　
      　　「……咳，那只是給彼此留一點冷靜的空間。」
      　　
      　　『藉口，明明最不想留下任何空間的人就是你。』
      　　
      　　「是、是，我承認……這一點我們不是一直都很有共識嗎？」
      　　
      　　水晶公低低笑了笑，目光穿過敞開的房門，溫柔地落在那張熟睡的側臉上，原本激烈抗議的意識也慢慢安靜了下來，同他一起隔著夜色凝視著放在心上的人。
      　　
      　　半晌，年輕的聲音才彆扭又極其小聲地嘟囔了一句：『……算了，反正明天早上，一定要由我先向他說早安。』
      　　
      　　「這可不行。」成熟的貓魅彎起緋紅的眼眸，在心底輕聲宣告，「明早的早安吻，我可沒打算讓給你。」
      　　
      　　『那親完就換我！』
      　　
      　　「我考慮。」
