      　　舊薩雷安的圖書庫一如既往地安靜，古·拉哈·提亞縮在一個偏僻陰暗的角落，盤腿而坐、半張臉埋在圍巾裡，手指機械性地翻動著書頁，卻連一行字都沒讀進去。
      　　
      　　他還在生那個人的氣。
      　　
      　　明明約好了要一起去釣魚，結果半路上遇到熟識的工匠，轉頭就答應幫人驅逐礦坑內的魔物，甚至還一臉天然呆地笑著問他要不要一起去挖泥巴，以至於錯過了貓魅期待已久的大海釣船班。
      　　
      　　這根本不是採礦或玩泥巴的問題，而是承諾的問題！氣不過的紅髮貓魅當天晚上就收拾行李，一聲不吭地搭上了前往舊薩雷安的船，打算用無止盡的古代亞拉戈文獻把自己徹底淹沒。
      　　
      　　難道只有自己在乎跟光的約定嗎？
      　　
      　　貓魅的臉又往圍巾裡陷了幾吋。
      　　
      　　「笨蛋……大笨蛋……只知道戰鬥的肌肉男……黑衣森林大神木……」他小聲嘟囔，耳尖也低落地下垂。
      　　
      　　就在這時，圖書庫厚重的雕花石門被人用力地推開，伴隨著一聲沉重巨響，圖書館內的學者們紛紛抬起頭，古·拉哈·提亞也被嚇得耳朵猛地一豎。
      　　
      　　只見門口逆著光，站著一黑壓壓群人，每個人身上都散發著討伐蠻神的氣勢。
      　　
      　　古·拉哈·提亞驚訝地發現，那是除了光以外，拂曉血盟的全體成員。
      　　
      　　下一秒，所有人的視線在寬闊的書庫中搜尋，然後很快地鎖定在縮在角落的自己身上。
      　　
      　　兩方在沉默中對視著，一方眼神堅毅，另一方卻只有困惑。
      　　
      　　僵持中，桑克瑞德率先上前一步，神情嚴肅地抬起手，食指筆直地指向坐在地上的貓魅，用下達討伐令般的威嚴嗓音低喝道：「抓住他！！！」
      　　
      　　伴隨著他的指令，拂曉眾人居然紛紛拔出了武器──除了驚慌失措的阿爾菲諾以外。
      　　
      　　「等、等等！在圖書館裡動武太危險了，這邊還有其他研究員，大家冷靜一點──」
      　　
      　　只可惜，似乎沒人採納他的意見。
      　　
      　　雅·修朵拉站在尤里安傑身後，放在他肩上的手微微施了點力，精靈只得無奈地舉起星盤，低聲詠唱起護盾的咒語。
      　　
      　　瞬間，水波般的白色光輝裹住廣闊的大廳，然而，這道防護並非阻擋外在的破壞，而是為了承接來自內部的衝擊。
      　　
      　　「等等，怎麼回事？為什麼大家都來了？」
      　　
      　　古·拉哈·提亞尾巴繃得筆直，眾人身上散發出的氣勢讓他本能地感到危機，連忙反射性地喚出白劍與盾牌，側身架起防禦姿態。
      　　
      　　武器切換的光芒才剛閃過，桑克瑞德已經抽出了白金色的槍刃，踏步逼近眼前。刀刃鏘地一聲撞上盾牌，火花擦過臉頰、瞬間濺出一道細微的血痕。
      　　
      　　「桑克瑞德？到底怎麼了？」古·拉哈·提亞瞳孔豎了起來，一邊大聲地詢問，眼裡滿是止不住的困惑，槍刃的劈擊震得盾牌發出震動的共鳴，連手腕都隱隱發麻。
      　　
      　　桑克瑞德神情嚴肅地將槍刃壓得更低，眼中卻隱隱透著幾分難以言喻的愧疚。
      　　
      　　「原諒我們，拉哈。」
      　　
      　　「什麼原諒？倒是說明清楚一點──」
      　　
      　　不等貓魅把話問完，桑克瑞德腰腹發力，借著槍刃的側邊直接將盾牌撞開；失去重心的瞬間，古·拉哈·提亞後退的腳步交錯，在極短的時間內壓低了身體，借力使力地側過身，斜擋正好精準地格開了桑克瑞德隨之而來的側踢。
      　　
      　　桑克瑞德面露讚嘆地吹了聲口哨，但拂曉此次的圍攻似乎不太講道義。
      　　
      　　「拉哈！認命吧，跟我們回去！」
      　　
      　　叱喝與紅色的魔法光芒同時到達，阿莉塞的細劍以刁鑽的角度直刺而來。原本只打算用盾牌作戰的古·拉哈·提亞不得不舉起白劍，硬生生擋下來自兩方的攻擊。
      　　
      　　還未來得及喘息，頭頂上方忽然傳來一陣尖銳的風嘯──艾斯蒂尼安的長槍挾帶火光，正破空而來。
      　　
      　　這下就算是擁有超過百歲的閱歷、抵禦過光之氾濫的水晶都城主，都忍不住發出一聲崩潰的悲鳴。
      　　
      　　「你們、怎麼可以、全部一起上！！」
      　　
      　　「抱歉啦──」
      　　
      　　戰鬥刮起的風暴讓周圍的書冊四處飛揚。
      　　
      　　劍盾相撞、魔法亂竄、武器的風壓更把地上的書頁捲得漫天飛舞。貓魅一邊要擋下阿莉塞凌厲且迅速的追擊，一邊要躲避艾斯蒂尼安大範圍的揮槍，桑克瑞德居然還在一旁偷扔煙霧彈。
      　　
      　　纏鬥不過幾分鐘，伴隨著一聲慘叫，紅髮貓魅徹底被特製的拘束繩捆了個結結實實，像一顆紅色的大糰子一樣倒在地上。
      　　
      　　「這到底是為什麼！」古·拉哈·提亞在地上像毛毛蟲一樣奮力掙扎，氣得耳朵完全扁了下去，咬牙切齒地抗議：「居然連句解釋都沒有，這實在太過分了！」
      　　
      　　水波紋路逐漸逸散，一片狼籍的書庫恢復了平靜。
      　　
      　　在阿爾菲諾治癒的光芒中，拂曉眾人圍成一圈，居高臨下地看著他，接著異口同聲、面色沉痛地吐出了一句話：「我們都是為了英雄啊！」
      　　
      　　古·拉哈·提亞愣了愣，停止了無謂的掙扎。
      　　
      　　「他整個人都枯萎了。」阿莉塞雙手抱胸，語氣沉重，「眼神渙散、像個被放光了氣的氣球又乾又扁，戳他一下連『嗯』都不會回一聲，就只會盯著地板嘆氣。」
      　　
      　　「還不吃飯，我們只得架住他，硬往嘴裡塞點麵包。」
      　　
      　　「就連雅·修朵拉的威脅都沒用。」
      　　
      　　說出這句話的人在瞪視下縮了回去，但並不影響其他人繼續告狀。
      　　
      　　「我們已經把光反鎖在石之家的房間裡了，嚴格檢測他的生命跡象。」桑克瑞德推了推臉上並不存在的眼鏡，一臉莊嚴的神情，「塔塔露也沒收了他的錢包。身無分文的情況下，應該暫時跑不遠。」
      　　
      　　「他傷心過度了，應該也沒心思構想怎麼逃跑吧。」
      　　
      　　阿莉塞輕哼一聲，其他人紛紛沉痛地點頭、表示同意。
      　　
      　　「但我們也知道你的身手。」桑克瑞德親切地蹲下身，重重拍了拍古·拉哈·提亞的肩膀，「要是發現我們來找你，肯定會用些沒人搞得明白的魔法逃得更遠，只能出此下策了。」
      　　
      　　「就放心跟我們回去吧。」
      　　
      　　站在眾人後方的艾斯蒂尼安雙手抱胸，認真地垂頭注視著他，「我們會負責壓著那傢伙跟你道歉的。」
      　　
      　　古·拉哈·提亞沉默了很長一段時間。
      　　
      　　他很努力地思考，試圖理解這群拯救過無數次世界的英雄們，動機與行動的關聯性。
      　　
      　　「……但這也搞得太誇張了吧？！」他還是忍不住大聲抱怨，動了動被綁得死緊的肩膀，「鬧成這樣，要是哲學議會下令禁止我們全員入國該怎麼辦啊！」
      　　
      　　眾人面面相覷。
      　　
      　　艾斯蒂尼安抱著長槍撇過頭，阿莉塞別開臉假裝看風景，阿爾菲諾心虛地低下頭盯著自己的靴子，雅·修朵拉則優雅地撫平了衣角的褶皺。
      　　
      　　最後還是桑克瑞德無奈地嘆了口氣，將溫熱的掌心搭在古·拉哈·提亞的肩上。
      　　
      　　「沒辦法啊，拉哈，這都是為了拂曉。」桑克瑞德收起了剛才交手時的凌厲，眼神裡透出幾分真實的無奈與心疼，「我們不能沒有你，也不能沒有英雄。」
      　　
      　　「況且那傢伙……是真的很愧疚。」
      　　
      　　「……」
      　　
      　　「他知道自己粗心大意惹你難過了，但又害怕沒搞清楚緣由之前再傷害你。結果到了最後，連主動來這裡的勇氣都沒有。」
      　　
      　　「這兩天他連塔塔露做的飯都吃不下，整個人肉眼可見地瘦了一圈。」
      　　
      　　聽見最後這句話，古·拉哈·提亞頭頂那對原本豎得極低的貓耳，終於微微抖動了兩下。剛才滿腔的怒火與委屈，瞬間像是被水澆滅了一樣，只剩下一團軟綿綿的無奈與心疼。
      　　
      　　他的腦海裡不由自主地浮現出那個平日裡無所不能、面對任何強敵都無所畏懼的可靠背影，現在卻像隻被雨淋濕的大型犬一樣，縮在陰暗的小房間裡垂頭喪氣、面容頹然又憔悴。
      　　
      　　……那個笨蛋。
      　　
      　　明明只要好好說一句對不起就好了，為什麼要這樣折磨自己。
      　　
      　　這讓他還怎麼氣得下去。
      　　
      　　古·拉哈·提亞重重地嘆了一口氣，認命地垂下了頭，聲音悶悶地傳了出來。
      　　
      　　「我知道了……跟你們回去就是了。」
      　　
      　　他動了動被繩子勒得發酸的雙手，沒好氣地瞪了桑克瑞德一眼。
      　　
      　　「但至少可以先把我放開吧？」
      　　
      　　淺色的眼睛認真地凝視著還富含怒火灰燼的紅眼，仔細端詳了很長一段時間，似乎在評估古·拉哈·提亞逃跑的可能性。
      　　
      　　但最後，也不曉得他到底看出了什麼，乾脆俐落地從腰間翻出一把短刀，三兩下解開貓魅身上的束縛。
      　　
      　　「真的會乖乖和我們回去？」
      　　
      　　得到一個哀怨的眼神後，桑克瑞德滿意地笑了。
      　　
      　　「那好，一言為定。」
