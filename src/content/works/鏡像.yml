title: 鏡像
cp:
  - 拉哈光
  - 愛梅光
updated: 2026-10-13
summary: 5.0最終戰前延伸，但最好完成6.0再點進來
series: 短篇
chapters:
  - body: |-
      　　深海的亞馬烏羅提散發著虛幻的微光，筆直聳立的宏偉建築方方正正、如同一座座巨大交疊的墓碑。整座古老文明最後的殘骸彷彿沉睡般，浸染在一片死寂之中。
      　　
      　　那是一座不會迎來黎明的城市。
      　　
      　　縱使街道間仍有高大的幻影緩步而行、相互談論著學術與理想，這座由龐大乙太所編織而成的幻境，終究只是一場被強行留存於世的夢。
      　　
      　　殿堂冰冷且堅硬的地面上，水晶公正極力調節著紊亂的呼吸。
      　　
      　　水晶化的淡藍結晶遍佈槍傷蔓延出的血液，遠離水晶塔的他必須專心一致地調節體內的乙太，才不至於因失血過多而喪命於此。
      　　
      　　他單膝跪在地磚上，緊握成拳的指節泛白，卻仍固執地抬起頭，望向眼前那個踱步的身影。
      　　
      　　「還真頑強。」
      　　
      　　愛梅特賽爾克背著雙手，慢條斯理地停下腳步。
      　　
      　　「大名鼎鼎的水晶公，第一世界的救世主，反抗末日的偉大先知。」
      　　
      　　他譏諷地攤開雙手，像是在向空無一人的觀眾席展示一齣荒誕至極的滑稽劇。
      　　
      　　「費盡心思跨越時空，把自己折騰成這副半人半石頭的滑稽模樣，最後卻只能狼狽地跪在這裡……真是令人眼眶泛淚的奉獻精神。」
      　　
      　　水晶公沒有立刻開口。
      　　
      　　他咬住下唇，將湧至喉間的血腥味一點點嚥了回去。那副隱忍的平靜似乎令愛梅特賽爾克感到無趣，無影揉了揉太陽穴，發出一聲長長的、滿是厭煩的嘆息。
      　　
      　　「你特地將我帶到這裡，難道就只是為了說這些挖苦的話嗎？」
      　　
      　　水晶公終於出聲，嗓音乾澀卻帶著不可思議地平靜。他抬起頭，面容蒼白且狼狽，唯獨那雙明亮的赤紅眼眸，依舊沒有半點挫敗的神色。
      　　
      　　「若你只是想除去我這個阻礙，應該有更乾脆利落的手段才對。還是說……你其實有什麼話，或者什麼景象，非得讓我見證不可？」
      　　
      　　海底是一片短暫的死寂。
      　　
      　　愛梅特賽爾克像是聽見了天底下最荒唐的傳聞，突兀地嗤笑了一聲。
      　　
      　　「哈！倒是挺會給自己臉上貼金。」
      　　
      　　他緩步走到近前，居高臨下地睥睨著地上的人。
      　　
      　　「我只是由衷地對你們這群傢伙的自作多情感到不可思議。」
      　　
      　　眼神裡那抹偽裝出的漫不經心漸漸冷了下去，化為一種過度清醒的刻薄。
      　　
      　　「從一條早該迎來終局的毀滅之河逆流而上，耗費百年的光陰，召喚異界的英雄，甚至不惜把自己改造成這副非人的樣子……如此大費周章，到底是為了什麼？可別告訴我，你是真的高尚到只為了拯救這個世界。」
      　　
      　　水晶公的眼睫微不可察地顫動了一下。
      　　
      　　「怎麼，戳中了？」
      　　
      　　愛梅特賽爾克俯下身，金褐色的眼眸緊緊盯著他，聲音壓得很低，帶著某種近乎殘忍的洞悉。
      　　
      　　「我很好奇，你想拯救的，究竟是第一世界這群殘缺不堪、脆弱至極的廢物，還是那個早在另一條時間線……就已經死透了的英雄？」
      　　
      　　深海的空氣冰冷得如同冰窖，水晶公垂在地面的指尖悄然收緊。
      　　
      　　那份守了百年的私心，終究再也無法被兜帽遮掩。
      　　
      　　在那個被第八靈災撕裂的未來裡，古·拉哈·提亞所憧憬的人早已成為被世人傳唱的傳說。儘管在步入水晶塔、闔上沉重巨門的那一刻，他就做好了無法相見的覺悟，可英雄的殞落卻來得太快、太過猝不及防。
      　　
      　　明明是那麼堅韌又耀眼的靈魂，卻只能像是短暫的煙火般轉瞬即逝，殘留的餘暉卻依然滾燙地灼痛著雙眼。
      　　
      　　不該是這樣的、不應該只有這樣的。
      　　
      　　他想拯救光，將他從那絕望的悲劇裡拯救出來。
      　　　　
      　　所以他成了跨越時光而行的人。
      　　
      　　水晶公可以捨棄名字、捨棄與英雄並肩的未來，哪怕靈魂承受所有光屬性的侵蝕，在時空的裂縫中自生自滅，古·拉哈·提亞也想讓那個耀眼的靈魂重新活一次。
      　　
      　　而或許，如果他猜得沒錯，現在站在水晶公面前、強大又孤寂的無影，會是在這個被白光籠罩的世界，唯一能理解他的人。
      　　
      　　「……就算是私心又如何。」
      　　
      　　古·拉哈·提亞抬起頭，直直撞進愛梅特賽爾克的眼底，嘴角勾起一抹極淡、卻毫無動搖的弧度。
      　　
      　　「我想再見到他，想再聽見他的聲音，想看著他自由地馳騁於廣闊的大地上。」
      　　
      　　愛梅特賽爾克沒有接話，只是冷冷地看著他。
      　　
      　　「但愛梅特賽爾克，這份自私，不代表我想守護這個世界的願望是假的。」水晶公深吸了一口氣，胸膛的水晶發出細微的碎裂聲，「我知道失去的滋味有多難受，所以我不會讓第一世界的人們也深陷絕望之中。」
      　　
      　　愛梅特賽爾克靜靜地聽著，唇角慢慢浮現出一絲極度疲倦的冷笑。
      　　
      　　「……聽聽，多麼感人的說詞啊。」
      　　
      　　他轉過身，踱步於殿堂邊緣，目光穿透虛幻的屏障，落在那座永恆不滅的宏偉都市上。
      　　
      　　「失去的滋味？深陷絕望？」
      　　
      　　他的聲調並未拔高，卻帶著令人窒息的壓迫感。
      　　
      　　「看看這座城市吧。建築、學術、創造魔法、對星球規律的洞悉……這才是真正的人類，這才是原本該有的模樣！」
      　　
      　　愛梅特賽爾克回過頭，那雙金褐色的眼睛裡翻湧著無盡歲月沉澱出的陰霾與瘋狂。
      　　
      　　「而你們呢？沒用的廢物們，連自己究竟失去了什麼都不知道，在殘破的世界苟延殘喘，將所有的苦難與責任，理所當然地推到某位英雄身上。」
      　　
      　　他猛地一拂衣袖，走到水晶公面前，語調變得尖銳而快，每一個字都像是一把刀般鋒利。
      　　
      　　「至於你，自以為是在拯救他的人。是你剝奪了他選擇的權利，代替他決定了一切，然後又自作主張地打算消失。」
      　　
      　　愛梅特賽爾克冷眼看著他，忽然低低地笑了起來。
      　　
      　　「你可是比我還要殘忍啊，水晶公。」
      　　
      　　他背起雙手，漫不經心地抬頭望向穹頂外的深海。
      　　
      　　「費了這麼大的力氣，說到底，你也只不過是一個無法接受失去的可憐蟲罷了。多麼奇妙啊……明明做著與我毫無二致的事，卻偏偏要擺出一副救世主的姿態站在我的對立面。」
      　　
      　　大殿內一片死寂。
      　　
      　　幻影構成的市民在窗外安詳地走過，沒有悲傷，沒有恐懼，也沒有任何會走向未來的痕跡。
      　　
      　　水晶公凝視著那些虛妄的身影，腦海中卻不受控制地浮現出水晶都。
      　　
      　　想起那些在光之氾濫的威脅下依然頑強開墾的農夫、在廣場上奔跑歡笑的孩子，以及……那個總是帶著滿身傷痕與塵土、卻依然在水晶塔邊，對著大家露出爽朗笑容的人。
      　　
      　　「……別無二致嗎。」
      　　
      　　古·拉哈·提亞緩緩抬起眼，目光逐漸退去了動搖，取而代之的是一種淬鍊過的、極其純粹的澄澈。
      　　
      　　也許他說得對。
      　　
      　　他們兩人，的確都守望者同一抹顏色的靈魂，但──
      　　
      　　「至少現在的我，可以很肯定地說，就算燃盡我自己、窮盡一切代價，我也想拯救那個人。」
      　　
      　　紅髮青年的眼底泛起了一抹極其溫柔的光暈。
      　　
      　　「我確實自私地想讓他活下去。但那並不是因為他是什麼世界的英雄……而是因為，他是一個僅僅聽見哭聲，就無法對此視而不見的人。」
      　　
      　　古·拉哈·提亞直直迎上居高臨下的燦金目光，一字一頓地喚出對方的名字：「至少我比你坦承許多，愛梅特賽爾克。」
      　　
      　　紅眼直視著那雙燦金的眼眸，通透得彷彿洞悉一切。
      　　
      　　「無論你透過他，遙望著過去的誰，又或者將他當作什麼人的替身，我都絕不允許你將英雄的存在，當作祭奠過去的祭品。」
      　　
      　　愛梅特賽爾克臉上的譏諷在這一刻徹底凝固了。
      　　
      　　金褐色的眼眸深處，有什麼極其隱晦、跨越了千萬年時光的殘影，無聲地動搖了一下。
      　　
      　　……無論他的靈魂曾經是誰？
      　　
      　　真是個無知又放肆的廢物。
      　　
      　　他根本不知道那個靈魂在最璀璨的時代是何等耀眼，不知道那個在十四人委員會裡任性妄為、總愛在星球各處亂跑的人活得多麼地自由，更不知道看著那樣純粹的靈魂四分五裂、退化成如今這副渺小脆弱的模樣，對一個孤獨的守望者而言究竟是何等巨大的折磨。
      　　
      　　可是……
      　　
      　　愛梅特賽爾克眼底的波瀾轉瞬即逝，化為深不見底的陰影。
      　　
      　　就算轉生過無數次、就算失去了所有記憶，那個靈魂卻依然固執地做著如出一轍的蠢事──為了那些微不足道的生命四處奔波，把自己逼進死路。
      　　
      　　真是……令人作嘔的熟悉。
      　　
      　　「……真是夠了。」
      　　
      　　愛梅特賽爾克揉了揉眉心，語氣重新變回了那副輕蔑而倦怠的模樣。
      　　
      　　「自說自話的本事倒是一流。但很遺憾，這個世界只看結果……你那偉大的自我犧牲失敗了。那個英雄體內過剩的光之力正在崩潰，他隨時都會變成吞噬這個世界的怪物。」
      　　
      　　他冷眼睥睨著水晶公猛然收縮的瞳孔，殘忍地勾起嘴角。
      　　
      　　「你以為這是一條拯救他的道路，結果卻只是將他逼上了絕境。你甚至連自己都救不了，只能像塊廢石一樣崩裂在這裡。」
      　　
      　　就在此時，整座亞馬烏羅提發出一陣低沉綿長的共鳴。
      　　
      　　愛梅特賽爾克停下了話語，微微偏過頭望向穹頂，隨後撫平了長袍上的褶皺。
      　　
      　　「看來他到了。」
      　　
      　　他轉身撕開漆黑的虛空裂隙，背對著水晶公，語調恢復了事不關己的平淡。
      　　
      　　「就讓我看看吧。看看你費盡心機、自私自利保全下來的那個英雄，究竟能不能承載這份重量。如果他終究會被體內的光同化成怪物……」
      　　
      　　愛梅特賽爾克微微頓了頓，留下一記不帶任何溫度的側臉。
      　　
      　　「我會親手給他一個解脫。至少，我不會讓那個靈魂以如此醜陋的姿態迎來結束。」
      　　
      　　衣袍一揚，他的身影徹底沒入混沌的裂隙之中。
      　　
      　　殿堂再度重歸令人窒息的死寂。
      　　
      　　「……咳……！」
      　　
      　　水晶公再也支撐不住，一口鮮血猛地咳在石磚上。
      　　
      　　魔力枯竭的暈眩感排山倒海而來，他的指節甚至已經僵硬得無法合攏。
      　　
      　　可是他不能倒下、不能現在就倒下。
      　　
      　　因為就在不遠的地方，那個人正拖著隨時會碎裂的靈魂，為了帶他回去，一步一步走進這座虛幻的城市。
      　　
      　　「……我不能……」
      　　
      　　古·拉哈·提亞咬緊了牙關，碎裂的手指深深鑿進石磚的縫隙裡。鮮血混雜著藍色的碎晶，在地磚上拖曳出一道刺目的痕跡。
      　　
      　　「我怎麼能……死在這裡……看著你一個人……」
      　　
      　　他不能再替那溫柔的英雄擅自決定命運，但他也絕不能成為光不得不背負的又一道回憶。
      　　
      　　畢竟，他還沒親口告訴他，自己差點親手埋葬的願望。
      　　
      　　『我想要，和你一起踏上旅途──』
      　　
      　　滿身傷痕的紅髮青年在死寂的深淵中用盡最後的力氣，硬生生撐起殘破的身軀。
      　　
      　　他扶著冰冷的石壁，拖著沉重麻木的雙腿，頑強而執拗地朝著決戰之地前去。
